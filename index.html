thay đổi phương pháp học của mình."},{"h":"与","p":"yǔ","v":"Với, và","ez":"这件事与我没有关系。","ey":"Zhè jiàn shì yǔ wǒ méiyǒu guānxi.","ev":"Chuyện này không liên quan gì đến tôi."},{"h":"准时","p":"zhǔnshí","v":"Đúng giờ","ez":"他上班从来都很准时。","ey":"Tā shàngbān cónglái dōu hěn zhǔnshí.","ev":"Anh ấy đi làm xưa nay luôn đúng giờ."},{"h":"判断","p":"pànduàn","v":"Nhận xét, đánh giá","ez":"这件事很难判断谁对谁错。","ey":"Zhè jiàn shì hěn nán pànduàn shéi duì shéi cuò.","ev":"Chuyện này rất khó phán đoán ai đúng ai sai."},{"h":"感觉","p":"gǎnjué","v":"Cảm giác, cảm nghĩ","ez":"我感觉今天比昨天冷。","ey":"Wǒ gǎnjué jīntiān bǐ zuótiān lěng.","ev":"Tôi cảm thấy hôm nay lạnh hơn hôm qua."}]],"texts":[{"no":1,"tz":"小夏和小雨聊小雨面试的情况","tv":"Tiểu Hạ và Tiểu Vũ nói chuyện về buổi phỏng vấn của Tiểu Vũ","lines":[{"s":"小夏","z":"你上午的面试怎么样？","p":"Nǐ shàngwǔ de miànshì zěnmeyàng?","v":"Buổi phỏng vấn sáng nay của cậu thế nào?"},{"s":"小雨","z":"还可以，他们问的问题都挺容易的，就是我有点儿紧张。","p":"Hái kěyǐ, tāmen wèn de wèntí dōu tǐng róngyì de, jiù shì wǒ yǒudiǎnr jǐnzhāng.","v":"Cũng được, câu hỏi họ đưa ra khá dễ, chỉ là mình hơi hồi hộp."},{"s":"小夏","z":"面试的时候，一定要对自己有信心，要相信自己的能力。","p":"Miànshì de shíhou, yídìng yào duì zìjǐ yǒu xìnxīn, yào xiāngxìn zìjǐ de nénglì.","v":"Lúc phỏng vấn, nhất định phải tự tin vào bản thân, phải tin vào năng lực của mình."},{"s":"小雨","z":"你说得对！3月15号上午8点在学校体育馆还有一个招聘会，你去吗？","p":"Nǐ shuō de duì! Sānyuè shíwǔ hào shàngwǔ bā diǎn zài xuéxiào tǐyùguǎn hái yǒu yí ge zhāopìnhuì, nǐ qù ma?","v":"Cậu nói đúng! 8 giờ sáng ngày 15 tháng 3 ở nhà thi đấu của trường còn một hội chợ tuyển dụng nữa, cậu đi không?"},{"s":"小夏","z":"我还没决定呢。","p":"Wǒ hái méi juédìng ne.","v":"Mình vẫn chưa quyết định."},{"s":"小雨","z":"听说这次招聘会提供的工作机会很多，我们一起去看看吧。","p":"Tīngshuō zhè cì zhāopìnhuì tígōng de gōngzuò jīhuì hěn duō, wǒmen yìqǐ qù kànkan ba.","v":"Nghe nói hội chợ lần này cung cấp rất nhiều cơ hội việc làm, mình cùng đi xem thử đi."}]},{"no":2,"tz":"马经理和小林聊招聘的事情","tv":"Giám đốc Mã và Tiểu Lâm nói chuyện về việc tuyển dụng","lines":[{"s":"马经理","z":"小林，这次招聘不是小李负责吗？","p":"Mǎ jīnglǐ: Xiǎo Lín, zhè cì zhāopìn bú shì Xiǎo Lǐ fùzé ma?","v":"Tiểu Lâm này, đợt tuyển dụng lần này không phải Tiểu Lý phụ trách sao?"},{"s":"小林","z":"本来是小李负责的，但是他突然生病住院了，所以就交给我来做了。","p":"Běnlái shì Xiǎo Lǐ fùzé de, dànshì tā tūrán shēngbìng zhùyuàn le, suǒyǐ jiù jiāogěi wǒ lái zuò le.","v":"Lúc đầu là Tiểu Lý phụ trách, nhưng cậu ấy đột nhiên ốm phải nằm viện, nên giao lại cho em làm."},{"s":"马经理","z":"哦，这次应聘的人多吗？","p":"Ò, zhè cì yìngpìn de rén duō ma?","v":"Ồ, đợt này người xin việc có đông không?"},{"s":"小林","z":"经理，这次来应聘的一共有15人。经过笔试和面试，有两个不错。这是他们的材料，您看看。","p":"Jīnglǐ, zhè cì lái yìngpìn de yígòng yǒu shíwǔ rén. Jīngguò bǐshì hé miànshì, yǒu liǎng ge búcuò. Zhè shì tāmen de cáiliào, nín kànkan.","v":"Thưa giám đốc, đợt này có tất cả 15 người tới xin việc. Qua bài thi viết và phỏng vấn, có hai người khá tốt. Đây là hồ sơ của họ, anh xem thử."},{"s":"马经理","z":"这两个人的能力都比较符合我们的要求。你通知他们下周一上午九点来我办公室吧。","p":"Zhè liǎng ge rén de nénglì dōu bǐjiào fúhé wǒmen de yāoqiú. Nǐ tōngzhī tāmen xià zhōuyī shàngwǔ jiǔ diǎn lái wǒ bàngōngshì ba.","v":"Năng lực của hai người này khá phù hợp với yêu cầu của chúng ta. Em báo cho họ 9 giờ sáng thứ hai tuần sau tới văn phòng anh nhé."},{"s":"小林","z":"好的，那我马上跟他们联系。","p":"Hǎo de, nà wǒ mǎshàng gēn tāmen liánxì.","v":"Vâng, vậy em liên hệ với họ ngay."}]},{"no":3,"tz":"小林和王静聊王静的工作情况","tv":"Tiểu Lâm và Vương Tĩnh nói chuyện về công việc của Vương Tĩnh","lines":[{"s":"小林","z":"王静，好久不见了！大学毕业后就没联系了，你现在在哪儿工作呢？","p":"Wáng Jìng, hǎojiǔ bú jiàn le! Dàxué bìyè hòu jiù méi liánxì le, nǐ xiànzài zài nǎr gōngzuò ne?","v":"Vương Tĩnh, lâu quá không gặp! Tốt nghiệp đại học xong là mất liên lạc luôn, giờ cậu làm việc ở đâu?"},{"s":"王静","z":"我一毕业就去上海当律师了。","p":"Wǒ yí bìyè jiù qù Shànghǎi dāng lǜshī le.","v":"Mình vừa tốt nghiệp là đi Thượng Hải làm luật sư."},{"s":"小林","z":"你对现在的工作一定非常满意吧？","p":"Nǐ duì xiànzài de gōngzuò yídìng fēicháng mǎnyì ba?","v":"Chắc cậu hài lòng lắm với công việc hiện tại nhỉ?"},{"s":"王静","z":"我很喜欢现在的工作，因为我学的就是法律专业，而且同事们都很喜欢我。另外，收入也不错。","p":"Wǒ hěn xǐhuan xiànzài de gōngzuò, yīnwèi wǒ xué de jiù shì fǎlǜ zhuānyè, érqiě tóngshìmen dōu hěn xǐhuan wǒ. Lìngwài, shōurù yě búcuò.","v":"Mình rất thích công việc bây giờ, vì mình học đúng chuyên ngành luật, hơn nữa đồng nghiệp ai cũng quý mình. Ngoài ra, thu nhập cũng khá."},{"s":"小林","z":"星期天咱们同学聚会，你能来参加吗？","p":"Xīngqītiān zánmen tóngxué jùhuì, nǐ néng lái cānjiā ma?","v":"Chủ nhật lớp mình họp lớp, cậu tới được không?"},{"s":"王静","z":"能来。虽然这次来北京，时间安排得很紧张，但我一定借这次机会去跟大家见见面。","p":"Néng lái. Suīrán zhè cì lái Běijīng, shíjiān ānpái de hěn jǐnzhāng, dàn wǒ yídìng jiè zhè cì jīhuì qù gēn dàjiā jiànjian miàn.","v":"Tới được. Tuy lần này ra Bắc Kinh lịch sắp xếp khá gấp, nhưng mình nhất định nhân dịp này đi gặp mặt mọi người."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"面试的时候，经理对我印象不错，还通知我明天就可以上班了。","p":"Miànshì de shíhou, jīnglǐ duì wǒ yìnxiàng búcuò, hái tōngzhī wǒ míngtiān jiù kěyǐ shàng bān le.","v":"Hôm phỏng vấn, giám đốc có ấn tượng khá tốt về mình, còn báo là ngày mai mình có thể đi làm luôn."},{"s":"","z":"真没想到，找工作这么顺利。","p":"Zhēn méi xiǎngdào, zhǎo gōngzuò zhème shùnlì.","v":"Thật không ngờ, chuyện tìm việc lại thuận lợi đến thế."},{"s":"","z":"你想知道面试需要注意什么吗？","p":"Nǐ xiǎng zhīdào miànshì xūyào zhùyì shénme ma?","v":"Bạn có muốn biết khi đi phỏng vấn cần chú ý những gì không?"},{"s":"","z":"首先，要穿正式的衣服，这会给面试者留下一个好的印象，让他觉得你是一个认真的人。","p":"Shǒuxiān, yào chuān zhèngshì de yīfu, zhè huì gěi miànshìzhě liúxià yí ge hǎo de yìnxiàng, ràng tā juéde nǐ shì yí ge rènzhēn de rén.","v":"Trước hết, phải mặc trang phục trang trọng, điều đó sẽ để lại ấn tượng tốt cho người phỏng vấn, khiến họ thấy bạn là một người nghiêm túc."},{"s":"","z":"其次，应聘时不要紧张。","p":"Qícì, yìngpìn shí búyào jǐnzhāng.","v":"Thứ hai, lúc ứng tuyển thì đừng hồi hộp."},{"s":"","z":"回答问题时，说得不要太快，声音也不要太小，要相信自己有能力做好。","p":"Huídá wèntí shí, shuō de búyào tài kuài, shēngyīn yě búyào tài xiǎo, yào xiāngxìn zìjǐ yǒu nénglì zuòhǎo.","v":"Khi trả lời câu hỏi, đừng nói quá nhanh, giọng cũng đừng quá nhỏ, phải tin rằng mình có đủ năng lực làm tốt."},{"s":"","z":"当然，最重要的是回答问题要诚实。","p":"Dāngrán, zuì zhòngyào de shì huídá wèntí yào chéngshí.","v":"Tất nhiên, điều quan trọng nhất là trả lời câu hỏi phải thành thật."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"第一印象就是在第一次见面时给别人留下的印象。","p":"Dì-yī yìnxiàng jiù shì zài dì-yī cì jiàn miàn shí gěi biérén liúxià de yìnxiàng.","v":"Ấn tượng đầu tiên chính là ấn tượng mà bạn để lại cho người khác trong lần gặp mặt đầu tiên."},{"s":"","z":"虽然第一印象不总是对的，但如果想改变却很困难。","p":"Suīrán dì-yī yìnxiàng bù zǒng shì duì de, dàn rúguǒ xiǎng gǎibiàn què hěn kùnnan.","v":"Tuy ấn tượng đầu tiên không phải lúc nào cũng đúng, nhưng nếu muốn thay đổi thì lại rất khó."},{"s":"","z":"你给别人的第一印象会影响他们以后对你的感觉和判断。","p":"Nǐ gěi biérén de dì-yī yìnxiàng huì yǐngxiǎng tāmen yǐhòu duì nǐ de gǎnjué hé pànduàn.","v":"Ấn tượng đầu tiên bạn để lại sẽ ảnh hưởng đến cảm nhận và cách đánh giá của họ về bạn sau này."},{"s":"","z":"所以，给第一次见面的同事留下好的印象，以后的工作可能会更顺利；给第一次见面的顾客留下好的印象，你可能会卖出更多的东西。","p":"Suǒyǐ, gěi dì-yī cì jiànmiàn de tóngshì liúxià hǎo de yìnxiàng, yǐhòu de gōngzuò kěnéng huì gèng shùnlì; gěi dì-yī cì jiàn miàn de gùkè liúxià hǎo de yìnxiàng, nǐ kěnéng huì màichū gèng duō de dōngxi.","v":"Cho nên, nếu để lại ấn tượng tốt với đồng nghiệp ngay lần đầu gặp mặt, công việc sau này có thể sẽ thuận lợi hơn; để lại ấn tượng tốt với khách hàng ngay lần đầu, bạn có thể sẽ bán được nhiều hàng hơn."},{"s":"","z":"但是，如果第一次见面给别人留下像不准时这样的坏印象，那么以后就很难让别人相信你。","p":"Dànshì, rúguǒ dì-yī cì jiàn miàn gěi biérén liúxià xiàng bù zhǔnshí zhèyàng de huài yìnxiàng, nàme yǐhòu jiù hěn nán ràng biérén xiāngxìn nǐ.","v":"Nhưng nếu ngay lần đầu gặp mặt đã để lại ấn tượng xấu kiểu như không đúng giờ, thì về sau rất khó khiến người khác tin tưởng bạn."},{"s":"","z":"所以不管是上课、上班，还是与别人约会，准时都非常重要。","p":"Suǒyǐ bùguǎn shì shàng kè, shàng bān, háishi yǔ biérén yuēhuì, zhǔnshí dōu fēicháng zhòngyào.","v":"Vì vậy, bất kể là đi học, đi làm hay hẹn gặp người khác, đúng giờ đều vô cùng quan trọng."}]}],"gram":[{"id":"shouxian-qici","t":"首先……，其次……（当然/最重要的是……）","s":"Trước hết… , thứ hai… — nêu nhiều ý theo thứ tự","b":"Khi cần liệt kê nhiều việc, nhiều lý do hoặc nhiều lời khuyên theo thứ tự trước sau, tiếng Trung dùng cặp <b>首先……，其次……</b>. Cả hai đều đứng <b>đầu vế câu</b> và thường tách bằng dấu phẩy. Muốn thêm ý nữa thì nối tiếp bằng <b>再次</b>, <b>最后</b>, hoặc nhấn mạnh ý quan trọng nhất bằng <b>最重要的是……</b>.","r":["首先 và 其次 đứng đầu vế, KHÔNG đứng sau chủ ngữ: ✗ 我首先要穿正式的衣服，你其次…… → ✓ 首先，要穿正式的衣服；其次，应聘时不要紧张","首先 (trước hết) khác 先 (làm trước rồi mới làm việc kia): 先……然后…… chỉ trình tự hành động, còn 首先……其次…… chỉ trình tự <b>ý</b> khi trình bày","Kết thúc chuỗi liệt kê hay dùng <b>当然，最重要的是……</b> để chốt ý quan trọng nhất","其次 chỉ đứng thứ hai; từ ý thứ ba trở đi dùng 再次 / 另外 / 最后, không lặp lại 其次"],"e":[["首先，要穿正式的衣服，这会给面试者留下一个好的印象。","Shǒuxiān, yào chuān zhèngshì de yīfu, zhè huì gěi miànshìzhě liúxià yí ge hǎo de yìnxiàng.","Trước hết, phải mặc đồ trang trọng, việc đó sẽ để lại ấn tượng tốt cho người phỏng vấn. <i>(bài khoá 1)</i>"],["其次，应聘时不要紧张。","Qícì, yìngpìn shí búyào jǐnzhāng.","Thứ hai, khi ứng tuyển thì đừng hồi hộp. <i>(bài khoá 1)</i>"],["当然，最重要的是回答问题要诚实。","Dāngrán, zuì zhòngyào de shì huídá wèntí yào chéngshí.","Tất nhiên, quan trọng nhất là trả lời câu hỏi phải thành thật. <i>(bài khoá 1)</i>"]],"d":[["要想学好汉语，____________，其次，应该常常复习。","首先"],["我不同意你这么做，首先你不了解他，____________。","其次"],["____，要穿正式的衣服；____，应聘时不要紧张。","首先 / 其次"]],"w":"首先 KHÔNG phải là 第一次. 第一次 = lần đầu tiên (đếm số lần); 首先 = trước hết (thứ tự trình bày)."},{"id":"buguan-haishi-dou","t":"不管……（还是……），都/也……","s":"Bất kể / dù … thì cũng …","b":"<b>不管</b> nêu ra vài khả năng hoặc một điều kiện thay đổi, còn vế sau nói kết quả <b>không đổi</b>. Vế sau bắt buộc phải có <b>都</b> hoặc <b>也</b>. Phần đứng sau 不管 phải mang tính “để ngỏ”: hai lựa chọn nối bằng <b>还是</b>, hoặc dùng 多 + tính từ, V不V, hoặc từ để hỏi (谁/什么/怎么).","r":["Công thức: 不管 + A 还是 B（/多……/V不V/疑问词），+ 都/也 + …… — thiếu 都/也 là câu sai","Sau 不管 KHÔNG được dùng câu khẳng định đơn thuần: ✗ 不管他很忙，他都来 → ✓ 不管他忙不忙，他都来","不管 đứng đầu câu hoặc ngay sau chủ ngữ; nếu hai vế cùng chủ ngữ thì chủ ngữ đứng trước 都: 不管刮风还是下雨，他都去","不管 thiên về khẩu ngữ, 无论 trang trọng hơn nhưng dùng y hệt nhau"],"e":[["所以不管是上课、上班，还是与别人约会，准时都非常重要。","Suǒyǐ bùguǎn shì shàng kè, shàng bān, háishi yǔ biérén yuēhuì, zhǔnshí dōu fēicháng zhòngyào.","Vì vậy bất kể là đi học, đi làm hay hẹn gặp người khác, đúng giờ đều vô cùng quan trọng. <i>(bài khoá 2)</i>"]],"d":[["____是上课、上班，还是与别人约会，准时____非常重要。","不管 / 都"],["不管是上课、上班，____与别人约会，准时都非常重要。","还是"]],"w":"Đừng lẫn 不管 với 尽管. 不管 = bất kể (điều kiện chưa xác định, sau nó là lựa chọn/nghi vấn); 尽管 = mặc dù (sự thật đã xác định, tương đương 虽然): 尽管很忙，他还是来了。"},{"id":"gei-liuxia-yinxiang","t":"给+人+留下……的印象 ／ 对+人+印象+好/不错","s":"Để lại ấn tượng … cho ai / có ấn tượng … về ai","b":"Đây là hai cách nói ấn tượng, nhìn từ hai phía. Người <b>gây ra</b> ấn tượng thì dùng <b>给……留下……的印象</b>; người <b>ôm</b> ấn tượng trong lòng thì dùng <b>对……印象+好/不错/很深</b>. Chỗ trống trước 印象 thường là 好的 / 坏的 / 深 và có thể thêm lượng từ 一个.","r":["Trật tự cố định: 给 + người nhận + 留下 + (一个) + 好的/坏的 + 印象","Có thể rút gọn thành 留下印象 khi đã rõ đối tượng: 第一印象就是……给别人留下的印象","Cách nói phía người cảm nhận: 对 + người/việc + 印象 + 好/不错/很深 — ✗ 我印象他很好 → ✓ 我对他印象很好","印象 kết hợp được với 影响: 第一印象会影响别人对你的感觉和判断"],"e":[["这会给面试者留下一个好的印象，让他觉得你是一个认真的人。","Zhè huì gěi miànshìzhě liúxià yí ge hǎo de yìnxiàng, ràng tā juéde nǐ shì yí ge rènzhēn de rén.","Điều này sẽ để lại ấn tượng tốt cho người phỏng vấn, khiến họ thấy bạn là một người nghiêm túc. <i>(bài khoá 1)</i>"],["面试的时候，经理对我印象不错，还通知我明天就可以上班了。","Miànshì de shíhou, jīnglǐ duì wǒ yìnxiàng búcuò, hái tōngzhī wǒ míngtiān jiù kěyǐ shàng bān le.","Hôm phỏng vấn, giám đốc có ấn tượng khá tốt về mình, còn báo là mai mình đi làm được rồi. <i>(bài khoá 1)</i>"],["第一印象就是在第一次见面时给别人留下的印象。","Dì-yī yìnxiàng jiù shì zài dì-yī cì jiàn miàn shí gěi biérén liúxià de yìnxiàng.","Ấn tượng đầu tiên chính là ấn tượng mà bạn để lại cho người khác trong lần gặp đầu tiên. <i>(bài khoá 2)</i>"]],"d":[["这会____面试者____下一个好的印象。","给 / 留"],["面试的时候，经理____我印象不错。","对"]],"w":"留 ở bài này là “để lại”; đừng nhầm với 留学 (du học) hay 留下来 (ở lại). Khi nói ấn tượng, luôn đi với 下: 留下印象, không nói 留印象."},{"id":"suiran-dan-que","t":"虽然……，但（是）……却……","s":"Tuy … nhưng lại …","b":"Cặp <b>虽然……但（是）……</b> nêu sự nhượng bộ – chuyển ý. Bài này thêm phó từ <b>却</b> ở vế sau để nhấn mạnh kết quả <b>trái với mong đợi</b>. 却 là phó từ nên phải đứng <b>sau chủ ngữ, trước động từ/tính từ</b>, không bao giờ đứng đầu câu.","r":["虽然 đứng đầu vế 1 (trước hoặc sau chủ ngữ đều được); vế 2 dùng 但是/可是/但, có thể thêm 却 cho mạnh","却 KHÔNG đứng đầu câu và KHÔNG đứng trước chủ ngữ: ✗ 却他很努力 → ✓ 他却很努力","但是 và 却 dùng chung được (但……却……), khác với tiếng Việt “nhưng mà lại” — đây là cách nói bình thường","Đã có 虽然 thì vế sau vẫn phải có 但是/可是 (khác tiếng Anh, không được bỏ trống)"],"e":[["虽然第一印象不总是对的，但如果想改变却很困难。","Suīrán dì-yī yìnxiàng bù zǒng shì duì de, dàn rúguǒ xiǎng gǎibiàn què hěn kùnnan.","Tuy ấn tượng đầu tiên không phải lúc nào cũng đúng, nhưng muốn thay đổi thì lại rất khó. <i>(bài khoá 2)</i>"],["他们这次招聘的要求虽然高，但是那些要求你都符合，你应该去试试。","Tāmen zhè cì zhāopìn de yāoqiú suīrán gāo, dànshì nàxiē yāoqiú nǐ dōu fúhé, nǐ yīnggāi qù shìshi.","Yêu cầu tuyển dụng lần này của họ tuy cao, nhưng những yêu cầu đó bạn đều đáp ứng được, bạn nên thử xem. <i>(练一练)</i>"]],"d":[["____第一印象不总是对的，但如果想改变____很困难。","虽然 / 却"],["他们这次招聘的要求____高，但是那些要求你都____。","虽然 / 符合"]],"w":"却 ≠ 但是 về vị trí: 但是 là liên từ (đầu vế), 却 là phó từ (giữa câu). Có thể nói 但是……却……, nhưng không nói ✗ 却，很困难。"},{"id":"de-buyu-chengdu","t":"动词/形容词 + 得 + 补语","s":"Bổ ngữ trạng thái/mức độ: nói/làm … như thế nào, … đến mức …","b":"<b>得</b> nối động từ (hoặc tính từ) với phần miêu tả <b>mức độ, trạng thái</b> đi kèm: 说得太快 (nói quá nhanh), 紧张得脸都红了 (hồi hộp đến đỏ cả mặt). Phần phủ định và trạng ngữ mức độ đặt <b>sau 得</b>, không đặt trước động từ.","r":["Công thức: V + 得 + 很/太/不…… — ✗ 不要说得太快 viết thành 不要太快说","Nếu động từ có tân ngữ thì phải nhắc lại động từ: 他说汉语说得很好 (hoặc 他汉语说得很好)","Tính từ + 得 + kết quả cực độ: 紧张得脸和耳朵都红了 / 时间安排得很紧张","Phân biệt ba chữ “de”: 得 (trước bổ ngữ, sau động từ), 的 (trước danh từ), 地 (trước động từ, sau trạng ngữ)"],"e":[["回答问题时，说得不要太快，声音也不要太小，要相信自己有能力做好。","Huídá wèntí shí, shuō de búyào tài kuài, shēngyīn yě búyào tài xiǎo, yào xiāngxìn zìjǐ yǒu nénglì zuòhǎo.","Khi trả lời câu hỏi, đừng nói quá nhanh, giọng cũng đừng quá nhỏ, phải tin là mình có năng lực làm tốt. <i>(bài khoá 1)</i>"],["第一次跟女朋友见面的时候，他紧张得脸和耳朵都红了。","Dì-yī cì gēn nǚpéngyou jiàn miàn de shíhou, tā jǐnzhāng de liǎn hé ěrduo dōu hóng le.","Lần đầu gặp bạn gái, anh ấy hồi hộp đến mức mặt và tai đều đỏ ửng. <i>(练一练)</i>"],["公司的事情很多，时间安排得很紧张。","Gōngsī de shìqing hěn duō, shíjiān ānpái de hěn jǐnzhāng.","Việc công ty rất nhiều, thời gian sắp xếp rất kín. <i>(练一练)</i>"]],"d":[["说____不要太快，声音也不要太小。","得"],["他______得脸和耳朵都红了。","紧张"],["时间______得很紧张。","安排"]],"w":"紧张 có hai nghĩa: nói về người là “hồi hộp, căng thẳng” (他很紧张), nói về thời gian/lịch là “gấp, kín” (时间安排得很紧张)."},{"id":"xiang-zheyang-de","t":"像……这样的 + 名词","s":"(một cái) kiểu như …, chẳng hạn như …","b":"Dùng để nêu <b>ví dụ tiêu biểu</b> cho danh từ đứng sau: 像不准时这样的坏印象 = ấn tượng xấu kiểu như (chuyện) không đúng giờ. Phần đứng giữa 像 và 这样的 có thể là danh từ, động từ hoặc cả một cụm.","r":["Công thức: 像 + ví dụ + 这样的 + danh từ (khái quát); cũng có thể nói 像……那样的","Cả cụm này làm định ngữ, luôn đứng TRƯỚC danh từ trung tâm","Khác với 像……一样 (giống như, so sánh sự giống nhau): 他像他爸爸一样高 ≠ 像他爸爸这样的人","Nếu chỉ muốn liệt kê ví dụ, có thể thay bằng 比如……什么的"],"e":[["如果第一次见面给别人留下像不准时这样的坏印象，那么以后就很难让别人相信你。","Rúguǒ dì-yī cì jiàn miàn gěi biérén liúxià xiàng bù zhǔnshí zhèyàng de huài yìnxiàng, nàme yǐhòu jiù hěn nán ràng biérén xiāngxìn nǐ.","Nếu ngay lần đầu gặp mặt đã để lại cho người ta ấn tượng xấu kiểu như không đúng giờ, thì sau này rất khó khiến người khác tin bạn. <i>(bài khoá 2)</i>"]],"d":[["如果第一次见面给别人留下____不准时____的坏印象，以后就很难让别人相信你。","像 / 这样"],["如果……，____以后就很难让别人相信你。","那么"]],"w":"Đừng bỏ 的: ✗ 像不准时这样坏印象 → ✓ 像不准时这样<b>的</b>坏印象."},{"id":"v-shi","t":"……时 ＝ ……的时候","s":"Khi/lúc … (cách nói rút gọn, thiên về văn viết)","b":"<b>时</b> là dạng rút gọn của <b>的时候</b>, đứng sau động từ hoặc cụm động/danh để chỉ thời điểm. Vì mang màu sắc văn viết nên bài đọc dùng rất nhiều (应聘时、回答问题时、见面时), còn hội thoại thường nói đầy đủ 的时候.","r":["Công thức: (在) + V/cụm + 时，+ vế chính — 应聘时不要紧张 = 应聘的时候不要紧张","时 không đứng một mình làm chủ ngữ; muốn nói “thời gian” phải dùng 时间, muốn nói “lúc nào” dùng 时候","Có thể thêm 在 ở đầu: 在第一次见面时给别人留下的印象","Trong văn nói/hội thoại nên dùng 的时候 cho tự nhiên"],"e":[["其次，应聘时不要紧张。","Qícì, yìngpìn shí búyào jǐnzhāng.","Thứ hai, khi ứng tuyển thì đừng hồi hộp. <i>(bài khoá 1)</i>"],["回答问题时，说得不要太快。","Huídá wèntí shí, shuō de búyào tài kuài.","Lúc trả lời câu hỏi, đừng nói quá nhanh. <i>(bài khoá 1)</i>"],["第一印象就是在第一次见面时给别人留下的印象。","Dì-yī yìnxiàng jiù shì zài dì-yī cì jiàn miàn shí gěi biérén liúxià de yìnxiàng.","Ấn tượng đầu tiên chính là ấn tượng để lại cho người khác lúc gặp mặt lần đầu. <i>(bài khoá 2)</i>"]],"d":[["回答问题____，说得不要太快。","时（＝的时候）"],["面试____，经理对我印象不错。","的时候"]],"w":"Cùng một bài mà có cả 面试的时候 (câu kể, giọng nói chuyện) lẫn 应聘时 (câu văn viết) — nghĩa như nhau, chỉ khác văn phong."},{"id":"bien-biet-thoi-gian","t":"辨析：时候 / 时间 / 平时 / 及时 / 准时","s":"Phân biệt năm từ chỉ thời gian dễ nhầm","b":"<b>时候</b> = lúc, khi (thời điểm, hay đi với 的); <b>时间</b> = thời gian (danh từ đo được: 时间长/短, 有时间); <b>平时</b> = thường ngày, bình thường (đối lập với dịp đặc biệt); <b>及时</b> = kịp thời (làm ngay lúc cần); <b>准时</b> = đúng giờ (đúng mốc giờ đã hẹn).","r":["时候 luôn cần bổ nghĩa phía trước: ……的时候; không nói ✗ 我有时候去 với nghĩa “có thời gian” → ✓ 我有时间","时间 mới là danh từ đếm được/đo được: 时间太长、安排时间、没有时间","平时 làm trạng ngữ, đứng trước động từ: 我平时骑自行车上下班","及时 nhấn mạnh “không để muộn” (及时去改、及时通知); 准时 nhấn mạnh “đúng mốc giờ” (准时起飞、准时上课)","准时 dùng được cả cho người: 王老师是一个特别准时的人"],"e":[["所以不管是上课、上班，还是与别人约会，准时都非常重要。","Suǒyǐ bùguǎn shì shàng kè, shàng bān, háishi yǔ biérén yuēhuì, zhǔnshí dōu fēicháng zhòngyào.","Vì vậy bất kể đi học, đi làm hay hẹn gặp người khác, đúng giờ đều rất quan trọng. <i>(bài khoá 2)</i>"],["面试的时候，经理对我印象不错。","Miànshì de shíhou, jīnglǐ duì wǒ yìnxiàng búcuò.","Lúc phỏng vấn, giám đốc có ấn tượng khá tốt về mình. <i>(bài khoá 1)</i>"]],"d":[["我_______骑自行车上下班，可是今天起晚了，所以就打车来公司了。","平时"],["当你想发脾气的_______，试试在心里数数。","时候"],["午饭后不要马上睡午觉，另外，午睡的________太长也会影响健康。","时间"],["每个人都有缺点，但我们应该努力发现自己的缺点，________去改。","及时"],["上个星期去北京的________，飞机不仅________起飞，而且还早到了十分钟。","时候 / 准时"]],"w":"Mẹo nhớ: có “的” phía trước → 时候; đo dài ngắn, nhiều ít → 时间; “thói quen thường ngày” → 平时; “kịp lúc” → 及时; “đúng giờ hẹn” → 准时."},{"id":"ting-de","t":"挺……的","s":"Khá… , rất… (phó từ khẩu ngữ, gần nghĩa 很)","b":"Sách nói rõ: <b>挺</b> là phó từ, mang nghĩa của <b>很</b> ('khá, rất'), và thường dùng trong kết cấu <b>挺……的</b>. Đây là cách nói khẩu ngữ, nghe nhẹ và thân mật hơn 很 hay 非常, rất hay xuất hiện trong hội thoại HSK4.","r":["Cấu trúc quen dùng: <b>挺</b> + tính từ / động từ chỉ tâm lý + <b>的</b> — 挺容易<b>的</b>、挺好<b>的</b>、挺喜欢……<b>的</b>","的 gần như luôn phải có, bỏ đi nghe cụt: ✗ 这儿挺安静 → ✓ 这儿挺安静的","Không ghép 挺 với một phó từ mức độ khác: ✗ 挺很容易的 → ✓ 挺容易的","挺 không dùng trong câu so sánh có 比: ✗ 他比我挺高的 → ✓ 他比我高一点儿"],"e":[["还可以，他们问的问题都挺容易的，就是我有点儿紧张。","Hái kěyǐ, tāmen wèn de wèntí dōu tǐng róngyì de, jiùshì wǒ yǒudiǎnr jǐnzhāng.","Cũng được, mấy câu họ hỏi đều <b>khá</b> dễ, chỉ là mình hơi hồi hộp thôi. <i>(bài khoá 1)</i>"],["这家店的东西挺好的，我经常来这儿买东西。","Zhè jiā diàn de dōngxi tǐng hǎo de, wǒ jīngcháng lái zhèr mǎi dōngxi.","Đồ của cửa hàng này khá tốt, mình thường đến đây mua đồ."],["我挺喜欢这个地方的，周围环境比以前住的地方安静很多。","Wǒ tǐng xǐhuan zhège dìfang de, zhōuwéi huánjìng bǐ yǐqián zhù de dìfang ānjìng hěn duō.","Mình khá thích chỗ này, môi trường xung quanh yên tĩnh hơn nơi ở cũ nhiều."]],"d":[["这几天____________，你不用穿这么多衣服。（挺）","挺暖和的"],["那个房间又安静又干净，____________。（挺）","我挺满意的"],["他们俩的性格差不多，____________。（挺）","挺像的"]],"w":"挺 ở đây chỉ là phó từ mức độ 'khá / rất', không phải nghĩa 'thẳng, cứng'. Cũng không đặt 挺 trực tiếp trước danh từ: ✗ 挺人 → ✓ 挺多人的."},{"id":"ben-lai","t":"本来","s":"Lẽ ra phải như vậy / vốn dĩ, lúc đầu (nay đã khác)","b":"Sách nêu hai nghĩa của phó từ <b>本来</b>: (1) <b>theo lẽ thường thì phải như vậy</b> — 'đáng lẽ, lẽ ra'; (2) tương đương <b>原先、原来</b> — 'lúc đầu, vốn trước đây', hàm ý bây giờ đã thay đổi. 本来 thường đứng sau chủ ngữ và trước động từ, nhưng cũng có thể đứng ngay đầu câu.","r":["Nghĩa 'đáng lẽ': 本来 + 应该 / 就该 + động từ — 这件事<b>本来应该</b>听他的","Nghĩa 'lúc đầu': vế sau thường nêu sự thay đổi bằng 但（是）/ 现在 / 后来 — 我<b>本来</b>不会开车，<b>但现在</b>开得特别好","Kể một việc đã định trong quá khứ hay dùng khung <b>本来……的</b>: 本来是小李负责的","本来 thường đứng sau chủ ngữ, trước động từ: 小李<b>本来</b>负责这次招聘; nhưng cũng đứng được đầu câu, trước chủ ngữ: <b>本来</b>我想去的，可是突然下雨了"],"e":[["本来是小李负责的，但是他突然生病住院了，所以就交给我来做了。","Běnlái shì Xiǎo Lǐ fùzé de, dànshì tā tūrán shēngbìng zhùyuàn le, suǒyǐ jiù jiāo gěi wǒ lái zuò le.","<b>Vốn dĩ</b> là Tiểu Lý phụ trách, nhưng cậu ấy đột nhiên ốm phải nhập viện nên mới giao lại cho tôi làm. <i>(bài khoá 2)</i>"],["这件事本来应该听他的。","Zhè jiàn shì běnlái yīnggāi tīng tā de.","Chuyện này <b>đáng lẽ</b> nên nghe theo anh ấy."],["我本来不会开车，但现在开得特别好。","Wǒ běnlái bú huì kāichē, dàn xiànzài kāi de tèbié hǎo.","Tôi <b>lúc đầu</b> không biết lái xe, nhưng bây giờ lái rất cừ."]],"d":[["A：你怎么没去爬山呢？ B：____________，可是突然下雨了。（本来）","我本来想去的"],["A：附近那家银行5点就下班了！ B：那我不去了，____________。（本来）","我本来想去取点儿钱的"],["A：____________。 B：没关系，我从那儿打车回来很方便。（本来）","本来说好去机场接你的"]],"w":"本来 khác 原来 ở chỗ 原来 còn có nghĩa 'hoá ra, thì ra' khi phát hiện sự thật (原来你也在这儿！), còn 本来 thì không dùng được như vậy."},{"id":"ling-wai","t":"另外","s":"Ba cách dùng: đại từ 'cái khác' — phó từ 'thêm nữa' — liên từ 'ngoài ra'","b":"Sách tách <b>另外</b> thành ba từ loại. Là <b>đại từ</b>, 另外 chỉ người/vật nằm ngoài phạm vi vừa nói tới. Là <b>phó từ</b>, 另外 nêu ý làm thêm một việc ngoài phạm vi vừa nói, hay đi cùng 还 / 再 / 又. Là <b>liên từ</b>, 另外 nghĩa 'ngoài ra', dùng để nối vế câu hoặc nối câu.","r":["Đại từ — hai khung: <b>另外（+的）+ số lượng（+ danh từ）</b> hoặc <b>另外 + 的（+ danh từ）</b>: 走另外一条路 / 试试另外的那件","Phó từ — thường kèm 还、再、又: 我<b>另外又</b>补充了几条意见 / 咱们<b>另外再</b>买一个吧","Liên từ — đứng đầu vế sau, có dấu phẩy theo sau: ……同事们都很喜欢我。<b>另外，</b>收入也不错","Ở khung 另外（+的）+ số lượng, chữ 的 có thể có hoặc không: ✓ 另外一条路 ✓ 另外的一条路"],"e":[["我很喜欢现在的工作，因为我学的就是法律专业，而且同事们都很喜欢我。另外，收入也不错。","Wǒ hěn xǐhuan xiànzài de gōngzuò, yīnwèi wǒ xué de jiù shì fǎlǜ zhuānyè, érqiě tóngshìmen dōu hěn xǐhuan wǒ. Lìngwài, shōurù yě búcuò.","Mình rất thích công việc hiện tại, vì mình học đúng chuyên ngành luật, hơn nữa đồng nghiệp đều quý mình. <b>Ngoài ra</b>, thu nhập cũng khá. <i>(bài khoá 3)</i>"],["前面车有点儿多，我们走另外一条路，不会迟到的。","Qiánmiàn chē yǒudiǎnr duō, wǒmen zǒu lìngwài yì tiáo lù, bú huì chídào de.","Phía trước hơi đông xe, mình đi <b>một đường khác</b>, sẽ không muộn đâu."],["家里的空调坏了，咱们另外再买一个吧。","Jiā lǐ de kōngtiáo huài le, zánmen lìngwài zài mǎi yí ge ba.","Điều hoà ở nhà hỏng rồi, chúng ta <b>mua thêm</b> một cái khác đi."]],"d":[["A：同学们在体育馆做什么？ B：有的在打篮球，____________。（另外）","另外的在打乒乓球"],["A：你通知小王明天开会的时间了吗？ B：我让小夏告诉他了，____________。（另外）","另外我还给他发了个短信"],["A：你最近怎么总是生病呢？ B：可能是最近太累了，____________。（另外）","另外，天气变化也比较大"]],"w":"Khi làm liên từ, 另外 phải đứng đầu vế sau và có dấu phẩy — không nhét vào giữa câu như phó từ."},{"id":"bien-biet-lingwai-ling","t":"辨析：另外 / 另","s":"Cùng nghĩa 'khác / ngoài ra', nhưng 另 bị hạn chế hơn nhiều","b":"Sách so sánh: <b>giống nhau</b> — cả 另外 và 另 đều làm được <b>đại từ</b> (chỉ người/vật ngoài phạm vi đã nói) và <b>phó từ</b> (nêu ý ngoài phạm vi đã nói). <b>Khác nhau</b> nằm ở cấu trúc đi kèm, ở loại động từ mà chúng bổ nghĩa, và ở chỗ chỉ 另外 mới làm được liên từ.","r":["Đại từ: 另外 dùng khung <b>另外（+的）+ số lượng</b> hoặc <b>另外+的</b>; còn 另 chỉ dùng <b>另 + số lượng</b> và KHÔNG được thêm 的 — ✓ 你骑另外/另一辆吧 ✓ 你骑另外的一辆吧 ✗ 你骑另的一辆吧","Muốn nói 'cái khác' mà không có số lượng từ thì chỉ dùng được 另外: ✓ 你骑另外的车吧 ✗ 你骑另的车吧","Phó từ: 另 thường chỉ bổ nghĩa cho động từ <b>một âm tiết</b>（另找、另买）; 另外 không bị hạn chế đó — ✓ 还另外提供了不少新的材料 ✗ 还另提供了不少新的材料","Chỉ 另外 làm được <b>liên từ</b> ('ngoài ra'), 另 thì không — ✓ 另外，还要记得多喝水 ✗ 另，还要记得多喝水"],"e":[["我很喜欢现在的工作，因为我学的就是法律专业，而且同事们都很喜欢我。另外，收入也不错。","Wǒ hěn xǐhuan xiànzài de gōngzuò, yīnwèi wǒ xué de jiù shì fǎlǜ zhuānyè, érqiě tóngshìmen dōu hěn xǐhuan wǒ. Lìngwài, shōurù yě búcuò.","Mình rất thích công việc hiện tại, vì mình học đúng chuyên ngành luật, hơn nữa đồng nghiệp đều quý mình. <b>Ngoài ra</b>, thu nhập cũng khá. <i>(bài khoá 3 — chỗ này 另外 làm liên từ nên không thay bằng 另)</i>"],["刚才马克把车借走了，你骑另外／另一辆吧。","Gāngcái Mǎkè bǎ chē jiè zǒu le, nǐ qí lìngwài / lìng yí liàng ba.","Vừa nãy Mark mượn xe đi rồi, cậu đi chiếc khác đi. <i>(chỗ này hai từ thay nhau được)</i>"],["最近小雨太忙了，没时间帮你，你还是另外／另找别人吧。","Zuìjìn Xiǎo Yǔ tài máng le, méi shíjiān bāng nǐ, nǐ háishi lìngwài / lìng zhǎo biérén ba.","Dạo này Tiểu Vũ bận quá, không có thời gian giúp cậu, cậu tìm người khác đi. <i>(找 là động từ một âm tiết nên 另 dùng được)</i>"]],"d":[["他叫马克，______一个同学叫安娜。（另外／另 — điền cả hai đều đúng）","另外 / 另"],["这次聚会需要买一些水果，______再准备一些啤酒。","另外"],["上个月经理去上海参加了______的一个重要会议。","另外"]],"w":"Mẹo nhớ: hễ có chữ 的 đi kèm, hoặc đứng đầu vế câu với nghĩa 'ngoài ra', hoặc bổ nghĩa cho động từ hai âm tiết — thì chỉ dùng được 另外; 另 chỉ đi thẳng với số lượng từ hoặc động từ một âm tiết."}],"notes":"Ba bài khoá 1–3 và tiêu đề chính thức được bổ sung từ Giáo trình chuẩn HSK 4 tập 1, trang 35–36 và 41 (bản scan, đọc trực tiếp từ sách). Hai đoạn trích được từ slide thực chất là bài khoá 4 và 5 nên đã đánh số lại cho đúng sách. Từ mới 31 từ khớp đúng danh sách 生词 1–31 của sách.","order":[{"z":"你上午的面试怎么样？","t":["你","上午","的","面试","怎么样"],"v":"Buổi phỏng vấn sáng nay của cậu thế nào?"},{"z":"我还没决定呢。","t":["我","还","没","决定","呢"],"v":"Mình vẫn chưa quyết định."},{"z":"小林，这次招聘不是小李负责吗？","t":["小林","这次","招聘","不是","小李" ],"v":"Thứ hai, lúc ứng tuyển thì đừng hồi hộp."}]},"4":{"n":4,"tz":"不要太着急赚钱","tv":"Công việc và trách nhiệm: đổi việc, lập kế hoạch, làm ăn và tổng kết cuối năm","batches":[[{"h":"提","p":"tí","v":"Nhắc đến","ez":"他从来不提以前的事。","ey":"Tā cónglái bù tí yǐqián de shì.","ev":"Anh ấy chưa bao giờ nhắc đến chuyện trước đây."},{"h":"以为","p":"yǐ wéi","v":"Cho rằng, tưởng là","ez":"我以为今天是星期六。","ey":"Wǒ yǐwéi jīntiān shì xīngqīliù.","ev":"Tôi cứ tưởng hôm nay là thứ bảy."},{"h":"份","p":"fèn","v":"(được dùng cho công việc, báo chí…) tờ, bản","ez":"我每天早上买一份报纸。","ey":"Wǒ měitiān zǎoshang mǎi yí fèn bàozhǐ.","ev":"Sáng nào tôi cũng mua một tờ báo."},{"h":"完全","p":"wán quán","v":"Hoàn toàn","ez":"他说的话我完全同意。","ey":"Tā shuō de huà wǒ wánquán tóngyì.","ev":"Những lời anh ấy nói tôi hoàn toàn đồng ý."},{"h":"赚","p":"zhuàn","v":"Kiếm (tiền)","ez":"他去年赚了不少钱。","ey":"Tā qùnián zhuàn le bù shǎo qián.","ev":"Năm ngoái anh ấy kiếm được không ít tiền."}],[{"h":"调查","p":"diào chá","v":"điều tra, khảo sát","ez":"老师调查了同学们的爱好。","ey":"Lǎoshī diàochá le tóngxuémen de àihào.","ev":"Thầy giáo đã khảo sát sở thích của các bạn học sinh."},{"h":"原来","p":"yuán lái","v":"Ban đầu","ez":"他原来在北京工作，现在回上海了。","ey":"Tā yuánlái zài Běijīng gōngzuò, xiànzài huí Shànghǎi le.","ev":"Ban đầu anh ấy làm việc ở Bắc Kinh, giờ về Thượng Hải rồi."},{"h":"计划","p":"jì huà","v":"Kế hoạch; vạch kế hoạch","ez":"我计划下个月去旅游。","ey":"Wǒ jìhuà xià ge yuè qù lǚyóu.","ev":"Tôi dự định tháng sau đi du lịch."},{"h":"提前","p":"tí qián","v":"Làm việc gì đó sớm hơn quy định/ trước thời hạn","ez":"会议提前到明天上午了。","ey":"Huìyì tíqián dào míngtiān shàngwǔ le.","ev":"Cuộc họp được dời sớm lên sáng mai."},{"h":"保证","p":"bǎo zhèng","v":"Cam đoan, bảo đảm","ez":"我保证明天不会迟到。","ey":"Wǒ bǎozhèng míngtiān bú huì chídào.","ev":"Tôi bảo đảm ngày mai sẽ không đến muộn."},{"h":"提醒","p":"tí xǐng","v":"Nhắc nhở","ez":"请你提醒我八点开会。","ey":"Qǐng nǐ tíxǐng wǒ bā diǎn kāi huì.","ev":"Nhờ cậu nhắc tôi tám giờ đi họp."},{"h":"乱","p":"luàn","v":"Lộn xộn, lúng túng","ez":"他的房间又脏又乱。","ey":"Tā de fángjiān yòu zāng yòu luàn.","ev":"Phòng của cậu ấy vừa bẩn vừa bừa bộn."}],[{"h":"生意","p":"shēng yi","v":"Việc kinh doanh, buôn bán","ez":"他家的小饭馆生意很好。","ey":"Tā jiā de xiǎo fànguǎn shēngyi hěn hǎo.","ev":"Quán ăn nhỏ của nhà cậu ấy buôn bán rất tốt."},{"h":"谈","p":"tán","v":"Nói chuyện, thảo luận","ez":"我想跟你谈谈学习的事。","ey":"Wǒ xiǎng gēn nǐ tántan xuéxí de shì.","ev":"Tôi muốn nói chuyện với cậu về việc học."},{"h":"并","p":"bìng","v":"Được dùng trước từ phủ định để nhấn mạnh","ez":"这道题并不难，你再想想。","ey":"Zhè dào tí bìng bù nán, nǐ zài xiǎngxiang.","ev":"Bài này chẳng khó chút nào, cậu nghĩ lại xem."},{"h":"积累","p":"jī lěi","v":"Tích lũy","ez":"学习汉语要一天一天地积累。","ey":"Xuéxí Hànyǔ yào yì tiān yì tiān de jīlěi.","ev":"Học tiếng Trung phải tích lũy từng ngày một."},{"h":"经验","p":"jīng yàn","v":"kinh nghiệm","ez":"他做这个工作很有经验。","ey":"Tā zuò zhège gōngzuò hěn yǒu jīngyàn.","ev":"Anh ấy rất có kinh nghiệm làm công việc này."},{"h":"一切","p":"yí qiè","v":"Tất cả","ez":"别担心，一切都会好的。","ey":"Bié dānxīn, yíqiè dōu huì hǎo de.","ev":"Đừng lo, mọi chuyện rồi sẽ ổn thôi."}],[{"h":"按照","p":"ànzhào","v":"giới. theo","ez":"我们按照老师说的去做。","ey":"Wǒmen ànzhào lǎoshī shuō de qù zuò.","ev":"Chúng tôi làm theo lời thầy giáo nói."},{"h":"成功","p":"chéng gōng","v":"Thành công","ez":"经过努力，他终于成功了。","ey":"Jīngguò nǔlì, tā zhōngyú chénggōng le.","ev":"Qua bao cố gắng, cuối cùng anh ấy cũng thành công."},{"h":"顺利","p":"shùn lì","v":"Thuận lợi, suôn sẻ","ez":"今天的会开得很顺利。","ey":"Jīntiān de huì kāi de hěn shùnlì.","ev":"Cuộc họp hôm nay diễn ra rất suôn sẻ."},{"h":"感谢","p":"gǎn xiè","v":"Cảm ơn","ez":"非常感谢你的帮助。","ey":"Fēicháng gǎnxiè nǐ de bāngzhù.","ev":"Rất cảm ơn sự giúp đỡ của cậu."},{"h":"消息","p":"xiāo xi","v":"Tin tức","ez":"我听到了一个好消息。","ey":"Wǒ tīngdào le yí ge hǎo xiāoxi.","ev":"Tôi vừa nghe được một tin tốt."},{"h":"按时","p":"àn shí","v":"Đúng hạn","ez":"你要按时吃药，别忘了。","ey":"Nǐ yào ànshí chī yào, bié wàng le.","ev":"Cậu phải uống thuốc đúng giờ, đừng quên đấy."},{"h":"奖金","p":"jiǎng jīn","v":"Tiền thưởng","ez":"这个月公司给我们发了奖金。","ey":"Zhège yuè gōngsī gěi wǒmen fā le jiǎngjīn.","ev":"Tháng này công ty phát tiền thưởng cho chúng tôi."}],[{"h":"工资","p":"gōng zī","v":"Tiền lương","ez":"他每个月的工资不太高。","ey":"Tā měi ge yuè de gōngzī bú tài gāo.","ev":"Lương mỗi tháng của anh ấy không cao lắm."},{"h":"方法","p":"fāng fǎ","v":"Phương pháp, cách thức","ez":"这个学习方法对我很有用。","ey":"Zhège xuéxí fāngfǎ duì wǒ hěn yǒuyòng.","ev":"Phương pháp học này rất hữu ích với tôi."},{"h":"知识","p":"zhī shi","v":"Kiến thức","ez":"读书能让我们学到很多知识。","ey":"Dú shū néng ràng wǒmen xuédào hěn duō zhīshi.","ev":"Đọc sách giúp chúng ta học được nhiều kiến thức."},{"h":"不得不","p":"bù dé bù","v":"Phải, không thể không","ez":"他病了，不得不请一天假。","ey":"Tā bìng le, bùdébù qǐng yì tiān jià.","ev":"Anh ấy ốm nên đành phải xin nghỉ một ngày."},{"h":"甚至","p":"shèn zhì","v":"Thậm chí","ez":"他很忙，甚至连午饭都没吃。","ey":"Tā hěn máng, shènzhì lián wǔfàn dōu méi chī.","ev":"Anh ấy bận đến mức thậm chí cơm trưa cũng không ăn."},{"h":"责任","p":"zé rèn","v":"Trách nhiệm","ez":"照顾好孩子是父母的责任。","ey":"Zhàogù hǎo háizi shì fùmǔ de zérèn.","ev":"Chăm sóc tốt con cái là trách nhiệm của cha mẹ."}]],"texts":[{"no":1,"tz":"小林和小李聊小李的工作","tv":"Tiểu Lâm và Tiểu Lý nói chuyện về công việc của Tiểu Lý","lines":[{"s":"小林","z":"听说你又换工作了？今年已经换了三次工作了吧？","p":"Tīngshuō nǐ yòu huàn gōngzuò le? Jīnnián yǐjīng huànle sān cì gōngzuò le ba?","v":"Nghe nói cậu lại đổi việc à? Năm nay đổi ba lần việc rồi đúng không?"},{"s":"小李","z":"别提了！我以为新工作比以前的好，没想到还没有以前好呢。","p":"Bié tí le! Wǒ yǐwéi xīn gōngzuò bǐ yǐqián de hǎo, méi xiǎngdào hái méiyǒu yǐqián hǎo ne.","v":"Đừng nhắc nữa! Tớ cứ tưởng việc mới tốt hơn việc cũ, ai ngờ còn không bằng việc trước."},{"s":"小林","z":"上次那份工作你只做了两个月就离开了，其实，完全适应一个新的工作需要一年时间，所以，经常换工作不一定好。","p":"Shàng cì nà fèn gōngzuò nǐ zhǐ zuòle liǎng ge yuè jiù líkāi le, qíshí, wánquán shìyìng yí ge xīn de gōngzuò xūyào yì nián shíjiān, suǒyǐ, jīngcháng huàn gōngzuò bù yídìng hǎo.","v":"Công việc lần trước cậu mới làm hai tháng đã nghỉ. Thật ra, để thích nghi hoàn toàn với một công việc mới cần đến một năm, cho nên đổi việc liên tục chưa chắc đã tốt."},{"s":"小李","z":"我也明白。但是那份工作的收入太少了！","p":"Wǒ yě míngbai. Dànshì nà fèn gōngzuò de shōurù tài shǎo le!","v":"Tớ cũng hiểu chứ. Nhưng thu nhập của công việc đó ít quá!"},{"s":"小林","z":"你才到新公司，不要太急着赚钱，多学习才是最重要的。","p":"Nǐ cái dào xīn gōngsī, búyào tài jízhe zhuàn qián, duō xuéxí cái shì zuì zhòngyào de.","v":"Cậu vừa mới vào công ty mới, đừng nôn nóng kiếm tiền quá, học hỏi nhiều mới là điều quan trọng nhất."},{"s":"小李","z":"好。我一定会努力把现在这份工作做好。","p":"Hǎo. Wǒ yídìng huì nǔlì bǎ xiànzài zhè fèn gōngzuò zuòhǎo.","v":"Được. Tớ nhất định sẽ cố gắng làm tốt công việc hiện tại này."}]},{"no":2,"tz":"王经理和小李在说工作","tv":"Giám đốc Vương và Tiểu Lý bàn về công việc","lines":[{"s":"王经理","z":"那份调查还要多长时间才能做完？","p":"Nà fèn diàochá hái yào duō cháng shíjiān cái néng zuòwán?","v":"Bản khảo sát đó còn bao lâu nữa mới làm xong?"},{"s":"小李","z":"按原来的计划应该是两周，但是我们可以提前完成，周末保证做完。","p":"Àn yuánlái de jìhuà yīnggāi shì liǎng zhōu, dànshì wǒmen kěyǐ tíqián wánchéng, zhōumò bǎozhèng zuòwán.","v":"Theo kế hoạch ban đầu thì phải hai tuần, nhưng chúng tôi có thể hoàn thành sớm hơn, cuối tuần bảo đảm xong."},{"s":"王经理","z":"虽然最近工作很忙，但你们也要注意身体啊。","p":"Suīrán zuìjìn gōngzuò hěn máng, dàn nǐmen yě yào zhùyì shēntǐ a.","v":"Tuy dạo này công việc rất bận, nhưng các cậu cũng phải chú ý sức khoẻ đấy."},{"s":"小李","z":"谢谢您！现在有很多事情等着我做，真不知道该先做哪个好。","p":"Xièxie nín! Xiànzài yǒu hěn duō shìqing děngzhe wǒ zuò, zhēn bù zhīdào gāi xiān zuò nǎge hǎo.","v":"Cảm ơn giám đốc! Bây giờ có bao nhiêu việc đang chờ tôi làm, thật không biết nên làm việc nào trước."},{"s":"王经理","z":"每天早上我都把当天计划要做的事情写在笔记本上，提醒自己安排好时间。你也可以试试这样做。","p":"Měi tiān zǎoshang wǒ dōu bǎ dàngtiān jìhuà yào zuò de shìqing xiě zài bǐjìběn shang, tíxǐng zìjǐ ānpái hǎo shíjiān. Nǐ yě kěyǐ shìshi zhèyàng zuò.","v":"Sáng nào tôi cũng ghi những việc dự định làm trong ngày vào sổ tay, để nhắc mình sắp xếp thời gian cho tốt. Cậu cũng có thể thử làm như vậy."},{"s":"小李","z":"这个办法真不错！这样我就不会手忙脚乱了。","p":"Zhège bànfǎ zhēn búcuò! Zhèyàng wǒ jiù bú huì shǒumángjiǎoluàn le.","v":"Cách này hay thật! Như vậy tôi sẽ không còn luống cuống tay chân nữa."}]},{"no":3,"tz":"王经理和马经理在说工作","tv":"Giám đốc Vương và giám đốc Mã nói chuyện công việc","lines":[{"s":"王经理","z":"什么事让你这么高兴啊？","p":"Shénme shì ràng nǐ zhème gāoxìng a?","v":"Chuyện gì mà làm anh vui thế?"},{"s":"马经理","z":"我们和上次那个公司的生意终于谈成了。","p":"Wǒmen hé shàng cì nàge gōngsī de shēngyi zhōngyú tánchéng le.","v":"Vụ làm ăn với công ty lần trước cuối cùng cũng đàm phán xong rồi."},{"s":"王经理","z":"太好了！你工作那么努力，公司会越来越好的。","p":"Tài hǎo le! Nǐ gōngzuò nàme nǔlì, gōngsī huì yuè lái yuè hǎo de.","v":"Tốt quá! Anh làm việc chăm chỉ như thế, công ty sẽ ngày càng phát triển thôi."},{"s":"马经理","z":"我原来以为做生意很简单，后来才发现其实并不容易，现在赚钱越来越难了。","p":"Wǒ yuánlái yǐwéi zuò shēngyi hěn jiǎndān, hòulái cái fāxiàn qíshí bìng bù róngyì, xiànzài zhuàn qián yuè lái yuè nán le.","v":"Ban đầu tôi cứ tưởng buôn bán rất đơn giản, về sau mới phát hiện thật ra chẳng hề dễ, bây giờ kiếm tiền ngày càng khó."},{"s":"王经理","z":"慢慢来，万事开头难，重要的是要多积累经验。","p":"Mànmàn lái, wànshì kāitóu nán, zhòngyào de shì yào duō jīlěi jīngyàn.","v":"Từ từ thôi, vạn sự khởi đầu nan, quan trọng là phải tích lũy nhiều kinh nghiệm."},{"s":"马经理","z":"我相信经过我们大家的努力，公司的生意会越做越大，一切都会好的。","p":"Wǒ xiāngxìn jīngguò wǒmen dàjiā de nǔlì, gōngsī de shēngyi huì yuè zuò yuè dà, yíqiè dōu huì hǎo de.","v":"Tôi tin rằng qua nỗ lực của tất cả chúng ta, việc làm ăn của công ty sẽ càng làm càng lớn, mọi thứ rồi sẽ tốt đẹp."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"我们今年的工作都已经按照计划完成了。","p":"Wǒmen jīnnián de gōngzuò dōu yǐjīng ànzhào jìhuà wánchéng le.","v":"Công việc năm nay của chúng ta đều đã hoàn thành theo đúng kế hoạch."},{"s":"","z":"这一段时间，尽管工作很紧张，中间也遇到了很多困难，但是因为有大家的努力，我们成功地解决了问题，顺利地完成了工作，非常感谢大家对我的帮助！","p":"Zhè yí duàn shíjiān, jǐnguǎn gōngzuò hěn jǐnzhāng, zhōngjiān yě yùdàole hěn duō kùnnan, dànshì yīnwèi yǒu dàjiā de nǔlì, wǒmen chénggōng de jiějuéle wèntí, shùnlì de wánchéngle gōngzuò, fēicháng gǎnxiè dàjiā duì wǒ de bāngzhù!","v":"Thời gian vừa qua, mặc dù công việc rất căng thẳng, giữa chừng cũng gặp không ít khó khăn, nhưng nhờ sự nỗ lực của mọi người, chúng ta đã giải quyết vấn đề thành công, hoàn thành công việc một cách suôn sẻ. Rất cảm ơn sự giúp đỡ mọi người dành cho tôi!"},{"s":"","z":"另外，马经理让我告诉大家一个好消息，因为大家按时完成了工作，公司决定这个月给每人多发三千元奖金。","p":"Lìngwài, Mǎ jīnglǐ ràng wǒ gàosu dàjiā yí ge hǎo xiāoxi, yīnwèi dàjiā ànshí wánchéngle gōngzuò, gōngsī juédìng zhège yuè gěi měi rén duō fā sānqiān yuán jiǎngjīn.","v":"Ngoài ra, giám đốc Mã bảo tôi báo với mọi người một tin vui: vì mọi người đã hoàn thành công việc đúng hạn, công ty quyết định tháng này phát thêm cho mỗi người ba nghìn tệ tiền thưởng."},{"s":"","z":"感谢大家这三个多月的努力工作，希望明年能有更大的成绩。","p":"Gǎnxiè dàjiā zhè sān ge duō yuè de nǔlì gōngzuò, xīwàng míngnián néng yǒu gèng dà de chéngjì.","v":"Cảm ơn hơn ba tháng làm việc nỗ lực của mọi người, hy vọng sang năm chúng ta sẽ đạt được thành tích lớn hơn."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"年轻人刚开始工作的时候，不要太急着赚钱，不要眼睛里只有工资和奖金。","p":"Niánqīngrén gāng kāishǐ gōngzuò de shíhou, búyào tài jízhe zhuàn qián, búyào yǎnjing lǐ zhǐ yǒu gōngzī hé jiǎngjīn.","v":"Người trẻ khi mới bắt đầu đi làm, đừng quá nôn nóng kiếm tiền, đừng để trong mắt chỉ có lương và tiền thưởng."},{"s":"","z":"在工作的前几年，重要的是丰富自己的工作经验，学习与同事交流的方法，积累专业知识，这些比收入重要多了。","p":"Zài gōngzuò de qián jǐ nián, zhòngyào de shì fēngfù zìjǐ de gōngzuò jīngyàn, xuéxí yǔ tóngshì jiāoliú de fāngfǎ, jīlěi zhuānyè zhīshi, zhèxiē bǐ shōurù zhòngyào duō le.","v":"Trong vài năm đầu đi làm, điều quan trọng là làm giàu kinh nghiệm làm việc của mình, học cách giao tiếp với đồng nghiệp, tích lũy kiến thức chuyên môn — những thứ đó quan trọng hơn thu nhập nhiều."},{"s":"","z":"但是很多时候，我们不得不去做一些自己不愿意做甚至是非常不喜欢的工作。","p":"Dànshì hěn duō shíhou, wǒmen bùdébù qù zuò yìxiē zìjǐ bú yuànyì zuò shènzhì shì fēicháng bù xǐhuan de gōngzuò.","v":"Nhưng nhiều khi, chúng ta buộc phải làm những công việc mình không muốn làm, thậm chí là rất ghét."},{"s":"","z":"这时，我们最需要的就是对工作的责任心。","p":"Zhè shí, wǒmen zuì xūyào de jiùshì duì gōngzuò de zérènxīn.","v":"Lúc đó, thứ chúng ta cần nhất chính là tinh thần trách nhiệm với công việc."},{"s":"","z":"一个人即使能力再高，经验再丰富，如果对工作没有责任心，也很难把工作做好。","p":"Yí ge rén jíshǐ nénglì zài gāo, jīngyàn zài fēngfù, rúguǒ duì gōngzuò méiyǒu zérènxīn, yě hěn nán bǎ gōngzuò zuòhǎo.","v":"Một người dù năng lực cao đến mấy, kinh nghiệm phong phú đến mấy, nếu không có trách nhiệm với công việc thì cũng rất khó làm tốt công việc."}]}],"gram":[{"id":"yiwei-meixiangdao","t":"以为……，没想到…… / 原来以为……，后来才发现……","s":"Cứ tưởng là… ai ngờ / hoá ra lại…","b":"<b>以为</b> dùng khi người nói <b>nhận định sai</b>: điều mình nghĩ trong đầu không đúng với sự thật. Vì vậy nó gần như luôn đi kèm một vế đảo lại như <b>没想到</b>, <b>后来才发现</b>, <b>其实</b>. Nếu điều mình nghĩ là đúng thì phải dùng <b>认为</b> hoặc <b>觉得</b>, không dùng 以为.","r":["Trật tự: Chủ ngữ + 以为 + mệnh đề；vế sau thường mở đầu bằng 没想到 / 其实 / 后来才发现.","Hay thêm 原来、本来 phía trước để nhấn mạnh “lúc đầu tôi tưởng”: 我原来以为……","以为 chỉ dùng cho suy nghĩ của người, không dùng cho phán đoán khách quan: ✗ 大家都以为他是最好的老师（ý khen thật）→ ✓ 大家都认为他是最好的老师。","Lỗi hay gặp: ✗ 我以为新工作比以前的好，所以我很高兴。→ ✓ 我以为新工作比以前的好，没想到还没有以前好呢。"],"e":[["我以为新工作比以前的好，没想到还没有以前好呢。","Wǒ yǐwéi xīn gōngzuò bǐ yǐqián de hǎo, méi xiǎngdào hái méiyǒu yǐqián hǎo ne.","Tớ cứ tưởng việc mới tốt hơn việc cũ, ai ngờ còn không bằng việc trước <i>(bài khoá 1)</i>"],["我原来以为做生意很简单，后来才发现其实并不容易。","Wǒ yuánlái yǐwéi zuò shēngyi hěn jiǎndān, hòulái cái fāxiàn qíshí bìng bù róngyì.","Ban đầu tôi cứ tưởng buôn bán rất đơn giản, về sau mới phát hiện thật ra chẳng dễ chút nào <i>(bài khoá 3)</i>"]],"d":[["我本来____这件事情会很顺利，没想到遇到这么多困难。","以为"],["我原来以为做生意很简单，后来才发现其实____不容易。","并"],["别提了！我以为新工作比以前的好，________还没有以前好呢。","没想到"]],"w":"以为 = “tưởng (sai)”, 认为 = “cho rằng (nghiêm túc, thường đúng)”. Nghe thấy 我以为…… là biết ngay câu sau sẽ lật ngược lại."},{"id":"bing-bu-mei","t":"并 + 不/没(有) + động từ/tính từ","s":"(Thực ra) chẳng hề…, không hề như bạn nghĩ","b":"<b>并</b> là phó văn ngữ khí, đặt <b>ngay trước 不 hoặc 没(有)</b> để phủ định lại một điều mà người nghe đang tưởng là đúng. Nó không thêm nghĩa mới, chỉ thêm sắc thái “thật ra không phải vậy đâu”. Vì thế 并 chỉ đi với phủ định, không bao giờ đứng trước câu khẳng định.","r":["Trật tự cố định: 并 + 不/没有 + V/Adj. ✗ 并他没有告诉我。→ ✓ 他并没有告诉我。","并 đứng SAU chủ ngữ, không đứng đầu câu.","Không tách 并 ra khỏi từ phủ định: ✗ 不并适合你。→ ✓ 并不适合你。","Với động từ tâm lý/trạng thái dùng 并不: ✗ 我并没知道你有这个习惯。→ ✓ 我并不知道你有这个习惯。"],"e":[["我原来以为做生意很简单，后来才发现其实并不容易。","Wǒ yuánlái yǐwéi zuò shēngyi hěn jiǎndān, hòulái cái fāxiàn qíshí bìng bù róngyì.","Ban đầu tôi tưởng buôn bán rất đơn giản, sau mới thấy thật ra chẳng hề dễ <i>(bài khoá 3)</i>"]],"d":[["A: 咱们明天下午两点去看电影，马克没告诉你吗？ B: 我不知道啊，他____没有告诉我。","并"],["A: 不管是冬天还是夏天，我都习惯在早上锻炼身体。 B: 我____不知道你有这个习惯。","并"],["A: 我跟你的学习方法差不多，为什么我的汉语水平没有提高呢？ B: 可能这种学习方法____适合你。","并不"]],"w":"并 chỉ bám vào 不/没; muốn nhấn mạnh khẳng định thì dùng 的确、确实 chứ không dùng 并."},{"id":"yuanlai-benlai","t":"原来 ↔ 本来","s":"Ban đầu / vốn dĩ — và “hoá ra là”","b":"Cả hai đều có nghĩa “lúc đầu, vốn là” và ở nghĩa này <b>dùng thay nhau được</b> (原来/本来的计划). Nhưng <b>原来</b> còn một nghĩa riêng mà 本来 không có: <b>“hoá ra, thì ra là”</b> — dùng khi bất chợt phát hiện sự thật. Ngược lại, <b>本来</b> mạnh hơn ở ý “vốn định… nhưng sau đó đổi”.","r":["Nghĩa “ban đầu”: 原来/本来 + danh từ (的) hoặc + mệnh đề — 按原来的计划、本来我星期二就能回来.","Nghĩa “thì ra là” (phát hiện điều chưa biết): CHỈ dùng 原来 — 才发现原来我认错人了。 ✗ 才发现本来我认错人了。","本来 hay đi với 但是/可是 để nói kế hoạch bị thay đổi.","Lỗi hay gặp: ✗ 原来我想去，但是没时间（ý nói dự định bị đổi）→ ✓ 本来我想去，但是没时间。"],"e":[["按原来的计划应该是两周，但是我们可以提前完成。","Àn yuánlái de jìhuà yīnggāi shì liǎng zhōu, dànshì wǒmen kěyǐ tíqián wánchéng.","Theo kế hoạch ban đầu thì phải hai tuần, nhưng chúng tôi có thể hoàn thành sớm hơn <i>(bài khoá 2)</i>"],["我原来以为做生意很简单，后来才发现其实并不容易。","Wǒ yuánlái yǐwéi zuò shēngyi hěn jiǎndān, hòulái cái fāxiàn qíshí bìng bù róngyì.","Ban đầu tôi tưởng buôn bán rất đơn giản, sau mới phát hiện thật ra chẳng dễ <i>(bài khoá 3)</i>"]],"d":[["________我大学是学中文专业的，只是后来当了律师。","原来/本来 (đều được)"],["______我星期二就能回来，但是公司让我再调查一下，所以我就留下继续工作了。","本来"],["我在后面叫她，可她一直没回头。等到了她身边，才发现______我认错人了。","原来"]],"w":"Mẹo: câu có 但是/可是 + kế hoạch bị đổi → 本来; câu có 才发现/才知道 + sự thật bất ngờ → 原来."},{"id":"anzhao","t":"按照 / 按 + danh từ + động từ","s":"Theo, làm đúng theo (kế hoạch, quy định, lời dặn)","b":"<b>按照</b> là giới từ, đứng <b>trước danh từ</b> chỉ tiêu chuẩn hay căn cứ (计划、安排、规定、要求), tạo thành cụm trạng ngữ đặt <b>trước động từ</b>. Dạng rút gọn <b>按</b> dùng khi danh từ ngắn (按原来的计划、按时). Sau 按照 không đặt được động từ trần trụi.","r":["Trật tự: (Chủ ngữ) + 按照 + danh từ + động từ. ✗ 我们完成了按照计划。→ ✓ 我们按照计划完成了。","Cụm 按照…… có thể đưa lên đầu câu làm bối cảnh: 按照我们现在的安排，……","Sau 按照 phải là danh từ/cụm danh từ; nếu muốn dùng một mệnh đề thì thêm 的 + 名词: 按照我说的写、按照经理说的做.","Lỗi hay gặp: ✗ 按照工作很忙。→ ✓ 按照公司的规定……"],"e":[["我们今年的工作都已经按照计划完成了。","Wǒmen jīnnián de gōngzuò dōu yǐjīng ànzhào jìhuà wánchéng le.","Công việc năm nay của chúng ta đều đã hoàn thành theo đúng kế hoạch <i>(bài khoá 4)</i>"],["按原来的计划应该是两周，但是我们可以提前完成。","Àn yuánlái de jìhuà yīnggāi shì liǎng zhōu, dànshì wǒmen kěyǐ tíqián wánchéng.","Theo kế hoạch ban đầu thì phải hai tuần, nhưng chúng tôi có thể làm xong sớm hơn <i>(bài khoá 2)</i>"]],"d":[["按照我们现在的安排，____________________。","我们可能完不成今年的工作了"],["记得按照我说的写，____________________。","别再写错了"],["经理说得对，____________________。","只要按照计划工作，就一定能按时完成"]],"w":"按时 (đúng giờ, đúng hạn) là một từ cố định, không phải 按照 + 时; đừng viết ✗ 按照时完成."},{"id":"shenzhi","t":"甚至(连)……都/也……","s":"Thậm chí… cũng…","b":"<b>甚至</b> nêu ra <b>trường hợp cực đoan nhất</b> trong một chuỗi ý đã nói, để đẩy mức độ lên cao. Nó có thể nối hai thành phần cùng loại trong một câu (không愿意做甚至非常不喜欢), hoặc mở đầu một mệnh đề mới. Rất hay đi cặp với <b>连……都/也</b>.","r":["Vị trí: trước thành phần cực đoan nhất, đứng SAU thông tin bình thường: A，甚至 B（B mạnh hơn A）.","Kết cấu đầy đủ: 甚至连 + đối tượng + 都/也 + động từ — 甚至连妈妈有时候都会弄错.","Thường phối hợp với 不但……甚至…… để tăng cấp: 他不但不喜欢，甚至非常讨厌。","Lỗi hay gặp: ✗ 甚至他非常讨厌这个工作，他不喜欢现在的工作。→ ✓ 他不但不喜欢现在的工作，甚至非常讨厌这个工作。"],"e":[["但是很多时候，我们不得不去做一些自己不愿意做甚至是非常不喜欢的工作。","Dànshì hěn duō shíhou, wǒmen bùdébù qù zuò yìxiē zìjǐ bú yuànyì zuò shènzhì shì fēicháng bù xǐhuan de gōngzuò.","Nhưng nhiều khi, chúng ta buộc phải làm những việc mình không muốn làm, thậm chí là cực kỳ ghét <i>(bài khoá 5)</i>"]],"d":[["他说他不但不喜欢现在的工作，______非常讨厌这个工作。","甚至"],["你怎么可能不认识他呢？_______________________________。","他那么有名，甚至小孩子都知道他是谁"],["她们俩长得太像了，___________________________。","甚至连妈妈有时候都会弄错"],["马克怎么这么早就睡觉了？_____________________________。","他快累死了，甚至晚饭都没吃就去睡了"]],"w":"甚至 khác 而且: 而且 chỉ “thêm một ý nữa” (ngang hàng), còn 甚至 phải là ý MẠNH HƠN, bất ngờ hơn ý trước."},{"id":"ba-zi-ju","t":"把 + tân ngữ + động từ + 好/在……/成……","s":"Câu chữ 把: xử lý cái gì đó cho ra kết quả","b":"Câu chữ <b>把</b> đưa tân ngữ lên trước động từ để nhấn vào <b>kết quả xử lý</b> của hành động. Động từ trong câu 把 <b>không được đứng trơ trọi</b>, phía sau bắt buộc có thành phần kết quả: 好、完、在+nơi chốn、成、给+người, hoặc 了.","r":["Công thức: Chủ ngữ + 把 + tân ngữ (xác định) + động từ + thành phần kết quả.","Tân ngữ sau 把 phải là cái người nghe đã biết (这份工作、当天要做的事情), không dùng cho vật phiếm chỉ: ✗ 我把一本书看完了。","Phó từ và trợ động từ (都、也、一定、会、可以、不) đặt TRƯỚC 把: 我一定会努力把这份工作做好。 ✗ 把一定会……","Lỗi hay gặp: ✗ 我把工作做。→ ✓ 我把工作做好。"],"e":[["我一定会努力把现在这份工作做好。","Wǒ yídìng huì nǔlì bǎ xiànzài zhè fèn gōngzuò zuòhǎo.","Tớ nhất định sẽ cố gắng làm tốt công việc hiện tại này <i>(bài khoá 1)</i>"],["每天早上我都把当天计划要做的事情写在笔记本上。","Měi tiān zǎoshang wǒ dōu bǎ dàngtiān jìhuà yào zuò de shìqing xiě zài bǐjìběn shang.","Sáng nào tôi cũng ghi những việc dự định làm trong ngày vào sổ tay <i>(bài khoá 2)</i>"]],"d":[["我一定会努力____现在这份工作做好。","把"],["每天早上我都把当天计划要做的事情写____笔记本上。","在"],["如果对工作没有责任心，也很难把工作做____。","好"]],"w":"Đừng nhầm 把 với 被: 把 nhìn từ phía người làm (我把工作做好了), 被 nhìn từ phía vật bị tác động (工作被我做好了)."},{"id":"yue-lai-yue","t":"越来越 + tính từ / 越 A 越 B","s":"Càng ngày càng… / càng… càng…","b":"<b>越来越</b> diễn tả mức độ tăng dần <b>theo thời gian</b>, đặt ngay trước tính từ hoặc động từ tâm lý. <b>越 A 越 B</b> thì diễn tả “B tăng theo A”, hai vế cùng một chủ ngữ. Cả hai kết cấu <b>không dùng với 很、非常</b>.","r":["越来越 + Adj / động từ tâm lý (喜欢、想). ✗ 越来越很难 → ✓ 越来越难.","越 + động từ/tính từ 1 + 越 + động từ/tính từ 2: 越做越大、越说越快.","Cuối câu thường có 了 (biến hoá đã xảy ra) hoặc 的 (khẳng định dự đoán): 越来越难了 / 会越来越好的.","Lỗi hay gặp: ✗ 生意越来越做大。→ ✓ 生意会越做越大。"],"e":[["你工作那么努力，公司会越来越好的。","Nǐ gōngzuò nàme nǔlì, gōngsī huì yuè lái yuè hǎo de.","Cậu làm việc chăm chỉ như thế, công ty sẽ ngày càng tốt lên thôi <i>(bài khoá 3)</i>"],["公司的生意会越做越大，一切都会好的。","Gōngsī de shēngyi huì yuè zuò yuè dà, yíqiè dōu huì hǎo de.","Việc làm ăn của công ty sẽ càng làm càng lớn, mọi thứ rồi sẽ tốt đẹp <i>(bài khoá 3)</i>"]],"d":[["现在赚钱________难了。","越来越"],["我相信公司的生意会____做____大。","越 / 越"],["你工作那么努力，公司会________好的。","越来越"]],"w":"越来越 nói về thay đổi theo THỜI GIAN; 越 A 越 B nói về quan hệ giữa HAI yếu tố. ✗ 越来越做越大."},{"id":"jishi-zai-ye","t":"即使……(再 + Adj)……，也……","s":"Cho dù… đến mấy thì cũng…","b":"<b>即使……也……</b> nêu một giả thiết nhượng bộ: dù điều kiện có tốt/xấu đến mấy, kết quả ở vế sau vẫn không đổi. Trong vế đầu rất hay dùng <b>再 + tính từ</b> để đẩy mức độ lên tối đa (能力再高 = năng lực cao đến mấy). Vế sau bắt buộc có <b>也</b>.","r":["Công thức: 即使 + giả thiết，(chủ ngữ) 也 + kết quả. Không được bỏ 也.","即使 nói về việc CHƯA xảy ra (giả định); 虽然 nói về việc CÓ THẬT. ✗ 即使最近工作很忙，但你们也要注意身体（thực tế đang bận）→ dùng 虽然.","再 + Adj trong vế đầu không cần 很: 能力再高、经验再丰富.","Lỗi hay gặp: ✗ 即使他没有责任心，很难把工作做好。→ ✓ 即使他没有责任心，也很难把工作做好。"],"e":[["一个人即使能力再高，经验再丰富，如果对工作没有责任心，也很难把工作做好。","Yí ge rén jíshǐ nénglì zài gāo, jīngyàn zài fēngfù, rúguǒ duì gōngzuò méiyǒu zérènxīn, yě hěn nán bǎ gōngzuò zuòhǎo.","Một người dù năng lực có cao đến mấy, kinh nghiệm có phong phú đến mấy, nếu không có trách nhiệm với công việc thì cũng khó làm tốt được <i>(bài khoá 5)</i>"]],"d":[["一个人____能力再高，经验再丰富，如果对工作没有责任心，____很难把工作做好。","即使 / 也"],["一个人即使能力____高，经验____丰富，也要有责任心。","再 / 再"],["即使这份工作的收入少一点儿，我____想做下去。","也"]],"w":"即使……也…… (giả định) ≠ 虽然……但是…… (sự thật). Nhìn vào vế sau: 也 đi với 即使, 但是 đi với 虽然."},{"id":"suiran-jinguan","t":"虽然/尽管……，但是(但)……也/还……","s":"Tuy… nhưng…","b":"Cặp liên từ nhượng bộ: vế đầu thừa nhận một sự thật, vế sau nêu điều ngược lại vẫn xảy ra. <b>尽管</b> là cách nói trang trọng hơn <b>虽然</b>, hay gặp trong văn viết và báo cáo. Trong tiếng Trung hai vế <b>đều giữ liên từ</b>, khác tiếng Việt chỉ cần “tuy… nhưng”.","r":["虽然/尽管 đứng đầu vế 1 (trước hoặc sau chủ ngữ đều được); 但是/但/可是 đứng đầu vế 2.","Vế 2 thường thêm 也、还、仍然 để nhấn: 但你们也要注意身体啊.","Không dùng chung với 因为/所以 trong cùng một cặp: ✗ 虽然工作很忙，所以要注意身体。","Lỗi hay gặp (dịch thẳng từ tiếng Việt): ✗ 虽然工作很紧张，遇到了很多困难。→ ✓ 尽管工作很紧张，但是……"],"e":[["虽然最近工作很忙，但你们也要注意身体啊。","Suīrán zuìjìn gōngzuò hěn máng, dàn nǐmen yě yào zhùyì shēntǐ a.","Tuy dạo này công việc rất bận, nhưng các cậu cũng phải chú ý sức khoẻ đấy <i>(bài khoá 2)</i>"],["尽管工作很紧张，中间也遇到了很多困难，但是因为有大家的努力，我们成功地解决了问题。","Jǐnguǎn gōngzuò hěn jǐnzhāng, zhōngjiān yě yùdàole hěn duō kùnnan, dànshì yīnwèi yǒu dàjiā de nǔlì, wǒmen chénggōng de jiějuéle wèntí.","Mặc dù công việc rất căng thẳng, giữa chừng cũng gặp không ít khó khăn, nhưng nhờ sự cố gắng của mọi người, chúng ta đã giải quyết vấn đề thành công <i>(bài khoá 4)</i>"]],"d":[["____最近工作很忙，____你们也要注意身体啊。","虽然 / 但"],["这一段时间，____工作很紧张，中间也遇到了很多困难，____因为有大家的努力，我们成功地解决了问题。","尽管 / 但是"],["虽然那份工作的收入太少了，____我还是做了两个月。","但是"]],"w":"尽管 (dù cho, sự thật) khác 不管 (bất kể, chưa xác định — 不管是冬天还是夏天，我都……). Sau 不管 phải là câu hỏi chính phản hoặc 是……还是……."}],"notes":"1) Slide 88 chỉ là CÂU HỎI đọc hiểu (刚开始工作时，年轻人不要做什么？/ 对刚工作的年轻人来说，什么更重要？/ 我们为什么要对工作有责任心？) nên đã loại, không tính là bài khoá. 2) Slide 75 và slide 90 là bản ĐIỀN TỪ (có chỗ trống) của chính bài khoá 4 và bài khoá 5, không phải bài khoá riêng — đã dùng bản đầy đủ ở slide 74 và slide 89, không thêm câu tiếng Trung nào. 3) Hai bài đọc (slide 74 và 89) trong dữ liệu KHÔNG có tiêu đề; tiêu đề ở đây lấy nguyên văn một câu/cụm có sẵn trong chính đoạn văn (感谢大家这三个多月的努力工作 / 我们最需要的就是对工作的责任心), không tự đặt thêm câu tiếng Trung nào. 4) Pinyin trong slide bị đảo thứ tự dòng và gán sai người nói: ở slide 21 dòng pinyin đầu tiên ghi nhãn 小林 nhưng lại là nội dung câu 上次那份工作……; slide 36, 55 các dòng pinyin xếp lộn xộn; slide 74, 89 pinyin bị ngắt dòng giữa câu và trộn thứ tự (slide 89 còn dính lỗi tách chữ “yi/ɡe rén” ở 一个人). Toàn bộ pinyin trong file này đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 5) Lỗi chính tả trong chữ Hán của slide 55: 上次哪个公司 (đúng phải là 那个公司) — chữ Hán vẫn giữ NGUYÊN VĂN như slide, pinyin và bản dịch xử lý theo nghĩa 那个; đoạn này trong slide còn xuống dòng giữa chữ (越来\\n越难了) nhưng nội dung không thiếu. 6) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở trên được suy ra từ 练一练 (原来/本来, 并+不/没, 按照, 甚至) và từ cấu trúc nổi bật trong bài khoá (以为……没想到, 把字句, 越来越/越……越, 即使……也, 虽然/尽管……但是). 7) 练一练 lặp lại nguyên xi bài tập 原来/本来 hai lần (batch 2 và batch 4) — chỉ dùng một lần. 8) Các mục 练一练 còn lại là bài tập điền TỪ VỰNG thuần tuý (保证/一切, 完全/按时/顺利, 工资/责任/方法, 知识) chứ không phải điểm ngữ pháp, nên không đưa vào mục grammar; nội dung của chúng đã được tận dụng làm ví dụ trong phần drill. 9) Chữ Hán của cả 5 bài khoá trong slide là đầy đủ, không thiếu câu nào. 10) Slide 21 dùng dấu câu nửa thân ( ? ! : ) — đã chuẩn hoá thành dấu câu tiếng Trung ( ？！： ); nội dung chữ Hán giữ nguyên từng chữ. Các ví dụ trong phần ngữ pháp/từ mới đều là câu nguyên văn hoặc đoạn cắt tại ranh giới mệnh đề của chính bài khoá này, không có câu tiếng Trung nào được tự viết thêm.","order":[{"z":"听说你又换工作了？","t":["听说","你","又","换","工作","了"],"v":"Nghe nói cậu lại đổi việc à? Năm nay đổi ba lần việc rồi đúng không?"},{"z":"今年已经换了三次工作了吧？","t":["今年","已经","换","了","三次","工作","了","吧"],"v":"Nghe nói cậu lại đổi việc à? Năm nay đổi ba lần việc rồi đúng không?"},{"z":"但是那份工作的收入太少了！","t":["但是","那","份","工作","的","收入","太少","了"],"v":"Tớ cũng hiểu chứ. Nhưng thu nhập của công việc đó ít quá!"},{"z":"我一定会努力把现在这份工作做好。","t":["我","一定","会","努力","把","现在","这份","工作","做好"],"v":"Được. Tớ nhất định sẽ cố gắng làm tốt công việc hiện tại này."},{"z":"那份调查还要多长时间才能做完？","t":["那","份","调查","还要","多长时间","才能","做","完"],"v":"Bản khảo sát đó còn bao lâu nữa mới làm xong?"},{"z":"你也可以试试这样做。","t":["你","也","可以","试试","这样","做"],"v":"Sáng nào tôi cũng ghi những việc dự định làm trong ngày vào sổ tay, để nhắc mình sắp xếp thời gian cho tốt. Cậu cũng có thể thử là"},{"z":"这样我就不会手忙脚乱了。","t":["这样","我","就","不会","手忙脚乱","了"],"v":"Cách này hay thật! Như vậy tôi sẽ không còn luống cuống tay chân nữa."},{"z":"什么事让你这么高兴啊？","t":["什么","事","让","你","这么","高兴","啊"],"v":"Chuyện gì mà làm anh vui thế?"},{"z":"我们和上次那个公司的生意终于谈成了。","t":["我们","和","上次","那个","公司","的","生意","终于","谈成","了"],"v":"Vụ làm ăn với công ty lần trước cuối cùng cũng đàm phán xong rồi."},{"z":"你工作那么努力，公司会越来越好的。","t":["你","工作","那么","努力","公司","会","越来越","好","的"],"v":"Tốt quá! Anh làm việc chăm chỉ như thế, công ty sẽ ngày càng phát triển thôi."},{"z":"慢慢来，万事开头难，重要的是要多积累经验。","t":["慢慢来","万事开头难","重要","的","是","要","多","积累","经验"],"v":"Từ từ thôi, vạn sự khởi đầu nan, quan trọng là phải tích lũy nhiều kinh nghiệm."},{"z":"我们今年的工作都已经按照计划完成了。","t":["我们","今年","的","工作","都","已经","按照","计划","完成","了"],"v":"Công việc năm nay của chúng ta đều đã hoàn thành theo đúng kế hoạch."},{"z":"这时，我们最需要的就是对工作的责任心。","t":["这时","我们","最","需要","的","就是","对","工作","的","责任心"],"v":"Lúc đó, thứ chúng ta cần nhất chính là tinh thần trách nhiệm với công việc."},{"z":"按原来的计划应该是两周，但是我们可以提前完成。","t":["按","原来","的","计划","应该","是","两周","但是","我们","可以","提前完成"],"v":"Theo kế hoạch ban đầu thì phải hai tuần, nhưng chúng tôi có thể hoàn thành sớm hơn (bài khoá 2)"},{"z":"公司的生意会越做越大，一切都会好的。","t":["公司","的","生意","会","越做越","大","一切","都","会","好","的"],"v":"Việc làm ăn của công ty sẽ càng làm càng lớn, mọi thứ rồi sẽ tốt đẹp (bài khoá 3)"},{"z":"他从来不提以前的事。" ","ey":"Zhè jiàn shì wǒ xūyào kǎolǜ jǐ tiān.","ev":"Chuyện này tôi cần cân nhắc mấy hôm."},{"h":"标准","p":"biāozhǔn","v":"Tiêu chuẩn, chuẩn mực","ez":"每个人选朋友的标准都不一样。","ey":"Měi ge rén xuǎn péngyou de biāozhǔn dōu bù yíyàng.","ev":"Tiêu chuẩn chọn bạn của mỗi người đều khác nhau."},{"h":"年龄","p":"niánlíng","v":"Tuổi","ez":"这两个人年龄差不多。","ey":"Zhè liǎng ge rén niánlíng chàbuduō.","ev":"Hai người này tuổi tác xấp xỉ nhau."}],[{"h":"寄","p":"jì","v":"Gửi","ez":"我下午要去邮局寄一封信。","ey":"Wǒ xiàwǔ yào qù yóujú jì yì fēng xìn.","ev":"Chiều nay tôi phải ra bưu điện gửi một lá thư."},{"h":"受到","p":"shòudào","v":"Nhận được","ez":"他的表演受到了大家的欢迎。","ey":"Tā de biǎoyǎn shòudàole dàjiā de huānyíng.","ev":"Màn biểu diễn của anh ấy được mọi người hoan nghênh."},{"h":"购物","p":"gòuwù","v":"Mua sắm, mua hàng","ez":"周末我喜欢和朋友一起去购物。","ey":"Zhōumò wǒ xǐhuan hé péngyou yìqǐ qù gòuwù.","ev":"Cuối tuần tôi thích đi mua sắm cùng bạn bè."},{"h":"尤其","p":"yóuqí","v":"đặc biệt là, nhất là","ez":"我喜欢吃水果，尤其是西瓜。","ey":"Wǒ xǐhuan chī shuǐguǒ, yóuqí shì xīguā.","ev":"Tôi thích ăn hoa quả, nhất là dưa hấu."},{"h":"任何","p":"rènhé","v":"Bất cứ, bất kỳ","ez":"有任何问题都可以来问我。","ey":"Yǒu rènhé wèntí dōu kěyǐ lái wèn wǒ.","ev":"Có bất kỳ vấn đề gì đều có thể đến hỏi tôi."}]],"texts":[{"no":1,"tz":"王静在家具店买沙发","tv":"Vương Tĩnh mua ghế sofa ở cửa hàng nội thất","lines":[{"s":"售货员","z":"小姐，您好！您想买什么家具？需要我为您介绍一下吗？","p":"Xiǎojiě, nín hǎo! Nín xiǎng mǎi shénme jiājù? Xūyào wǒ wèi nín jièshào yíxià ma?","v":"Chào cô! Cô muốn mua đồ nội thất gì ạ? Cô có cần tôi giới thiệu qua một chút không?"},{"s":"王静","z":"谢谢，我想买沙发。","p":"Xièxie, wǒ xiǎng mǎi shāfā.","v":"Cảm ơn, tôi muốn mua ghế sofa."},{"s":"售货员","z":"您看这个沙发怎么样？现在正在打折，比平时便宜了一千块。","p":"Nín kàn zhège shāfā zěnmeyàng? Xiànzài zhèngzài dǎ zhé, bǐ píngshí piányile yìqiān kuài.","v":"Cô xem chiếc sofa này thế nào? Hiện đang giảm giá, rẻ hơn ngày thường những một nghìn tệ."},{"s":"王静","z":"价格还可以，就是不知道质量有没有保证。","p":"Jiàgé hái kěyǐ, jiùshì bù zhīdào zhìliàng yǒu méiyǒu bǎozhèng.","v":"Giá thì cũng được, chỉ có điều không biết chất lượng có bảo đảm không."},{"s":"售货员","z":"您放心，质量肯定不“打折”，这种沙发是今年最流行的。有很多种颜色可以选择，您可以看一下。","p":"Nín fàng xīn, zhìliàng kěndìng bù “dǎ zhé”, zhè zhǒng shāfā shì jīnnián zuì liúxíng de. Yǒu hěn duō zhǒng yánsè kěyǐ xuǎnzé, nín kěyǐ kàn yíxià.","v":"Cô cứ yên tâm, chất lượng thì chắc chắn không “giảm giá” đâu, loại sofa này là mẫu thịnh hành nhất năm nay. Có rất nhiều màu để chọn, cô xem thử xem."},{"s":"王静","z":"这个蓝色的看上去不错，就要这个吧。","p":"Zhège lánsè de kàn shàngqu búcuò, jiù yào zhège ba.","v":"Cái màu xanh này trông cũng đẹp, vậy lấy cái này đi."}]},{"no":2,"tz":"王静和李进在商场买东西","tv":"Lý Tiến và Vương Tĩnh đi mua đồ ở trung tâm thương mại","lines":[{"s":"王静","z":"咱家的冰箱太旧了，商场正好打折，我们顺便也买一台吧。","p":"Zán jiā de bīngxiāng tài jiù le, shāngchǎng zhèngzài dǎ zhé, wǒmen shùnbiàn yě mǎi yì tái ba.","v":"Tủ lạnh nhà mình cũ quá rồi, trung tâm thương mại đang giảm giá, nhân tiện mua luôn một cái đi."},{"s":"李进","z":"今天买的东西太多了。再说，这个月家里已经花了五千多了。","p":"Jīntiān mǎi de dōngxi tài duō le. Zàishuō, zhège yuè jiā li yǐjīng huāle wǔqiān duō le.","v":"Hôm nay mua nhiều đồ quá rồi. Hơn nữa, tháng này nhà mình đã tiêu hơn năm nghìn tệ."},{"s":"王静","z":"这么多？你不会是记错了吧？","p":"Zhème duō? Nǐ bú huì shì jìcuòle ba?","v":"Nhiều thế cơ à? Anh không nhớ nhầm đấy chứ?"},{"s":"李进","z":"没错。上个星期光买沙发就花了两千多。","p":"Méi cuò. Shàng ge xīngqī guāng mǎi shāfā jiù huāle liǎngqiān duō.","v":"Không nhầm đâu. Tuần trước chỉ riêng mua sofa đã hết hơn hai nghìn rồi."},{"s":"王静","z":"但是咱家的冰箱实在太旧了，制冷效果也不太好了，还是买个新的吧。","p":"Dànshì zán jiā de bīngxiāng shízài tài jiù le, zhìlěng xiàoguǒ yě bú tài hǎo le, háishì mǎi ge xīn de ba.","v":"Nhưng tủ lạnh nhà mình quả thực cũ quá rồi, làm lạnh cũng không còn tốt nữa, hay là mua cái mới đi."},{"s":"李进","z":"那好吧，我带的现金不够，用你的信用卡吧。","p":"Nà hǎo ba, wǒ dài de xiànjīn bú gòu, yòng nǐ de xìnyòngkǎ ba.","v":"Thôi được, tiền mặt anh mang không đủ, dùng thẻ tín dụng của em vậy."}]},{"no":3,"tz":"李进和王静在超市买礼物","tv":"Lý Tiến và Vương Tĩnh mua quà ở siêu thị","lines":[{"s":"李进","z":"李老师邀请咱们去他家做客，给他带点儿什么礼物好呢？","p":"Lǐ lǎoshī yāoqǐng zánmen qù tā jiā zuò kè, gěi tā dài diǎnr shénme lǐwù hǎo ne?","v":"Thầy Lý mời chúng ta đến nhà thầy chơi, mang quà gì cho thầy thì hợp nhỉ?"},{"s":"王静","z":"他很喜欢葡萄酒，我们就给他买两瓶葡萄酒吧。","p":"Tā hěn xǐhuan pútaojiǔ, wǒmen jiù gěi tā mǎi liǎng píng pútaojiǔ ba.","v":"Thầy rất thích rượu vang, mình mua tặng thầy hai chai rượu vang đi."},{"s":"李进","z":"可是这里有这么多种，你知道哪种好吗？","p":"Kěshì zhèli yǒu zhème duō zhǒng, nǐ zhīdào nǎ zhǒng hǎo ma?","v":"Nhưng ở đây có nhiều loại thế, em biết loại nào ngon không?"},{"s":"王静","z":"我觉得这种不错，你看他酒瓶做得都这么艺术。而且电视上经常有它的广告，我想味道应该不错。","p":"Wǒ juéde zhè zhǒng búcuò, nǐ kàn tā jiǔpíng zuò de dōu zhème yìshù. Érqiě diànshì shang jīngcháng yǒu tā de guǎnggào, wǒ xiǎng wèidào yīnggāi búcuò.","v":"Em thấy loại này được đấy, anh xem vỏ chai của nó làm nghệ thuật thế cơ mà. Hơn nữa trên TV thường xuyên có quảng cáo của nó, em nghĩ mùi vị chắc là ngon."},{"s":"李进","z":"广告只会介绍优点，却不会说它的缺点。实际上，很多东西并不像广告上说的那么好，所以不能完全相信广告。","p":"Guǎnggào zhǐ huì jièshào yōudiǎn, què bú huì shuō tā de quēdiǎn. Shíjìshang, hěn duō dōngxi bìng bú xiàng guǎnggào shang shuō de nàme hǎo, suǒyǐ bù néng wánquán xiāngxìn guǎnggào.","v":"Quảng cáo chỉ giới thiệu ưu điểm, chứ lại không nói nhược điểm của nó. Thực tế, rất nhiều thứ không hề tốt như quảng cáo nói, cho nên không thể tin hoàn toàn vào quảng cáo."},{"s":"王静","z":"你说的也对。","p":"Nǐ shuō de yě duì.","v":"Anh nói cũng đúng."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"买衣服只考虑价格当然不好，但是只考虑买好看的也不一定对。","p":"Mǎi yīfu zhǐ kǎolǜ jiàgé dāngrán bù hǎo, dànshì zhǐ kǎolǜ mǎi hǎokàn de yě bù yídìng duì.","v":"Mua quần áo mà chỉ cân nhắc giá cả thì đương nhiên không hay, nhưng chỉ nghĩ đến chuyện mua đồ đẹp cũng chưa chắc đã đúng."},{"s":"","z":"我买衣服的标准是“只买对的，不买贵的”。第一，自己穿着舒服；第二，衣服的质量要好，而且又不能太贵。","p":"Wǒ mǎi yīfu de biāozhǔn shì “zhǐ mǎi duì de, bù mǎi guì de”. Dì yī, zìjǐ chuānzhe shūfu; dì èr, yīfu de zhìliàng yào hǎo, érqiě yòu bù néng tài guì.","v":"Tiêu chuẩn mua quần áo của tôi là “chỉ mua cái phù hợp, không mua cái đắt”. Thứ nhất, mặc lên phải thấy thoải mái; thứ hai, chất lượng quần áo phải tốt, mà lại không được quá đắt."},{"s":"","z":"对我来说，衣服的样子流行不流行并不是很重要。","p":"Duì wǒ lái shuō, yīfu de yàngzi liúxíng bu liúxíng bìng bú shì hěn zhòngyào.","v":"Với tôi mà nói, kiểu dáng quần áo có hợp mốt hay không thật ra không quan trọng lắm."},{"s":"","z":"很多年龄大的人喜欢在打折的时候买便宜的衣服，但对那些衣服是不是适合自己却考虑得不多。","p":"Hěn duō niánlíng dà de rén xǐhuan zài dǎ zhé de shíhou mǎi piányi de yīfu, dàn duì nàxiē yīfu shì bu shì shìhé zìjǐ què kǎolǜ de bù duō.","v":"Nhiều người lớn tuổi thích mua quần áo rẻ vào dịp giảm giá, nhưng lại ít khi cân nhắc xem những bộ đồ đó có hợp với mình hay không."},{"s":"","z":"这点是我理解不了的，因为如果不适合自己，即使花钱很少，也是一种浪费。","p":"Zhè diǎn shì wǒ lǐjiě bu liǎo de, yīnwèi rúguǒ bú shìhé zìjǐ, jíshǐ huā qián hěn shǎo, yě shì yì zhǒng làngfèi.","v":"Điểm này thì tôi không hiểu nổi, bởi vì nếu không hợp với mình thì dù có tiêu rất ít tiền, đó vẫn là một kiểu lãng phí."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"现在网上购物变得越来越流行了，年轻人尤其喜欢在网上买东西。","p":"Xiànzài wǎng shang gòuwù biàn de yuè lái yuè liúxíng le, niánqīng rén yóuqí xǐhuan zài wǎng shang mǎi dōngxi.","v":"Hiện nay mua sắm trên mạng ngày càng trở nên thịnh hành, giới trẻ lại đặc biệt thích mua đồ trên mạng."},{"s":"","z":"在网上几乎什么都可以买到，你可以上网买书、买衣服、买包，还可以买家具、买手机。","p":"Zài wǎng shang jīhū shénme dōu kěyǐ mǎidào, nǐ kěyǐ shàng wǎng mǎi shū, mǎi yīfu, mǎi bāo, hái kěyǐ mǎi jiājù, mǎi shǒujī.","v":"Trên mạng hầu như thứ gì cũng mua được: bạn có thể lên mạng mua sách, mua quần áo, mua túi, còn có thể mua đồ nội thất, mua điện thoại."},{"s":"","z":"网上购物能够受到人们的喜爱，原因主要有两个：","p":"Wǎng shang gòuwù nénggòu shòudào rénmen de xǐ'ài, yuányīn zhǔyào yǒu liǎng ge:","v":"Mua sắm trên mạng được mọi người yêu thích, chủ yếu là vì hai lý do:"},{"s":"","z":"首先，网上的东西很多，而且比去商店买便宜，这是吸引人们购买的主要原因。","p":"Shǒuxiān, wǎng shang de dōngxi hěn duō, érqiě bǐ qù shāngdiàn mǎi piányi, zhè shì xīyǐn rénmen gòumǎi de zhǔyào yuányīn.","v":"Trước hết, hàng trên mạng rất phong phú, lại rẻ hơn mua ở cửa hàng, đây là lý do chính thu hút mọi người mua."},{"s":"","z":"其次，人们可以在任何时间上网购买自己喜欢的东西，卖家可以把你买的东西寄到你办公室或者家里，非常方便。","p":"Qícì, rénmen kěyǐ zài rènhé shíjiān shàng wǎng gòumǎi zìjǐ xǐhuan de dōngxi, màijiā kěyǐ bǎ nǐ mǎi de dōngxi jìdào nǐ bàngōngshì huòzhě jiāli, fēicháng fāngbiàn.","v":"Thứ hai, người ta có thể lên mạng mua thứ mình thích vào bất cứ lúc nào, người bán có thể gửi món đồ bạn mua đến văn phòng hoặc nhà bạn, vô cùng tiện lợi."}]}],"gram":[{"id":"kending","t":"肯定 + 动词/形容词","s":"chắc chắn, nhất định (người nói đoan chắc về một phán đoán)","b":"<b>肯定</b> ở đây là <b>phó từ</b>, đặt <b>trước động từ hoặc hình dung từ</b> để nói “tôi dám chắc là…”. Nó chỉ diễn tả <b>mức độ tin chắc của người nói</b>, chứ không phải yêu cầu ai làm gì. Khi phủ định, 肯定 đứng <b>trước</b> 不/没: 肯定不会……, 肯定没有……","r":["Vị trí: Chủ ngữ + <b>肯定</b> + (不/没) + động từ/hình dung từ. Ví dụ: 他肯定知道 / 肯定不会迟到.","Không đặt 不 trước 肯定 khi muốn nói “chắc chắn không”: ✗ 他不肯定会来 → ✓ 他肯定不会来.","肯定 còn có thể là động từ (khẳng định, công nhận): 老师肯定了他的成绩; nhưng trong bài này dùng nghĩa phó từ.","Câu mệnh lệnh, yêu cầu thì dùng 一定 chứ không dùng 肯定: ✗ 你肯定要来 → ✓ 你一定要来."],"e":[["您放心，质量肯定不“打折”，这种沙发是今年最流行的。","Nín fàng xīn, zhìliàng kěndìng bù “dǎ zhé”, zhè zhǒng shāfā shì jīnnián zuì liúxíng de.","Cô cứ yên tâm, chất lượng thì chắc chắn không “giảm giá” đâu, loại sofa này là mẫu thịnh hành nhất năm nay <i>(bài khoá 1)</i>"],["你放心，还有半个小时，肯定不会迟到。","Nǐ fàng xīn, hái yǒu bàn ge xiǎoshí, kěndìng bú huì chídào.","Cậu yên tâm, còn nửa tiếng nữa, chắc chắn không muộn được đâu <i>(练一练)</i>"]],"d":[["A：快点儿，不早了，咱们别迟到了。B：你放心，还有半个小时，____不会迟到。","肯定"],["A：那份调查下个月能完成吗？B：没问题，下个月____能完成。","肯定"],["A：那个公园几点关门？B：可能是六点，也可能是六点半，____不是七点。","肯定"]],"w":"肯定 = “tôi dám chắc” (phán đoán); 一定 vừa dùng để phán đoán vừa dùng để yêu cầu (你一定要来). Cứ nhớ: khuyên bảo/dặn dò thì chọn 一定."},{"id":"zaishuo","t":"再说 (liên từ) ／ ……再说吧 (động từ)","s":"hơn nữa, vả lại ／ để rồi tính sau","b":"<b>再说</b> có hai cách dùng khác hẳn nhau. (1) Là <b>liên từ</b>, đứng <b>đầu vế sau</b>, thêm một lý do nữa để củng cố điều vừa nói — dịch là “hơn nữa, vả lại”. (2) Là <b>cụm động từ đứng cuối câu</b> (…再说吧), nghĩa là “chuyện đó để sau hẵng tính”.","r":["Cách 1: mệnh đề lý do 1，<b>再说</b>，mệnh đề lý do 2。Sau 再说 thường có dấu phẩy.","Cách 2: danh từ/việc + <b>再说吧</b>, đứng cuối câu, ý là tạm gác lại: 旅游的事再说吧.","再说 (liên từ) khác 而且: 再说 chỉ dùng để <b>thêm lý do</b> cho kết luận đã nêu, thường trong khẩu ngữ; 而且 chỉ đơn giản bổ sung thông tin.","Lỗi hay gặp: ✗ 今天买的东西太多了，再说这个月家里已经花了五千多了，所以再说吧。（trộn hai nghĩa trong một câu）"],"e":[["今天买的东西太多了。再说，这个月家里已经花了五千多了。","Jīntiān mǎi de dōngxi tài duō le. Zàishuō, zhège yuè jiā li yǐjīng huāle wǔqiān duō le.","Hôm nay mua nhiều đồ quá rồi. Hơn nữa, tháng này nhà mình đã tiêu hơn năm nghìn tệ <i>(bài khoá 2)</i>"],["下个月南京天气好，再说，下个月机票也便宜。","Xià ge yuè Nánjīng tiānqì hǎo, zàishuō, xià ge yuè jīpiào yě piányi.","Tháng sau thời tiết Nam Kinh đẹp, vả lại tháng sau vé máy bay cũng rẻ <i>(练一练)</i>"]],"d":[["甲：咱们什么时候一起去南京旅游？乙：最近太忙了，旅游的事____吧。","再说"],["甲：为什么一定要下个月去呢？乙：下个月南京天气好，____，下个月机票也便宜。","再说"],["今天买的东西太多了。____，这个月家里已经花了五千多了。","再说"]],"w":"Nghe 再说 ở <b>đầu vế</b> → “hơn nữa”; thấy 再说 ở <b>cuối câu</b> (thường có 吧) → “để sau hẵng tính”. Vị trí quyết định nghĩa."},{"id":"guang-jiu","t":"光……就……","s":"chỉ riêng… đã… (nhấn mạnh số lượng nhiều)","b":"<b>光</b> ở đây là phó từ, bằng với <b>只</b> nhưng đậm chất khẩu ngữ. Cấu trúc <b>光 + phần được giới hạn，就 + con số/mức độ</b> dùng để nói: mới chỉ tính riêng một phần nhỏ thôi mà số lượng đã lớn thế này — nghĩa là toàn bộ còn nhiều hơn nữa.","r":["Trật tự: (Thời gian) + <b>光</b> + động từ/danh từ + <b>就</b> + động từ + số lượng. Ví dụ: 光买沙发就花了两千多.","Không được bỏ 就: ✗ 上个星期光买沙发花了两千多 → ✓ 上个星期光买沙发就花了两千多.","光 đứng ngay trước phần muốn giới hạn, không đứng trước chủ ngữ: ✗ 光上个星期我买沙发就…… (nếu muốn giới hạn thời gian phải nói 光上个星期就花了两千多).","光 còn có nghĩa “chỉ… mà (không làm việc khác)”: 你别光说不做."],"e":[["上个星期光买沙发就花了两千多。","Shàng ge xīngqī guāng mǎi shāfā jiù huāle liǎngqiān duō.","Tuần trước chỉ riêng mua sofa đã hết hơn hai nghìn tệ <i>(bài khoá 2)</i>"],["买衣服只考虑价格当然不好。","Mǎi yīfu zhǐ kǎolǜ jiàgé dāngrán bù hǎo.","Mua quần áo mà chỉ cân nhắc giá cả thì đương nhiên không hay <i>(bài khoá 4, so sánh: ở đây dùng 只 chứ không dùng 光)</i>"]],"d":[["没错。上个星期____买沙发____花了两千多。","光 / 就"],["买衣服____考虑价格当然不好，但是____考虑买好看的也不一定对。","只 / 只"]],"w":"光……就…… luôn kèm theo một <b>con số lớn</b> để gây bất ngờ. Nếu câu không có số lượng thì thường chỉ dùng 只 (只考虑价格), không dùng 光……就……."},{"id":"shunbian","t":"顺便 + 动词","s":"nhân tiện (làm việc chính thì làm luôn việc phụ)","b":"<b>顺便</b> là phó từ, đặt <b>trước động từ của việc phụ</b>. Điều kiện dùng: phải có một <b>việc chính</b> đã hoặc đang làm, việc phụ chỉ là “tiện thể làm luôn”, không phải cất công đi làm riêng.","r":["Trật tự: (làm việc chính)，+ Chủ ngữ + <b>顺便</b> + động từ + tân ngữ。Ví dụ: 我们顺便也买一台吧.","Việc phụ phải nhỏ hơn và diễn ra cùng lúc/ngay sau việc chính; nếu không có việc chính thì không dùng được 顺便.","Thường đi với 也、就、给我: 你去超市的时候顺便给我买瓶水.","Lỗi hay gặp: ✗ 我顺便去商场买了一台冰箱，什么别的事都没做。→ ✓ 我去商场买衣服，顺便买了一台冰箱。"],"e":[["咱家的冰箱太旧了，商场正在打折，我们顺便也买一台吧。","Zán jiā de bīngxiāng tài jiù le, shāngchǎng zhèngzài dǎ zhé, wǒmen shùnbiàn yě mǎi yì tái ba.","Tủ lạnh nhà mình cũ quá rồi, trung tâm thương mại đang giảm giá, nhân tiện mua luôn một cái đi <i>(bài khoá 2)</i>"],["他搬新家了，晚上请老同学们去家里吃饭，顺便看看他的新房子。","Tā bān xīn jiā le, wǎnshang qǐng lǎo tóngxué men qù jiā li chī fàn, shùnbiàn kànkan tā de xīn fángzi.","Anh ấy chuyển nhà mới, tối mời các bạn học cũ đến nhà ăn cơm, nhân tiện xem luôn nhà mới của anh ấy <i>(练一练)</i>"]],"d":[["A：今天是小王请客？他有什么高兴事呀？B：他搬新家了，晚上请老同学们去家里吃饭，____看看他的新房子。","顺便"],["商场正在打折，我们____也买一台吧。","顺便"]],"w":"顺便 (tiện thể) ngược nghĩa với 特意/专门 (cất công, cố ý đi làm riêng). Nếu người ta đi riêng một chuyến vì bạn, phải nói 特意 chứ không phải 顺便."},{"id":"dui-lai-shuo","t":"对……来说","s":"đối với… mà nói, xét theo góc nhìn của…","b":"<b>对 + người/sự vật + 来说</b> nêu <b>góc nhìn, lập trường</b> để đánh giá điều nói ở sau. Cụm này thường đứng <b>đầu câu</b> và có dấu phẩy ngăn cách; cũng có thể đứng cuối câu sau 特别是 để bổ sung.","r":["Trật tự chuẩn: <b>对 + 对象 + 来说</b>，+ nhận định。Ví dụ: 对我来说，衣服的样子……并不是很重要.","Không thêm 说 hai lần và không bỏ 来: ✗ 对我说，工作最重要 → ✓ 对我来说，工作最重要.","Phân biệt với giới từ 对 chỉ đối tượng tác động (对……感兴趣、对……好、对……有帮助): 他对我很好 (không thể thêm 来说).","Có thể đứng sau để bổ sung: 北京是个不错的地方，特别是对外国人来说。"],"e":[["对我来说，衣服的样子流行不流行并不是很重要。","Duì wǒ lái shuō, yīfu de yàngzi liúxíng bu liúxíng bìng bú shì hěn zhòngyào.","Với tôi mà nói, kiểu dáng quần áo có hợp mốt hay không thật ra không quan trọng lắm <i>(bài khoá 4)</i>"],["北京是个不错的地方，特别是对外国人来说。","Běijīng shì ge búcuò de dìfang, tèbié shì duì wàiguó rén lái shuō.","Bắc Kinh là một nơi khá tốt, nhất là đối với người nước ngoài <i>(练一练)</i>"]],"d":[["____，工作最重要。","对我来说"],["北京是个不错的地方，特别是____外国人____。","对 / 来说"],["____，衣服的样子流行不流行并不是很重要。","对我来说"]],"w":"对……来说 = “xét từ phía ai”; 对……感兴趣/好 = “hướng tới ai, tác động lên ai”. Cứ thử bỏ 来说: nếu câu vẫn xuôi thì đó là giới từ 对, không phải cấu trúc này."},{"id":"youqi-tebie","t":"尤其（是）…… ／ 特别","s":"đặc biệt là, nhất là — phân biệt 尤其 với 特别","b":"<b>尤其</b> là <b>phó từ</b>, dùng khi đã nêu một phạm vi chung rồi <b>chỉ ra thành phần nổi bật nhất</b> trong phạm vi đó. <b>特别</b> vừa làm được việc này (đồng nghĩa với 尤其), vừa có nghĩa “rất” và nghĩa “khác thường, đặc biệt” mà 尤其 <b>không có</b>.","r":["Vị trí: đứng trước động từ (年轻人<b>尤其</b>喜欢……) hoặc dùng dạng <b>尤其是 + 名词/小句</b> đứng sau vế chung.","Trước 尤其 phải có một phạm vi rộng đã nêu; không dùng 尤其 để mở đầu câu khi chưa nói gì.","尤其 KHÔNG thay được 特别 khi 特别 mang nghĩa “rất/khác lạ”: ✓ 这家饭馆儿的面味儿很特别 → ✗ ……很尤其.","Lỗi hay gặp: ✗ 她尤其高兴，所以在外边玩儿了很长时间。→ ✓ 她特别高兴，……（ở đây nghĩa là “rất vui”, không phải so sánh nổi bật）"],"e":[["现在网上购物变得越来越流行了，年轻人尤其喜欢在网上买东西。","Xiànzài wǎng shang gòuwù biàn de yuè lái yuè liúxíng le, niánqīng rén yóuqí xǐhuan zài wǎng shang mǎi dōngxi.","Hiện nay mua sắm trên mạng ngày càng thịnh hành, giới trẻ lại đặc biệt thích mua đồ trên mạng <i>(bài khoá 5)</i>"],["考试做题前首先要想清楚问题的意思，尤其是在做数学题的时候。","Kǎoshì zuò tí qián shǒuxiān yào xiǎng qīngchu wèntí de yìsi, yóuqí shì zài zuò shùxué tí de shíhou.","Trước khi làm bài thi phải hiểu rõ ý của câu hỏi đã, nhất là khi làm bài toán <i>(练一练)</i>"]],"d":[["现在对历史感兴趣的人越来越少了，所以我写了几本书，希望能引起人们的注意，____年轻人。","尤其/特别"],["考试做题前首先要想清楚问题的意思，____是在做数学题的时候。","尤其"],["这家饭馆儿的面味儿很____，在当地非常受欢迎。","特别"],["她从来没有见过这么大的雪，____高兴，所以在外边玩儿了很长时间。","特别"]],"w":"Quy tắc nhanh: nếu có thể thay bằng “rất” thì chỉ dùng được 特别; nếu ý là “trong số đó thì cái này nhất” thì cả 尤其 và 特别 đều được."},{"id":"bing-bu-que","t":"并 + 不/没…… ／ ……，却……","s":"thực ra (hoàn toàn) không… ／ thế mà lại…","b":"<b>并</b> đặt trước <b>不/没</b> để bác lại một suy nghĩ mà người nghe đang có: “bạn tưởng thế, nhưng thực ra không phải”. <b>却</b> là phó từ chuyển ý “thế mà, vậy mà”, luôn đứng <b>trước động từ ở vế sau</b>, không đứng đầu vế như 但是.","r":["Trật tự: 并 + <b>不/不是/没(有)</b> + động từ/hình dung từ。Ví dụ: 并不是很重要、并不像……那么好.","并 chỉ dùng với câu phủ định; ✗ 他并很聪明 → ✓ 他并不聪明.","So sánh phủ định: <b>A 不像 B 那么/这么 + 形容词</b> = A không tốt/đẹp… bằng B。Ví dụ: 很多东西并不像广告上说的那么好.","却 đứng <b>sau</b> chủ ngữ, trước động từ: ✗ 广告只会介绍优点，却广告不会说缺点 → ✓ 广告只会介绍优点，却不会说它的缺点。Có thể dùng chung 但是……却……."],"e":[["实际上，很多东西并不像广告上说的那么好，所以不能完全相信广告。","Shíjìshang, hěn duō dōngxi bìng bú xiàng guǎnggào shang shuō de nàme hǎo, suǒyǐ bù néng wánquán xiāngxìn guǎnggào.","Thực tế, rất nhiều thứ không hề tốt như quảng cáo nói, cho nên không thể tin hoàn toàn vào quảng cáo <i>(bài khoá 3)</i>"],["广告只会介绍优点，却不会说它的缺点。","Guǎnggào zhǐ huì jièshào yōudiǎn, què bú huì shuō tā de quēdiǎn.","Quảng cáo chỉ giới thiệu ưu điểm, chứ lại không nói nhược điểm của nó <i>(bài khoá 3)</i>"],["很多年龄大的人喜欢在打折的时候买便宜的衣服，但对那些衣服是不是适合自己却考虑得不多。","Hěn duō niánlíng dà de rén xǐhuan zài dǎ zhé de shíhou mǎi piányi de yīfu, dàn duì nàxiē yīfu shì bu shì shìhé zìjǐ què kǎolǜ de bù duō.","Nhiều người lớn tuổi thích mua quần áo rẻ lúc giảm giá, nhưng lại ít cân nhắc xem những bộ đồ đó có hợp với mình hay không <i>(bài khoá 4)</i>"]],"d":[["实际上，很多东西____不像广告上说的那么好。","并"],["对我来说，衣服的样子流行不流行____不是很重要。","并"],["广告只会介绍优点，____不会说它的缺点。","却"]],"w":"并不 ≠ 不 đơn thuần: 并不 mang sắc thái “trái với điều bạn nghĩ”. Còn 却 và 但是 không thay chỗ cho nhau — 但是 đứng đầu vế, 却 đứng trước động từ."},{"id":"jishi-ye","t":"即使……，也……","s":"cho dù… thì cũng…","b":"Cấu trúc nhượng bộ giả định: vế trước nêu một tình huống <b>giả định hoặc cực đoan</b>, vế sau dùng <b>也</b> khẳng định kết quả không thay đổi. Khác với 虽然……但是……, điều nêu sau 即使 <b>chưa chắc là sự thật</b>.","r":["Trật tự: <b>即使</b> + giả định，(chủ ngữ) + <b>也</b> + kết quả。也 không được bỏ.","即使 có thể đứng trước hoặc sau chủ ngữ: 即使他不来，我们也开始 / 他即使不来，我们也开始.","虽然……但是…… dùng cho sự thật đã xảy ra; 即使……也…… dùng cho giả định: ✗ 即使他昨天来了，我也没看见他 → ✓ 虽然他昨天来了，但是我没看见他.","Từ đồng nghĩa hay gặp: 就是……也……、哪怕……也……."],"e":[["因为如果不适合自己，即使花钱很少，也是一种浪费。","Yīnwèi rúguǒ bú shìhé zìjǐ, jíshǐ huā qián hěn shǎo, yě shì yì zhǒng làngfèi.","Bởi vì nếu không hợp với mình thì dù có tiêu rất ít tiền, đó vẫn là một kiểu lãng phí <i>(bài khoá 4)</i>"],["这点是我理解不了的。","Zhè diǎn shì wǒ lǐjiě bu liǎo de.","Điểm này thì tôi không tài nào hiểu nổi <i>(bài khoá 4, bổ ngữ khả năng phủ định 理解不了)</i>"]],"d":[["因为如果不适合自己，____花钱很少，____是一种浪费。","即使 / 也"],["这点是我理解不____的。","了 (liǎo)"]],"w":"Nhớ cặp: 即使 luôn kéo theo 也. Nếu vế trước là chuyện có thật đã xảy ra thì phải đổi sang 虽然……但是……."},{"id":"bi-shuliang","t":"A 比 B + 形容词 + 数量／越来越 + 形容词","s":"A hơn B bao nhiêu ／ ngày càng…","b":"Trong câu chữ <b>比</b>, muốn nói hơn <b>bao nhiêu</b> thì đặt số lượng <b>sau hình dung từ</b>: 比平时便宜了一千块. Muốn nói mức độ tăng dần theo thời gian thì dùng <b>越来越 + 形容词</b>, và <b>không</b> thêm 很/非常 trước hình dung từ.","r":["Trật tự: A + <b>比</b> + B + 形容词 + (了) + 数量。✗ 比平时便宜了很多一千块 → ✓ 比平时便宜了一千块.","Không dùng 很/非常 trong câu 比: ✗ 网上的东西比商店很便宜 → ✓ 网上的东西比去商店买便宜（多了）.","越来越 + 形容词/心理动词 + 了: 网上购物变得越来越流行了；✗ 越来越很流行.","Vế so sánh có thể lược chủ ngữ khi đã rõ: 而且比去商店买便宜（chủ ngữ là 网上的东西）."],"e":[["现在正在打折，比平时便宜了一千块。","Xiànzài zhèngzài dǎ zhé, bǐ píngshí piányile yìqiān kuài.","Bây giờ đang giảm giá, rẻ hơn ngày thường một nghìn tệ <i>(bài khoá 1)</i>"],["首先，网上的东西很多，而且比去商店买便宜，这是吸引人们购买的主要原因。","Shǒuxiān, wǎng shang de dōngxi hěn duō, érqiě bǐ qù shāngdiàn mǎi piányi, zhè shì xīyǐn rénmen gòumǎi de zhǔyào yuányīn.","Trước hết, hàng trên mạng rất nhiều, lại rẻ hơn mua ở cửa hàng, đây là lý do chính thu hút người ta mua <i>(bài khoá 5)</i>"],["现在网上购物变得越来越流行了。","Xiànzài wǎng shang gòuwù biàn de yuè lái yuè liúxíng le.","Hiện nay mua sắm trên mạng ngày càng trở nên thịnh hành <i>(bài khoá 5)</i>"]],"d":[["现在正在打折，____平时便宜____一千块。","比 / 了"],["现在正是换季，好多商店都在打折，你看，这些东西都____平时便宜了一半还多。","比"],["现在网上购物变得____流行了。","越来越"]],"w":"Số lượng chênh lệch luôn đứng CUỐI (便宜了一千块); nếu đặt trước hình dung từ là sai. Với 越来越 thì tuyệt đối không dùng thêm 很/非常."},{"id":"shiji-shijishang","t":"实际 / 实际上","s":"Thực tế (danh từ, tính từ) — trên thực tế, thật ra (phó từ)","b":"Sách tách rõ hai cách dùng. <b>实际</b> làm <b>danh từ</b> chỉ sự vật, tình huống tồn tại khách quan (联系实际 = gắn với thực tế); làm <b>tính từ</b> mang nghĩa “thực tế, cụ thể” (实际工作 = công việc thực tế). Còn <b>实际上</b> là <b>phó từ</b>, nghĩa “trong thực tế, thật ra”, và theo sách thì <b>đa phần mang ý chuyển ngoặt</b>: vế trước nêu điều người ta vẫn tưởng, vế sau dùng 实际上 nói ra sự thật ngược lại.","r":["实际 (danh từ) đứng sau động từ như tân ngữ: 联系实际、从实际出发.","实际 (tính từ) đứng trước danh từ làm định ngữ: 实际工作、实际情况、实际年龄; không thêm 上.","实际上 (phó từ) thường đứng đầu vế sau và có dấu phẩy: ……。实际上，…… — hàm ý “nói thì vậy, chứ thật ra…”.","Lỗi hay gặp: ✗ 实际，很多东西不像广告说的那么好。 → ✓ 实际上，很多东西不像广告说的那么好。"],"e":[["广告只会介绍优点，却不会说它的缺点。实际上，很多东西并不像广告上说的那么好，所以不能完全相信广告。","Guǎnggào zhǐ huì jièshào yōudiǎn, què bú huì shuō tā de quēdiǎn. Shíjìshang, hěn duō dōngxi bìng bú xiàng guǎnggào shang shuō de nàme hǎo, suǒyǐ bù néng wánquán xiāngxìn guǎnggào.","Quảng cáo chỉ giới thiệu ưu điểm, chứ không nói nhược điểm của nó. Thật ra rất nhiều thứ không hề tốt như quảng cáo nói, cho nên không thể tin hoàn toàn vào quảng cáo <i>(bài khoá 3)</i>"],["我认为不会，实际工作能让我更理解书本上的知识。","Wǒ rènwéi bú huì, shíjì gōngzuò néng ràng wǒ gèng lǐjiě shūběn shang de zhīshi.","Tôi cho là không, công việc thực tế giúp tôi hiểu kiến thức trong sách vở hơn <i>(ví dụ của sách — 实际 làm tính từ)</i>"],["要想别人对你好，你得先对别人好。实际上，我们很多人做不到这一点。","Yào xiǎng biéren duì nǐ hǎo, nǐ děi xiān duì biéren hǎo. Shíjìshang, wǒmen hěn duō rén zuò bu dào zhè yì diǎn.","Muốn người khác đối tốt với mình thì mình phải đối tốt với người ta trước. Thật ra rất nhiều người trong chúng ta không làm được điều này <i>(ví dụ của sách)</i>"]],"d":[["A：小说里的爱情总是很吸引人，男的很帅，女的很漂亮。 B：但这到底只是故事，____________的爱情没有那么浪漫。","实际"],["“光说不练”的意思是有些人只是嘴上说说，____________什么也没做。","实际上"],["有些人喜欢不停地换工作，他们总以为新工作一定比现在的好。____________，新工作也有新的问题。","实际上"]],"w":"Làm phó từ thì bắt buộc phải có chữ 上 (实际上); ngược lại 实际工作 / 联系实际 thì tuyệt đối không thêm 上."}],"notes":"1) Slide 48 chỉ là CÂU HỎI đọc hiểu (王静和李进打算给李老师买什么礼物？/ 王静为什么觉得“这种”不错？/ 为什么不能完全相信广告？) nên đã loại, không tính là bài khoá — nội dung bài khoá 3 lấy ở slide 49. 2) Slide 23 là bản ĐIỀN TỪ (có chỗ trống) của chính bài khoá 1, không phải bài khoá riêng; đã dùng bản đầy đủ ở slide 22 và không thêm câu tiếng Trung nào. Slide 71 là một đoạn hội thoại của 练一练 (A：我想换____笔记本电脑……), cũng không phải bài khoá. Vì vậy bài 5 có đúng 5 bài khoá. 3) Hai bài đọc (slide 59 và slide 69) trong dữ liệu KHÔNG có tiêu đề; tiêu đề ở đây lấy nguyên văn cụm chữ có sẵn ngay trong chính đoạn văn (我买衣服的标准 / 网上购物), không tự đặt thêm câu tiếng Trung nào. 4) Pinyin trong slide bị đảo lộn thứ tự dòng ở hầu hết các bài khoá (slide 22 thiếu hẳn dòng pinyin của câu 谢谢，我想买沙发 và câu 有很多种颜色……bị tách rời; slide 33, 49, 59, 69 các dòng pinyin xếp sai thứ tự và ngắt giữa câu), ngoài ra còn lỗi đánh máy: yìīqiān (→ yìqiān), biànyile (→ piányile), huái kěyǐ (→ hái kěyǐ), zhègè (→ zhège), guǎngào ở 练一练 (→ guǎnggào), biāozhǔ ở 练一练 (→ biāozhǔn), zhǐmǎi (→ zhǐ mǎi), zijǐ (→ zìjǐ), xi'ài (→ xǐ'ài). Toàn bộ pinyin trong file này đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 5) Lỗi chính tả trong chữ Hán của slide 49: 你看他酒瓶做得都这么艺术 (đúng ra phải là 它 vì nói về chai rượu) — chữ Hán vẫn GIỮ NGUYÊN VĂN như slide, bản dịch xử lý theo nghĩa 它. 6) 练一练 batch 2 ghi nhầm nghĩa tiếng Việt: dòng “效果 / Kỳ thực, quả thực / shízài” thực ra là của từ 实在; nghĩa từ mới trong batches vẫn giữ nguyên như slide. 7) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở trên được suy ra từ 练一练 (肯定, 再说, 顺便, 尤其/特别, 对……来说) và từ cấu trúc nổi bật trong bài khoá (光……就……, 并不……／却……, 即使……也……, 比字句 + 数量／越来越). 8) Các mục 练一练 còn lại là bài tập điền TỪ VỰNG thuần tuý (家具/打折/价格/质量/肯定/流行, 标准/准时/准备, 受到/考虑/任何/家具, 邀请/打折/流行/顺便/效果) chứ không phải điểm ngữ pháp, nên không đưa vào mục grammar; nội dung của chúng đã được tận dụng làm ví dụ và câu điền từ trong phần drill. 9) Chữ Hán của cả 5 bài khoá trong slide là đầy đủ, không thiếu câu nào; các dấu xuống dòng giữa câu trong slide (ví dụ 而且电视上经常有\\n它的广告) đã được nối lại, không thêm bớt chữ. 10) Toàn bộ ví dụ trong phần từ mới và ngữ pháp đều là câu nguyên văn hoặc đoạn cắt tại ranh giới mệnh đề của chính bài khoá bài 5 hoặc của 练一练 trong dữ liệu slide, không có câu tiếng Trung nào được tự viết thêm.","order":[{"z":"您想买什么家具？","t":["您","想","买","什么","家具"],"v":"Chào cô! Cô muốn mua đồ nội thất gì ạ? Cô có cần tôi giới thiệu qua một chút không?"},{"z":"需要我为您介绍一下吗？","t":["需要","我","为","您","介绍","一下","吗"],"v":"Chào cô! Cô muốn mua đồ nội thất gì ạ? Cô có cần tôi giới thiệu qua một chút không?"},{"z":"谢谢，我想买沙发。","t":["谢谢","我","想","买","沙发"],"v":"Cảm ơn, tôi muốn mua ghế sofa."},{"z":"您看这个沙发怎么样？","t":["您","看","这个","沙发","怎么样"],"v":"Cô xem chiếc sofa này thế nào? Hiện đang giảm giá, rẻ hơn ngày thường những một nghìn tệ."},{"z":"现在正在打折，比平时便宜了一千块。","t":["现在","正在","打折","比","平时","便宜","了","一千块"],"v":"Cô xem chiếc sofa này thế nà
