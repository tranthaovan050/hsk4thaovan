,"tv":"Lý Tiến mua vali ở trung tâm thương mại","lines":[{"s":"售货员","z":"先生，我们店的行李箱都在这里，请问您要什么样的？","p":"Xiānsheng, wǒmen diàn de xínglixiāng dōu zài zhèli, qǐngwèn nín yào shénme yàng de?","v":"Thưa anh, vali của cửa hàng chúng tôi đều ở đây cả, anh muốn loại như thế nào ạ?"},{"s":"李进","z":"我想买一个轻一点儿的。","p":"Wǒ xiǎng mǎi yí ge qīng yìdiǎnr de.","v":"Tôi muốn mua một cái nhẹ một chút."},{"s":"售货员","z":"您看看这个，不管从价格方面看，还是从质量上看，都是值得考虑的。","p":"Nín kànkan zhè ge, bùguǎn cóng jiàgé fāngmiàn kàn, háishi cóng zhìliàng shang kàn, dōu shì zhíde kǎolǜ de.","v":"Anh xem thử cái này, bất kể xét về mặt giá cả hay xét về chất lượng thì đều đáng để cân nhắc."},{"s":"李进","z":"质量是不错。请问这个多少钱？","p":"Zhìliàng shì búcuò. Qǐngwèn zhè ge duōshao qián?","v":"Chất lượng thì đúng là tốt thật. Cho hỏi cái này bao nhiêu tiền?"},{"s":"售货员","z":"现在我们商场正好有打折活动，打完折是999。另外，一年内我们都负责免费修理。","p":"Xiànzài wǒmen shāngchǎng zhènghǎo yǒu dǎzhé huódòng, dǎ wán zhé shì jiǔbǎi jiǔshíjiǔ. Lìngwài, yì nián nèi wǒmen dōu fùzé miǎnfèi xiūlǐ.","v":"Hiện tại trung tâm chúng tôi vừa hay đang có chương trình giảm giá, sau khi giảm còn 999 tệ. Ngoài ra, trong vòng một năm chúng tôi chịu trách nhiệm sửa chữa miễn phí."},{"s":"李进","z":"你们的服务不错，价格也可以，就买这个吧。","p":"Nǐmen de fúwù búcuò, jiàgé yě kěyǐ, jiù mǎi zhè ge ba.","v":"Dịch vụ của các bạn tốt, giá cũng được, vậy tôi lấy cái này."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"顾客朋友们，为了感谢大家的支持，我们书店今天举行“购书送好礼”活动，购书满100元送一个笔记本，满200元送一本词典。","p":"Gùkè péngyoumen, wèile gǎnxiè dàjiā de zhīchí, wǒmen shūdiàn jīntiān jǔxíng “gòu shū sòng hǎo lǐ” huódòng, gòu shū mǎn yìbǎi yuán sòng yí ge bǐjìběn, mǎn èrbǎi yuán sòng yì běn cídiǎn.","v":"Kính thưa quý khách, để cảm ơn sự ủng hộ của mọi người, hôm nay nhà sách chúng tôi tổ chức chương trình “Mua sách tặng quà”: mua sách đủ 100 tệ tặng một quyển sổ tay, đủ 200 tệ tặng một quyển từ điển."},{"s":"","z":"另外，一些图书还有打折活动，其中，小说7.5折，地图8折，留学考试用书6折。","p":"Lìngwài, yìxiē túshū hái yǒu dǎzhé huódòng, qízhōng, xiǎoshuō qī wǔ zhé, dìtú bā zhé, liúxué kǎoshì yòngshū liù zhé.","v":"Ngoài ra, một số đầu sách còn được giảm giá, trong đó tiểu thuyết còn 75% giá, bản đồ còn 80%, sách luyện thi du học còn 60%."},{"s":"","z":"如果购书满500元可免费办会员卡，以后购书可打8折。","p":"Rúguǒ gòu shū mǎn wǔbǎi yuán kě miǎnfèi bàn huìyuánkǎ, yǐhòu gòu shū kě dǎ bā zhé.","v":"Nếu mua sách đủ 500 tệ thì được làm thẻ hội viên miễn phí, những lần mua sau được giảm còn 80% giá."},{"s":"","z":"今天过生日的朋友和所有的小朋友还可以获得一份小礼物。","p":"Jīntiān guò shēngrì de péngyou hé suǒyǒu de xiǎopéngyou hái kěyǐ huòdé yí fèn xiǎo lǐwù.","v":"Những khách hôm nay sinh nhật và tất cả các bé còn được nhận thêm một phần quà nhỏ."},{"s":"","z":"欢迎大家选购。","p":"Huānyíng dàjiā xuǎngòu.","v":"Kính mời quý khách lựa chọn và mua sắm."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"人们常说“一分钱一分货”，意思是东西的质量和价格有很大的关系，也可以说“便宜没好货，好货不便宜”，一般情况下，你花的钱越多，买的东西也就越好。","p":"Rénmen cháng shuō “yì fēn qián yì fēn huò”, yìsi shì dōngxi de zhìliàng hé jiàgé yǒu hěn dà de guānxi, yě kěyǐ shuō “piányi méi hǎo huò, hǎo huò bù piányi”, yìbān qíngkuàng xià, nǐ huā de qián yuè duō, mǎi de dōngxi yě jiù yuè hǎo.","v":"Người ta hay nói “tiền nào của nấy”, ý là chất lượng của món đồ có quan hệ rất lớn với giá cả, cũng có thể nói “rẻ thì không có hàng tốt, hàng tốt thì không rẻ”; thông thường, bạn tiêu càng nhiều tiền thì món đồ mua được cũng càng tốt."},{"s":"","z":"其实也不一定都是这样的。","p":"Qíshí yě bù yídìng dōu shì zhèyàng de.","v":"Thật ra cũng không hẳn lúc nào cũng như vậy."},{"s":"","z":"有的时候，质量很好的东西也会很便宜。","p":"Yǒu de shíhou, zhìliàng hěn hǎo de dōngxi yě huì hěn piányi.","v":"Có những lúc, đồ chất lượng rất tốt mà vẫn rất rẻ."},{"s":"","z":"例如，春天来了，冬天的衣服就会打折，质量很好，还很便宜，花很少的钱就可以买到。","p":"Lìrú, chūntiān lái le, dōngtiān de yīfu jiù huì dǎzhé, zhìliàng hěn hǎo, hái hěn piányi, huā hěn shǎo de qián jiù kěyǐ mǎi dào.","v":"Ví dụ, mùa xuân đến là quần áo mùa đông được giảm giá, chất lượng vẫn tốt mà lại rẻ, chỉ cần bỏ ra rất ít tiền là mua được."},{"s":"","z":"一到节日，商场也会举办各种各样的活动，降低价格，这个时候我们也可以买到又便宜又好的东西。","p":"Yí dào jiérì, shāngchǎng yě huì jǔbàn gè zhǒng gè yàng de huódòng, jiàngdī jiàgé, zhège shíhou wǒmen yě kěyǐ mǎi dào yòu piányi yòu hǎo de dōngxi.","v":"Cứ đến dịp lễ là trung tâm thương mại lại tổ chức đủ các kiểu chương trình, hạ giá xuống; lúc này chúng ta cũng có thể mua được những món vừa rẻ vừa tốt."}]}],"gram":[{"id":"jingran","t":"竟然 + động từ / tính từ","s":"không ngờ, thế mà, vậy mà","b":"<b>竟然</b> là phó từ, đặt <b>sau chủ ngữ, trước động từ/tính từ</b>, dùng khi sự việc xảy ra <b>ngoài dự đoán</b> của người nói, thường kèm chút ngạc nhiên hoặc trách móc. Vế trước hay có <b>没想到 / 真是没想到</b> để dọn đường cho sự bất ngờ. Trong khẩu ngữ có thể rút gọn thành 竟.","r":["Trật tự cố định: Chủ ngữ + 竟然 + động từ/tính từ. ✗ 竟然他忘了买果汁 → ✓ 他竟然忘了买果汁。","Rất hay đi cặp với 没想到 ở vế trước: 真是没想到，你儿子竟然都长这么大了。","竟然 nhấn mạnh chuyện TRÁI với dự đoán; nếu chuyện ĐÚNG như dự đoán thì phải dùng 果然.","Lỗi hay gặp: ✗ 我猜他会来，他竟然来了 → ✓ 我猜他会来，他果然来了。"],"e":[["回家以后，我才发现，竟然忘了去商场的超市买果汁！","Huí jiā yǐhòu, wǒ cái fāxiàn, jìngrán wàngle qù shāngchǎng de chāoshì mǎi guǒzhī!","Về đến nhà tớ mới phát hiện ra, ai ngờ lại quên mất chuyện vào siêu thị trong trung tâm thương mại mua nước hoa quả! <i>(bài khoá 1)</i>"],["你竟然都听得懂？","Nǐ jìngrán dōu tīng de dǒng?","Cậu mà cũng nghe hiểu được cơ à? <i>(练一练)</i>"]],"d":[["在我听来，上海话和北京话几乎完全不同，你____都听得懂？","竟然"],["真是没想到，你儿子____都长这么大了，我几乎没认出他来。","竟然"],["这么远的路，你竟然骑自行车来的？——今天天气好，____我喜欢骑自行车。","而且"]],"w":"竟然 = ngoài dự đoán (ai ngờ); 果然 = đúng như dự đoán (quả nhiên). Hai từ ngược nghĩa nhau, đừng thay cho nhau."},{"id":"bei-baifenzhi","t":"A 是 B 的 + số + 倍；百分之 + số","s":"A gấp mấy lần B; bao nhiêu phần trăm","b":"Nói bội số trong tiếng Trung dùng khung cố định <b>A + 是 + B + 的 + số từ + 倍</b>. 倍 luôn đứng <b>sau</b> số, và <b>không được bỏ chữ 的</b> trước số. Phần trăm nói là <b>百分之 + số</b>, đọc phần trăm trước, con số sau — ngược với tiếng Việt.","r":["Khung đầy đủ: A 是 B 的 + số + 倍。✗ 今天的价格是昨天两倍 → ✓ 今天的价格是昨天的两倍。","Có thể nói gọn không cần 是: 20 的 10 倍 = 200.","百分之百 = 100%, 百分之五十 = 50%; đọc 百分之 trước rồi mới tới số.","Lỗi hay gặp: ✗ 今年的收入是两倍的去年 → ✓ 今年的收入是去年的两倍。"],"e":[["我记得昨天才三块五一斤，今天的价格是昨天的两倍。","Wǒ jìde zuótiān cái sān kuài wǔ yì jīn, jīntiān de jiàgé shì zuótiān de liǎng bèi.","Tôi nhớ hôm qua mới có ba đồng rưỡi một cân, giá hôm nay gấp đôi hôm qua. <i>(bài khoá 2)</i>"],["七块钱一斤，您放心，保证百分之百新鲜。","Qī kuài qián yì jīn, nín fàngxīn, bǎozhèng bǎi fēn zhī bǎi xīnxiān.","Bảy tệ một cân, chị cứ yên tâm, bảo đảm tươi một trăm phần trăm. <i>(bài khoá 2)</i>"]],"d":[["200是20的10____。","倍"],["今年咱们公司的收入怎么样？——是去年的两____，还不错。","倍"],["每年七八月，有很多游客来这儿玩儿，最多的时候，来旅游的游客是十二月的三____。","倍"],["您放心，保证____新鲜。","百分之百"]],"w":"倍 chỉ dùng cho bội số (gấp mấy lần). Nói làm mấy lần, đi mấy lượt phải dùng 次: ✗ 我去了三倍 → ✓ 我去了三次。"},{"id":"zhide","t":"值得 + động từ；……是值得的","s":"đáng (làm gì đó), xứng đáng","b":"<b>值得</b> là động từ, phía sau nó là <b>một động từ hoặc cụm động từ</b> chỉ việc đáng làm: 值得买、值得考虑、值得试一下. Muốn khẳng định công sức bỏ ra là xứng đáng thì dùng khung <b>……是值得的</b> đặt cuối câu.","r":["Trật tự: (Chủ ngữ) + (很/非常) + 值得 + động từ: 这件衣服质量很好，很值得买。","Sau 值得 phải là ĐỘNG TỪ, không phải danh từ: ✗ 值得钱 → ✓ 这个箱子值1000块 (nói giá tiền thì dùng 值).","Phủ định là 不值得, không bao giờ dùng 没值得: 这么贵，不值得买。","Dạng nhấn mạnh cuối câu: 不过这些辛苦是值得的。"],"e":[["您看看这个，不管从价格方面看，还是从质量上看，都是值得考虑的。","Nín kànkan zhè ge, bùguǎn cóng jiàgé fāngmiàn kàn, háishi cóng zhìliàng shang kàn, dōu shì zhíde kǎolǜ de.","Anh xem thử cái này, bất kể xét về mặt giá cả hay xét về chất lượng thì đều đáng để cân nhắc. <i>(bài khoá 3)</i>"]],"d":[["这件衣服质量很好，很____买。","值得"],["你觉得这个办法怎么样？会有效果吗？——我觉得这个办法很值得____一下。","试"],["你学法律一定很苦很累吧？——是，不过这些辛苦是____的。","值得"]],"w":"值得 + động từ (值得买、值得去); 值 + số tiền (值一千块). Đừng ghép 值得 với danh từ tiền bạc."},{"id":"qizhong","t":"其中；phân biệt 其实 / 其他 / 其次 / 尤其","s":"trong đó; thật ra / (những cái) khác / thứ đến / nhất là","b":"<b>其中</b> nghĩa là “trong số đó”, nên trước nó <b>bắt buộc phải có một phạm vi, một nhóm đã được nêu ra</b>; 其中 đứng đầu vế sau để đi vào chi tiết cụ thể. Nhóm từ bắt đầu bằng 其 rất dễ nhầm nên cần nhớ theo chức năng, không nhớ theo mặt chữ.","r":["其中 phải có “cái toàn thể” đứng trước: 一些图书还有打折活动，其中，小说7.5折……","其中 hay đi với số lượng, phân số: 共有1620个女人经过这面镜子，其中1/3的人……","其实 = thật ra (đính chính lại điều vừa nói); 其他 = những cái/người khác; 其次 = thứ đến (đi sau 首先); 尤其 = nhất là, đặc biệt là (nêu cái nổi bật nhất trong nhóm).","Lỗi hay gặp: ✗ 我买了很多书，尤其小说7.5折 → ✓ 我买了很多书，其中小说7.5折。"],"e":[["另外，一些图书还有打折活动，其中，小说7.5折，地图8折，留学考试用书6折。","Lìngwài, yìxiē túshū hái yǒu dǎzhé huódòng, qízhōng, xiǎoshuō qī wǔ zhé, dìtú bā zhé, liúxué kǎoshì yòngshū liù zhé.","Ngoài ra, một số đầu sách còn được giảm giá, trong đó tiểu thuyết còn 75%, bản đồ còn 80%, sách luyện thi du học còn 60%. <i>(bài khoá 4)</i>"],["其实也不一定都是这样的。","Qíshí yě bù yídìng dōu shì zhèyàng de.","Thật ra cũng không hẳn lúc nào cũng như vậy. <i>(bài khoá 5)</i>"]],"d":[["大学生毕业前找工作时，首先，要知道自己想干什么；____，还要知道自己能干什么？","其次"],["8小时内，共有1620个女人经过这面镜子，____1/3的人花很短的时间看镜子中的自己。","其中"],["小时候，大家都说我长得像我妈，____是眼睛和鼻子。","尤其"],["他和弟弟虽然是同一天出生的，但是他们俩除了长得很像外，几乎再找不到____共同点。","其他"],["有些人总是不停地去找，却从不注意身边的地方。____，如果他能停下来，也许就会发现最美的地方就在身边。","其实"]],"w":"其中 = trong số đó (chỉ phạm vi, phải có nhóm nêu trước); 中间 = ở giữa (chỉ vị trí). Đừng dùng thay nhau."},{"id":"zai-xia","t":"（在）……情况下；在……的帮助/支持/努力下","s":"trong hoàn cảnh…; nhờ có sự… của…","b":"Khung <b>在 + … + 下</b> tạo một trạng ngữ chỉ điều kiện, luôn đặt ở <b>đầu câu</b> và có dấu phẩy ngăn với mệnh đề chính. Hai kiểu hay gặp ở HSK4: (a) <b>（在）……情况下</b> nêu hoàn cảnh khách quan; (b) <b>在 + người + 的 + 帮助/支持/努力 + 下</b> nêu nhờ ai mà việc thành.","r":["Cả cụm làm trạng ngữ đứng đầu câu: 一般情况下，你花的钱越多……","Với 一般情况下 có thể lược chữ 在; các kiểu khác thường giữ đủ cả 在 lẫn 下.","Kiểu (b) bắt buộc có 的 giữa người và danh từ: ✗ 在老师支持下 → ✓ 在老师的支持下。","Lỗi hay gặp: đặt cụm này vào giữa câu. ✗ 我们在大家的努力下按时完成了工作（nghe gượng）→ ✓ 在大家的努力下，我们按时完成了工作。"],"e":[["一般情况下，你花的钱越多，买的东西也就越好。","Yìbān qíngkuàng xià, nǐ huā de qián yuè duō, mǎi de dōngxi yě jiù yuè hǎo.","Thông thường thì bạn tiêu càng nhiều tiền, món đồ mua được cũng càng tốt. <i>(bài khoá 5)</i>"]],"d":[["____，玛丽很快找到了收银台。（售货员、帮助）","在售货员的帮助下"],["____，我们班成功举办了新年晚会。（老师、支持）","在老师的支持下"],["____，我们按时完成了工作。（大家、努力）","在大家的努力下"],["考试时别紧张，只有在放松的____下，才能考好。","情况"]],"w":"Chữ 下 ở đây KHÔNG có nghĩa vị trí “bên dưới”, đừng dịch là dưới cái gì; nó chỉ đánh dấu hết cụm điều kiện."},{"id":"buguan-haishi-dou","t":"不管 A 还是 B，都/也……","s":"bất kể A hay B, đều…","b":"<b>不管</b> nêu một điều kiện dù thay đổi thế nào cũng <b>không làm đổi kết quả</b>. Sau 不管 bắt buộc phải là hình thức <b>lựa chọn hoặc nghi vấn</b>: A还是B / 谁 / 什么 / 多少 / 好不好. Mệnh đề sau <b>bắt buộc</b> có 都 hoặc 也.","r":["Vế sau BẮT BUỘC có 都/也: ✗ 不管从价格方面看，还是从质量上看，是值得考虑的 → ✓ ……都是值得考虑的。","Sau 不管 không được là câu khẳng định thường: ✗ 不管天气很好 → ✓ 不管天气好不好。","不管 thiên về khẩu ngữ; 无论/不论 cùng cách dùng nhưng trang trọng hơn.","Phân biệt: 不管……都…… (điều kiện nào cũng vậy) ≠ 即使……也…… (giả thiết một tình huống cụ thể) ≠ 虽然……但是…… (sự thật đã rồi)."],"e":[["不管从价格方面看，还是从质量上看，都是值得考虑的。","Bùguǎn cóng jiàgé fāngmiàn kàn, háishi cóng zhìliàng shang kàn, dōu shì zhíde kǎolǜ de.","Bất kể xét về mặt giá cả hay xét về chất lượng thì đều đáng để cân nhắc. <i>(bài khoá 3)</i>"]],"d":[["____从价格方面看，还是从质量上看，都是值得考虑的。","不管"],["不管从价格方面看，____从质量上看，都是值得考虑的。","还是"],["不管从价格方面看，还是从质量上看，____是值得考虑的。","都"]],"w":"不管 luôn kéo theo 都/也 ở vế sau. Thấy vế sau không có 都/也 là câu sai."},{"id":"yue-yue","t":"越 A 越 B；越来越 + tính từ","s":"càng… càng…; ngày càng…","b":"Khung <b>越 + V/Adj + 越 + V/Adj</b> diễn tả hai mức độ <b>tăng song song</b> với nhau. Hai vế có thể khác chủ ngữ, vế sau hay thêm <b>也就</b> cho mượt. <b>越来越 + tính từ</b> nói mức độ tăng dần theo thời gian.","r":["越 đứng ngay trước động từ/tính từ, không xen chủ ngữ vào giữa 越 và vị ngữ.","Không dùng kèm 很/非常/太: ✗ 越来越很贵 → ✓ 越来越贵了。","Hai vế khác chủ ngữ vẫn được, mỗi vế giữ chủ ngữ riêng: 你花的钱越多，买的东西也就越好。","Lỗi hay gặp: ✗ 你越花钱多 → ✓ 你花的钱越多。"],"e":[["一般情况下，你花的钱越多，买的东西也就越好。","Yìbān qíngkuàng xià, nǐ huā de qián yuè duō, mǎi de dōngxi yě jiù yuè hǎo.","Thông thường thì bạn tiêu càng nhiều tiền, món đồ mua được cũng càng tốt. <i>(bài khoá 5)</i>"]],"d":[["一般情况下，你花的钱____多，买的东西也就____好。","越 / 越"],["你花的钱越多，买的东西____就越好。","也"]],"w":"越……越…… nói hai thứ tăng cùng nhau; 更 chỉ so sánh hơn ở MỘT mức. ✗ 钱越多，东西更好 → ✓ 钱越多，东西越好。"},{"id":"yi-jiu","t":"一 + V₁，就 + V₂","s":"vừa… là…; hễ… là…","b":"Khung <b>一……就……</b> nói hai việc <b>nối nhau ngay lập tức</b>, hoặc một quy luật kiểu “hễ… là…”. 一 đứng trước động từ thứ nhất; <b>就 phải đứng sau chủ ngữ của vế hai</b> và ngay trước động từ.","r":["就 luôn đứng SAU chủ ngữ vế hai: ✗ 一进门，就售货员热情地介绍 → ✓ 一进门，售货员就热情地为我们介绍。","Hai vế có thể cùng chủ ngữ hoặc khác chủ ngữ đều được.","Nếu vế hai dùng 也 thay cho 就 thì mang nghĩa quy luật lặp lại: 一到节日，商场也会举办各种各样的活动。","Việc đã xảy ra thì đặt 了 ở cuối vế hai, KHÔNG thêm 了 ngay sau 一 + động từ: ✗ 一进了门就…… → ✓ 一进门就……"],"e":[["一进门，售货员就热情地为我们介绍这、介绍那。","Yí jìn mén, shòuhuòyuán jiù rèqíng de wèi wǒmen jièshào zhè、jièshào nà.","Vừa bước vào cửa là nhân viên bán hàng đã nhiệt tình giới thiệu hết cái này đến cái kia. <i>(bài khoá 1)</i>"],["一到节日，商场也会举办各种各样的活动，降低价格。","Yí dào jiérì, shāngchǎng yě huì jǔbàn gè zhǒng gè yàng de huódòng, jiàngdī jiàgé.","Cứ đến dịp lễ là trung tâm thương mại lại tổ chức đủ các kiểu chương trình, hạ giá xuống. <i>(bài khoá 5)</i>"]],"d":[["____进门，售货员____热情地为我们介绍这、介绍那。","一 / 就"],["一到节日，商场____会举办各种各样的活动，降低价格。","也"],["春天来了，冬天的衣服____会打折。","就"]],"w":"一……就…… nhấn mạnh NGAY LẬP TỨC; 才 thì ngược lại — mãi mới xảy ra: 回家以后，我才发现……"},{"id":"man-dazhe","t":"满 + số lượng……送/……；打 + số + 折","s":"mua đủ… thì tặng…; giảm giá còn mấy phần mười","b":"<b>满</b> là động từ nghĩa “đạt đủ mức”, đứng <b>trước số lượng</b>: 满100元 = mua đủ 100 tệ. Cách nói giảm giá của tiếng Trung tính theo <b>phần giá còn phải trả</b> trên 10 phần: <b>打八折</b> = còn 80% (tức giảm 20%), 7.5折 = còn 75%. <b>打完折</b> = sau khi đã giảm.","r":["满 + số lượng + kết quả: 购书满100元送一个笔记本。","打 + số + 折: con số là phần CÒN PHẢI TRẢ. 打8折 = còn 80%, 6折 = còn 60%. Số lẻ đọc là 七五折 (7.5折).","打完折 dùng để nói giá sau khi giảm: 打完折是999。","满 còn dùng cho thời gian, tuổi tác với nghĩa tròn/đủ: 满一年、满十八岁。"],"e":[["购书满100元送一个笔记本，满200元送一本词典。","Gòu shū mǎn yìbǎi yuán sòng yí ge bǐjìběn, mǎn èrbǎi yuán sòng yì běn cídiǎn.","Mua sách đủ 100 tệ tặng một quyển sổ tay, đủ 200 tệ tặng một quyển từ điển. <i>(bài khoá 4)</i>"],["如果购书满500元可免费办会员卡，以后购书可打8折。","Rúguǒ gòu shū mǎn wǔbǎi yuán kě miǎnfèi bàn huìyuánkǎ, yǐhòu gòu shū kě dǎ bā zhé.","Nếu mua sách đủ 500 tệ thì được làm thẻ hội viên miễn phí, những lần sau mua sách được giảm còn 80% giá. <i>(bài khoá 4)</i>"],["现在我们商场正好有打折活动，打完折是999。","Xiànzài wǒmen shāngchǎng zhènghǎo yǒu dǎzhé huódòng, dǎ wán zhé shì jiǔbǎi jiǔshíjiǔ.","Hiện tại trung tâm chúng tôi đang có chương trình giảm giá, sau khi giảm còn 999 tệ. <i>(bài khoá 3)</i>"]],"d":[["购书____100元送一个笔记本，____200元送一本词典。","满"],["其中，小说7.5折，地图8折，留学考试用书6____。","折"],["现在我们商场正好有____活动，打完折是999。","打折"]],"w":"打八折 là “còn 80%”, tức chỉ giảm 20% — người Việt rất hay hiểu ngược thành giảm 80%. Số càng nhỏ thì càng rẻ."}],"notes":"1) Slide 43, 59 và 71 chỉ là CÂU HỎI đọc hiểu (李进想买一个什么样的行李箱？/ 书店今天举行什么活动?为什么? / 一般情况下，贵的东西质量怎么样？…) nên đã loại, không tính là bài khoá. Vì vậy 8 chunk trong dữ liệu chỉ cho ra 5 bài khoá thật (slide 26, 35, 44, 60, 72). 2) Hai bài đọc (slide 60 và slide 72) trong dữ liệu KHÔNG có tiêu đề (trường title rỗng); tiêu đề ở đây lấy nguyên văn cụm chữ Hán có sẵn trong chính đoạn văn (“购书送好礼” và “一分钱一分货”), không tự đặt thêm câu tiếng Trung nào. 3) Pinyin trong slide bị ĐẢO LỘN thứ tự dòng ở cả 5 bài khoá và ở slide 26 còn gán sai người nói (dòng pinyin đầu tiên mang nội dung câu 我们先去逛了会儿商场 nhưng đứng trước lượt của 张远); slide 60 và 72 pinyin bị ngắt giữa từ (“如\\n果”, “东\\n西”, “péng\\nyou”) và slide 60 kết thúc bằng “xuǎng gòu” (sai, đúng là xuǎngòu). Toàn bộ pinyin trong file này đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 4) Chữ Hán trong slide 26, 35, 44 dùng dấu câu nửa thân ( : ? ! ) và có khoảng trắng thừa chen giữa câu (她买  了一条裤子 / 竟然  忘了 / 一年内我们  都负责) — đã chuẩn hoá dấu câu và bỏ khoảng trắng thừa, KHÔNG thêm hay bớt chữ nào. 5) Slide 44 có mâu thuẫn giữa chữ Hán và pinyin: chữ Hán ghi giá sau giảm là 999 còn pinyin ghi “jiǔ bǎi” (900). Đã giữ nguyên chữ Hán 999 và đánh pinyin theo chữ Hán (jiǔbǎi jiǔshíjiǔ). 6) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở trên được suy ra từ 练一练 (竟然, 倍/百分之, 值得, 其中—其实—其次—其他—尤其, 情况下, 在……的帮助/支持/努力下) và từ cấu trúc nổi bật trong bài khoá (不管……还是……都, 越……越, 一……就, 满+số lượng/打X折). 7) Bài tập 练一练 dạng viết câu 在……的帮助下 / 在……的支持下 / 在……的努力下 KHÔNG có ví dụ tương ứng trong bài khoá, nên đã gộp chung vào điểm ngữ pháp “在……下” cùng với 一般情况下 — cấu trúc này có câu nguyên văn trong bài khoá 5. 8) Các đợt 练一练 còn lại chỉ là bài tập TỪ VỰNG thuần tuý (效果/邀请/现金/葡萄/艺术/广告 và 味道/实际/优点 — những từ này không nằm trong danh sách từ mới của bài) nên không đưa vào phần ngữ pháp. 9) Mọi câu tiếng Trung trong phần grammar (ex và drill) và trong vocab_ex đều là câu nguyên văn, hoặc đoạn cắt đúng ranh giới mệnh đề, của chính bài khoá bài 6 hoặc của 练一练 trong dữ liệu — không có câu tiếng Trung nào được tự viết thêm. 10) Chữ Hán của cả 5 bài khoá trong slide là đầy đủ, không thiếu câu nào.","order":[{"z":"昨天晚上我给你打电话一直没人接，你忙什么呢？","t":["昨天晚上","我","给","你","打电话","一直","没人接","你","忙","什么","呢"],"v":"Tối qua tớ gọi điện cho cậu mãi mà chẳng ai nghe máy, cậu bận gì thế?"},{"z":"昨天妻子让我陪她去超市买果汁。","t":["昨天","妻子","让","我","陪","她","去","超市","买","果汁"],"v":"Hôm qua vợ tớ bảo tớ đi siêu thị mua nước hoa quả cùng. Tớ lại để quên điện thoại ở nhà."},{"z":"我把手机忘在家里了。","t":["我","把","手机","忘","在","家里","了"],"v":"Hôm qua vợ tớ bảo tớ đi siêu thị mua nước hoa quả cùng. Tớ lại để quên điện thoại ở nhà."},{"z":"买这么点儿东西也用不了那么长时间啊！","t":["买","这么点儿","东西","也","用","不了","那么","长时间","啊"],"v":"Mua có từng ấy đồ thì làm gì mà mất nhiều thời gian thế!"},{"z":"我们先去逛了会儿商场。","t":["我们","先","去逛","了","会儿","商场"],"v":"Bọn tớ ghé dạo trung tâm thương mại một lát đã. Vừa bước vào cửa là nhân viên bán hàng ời mưa thì chúng ta không đi nữa."}],[{"h":"既","p":"jì","v":"(được dùng kết hợp với 又) đã… lại…, vừa… vừa…","ez":"这件衣服既便宜又好看。","ey":"Zhè jiàn yīfu jì piányi yòu hǎokàn.","ev":"Chiếc áo này vừa rẻ lại vừa đẹp."},{"h":"减肥","p":"jiǎn féi","v":"Giảm cân","ez":"她为了减肥，晚上不吃饭。","ey":"Tā wèile jiǎnféi, wǎnshang bù chī fàn.","ev":"Cô ấy để giảm cân nên buổi tối không ăn cơm."},{"h":"辛苦","p":"xīnkǔ","v":"Vất vả, cực nhọc","ez":"妈妈每天工作很辛苦。","ey":"Māma měitiān gōngzuò hěn xīnkǔ.","ev":"Mẹ tôi ngày nào cũng làm việc rất vất vả."},{"h":"肚子","p":"dùzi","v":"Bụng","ez":"我肚子有点儿疼，想去医院看看。","ey":"Wǒ dùzi yǒudiǎnr téng, xiǎng qù yīyuàn kànkan.","ev":"Tôi hơi đau bụng, muốn đến bệnh viện khám."},{"h":"感情","p":"gǎnqíng","v":"Tình cảm","ez":"他和他姐姐的感情非常好。","ey":"Tā hé tā jiějie de gǎnqíng fēicháng hǎo.","ev":"Tình cảm giữa anh ấy và chị gái rất tốt."},{"h":"烦恼","p":"fán nǎo","v":"Phiền muộn, buồn phiền","ez":"有烦恼的时候，我喜欢找朋友聊天。","ey":"Yǒu fánnǎo de shíhou, wǒ xǐhuan zhǎo péngyou liáotiān.","ev":"Những lúc buồn phiền, tôi thích tìm bạn để tâm sự."},{"h":"掉","p":"diào","v":"(Được dùng sau một số động từ để chỉ kết quả của hành động) Mất, đi, hết","ez":"桌上的蛋糕被弟弟吃掉了。","ey":"Zhuō shang de dàngāo bèi dìdi chīdiào le.","ev":"Cái bánh ngọt trên bàn bị em trai ăn mất rồi."}]],"texts":[{"no":1,"tz":"小李和小林聊天气和身体情况","tv":"Tiểu Lý và Tiểu Lâm nói chuyện về thời tiết và sức khoẻ","lines":[{"s":"小李","z":"你的鼻子怎么流血了？快用纸擦擦。","p":"Nǐ de bízi zěnme liúxiě le? Kuài yòng zhǐ cāca.","v":"Mũi cậu sao lại chảy máu thế? Mau lấy giấy lau đi."},{"s":"小林","z":"我还不习惯北方的气候，估计是天气太干。今天天气不是很冷，你怎么穿这么多？","p":"Wǒ hái bù xíguàn běifāng de qìhòu, gūjì shì tiānqì tài gān. Jīntiān tiānqì bú shì hěn lěng, nǐ zěnme chuān zhème duō?","v":"Tớ vẫn chưa quen khí hậu miền Bắc, chắc là do thời tiết khô quá. Hôm nay trời có lạnh lắm đâu, sao cậu mặc nhiều thế?"},{"s":"小李","z":"就是因为昨天穿得太少，我都感冒了。","p":"Jiù shì yīnwèi zuótiān chuān de tài shǎo, wǒ dōu gǎnmào le.","v":"Chính vì hôm qua mặc ít quá nên tớ bị cảm rồi đây này."},{"s":"小林","z":"最近感冒的人特别多。你去看医生了吗？","p":"Zuìjìn gǎnmào de rén tèbié duō. Nǐ qù kàn yīshēng le ma?","v":"Dạo này nhiều người bị cảm lắm. Cậu đi khám bác sĩ chưa?"},{"s":"小李","z":"没有，我只是咳嗽，有点儿头疼，不严重，多喝点儿水就好了。","p":"Méiyǒu, wǒ zhǐshì késou, yǒudiǎnr tóuténg, bù yánzhòng, duō hē diǎnr shuǐ jiù hǎo le.","v":"Chưa, tớ chỉ ho thôi, hơi đau đầu một chút, không nghiêm trọng, uống nhiều nước là khỏi."},{"s":"小林","z":"春天天气时冷时热，特别容易感冒。这时候一定要多注意保暖，另外，最好经常打开窗户换换空气。","p":"Chūntiān tiānqì shí lěng shí rè, tèbié róngyì gǎnmào. Zhè shíhou yídìng yào duō zhùyì bǎonuǎn, lìngwài, zuìhǎo jīngcháng dǎkāi chuānghu huànhuan kōngqì.","v":"Thời tiết mùa xuân lúc lạnh lúc nóng, rất dễ bị cảm. Lúc này nhất định phải chú ý giữ ấm, ngoài ra, tốt nhất là nên thường xuyên mở cửa sổ cho thoáng khí."}]},{"no":2,"tz":"小夏和小雨聊小雨抽烟的事情","tv":"Tiểu Hạ và Tiểu Vũ nói về chuyện hút thuốc của Tiểu Vũ","lines":[{"s":"小夏","z":"你咳嗽好点儿了吗？医生怎么说的？","p":"Nǐ késou hǎo diǎnr le ma? Yīshēng zěnme shuō de?","v":"Cậu đỡ ho hơn chưa? Bác sĩ nói thế nào?"},{"s":"小雨","z":"还是老样子，他让我以后不要再抽烟了。","p":"Háishì lǎo yàngzi, tā ràng wǒ yǐhòu búyào zài chōuyān le.","v":"Vẫn thế thôi, bác sĩ bảo tớ từ nay đừng hút thuốc nữa."},{"s":"小夏","z":"抽烟对身体一点儿好处也没有。","p":"Chōuyān duì shēntǐ yìdiǎnr hǎochù yě méiyǒu.","v":"Hút thuốc chẳng có lợi gì cho sức khoẻ cả."},{"s":"小雨","z":"我也知道，可是我觉得抽烟这个动作看上去很帅。","p":"Wǒ yě zhīdào, kěshì wǒ juéde chōuyān zhège dòngzuò kàn shàngqu hěn shuài.","v":"Tớ cũng biết, nhưng tớ thấy động tác hút thuốc trông rất ngầu."},{"s":"小夏","z":"等你身体出现问题了，后悔就来不及了。","p":"Děng nǐ shēntǐ chūxiàn wèntí le, hòuhuǐ jiù láibují le.","v":"Đợi đến khi sức khoẻ có vấn đề rồi thì hối cũng không kịp đâu."},{"s":"小雨","z":"其实家人也一直反对我抽烟，我自己却觉得没什么。但最近总是咳嗽，所以我有些担心了。","p":"Qíshí jiārén yě yìzhí fǎnduì wǒ chōuyān, wǒ zìjǐ què juéde méi shénme. Dàn zuìjìn zǒngshì késou, suǒyǐ wǒ yǒuxiē dānxīn le.","v":"Thật ra người nhà cũng luôn phản đối tớ hút thuốc, còn tớ thì lại thấy chẳng sao cả. Nhưng dạo này cứ ho suốt, nên tớ cũng hơi lo."},{"s":"小夏","z":"抽烟不仅对自己没好处，还会影响周围人的身体健康。为了你和你的家人，别再抽了。","p":"Chōuyān bùjǐn duì zìjǐ méi hǎochù, hái huì yǐngxiǎng zhōuwéi rén de shēntǐ jiànkāng. Wèile nǐ hé nǐ de jiārén, bié zài chōu le.","v":"Hút thuốc không chỉ chẳng có lợi gì cho bản thân, mà còn ảnh hưởng đến sức khoẻ của những người xung quanh. Vì cậu và vì người nhà cậu, đừng hút nữa."}]},{"no":3,"tz":"小李和小林聊电脑对身体的影响","tv":"Tiểu Lý và Tiểu Lâm nói về ảnh hưởng của máy tính đối với sức khoẻ","lines":[{"s":"小李","z":"我最近眼睛总是跳，大夫说是因为我长时间看电脑，眼睛太累。","p":"Wǒ zuìjìn yǎnjing zǒngshì tiào, dàifu shuō shì yīnwèi wǒ cháng shíjiān kàn diànnǎo, yǎnjing tài lèi.","v":"Dạo này mắt tớ cứ giật liên tục, bác sĩ bảo là vì tớ nhìn máy tính quá lâu, mắt mỏi quá."},{"s":"小林","z":"长时间坐在电脑前面工作，眼睛很容易累。最好是每过一小时就休息休息，然后再开始工作。","p":"Cháng shíjiān zuò zài diànnǎo qiánmian gōngzuò, yǎnjing hěn róngyì lèi. Zuìhǎo shì měi guò yì xiǎoshí jiù xiūxi xiūxi, ránhòu zài kāishǐ gōngzuò.","v":"Ngồi làm việc trước máy tính lâu thì mắt rất dễ mỏi. Tốt nhất là cứ mỗi tiếng lại nghỉ một lát, rồi hãy làm tiếp."},{"s":"小李","z":"医生也这么说，他还告诉我要多向远处看看，尤其是多看看绿色的植物。","p":"Yīshēng yě zhème shuō, tā hái gàosu wǒ yào duō xiàng yuǎnchù kànkan, yóuqí shì duō kànkan lǜsè de zhíwù.","v":"Bác sĩ cũng nói vậy, ông ấy còn dặn tớ phải nhìn ra xa nhiều hơn, nhất là nhìn cây xanh nhiều vào."},{"s":"小林","z":"长时间对着电脑不仅对眼睛不好，身体也会不舒服。研究发现，如果人一天静坐超过6小时，就会影响身体健康。","p":"Cháng shíjiān duìzhe diànnǎo bùjǐn duì yǎnjing bù hǎo, shēntǐ yě huì bù shūfu. Yánjiū fāxiàn, rúguǒ rén yì tiān jìngzuò chāoguò liù xiǎoshí, jiù huì yǐngxiǎng shēntǐ jiànkāng.","v":"Ngồi trước máy tính lâu không chỉ hại mắt, mà cơ thể cũng sẽ khó chịu. Nghiên cứu cho thấy, nếu một ngày người ta ngồi yên quá 6 tiếng thì sẽ ảnh hưởng đến sức khoẻ."},{"s":"小李","z":"是啊！像咱们这些久坐办公室的人要注意，有时间应该多站起来活动活动。","p":"Shì a! Xiàng zánmen zhèxiē jiǔ zuò bàngōngshì de rén yào zhùyì, yǒu shíjiān yīnggāi duō zhàn qǐlai huódòng huódòng.","v":"Đúng thế! Những người ngồi văn phòng lâu như bọn mình phải chú ý, có thời gian thì nên đứng dậy vận động một chút."},{"s":"小林","z":"好，咱们午饭后就去附近的公园散散步吧。","p":"Hǎo, zánmen wǔfàn hòu jiù qù fùjìn de gōngyuán sànsan bù ba.","v":"Được, ăn trưa xong bọn mình ra công viên gần đây đi dạo một lát nhé."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"每个人都希望自己健康，那么什么才是健康呢？","p":"Měi ge rén dōu xīwàng zìjǐ jiànkāng, nàme shénme cái shì jiànkāng ne?","v":"Ai cũng mong mình khoẻ mạnh, vậy thế nào mới là khoẻ mạnh?"},{"s":"","z":"过去，人们认为健康就是指身体不生病。","p":"Guòqù, rénmen rènwéi jiànkāng jiùshì zhǐ shēntǐ bù shēngbìng.","v":"Trước đây, người ta cho rằng khoẻ mạnh có nghĩa là cơ thể không mắc bệnh."},{"s":"","z":"但是，现在人们认识到，健康还指精神上的健康。","p":"Dànshì, xiànzài rénmen rènshi dào, jiànkāng hái zhǐ jīngshén shàng de jiànkāng.","v":"Nhưng bây giờ người ta đã nhận ra, khoẻ mạnh còn là khoẻ mạnh về mặt tinh thần."},{"s":"","z":"只有身体和精神都健康，才算是真正的健康。","p":"Zhǐyǒu shēntǐ hé jīngshén dōu jiànkāng, cái suànshì zhēnzhèng de jiànkāng.","v":"Chỉ khi cả thể chất lẫn tinh thần đều khoẻ mạnh thì mới được coi là khoẻ mạnh thật sự."},{"s":"","z":"有一位教授用数字来说明健康有多么重要：要是健康是1，其他都是1后面的0；如果没有1，不管有多少0也没用。","p":"Yǒu yí wèi jiàoshòu yòng shùzì lái shuōmíng jiànkāng yǒu duōme zhòngyào: Yàoshi jiànkāng shì yī, qítā dōu shì yī hòumiàn de líng; rúguǒ méiyǒu yī, bùguǎn yǒu duōshǎo líng yě méi yòng.","v":"Có một vị giáo sư đã dùng con số để nói rõ sức khoẻ quan trọng đến nhường nào: nếu sức khoẻ là số 1 thì những thứ khác đều là số 0 đứng sau số 1; nếu không có số 1 thì có bao nhiêu số 0 cũng vô ích."},{"s":"","z":"所以我们平时一定要注意锻炼，别等健康出问题了才后悔。","p":"Suǒyǐ wǒmen píngshí yídìng yào zhùyì duànliàn, bié děng jiànkāng chū wèntí le cái hòuhuǐ.","v":"Vì vậy ngày thường chúng ta nhất định phải chú ý rèn luyện, đừng đợi đến khi sức khoẻ có vấn đề rồi mới hối hận."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"我听一位医生说过一句话：“最好的医生是自己，最好的药是时间，最好的运动是散步。”","p":"Wǒ tīng yí wèi yīshēng shuōguo yí jù huà: “Zuì hǎo de yīshēng shì zìjǐ, zuì hǎo de yào shì shíjiān, zuì hǎo de yùndòng shì sànbù.”","v":"Tôi từng nghe một vị bác sĩ nói một câu: “Bác sĩ tốt nhất là chính mình, liều thuốc tốt nhất là thời gian, môn vận động tốt nhất là đi dạo.”"},{"s":"","z":"前两条我理解得不深，最后一条我完全同意。","p":"Qián liǎng tiáo wǒ lǐjiě de bù shēn, zuìhòu yì tiáo wǒ wánquán tóngyì.","v":"Hai điều đầu tôi hiểu chưa sâu, còn điều cuối cùng thì tôi hoàn toàn đồng ý."},{"s":"","z":"散步是生活中最简单的锻炼方法，既可以活动身体，又可以减肥，而且不会像跑步那样辛苦。","p":"Sànbù shì shēnghuó zhōng zuì jiǎndān de duànliàn fāngfǎ, jì kěyǐ huódòng shēntǐ, yòu kěyǐ jiǎnféi, érqiě bú huì xiàng pǎobù nàyàng xīnkǔ.","v":"Đi dạo là cách rèn luyện đơn giản nhất trong cuộc sống, vừa vận động được cơ thể, lại vừa giảm được cân, hơn nữa không vất vả như chạy bộ."},{"s":"","z":"晚饭后，一家人一起出去散散步，是一件很幸福的事情。","p":"Wǎnfàn hòu, yì jiā rén yìqǐ chūqu sànsan bù, shì yí jiàn hěn xìngfú de shìqing.","v":"Sau bữa tối, cả nhà cùng nhau ra ngoài đi dạo là một điều rất hạnh phúc."},{"s":"","z":"肚子吃饱了需要活动，家人忙了一天需要交流，夫妻说说一天的工作能加深感情，听孩子谈谈学校里有意思的事，一天的烦恼就都跑掉了。","p":"Dùzi chībǎo le xūyào huódòng, jiārén máng le yì tiān xūyào jiāoliú, fūqī shuōshuo yì tiān de gōngzuò néng jiāshēn gǎnqíng, tīng háizi tántan xuéxiào li yǒu yìsi de shì, yì tiān de fánnǎo jiù dōu pǎodiào le.","v":"Bụng ăn no rồi thì cần vận động, người nhà bận rộn cả ngày thì cần trò chuyện; vợ chồng kể cho nhau nghe công việc trong ngày có thể làm tình cảm thêm sâu đậm, nghe con kể chuyện thú vị ở trường, thế là bao phiền muộn cả ngày đều tan biến hết."}]}],"gram":[{"id":"guji","t":"估计 + mệnh đề","s":"Đoán chừng, chắc là… (phỏng đoán có căn cứ)","b":"<b>估计</b> là động từ, dùng để đưa ra phán đoán dựa trên tình hình đã biết. Điểm khác biệt lớn nhất so với các từ tiếng Việt tương đương: <b>估计</b> đứng trước cả một mệnh đề, chứ không phải một tính từ đơn lẻ. Người nói thường đứng ở đầu câu hoặc đầu vế sau: “估计 + chủ ngữ + vị ngữ”.","r":["Vị trí: 估计 đặt TRƯỚC mệnh đề phỏng đoán — 估计快要下雨了, 估计他不来了.","Sau 估计 thường có 了、会、快要……了 để chỉ việc chưa xảy ra.","估计 mang sắc thái có căn cứ (nhìn trời, nhìn đồng hồ, biết tình hình); 可能 chỉ nêu khả năng chung chung.","Lỗi hay gặp: ✗ 天气估计。 → ✓ 估计天气太干。 (估计 không đứng cuối câu, phải kéo theo mệnh đề)"],"e":[["我还不习惯北方的气候，估计是天气太干。","Wǒ hái bù xíguàn běifāng de qìhòu, gūjì shì tiānqì tài gān.","Tớ vẫn chưa quen khí hậu miền Bắc, chắc là do thời tiết khô quá <i>(bài khoá 1)</i>"]],"d":[["_______________，我们还是下次再去吧。","估计快要下雨了"],["我现在就过去，______________。","估计二十分钟到"],["你可以上网买书，________________。","估计比较便宜"]],"w":"估计 dùng cho phán đoán về sự việc; muốn nói “ước lượng con số” cũng dùng 估计 (估计有一百人). Đừng dùng 估计 để nói ý muốn của bản thân — ý muốn dùng 打算 / 想."},{"id":"laibuji","t":"来不及 / 来得及","s":"Không kịp / còn kịp (về thời gian)","b":"<b>来不及</b> nghĩa là thời gian không đủ để làm xong việc gì; dạng khẳng định là <b>来得及</b>. Có thể đứng một mình làm vị ngữ (现在来不及了) hoặc mang theo động từ phía sau (来不及开会 / 来不及吃饭).","r":["Cấu trúc: chủ ngữ + 来不及 (+ động từ + tân ngữ) — 今天来不及开会了.","Phủ định KHÔNG dùng 不: ✗ 不来不及 → ✓ 来得及 (còn kịp).","Hay đi với 再不……就来不及了 để cảnh báo: 再不出门就来不及了.","Lỗi hay gặp: ✗ 我来不及了去。 → ✓ 我来不及去了。 (động từ phải đứng ngay sau 来不及)"],"e":[["等你身体出现问题了，后悔就来不及了。","Děng nǐ shēntǐ chūxiàn wèntí le, hòuhuǐ jiù láibují le.","Đợi đến khi sức khoẻ có vấn đề rồi thì hối cũng không kịp <i>(bài khoá 2)</i>"]],"d":[["_______________，明天我们再找时间说这个问题。","今天来不及开会了"],["我本来打算去图书馆还书，______________。","现在来不及了"],["节目8点开始，________________。","再不出门就来不及了"]],"w":"Phân biệt với 赶不上 (không đuổi kịp / lỡ chuyến): 来不及 nhấn vào THỜI GIAN không đủ, 赶不上 nhấn vào việc lỡ mất đối tượng cụ thể (赶不上火车)."},{"id":"dongci-chongdie","t":"Lặp động từ: AA / AAB / A一A / A了A","s":"Làm một chút, thử làm — ngữ khí nhẹ nhàng","b":"Lặp động từ làm cho hành động trở nên <b>ngắn, nhẹ, thoải mái</b> và câu nói bớt cứng nhắc. Động từ một âm tiết lặp thành <b>AA</b> (擦擦、看看), động từ hai âm tiết lặp thành <b>ABAB</b> (休息休息、活动活动), còn động từ dạng “động + tân” thì chỉ lặp chữ ĐẦU thành <b>AAB</b> (散步 → 散散步, 游泳 → 游游泳, 聊天 → 聊聊天).","r":["Từ ly hợp (动宾式) chỉ lặp âm tiết động từ: 散步 → 散散步 ✓, ✗ 散步散步.","Âm tiết lặp lại đọc nhẹ (khinh thanh): cāca, kànkan, sànsan bù.","Rất hay dùng trong lời đề nghị, rủ rê cho lịch sự: 快用纸擦擦 / 咱们去散散步吧.","Lỗi hay gặp: ✗ 我们去公园散步散步。 → ✓ 我们去公园散散步。"],"e":[["快用纸擦擦。","Kuài yòng zhǐ cāca.","Mau lấy giấy lau đi <i>(bài khoá 1)</i>"],["最好经常打开窗户换换空气。","Zuìhǎo jīngcháng dǎkāi chuānghu huànhuan kōngqì.","Tốt nhất nên thường xuyên mở cửa sổ cho thoáng khí <i>(bài khoá 1)</i>"],["好，咱们午饭后就去附近的公园散散步吧。","Hǎo, zánmen wǔfàn hòu jiù qù fùjìn de gōngyuán sànsan bù ba.","Được, ăn trưa xong bọn mình ra công viên gần đây đi dạo một lát nhé <i>(bài khoá 3)</i>"]],"d":[["_______________，对身体好。","跟我去游游泳"],["你有时间应该多回家看看爸妈，______________。","陪他们聊聊天"],["我帮你跟小李联系好了，________________。","抽个时间见见面"]],"w":"Không lặp động từ khi hành động đang diễn ra (✗ 他正在看看电视) hoặc với động từ chỉ trạng thái/tâm lý như 是、有、知道、觉得."},{"id":"yaoshi-jiu","t":"要是……(就)……","s":"Nếu như… thì…","b":"<b>要是</b> nêu điều kiện giả thiết, vế sau thường có <b>就</b> hoặc <b>那</b> để nối kết quả. 要是 mang màu sắc khẩu ngữ, còn <b>如果</b> trang trọng hơn — hai từ này thay thế được cho nhau trong hầu hết trường hợp.","r":["Vị trí: 要是 đứng đầu vế điều kiện, TRƯỚC hoặc SAU chủ ngữ đều được — 要是你有时间 = 你要是有时间.","Vế sau nên có 就: 你要是有时间，就来帮我搬家.","Có thể thêm 的话 ở cuối vế điều kiện: 要是明天下雨的话，我就不去了.","Lỗi hay gặp: ✗ 要是你有时间，但是来帮我。 → ✓ 要是你有时间，就来帮我。"],"e":[["要是健康是1，其他都是1后面的0。","Yàoshi jiànkāng shì yī, qítā dōu shì yī hòumiàn de líng.","Nếu sức khoẻ là số 1 thì những thứ khác đều là số 0 đứng sau số 1 <i>(bài khoá 4)</i>"]],"d":[["_______________，20分钟就能到。","要是咱们打车去"],["你要是有时间，就______________。","来帮我搬家"],["________________，可能不够，再买两瓶吧。","要是只买一瓶"]],"w":"Đừng nhầm 要是 (nếu) với 就是 (chính là) và 要 (muốn/sẽ). Trong bài khoá 4 có cả 要是……和 如果…… nằm cạnh nhau — chúng cùng nghĩa, dùng xen kẽ cho câu văn đỡ lặp."},{"id":"ji-you","t":"既……又……","s":"Vừa… lại vừa… (nêu hai đặc điểm cùng tồn tại)","b":"<b>既……又……</b> nối hai tính chất hoặc hai hành động cùng thuộc về một chủ thể, ý nhấn mạnh “có cả hai”. Sau 既 và 又 phải là hai thành phần <b>cùng loại</b> (cùng là tính từ, hoặc cùng là cụm động từ). Ngoài 又, có thể dùng 既……也…… / 既……还…….","r":["Chủ ngữ chỉ nói MỘT LẦN, đặt trước 既: 散步既可以活动身体，又可以减肥.","Hai vế phải cân xứng: ✗ 他既聪明，又学习好一点儿 → ✓ 他既聪明，又努力.","既 không đứng trước danh từ: ✗ 既苹果又香蕉 → ✓ 又有苹果，又有香蕉.","Lỗi hay gặp: ✗ 既……而且…… → ✓ 既……又…… (muốn tăng tiến thêm mới dùng 而且 ở vế thứ ba)"],"e":[["既可以活动身体，又可以减肥，而且不会像跑步那样辛苦。","Jì kěyǐ huódòng shēntǐ, yòu kěyǐ jiǎnféi, érqiě bú huì xiàng pǎobù nàyàng xīnkǔ.","Vừa vận động được cơ thể, lại vừa giảm được cân, hơn nữa không vất vả như chạy bộ <i>(bài khoá 5)</i>"]],"d":[["A：这两件衣服太漂亮了，你打算买哪件？ B：我既想要这件，____________。","又想要那件"],["A：你们愿意跟他交朋友吗？ B：我们都愿意跟他交朋友，因为他____________，还大方。","既善良"]],"w":"既……又…… nêu hai mặt SONG SONG (ngang hàng); còn 不但……而且…… là quan hệ TĂNG TIẾN (vế sau mạnh hơn vế trước). 既 còn có nghĩa “đã… thì” trong 既然……就……, đừng lẫn."},{"id":"bujin-hai","t":"不仅……还/也……","s":"Không chỉ… mà còn…","b":"<b>不仅</b> (= 不但) nêu một ý, vế sau dùng <b>还、也、而且</b> để bổ sung một ý mạnh hơn hoặc rộng hơn. Đây là quan hệ tăng tiến, rất hay gặp khi nêu tác hại/lợi ích của một việc.","r":["Cùng một chủ ngữ: chủ ngữ đứng TRƯỚC 不仅 — 抽烟不仅对自己没好处，还会影响别人.","Khác chủ ngữ: 不仅 đứng TRƯỚC chủ ngữ vế đầu — 不仅他知道，我们也都知道.","Vế sau bắt buộc có 还/也/而且, không được bỏ trống.","Lỗi hay gặp: ✗ 不仅对眼睛不好，身体不舒服。 → ✓ 不仅对眼睛不好，身体也会不舒服。"],"e":[["抽烟不仅对自己没好处，还会影响周围人的身体健康。","Chōuyān bùjǐn duì zìjǐ méi hǎochù, hái huì yǐngxiǎng zhōuwéi rén de shēntǐ jiànkāng.","Hút thuốc không chỉ chẳng có lợi gì cho bản thân, mà còn ảnh hưởng đến sức khoẻ của những người xung quanh <i>(bài khoá 2)</i>"],["长时间对着电脑不仅对眼睛不好，身体也会不舒服。","Cháng shíjiān duìzhe diànnǎo bùjǐn duì yǎnjing bù hǎo, shēntǐ yě huì bù shūfu.","Ngồi trước máy tính lâu không chỉ hại mắt, mà cơ thể cũng sẽ khó chịu <i>(bài khoá 3)</i>"]],"d":[],"w":"不仅 và 不但 giống nhau về nghĩa, 不仅 hơi trang trọng hơn. Nhớ vị trí chủ ngữ: CÙNG chủ ngữ thì “S + 不仅…”, KHÁC chủ ngữ thì “不仅 + S1…, S2 也…”."},{"id":"yidianr-ye-mei","t":"一点儿 + danh từ + 也/都 + 没有/不……","s":"Một chút… cũng không có / chẳng… chút nào","b":"Đây là cách phủ định nhấn mạnh: đưa “一点儿 + danh từ” lên trước động từ, rồi dùng <b>也</b> hoặc <b>都</b> nối với phủ định 没有/不. Nghĩa là “hoàn toàn không, không hề”.","r":["Trật tự cố định: 一点儿 + N + 也/都 + 不/没(有) — 抽烟对身体一点儿好处也没有.","Bắt buộc phải có 也 hoặc 都; thiếu là sai: ✗ 一点儿好处没有.","Nếu không có danh từ, dùng ngay: 我一点儿也不累。","Lỗi hay gặp: ✗ 我不一点儿累。 → ✓ 我一点儿也不累。"],"e":[["抽烟对身体一点儿好处也没有。","Chōuyān duì shēntǐ yìdiǎnr hǎochù yě méiyǒu.","Hút thuốc chẳng có lợi gì cho sức khoẻ cả <i>(bài khoá 2)</i>"]],"d":[],"w":"Cấu trúc này CHỈ dùng cho câu phủ định. Câu khẳng định “có một chút” thì nói 有一点儿好处 và 一点儿 đứng sau động từ."},{"id":"zhiyou-cai","t":"只有……才……","s":"Chỉ có… mới… (điều kiện duy nhất)","b":"<b>只有</b> nêu điều kiện DUY NHẤT, không có nó thì kết quả không thể xảy ra; vế sau bắt buộc dùng <b>才</b>. Đây là điều kiện chặt hơn hẳn 只要……就…….","r":["Cặp cố định 只有……才……, không được thay 才 bằng 就.","才 luôn đứng TRƯỚC động từ của vế sau: ……才算是真正的健康.","只有 có thể đứng trước hoặc sau chủ ngữ: 只有他才知道 = 这件事只有他才知道.","Lỗi hay gặp: ✗ 只有多运动，就会健康。 → ✓ 只有多运动，才会健康。"],"e":[["只有身体和精神都健康，才算是真正的健康。","Zhǐyǒu shēntǐ hé jīngshén dōu jiànkāng, cái suànshì zhēnzhèng de jiànkāng.","Chỉ khi cả thể chất lẫn tinh thần đều khoẻ mạnh thì mới được coi là khoẻ mạnh thật sự <i>(bài khoá 4)</i>"]],"d":[],"w":"只有……才…… = điều kiện BẮT BUỘC (không có thì chắc chắn không được); 只要……就…… = điều kiện ĐỦ (chỉ cần có là được). Chọn nhầm cặp là lỗi thi HSK4 rất phổ biến."},{"id":"buguan-ye","t":"不管……，也/都……","s":"Bất kể… cũng…","b":"<b>不管</b> nêu ra một điều kiện dù thay đổi thế nào thì kết quả vẫn không đổi; vế sau bắt buộc có <b>也</b> hoặc <b>都</b>. Sau 不管 phải là một thành phần mang tính “không xác định”: từ nghi vấn (多少、什么、谁、怎么), cấu trúc chính phản (是不是、去不去) hoặc lựa chọn có 还是.","r":["Sau 不管 KHÔNG được dùng câu khẳng định đơn thuần: ✗ 不管有很多0 → ✓ 不管有多少0.","Vế sau bắt buộc có 也/都: 不管有多少0也没用.","不管 (khẩu ngữ) = 无论 / 不论 (viết, trang trọng hơn).","Lỗi hay gặp: ✗ 不管天气怎么样，我去。 → ✓ 不管天气怎么样，我都去。"],"e":[["如果没有1，不管有多少0也没用。","Rúguǒ méiyǒu yī, bùguǎn yǒu duōshǎo líng yě méi yòng.","Nếu không có số 1 thì có bao nhiêu số 0 cũng vô ích <i>(bài khoá 4)</i>"]],"d":[],"w":"Đừng lẫn 不管 với 尽管. 不管 = “bất kể” (điều kiện chưa xác định, vế sau có 都/也); 尽管 = “mặc dù” (sự thật đã xác định, vế sau có 但是)."}],"notes":"1) Chunk slide 61 chỉ gồm 3 CÂU HỎI đọc hiểu (过去人们认为健康指的是什么意思？/ 现在人们认为什么是健康？/ 一位教授是怎么说明健康很重要的？) nên đã loại, không tính là bài khoá. 2) Hai bài đọc (slide 62 và slide 76) trong dữ liệu KHÔNG có tiêu đề; tiêu đề ở đây lấy nguyên văn cụm chữ Hán có sẵn trong chính đoạn văn (什么才是健康 / 最好的运动是散步), không tự đặt thêm câu tiếng Trung nào. 3) Phần chữ Hán của cả 5 bài khoá trong slide là ĐẦY ĐỦ, không thiếu câu nào; không có câu tiếng Trung nào được thêm vào. 4) Pinyin trong slide bị đảo lộn thứ tự dòng và cắt cụt ở mọi chunk: slide 21 và 35 các dòng pinyin xếp sai thứ tự, slide 35 dòng cuối bị ghép sai (“nǐde jiārén, késou, suǒyǐ wǒ yǒuxiē dānxīn le” là mảnh của hai lượt thoại khác nhau), slide 48 và 62 và 76 cũng bị đảo dòng và có dòng bị tách rời. Toàn bộ pinyin trong file này đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 5) Lỗi trong dữ liệu từ mới (theo quy tắc, nghĩa trong batches được GIỮ NGUYÊN, chỉ ghi chú ở đây): 大夫 phần nghĩa tiếng Việt lại ghi “dàifu” (đó là pinyin, nghĩa đúng theo slide 练一练 là “Bác sĩ”); 估计 nghĩa bị cắt cụt “Đoán chừng,” (slide 练一练 ghi đủ là “Đoán chừng, dự đoán”); 烦恼 trong 练一练 bị gán nhầm phần giải nghĩa của từ 掉. Một số pinyin trong batches bị tách rời hoặc sai thanh: 减肥 “jiǎn féi”, 辛苦 “xīn kǔ”, 肚子 “dù zǐ” (chuẩn: jiǎnféi, xīnkǔ, dùzi), 咳嗽 “késòu” (chuẩn: késou), 流血 “liúxiě” (cũng đọc liúxuè), 指/数字/说明/要是 viết hoa chữ đầu. Trong ví dụ và bài khoá đã dùng pinyin chuẩn. 6) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở trên được suy ra từ 练一练 (估计, 来不及, AAB 动词重叠, 要是, 既……又……) và từ cấu trúc nổi bật trong bài khoá (不仅……还……, 一点儿……也没有, 只有……才……, 不管……也……). 7) 练一练 còn có phần điền từ vựng thuần tuý (严重 / 研究 / 辛苦 / 超过 / 出现, kèm một thẻ lỗi ghi 开玩笑 không thuộc bài 7) — đây là bài tập từ mới chứ không phải điểm ngữ pháp nên không đưa vào mục grammar.","order":[{"z":"你的鼻子怎么流血了？","t":["你","的","鼻子","怎么","流血","了"],"v":"Mũi cậu sao lại chảy máu thế? Mau lấy giấy lau đi."},{"z":"我还不习惯北方的气候，估计是天气太干。","t":["我","还","不","习惯","北方","的","气候","估计","是","天气","太干"],"v":"Tớ vẫn chưa quen khí hậu miền Bắc, chắc là do thời tiết khô quá. Hôm nay trời có lạnh lắm đâu, sao cậu mặc nhiều thế?"},{"z":"今天天气不是很冷，你怎么穿这么多？","t":["今天天气","不是","很","冷","你","怎么","穿","这么","多"],"v":"Tớ vẫn chưa quen khí hậu miền Bắc, chắc là do thời tiết khô quá. Hôm nay trời có lạnh lắm đâu, sao cậu mặc nhiều thế?"},{"z":"就是因为昨天穿得太少，我都感冒了。","t":["就是","因为","昨天","穿得","太少","我","都","感冒","了"],"v":"Chính vì hôm qua mặc ít quá nên tớ bị cảm rồi đây này."},{"z":"最近感冒的人特别多。","t":["最近","感冒","的","人","特别","多"],"v":"Dạo này nhiều người bị cảm lắm. Cậu đi khám bác sĩ chưa?"},{"z":"你去看医生了吗？","t":["你","去","看","医生","了","吗"],"v":"Dạo này nhiều người bị cảm lắm. Cậu đi khám bác sĩ chưa?"},{"z":"春天天气时冷时热，特别容易感冒。","t":["春天","天气","时冷时热","特别","容易","感冒"],"v":"Thời tiết mùa xuân lúc lạnh lúc nóng, rất dễ bị cảm. Lúc này nhất định phải chú ý giữ ấm, ngoài ra, tốt nhất là nên thường xuyên m"},{"z":"你咳嗽好点儿了吗？","t":["你","咳嗽","好","点儿","了","吗"],"v":"Cậu đỡ ho hơn chưa? Bác sĩ nói thế nào?"},{"z":"还是老样子，他让我以后不要再抽烟了。","t":["还是","老","样子","他","让","我","以后","不要","再","抽烟","了"],"v":"Vẫn thế thôi, bác sĩ bảo tớ từ nay đừng hút thuốc nữa."},{"z":"抽烟对身体一点儿好处也没有。","t":["抽烟","对","身体","一点儿","好处","也","没有"],"v":"Hút thuốc chẳng có lợi gì cho sức khoẻ cả."},{"z":"我也知道，可是我觉得抽烟这个动作看上去很帅。","t":["我","也","知道","可是","我","觉得","抽烟","这个","动作","看上去","很帅"],"v":"Tớ cũng biết, nhưng tớ thấy động tác hút thuốc trông rất ngầu."},{"z":"等你身体出现问题了，后悔就来不及了。","t":["等","你","身体","出现","问题","了","后悔","就","来不及","了"],"v":"Đợi đến khi sức khoẻ có vấn đề rồi thì hối cũng không kịp đâu."},{"z":"但最近总是咳嗽，所以我有些担心了。","t":["但","最近","总是","咳嗽","所以","我","有些","担心","了"],"v":"Thật ra người nhà cũng luôn phản đối tớ hút thuốc, còn tớ thì lại thấy chẳng sao cả. Nhưng dạo này cứ ho suốt, nên tớ cũng hơi lo."},{"z":"为了你和你的家人，别再抽了。","t":["为了","你","和","你","的","家人","别","再","抽","了"],"v":"Hút thuốc không chỉ chẳng có lợi gì cho bản thân, mà còn ảnh hưởng đến sức khoẻ của những người xung quanh. Vì cậu và vì người nhà"},{"z":"长时间坐在电脑前面工作，眼睛很容易累。","t":["长时间","坐在","电脑前面","工作","眼睛","很","容易","累"],"v":"Ngồi làm việc trước máy tính lâu thì mắt rất dễ mỏi. Tốt nhất là cứ mỗi tiếng lại nghỉ một lát, rồi hãy làm tiếp."},{"z":"好，咱们午饭后就去附近的公园散散步吧。","t":["好","咱们","午饭","后","就","去","附近","的","公园","散散步","吧"],"v":"Được, ăn trưa xong bọn mình ra công viên gần đây đi dạo một lát nhé."}]},"8":{"n":8,"tz":"生活中不缺少美","tv":"Chọn đúng tâm trạng, chọn đúng thái độ sống","batches":[[{"h":"巧克力","p":"qiǎo kè lì","v":"Sô – cô - la","ez":"这盒巧克力是我送给妈妈的。","ey":"Zhè hé qiǎokèlì shì wǒ sòng gěi māma de.","ev":"Hộp sô-cô-la này là tôi tặng mẹ."},{"h":"亲戚","p":"qīnqi","v":"họ hàng thân thích","ez":"过年的时候，我们要去看亲戚。","ey":"Guònián de shíhou, wǒmen yào qù kàn qīnqi.","ev":"Dịp Tết, chúng tôi phải đi thăm họ hàng."},{"h":"伤心","p":"shāng xīn","v":"Đau lòng","ez":"别为这点儿小事伤心了。","ey":"Bié wèi zhè diǎnr xiǎoshì shāngxīn le.","ev":"Đừng vì chuyện nhỏ này mà buồn nữa."},{"h":"使","p":"shǐ","v":"Khiến cho, làm cho","ez":"这个好消息使大家很高兴。","ey":"Zhège hǎo xiāoxi shǐ dàjiā hěn gāoxìng.","ev":"Tin vui này khiến mọi người rất phấn khởi."},{"h":"心情","p":"xīn qíng","v":"Tâm trạng","ez":"今天天气这么好，我的心情也很好。","ey":"Jīntiān tiānqì zhème hǎo, wǒ de xīnqíng yě hěn hǎo.","ev":"Hôm nay thời tiết đẹp thế này, tâm trạng tôi cũng rất tốt."},{"h":"愉快","p":"yú kuài","v":"Vui vẻ","ez":"昨天的聚会大家都很愉快。","ey":"Zuótiān de jùhuì dàjiā dōu hěn yúkuài.","ev":"Buổi họp mặt hôm qua ai nấy đều vui vẻ."}],[{"h":"景色","p":"jǐng sè","v":"Phong cảnh, cảnh vật","ez":"秋天山上的景色特别美。","ey":"Qiūtiān shān shang de jǐngsè tèbié měi.","ev":"Cảnh sắc trên núi vào mùa thu đẹp lạ thường."},{"h":"放松","p":"fàng sōng","v":"thả lỏng, thư giãn","ez":"考完试以后，我要放松几天。","ey":"Kǎo wán shì yǐhòu, wǒ yào fàngsōng jǐ tiān.","ev":"Thi xong tôi muốn thư giãn vài ngày."},{"h":"压力 ěn hǎo.","ev":"Thái độ của nhân viên quán ăn đó rất tốt."},{"h":"到处","p":"dào chù","v":"Khắp nơi, đâu đâu","ez":"春天到了，公园里到处是花。","ey":"Chūntiān dào le, gōngyuán lǐ dàochù shì huā.","ev":"Mùa xuân đến rồi, trong công viên đâu đâu cũng là hoa."},{"h":"缺少","p":"quē shǎo","v":"Thiếu","ez":"他还很年轻，缺少工作经验。","ey":"Tā hái hěn niánqīng, quēshǎo gōngzuò jīngyàn.","ev":"Anh ấy còn trẻ, thiếu kinh nghiệm làm việc."},{"h":"生命","p":"shēng mìng","v":"Sự sống, tính mệnh","ez":"水对所有的生命都很重要。","ey":"Shuǐ duì suǒyǒu de shēngmìng dōu hěn zhòngyào.","ev":"Nước rất quan trọng đối với mọi sự sống."}],[{"h":"特点","p":"tè diǎn","v":"Đặc điểm","ez":"这个地方的特点是安静。","ey":"Zhège dìfang de tèdiǎn shì ānjìng.","ev":"Đặc điểm của nơi này là yên tĩnh."},{"h":"阳光","p":"yáng guāng","v":"Lạc quan, vui vẻ","ez":"这个男孩子又聪明又阳光。","ey":"Zhège nán háizi yòu cōngming yòu yángguāng.","ev":"Cậu bé này vừa thông minh vừa vui tươi lạc quan."},{"h":"证明","p":"zhèng míng","v":"Chứng minh","ez":"这件事证明他说的是真的。","ey":"Zhè jiàn shì zhèngmíng tā shuō de shì zhēn de.","ev":"Chuyện này chứng minh những gì anh ấy nói là thật."},{"h":"积极","p":"jī jí","v":"Tích cực","ez":"他上课时回答问题很积极。","ey":"Tā shàngkè shí huídá wèntí hěn jījí.","ev":"Trong giờ học cậu ấy trả lời câu hỏi rất tích cực."},{"h":"往往","p":"wǎng wǎng","v":"Thường thường","ez":"他周末往往在家看书。","ey":"Tā zhōumò wǎngwǎng zài jiā kàn shū.","ev":"Cuối tuần anh ấy thường ở nhà đọc sách."},{"h":"科学","p":"kē xué","v":"Khoa học","ez":"我弟弟从小就喜欢科学。","ey":"Wǒ dìdi cóngxiǎo jiù xǐhuan kēxué.","ev":"Em trai tôi thích khoa học từ nhỏ."}]],"texts":[{"no":1,"tz":"李老师和高老师聊关于巧克力的事情","tv":"Thầy Lý và thầy Cao nói chuyện về sô-cô-la","lines":[{"s":"李老师","z":"这种巧克力味道不错，你在哪儿买的？","p":"Zhè zhǒng qiǎokèlì wèidào búcuò, nǐ zài nǎr mǎi de?","v":"Loại sô-cô-la này ngon đấy, chị mua ở đâu vậy?"},{"s":"高老师","z":"不是我买的，是我女儿给我从国外带回来的礼物。","p":"Bú shì wǒ mǎi de, shì wǒ nǚ'ér gěi wǒ cóng guówài dài huílai de lǐwù.","v":"Không phải tôi mua đâu, đây là quà con gái tôi mang từ nước ngoài về cho tôi đấy."},{"s":"李老师","z":"很多人出国后常常会买外国的巧克力，回来送给亲戚朋友。","p":"Hěn duō rén chūguó hòu chángcháng huì mǎi wàiguó de qiǎokèlì, huílai sòng gěi qīnqi péngyou.","v":"Nhiều người ra nước ngoài hay mua sô-cô-la ngoại, về tặng cho họ hàng bạn bè."},{"s":"高老师","z":"是啊，因为很多人都爱吃巧克力。尤其是女性。","p":"Shì a, yīnwèi hěn duō rén dōu ài chī qiǎokèlì. Yóuqí shì nǚxìng.","v":"Đúng vậy, vì rất nhiều người thích ăn sô-cô-la, nhất là phụ nữ."},{"s":"李老师","z":"这是为什么呢？","p":"Zhè shì wèi shénme ne?","v":"Vì sao lại thế nhỉ?"},{"s":"高老师","z":"巧克力大多是甜的，而很多女性都喜欢吃甜的。而且，听说伤心难过的时候，吃块儿巧克力，还能使人的心情变得愉快。","p":"Qiǎokèlì dàduō shì tián de, ér hěn duō nǚxìng dōu xǐhuan chī tián de. Érqiě, tīngshuō shāngxīn nánguò de shíhou, chī kuài qiǎokèlì, hái néng shǐ rén de xīnqíng biàn de yúkuài.","v":"Sô-cô-la phần lớn là đồ ngọt, mà nhiều phụ nữ lại thích đồ ngọt. Hơn nữa, nghe nói lúc đau lòng buồn bã, ăn một miếng sô-cô-la còn khiến tâm trạng người ta vui hẳn lên."}]},{"no":2,"tz":"小夏和马克聊关于上次足球比赛的事情","tv":"Tiểu Hạ và Mark nói chuyện về trận bóng đá lần trước","lines":[{"s":"小夏","z":"这里的景色真美，空气也好。","p":"Zhèli de jǐngsè zhēn měi, kōngqì yě hǎo.","v":"Cảnh ở đây đẹp thật, không khí cũng trong lành."},{"s":"马克","z":"怎么样，心情好些了吗？","p":"Zěnmeyàng, xīnqíng hǎo xiē le ma?","v":"Thế nào, tâm trạng đỡ hơn chưa?"},{"s":"小夏","z":"好多了，上次足球比赛后，好久都没这么放松了。","p":"Hǎo duō le, shàng cì zúqiú bǐsài hòu, hǎojiǔ dōu méi zhème fàngsōng le.","v":"Đỡ nhiều rồi. Từ sau trận bóng lần trước, lâu lắm rồi tớ mới thấy thư giãn thế này."},{"s":"马克","z":"你不要有压力，好好儿准备下次比赛就好了。","p":"Nǐ búyào yǒu yālì, hǎohāor zhǔnbèi xià cì bǐsài jiù hǎo le.","v":"Cậu đừng tự tạo áp lực, cứ chuẩn bị cho tốt trận sau là được."},{"s":"小夏","z":"这段时间我总是一个人坐在房间里回忆那次比赛。如果我们能再努力一点儿，就一定会多进一个球。","p":"Zhè duàn shíjiān wǒ zǒngshì yí ge rén zuò zài fángjiān li huíyì nà cì bǐsài. Rúguǒ wǒmen néng zài nǔlì yìdiǎnr, jiù yídìng huì duō jìn yí ge qiú.","v":"Dạo này tớ cứ ngồi một mình trong phòng nhớ lại trận đấu đó. Giá mà bọn mình cố thêm một chút nữa thì chắc chắn đã ghi thêm được một bàn."},{"s":"马克","z":"事情已经发生了，过去的就让它成为过去吧。只要这次你好好儿准备，一定能把比赛踢好。","p":"Shìqing yǐjīng fāshēng le, guòqù de jiù ràng tā chéngwéi guòqù ba. Zhǐyào zhè cì nǐ hǎohāor zhǔnbèi, yídìng néng bǎ bǐsài tī hǎo.","v":"Chuyện đã xảy ra rồi, cái gì qua rồi thì cứ để nó thành quá khứ đi. Chỉ cần lần này cậu chuẩn bị cho tử tế, nhất định sẽ đá tốt trận đấu."}]},{"no":3,"tz":"马克和司机聊关于堵车的事情","tv":"Mark và bác tài nói chuyện về chuyện kẹt xe","lines":[{"s":"马克","z":"师傅，我去大使馆，你是不是走错了？","p":"Shīfu, wǒ qù dàshǐguǎn, nǐ shì bu shì zǒu cuò le?","v":"Bác tài ơi, cháu đi đại sứ quán, bác có đi nhầm đường không đấy?"},{"s":"师傅","z":"现在是上班时间，前面有点儿堵车，我们走另外一条路，距离差不多。","p":"Xiànzài shì shàngbān shíjiān, qiánmiàn yǒudiǎnr dǔchē, wǒmen zǒu lìngwài yì tiáo lù, jùlí chàbuduō.","v":"Giờ đang là giờ đi làm, phía trước hơi kẹt xe, mình đi đường khác, khoảng cách cũng xấp xỉ như nhau thôi."},{"s":"马克","z":"那就好，堵车浪费时间，遇到堵车，心情也“堵”。","p":"Nà jiù hǎo, dǔchē làngfèi shíjiān, yùdào dǔchē, xīnqíng yě “dǔ”.","v":"Vậy thì tốt. Kẹt xe tốn thời gian lắm, gặp cảnh kẹt xe là tâm trạng cũng “tắc” theo."},{"s":"师傅","z":"可不是！上班堵车怕迟到，下班堵车怕回家晚。每天在马路上开车，要想不遇到堵车，还真难。","p":"Kě bú shì! Shàngbān dǔchē pà chídào. Xiàbān dǔchē pà huí jiā wǎn. Měi tiān zài mǎlù shang kāichē, yào xiǎng bú yùdào dǔchē, hái zhēn nán.","v":"Chứ còn gì nữa! Đi làm kẹt xe thì sợ muộn giờ, tan làm kẹt xe thì sợ về nhà trễ. Ngày nào cũng chạy xe ngoài đường, muốn không gặp kẹt xe thì khó thật đấy."},{"s":"马克","z":"一遇到堵车，人们就容易变得没有耐心。长期这样，还会影响脾气甚至性格。但是您的心情为什么这么好呢？","p":"Yí yùdào dǔchē, rénmen jiù róngyì biàn de méiyǒu nàixīn. Chángqī zhèyàng, hái huì yǐngxiǎng píqi shènzhì xìnggé. Dànshì nín de xīnqíng wèi shénme zhème hǎo ne?","v":"Hễ gặp kẹt xe là người ta dễ mất kiên nhẫn. Lâu dài như vậy còn ảnh hưởng đến tính khí, thậm chí cả tính cách. Nhưng sao tâm trạng của bác lại tốt thế ạ?"},{"s":"师傅","z":"我们改变不了堵车，但是可以试着改变自己的心情。堵车时正好可以休息一下，还可以听听自己喜欢的音乐。","p":"Wǒmen gǎibiàn bu liǎo dǔchē, dànshì kěyǐ shìzhe gǎibiàn zìjǐ de xīnqíng. Dǔchē shí zhènghǎo kěyǐ xiūxi yíxià, hái kěyǐ tīngting zìjǐ xǐhuan de yīnyuè.","v":"Mình không thay đổi được chuyện kẹt xe, nhưng có thể thử thay đổi tâm trạng của chính mình. Lúc kẹt xe vừa hay nghỉ ngơi một lát, còn nghe được bản nhạc mình thích nữa."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"草绿了，那是生命的颜色；花开了，那是大自然的礼物。","p":"Cǎo lǜ le, nà shì shēngmìng de yánsè; huā kāi le, nà shì dàzìrán de lǐwù.","v":"Cỏ đã xanh, đó là màu của sự sống; hoa đã nở, đó là món quà của thiên nhiên."},{"s":"","z":"生活中不缺少美，缺少的是发现美的眼睛。","p":"Shēnghuó zhōng bù quēshǎo měi, quēshǎo de shì fāxiàn měi de yǎnjing.","v":"Cuộc sống không thiếu cái đẹp, cái thiếu là đôi mắt biết phát hiện ra cái đẹp."},{"s":"","z":"只要有心，生活中的美到处都是，生活的态度要自己选择，因此，遇到烦恼时，你应该想一些办法让自己从不高兴的心情中走出来。","p":"Zhǐyào yǒuxīn, shēnghuó zhōng de měi dàochù dōu shì, shēnghuó de tàidù yào zìjǐ xuǎnzé, yīncǐ, yùdào fánnǎo shí, nǐ yīnggāi xiǎng yìxiē bànfǎ ràng zìjǐ cóng bù gāoxìng de xīnqíng zhōng zǒu chulai.","v":"Chỉ cần để tâm, cái đẹp trong cuộc sống ở đâu cũng có. Thái độ sống là do mình tự chọn, vì vậy khi gặp phiền muộn, bạn nên nghĩ cách nào đó để đưa mình ra khỏi tâm trạng không vui."},{"s":"","z":"窗外是什么样子，我们无法改变，但我们可以选择站在哪个窗户前。","p":"Chuāng wài shì shénme yàngzi, wǒmen wúfǎ gǎibiàn, dàn wǒmen kěyǐ xuǎnzé zhàn zài nǎge chuānghu qián.","v":"Ngoài cửa sổ là quang cảnh thế nào thì ta không thể thay đổi, nhưng ta có thể chọn đứng trước ô cửa sổ nào."},{"s":"","z":"选择一个能够带给我们快乐的窗户，这样才能选对心情，选对生活的态度。","p":"Xuǎnzé yí ge nénggòu dài gěi wǒmen kuàilè de chuānghu, zhèyàng cái néng xuǎn duì xīnqíng, xuǎn duì shēnghuó de tàidù.","v":"Hãy chọn một ô cửa sổ có thể mang lại niềm vui cho ta, có như vậy mới chọn đúng tâm trạng, chọn đúng thái độ sống."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"科学研究证明，女孩子对衣服颜色的选择往往与她们的性格有关。","p":"Kēxué yánjiū zhèngmíng, nǚháizi duì yīfu yánsè de xuǎnzé wǎngwǎng yǔ tāmen de xìnggé yǒuguān.","v":"Nghiên cứu khoa học chứng minh rằng việc con gái chọn màu quần áo thường có liên quan đến tính cách của họ."},{"s":"","z":"喜欢穿白色衣服的女孩子性格比较阳光，生活态度积极向上是她们的共同特点；而喜欢穿红色衣服的女孩子性格比较浪漫。","p":"Xǐhuan chuān báisè yīfu de nǚháizi xìnggé bǐjiào yángguāng, shēnghuó tàidù jījí xiàngshàng shì tāmen de gòngtóng tèdiǎn; ér xǐhuan chuān hóngsè yīfu de nǚháizi xìnggé bǐjiào làngmàn.","v":"Những cô gái thích mặc đồ trắng thường có tính cách khá lạc quan, thái độ sống tích cực vươn lên là đặc điểm chung của họ; còn những cô gái thích mặc đồ đỏ thì tính cách khá lãng mạn."},{"s":"","z":"颜色也会影响人的心情，不同的颜色会给我们带来不同的感情变化。","p":"Yánsè yě huì yǐngxiǎng rén de xīnqíng, bùtóng de yánsè huì gěi wǒmen dàilái bùtóng de gǎnqíng biànhuà.","v":"Màu sắc cũng ảnh hưởng đến tâm trạng con người, những màu khác nhau mang lại cho ta những biến đổi cảm xúc khác nhau."},{"s":"","z":"红色让人变得热情；黄色和白色让人心情愉快；黑色却容易让人感到伤心；","p":"Hóngsè ràng rén biàn de rèqíng; huángsè hé báisè ràng rén xīnqíng yúkuài; hēisè què róngyì ràng rén gǎndào shāngxīn;","v":"Màu đỏ khiến người ta trở nên nhiệt tình; màu vàng và màu trắng làm tâm trạng vui vẻ; màu đen thì lại dễ khiến người ta thấy buồn;"},{"s":"","z":"人们在看到蓝色时会觉得很舒服，变得安静下来；绿色让我们的眼睛得到休息。","p":"Rénmen zài kàndào lánsè shí huì juéde hěn shūfu, biàn de ānjìng xialai; lǜsè ràng wǒmen de yǎnjing dédào xiūxi.","v":"Khi nhìn thấy màu xanh lam người ta cảm thấy rất dễ chịu, dần trở nên yên tĩnh; màu xanh lá thì cho đôi mắt ta được nghỉ ngơi."}]}],"gram":[{"id":"shi-jianyu","t":"使 + đối tượng + biến hoá (câu kiêm ngữ)","s":"Khiến cho / làm cho ai đó trở nên…","b":"<b>使</b> là động từ gây khiến, dùng trong câu kiêm ngữ: <b>A 使 B + C</b>, trong đó B vừa là tân ngữ của 使 vừa là chủ ngữ của phần sau. Phần đứng sau B luôn là một <b>kết quả, một sự thay đổi</b> (变得愉快, 得到放松, 很生气), chứ không phải một mệnh lệnh. 使 mang màu sắc trang trọng, hay gặp trong văn viết và bài đọc.","r":["Cấu trúc: chủ thể + 使 + người/vật + tính từ hoặc cụm động từ chỉ biến hoá. Ví dụ: 听音乐可以使你心情变得好一些.","Chủ thể của 使 thường là một SỰ VIỆC (吃巧克力、听音乐、这件事), không phải một mệnh lệnh của người nói.","Sau 使 không dùng được động từ chỉ ý chí như 去、买、走: 使 chỉ dẫn ra biến đổi tâm lý, trạng thái, kết quả.","Lỗi hay gặp: ✗ 我使他去买东西。 → ✓ 我让他去买东西。 (sai khiến ai làm gì dùng 让, không dùng 使)"],"e":[["听说伤心难过的时候，吃块巧克力，还能使人的心情变得愉快。","Tīngshuō shāngxīn nánguò de shíhou, chī kuài qiǎokèlì, hái néng shǐ rén de xīnqíng biàn de yúkuài.","Nghe nói lúc đau lòng buồn bã, ăn một miếng sô-cô-la còn khiến tâm trạng người ta vui hẳn lên <i>(bài khoá 1)</i>"],["红色让人变得热情；黄色和白色让人心情愉快。","Hóngsè ràng rén biàn de rèqíng; huángsè hé báisè ràng rén xīnqíng yúkuài.","Màu đỏ khiến người ta trở nên nhiệt tình; màu vàng và màu trắng khiến người ta vui vẻ <i>(bài khoá 5)</i>"]],"d":[["在你烦恼的时候，________________。","听音乐可以使你心情变得好一些"],["房间里应该多放一些绿色植物，______________。","这样可以使我们的眼睛得到放松"],["听完这件事，_________________。","使我很生气"]],"w":"使 và 让 đều dịch là “khiến/làm cho”, nhưng 让 còn dùng để sai khiến, cho phép (让他进来 — cho anh ấy vào), còn 使 chỉ dùng cho biến đổi trạng thái. Trong bài khoá này, 让 xuất hiện ở cả hai nghĩa: 让它成为过去 (để cho) và 让人感到伤心 (khiến cho)."},{"id":"zhiyao-jiu","t":"只要……，就……","s":"Chỉ cần… là…, miễn là… thì…","b":"<b>只要</b> nêu ra <b>điều kiện đủ</b>: chỉ cần có điều kiện này thì kết quả sau chắc chắn xảy ra. 只要 đứng đầu vế điều kiện (trước hoặc sau chủ ngữ), vế sau thường có <b>就</b>; nếu đã có 一定、都、也 thì 就 có thể lược bỏ.","r":["Vị trí: 只要 + điều kiện, + 就 + kết quả. Chủ ngữ hai vế giống nhau thì 只要 đứng sau chủ ngữ: 你只要努力，就一定会进步.","Vế sau hay đi kèm 一定、都、总、能 để nhấn mạnh kết quả chắc chắn.","只要 nêu điều kiện DỄ đạt (chỉ cần bấy nhiêu là đủ); 只有……才…… nêu điều kiện DUY NHẤT, thiếu nó thì không thể.","Lỗi hay gặp: ✗ 只要你好好儿准备，才能踢好比赛。 → ✓ 只要你好好儿准备，就能踢好比赛。 (只要 đi với 就, chỉ có 只有 mới đi với 才)"],"e":[["只要这次你好好儿准备，一定能把比赛踢好。","Zhǐyào zhè cì nǐ hǎohāor zhǔnbèi, yídìng néng bǎ bǐsài tī hǎo.","Chỉ cần lần này cậu chuẩn bị cho tử tế, nhất định sẽ đá tốt trận đấu <i>(bài khoá 2)</i>"],["只要有心，生活中的美到处都是。","Zhǐyào yǒuxīn, shēnghuó zhōng de měi dàochù dōu shì.","Chỉ cần để tâm, cái đẹp trong cuộc sống ở đâu cũng có <i>(bài khoá 4)</i>"]],"d":[["只要是你喜欢做的事情，_______","就一定要试一下儿。"],["只要是关于保护环境的活动，________","就一定会参加。"],["只要能取得好的成绩，________","爸妈一定会支持你。"]],"w":"Đừng nhầm 只要 (chỉ cần — điều kiện đủ) với 只有 (chỉ có — điều kiện duy nhất). So sánh: 只要有时间我就去 (rảnh là tôi đi) ≠ 只有有时间我才去 (phải rảnh mới đi được)."},{"id":"zhongyao-zhuyao-zhiyao-yaoshi","t":"Phân biệt 重要 / 主要 / 只要 / 要是","s":"Bốn từ cùng có chữ 要 nhưng khác hẳn nhau","b":"Đây là bài chọn từ điền vào chỗ trống của giáo trình. Bốn từ này giống nhau về mặt chữ nên rất dễ nhầm, nhưng <b>từ loại</b> khác nhau: 重要 là tính từ, 主要 là tính từ/phó từ, 只要 là liên từ điều kiện, 要是 là liên từ giả thiết.","r":["重要 (quan trọng) — tính từ, làm vị ngữ hoặc định ngữ, có thể thêm 很/最: 面试很重要、重要的事.","主要 (chủ yếu) — làm định ngữ (主要原因) hoặc phó từ 主要是 đứng trước động từ; KHÔNG nói ✗ 很主要.","只要 (chỉ cần) — liên từ, mở đầu vế điều kiện, vế sau có 就/都/一定.","要是 (nếu như) — liên từ giả thiết, tương đương 如果, vế sau thường có 就: 要是别人，估计就办不成了.","Lỗi hay gặp: ✗ 这个问题很主要。 → ✓ 这个问题很重要。"],"e":[["只要有心，生活中的美到处都是。","Zhǐyào yǒuxīn, shēnghuó zhōng de měi dàochù dōu shì.","Chỉ cần để tâm, cái đẹp trong cuộc sống ở đâu cũng có <i>(bài khoá 4)</i>"],["如果我们能再努力一点儿，就一定会多进一个球。","Rúguǒ wǒmen néng zài nǔlì yìdiǎnr, jiù yídìng huì duō jìn yí ge qiú.","Nếu bọn mình cố thêm một chút nữa thì chắc chắn đã ghi thêm được một bàn <i>(bài khoá 2 — 如果 cùng nghĩa với 要是)</i>"]],"d":[["A：我正想找你呢，你说让他学什么专业好？ B：这_____还得看孩子自己的想法。","主要"],["A：上次的事太谢谢你了，_____别人，估计就办不成了。 B：你太客气了，以后有什么需要帮忙的尽管告诉我。","要是"],["A：明天的面试很_____，你最好早点儿出门。 B：我知道，你别担心了，我一定会准时到的。","重要"],["A：真让人羡慕！我本来也想学法律专业的，但是最后没考上。 B：其实做什么工作都一样，_____用心，都能做好。","只要"]],"w":"Mẹo nhận dạng nhanh: sau chỗ trống là một mệnh đề đầy đủ + 就/都 → 只要 hoặc 要是; trước chỗ trống có 很/最 → 重要; chỗ trống đứng giữa “这/那” và động từ, mang nghĩa “chủ yếu là” → 主要."},{"id":"yi-jiu","t":"一……，就……","s":"Hễ… là…; vừa… đã…","b":"Cấu trúc <b>一 + động từ/sự việc A，就 + B</b> diễn tả B xảy ra <b>ngay sau</b> A, hoặc A cứ xảy ra thì B luôn theo sau như một quy luật. 一 và 就 đều là phó từ nên phải đứng <b>sau chủ ngữ, trước động từ</b>.","r":["Cùng một chủ ngữ: 我一回家就睡觉。 Hai chủ ngữ khác nhau thì mỗi vế có chủ ngữ riêng: 一遇到堵车，人们就容易没有耐心。","Không đặt 一/就 trước chủ ngữ: ✗ 一我下课，就去吃饭。 → ✓ 我一下课就去吃饭。","Chỉ thói quen, quy luật thì cuối câu KHÔNG dùng 了; kể một việc đã xảy ra thì có thể thêm 了: 他一听就明白了.","Lỗi hay gặp: ✗ 一遇到堵车，人们容易变得没有耐心。 → ✓ 一遇到堵车，人们就容易变得没有耐心。 (thiếu 就)"],"e":[["一遇到堵车，人们就容易变得没有耐心。","Yí yùdào dǔchē, rénmen jiù róngyì biàn de méiyǒu nàixīn.","Hễ gặp kẹt xe là người ta dễ mất kiên nhẫn <i>(bài khoá 3)</i>"]],"d":[["___遇到堵车，人们___容易变得没有耐心。","一 / 就"]],"w":"Phân biệt với 一边……一边…… (vừa… vừa…, hai việc diễn ra cùng lúc). 一……就…… nhấn mạnh trình tự trước – sau, khoảng cách thời gian rất ngắn."},{"id":"kebushi","t":"可不是！/ 可不！","s":"Chứ còn gì nữa! Đúng thế!","b":"<b>可不是</b> (nói tắt: 可不) là khẩu ngữ dùng để <b>tán đồng mạnh mẽ</b> ý người đối diện vừa nói. Tuy có chữ 不 nhưng nghĩa hoàn toàn khẳng định: “đúng vậy đó, chẳng phải thế sao”. Thường đứng đầu lượt lời, sau đó nói thêm lý do hoặc ví dụ.","r":["Chỉ dùng trong khẩu ngữ, đáp lại một nhận xét, thường sau câu hỏi tu từ hoặc câu cảm thán của người kia.","Sau 可不是 thường có 「，」 rồi nói tiếp: 可不是，所以他有很多朋友。","Không dùng 可不是 để trả lời câu hỏi Có/Không thực sự (你去不去？) — lúc đó phải trả lời 去/不去.","Lỗi hay gặp: hiểu 可不是 thành phủ định. ✗ 「可不是」= không phải → ✓ 「可不是」= đúng vậy."],"e":[["可不是！上班堵车怕迟到。下班堵车怕回家晚。","Kě bú shì! Shàngbān dǔchē pà chídào. Xiàbān dǔchē pà huí jiā wǎn.","Chứ còn gì nữa! Đi làm mà kẹt xe thì sợ muộn giờ, tan làm kẹt xe thì sợ về nhà trễ <i>(bài khoá 3)</i>"]],"d":[["她每天穿这么少，能不感冒吗？_______","可不是，现在的女孩子为了漂亮不怕冷。"],["最近天气怎么这么干呢？________","可不，最近每天皮肤都干干的，特别不舒服。"],["马克的性格真好，大家遇到问题都愿意找他帮忙。________","可不是，所以他有很多朋友。"]],"w":"Đừng nhầm 可不是 (tán đồng) với 不是吗 (chẳng phải sao — câu hỏi tu từ) hay 是不是 (có phải không — câu hỏi thật). Trong bài khoá, 你是不是走错了？ là câu hỏi thật, còn 可不是！là câu tán đồng."},{"id":"yinci","t":"……，因此……","s":"Do đó, vì vậy (dẫn ra kết quả)","b":"<b>因此</b> là liên từ đứng ở <b>đầu vế sau</b> để nêu kết quả/kết luận rút ra từ điều vừa nói. Nó thiên về văn viết, trang trọng hơn 所以. Vế trước KHÔNG cần dùng 因为.","r":["Vị trí: đứng ngay đầu vế thứ hai, thường có dấu phẩy: 生活的态度要自己选择，因此，遇到烦恼时……","因此 chỉ dẫn ra KẾT QUẢ; muốn nêu nguyên nhân phải dùng 因为 / 由于 ở vế trước.","Không nói ✗ 因为……因此…… trong văn viết chuẩn; cặp thông dụng là 因为……所以…… hoặc 由于……因此…….","Lỗi hay gặp: ✗ 因此他很努力，所以考得很好。 → ✓ 他很努力，因此考得很好。"],"e":[["生活的态度要自己选择，因此，遇到烦恼时，你应该想一些办法让自己从不高兴的心情中走出来。","Shēnghuó de tàidù yào zìjǐ xuǎnzé, yīncǐ, yùdào fánnǎo shí, nǐ yīnggāi xiǎng yìxiē bànfǎ ràng zìjǐ cóng bù gāoxìng de xīnqíng zhōng zǒu chulai.","Thái độ sống là do mình tự chọn, vì vậy khi gặp phiền muộn, bạn nên nghĩ cách để mình thoát ra khỏi tâm trạng không vui <i>(bài khoá 4)</i>"]],"d":[["小雨最近心情不好，_______","因此，总是闷闷不乐的。"],["做好小事是完成大事的第一步，________","因此，现在要细心地把小事做好。"],["没人能知道以后会发生什么事，________","因此，我想要享受现在的每一分钟。"]],"w":"因此 ≈ 所以 nhưng trang trọng hơn và thường dùng trong bài viết, bài đọc; trong hội thoại đời thường người Trung Quốc vẫn hay nói 所以."},{"id":"wangwang","t":"往往 + động từ","s":"Thường thường, đại đa số trường hợp là…","b":"<b>往往</b> là phó từ, tổng kết một <b>quy luật đã xảy ra trong quá khứ</b> qua quan sát, thống kê. Nó đứng <b>trước động từ hoặc tính từ</b>, không đứng cuối câu, và thường đi kèm điều kiện, thời gian cụ thể.","r":["Vị trí: chủ ngữ + 往往 + động từ/cụm động từ: ……的选择往往与性格有关.","往往 chỉ nói về quy luật ĐÃ QUA, không dùng cho việc tương lai: ✗ 明天他往往来。 → ✓ 明天他常常来 / 他明天会来.","常常 chỉ nói tần suất cao, có thể dùng cho tương lai và cho ý muốn chủ quan; 往往 phải gắn với hoàn cảnh, điều kiện khách quan.","Lỗi hay gặp: ✗ 我往往去图书馆。 (thiếu điều kiện, lại là ý muốn cá nhân) → ✓ 周末我往往去图书馆。"],"e":[["科学研究证明，女孩子对衣服颜色的选择往往与他们性格有关。","Kēxué yánjiū zhèngmíng, nǚháizi duì yīfu yánsè de xuǎnzé wǎngwǎng yǔ tāmen xìnggé yǒuguān.","Nghiên cứu khoa học chứng minh việc con gái chọn màu quần áo thường có liên quan đến tính cách của họ <i>(bài khoá 5)</i>"]],"d":[["女孩子对衣服颜色的选择______与她们的性格有关。","往往"]],"w":"Nhớ mẹo: 往往 = quy luật rút ra từ quá khứ (có điều kiện đi kèm); 常常 = làm nhiều lần (có thể là tương lai, có thể do mình muốn)."},{"id":"dong-ci-bu-liao","t":"动词 + 不了 / 得了","s":"Không thể… (bổ ngữ khả năng)","b":"<b>动词 + 不了 (bu liǎo)</b> là bổ ngữ khả năng, nghĩa “không thể làm nổi / không có cách nào làm được” vì lý do khách quan. Dạng khẳng định là <b>动词 + 得了</b>. Chú ý 了 ở đây đọc <b>liǎo</b>, không đọc le.","r":["Cấu trúc: 改变不了、吃不了、去不了; khẳng định: 改变得了、吃得了.","Tân ngữ đặt SAU 不了: 我们改变不了堵车 (✗ 我们改变堵车不了).","不了 nhấn mạnh khách quan không làm nổi; 不能 nhấn mạnh không được phép hoặc không có điều kiện.","Lỗi hay gặp: ✗ 我不能吃了这么多。 → ✓ 我吃不了这么多。"],"e":[["我们改变不了堵车，但是可以试着改变自己的心情。","Wǒmen gǎibiàn bu liǎo dǔchē, dànshì kěyǐ shìzhe gǎibiàn zìjǐ de xīnqíng.","Chúng ta không thay đổi được chuyện kẹt xe, nhưng có thể thử thay đổi tâm trạng của chính mình <i>(bài khoá 3)</i>"],["窗外是什么样子，我们无法改变，但我们可以选择站在哪个窗户前。","Chuāng wài shì shénme yàngzi, wǒmen wúfǎ gǎibiàn, dàn wǒmen kěyǐ xuǎnzé zhàn zài nǎge chuānghu qián.","Ngoài cửa sổ là cảnh gì thì ta không thể thay đổi, nhưng ta có thể chọn đứng trước ô cửa sổ nào <i>(bài khoá 4 — 无法 cũng chỉ “không có cách nào”)</i>"]],"d":[["我们改变___了堵车，但是可以试着改变自己的心情。","不"]],"w":"Đừng đọc nhầm 了 thành “le”: 受不了 (shòu bu liǎo — chịu không nổi), 来不了 (lái bu liǎo — không đến được). Nếu câu đã có 不了 thì không thêm 不能 nữa."},{"id":"bianxi-wangwang-jingchang","t":"辨析：往往 / 经常","s":"Đều là “thường”, nhưng 往往 là quy luật đã xảy ra, 经常 chỉ là làm nhiều lần","b":"Sách dành hẳn một mục 比一比 cho cặp này. <b>Giống nhau</b>: cả hai đều làm phó từ, chỉ một tình huống xuất hiện nhiều lần — chỗ nào nói ý này thì thay nhau được, ví dụ 要是缺少调查、不听别人说明情况，不理解往往/经常就可能发生。<b>Khác nhau</b> ở ba điểm: tính quy luật, khả năng dùng cho ý muốn chủ quan / việc chưa xảy ra, và yêu cầu phải nêu kèm điều kiện.","r":["Tính quy luật: 往往 là sự tổng kết tình hình tính đến hiện tại, có quy luật rõ; 经常 chỉ nói động tác lặp nhiều lần, không nhất thiết có quy luật.","Chủ quan / tương lai: 往往 không dùng cho nguyện vọng chủ quan nên chỉ dùng cho việc ĐÃ xảy ra; 经常 thì dùng được cho việc chưa xảy ra: ✓ 我们以后也经常去公园散散步吧。 → ✗ 我们以后也往往去公园散散步吧。","Điều kiện đi kèm: câu có 往往 thường phải nêu rõ tình huống, điều kiện hay kết quả liên quan đến hành động; câu có 经常 thì không cần: ✓ 上大学时我很喜欢运动，往往在周末打篮球、踢足球。 / ✓ 上大学时我很喜欢运动，经常打篮球、踢足球。 (bỏ 在周末 thì không dùng được 往往).","Rút gọn: 经常 thường tương đương 常 — 有的人（经）常会买一些自己本来不需要的东西; còn 往往 KHÔNG rút gọn thành ✗ 往."],"e":[["科学研究证明，女孩子对衣服颜色的选择往往与她们的性格有关。","Kēxué yánjiū zhèngmíng, nǚháizi duì yīfu yánsè de xuǎnzé wǎngwǎng yǔ tāmen de xìnggé yǒuguān.","Nghiên cứu khoa học chứng minh việc con gái chọn màu quần áo thường có liên quan đến tính cách của họ <i>(bài khoá 5 — tổng kết một quy luật)</i>"],["吃完晚饭，他们一家往往去附近的公园散散步。","Chī wán wǎnfàn, tāmen yì jiā wǎngwǎng qù fùjìn de gōngyuán sànsan bù.","Ăn cơm tối xong, cả nhà họ thường ra công viên gần đó dạo bộ <i>(ví dụ của sách — có điều kiện 吃完晚饭 đi kèm)</i>"],["长时间对着电脑工作对身体不好，我们以后也经常去公园散散步吧。","Cháng shíjiān duìzhe diànnǎo gōngzuò duì shēntǐ bù hǎo, wǒmen yǐhòu yě jīngcháng qù gōngyuán sànsan bù ba.","Ngồi máy tính lâu không tốt cho sức khoẻ, sau này bọn mình cũng thường ra công viên đi dạo đi <i>(ví dụ của sách — ý muốn, việc chưa xảy ra nên chỉ dùng được 经常)</i>"]],"d":[["爷爷____________告诉我不管做什么事情都应该认真。","经常 (không dùng 往往 vì không nêu điều kiện, hoàn cảnh)"],["那个饭馆的菜不仅好吃，而且价格不贵，以后咱们可以____________去。","经常 (việc chưa xảy ra, là ý định)"],["很多30岁左右的年轻人，平时工作紧张，他们____________是饿了才吃饭，渴了才喝水。","往往 (tổng kết quy luật, có điều kiện 平时工作紧张)"]],"w":"Mẹo chọn nhanh: câu hướng về tương lai hoặc nói ý muốn (以后、明天、……吧) → chỉ được 经常; câu nêu điều kiện/hoàn cảnh rồi tổng kết một quy luật đã xảy ra → 往往. Và nhớ 经常 rút được thành 常, 往往 thì không rút thành 往."}],"notes":"1) Chunk slide 52 chỉ gồm CÂU HỎI đọc hiểu (出租车司机走错路了吗？为什么？/ 堵车是一件很麻烦的事情，遇到堵车，你会做什么让自己心情变好？) nên đã loại, không tính là bài khoá. 2) Chunk slide 39 và slide 40 KHÔNG phải bài khoá: đó là nội dung bài 选词填空 của 练一练 (chọn trong 重要/主要/只要/要是) bị lẫn vào phần chunks; phần chữ Hán của chúng đã được chuyển vào mục drill của điểm ngữ pháp “Phân biệt 重要/主要/只要/要是”, không dựng thành 课文. 3) Ghép chunk: bài khoá 2 = slide 36 + slide 37 (slide 36 bị cắt giữa chừng ở lượt lời của 小夏, phần còn lại nằm ở slide 37); bài khoá 3 = slide 54 + slide 55. Sau khi ghép, cả ba bài hội thoại đều đủ lượt lời, KHÔNG có câu tiếng Trung nào được thêm vào. 4) Hai bài đọc (slide 61 và slide 69) trong dữ liệu KHÔNG có tiêu đề; tiêu đề ở đây lấy nguyên văn cụm chữ Hán có sẵn trong chính đoạn văn (选对心情，选对生活的态度 / 颜色也会影响人的心情), không tự đặt thêm câu tiếng Trung nào. 5) Pinyin trong slide bị ĐẢO LỘN thứ tự dòng ở mọi chunk có pinyin: slide 23 dòng của 李老师 và 高老师 xếp lẫn nhau và thiếu hẳn phần đầu; slide 36, 54, 55, 61, 69 các dòng cũng bị xáo trộn, nhiều dòng bị cắt giữa câu (ví dụ slide 36 dòng “Xiǎo Xià … Rú ɡuǒ wǒ” nối sang dòng “men nénɡ zài nǔ lì…”; slide 61 dòng “Shēnɡ” bị tách khỏi “huó zhōnɡ bù quē shǎo měi”). Ngoài ra pinyin slide dùng ký tự ɡ và viết rời từng âm tiết, có chỗ sai thanh: “Shì qinɡ” (chuẩn shìqing), “háo jiǔ” (chuẩn hǎojiǔ), “jù lí” (chuẩn jùlí), “Kě bú shi”. Toàn bộ pinyin trong file này đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 6) Lỗi trong dữ liệu từ mới (theo quy tắc, nghĩa trong batches được GIỮ NGUYÊN, chỉ ghi chú ở đây): trong 练一练 (drills) từ 证明 bị gán nhầm phần nghĩa của 生命 (“Sự sống, tính mệnh”) — nghĩa đúng là “Chứng minh” như trong batches; 亲戚 trong batches ghi “Họ hang thân thích” (thiếu dấu, drills ghi đúng là “Họ hàng thân thích”) và pinyin “qīn qì” (chuẩn khẩu ngữ là qīnqi, âm thứ hai đọc nhẹ); 距离 “jù lí” nên viết liền jùlí. Trong ví dụ và bài khoá đã dùng pinyin chuẩn. 7) Slide 语言点 là ảnh nên không có chữ; 8 điểm ngữ pháp ở trên được suy ra từ 练一练 (使, 只要……就……, 重要/主要/只要/要是, 可不是, 因此) và từ cấu trúc nổi bật trong bài khoá (一……就……, 往往, 动词+不了). Ba điểm cuối không có bài luyện tương ứng trong slide nên phần drill của chúng được lấy trực tiếp từ câu trong bài khoá của bài này (khoét trống), không bịa thêm câu mới. 8) 练一练 còn có một thẻ cuối chỉ
