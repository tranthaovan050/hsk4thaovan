变了主意。这些饼干和巧克力送给你了。","p":"Wǒ běnlái yǐjīng dǎsuàn fàngqì le, dànshì nǐ gāngcái de huà ràng wǒ gǎibiànle zhǔyi. Zhèxiē bǐnggān hé qiǎokèlì sòng gěi nǐ le.","v":"Vốn dĩ tớ đã định bỏ cuộc rồi, nhưng lời cậu vừa nói làm tớ đổi ý. Chỗ bánh quy với sô-cô-la này tặng cậu đấy."}]},{"no":2,"tz":"李进和张远聊张远的成功经历","tv":"Lý Tiến và Trương Viễn nói về hành trình thành công của Trương Viễn","lines":[{"s":"李进","z":"你网球打得真好，还得过那么多国际大奖！每次看你比赛，感觉你轻轻松松就赢了。","p":"Nǐ wǎngqiú dǎ de zhēn hǎo, hái déguo nàme duō guójì dà jiǎng! Měi cì kàn nǐ bǐsài, gǎnjué nǐ qīngqīngsōngsōng jiù yíng.","v":"Cậu chơi quần vợt giỏi thật đấy, lại còn từng đoạt bao nhiêu giải lớn quốc tế! Mỗi lần xem cậu thi đấu, tớ đều thấy cậu thắng nhẹ nhàng như không."},{"s":"张远","z":"哪里啊！那是你没看到我辛苦练习的一面，没有人随随便便就能成功的。","p":"Nǎli a! Nà shì nǐ méi kàndào wǒ xīnkǔ liànxí de yí miàn, méiyǒu rén suísuíbiànbiàn jiù néng chénggōng de.","v":"Đâu có! Đó là tại cậu chưa thấy mặt kia — lúc tớ khổ luyện thôi, chẳng có ai qua loa tuỳ tiện mà thành công được cả."},{"s":"李进","z":"我从小也对网球感兴趣，但是到现在还是打得不怎么样。","p":"Wǒ cóngxiǎo yě duì wǎngqiú gǎn xìngqù, dànshì dào xiànzài háishi dǎ de bù zěnmeyàng.","v":"Tớ cũng thích quần vợt từ nhỏ, nhưng đến giờ vẫn chơi chẳng ra sao."},{"s":"张远","z":"你知道吗？不管春夏秋冬，我练球从来没有休息过一天。","p":"Nǐ zhīdào ma? Bùguǎn chūn xià qiū dōng, wǒ liànqiú cónglái méiyǒu xiūxiguo yì tiān.","v":"Cậu biết không? Bất kể xuân hạ thu đông, tớ tập bóng chưa từng nghỉ một ngày nào."},{"s":"李进","z":"真是不容易啊！看来我只看到了你成功时获得的鲜花，却没注意到你成功前流下的汗水。","p":"Zhēn shì bù róngyì a! Kànlái wǒ zhǐ kàndàole nǐ chénggōng shí huòdé de xiānhuā, què méi zhùyì dào nǐ chénggōng qián liúxià de hànshuǐ.","v":"Đúng là không dễ chút nào! Xem ra tớ mới chỉ nhìn thấy hoa tươi cậu nhận được lúc thành công, mà không để ý tới mồ hôi cậu đã đổ trước khi thành công."},{"s":"张远","z":"任何成功都要通过努力才能得到。只要你坚持练习，我相信你也会越打越好的。","p":"Rènhé chénggōng dōu yào tōngguò nǔlì cái néng dédào. Zhǐyào nǐ jiānchí liànxí, wǒ xiāngxìn nǐ yě huì yuè dǎ yuè hǎo de.","v":"Bất kỳ thành công nào cũng phải qua nỗ lực mới có được. Chỉ cần cậu kiên trì luyện tập, tớ tin cậu cũng sẽ càng chơi càng hay thôi."}]},{"no":3,"tz":"小林和小李谈王红的成功经历","tv":"Tiểu Lâm và Tiểu Lý bàn về con đường thành công của Vương Hồng","lines":[{"s":"小林","z":"你还记得王红吗？我在报纸上看到一篇关于她的新闻，她现在已经是一个有名的作家了。","p":"Nǐ hái jìde Wáng Hóng ma? Wǒ zài bàozhǐ shang kàndào yì piān guānyú tā de xīnwén, tā xiànzài yǐjīng shì yí ge yǒumíng de zuòjiā le.","v":"Cậu còn nhớ Vương Hồng không? Tớ đọc được một bài báo viết về cô ấy, giờ cô ấy đã là một nhà văn nổi tiếng rồi."},{"s":"小李","z":"听说她毕业后放弃了律师的工作，开始专门写小说，没想到她竟然成功了。","p":"Tīngshuō tā bìyè hòu fàngqìle lǜshī de gōngzuò, kāishǐ zhuānmén xiě xiǎoshuō, méi xiǎngdào tā jìngrán chénggōng le.","v":"Nghe nói sau khi tốt nghiệp cô ấy đã bỏ nghề luật sư, bắt đầu chuyên tâm viết tiểu thuyết, không ngờ lại thành công thật."},{"s":"小林","z":"当时她的父母和亲戚都不支持她，可是她坚持自己的选择，现在终于向所有人证明了她的选择是正确的。","p":"Dāngshí tā de fùmǔ hé qīnqi dōu bù zhīchí tā, kěshì tā jiānchí zìjǐ de xuǎnzé, xiànzài zhōngyú xiàng suǒyǒu rén zhèngmíngle tā de xuǎnzé shì zhèngquè de.","v":"Hồi đó bố mẹ và họ hàng đều không ủng hộ cô ấy, nhưng cô ấy vẫn kiên trì với lựa chọn của mình, giờ thì rốt cuộc đã chứng minh cho tất cả mọi người thấy lựa chọn của cô ấy là đúng."},{"s":"小李","z":"看来为了自己的理想，放弃一些东西也是值得的。","p":"Kànlái wèile zìjǐ de lǐxiǎng, fàngqì yìxiē dōngxi yě shì zhídé de.","v":"Xem ra vì lý tưởng của bản thân, từ bỏ một vài thứ cũng là đáng."},{"s":"小林","z":"一个人只有两只手，不可能得到所有想要的东西，所以有时候放弃是一种聪明的选择。","p":"Yí ge rén zhǐyǒu liǎng zhī shǒu, bù kěnéng dédào suǒyǒu xiǎng yào de dōngxi, suǒyǐ yǒu shíhou fàngqì shì yì zhǒng cōngming de xuǎnzé.","v":"Một người chỉ có hai bàn tay, không thể có được mọi thứ mình muốn, nên đôi khi từ bỏ lại là một lựa chọn khôn ngoan."},{"s":"小李","z":"是啊，只有学会放弃，才能把自己的能力用到最该做的事情上，最后获得成功。","p":"Shì a, zhǐyǒu xuéhuì fàngqì, cái néng bǎ zìjǐ de nénglì yòngdào zuì gāi zuò de shìqing shang, zuìhòu huòdé chénggōng.","v":"Đúng vậy, chỉ khi học được cách từ bỏ, ta mới có thể dồn năng lực của mình vào việc đáng làm nhất, cuối cùng giành được thành công."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"如果你想做什么事情，那就勇敢地去做，不要担心结果，不要考虑会不会失败。","p":"Rúguǒ nǐ xiǎng zuò shénme shìqing, nà jiù yǒnggǎn de qù zuò, búyào dānxīn jiéguǒ, búyào kǎolǜ huì bu huì shībài.","v":"Nếu bạn muốn làm việc gì đó thì hãy dũng cảm bắt tay vào làm, đừng lo lắng về kết quả, đừng nghĩ xem liệu có thất bại hay không."},{"s":"","z":"要是太看重结果，失败就会给人们带来很多烦恼。","p":"Yàoshi tài kànzhòng jiéguǒ, shībài jiù huì gěi rénmen dàilai hěn duō fánnǎo.","v":"Nếu quá coi trọng kết quả, thất bại sẽ mang lại cho người ta rất nhiều phiền muộn."},{"s":"","z":"我们应该把注意力放在做事情的过程上，这样你会在做的过程中发现解决问题的快乐，这是其他任何东西都给不了的。","p":"Wǒmen yīnggāi bǎ zhùyìlì fàng zài zuò shìqing de guòchéng shang, zhèyàng nǐ huì zài zuò de guòchéng zhōng fāxiàn jiějué wèntí de kuàilè, zhè shì qítā rènhé dōngxi dōu gěi bu liǎo de.","v":"Chúng ta nên đặt sự chú ý vào quá trình làm việc, như thế bạn sẽ tìm thấy niềm vui của việc giải quyết vấn đề ngay trong quá trình đó — điều mà không thứ gì khác mang lại được."},{"s":"","z":"即使最后失败了也没有关系，因为至少你已经努力过，而且我们还可以从失败中总结出有用的经验，有了这些积累，成功自然离我们越来越近。","p":"Jíshǐ zuìhòu shībàile yě méiyǒu guānxi, yīnwèi zhìshǎo nǐ yǐjīng nǔlìguo, érqiě wǒmen hái kěyǐ cóng shībài zhōng zǒngjié chū yǒuyòng de jīngyàn, yǒule zhèxiē jīlěi, chénggōng zìrán lí wǒmen yuè lái yuè jìn.","v":"Dù cuối cùng có thất bại cũng không sao, vì ít nhất bạn đã nỗ lực rồi, hơn nữa ta còn có thể tổng kết ra những kinh nghiệm hữu ích từ thất bại; có được những tích luỹ ấy, thành công tự nhiên sẽ ngày càng gần chúng ta hơn."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"每一个人都希望成功，可是很多时候，在成功之前会遇到很多困难。","p":"Měi yí ge rén dōu xīwàng chénggōng, kěshì hěn duō shíhou, zài chénggōng zhīqián huì yùdào hěn duō kùnnan.","v":"Ai cũng mong thành công, nhưng rất nhiều khi, trước lúc thành công ta sẽ gặp phải rất nhiều khó khăn."},{"s":"","z":"有些人遇到困难就放弃，而有些人遇到困难却想办法解决它。","p":"Yǒuxiē rén yùdào kùnnan jiù fàngqì, ér yǒuxiē rén yùdào kùnnan què xiǎng bànfǎ jiějué tā.","v":"Có người gặp khó khăn là bỏ cuộc, còn có người gặp khó khăn lại tìm cách giải quyết nó."},{"s":"","z":"对困难的态度不同，结果也是不一样的。","p":"Duì kùnnan de tàidù bù tóng, jiéguǒ yě shì bù yíyàng de.","v":"Thái độ với khó khăn khác nhau thì kết quả cũng khác nhau."},{"s":"","z":"爱迪生就是在找了上千种材料后才找到了能点亮电灯的材料。","p":"Àidíshēng jiù shì zài zhǎole shàng qiān zhǒng cáiliào hòu cái zhǎodàole néng diǎnliàng diàndēng de cáiliào.","v":"Edison chính là sau khi thử tới hàng nghìn loại vật liệu mới tìm ra được thứ vật liệu có thể thắp sáng bóng đèn."},{"s":"","z":"取得成功的人往往都经历过许多失败，他们和普通人的区别就是他们都坚持了下来。","p":"Qǔdé chénggōng de rén wǎngwǎng dōu jīnglìguo xǔduō shībài, tāmen hé pǔtōng rén de qūbié jiù shì tāmen dōu jiānchíle xiàlai.","v":"Những người đạt được thành công thường đều đã trải qua rất nhiều thất bại, điểm khác biệt giữa họ với người bình thường chính là họ đều đã kiên trì đến cùng."},{"s":"","z":"所以就算只有1%的希望，我们也要做出100%的努力。","p":"Suǒyǐ jiùsuàn zhǐyǒu bǎi fēn zhī yī de xīwàng, wǒmen yě yào zuòchū bǎi fēn zhī bǎi de nǔlì.","v":"Cho nên dù chỉ có 1% hy vọng, chúng ta cũng phải bỏ ra 100% nỗ lực."},{"s":"","z":"困难只是暂时的，“阳光总在风雨后”，只有我们勇敢地面对困难，才能有希望取得成功。","p":"Kùnnan zhǐ shì zànshí de, “Yángguāng zǒng zài fēngyǔ hòu”, zhǐyǒu wǒmen yǒnggǎn de miànduì kùnnan, cái néng yǒu xīwàng qǔdé chénggōng.","v":"Khó khăn chỉ là tạm thời, “sau mưa gió trời lại nắng”, chỉ khi ta dũng cảm đối mặt với khó khăn thì mới có hy vọng đạt được thành công."}]}],"gram":[{"id":"nandao","t":"难道……(吗/了)？","s":"Chẳng lẽ…? / Lẽ nào…? — câu hỏi tu từ","b":"<b>难道</b> là phó văn khí, dùng để đặt câu hỏi tu từ: người nói KHÔNG hỏi để lấy thông tin mà để nhấn mạnh điều ngược lại, kèm sắc thái ngạc nhiên, trách móc hoặc không tin. Câu có <b>难道</b> thường kết thúc bằng <b>吗</b> hoặc <b>了</b>. Nghĩa tiếng Việt tương đương “chẳng lẽ…”, “lẽ nào…”, “không lẽ…”.","r":["Vị trí: đứng đầu câu hoặc ngay sau chủ ngữ — 难道你不减肥了？= 你难道不减肥了？","Hỏi khẳng định 难道 A？ → ý thật là “không A”; hỏi phủ định 难道不 A？ → ý thật là “chính là A”.","Vì là câu hỏi tu từ nên KHÔNG cần trả lời có/không; người nghe thường giải thích lý do.","Lỗi hay gặp: ✗ 难道你不知道吗不知道。→ ✓ 难道你不知道吗？(chỉ đặt câu hỏi, không tự trả lời trong cùng câu)"],"e":[["怎么又买了这么多饼干和巧克力？难道你不减肥了？","Zěnme yòu mǎile zhème duō bǐnggān hé qiǎokèlì? Nándào nǐ bù jiǎnféi le?","Sao lại mua nhiều bánh quy với sô-cô-la thế này? Chẳng lẽ cậu không giảm cân nữa à? <i>(bài khoá 1)</i>"]],"d":[["你别再喝那么多酒了！____","难道你不知道你的病还没好吗？"],["喂，都十点半了，你怎么还不来教室？____","难道你忘了今天我们有课？"],["你又咳嗽了？难道你又感冒了？____","感冒早好了，我咳嗽是因为空气太干。"]],"w":"难道 khác 是不是: 是不是 hỏi thật (cần câu trả lời), còn 难道 là hỏi để nhấn mạnh. Nói với người lớn tuổi hay cấp trên nên hạn chế vì nghe hơi trách móc."},{"id":"dei-de-de","t":"得 — ba cách đọc: děi / de / dé","s":"phải; trợ từ bổ ngữ mức độ; đạt được","b":"Cùng một chữ <b>得</b> nhưng đọc khác nhau thì chức năng khác hẳn. <b>děi</b> = động từ năng nguyện “phải, cần”, đứng trước động từ. <b>de</b> = trợ từ nối động từ với bổ ngữ mức độ (V + 得 + hình dung từ). <b>dé</b> = động từ “được, đạt được” (得到、得奖).","r":["得 (děi) đặt trước động từ: 就得少吃东西. Phủ định KHÔNG phải 不得 mà là 不用 hoặc 不必.","得 (de) trong “V 得 + 好/不好”: 打得真好, 打得不怎么样. Nếu có tân ngữ phải lặp động từ: 他打网球打得很好.","得 (dé) mang nghĩa “đoạt/nhận được”: 得过大奖, 得到.","Lỗi hay gặp: ✗ 你打网球得很好。→ ✓ 你网球打得很好。"],"e":[["如果你想减肥，就得少吃东西，而且要多运动。","Rúguǒ nǐ xiǎng jiǎnféi, jiù děi shǎo chī dōngxi, érqiě yào duō yùndòng.","Nếu cậu muốn giảm cân thì phải ăn ít lại, hơn nữa còn phải vận động nhiều <i>(bài khoá 1)</i>"],["你网球打得真好，还得过那么多国际大奖！","Nǐ wǎngqiú dǎ de zhēn hǎo, hái déguo nàme duō guójì dà jiǎng!","Cậu chơi quần vợt giỏi thật đấy, lại còn từng đoạt bao nhiêu giải lớn quốc tế! <i>(bài khoá 2)</i>"]],"d":[["A：师傅，麻烦您快点儿行吗？我____在九点之前到大使馆。B：不用担心，保证按时把你送到。","得 (děi)"],["A：你哥不是说三点到吗？都过去半个小时了，怎么还没出来？B：他还得去____行李箱。","取"],["A：外面热吗？你怎么满头大____？B：电梯坏了，我爬楼梯上来的。","汗"]],"w":"Trong bài khoá 2 câu “你网球打得真好，还得过那么多国际大奖” có cả 得 (de) và 得 (dé) — nhìn chữ giống nhau, phải dựa vào vị trí trong câu để đọc đúng."},{"id":"zhiyou-cai","t":"只有……才……","s":"Chỉ khi… thì mới… (điều kiện duy nhất)","b":"<b>只有</b> nêu điều kiện DUY NHẤT, vế sau dùng <b>才</b> để nói kết quả chỉ xảy ra khi có điều kiện đó. Không có điều kiện này thì tuyệt đối không có kết quả. Đây là cấu trúc trục của bài 9 — cả ba bài khoá đối thoại lẫn hai bài đọc đều dùng.","r":["Công thức: 只有 + điều kiện，(chủ ngữ) 才 + kết quả. 才 luôn đứng TRƯỚC động từ, không đứng cuối câu.","只有 đứng trước chủ ngữ hoặc sau chủ ngữ đều được: 只有我们勇敢地面对困难 = 我们只有勇敢地面对困难.","Biến thể cùng nghĩa: 只能……才…… (bài khoá 1: 只能坚持，才会慢慢有效果).","Lỗi hay gặp: ✗ 只有学会放弃，就能成功。→ ✓ 只有学会放弃，才能成功。(只有 đi với 才, không đi với 就)"],"e":[["只有学会放弃，才能把自己的能力用到最该做的事情上，最后获得成功。","Zhǐyǒu xuéhuì fàngqì, cái néng bǎ zìjǐ de nénglì yòngdào zuì gāi zuò de shìqing shang, zuìhòu huòdé chénggōng.","Chỉ khi học được cách từ bỏ, ta mới có thể dồn năng lực của mình vào việc đáng làm nhất, cuối cùng giành được thành công <i>(bài khoá 3)</i>"],["只有我们勇敢地面对困难，才能有希望取得成功。","Zhǐyǒu wǒmen yǒnggǎn de miànduì kùnnan, cái néng yǒu xīwàng qǔdé chénggōng.","Chỉ khi ta dũng cảm đối mặt với khó khăn thì mới có hy vọng đạt được thành công <i>(bài khoá 5)</i>"],["要想减肥成功，只能坚持，才会慢慢有效果。","Yào xiǎng jiǎnféi chénggōng, zhǐ néng jiānchí, cái huì mànmàn yǒu xiàoguǒ.","Muốn giảm cân thành công thì chỉ có kiên trì, mới dần dần có hiệu quả <i>(bài khoá 1)</i>"]],"d":[["____学会放弃，____能把自己的能力用到最该做的事情上。","只有 / 才"],["____我们勇敢地面对困难，____能有希望取得成功。","只有 / 才"],["要想减肥成功，只能坚持，____会慢慢有效果。","才"]],"w":"So sánh với 只要……就……: 只有 = điều kiện BẮT BUỘC (thiếu là hỏng), 只要 = điều kiện ĐỦ (có là được). Nhớ cặp cố định: 只有…才, 只要…就."},{"id":"zhiyao-jiu","t":"只要……就/也……","s":"Chỉ cần… là… (điều kiện đủ)","b":"<b>只要</b> nêu một điều kiện tối thiểu, hễ có điều kiện đó thì kết quả sẽ xảy ra; vế sau thường dùng <b>就</b>, đôi khi là <b>也</b> khi muốn nói “cũng sẽ”. Sắc thái lạc quan, hay dùng để động viên người khác.","r":["Công thức: 只要 + điều kiện，(chủ ngữ) 就/也 + kết quả.","Nếu hai vế khác chủ ngữ, 只要 đứng trước chủ ngữ vế đầu: 只要你坚持练习，我相信你也会……","Vế sau hay có 会……的 để nhấn mạnh dự đoán chắc chắn.","Lỗi hay gặp: ✗ 只要你坚持练习，才会越打越好。→ ✓ 只要你坚持练习，就会越打越好。"],"e":[["只要你坚持练习，我相信你也会越打越好的。","Zhǐyào nǐ jiānchí liànxí, wǒ xiāngxìn nǐ yě huì yuè dǎ yuè hǎo de.","Chỉ cần cậu kiên trì luyện tập, tớ tin cậu cũng sẽ càng chơi càng hay thôi <i>(bài khoá 2)</i>"]],"d":[["____你坚持练习，我相信你也会越打越好的。","只要"],["____我们真正努力过了，就不需要太关心结果。","只要"]],"w":"Đừng lẫn 只要 với 主要 (zhǔyào — chủ yếu) và với 只有. Mẹo nhớ: 只要 → 就 (dễ, nhẹ); 只有 → 才 (khó, bắt buộc)."},{"id":"tongguo-jingguo","t":"通过 vs 经过","s":"Thông qua / nhờ vào — trải qua, sau khi qua","b":"<b>通过</b> nhấn mạnh PHƯƠNG TIỆN, cách thức để đạt mục đích: “通过 + cách làm/công cụ + mới…”. <b>经过</b> nhấn mạnh QUÁ TRÌNH, thời gian đã trải qua, hoặc đi ngang qua một nơi; ngoài ra 经过 còn làm danh từ nghĩa “diễn biến, đầu đuôi sự việc”.","r":["通过 + danh từ chỉ cách thức/kênh: 通过努力、通过调查、通过电话联系.","经过 + danh từ chỉ khoảng thời gian/quá trình: 经过这段时间的学习、经过三年的努力.","经过 làm danh từ: 我不了解这件事情的经过 (không thay bằng 通过 được).","Lỗi hay gặp: ✗ 经过努力才能得到。→ ✓ 通过努力才能得到。(nhấn mạnh cách thức)"],"e":[["任何成功都要通过努力才能得到。","Rènhé chénggōng dōu yào tōngguò nǔlì cái néng dédào.","Bất kỳ thành công nào cũng phải qua nỗ lực mới có được <i>(bài khoá 2)</i>"]],"d":[["____调查我们发现，客人住宾馆最关心的是干净不干净。","通过"],["这是保修卡，遇到什么问题，您可以____上面的电话联系我们。","通过"],["我不了解这件事情的____，你问问其他人吧。","经过"],["____这段时间的学习，他的汉语水平提高了不少。","经过"],["有些人____节食的方法来减肥，虽然有效，但是时间长了对身体没有好处。","通过"]],"w":"Mẹo: hỏi “bằng cách nào?” → 通过; hỏi “sau bao lâu / chuyện thế nào?” → 经过."},{"id":"jieguo-ruguo-xiaoguo","t":"结果 / 如果 / 效果 (要是……就……)","s":"Kết quả — nếu như — hiệu quả: ba chữ dễ nhầm","b":"Ba từ đều có chữ <b>果</b> nhưng khác hẳn: <b>结果</b> = kết quả (danh từ), hoặc liên từ đầu vế sau nghĩa “cuối cùng thì, kết cục là”. <b>如果</b> = nếu như (liên từ giả thiết, vế sau dùng 就), khẩu ngữ hay thay bằng <b>要是</b>. <b>效果</b> = hiệu quả, tác dụng thực tế của một việc làm.","r":["如果/要是 + giả thiết，就 + kết quả: 如果你想减肥，就得少吃东西.","结果 làm liên từ đứng đầu vế sau, có dấu phẩy: 我工作到很晚才睡，结果，今天一天都很困难.","效果 đi với 有/没有、很好/不错: 慢慢有效果、减肥的效果很不错.","Lỗi hay gặp: ✗ 这样减肥虽然有一定的结果。→ ✓ 有一定的效果。"],"e":[["如果你想减肥，就得少吃东西，而且要多运动。","Rúguǒ nǐ xiǎng jiǎnféi, jiù děi shǎo chī dōngxi, érqiě yào duō yùndòng.","Nếu cậu muốn giảm cân thì phải ăn ít lại, hơn nữa còn phải vận động nhiều <i>(bài khoá 1)</i>"],["要想减肥成功，只能坚持，才会慢慢有效果。","Yào xiǎng jiǎnféi chénggōng, zhǐ néng jiānchí, cái huì mànmàn yǒu xiàoguǒ.","Muốn giảm cân thành công thì chỉ có kiên trì, mới dần dần có hiệu quả <i>(bài khoá 1)</i>"],["要是太看重结果，失败就会给人们带来很多烦恼。","Yàoshi tài kànzhòng jiéguǒ, shībài jiù huì gěi rénmen dàilai hěn duō fánnǎo.","Nếu quá coi trọng kết quả, thất bại sẽ mang lại cho người ta rất nhiều phiền muộn <i>(bài khoá 4)</i>"]],"d":[["做事情，不要一开始就考虑过多：会不会很难，____会怎么样……这些其实都不重要。","结果"],["春天天气时冷时热，容易感冒……____感冒了，要及时去医院。","如果"],["水果减肥法……这样减肥虽然有一定的____，却很不健康。","效果"],["昨天晚上我一直工作到很晚才睡，____","结果，今天一天都很困难。"],["没有人能随随便便成功，____","成功是坚持不放弃的结果。"]],"w":"结果 (kết quả) khác 效果 (hiệu quả): 结果 là cái xảy ra CUỐI CÙNG, có thể tốt hoặc xấu; 效果 là TÁC DỤNG của cách làm, thường đi với 好/不好."},{"id":"jishi-jiusuan-ye","t":"即使/就算……也……","s":"Dù cho… thì cũng… (giả thiết nhượng bộ)","b":"<b>即使</b> (văn viết) và <b>就算</b> (khẩu ngữ) nêu một giả thiết cực đoan, vế sau bắt buộc có <b>也</b> để nói kết luận vẫn không đổi. Khác với 虽然 ở chỗ 虽然 nêu SỰ THẬT đã xảy ra, còn 即使/就算 nêu điều CHƯA xảy ra hoặc chỉ giả định.","r":["Công thức: 即使/就算 + giả thiết，(chủ ngữ) 也 + kết luận. 也 không được bỏ.","Giả thiết thường là trường hợp xấu nhất hoặc con số nhỏ nhất: 就算只有1%的希望.","Cùng nhóm còn có 尽管……但是…… nhưng 尽管 dùng cho sự thật, không dùng cho giả thiết.","Lỗi hay gặp: ✗ 即使最后失败了，但是没有关系。→ ✓ 即使最后失败了也没有关系。"],"e":[["即使最后失败了也没有关系，因为至少你已经努力过。","Jíshǐ zuìhòu shībàile yě méiyǒu guānxi, yīnwèi zhìshǎo nǐ yǐjīng nǔlìguo.","Dù cuối cùng có thất bại cũng không sao, vì ít nhất bạn đã nỗ lực rồi <i>(bài khoá 4)</i>"],["所以就算只有1%的希望，我们也要做出100%的努力。","Suǒyǐ jiùsuàn zhǐyǒu bǎi fēn zhī yī de xīwàng, wǒmen yě yào zuòchū bǎi fēn zhī bǎi de nǔlì.","Cho nên dù chỉ có 1% hy vọng, chúng ta cũng phải bỏ ra 100% nỗ lực <i>(bài khoá 5)</i>"]],"d":[["____最后失败了____没有关系，因为至少你已经努力过。","即使 / 也"],["____只有1%的希望，我们____要做出100%的努力。","就算 / 也"]],"w":"Nhớ cặp: 即使/就算……也……, không dùng 但是 thay 也. Còn 虽然……但是…… mới dành cho việc có thật (bài khoá 3: 当时……都不支持她，可是她坚持自己的选择)."},{"id":"shangqian-shangbai","t":"上千 / 上百 + 量词 (và 当时)","s":"Hàng nghìn, hàng trăm — cách nói số ước lượng","b":"<b>上</b> + số tròn (百、千、万) tạo thành số ước lượng nghĩa “tới hàng trăm/nghìn/vạn”, luôn đi kèm lượng từ hoặc danh từ ngay sau. Cách nói này nhấn mạnh số lượng NHIỀU ngoài dự đoán. Trong bài còn gặp <b>当时</b> = “lúc đó, hồi ấy”, chỉ mốc thời gian trong quá khứ đã được nhắc trước đó.","r":["Cấu trúc: 上 + 百/千/万 + lượng từ/danh từ — 上千种材料、上百人、上百年的报纸.","Không dùng với số lẻ: ✗ 上三百人 → ✓ 三百多人 hoặc 上百人.","当时 đứng đầu câu hoặc sau chủ ngữ, chỉ thời điểm quá khứ đã xác định; khác 那时候 ở chỗ 当时 gắn với sự việc vừa nói đến.","Lỗi hay gặp: ✗ 有上千的人来看 → ✓ 有上千人来看 / 上千个人来看."],"e":[["爱迪生就是在找了上千种材料后才找到了能点亮电灯的材料。","Àidíshēng jiù shì zài zhǎole shàng qiān zhǒng cáiliào hòu cái zhǎodàole néng diǎnliàng diàndēng de cáiliào.","Edison chính là sau khi thử tới hàng nghìn loại vật liệu mới tìm ra được thứ vật liệu thắp sáng được bóng đèn <i>(bài khoá 5)</i>"],["当时她的父母和亲戚都不支持她，可是她坚持自己的选择。","Dāngshí tā de fùmǔ hé qīnqi dōu bù zhīchí tā, kěshì tā jiānchí zìjǐ de xuǎnzé.","Hồi đó bố mẹ và họ hàng đều không ủng hộ cô ấy, nhưng cô ấy vẫn kiên trì với lựa chọn của mình <i>(bài khoá 3)</i>"]],"d":[["这件事发生在1914年，____","当时，有上百人失去了工作。"],["这个电影很有名，____","昨天一天，就有上千人来电影院看这部电影。"],["这张本来值两三毛钱的旧报纸可以卖出两三百元的高价，____","上百年的报纸具有历史价值。"]],"w":"上百年 nghĩa là “cả trăm năm (tuổi)”, khác 一百年 là con số chính xác. 上 ở đây không phải giới từ chỉ vị trí."},{"id":"yue-yue","t":"越……越…… / 越来越……","s":"Càng… càng… / ngày càng…","b":"<b>越 A 越 B</b>: mức độ B tăng theo mức độ A, hai bên là hai động từ/tính từ do người nói chọn. <b>越来越 + tính từ/động từ tâm lý</b>: mức độ tăng dần theo thời gian, nghĩa “ngày càng”.","r":["Cùng một chủ ngữ: 你越打越好 (càng chơi càng hay). Hai chủ ngữ khác nhau thì mỗi vế một chủ ngữ: 天气越热，我越不想出门.","越来越 + tính từ, KHÔNG thêm 很/非常: ✗ 越来越很近 → ✓ 越来越近.","Cuối câu hay thêm 了 hoặc 的 để nhấn mạnh xu hướng: 会越打越好的、离我们越来越近.","Lỗi hay gặp: ✗ 我越来越喜欢很汉语。→ ✓ 我越来越喜欢汉语。"],"e":[["只要你坚持练习，我相信你也会越打越好的。","Zhǐyào nǐ jiānchí liànxí, wǒ xiāngxìn nǐ yě huì yuè dǎ yuè hǎo de.","Chỉ cần cậu kiên trì luyện tập, tớ tin cậu cũng sẽ càng chơi càng hay thôi <i>(bài khoá 2)</i>"],["有了这些积累，成功自然离我们越来越近。","Yǒule zhèxiē jīlěi, chénggōng zìrán lí wǒmen yuè lái yuè jìn.","Có được những tích luỹ ấy, thành công tự nhiên sẽ ngày càng gần chúng ta hơn <i>(bài khoá 4)</i>"]],"d":[["只要你坚持练习，我相信你也会____打____好的。","越 / 越"],["有了这些积累，成功自然离我们________近。","越来越"]],"w":"越来越 chỉ diễn tả thay đổi theo THỜI GIAN; nếu muốn nói “càng làm gì càng thế nào” thì phải dùng 越 + động từ + 越 + tính từ."},{"id":"keshi","t":"（虽然）……，可是……","s":"Nhưng, thế mà — liên từ chuyển ý, luôn nằm ở vế sau","b":"<b>可是</b> là liên từ, dùng ở <b>vế sau</b> của câu phức để nêu ý chuyển ngoặt (转折). Vế trước rất hay có <b>虽然</b> đi kèm thành cặp <b>虽然……，可是……</b>. Khi ý chuyển ngoặt đã rõ thì 可是 cũng đứng một mình được, không cần 虽然.","r":["Vị trí cố định: 可是 mở đầu vế thứ hai, đứng TRƯỚC chủ ngữ của vế đó: ✓ ……，可是她坚持自己的选择。","Cặp 虽然……，可是……: khác tiếng Việt, tiếng Trung giữ cả hai liên từ trong một câu, không bị coi là thừa.","可是 gần nghĩa với 但是, thiên về khẩu ngữ hơn; đừng nhầm với 可不是！(“Đúng thế!”, bài 8).","Lỗi hay gặp: ✗ 虽然收入高，经常要加班可是。 → ✓ 虽然收入高，可是经常要加班。"],"e":[["当时她的父母和亲戚都不支持她，可是她坚持自己的选择，现在终于向所有人证明了她的选择是正确的。","Dāngshí tā de fùmǔ hé qīnqi dōu bù zhīchí tā, kěshì tā jiānchí zìjǐ de xuǎnzé, xiànzài zhōngyú xiàng suǒyǒu rén zhèngmíngle tā de xuǎnzé shì zhèngquè de.","Hồi đó bố mẹ và họ hàng đều không ủng hộ cô ấy, nhưng cô ấy vẫn kiên trì với lựa chọn của mình, giờ rốt cuộc đã chứng minh cho mọi người thấy lựa chọn của cô ấy là đúng <i>(bài khoá 3)</i>"],["每一个人都希望成功，可是很多时候，在成功之前会遇到很多困难。","Měi yí ge rén dōu xīwàng chénggōng, kěshì hěn duō shíhou, zài chénggōng zhīqián huì yùdào hěn duō kùnnan.","Ai cũng mong thành công, nhưng rất nhiều khi, trước lúc thành công ta sẽ gặp phải rất nhiều khó khăn <i>(bài khoá 5)</i>"],["虽然收入高，可是经常要加班，很少有时间和家人在一起。","Suīrán shōurù gāo, kěshì jīngcháng yào jiābān, hěn shǎo yǒu shíjiān hé jiārén zài yìqǐ.","Tuy thu nhập cao nhưng thường xuyên phải tăng ca, rất ít khi có thời gian ở bên gia đình <i>(ví dụ của sách)</i>"]],"d":[["他虽然写得比较慢，____________写得很认真。","可是"],["A：你为什么不喜欢小王？他不是挺诚实的吗？ B：他是很诚实，____________说话太直接了。","可是"],["A：我约了几个同学星期六上午去打网球，你也去吧。 B：我很想去，____________那天我得去机场接人。","可是"]],"w":"虽然 đứng ở vế đầu (trước hoặc sau chủ ngữ đều được), 可是 luôn đứng đầu vế sau — không bao giờ đẩy 可是 xuống cuối câu."}],"notes":"1) Chữ Hán của 5 bài khoá (slide 23, 41, 55, 71, 86) trong dữ liệu là ĐẦY ĐỦ — không có câu tiếng Trung nào được thêm vào. 2) Các chunk bị loại, không tính là bài khoá: slide 85 chỉ là CÂU HỎI đọc hiểu (人们对困难的态度有什么不同？/ 爱迪生是怎样成功发明电灯的？/ “阳光总在风雨后”是什么意思？…); slide 24, 25, 56, 88 là câu/đoạn của phần bài tập 练一练 (đoạn 幽默短信, câu điền 如果……感冒了, các đoạn hội thoại điền 得/取/汗, đoạn điền 过程) chứ không phải 课文. 3) Slide 24 phần title lại là một câu bài tập rời (尽管很辛苦，但他还是坚持每天做运动……), không khớp với nội dung chunk — đã bỏ. 4) Pinyin trong slide bị ĐẢO THỨ TỰ DÒNG và CẮT CỤT ở tất cả các bài khoá: slide 23 thiếu đuôi 送给你了; slide 41 cụt ở 轻轻松松 và 你成功前 (thiếu 流下的汗水); slide 55 cụt ở 她现在已经是一个 và thiếu đuôi câu 证明了她的选择是正确的; slide 71 và 86 các dòng pinyin xếp lộn xộn, dính chữ. Toàn bộ pinyin ở trên đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 5) Lỗi trong dữ liệu từ mới (theo quy tắc phải GIỮ NGUYÊN nghĩa trong batches, chỉ ghi chú tại đây): 得 có phần nghĩa tiếng Việt ghi là “děi” (đó là pinyin, nghĩa đúng: phải, cần) và pinyin ghi “dé”; 总结 có phần nghĩa ghi là “zhǒng jié” (pinyin sai, nghĩa đúng theo 练一练 là “Tổng kết”, pinyin đúng là zǒngjié). 6) Thẻ từ trong 练一练 của đợt 5 bị ghép lệch nhãn: “Sự khác biệt — 许多”, “Tạm thời — 区别”, “Đương đầu, đối mặt — 暂时”, “Rất nhiều — 面对”; nghĩa đúng là 许多 = rất nhiều, 区别 = sự khác biệt, 暂时 = tạm thời, 面对 = đối mặt (batches ghi đúng, chỉ slide drill bị lệch). 7) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở trên được suy ra từ 练一练 (难道, 通过/经过, 可是, 结果/如果/效果, 上千·上百·当时, và các ô điền 得/取/汗/理想/放弃/至少/暂时/区别/过程/正确) cộng với cấu trúc nổi bật trong bài khoá (只有……才, 只要……就, 即使/就算……也, 越……越/越来越). 8) Phần 练一练 còn có bài điền từ vựng thuần tuý (至少, 暂时, 区别, 正确, 过程, 理想, 放弃) — là bài tập từ mới nên đã đưa vào phần drill của các điểm ngữ pháp liên quan chứ không lập mục ngữ pháp riêng. 9) 可是 được xử lý trong điểm ngữ pháp 即使/就算……也 (mục warn) và có ví dụ nguyên văn ở bài khoá 3, 5; ba câu nối 可是 của 练一练 (他虽然写得比较慢，可是写得很好…) là bài tập ghép câu, không đưa vào bài khoá.","order":[{"z":"怎么又买了这么多饼干和巧克力？","t":["怎么","又","买","了","这么","多","饼干","和","巧克力"],"v":"Sao lại mua nhiều bánh quy với sô-cô-la thế này? Chẳng lẽ cậu không giảm cân nữa à?"},{"z":"难道你不减肥了？","t":["难道","你","不","减肥","了"],"v":"Sao lại mua nhiều bánh quy với sô-cô-la thế này? Chẳng lẽ cậu không giảm cân nữa à?"},{"z":"减了一个月都没瘦下来，我实在没有信心了。","t":["减了","一个月","都","没","瘦下来","我","实在","没有","信心","了"],"v":"Giảm cả tháng trời mà chẳng gầy đi được tí nào, tớ thật sự hết cả tự tin rồi."},{"z":"要想减肥成功，只能坚持，才会慢慢有效果。","t":["要","想","减肥","成功","只能","坚持","才","会","慢慢","有","效果"],"v":"Một tháng thì ngắn quá. Muốn giảm cân thành công thì chỉ có kiên trì, mới dần dần có hiệu quả được."},{"z":"这些饼干和巧克力送给你了。","t":["这些","饼干","和","巧克力","送给","你","了"],"v":"Vốn dĩ tớ đã định bỏ cuộc rồi, nhưng lời cậu vừa nói làm tớ đổi ý. Chỗ bánh quy với sô-cô-la này tặng cậu đấy."},{"z":"你网球打得真好，还得过那么多国际大奖！","t":["你","网球","打得","真好","还","得","过","那么","多","国际","大奖"],"v":"Cậu chơi quần vợt giỏi thật đấy, lại còn từng đoạt bao nhiêu giải lớn quốc tế! Mỗi lần xem cậu thi đấu, tớ đều thấy cậu thắng nhẹ "},{"z":"每次看你比赛，感觉你轻轻松松就赢了。","t":["每次","看","你","比赛","感觉","你","轻轻松松","就","赢","了"],"v":"Cậu chơi quần vợt giỏi thật đấy, lại còn từng đoạt bao nhiêu giải lớn quốc tế! Mỗi lần xem cậu thi đấu, tớ đều thấy cậu thắng nhẹ "},{"z":"不管春夏秋冬，我练球从来没有休息过一天。","t":["不管","春夏秋 ngày."},{"h":"将来","p":"jiānglái","v":"Tương lai","ez":"将来我想在这座城市买房子。","ey":"Jiānglái wǒ xiǎng zài zhè zuò chéngshì mǎi fángzi.","ev":"Sau này tôi muốn mua nhà ở thành phố này."},{"h":"发展","p":"fāzhǎn","v":"Phát triển","ez":"这几年这个城市发展得很快。","ey":"Zhè jǐ nián zhège chéngshì fāzhǎn de hěn kuài.","ev":"Mấy năm nay thành phố này phát triển rất nhanh."},{"h":"躺","p":"tǎng","v":"Nằm","ez":"他有点儿累，躺在沙发上休息。","ey":"Tā yǒudiǎnr lèi, tǎng zài shāfā shang xiūxi.","ev":"Anh ấy hơi mệt, nằm trên ghế sofa nghỉ ngơi."},{"h":"困","p":"kùn","v":"Buồn ngủ","ez":"我昨天睡得太晚，现在特别困。","ey":"Wǒ zuótiān shuì de tài wǎn, xiànzài tèbié kùn.","ev":"Hôm qua tôi ngủ quá muộn, giờ buồn ngủ kinh khủng."}],[{"h":"经济","p":"jīngjì","v":"Kinh tế","ez":"我姐姐大学学的是经济。","ey":"Wǒ jiějie dàxué xué de shì jīngjì.","ev":"Chị tôi học ngành kinh tế ở đại học."},{"h":"条件","p":"tiáojiàn","v":"Điều kiện","ez":"这份工作的条件不错，我想试试。","ey":"Zhè fèn gōngzuò de tiáojiàn búcuò, wǒ xiǎng shìshi.","ev":"Điều kiện của công việc này khá tốt, tôi muốn thử xem."},{"h":"富","p":"fù","v":"Giàu","ez":"这个国家不大，但是很富。","ey":"Zhège guójiā bú dà, dànshì hěn fù.","ev":"Đất nước này không lớn, nhưng rất giàu."},{"h":"穷","p":"qióng","v":"Nghèo","ez":"他小时候家里很穷，生活很辛苦。","ey":"Tā xiǎo shíhou jiā lǐ hěn qióng, shēnghuó hěn xīnkǔ.","ev":"Hồi nhỏ nhà anh ấy rất nghèo, cuộc sống rất vất vả."},{"h":"等","p":"děng","v":"Vân vân","ez":"商店里有苹果、香蕉等水果。","ey":"Shāngdiàn lǐ yǒu píngguǒ, xiāngjiāo děng shuǐguǒ.","ev":"Trong cửa hàng có táo, chuối và các loại hoa quả khác."},{"h":"由于","p":"yóuyú","v":"Vì, bởi vì","ez":"由于下大雨，我们的飞机晚点了。","ey":"Yóuyú xià dàyǔ, wǒmen de fēijī wǎndiǎn le.","ev":"Do trời mưa to, máy bay của chúng tôi bị trễ giờ."}],[{"h":"比如","p":"bǐrú","v":"Ví dụ, chẳng hạn","ez":"我喜欢运动，比如跑步、游泳。","ey":"Wǒ xǐhuan yùndòng, bǐrú pǎobù, yóuyǒng.","ev":"Tôi thích thể thao, ví dụ như chạy bộ, bơi lội."},{"h":"橡皮","p":"xiàngpí","v":"(cục) gôm, tẩy","ez":"你的橡皮能借我用一下吗？","ey":"Nǐ de xiàngpí néng jiè wǒ yòng yíxià ma?","ev":"Cục tẩy của cậu cho tôi mượn một chút được không?"},{"h":"糖","p":"táng","v":"Kẹo","ez":"这种糖很甜，小孩子都喜欢吃。","ey":"Zhè zhǒng táng hěn tián, xiǎo háizi dōu xǐhuan chī.","ev":"Loại kẹo này rất ngọt, trẻ con đều thích ăn."},{"h":"低","p":"dī","v":"Thấp","ez":"这张桌子太低了，用着不舒服。","ey":"Zhè zhāng zhuōzi tài dī le, yòng zhe bù shūfu.","ev":"Cái bàn này thấp quá, dùng không thoải mái."},{"h":"答案","p":"dá’àn","v":"Đáp án, câu trả lời, lời giải","ez":"这个问题的答案很简单。","ey":"Zhège wèntí de dá'àn hěn jiǎndān.","ev":"Đáp án của câu hỏi này rất đơn giản."}]],"texts":[{"no":1,"tz":"孙月和王静聊王静的生活情况","tv":"Tôn Nguyệt và Vương Tĩnh nói về cuộc sống của Vương Tĩnh","lines":[{"s":"孙月","z":"礼拜天有空儿吗？陪我去逛街怎么样？我想去给丈夫买个生日礼物。","p":"Lǐbàitiān yǒu kòngr ma? Péi wǒ qù guàngjiē zěnmeyàng? Wǒ xiǎng qù gěi zhàngfu mǎi ge shēngrì lǐwù.","v":"Chủ nhật cậu có rảnh không? Đi dạo phố với tớ nhé? Tớ muốn đi mua quà sinh nhật cho chồng."},{"s":"王静","z":"我可能去不了，最近事情多。","p":"Wǒ kěnéng qù bu liǎo, zuìjìn shìqing duō.","v":"Chắc tớ không đi được rồi, dạo này nhiều việc quá."},{"s":"孙月","z":"你最近是不是工作特别忙？","p":"Nǐ zuìjìn shì bu shì gōngzuò tèbié máng?","v":"Dạo này công việc của cậu bận lắm phải không?"},{"s":"王静","z":"我现在上有老，下有小。除了工作以外，家里还有母亲和儿子需要照顾。","p":"Wǒ xiànzài shàng yǒu lǎo, xià yǒu xiǎo. Chúle gōngzuò yǐwài, jiāli hái yǒu mǔqīn hé érzi xūyào zhàogù.","v":"Bây giờ tớ trên có già, dưới có trẻ. Ngoài công việc ra, ở nhà còn có mẹ và con trai cần chăm sóc."},{"s":"孙月","z":"真是辛苦啊！你最近脸色不太好，是不是哪儿不舒服？要注意身体啊。","p":"Zhēn shì xīnkǔ a! Nǐ zuìjìn liǎnsè bú tài hǎo, shì bu shì nǎr bù shūfu? Yào zhùyì shēntǐ a.","v":"Vất vả thật đấy! Dạo này sắc mặt cậu không được tốt, có phải chỗ nào khó chịu không? Phải chú ý sức khỏe đấy."},{"s":"王静","z":"没事儿，谢谢！不过现在我很幸福，因为在母亲面前我可以做一个永远长不大的孩子；在孩子面前我又是个能照顾他的母亲，这让我有了努力的方向。","p":"Méi shìr, xièxie! Búguò xiànzài wǒ hěn xìngfú, yīnwèi zài mǔqīn miànqián wǒ kěyǐ zuò yí ge yǒngyuǎn zhǎng bu dà de háizi; zài háizi miànqián wǒ yòu shì ge néng zhàogù tā de mǔqīn, zhè ràng wǒ yǒu le nǔlì de fāngxiàng.","v":"Không sao đâu, cảm ơn cậu! Nhưng bây giờ tớ rất hạnh phúc, vì trước mặt mẹ tớ có thể làm một đứa trẻ mãi mãi không lớn; còn trước mặt con, tớ lại là người mẹ có thể chăm sóc nó — điều đó cho tớ một hướng đi để cố gắng."}]},{"no":2,"tz":"高老师和李老师在谈幸福","tv":"Thầy Cao và thầy Lý nói chuyện về hạnh phúc","lines":[{"s":"高老师","z":"你看人家王老师，刚来这儿工作三年就当了教授，还有个好妻子，真让人羡慕！","p":"Nǐ kàn rénjia Wáng lǎoshī, gāng lái zhèr gōngzuò sān nián jiù dāng le jiàoshòu, hái yǒu ge hǎo qīzi, zhēn ràng rén xiànmù!","v":"Anh xem thầy Vương người ta kìa, mới đến đây làm ba năm đã lên giáo sư, lại còn có người vợ tốt, thật đáng ngưỡng mộ!"},{"s":"李老师","z":"其实，你在别人眼中也是很幸福的，只是你自己没有发现。","p":"Qíshí, nǐ zài biérén yǎnzhōng yě shì hěn xìngfú de, zhǐshì nǐ zìjǐ méiyǒu fāxiàn.","v":"Thật ra trong mắt người khác anh cũng rất hạnh phúc đấy, chỉ là chính anh không nhận ra thôi."},{"s":"高老师","z":"是吗？我哪能跟王老师比啊？","p":"Shì ma? Wǒ nǎ néng gēn Wáng lǎoshī bǐ a?","v":"Vậy sao? Tôi thì sao sánh được với thầy Vương chứ?"},{"s":"李老师","z":"你有一个漂亮的女儿，还那么优秀，硕士毕业后就当了翻译。","p":"Nǐ yǒu yí ge piàoliang de nǚ'ér, hái nàme yōuxiù, shuòshì bìyè hòu jiù dāng le fānyì.","v":"Anh có một cô con gái xinh đẹp, lại còn ưu tú như vậy, tốt nghiệp thạc sĩ xong là làm phiên dịch ngay."},{"s":"高老师","z":"我女儿确实不错，记得她刚拿到第一个月工资时，就兴奋地拉着我和她爸俩去商场，给我们买礼物，那时我和她爸心里别提多美了。","p":"Wǒ nǚ'ér quèshí búcuò, jìde tā gāng nádào dì-yī ge yuè gōngzī shí, jiù xīngfèn de lā zhe wǒ hé tā bà liǎ qù shāngchǎng, gěi wǒmen mǎi lǐwù, nà shí wǒ hé tā bà xīnli biétí duō měi le.","v":"Con gái tôi quả thực cũng khá, nhớ hồi nó vừa nhận tháng lương đầu tiên đã phấn khởi kéo cả hai vợ chồng tôi ra trung tâm thương mại mua quà cho chúng tôi, lúc ấy hai vợ chồng tôi trong lòng vui khỏi phải nói."},{"s":"李老师","z":"所以说每个人有每个人的生活，不用羡慕别人。你羡慕别人的时候，他们可能也正在羡慕你呢。","p":"Suǒyǐ shuō měi ge rén yǒu měi ge rén de shēnghuó, búyòng xiànmù biérén. Nǐ xiànmù biérén de shíhou, tāmen kěnéng yě zhèngzài xiànmù nǐ ne.","v":"Cho nên mới nói mỗi người có cuộc sống riêng của mình, không cần ngưỡng mộ người khác. Lúc anh ngưỡng mộ người ta, có khi họ cũng đang ngưỡng mộ anh đấy."}]},{"no":3,"tz":"小雨和小夏聊找工作的事情","tv":"Tiểu Vũ và Tiểu Hạ nói chuyện tìm việc làm","lines":[{"s":"小雨","z":"时间过得真快，马上就要毕业了。毕业后你打算做什么？","p":"Shíjiān guò de zhēn kuài, mǎshàng jiù yào bìyè le. Bìyè hòu nǐ dǎsuàn zuò shénme?","v":"Thời gian trôi nhanh thật, sắp tốt nghiệp đến nơi rồi. Tốt nghiệp xong cậu định làm gì?"},{"s":"小夏","z":"我还没想好呢，正想听听你的建议。你觉得在选择职业时，收入重要吗？","p":"Wǒ hái méi xiǎng hǎo ne, zhèng xiǎng tīngting nǐ de jiànyì. Nǐ juéde zài xuǎnzé zhíyè shí, shōurù zhòngyào ma?","v":"Tớ vẫn chưa nghĩ ra, đang muốn nghe ý kiến của cậu đây. Cậu thấy khi chọn nghề nghiệp thì thu nhập có quan trọng không?"},{"s":"小雨","z":"在我看来，赚钱多少不是最重要的，兴趣才是关键。只有做自己喜欢的事，才会觉得幸福，将来也会有更好的发展。","p":"Zài wǒ kànlái, zhuànqián duōshao bú shì zuì zhòngyào de, xìngqù cái shì guānjiàn. Zhǐyǒu zuò zìjǐ xǐhuan de shì, cái huì juéde xìngfú, jiānglái yě huì yǒu gèng hǎo de fāzhǎn.","v":"Theo tớ, kiếm được nhiều hay ít tiền không phải là điều quan trọng nhất, hứng thú mới là mấu chốt. Chỉ khi làm việc mình thích thì mới thấy hạnh phúc, tương lai cũng sẽ phát triển tốt hơn."},{"s":"小夏","z":"我也这么想。如果我带着热情去做自己喜欢的工作，就不会感到累。不过，现在什么东西都那么贵，生活压力太大了，没有钱也不会过得幸福啊！","p":"Wǒ yě zhème xiǎng. Rúguǒ wǒ dài zhe rèqíng qù zuò zìjǐ xǐhuan de gōngzuò, jiù bú huì gǎndào lèi. Búguò, xiànzài shénme dōngxi dōu nàme guì, shēnghuó yālì tài dà le, méiyǒu qián yě bú huì guò de xìngfú a!","v":"Tớ cũng nghĩ vậy. Nếu tớ mang theo nhiệt huyết đi làm công việc mình thích thì sẽ không thấy mệt. Nhưng bây giờ cái gì cũng đắt như thế, áp lực cuộc sống lớn quá, không có tiền thì cũng đâu sống hạnh phúc được!"},{"s":"小雨","z":"幸福其实很简单，它不是只要有钱就能买到的。我觉得工作结束回家后，洗个热水澡，然后躺在床上看看书、听听音乐，困了睡睡觉，就很幸福。","p":"Xìngfú qíshí hěn jiǎndān, tā bú shì zhǐyào yǒu qián jiù néng mǎi dào de. Wǒ juéde gōngzuò jiéshù huíjiā hòu, xǐ ge rèshuǐzǎo, ránhòu tǎng zài chuáng shang kànkan shū, tīngting yīnyuè, kùn le shuìshui jiào, jiù hěn xìngfú.","v":"Hạnh phúc thật ra rất đơn giản, nó không phải cứ có tiền là mua được. Tớ thấy sau khi tan làm về nhà, tắm một cái nước nóng, rồi nằm trên giường đọc sách, nghe nhạc, buồn ngủ thì ngủ — thế là đã rất hạnh phúc rồi."},{"s":"小夏","z":"你说的也对。如果能找到一份自己既感兴趣，收入又不错的工作，那就最好了。","p":"Nǐ shuō de yě duì. Rúguǒ néng zhǎodào yí fèn zìjǐ jì gǎn xìngqù, shōurù yòu búcuò de gōngzuò, nà jiù zuì hǎo le.","v":"Cậu nói cũng đúng. Nếu tìm được một công việc vừa hợp sở thích, thu nhập lại khá thì còn gì bằng."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"有的人希望穿得再好一些，房子再大一些，认为经济条件越好人就越幸福。","p":"Yǒude rén xīwàng chuān de zài hǎo yìxiē, fángzi zài dà yìxiē, rènwéi jīngjì tiáojiàn yuè hǎo rén jiù yuè xìngfú.","v":"Có người mong ăn mặc đẹp hơn một chút, nhà cửa rộng hơn một chút, cho rằng điều kiện kinh tế càng tốt thì con người càng hạnh phúc."},{"s":"","z":"其实有很多富人过得并不愉快，而有些穷人却过得很快乐。","p":"Qíshí yǒu hěn duō fùrén guò de bìng bù yúkuài, ér yǒuxiē qióngrén què guò de hěn kuàilè.","v":"Thật ra có rất nhiều người giàu sống chẳng vui vẻ gì, còn một số người nghèo lại sống rất vui."},{"s":"","z":"有钱不一定幸福，因为很多东西都是不能用钱买到的，例如时间，感情，生活经历等。","p":"Yǒu qián bù yídìng xìngfú, yīnwèi hěn duō dōngxi dōu shì bù néng yòng qián mǎi dào de, lìrú shíjiān, gǎnqíng, shēnghuó jīnglì děng.","v":"Có tiền chưa chắc đã hạnh phúc, vì rất nhiều thứ không thể dùng tiền mua được, ví dụ như thời gian, tình cảm, trải nghiệm sống, v.v."},{"s":"","z":"但是，从另外一个方面看，如果没钱，也很难过得幸福。","p":"Dànshì, cóng lìngwài yí ge fāngmiàn kàn, rúguǒ méi qián, yě hěn nán guò de xìngfú.","v":"Nhưng, nhìn từ một phương diện khác, nếu không có tiền thì cũng rất khó sống hạnh phúc."},{"s":"","z":"当你生病了，如果由于缺钱而不能及时去看医生，你的健康都很难得到保证，就更别说幸福了。","p":"Dāng nǐ shēngbìng le, rúguǒ yóuyú quē qián ér bù néng jíshí qù kàn yīshēng, nǐ de jiànkāng dōu hěn nán dédào bǎozhèng, jiù gèng bié shuō xìngfú le.","v":"Khi bạn ốm, nếu vì thiếu tiền mà không thể đi khám kịp thời thì ngay cả sức khỏe của bạn cũng khó được đảm bảo, nói gì đến hạnh phúc."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"什么是幸福？","p":"Shénme shì xìngfú?","v":"Hạnh phúc là gì?"},{"s":"","z":"有的人认为，工资高、能赚钱就是幸福；有的人认为，心情放松、身体健康才是幸福；也有人认为，能帮助别人就是一种幸福。","p":"Yǒude rén rènwéi, gōngzī gāo, néng zhuànqián jiù shì xìngfú; yǒude rén rènwéi, xīnqíng fàngsōng, shēntǐ jiànkāng cái shì xìngfú; yě yǒu rén rènwéi, néng bāngzhù biérén jiù shì yì zhǒng xìngfú.","v":"Có người cho rằng lương cao, kiếm được tiền chính là hạnh phúc; có người cho rằng tâm trạng thoải mái, cơ thể khỏe mạnh mới là hạnh phúc; cũng có người cho rằng giúp được người khác là một loại hạnh phúc."},{"s":"","z":"还有人说，小时候幸福是一件东西，比如一块橡皮、一块糖，得到了就很幸福；长大后幸福是一种态度，生活的态度决定了我们幸福感的高低。","p":"Hái yǒu rén shuō, xiǎo shíhou xìngfú shì yí jiàn dōngxi, bǐrú yí kuài xiàngpí, yí kuài táng, dédào le jiù hěn xìngfú; zhǎng dà hòu xìngfú shì yì zhǒng tàidù, shēnghuó de tàidù juédìng le wǒmen xìngfú gǎn de gāodī.","v":"Còn có người nói, hồi nhỏ hạnh phúc là một món đồ, ví dụ một cục tẩy, một viên kẹo, có được là thấy hạnh phúc; lớn lên hạnh phúc là một thái độ, thái độ sống quyết định mức độ cao thấp của cảm giác hạnh phúc."},{"s":"","z":"那怎样才算是真正的幸福？","p":"Nà zěnyàng cái suàn shì zhēnzhèng de xìngfú?","v":"Vậy thế nào mới được coi là hạnh phúc thật sự?"},{"s":"","z":"其实，幸福并没有一个标准答案，每个人对幸福都有不同的理解。","p":"Qíshí, xìngfú bìng méiyǒu yí ge biāozhǔn dá'àn, měi ge rén duì xìngfú dōu yǒu bù tóng de lǐjiě.","v":"Thật ra, hạnh phúc không hề có một đáp án chuẩn, mỗi người đều có cách hiểu khác nhau về hạnh phúc."},{"s":"","z":"不管你认为幸福是什么，只要你用心去找，就一定能发现它。","p":"Bùguǎn nǐ rènwéi xìngfú shì shénme, zhǐyào nǐ yòngxīn qù zhǎo, jiù yídìng néng fāxiàn tā.","v":"Bất kể bạn cho rằng hạnh phúc là gì, chỉ cần bạn dụng tâm đi tìm thì nhất định sẽ tìm thấy nó."}]}],"gram":[{"id":"buguo","t":"不过 (A，不过 B)","s":"Nhưng, song, có điều…","b":"<b>不过</b> là liên từ chuyển ý, đứng đầu vế sau để nói thêm/chỉnh lại một ý nhỏ so với vế trước. Ngữ khí <b>nhẹ hơn 但是、可是</b> nên rất hay dùng trong khẩu ngữ. Ngoài ra <b>不过</b> còn làm phó từ với nghĩa “chỉ, chẳng qua là”.","r":["Vị trí cố định: đầu vế sau — “A，不过 B。” Không bao giờ đứng cuối câu.","Ý ở vế trước vẫn được thừa nhận, 不过 chỉ điều chỉnh một điểm; nếu muốn phản bác mạnh thì dùng 但是.","Nghĩa phó từ “chỉ có”: 这么漂亮的衣服，不过一百元 (bộ đồ đẹp thế mà chỉ có một trăm tệ).","Lỗi hay gặp: ✗ 我很幸福不过工作很忙。→ ✓ 我很幸福，不过工作很忙。"],"e":[["没事儿，谢谢！不过现在我很幸福。","Méi shìr, xièxie! Búguò xiànzài wǒ hěn xìngfú.","Không sao đâu, cảm ơn cậu! Nhưng bây giờ tớ rất hạnh phúc <i>(bài khoá 1)</i>"],["不过，现在什么东西都那么贵，生活压力太大了。","Búguò, xiànzài shénme dōngxi dōu nàme guì, shēnghuó yālì tài dà le.","Nhưng bây giờ cái gì cũng đắt như thế, áp lực cuộc sống lớn quá <i>(bài khoá 3)</i>"]],"d":[["这么漂亮的衣服，____________，买一件吧。","不过一百元"],["A：中午吃西红柿鸡蛋面怎么样？ B：可以，____________。","不过我还不太饿"],["A：你知道怎么去世界公园吗？ B：我对那儿也不太熟悉，____________。","不过我们可以看地图"]],"w":"Đừng lẫn hai cách dùng: 不过 + mệnh đề = “nhưng”; 不过 + số lượng = “chỉ (có)”. Cũng không dùng chung 虽然……不过…… (chuẩn là 虽然……但是……)."},{"id":"queshi","t":"确实 + tính từ/động từ","s":"Quả thực, đúng là (xác nhận sự thật)","b":"<b>确实</b> là phó từ, đặt <b>trước</b> tính từ hoặc động từ để xác nhận điều vừa nói là đúng sự thật. Trong hội thoại thường dùng để đồng tình với đối phương rồi mới nói thêm ý của mình: “确实……，不过/而且……”.","r":["Trật tự: Chủ ngữ + 确实 + tính từ/động từ. ✗ 确实我女儿不错。→ ✓ 我女儿确实不错。","Có thể đứng một mình làm câu trả lời ngắn: —这儿的菜太贵了吧？—确实。","Phân biệt với 真: 真 dùng khi cảm thán (真漂亮！), 确实 dùng khi xác nhận tính đúng đắn của thông tin.","Lỗi hay gặp: ✗ 这个电影确实的很好。→ ✓ 这个电影确实很好。"],"e":[["我女儿确实不错。","Wǒ nǚ'ér quèshí búcuò.","Con gái tôi quả thực cũng khá <i>(bài khoá 2)</i>"]],"d":[["A：你不觉得这家饭馆儿的菜太贵了吗？ B：____________，不过菜的味道也确实不错。","确实是有点儿贵"],["A：现在网上购物太方便了，我都好久没去过商场了。 B：____________，而且还便宜。","网上购物确实方便"],["A：听说这个电影很不错，你看了吗？ B：我昨天刚看，____________，还很感人，值得一看。","确实非常好"]],"w":"确实 nhấn vào “đúng là như vậy”, còn 其实 nhấn vào “thật ra thì khác với điều bạn tưởng”. So sánh: 我女儿确实不错 ≠ 其实你也很幸福 (bài khoá 2)."},{"id":"zai-kan-lai","t":"在……看来，……","s":"Theo (ai đó) thì…, dưới góc nhìn của…","b":"Kết cấu <b>在 + người + 看来</b> đứng ở đầu câu, nêu rõ ý kiến sau đó là <b>quan điểm chủ quan của người ấy</b>, không phải sự thật khách quan. Rất hay dùng khi bày tỏ ý kiến trong thi nói và viết HSK4.","r":["Trật tự: 在 + đại từ/danh từ chỉ người + 看来，+ mệnh đề nêu ý kiến (có dấu phẩy ngăn cách).","Chỉ đứng đầu câu hoặc đầu vế, không đặt cuối câu: ✗ 家庭比工作更重要，在她看来。","Không dùng kèm 觉得/认为 ngay sau: ✗ 在我看来觉得…… → ✓ 在我看来，……","Người nói ngôi thứ ba dùng 在他/她看来 để thuật lại ý người khác."],"e":[["在我看来，赚钱多少不是最重要的，兴趣才是关键。","Zài wǒ kànlái, zhuànqián duōshao bú shì zuì zhòngyào de, xìngqù cái shì guānjiàn.","Theo tớ, kiếm nhiều hay ít tiền không phải điều quan trọng nhất, hứng thú mới là mấu chốt <i>(bài khoá 3)</i>"]],"d":[["A：我觉得如果发现自己不喜欢的工作，就应该马上换。 B：____________，马上换工作并不好。","在我看来"],["A：每个人对“真正的朋友”都有不同的理解。 B：____________，真正的朋友就是当我遇到困难的时候，能及时给我帮助的人。","在我看来"],["A：为了照顾老人和孩子，她竟然放弃了自己喜欢的工作。 B：____________，家庭比工作更重要，所以才放弃了自己喜欢的工作。","在她看来"]],"w":"Gần nghĩa nhưng khác sắc thái: 在……眼中 (trong mắt ai) nói về hình ảnh/đánh giá về một người — bài khoá 2: 你在别人眼中也是很幸福的; còn 在……看来 nói về nhận định, quan điểm."},{"id":"youyu","t":"由于……，(所以/因此)……","s":"Vì, do (nêu nguyên nhân, thiên văn viết)","b":"<b>由于</b> dẫn ra nguyên nhân, sắc thái trang trọng hơn <b>因为</b> và hay gặp trong bài đọc, thông báo. Vế sau thường có <b>所以、因此</b>. Trong bài khoá còn xuất hiện dạng viết <b>由于……而……</b>.","r":["由于 hầu như chỉ đứng ở vế nguyên nhân đặt TRƯỚC: 由于天气原因，活动改到下周。","Muốn để nguyên nhân ở vế sau thì phải dùng 因为: ✓ 活动改到下周，因为天气原因。✗ ……，由于天气原因。","Cặp quan hệ: 由于……，所以/因此……; không nói ✗ 由于……，因为……","由于 đi được với 而 trong văn viết: 由于缺钱而不能及时去看医生。"],"e":[["当你生病了，如果由于缺钱而不能及时去看医生，你的健康都很难得到保证。","Dāng nǐ shēngbìng le, rúguǒ yóuyú quē qián ér bù néng jíshí qù kàn yīshēng, nǐ de jiànkāng dōu hěn nán dédào bǎozhèng.","Khi bạn ốm, nếu vì thiếu tiền mà không thể đi khám kịp thời thì ngay cả sức khỏe cũng khó được đảm bảo <i>(bài khoá 4)</i>"]],"d":[["____________，所以今天考得不怎么样。","由于考试前没有复习"],["____________，他今天早上没赶上车，迟到了。","由于睡过头了"],["____________，这次活动的举办时间不得不改到下周。","由于天气原因"]],"w":"Khi trả lời câu hỏi 为什么 phải dùng 因为, không dùng 由于: —你为什么没来？—因为我病了。(✗ 由于我病了。)"},{"id":"jianyi","t":"建议 (động từ) / 建议 (danh từ)","s":"Đề nghị, khuyên; lời góp ý","b":"<b>建议</b> vừa là động từ (<b>A 建议 B + làm gì</b>), vừa là danh từ (<b>听/提/给…… 建议</b>). Là từ rất hay dùng khi khuyên nhủ trong hội thoại HSK4.","r":["Động từ: Chủ ngữ + 建议 + người + cụm động từ. 我建议你多开车出去走走。","Danh từ: thường đi với 听听、提、给 và có định ngữ 的: 听听你的建议 / 给你一个建议。","Sau 建议 (động từ) là một VIỆC, không phải danh từ đơn lẻ: ✗ 我建议你这本书。→ ✓ 我建议你看这本书。","Lỗi hay gặp: ✗ 我建议你的多休息。→ ✓ 我建议你多休息。"],"e":[["我还没想好呢，正想听听你的建议。","Wǒ hái méi xiǎng hǎo ne, zhèng xiǎng tīngting nǐ de jiànyì.","Tớ vẫn chưa nghĩ ra, đang muốn nghe ý kiến của cậu đây <i>(bài khoá 3)</i>"]],"d":[["A：我刚学会开车，水平一般，还经常走错路。 B：我____________你平时多开车出去走走，熟悉一下道路情况，这样慢慢就好了。","建议"]],"w":"建议 là góp ý mang tính xây dựng, ngữ khí nhẹ; 要求 là yêu cầu bắt buộc. ✗ 老板建议我明天必须来 → ✓ 老板要求我明天必须来。"},{"id":"zhiyou-cai","t":"只有……，才……","s":"Chỉ có… thì mới…","b":"<b>只有</b> nêu điều kiện <b>duy nhất</b>, vế sau bắt buộc dùng <b>才</b> để nói kết quả chỉ đạt được trong điều kiện đó. Phó từ <b>才</b> còn dùng riêng để nhấn mạnh “… mới chính là …”.","r":["Trật tự: 只有 + điều kiện，(chủ ngữ) + 才 + động từ. 才 luôn đứng trước động từ, không đứng đầu vế.","Vế sau dùng 才, KHÔNG dùng 就: ✗ 只有做自己喜欢的事，就会觉得幸福。→ ✓ ……才会觉得幸福。","才 nhấn mạnh trọng tâm: 兴趣才是关键 (hứng thú MỚI là mấu chốt).","Có thể lược chủ ngữ ở vế trước khi hai vế cùng chủ ngữ."],"e":[["只有做自己喜欢的事，才会觉得幸福，将来也会有更好的发展。","Zhǐyǒu zuò zìjǐ xǐhuan de shì, cái huì juéde xìngfú, jiānglái yě huì yǒu gèng hǎo de fāzhǎn.","Chỉ khi làm việc mình thích thì mới thấy hạnh phúc, tương lai cũng sẽ phát triển tốt hơn <i>(bài khoá 3)</i>"],["有的人认为，心情放松、身体健康才是幸福。","Yǒude rén rènwéi, xīnqíng fàngsōng, shēntǐ jiànkāng cái shì xìngfú.","Có người cho rằng tâm trạng thoải mái, cơ thể khỏe mạnh mới là hạnh phúc <i>(bài khoá 5)</i>"]],"d":[],"w":"So với 只要……就……: 只有……才…… = điều kiện BẮT BUỘC, thiếu là không được; 只要……就…… = điều kiện tối thiểu, chỉ cần thế là đủ. Bài khoá 3 có cả hai: 只有做自己喜欢的事，才会觉得幸福 và 只要有钱就能买到。"},{"id":"yue-yue","t":"越 A 越 B / 越……就越……","s":"Càng… càng…","b":"Kết cấu <b>越 A 越 B</b> diễn tả B thay đổi theo mức độ của A. Hai vế có thể cùng chủ ngữ hoặc khác chủ ngữ; giữa hai vế hay thêm <b>就</b>.","r":["Trật tự: (CN1) 越 + A，(CN2) 就 + 越 + B. Sau 越 là tính từ hoặc động từ chỉ mức độ.","Không thêm phó từ mức độ sau 越: ✗ 条件越很好 → ✓ 条件越好。","越来越 + tính từ = biến đổi theo thời gian, chỉ cần một vế: 天气越来越热。","Lỗi hay gặp: ✗ 经济条件越好，人很幸福。→ ✓ 经济条件越好，人就越幸福。"],"e":[["有的人希望穿得再好一些，房子再大一些，认为经济条件越好人就越幸福。","Yǒude rén xīwàng chuān de zài hǎo yìxiē, fángzi zài dà yìxiē, rènwéi jīngjì tiáojiàn yuè hǎo rén jiù yuè xìngfú.","Có người mong ăn mặc đẹp hơn, nhà rộng hơn, cho rằng điều kiện kinh tế càng tốt thì con người càng hạnh phúc <i>(bài khoá 4)</i>"]],"d":[],"w":"Đừng nhầm 越……越…… với 再……一些 (…thêm một chút) cũng có trong câu trên: 房子再大一些 = nhà rộng thêm chút nữa."},{"id":"zhiyao-jiu","t":"只要……，就……／不管……，都/就……","s":"Chỉ cần… là…; bất kể… đều…","b":"<b>只要 A，就 B</b>: chỉ cần có điều kiện A là có kết quả B (điều kiện tối thiểu). <b>不管 A，都/就 B</b>: dù A thế nào thì kết quả B vẫn không đổi. Đoạn cuối bài khoá 5 dùng liền cả hai kết cấu.","r":["只要 đứng trước điều kiện, vế sau dùng 就: 只要你用心去找，就一定能发现它。","Sau 不管 phải là một hình thức “không xác định”: từ để hỏi (什么/谁/怎么), cặp chính-phản (来不来), hoặc A 还是 B. ✗ 不管幸福 → ✓ 不管幸福是什么。","Vế sau 不管 bắt buộc có 都/也/就: ✗ 不管你怎么说，我不同意。→ ✓ ……我都不同意。","只要 có thể nằm trong cụm định ngữ: 它不是只要有钱就能买到的。"],"e":[["不管你认为幸福是什么，只要你用心去找，就一定能发现它。","Bùguǎn nǐ rènwéi xìngfú shì shénme, zhǐyào nǐ yòngxīn qù zhǎo, jiù yídìng néng fāxiàn tā.","Bất kể bạn cho rằng hạnh phúc là gì, chỉ cần bạn dụng tâm đi tìm thì nhất định sẽ tìm thấy nó <i>(bài khoá 5)</i>"],["幸福其实很简单，它不是只要有钱就能买到的。","Xìngfú qíshí hěn jiǎndān, tā bú shì zhǐyào yǒu qián jiù néng mǎi dào de.","Hạnh phúc thật ra rất đơn giản, nó không phải cứ có tiền là mua được <i>(bài khoá 3)</i>"]],"d":[],"w":"只要……就…… (chỉ cần) khác 只有……才…… (chỉ có); 不管…… khác 虽然……但是…… — 不管 nói về điều kiện chưa xác định, 虽然 nói về sự thật đã biết."},{"id":"chule-yiwai-hai","t":"除了……以外，还/都……","s":"Ngoài… ra, còn…／đều…","b":"<b>除了 A 以外，还 B</b>: ngoài A ra còn có thêm B (A vẫn được tính vào). Nếu vế sau dùng <b>都</b> thì nghĩa ngược lại: loại A ra khỏi nhóm.","r":["Trật tự: 除了 + A + 以外，+ (chủ ngữ) + 还/也/都 + ……","Nghĩa cộng thêm dùng 还/也; nghĩa loại trừ dùng 都: 除了他以外，大家都去了。","以外 có thể lược bỏ: 除了工作，家里还有母亲和儿子需要照顾。","Lỗi hay gặp: quên 还/都 ở vế sau — ✗ 除了工作以外，家里有母亲。→ ✓ ……家里还有母亲。"],"e":[["除了工作以外，家里还有母亲和儿子需要照顾。","Chúle gōngzuò yǐwài, jiāli hái yǒu mǔqīn hé érzi xūyào zhàogù.","Ngoài công việc ra, ở nhà còn có mẹ và con trai cần chăm sóc <i>(bài khoá 1)</i>"]],"d":[],"w":"Chú ý phân biệt 还 (cộng thêm) với 都 (loại trừ) ở vế sau — đây là điểm hay bị hỏi trong phần chọn đáp án."},{"id":"biru","t":"比如","s":"ví dụ như, chẳng hạn — dẫn ví dụ minh hoạ","b":"<b>比如</b> là động từ, dùng để <b>dẫn ra ví dụ</b> minh hoạ cho sự vật hay tình huống vừa nói tới. Thường có kết cấu: <b>nêu ý chung trước, rồi 比如 + ví dụ cụ thể</b>. Sau 比如 có thể có dấu phẩy hoặc không.","r":["Khung: (câu nêu ý chung)，比如 + ví dụ cụ thể。VD: 小时候幸福是一件东西，比如一块橡皮、一块糖。","比如 đứng giữa câu sau dấu phẩy, hoặc mở đầu một câu mới: ……比如，作家爱写小说，画家爱画画儿。","Khi liệt kê nhiều ví dụ, chuỗi ví dụ thường kết bằng 等 (v.v.): 比如要去几个地方，怎么坐车，带哪些东西等。","比如 chỉ dẫn ví dụ, không mang nghĩa so sánh: ✗ 他比如我高 → ✓ 他比我高。"],"e":[["还有人说，小时候幸福是一件东西，比如一块橡皮、一块糖，得到了就很幸福。","Hái yǒu rén shuō, xiǎo shíhou xìngfú shì yí jiàn dōngxi, bǐrú yí kuài xiàngpí, yí kuài táng, dédàole jiù hěn xìngfú.","Còn có người nói, hồi nhỏ hạnh phúc là một món đồ, ví dụ một cục tẩy, một viên kẹo, có được là thấy hạnh phúc rồi. <i>(ví dụ của sách — rút từ bài khoá 5)</i>"],["每个人都有自己特别感兴趣的东西，比如，作家爱写小说，画家爱画画儿。","Měi ge rén dōu yǒu zìjǐ tèbié gǎn xìngqù de dōngxi, bǐrú, zuòjiā ài xiě xiǎoshuō, huàjiā ài huà huàr.","Ai cũng có thứ mình đặc biệt hứng thú, ví dụ nhà văn thích viết tiểu thuyết, hoạ sĩ thích vẽ tranh."],["旅游前最好做个计划，比如要去几个地方，怎么坐车，带哪些东西等。","Lǚyóu qián zuìhǎo zuò ge jìhuà, bǐrú yào qù jǐ ge dìfang, zěnme zuò chē, dài nǎxiē dōngxi děng.","Trước khi đi du lịch tốt nhất nên lập kế hoạch, ví dụ đi mấy nơi, đi xe thế nào, mang những đồ gì v.v."]],"d":[["有时候，质量很好的东西也会很便宜。____________","比如这件衬衫，质量很好，价格却不到一百块。"],["刚到一个新环境，有很多种方法来使自己快一点儿适应。____________","比如多跟同事聊聊天，周末出去逛逛。"],["在汉语里，“海”、“江”、“河”左边的部分叫作“三点水”。这样的汉字还有很多，____________","比如“湖”、“游”、“洗”等。"]],"w":"比如 dẫn ví dụ (ví dụ như), khác hẳn giới từ 比 dùng để so sánh; văn viết trang trọng hơn thì dùng 例如."}],"notes":"1) Các chunk slide 32, 48, 74 chỉ là CÂU HỎI đọc hiểu (高老师的女儿怎么样？/ 小夏毕业后打算做什么？/ 关于什么是幸福，有哪些不同的理解？…) nên đã loại, không tính là bài khoá. 2) Tiêu đề slide 49 ghi là “小夏和小雨聊小雨抽烟的事情” nhưng nội dung là bàn về chọn nghề; đã dùng tiêu đề của slide 48 (“小雨和小夏聊找工作的事情”) cho bài khoá 3. 3) Hai bài đọc (slide 63 và 75) trong dữ liệu KHÔNG có tiêu đề; tiêu đề ở đây được lấy nguyên văn một câu trong chính đoạn văn (有钱不一定幸福 / 什么是幸福？), không tự đặt thêm câu tiếng Trung nào. 4) Phần pinyin trong slide bị đảo dòng và cắt cụt (slide 19 thiếu pinyin của câu 这让我有了努力的方向 và của đoạn 我想去给丈夫买个生日礼物; slide 33, 49, 63, 75 các dòng pinyin bị xếp sai thứ tự, slide 63 thiếu pinyin của 证，就更别说幸福了). Toàn bộ pinyin đã được đánh lại theo chuẩn có dấu thanh dựa trên chữ Hán. 5) Chữ Hán của các bài khoá trong slide là đầy đủ, không thiếu câu nào — không có câu tiếng Trung nào được thêm vào. 6) Lỗi trong dữ liệu từ mới: 空儿 ghi py “kòngér” và nghĩa tiếng Việt lại là “kòngr” (đây là pinyin chứ không phải nghĩa); slide 练一练 ghi nghĩa đúng là “Thời gian rỗi”, pinyin đúng là kòngr — theo quy tắc, phần nghĩa trong batches được GIỮ NGUYÊN, chỉ ghi chú ở đây. 7) Trong 练一练 có 2 thẻ từ lỗi: “永远 / v. to cough / késòu” (thực ra là của từ 咳嗽), không liên quan bài 10. 8) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở trên được suy ra từ 练一练 (不过, 确实, 在……看来, 由于, 建议) và từ cấu trúc nổi bật trong bài khoá (只有……才, 越……越, 只要……就/不管, 除了……以外还). 9) 练一练 còn có phần điền từ vựng thuần tuý (空儿 / 礼拜天 / 关键 / 答案 / 躺 / 分出高低) — là bài tập từ mới, không phải điểm ngữ pháp, nên không đưa vào mục grammar.","order":[{"z":"陪我去逛街怎么样？","t":["陪","我","去","逛街","怎么样"],"v":"Chủ nhật cậu có rảnh không? Đi dạo phố với tớ nhé? Tớ muốn đi mua quà sinh nhật cho chồng."},{"z":"我想去给丈夫买个生日礼物。","t":["我","想","去","给","丈夫","买个","生日礼物"],"v":"Chủ nhật cậu có rảnh không? Đi dạo phố với tớ nhé? Tớ muốn đi mua quà sinh nhật cho chồng."},{"z":"我可能去不了，最近事情多。","t":["我","可能","去","不了","最近","事情","多"],"v":"Chắc tớ không đi được rồi, dạo này nhiều việc quá."},{"z":"你最近是不是工作特别忙？","t":["你","最近","是不是","工作","特别","忙"],"v":"Dạo này công việc của cậu bận lắm phải không?"},{"z":"除了工作以外，家里还有母亲和儿子需要照顾。","t":["除了","工作","以外","家里","还有","母亲","和","儿子","需要","照顾"],"v":"Bây giờ tớ trên có già, dưới có trẻ. Ngoài công việc ra, ở nhà còn có mẹ và con trai cần chăm sóc."},{"z":"你最近脸色不太好，是不是哪儿不舒服？","t":["你","最近","脸色","不太好","是不是","哪儿","不","舒服"],"v":"Vất vả thật đấy! Dạo này sắc mặt cậu không được tốt, có phải chỗ nào khó chịu không? Phải chú ý sức khỏe đấy."},{"z":"我哪能跟王老师比啊？","t":["我","哪能","跟","王老师","比","啊"],"v":"Vậy sao? Tôi thì sao sánh được với thầy Vương chứ?"},{"z":"所以说每个人有每个人的生活，不用羡慕别人。","t":["所以","说","每个","人有","每个","人","的","生活","不用","羡慕","别人"],"v":"Cho nên mới nói mỗi người có cuộc sống riêng của mình, không cần ngưỡng mộ người khác. Lúc anh ngưỡng mộ người ta, có khi họ cũng "},{"z":"时间过得真快，马上就要毕业了。","t":["时间","过得","真快","马上","就要","毕业","了"],"v":"Thời gian trôi nhanh thật, sắp tốt nghiệp đến nơi rồi. Tốt nghiệp xong cậu định làm gì?"},{"z":"毕业后你打算做什么？","t":["毕业","后","你","打算","做","什么"],"v":"Thời gian trôi nhanh thật, sắp tốt nghiệp đến nơi rồi. Tốt nghiệp xong cậu định làm gì?"},{"z":"我还没想好呢，正想听听你的建议。","t":["我","还","没想","好","呢","正想","听听","你","的","建议"],"v":"Tớ vẫn chưa nghĩ ra, đang muốn nghe ý kiến của cậu đây. Cậu thấy khi chọn nghề nghiệp thì thu nhập có quan trọng không?"},{"z":"你觉得在选择职业时，收入重要吗？","t":["你","觉得","在","选择","职业","时","收入","重要","吗"],"v":"Tớ vẫn chưa nghĩ ra, đang muốn nghe ý kiến của cậu đây. Cậu thấy khi chọn nghề nghiệp thì thu nhập có quan trọng không?" chūfā hái láidejí, bié zháojí.","ev":"Bây giờ xuất phát vẫn còn kịp, đừng vội."},{"h":"复杂","p":"fù zá","v":"Phức tạp, rắc rối","ez":"这个问题比我想的复杂多了。","ey":"Zhège wèntí bǐ wǒ xiǎng de fùzá duō le.","ev":"Vấn đề này phức tạp hơn tôi nghĩ nhiều."},{"h":"只好","p":"zhǐ hǎo","v":"Đành phải, buộc phải","ez":"外面下雨了，我们只好在家看电视。","ey":"Wàimiàn xià yǔ le, wǒmen zhǐhǎo zài jiā kàn diànshì.","ev":"Bên ngoài mưa rồi, chúng tôi đành ở nhà xem tivi."},{"h":"填空","p":"tián kòng","v":"Điền vào chỗ trống","ez":"这次考试有十道填空题。","ey":"Zhè cì kǎoshì yǒu shí dào tiánkòng tí.","ev":"Kỳ thi lần này có mười câu điền vào chỗ trống."},{"h":"猜","p":"cāi","v":"Đoán","ez":"你猜猜我今天在路上遇到了谁？","ey":"Nǐ cāicai wǒ jīntiān zài lù shang yùdào le shéi?","ev":"Cậu đoán xem hôm nay tôi gặp ai trên đường?"},{"h":"否则","p":"fǒuzé","v":"nếu không thì, bằng không","ez":"我们得早点儿出发，否则会迟到。","ey":"Wǒmen děi zǎo diǎnr chūfā, fǒuzé huì chídào.","ev":"Chúng ta phải xuất phát sớm chút, nếu không sẽ bị muộn."}],[{"h":"客厅","p":"kè tīng","v":"Phòng khách","ez":"我家的客厅不大，但是很干净。","ey":"Wǒ jiā de kètīng bú dà, dànshì hěn gānjìng.","ev":"Phòng khách nhà tôi không lớn, nhưng rất sạch sẽ."},{"h":"无论","p":"wú lùn","v":"Bất kể","ez":"无论多累，他每天都会给妈妈打电话。","ey":"Wúlùn duō lèi, tā měitiān dōu huì gěi māma dǎ diànhuà.","ev":"Dù mệt thế nào, ngày nào anh ấy cũng gọi điện cho mẹ."},{"h":"杂志","p":"zá zhì","v":"Tạp chí","ez":"我在飞机上看了一本杂志。","ey":"Wǒ zài fēijī shang kàn le yì běn zázhì.","ev":"Tôi đã đọc một cuốn tạp chí trên máy bay."},{"h":"著名","p":"zhù míng","v":"nổi tiếng","ez":"他是一位著名的医生，很多人认识他。","ey":"Tā shì yí wèi zhùmíng de yīshēng, hěn duō rén rènshi tā.","ev":"Ông ấy là một bác sĩ nổi tiếng, rất nhiều người biết ông."},{"h":"页","p":"yè","v":"Trang","ez":"我昨天晚上看了二十页书。","ey":"Wǒ zuótiān wǎnshang kàn le èrshí yè shū.","ev":"Tối qua tôi đọc được hai mươi trang sách."},{"h":"增加","p":"zēng jiā","v":"Tăng thêm","ez":"最近来这儿旅游的人增加了不少。","ey":"Zuìjìn lái zhèr lǚyóu de rén zēngjiā le bù shǎo.","ev":"Gần đây số người đến đây du lịch tăng lên không ít."}],[{"h":"文章","p":"wén zhāng","v":"bài văn, bài báo","ez":"这篇文章不长，你很快就能看完。","ey":"Zhè piān wénzhāng bù cháng, nǐ hěn kuài jiù néng kàn wán.","ev":"Bài viết này không dài, cậu đọc xong rất nhanh thôi."},{"h":"之","p":"zhī","v":"được dùng để nối từ bổ nghĩa và từ được bổ nghĩa","ez":"他是我最好的朋友之一。","ey":"Tā shì wǒ zuì hǎo de péngyou zhī yī.","ev":"Cậu ấy là một trong những người bạn thân nhất của tôi."},{"h":"内容","p":"nèi róng","v":"Nội dung","ez":"这本书的内容很有意思。","ey":"Zhè běn shū de nèiróng hěn yǒu yìsi.","ev":"Nội dung cuốn sách này rất thú vị."},{"h":"然而","p":"rán’ér","v":"Nhưng, song","ez":"我很想帮他，然而我也没有办法。","ey":"Wǒ hěn xiǎng bāng tā, rán'ér wǒ yě méiyǒu bànfǎ.","ev":"Tôi rất muốn giúp anh ấy, nhưng tôi cũng không có cách nào."},{"h":"看法","p":"kàn fǎ","v":"Quan điểm, cách nhìn","ez":"对这件事，你有什么看法？","ey":"Duì zhè jiàn shì, nǐ yǒu shénme kànfǎ?","ev":"Về chuyện này, cậu có cách nhìn thế nào?"}],[{"h":"相同","p":"xiāng tóng","v":"Giống nhau, như nhau","ez":"我们两个人的爱好完全相同。","ey":"Wǒmen liǎng ge rén de àihào wánquán xiāngtóng.","ev":"Sở thích của hai chúng tôi hoàn toàn giống nhau."},{"h":"顺序","p":"shùn xù","v":"Trật tự, thứ tự","ez":"请大家按照顺序上车。","ey":"Qǐng dàjiā ànzhào shùnxù shàng chē.","ev":"Mời mọi người lên xe theo thứ tự."},{"h":"表示","p":"biǎo shì","v":"Có ý nghĩa, biểu thị","ez":"他点了点头，表示同意我的意见。","ey":"Tā diǎn le diǎn tóu, biǎoshì tóngyì wǒ de yìjiàn.","ev":"Anh ấy gật đầu, tỏ ý đồng ý với ý kiến của tôi."},{"h":"养成","p":"yǎng chéng","v":"Hình thành/ tạo (thói quen)","ez":"他养成了每天早起的好习惯。","ey":"Tā yǎngchéng le měitiān zǎo qǐ de hǎo xíguàn.","ev":"Anh ấy đã hình thành thói quen dậy sớm mỗi ngày."},{"h":"同时","p":"tóng shí","v":"Đồng thời, hơn nữa","ez":"我们不能同时做两件事情。","ey":"Wǒmen bù néng tóngshí zuò liǎng jiàn shìqing.","ev":"Chúng ta không thể làm hai việc cùng một lúc."},{"h":"精彩","p":"jīng cǎi","v":"Tuyệt vời, xuất sắc","ez":"昨天的比赛非常精彩，大家都很高兴。","ey":"Zuótiān de bǐsài fēicháng jīngcǎi, dàjiā dōu hěn gāoxìng.","ev":"Trận đấu hôm qua vô cùng đặc sắc, mọi người đều rất vui."}]],"texts":[{"no":1,"tz":"马克介绍自己学习汉语的方法","tv":"Mã Khắc giới thiệu phương pháp học tiếng Hán của mình","lines":[{"s":"大卫","z":"你来中国才一年，汉语就说得这么流利，真厉害！","p":"Nǐ lái Zhōngguó cái yì nián, Hànyǔ jiù shuō de zhème liúlì, zhēn lìhai!","v":"Cậu mới sang Trung Quốc có một năm mà tiếng Hán đã nói trôi chảy thế này, giỏi thật đấy!"},{"s":"马克","z":"谢谢！其实我的语法不太好，很多句子说得都不太准确。","p":"Xièxie! Qíshí wǒ de yǔfǎ bú tài hǎo, hěn duō jùzi shuō de dōu bú tài zhǔnquè.","v":"Cảm ơn! Thật ra ngữ pháp của mình không tốt lắm, nhiều câu nói ra đều chưa được chính xác."},{"s":"大卫","z":"但是我看你跟中国人交流没什么问题，你是怎么做到的？","p":"Dànshì wǒ kàn nǐ gēn Zhōngguó rén jiāoliú méi shénme wèntí, nǐ shì zěnme zuò dào de?","v":"Nhưng mình thấy cậu giao tiếp với người Trung Quốc chẳng có vấn đề gì, cậu làm được như vậy bằng cách nào?"},{"s":"马克","z":"平时多交一些中国朋友，经常和他们聊天儿，听说能力自然就能得到很大的提高。","p":"Píngshí duō jiāo yìxiē Zhōngguó péngyou, jīngcháng hé tāmen liáotiānr, tīngshuō nénglì zìrán jiù néng dédào hěn dà de tígāo.","v":"Ngày thường cứ kết bạn nhiều với người Trung Quốc, thường xuyên trò chuyện với họ, thì khả năng nghe nói tự nhiên sẽ tiến bộ rất nhiều."},{"s":"马克","z":"另外，我建议你坚持看中文报纸，这样能学到很多新词语。","p":"Lìngwài, wǒ jiànyì nǐ jiānchí kàn Zhōngwén bàozhǐ, zhèyàng néng xué dào hěn duō xīn cíyǔ.","v":"Ngoài ra, mình khuyên cậu kiên trì đọc báo tiếng Trung, như vậy sẽ học được rất nhiều từ ngữ mới."},{"s":"大卫","z":"你太厉害了！连中文报纸都看得懂。","p":"Nǐ tài lìhai le! Lián Zhōngwén bàozhǐ dōu kàn de dǒng.","v":"Cậu giỏi quá đi! Ngay cả báo tiếng Trung cũng đọc hiểu được."},{"s":"马克","z":"刚开始肯定有困难，不过遇到不认识的词语，你可以查词典，然后写在本子上，有空儿就拿出来复习一下，","p":"Gāng kāishǐ kěndìng yǒu kùnnan, búguò yùdào bú rènshi de cíyǔ, nǐ kěyǐ chá cídiǎn, ránhòu xiě zài běnzi shang, yǒu kòngr jiù ná chulai fùxí yíxià,","v":"Lúc mới bắt đầu chắc chắn có khó khăn, nhưng gặp từ nào không biết thì cậu có thể tra từ điển, rồi chép vào sổ tay, lúc nào rảnh thì lấy ra ôn lại một chút,"},{"s":"马克","z":"慢慢地就会发现中文报纸也没那么难了。","p":"mànmàn de jiù huì fāxiàn Zhōngwén bàozhǐ yě méi nàme nán le.","v":"dần dần cậu sẽ thấy báo tiếng Trung cũng không khó đến thế nữa."}]},{"no":2,"tz":"小夏和小雨聊考试的情况","tv":"Tiểu Hạ và Tiểu Vũ nói chuyện về kỳ thi","lines":[{"s":"小夏","z":"考试结束了，你对自己的成绩满意吗？","p":"Kǎoshì jiéshù le, nǐ duì zìjǐ de chéngjì mǎnyì ma?","v":"Thi xong rồi, cậu có hài lòng với kết quả của mình không?"},{"s":"小雨","z":"说真的，我不太满意。这次阅读考试的题太多了，我没做完。","p":"Shuō zhēn de, wǒ bú tài mǎnyì. Zhè cì yuèdú kǎoshì de tí tài duō le, wǒ méi zuò wán.","v":"Nói thật thì mình không hài lòng lắm. Bài thi đọc hiểu lần này nhiều câu quá, mình làm không hết."},{"s":"小夏","z":"两个小时的时间应该来得及吧？","p":"Liǎng ge xiǎoshí de shíjiān yīnggāi láidejí ba?","v":"Hai tiếng đồng hồ thì chắc là kịp chứ nhỉ?"},{"s":"小雨","z":"这次主要是因为我先做了比较难、比较复杂的题，结果花了太多时间，","p":"Zhè cì zhǔyào shì yīnwèi wǒ xiān zuò le bǐjiào nán, bǐjiào fùzá de tí, jiéguǒ huā le tài duō shíjiān,","v":"Lần này chủ yếu là vì mình làm trước mấy câu khó và phức tạp, kết quả là mất quá nhiều thời gian,"},{"s":"小雨","z":"后面简单的题我虽然会，可是时间来不及，最后只好放弃了。","p":"hòumiàn jiǎndān de tí wǒ suīrán huì, kěshì shíjiān lái bu jí, zuìhòu zhǐhǎo fàngqì le.","v":"mấy câu dễ ở sau tuy mình biết làm nhưng lại không kịp thời gian, cuối cùng đành phải bỏ."},{"s":"小夏","z":"其实我考得也不怎么样。有几个填空题不会做，有几个选择题，实在想不出来该选哪个，","p":"Qíshí wǒ kǎo de yě bù zěnmeyàng. Yǒu jǐ ge tiánkòng tí bú huì zuò, yǒu jǐ ge xuǎnzé tí, shízài xiǎng bu chūlái gāi xuǎn nǎge,","v":"Thật ra mình thi cũng chẳng ra sao. Có mấy câu điền vào chỗ trống không biết làm, mấy câu trắc nghiệm thì nghĩ mãi không ra nên chọn cái nào,"},{"s":"小夏","z":"就随便猜了一个答案，结果一个都没猜对。","p":"jiù suíbiàn cāi le yí ge dá'àn, jiéguǒ yí ge dōu méi cāi duì.","v":"thế là đoán bừa một đáp án, kết quả chẳng đoán đúng câu nào."},{"s":"小雨","z":"看来要想考好，不但要认真复习，还得注意考试的方法，否则，会做的题也没时间做。","p":"Kàn lái yào xiǎng kǎo hǎo, búdàn yào rènzhēn fùxí, hái děi zhùyì kǎoshì de fāngfǎ, fǒuzé, huì zuò de tí yě méi shíjiān zuò.","v":"Xem ra muốn thi tốt thì không những phải ôn tập nghiêm túc, mà còn phải chú ý phương pháp làm bài, nếu không thì câu biết làm cũng chẳng còn thời gian mà làm."}]},{"no":3,"tz":"小李告诉小林阅读的好处","tv":"Tiểu Lý kể cho Tiểu Lâm về ích lợi của việc đọc sách","lines":[{"s":"小林","z":"你的客厅里怎么到处是书啊？这些书你都喜欢看吗？","p":"Nǐ de kètīng li zěnme dàochù shì shū a? Zhèxiē shū nǐ dōu xǐhuan kàn ma?","v":"Sao trong phòng khách nhà cậu chỗ nào cũng là sách vậy? Mấy quyển sách này cậu đều thích đọc à?"},{"s":"小李","z":"当然，我每天都要看书。","p":"Dāngrán, wǒ měi tiān dōu yào kàn shū.","v":"Đương nhiên rồi, ngày nào mình cũng phải đọc sách."},{"s":"小李","z":"无论是普通杂志，还是著名小说，只要打开它们，就会发现，世界上有那么多有意思的事情，有那么多不一样的生活。","p":"Wúlùn shì pǔtōng zázhì, háishi zhùmíng xiǎoshuō, zhǐyào dǎkāi tāmen, jiù huì fāxiàn, shìjiè shang yǒu nàme duō yǒu yìsi de shìqing, yǒu nàme duō bù yíyàng de shēnghuó.","v":"Bất kể là tạp chí thường hay tiểu thuyết nổi tiếng, chỉ cần mở chúng ra là sẽ thấy trên đời có biết bao chuyện thú vị, có biết bao cuộc sống khác nhau."},{"s":"小林","z":"想不到你工作那么忙，还能每天坚持阅读。","p":"Xiǎng bu dào nǐ gōngzuò nàme máng, hái néng měi tiān jiānchí yuèdú.","v":"Không ngờ công việc bận rộn như vậy mà ngày nào cậu cũng kiên trì đọc sách được."},{"s":"小李","z":"如果3分钟读一页书，半个小时就可以读10页。","p":"Rúguǒ sān fēnzhōng dú yí yè shū, bàn ge xiǎoshí jiù kěyǐ dú shí yè.","v":"Nếu ba phút đọc được một trang sách thì nửa tiếng có thể đọc mười trang."},{"s":"小李","z":"每天花半个小时来读书，一个月就可以读300页，差不多就是一本书了。","p":"Měi tiān huā bàn ge xiǎoshí lái dúshū, yí ge yuè jiù kěyǐ dú sānbǎi yè, chàbuduō jiù shì yì běn shū.","v":"Mỗi ngày bỏ ra nửa tiếng để đọc sách thì một tháng có thể đọc được 300 trang, gần bằng một quyển sách rồi."},{"s":"小林","z":"是啊，一个真正爱看书的人总能找出时间来阅读。","p":"Shì a, yí ge zhēnzhèng ài kàn shū de rén zǒng néng zhǎo chū shíjiān lái yuèdú.","v":"Đúng vậy, người thật sự thích đọc sách thì lúc nào cũng tìm ra được thời gian để đọc."},{"s":"小李","z":"坚持阅读，除了能增加知识外，还能帮助我减轻压力，人也会变得轻松起来。","p":"Jiānchí yuèdú, chúle néng zēngjiā zhīshi wài, hái néng bāngzhù wǒ jiǎnqīng yālì, rén yě huì biàn de qīngsōng qǐlai.","v":"Kiên trì đọc sách, ngoài việc tăng thêm kiến thức ra, còn giúp mình giảm bớt áp lực, con người cũng trở nên thoải mái hơn."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"根据调查，阅读能力好的人，不但容易找到工作，而且工资也比较高。","p":"Gēnjù diàochá, yuèdú nénglì hǎo de rén, búdàn róngyì zhǎo dào gōngzuò, érqiě gōngzī yě bǐjiào gāo.","v":"Theo khảo sát, người có năng lực đọc hiểu tốt không những dễ tìm việc mà lương cũng khá cao."},{"s":"","z":"怎么才能有效提高自己的阅读能力呢？做读书笔记就是其中一种好方法。","p":"Zěnme cái néng yǒuxiào tígāo zìjǐ de yuèdú nénglì ne? Zuò dúshū bǐjì jiù shì qízhōng yì zhǒng hǎo fāngfǎ.","v":"Làm thế nào mới nâng cao được năng lực đọc hiểu của mình một cách hiệu quả? Ghi chép khi đọc sách chính là một trong những cách hay."},{"s":"","z":"读书笔记有很多种，最简单的就是把自己喜欢或者觉得有用的词语和句子记下来。","p":"Dúshū bǐjì yǒu hěn duō zhǒng, zuì jiǎndān de jiù shì bǎ zìjǐ xǐhuan huòzhě juéde yǒuyòng de cíyǔ hé jùzi jì xialai.","v":"Ghi chép khi đọc có rất nhiều kiểu, đơn giản nhất là ghi lại những từ ngữ và câu mà mình thích hoặc thấy hữu ích."},{"s":"","z":"另外，在看完一篇文章或一本书之后，还可以把它的主要内容和自己的想法写下来。","p":"Lìngwài, zài kàn wán yì piān wénzhāng huò yì běn shū zhīhòu, hái kěyǐ bǎ tā de zhǔyào nèiróng hé zìjǐ de xiǎngfǎ xiě xialai.","v":"Ngoài ra, sau khi đọc xong một bài văn hay một quyển sách, còn có thể viết lại nội dung chính của nó cùng suy nghĩ của bản thân."},{"s":"","z":"然而，你不能完全相信书本上的内容，要有自己的看法和判断。","p":"Rán'ér, nǐ bù néng wánquán xiāngxìn shūběn shang de nèiróng, yào yǒu zìjǐ de kànfǎ hé pànduàn.","v":"Thế nhưng, bạn không thể hoàn toàn tin vào nội dung trong sách, mà phải có quan điểm và phán đoán của riêng mình."},{"s":"","z":"坚持做读书笔记，对提高阅读能力有很大帮助。","p":"Jiānchí zuò dúshū bǐjì, duì tígāo yuèdú nénglì yǒu hěn dà bāngzhù.","v":"Kiên trì ghi chép khi đọc sách có ích rất lớn cho việc nâng cao năng lực đọc hiểu."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"“读书好（hǎo），读好（hǎo）书，好（hào）读书”。","p":"“Dúshū hǎo, dú hǎo shū, hào dúshū”.","v":"“Đọc sách thì tốt, đọc sách hay, ham đọc sách”."},{"s":"","z":"虽然这句话只用了三个相同的汉字，但是不同的顺序却表示了不同的意思。","p":"Suīrán zhè jù huà zhǐ yòng le sān ge xiāngtóng de Hànzì, dànshì bù tóng de shùnxù què biǎoshì le bù tóng de yìsi.","v":"Tuy câu này chỉ dùng ba chữ Hán giống nhau, nhưng thứ tự khác nhau lại biểu thị những ý nghĩa khác nhau."},{"s":"","z":"首先，“读书好”说的是读书有很多好处；","p":"Shǒuxiān, “dúshū hǎo” shuō de shì dúshū yǒu hěn duō hǎochù;","v":"Trước hết, “đọc sách thì tốt” nói rằng việc đọc sách có rất nhiều ích lợi;"},{"s":"","z":"其次，每个人的时间都是有限的，不可能把世界上每一本书都读完，所以要读好的书；","p":"qícì, měi ge rén de shíjiān dōu shì yǒuxiàn de, bù kěnéng bǎ shìjiè shang měi yì běn shū dōu dú wán, suǒyǐ yào dú hǎo de shū;","v":"thứ hai, thời gian của mỗi người đều có hạn, không thể đọc hết mọi quyển sách trên đời, vì vậy phải đọc những cuốn sách hay;"},{"s":"","z":"最后，“好读书”就是要养成阅读的习惯，使读书真正成为自己的兴趣爱好。","p":"zuìhòu, “hào dúshū” jiù shì yào yǎngchéng yuèdú de xíguàn, shǐ dúshū zhēnzhèng chéngwéi zìjǐ de xìngqù àihào.","v":"cuối cùng, “ham đọc sách” chính là phải hình thành thói quen đọc sách, khiến việc đọc thật sự trở thành sở thích của bản thân."},{"s":"","z":"阅读有许多好处，它能丰富你的知识，让你找到解决问题的办法；","p":"Yuèdú yǒu xǔduō hǎochù, tā néng fēngfù nǐ de zhīshi, ràng nǐ zhǎo dào jiějué wèntí de bànfǎ;","v":"Đọc sách có rất nhiều cái lợi: nó làm phong phú kiến thức của bạn, giúp bạn tìm ra cách giải quyết vấn đề;"},{"s":"","z":"同时，它还会丰富你的情感，使你的生活更精彩。","p":"tóngshí, tā hái huì fēngfù nǐ de qínggǎn, shǐ nǐ de shēnghuó gèng jīngcǎi.","v":"đồng thời, nó còn làm phong phú tình cảm của bạn, khiến cuộc sống của bạn tuyệt vời hơn."},{"s":"","z":"所以，让阅读成为你的习惯吧！","p":"Suǒyǐ, ràng yuèdú chéngwéi nǐ de xíguàn ba!","v":"Vì vậy, hãy để việc đọc sách trở thành thói quen của bạn!"}]}],"gram":[{"id":"lian-dou-ye","t":"连……都/也……","s":"Ngay cả… cũng…","b":"Cấu trúc dùng để <b>nhấn mạnh</b>: nêu ra một trường hợp cực đoan (dễ nhất, khó nhất, thân nhất…) để người nghe tự suy ra những trường hợp còn lại. <b>连</b> đứng trước phần được nhấn mạnh, sau đó bắt buộc phải có <b>都</b> hoặc <b>也</b> đứng trước động từ.","r":["Công thức: 连 + (danh từ/động từ/số lượng) + 都/也 + động từ. Không được bỏ 都/也.","Phần sau 连 có thể là tân ngữ đưa lên trước: 连中文报纸都看得懂 (tân ngữ 中文报纸 đảo lên trước động từ 看).","Thường có vế sau với 更 để suy rộng: 连大人都拿不动，小孩子更拿不动了。","Dạng phủ định nhấn mạnh mức thấp nhất: 连一个都没猜对 / 连话都不要和小王说。","Lỗi hay gặp: ✗ 连中文报纸看得懂 → ✓ 连中文报纸都看得懂。"],"e":[["你太厉害了！连中文报纸都看得懂。","Nǐ tài lìhai le! Lián Zhōngwén bàozhǐ dōu kàn de dǒng.","Cậu giỏi quá! Ngay cả báo tiếng Trung cũng đọc hiểu được. <i>(bài khoá 1)</i>"],["就随便猜了一个答案，结果一个都没猜对。","Jiù suíbiàn cāi le yí ge dá'àn, jiéguǒ yí ge dōu méi cāi duì.","Thế là đoán bừa một đáp án, kết quả chẳng đoán đúng câu nào. <i>(bài khoá 2 – cách dùng 都 nhấn mạnh)</i>"]],"d":[["连大人都拿不动，____________","小孩子更拿不动了。(B)"],["连老板都没办法，____________","我们更解决不了了。(C)"],["安娜因为这件事儿很生气，____________","连话都不要和小王说。(A)"]],"w":"Đừng nhầm 连 (ngay cả) với 连 trong 连接/连续 (nối, liên tục). Cũng phân biệt với 甚至: 甚至 đứng trước cả cụm và không bắt buộc có 都/也, còn 连 thì bắt buộc."},{"id":"wulun-haishi-zhiyao-jiu","t":"无论……，还是……，只要……就……","s":"Bất kể là… hay là…; chỉ cần… là…","b":"<b>无论</b> nêu ra mọi khả năng, hàm ý “điều kiện nào cũng không làm thay đổi kết quả”. Sau 无论 phải là một phần <b>có nhiều lựa chọn</b> (A 还是 B, từ để hỏi, hoặc A 不 A). Vế sau thường có <b>都/也</b>; trong bài khoá tác giả dùng tiếp <b>只要……就……</b> (chỉ cần… là…) để nêu điều kiện đủ.","r":["Công thức: 无论 + A 还是 B + ，(主语) 都/也 + …","Sau 无论 KHÔNG được dùng câu khẳng định đơn: ✗ 无论天气很好 → ✓ 无论天气好不好 / 无论天气怎么样。","无论 thiên về văn viết; khẩu ngữ thường dùng 不管. 不论 = 无论.","只要……就…… nêu điều kiện đủ (chỉ cần một điều kiện là đủ), khác 只有……才…… nêu điều kiện duy nhất (chỉ có… mới…)."],"e":[["无论是普通杂志，还是著名小说，只要打开它们，就会发现，世界上有那么多有意思的事情。","Wúlùn shì pǔtōng zázhì, háishi zhùmíng xiǎoshuō, zhǐyào dǎkāi tāmen, jiù huì fāxiàn, shìjiè shang yǒu nàme duō yǒu yìsi de shìqing.","Bất kể là tạp chí thường hay tiểu thuyết nổi tiếng, chỉ cần mở chúng ra là sẽ thấy trên đời có biết bao chuyện thú vị. <i>(bài khoá 3)</i>"]],"d":[],"w":"还是 ở đây KHÔNG phải “vẫn”, cũng không phải câu hỏi lựa chọn — nó chỉ nối hai khả năng bên trong vế 无论."},{"id":"laidejie-laibuji-zhihao","t":"来得及／来不及 + 只好","s":"Kịp / không kịp; đành phải","b":"<b>来得及</b> = còn kịp thời gian để làm; phủ định là <b>来不及</b> (không kịp). Đây là bổ ngữ khả năng, <b>không</b> dùng 不来得及. Khi hoàn cảnh không cho phép, ta dùng <b>只好</b> (đành phải) + động từ để nói lựa chọn bất đắc dĩ, thường đứng ngay trước động từ và hay đi với 最后/结果.","r":["来得及/来不及 + (动词): 来不及做完 / 来得及吃饭。Câu hỏi: 来得及吗？/ 来得及……吧？","只好 là phó từ, đứng SAU chủ ngữ và TRƯỚC động từ: ✗ 只好我放弃了 → ✓ 我只好放弃了。","只好 nhấn mạnh “không còn cách nào khác”; 只能 nhấn mạnh khả năng duy nhất; 不得不 mạnh hơn, mang sắc thái bị ép buộc.","Lỗi hay gặp: ✗ 时间不来得及 → ✓ 时间来不及。"],"e":[["两个小时的时间应该来得及吧？","Liǎng ge xiǎoshí de shíjiān yīnggāi láidejí ba?","Hai tiếng đồng hồ thì chắc là kịp chứ? <i>(bài khoá 2)</i>"],["后面简单的题我虽然会，可是时间来不及，最后只好放弃了。","Hòumiàn jiǎndān de tí wǒ suīrán huì, kěshì shíjiān lái bu jí, zuìhòu zhǐhǎo fàngqì le.","Mấy câu dễ ở phía sau tuy mình biết làm, nhưng không kịp thời gian, cuối cùng đành phải bỏ. <i>(bài khoá 2)</i>"]],"d":[["A：这是复习材料，复习要注意方法，要复习重要内容。B：时间可能来不及，不过______这样了，这些语法知识太难了。","只好"]],"w":"来得及 đọc là láidejí (得 đọc nhẹ de), đừng đọc thành děi."},{"id":"fouze","t":"否则……","s":"Nếu không thì…, bằng không thì…","b":"<b>否则</b> đứng đầu vế sau, nêu <b>kết quả xấu</b> sẽ xảy ra nếu không làm theo điều vừa nói ở vế trước. Nó tương đương “要不然/不然” nhưng trang trọng hơn, hay gặp trong bài viết và lời khuyên.","r":["Công thức: (要)…… ，否则 + kết quả không mong muốn.","Vế trước thường là một yêu cầu, lời khuyên hoặc điều kiện: 一定要坚持，否则……","Sau 否则 thường có 会/就会/不但……还…… để nói hậu quả.","Lỗi hay gặp: ✗ 否则你认真复习 → ✓ 要认真复习，否则会做的题也没时间做。"],"e":[["看来要想考好，不但要认真复习，还得注意考试的方法，否则，会做的题也没时间做。","Kàn lái yào xiǎng kǎo hǎo, búdàn yào rènzhēn fùxí, hái děi zhùyì kǎoshì de fāngfǎ, fǒuzé, huì zuò de tí yě méi shíjiān zuò.","Xem ra muốn thi tốt thì không chỉ phải ôn tập nghiêm túc, mà còn phải chú ý phương pháp làm bài, nếu không thì câu biết làm cũng chẳng còn thời gian mà làm. <i>(bài khoá 2)</i>"]],"d":[["理想的广告不应该太长，____________","否则观众就会失去兴趣。(B)"],["要想减肥成功，一定要坚持，____________","否则不但减肥不能成功，还会更胖。(C)"],["去美国留学前，应该先学好英语，____________","否则在那里生活很不方便。(A)"]],"w":"否则 chỉ nối hai VẾ CÂU, không đứng trước một danh từ. Ghi chú: 否则 xuất hiện trong bài luyện 练一练 nhưng không nằm trong danh sách từ mới của phần dữ liệu slide."},{"id":"budan-erqie-hai","t":"不但……，而且／还……","s":"Không những… mà còn…","b":"Cặp liên từ tăng tiến: vế sau nói thêm một điều <b>mạnh hơn, xa hơn</b> vế trước. Nếu hai vế <b>cùng một chủ ngữ</b> thì 不但 đứng SAU chủ ngữ; nếu <b>khác chủ ngữ</b> thì 不但 đứng TRƯỚC chủ ngữ thứ nhất. Vế sau có thể dùng 而且, 还, 也, 还得.","r":["Cùng chủ ngữ: 阅读能力好的人，不但容易找到工作，而且工资也比较高。","Khác chủ ngữ: 不但他喜欢阅读，我们也都喜欢阅读。","不但 = 不仅 = 不只; văn nói còn dùng 不光.","Lỗi hay gặp: ✗ 他不但会说汉语，而且会说英语，但是不会写 (đảo lộn logic) → hai vế phải cùng chiều tăng tiến.","Lỗi hay gặp: ✗ 不但要认真复习 (bỏ vế sau) → ✓ 不但要认真复习，还得注意考试的方法。"],"e":[["根据调查，阅读能力好的人，不但容易找到工作，而且工资也比较高。","Gēnjù diàochá, yuèdú nénglì hǎo de rén, búdàn róngyì zhǎo dào gōngzuò, érqiě gōngzī yě bǐjiào gāo.","Theo khảo sát, người có năng lực đọc hiểu tốt không những dễ tìm việc mà lương cũng khá cao. <i>(bài khoá 4)</i>"],["看来要想考好，不但要认真复习，还得注意考试的方法。","Kàn lái yào xiǎng kǎo hǎo, búdàn yào rènzhēn fùxí, hái děi zhùyì kǎoshì de fāngfǎ.","Xem ra muốn thi tốt thì không những phải ôn tập nghiêm túc, mà còn phải chú ý phương pháp làm bài. <i>(bài khoá 2)</i>"]],"d":[],"w":"Đừng nhầm với 虽然……但是…… (nhượng bộ, hai vế ngược chiều). 不但……而且…… thì hai vế luôn cùng chiều."},{"id":"chule-wai-hai","t":"除了……（以）外，还……","s":"Ngoài… ra, còn…","b":"Khi vế sau dùng <b>还/也</b>, cấu trúc mang nghĩa <b>bao gồm cả</b> (ngoài A ra còn có B, A vẫn đúng). Khi vế sau dùng <b>都</b>, nó lại mang nghĩa <b>loại trừ</b> (trừ A ra, tất cả đều…). Phải nhìn 还/都 để hiểu đúng nghĩa.","r":["Bao gồm: 除了 A（以外），还/也 + … → A và B đều đúng.","Loại trừ: 除了 A（以外），都 + … → chỉ mình A là ngoại lệ.","Phần 以外 có thể rút gọn thành 外 hoặc lược bỏ hẳn: 除了能增加知识外……","Sau 除了 có thể là danh từ, động từ hoặc cả cụm động từ: 除了能增加知识外。","Lỗi hay gặp: ✗ 除了看书，我很喜欢运动 → ✓ 除了看书，我还很喜欢运动。"],"e":[["坚持阅读，除了能增加知识外，还能帮助我减轻压力，人也会变得轻松起来。","Jiānchí yuèdú, chúle néng zēngjiā zhīshi wài, hái néng bāngzhù wǒ jiǎnqīng yālì, rén yě huì biàn de qīngsōng qǐlai.","Kiên trì đọc sách, ngoài việc tăng thêm kiến thức ra, còn giúp mình giảm bớt áp lực, con người cũng trở nên thoải mái hơn. <i>(bài khoá 3)</i>"]],"d":[],"w":"除了……都…… và 除了……还…… có nghĩa ngược nhau; đọc kỹ phó từ ở vế sau trước khi dịch."},{"id":"raner","t":"然而","s":"Nhưng, song, thế nhưng","b":"<b>然而</b> là liên từ chuyển ý của <b>văn viết</b>, đứng ở đầu vế/câu sau, nêu điều ngược với dự đoán rút ra từ câu trước. Nghĩa gần 但是/可是 nhưng trang trọng hơn nhiều, hay gặp trong bài đọc, bài luận.","r":["Vị trí: luôn đứng ĐẦU vế sau, sau nó thường có dấu phẩy: 然而，你不能完全相信书本上的内容。","Thường đi cùng 却 ở vế sau để nhấn mạnh sự tương phản: 然而现在却是一名老师。","然而 KHÔNG đi cặp với 虽然 (虽然 đi với 但是/可是).","Lỗi hay gặp: ✗ 我很累然而还要工作 (dùng giữa câu, khẩu ngữ) → ✓ 我很累，但是还要工作。"],"e":[["然而，你不能完全相信书本上的内容，要有自己的看法和判断。","Rán'ér, nǐ bù néng wánquán xiāngxìn shūběn shang de nèiróng, yào yǒu zìjǐ de kànfǎ hé pànduàn.","Thế nhưng, bạn không thể hoàn toàn tin vào nội dung trong sách, mà phải có quan điểm và phán đoán của riêng mình. <i>(bài khoá 4)</i>"]],"d":[["他从小就想成为一名警察，____________","然而现在却是一名老师。(B)"],["把简单的问题说复杂并不难，____________","然而把复杂的问题说简单却很难。(C)"],["有的人觉得只要有钱就会幸福，____________","然而很多有钱人却并不幸福。(A)"]],"w":"然而 dùng trong văn viết; khi nói chuyện hằng ngày vẫn nên dùng 但是/可是 cho tự nhiên."},{"id":"tongshi-xiangtong-gongtong","t":"同时／相同／共同／同意","s":"Đồng thời / giống nhau / chung / đồng ý","b":"Bốn từ cùng chứa chữ 同 nhưng khác từ loại và cách dùng. <b>同时</b>: danh từ chỉ thời gian hoặc liên từ “đồng thời, hơn nữa”. <b>相同</b>: tính từ “giống nhau, như nhau”. <b>共同</b>: tính từ/phó từ “chung, cùng nhau”. <b>同意</b>: động từ “đồng ý”.","r":["同时 đầu vế sau = “hơn nữa, đồng thời”: 同时，它还会丰富你的情感。Trong cụm 在……的同时 nghĩa là “trong khi…”.","相同 làm định ngữ phải có 的: 三个相同的汉字; làm vị ngữ: 我们的看法相同。","共同 làm định ngữ chỉ cái “chung của nhiều người”: 共同的特点/共同的爱好; làm trạng ngữ: 共同学习。","同意 là động từ, mang tân ngữ hoặc động từ theo sau: 同意换 / 同意这个看法。","Lỗi hay gặp: ✗ 两个相同的意见 khi ý là “ý kiến chung” → ✓ 共同的意见。"],"e":[["同时，它还会丰富你的情感，使你的生活更精彩。","Tóngshí, tā hái huì fēngfù nǐ de qínggǎn, shǐ nǐ de shēnghuó gèng jīngcǎi.","Đồng thời, nó còn làm phong phú tình cảm của bạn, khiến cuộc sống của bạn tuyệt vời hơn. <i>(bài khoá 5)</i>"],["虽然这句话只用了三个相同的汉字，但是不同的顺序却表示了不同的意思。","Suīrán zhè jù huà zhǐ yòng le sān ge xiāngtóng de Hànzì, dànshì bù tóng de shùnxù què biǎoshì le bù tóng de yìsi.","Tuy câu này chỉ dùng ba chữ Hán giống nhau, nhưng thứ tự khác nhau lại biểu thị những ý nghĩa khác nhau. <i>(bài khoá 5)</i>"]],"d":[["幽默是成功者的______特点之一，也是值得我们好好学习的一种生活态度。","共同"],["医生建议大家冬季在选择合适的锻炼方法的______，应该注意运动量不要太大。","同时"],["中国小孩子的小名一般都比较好听好记，而且很多都是两个______的字，比如“乐乐”“笑笑”“聪聪”等。","相同"],["A：网上买衣服没法试穿，大小不合适怎么办？B：没关系，尺码不合适的话，店家一般都会______换的。","同意"]],"w":"共同 nhấn mạnh “của chung nhiều người”, 相同 nhấn mạnh “hai thứ giống hệt nhau”. 同时 chỉ thời gian/quan hệ bổ sung, không dùng để so sánh."},{"id":"zhi-zhihou-zhiyi","t":"之（……之后／……之一／其中）","s":"Chữ 之 nối định ngữ với trung tâm ngữ (văn viết)","b":"<b>之</b> là cách nói văn viết, tương ứng với <b>的</b> trong khẩu ngữ, dùng để nối phần bổ nghĩa với phần được bổ nghĩa. HSK4 chủ yếu gặp trong các khuôn cố định: <b>……之后／之前</b> (sau/trước khi…), <b>……之一</b> (một trong những…), <b>……之中／之间</b>.","r":["……之后 = ……以后 nhưng trang trọng hơn; thường đi với 在……之后: 在看完一篇文章或一本书之后……","……之一 phải đứng sau một cụm danh từ số nhiều: 成功者的共同特点之一 (một trong những đặc điểm chung).","之 không tự do như 的: chỉ dùng trong khuôn cố định hoặc cụm cố định (三分之一, 之中).","Lỗi hay gặp: ✗ 我之书 → ✓ 我的书。"],"e":[["另外，在看完一篇文章或一本书之后，还可以把它的主要内容和自己的想法写下来。","Lìngwài, zài kàn wán yì piān wénzhāng huò yì běn shū zhīhòu, hái kěyǐ bǎ tā de zhǔyào nèiróng hé zìjǐ de xiǎngfǎ xiě xialai.","Ngoài ra, sau khi đọc xong một bài văn hay một quyển sách, còn có thể ghi lại nội dung chính của nó và suy nghĩ của bản thân. <i>(bài khoá 4)</i>"],["做读书笔记就是其中一种好方法。","Zuò dúshū bǐjì jiùshì qízhōng yì zhǒng hǎo fāngfǎ.","Ghi chép khi đọc sách chính là một trong những cách hay đó. <i>(bài khoá 4 – cách nói 其中 gần nghĩa với ……之一)</i>"]],"d":[["幽默是成功者的共同特点______，也是值得我们好好学习的一种生活态度。","之一"]],"w":"之后 chỉ thời gian “sau khi”, còn 以后 dùng được cả khẩu ngữ; đừng viết ✗ 之后以后."}],"notes":"1) Dữ liệu slide 23, 52, 63 chỉ là CÂU HỎI đọc hiểu (马克为什么能顺利地跟中国人交流？/ 哪种方法可以提高阅读能力？/ 我们应该选择什么样的书？…) nên không đưa vào phần texts. 2) Bài khoá 4 (slide 53) và bài khoá 5 (slide 64) không có tiêu đề trong slide; tiêu đề ở đây do người soạn đặt theo nội dung, phần chữ Hán giữ nguyên 100% theo slide. 3) Bản pinyin kèm theo trong slide bị ĐẢO THỨ TỰ DÒNG và có lỗi (ví dụ slide 64 ghi 'zhī yòng le' trong khi chữ Hán là 只用了 → zhǐ yòng le; slide 24 ghi 'yī xiē' → yìxiē; slide 37 ghi 'yǒu jī ge' → yǒu jǐ ge). Toàn bộ pinyin trong file này đã được đánh lại theo chuẩn, có dấu thanh. 4) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở đây được suy ra từ nội dung 练一练 (连……都/也, 否则, 然而, 同时/相同/共同/同意, 只好) và từ các cấu trúc nổi bật trong bài khoá (无论……还是……只要……就, 不但……而且/还, 除了……外……还, 来得及/来不及, ……之后/之一). 5) Từ 否则 (fǒuzé – nếu không thì) xuất hiện trong phần 练一练 nhưng KHÔNG có trong danh sách 5 đợt từ mới của dữ liệu; đã đưa vào phần ngữ pháp, không đưa vào vocab_ex. 6) Danh sách từ mới trong dữ liệu có 29 từ (đợt 4 chỉ có 5 từ, các đợt khác 6 từ); need_vi rỗng nên không có từ nào phải tự dịch. 7) Ghi chú chính tả trong dữ liệu gốc: 著名 ghi 'Nổ tiếng' (đợt 3) còn 练一练 ghi 'Nổi tiếng'; nghĩa tiếng Việt của từ mới được giữ nguyên theo yêu cầu, không sửa.","order":[{"z":"连中文报纸都看得懂。","t":["连","中文","报纸","都","看得懂"],"v":"Cậu giỏi quá đi! Ngay cả báo tiếng Trung cũng đọc hiểu được."},{"z":"考试结束了，你对自己的成绩满意吗？","t":["考试","结束","了","你","对","自己","的","成绩","满意","吗"],"v":"Thi xong rồi, cậu có hài lòng với kết quả của mình không?"},{"z":"说真的，我不太满意。","t":["说真的","我","不","太","满意"],"v":"Nói thật thì mình không hài lòng lắm. Bài thi đọc hiểu lần này nhiều câu quá, mình làm không hết."},{"z":"两个小时的时间应该来得及吧？","t":["两个","小时","的","时间","应该","来得及","吧"],"v":"Hai tiếng đồng hồ thì chắc là kịp chứ nhỉ?"},{"z":"其实我考得也不怎么样。","t":["其实","我","考得","也","不怎么样"],"v":"Thật ra mình thi cũng chẳng ra sao. Có mấy câu điền vào chỗ trống không biết làm, mấy câu trắc nghiệm thì nghĩ mãi không ra nên ch"},{"z":"你的客厅里怎么到处是书啊？","t":["你","的","客厅","里","怎么","到处","是","书","啊"],"v":"Sao trong phòng khách nhà cậu chỗ nào cũng là sách vậy? Mấy quyển sách này cậu đều thích đọc à?"},{"z":"这些书你都喜欢看吗？","t":["这些","书","你","都","喜欢","看","吗"],"v":"Sao trong phòng khách nhà cậu chỗ nào cũng là sách vậy? Mấy quyển sách này cậu đều thích đọc à?"},{"z":"当然，我每天都要看书。","t":["当然","我","每天","都","要","看书"],"v":"Đương nhiên rồi, ngày nào mình cũng phải đọc sách."},{"z":"想不到你工作那么忙，还能每天坚持阅读。","t":["想不到","你","工作","那么","忙","还","能","每天","坚持","阅读"],"v":"Không ngờ công việc bận rộn như vậy mà ngày nào cậu cũng kiên trì đọc sách được."},{"z":"怎么才能有效提高自己的阅读能力呢？","t":["怎么","才能","有效","提高","自己","的","阅读","能力","呢"],"v":"Làm thế nào mới nâng cao được năng lực đọc hiểu của mình một cách hiệu quả? Ghi chép khi đọc sách chính là một trong những cách ha"},{"z":"做读书笔记就是其中一种好方法。","t":["做","读书笔记","就是","其中","一种","好","方法"],"v":"Làm thế nào mới nâng cao được năng lực đọc hiểu của mình một cách hiệu quả? Ghi chép khi đọc sách chính là một trong những cách ha"},{"z":"坚持做读书笔记，对提高阅读能力有很大帮助。","t":["坚持","做","读书笔记","对","提高","阅读","能力","有","很大","帮助"],"v":"Kiên trì ghi chép khi đọc sách có ích rất lớn cho việc nâng cao năng lực đọc hiểu."},{"z":"所以，让阅读成为你的习惯吧！","t":["所以","让","阅读","成为","你","的","习惯","吧"],"v":"Vì vậy, hãy để việc đọc sách trở thành thói quen của bạn!"},{"z":"他的英语说得非常流利。","t":["他","的","英语","说","得","非常","流利"],"v":"Tiếng Anh của anh ấy nói rất trôi chảy."},{"z":"你一个人搬了这么多东西，真厉害！","t":["你","一个","人","搬","了","这么","多","东西","真","厉害"],"v":"Cậu một mình khiêng ngần này đồ, giỏi thật đấy!"},{"z":"这个句子的语法有点儿问题。","t":["这个","句子","的","语法","有点儿","问题"],"v":"Ng
