lành."},{"h":"竞争","p":"jìng zhēng","v":"Cạnh tranh","ez":"现在找工作的竞争越来越厉害。","ey":"Xiànzài zhǎo gōngzuò de jìngzhēng yuè lái yuè lìhai.","ev":"Bây giờ cạnh tranh tìm việc ngày càng gay gắt."},{"h":"剩","p":"shèng","v":"Còn lại","ez":"桌子上还剩两个包子，你吃吧。","ey":"Zhuōzi shang hái shèng liǎng ge bāozi, nǐ chī ba.","ev":"Trên bàn còn hai cái bánh bao, cậu ăn đi."},{"h":"暖和","p":"nuǎn huo","v":"Ấm áp","ez":"今天太阳很好，外边很暖和。","ey":"Jīntiān tàiyáng hěn hǎo, wàibian hěn nuǎnhuo.","ev":"Hôm nay nắng đẹp, bên ngoài rất ấm áp."}],[{"h":"海洋","p":"hǎi yáng","v":"Biển, đại dương","ez":"他从小就对海洋很感兴趣。","ey":"Tā cóngxiǎo jiù duì hǎiyáng hěn gǎn xìngqù.","ev":"Anh ấy từ nhỏ đã rất thích biển cả."},{"h":"美人鱼","p":"Měirényú","v":"Người cá","ez":"妹妹最喜欢看美人鱼的电影。","ey":"Mèimei zuì xǐhuan kàn Měirényú de diànyǐng.","ev":"Em gái tôi thích nhất phim về nàng tiên cá."},{"h":"底","p":"dǐ","v":"Đáy","ez":"鱼在水底游来游去。","ey":"Yú zài shuǐ dǐ yóu lái yóu qù.","ev":"Cá bơi qua bơi lại dưới đáy nước."},{"h":"公里","p":"gōng lǐ","v":"Kilômét","ez":"我家离学校只有两公里。","ey":"Wǒ jiā lí xuéxiào zhǐ yǒu liǎng gōnglǐ.","ev":"Nhà tôi cách trường chỉ hai kilômét."},{"h":"仍然","p":"réng rán","v":"Vẫn","ez":"都十点了，他仍然在办公室工作。","ey":"Dōu shí diǎn le, tā réngrán zài bàngōngshì gōngzuò.","ev":"Mười giờ rồi mà anh ấy vẫn làm việc ở văn phòng."},{"h":"排列","p":"pái liè","v":"Sắp xếp (theo thứ tự)","ez":"这些书是按照名字排列的。","ey":"Zhèxiē shū shì ànzhào míngzi páiliè de.","ev":"Những cuốn sách này được sắp xếp theo tên."},{"h":"梦","p":"mèng","v":"Giấc mơ","ez":"他晚上总做梦，睡得不太好。","ey":"Tā wǎnshang zǒng zuò mèng, shuì de bú tài hǎo.","ev":"Ban đêm anh ấy hay nằm mơ, ngủ không ngon lắm."}]],"texts":[{"no":1,"tz":"小夏和安娜在聊天气","tv":"Tiểu Hạ và Anna trò chuyện về thời tiết","lines":[{"s":"小夏","z":"最近天气越来越凉快了，风一刮，草地上就会有一层厚厚的黄叶，看来秋天已经到了。","p":"Zuìjìn tiānqì yuè lái yuè liángkuai le, fēng yì guā, cǎodì shang jiù huì yǒu yì céng hòuhòu de huáng yè, kàn lái qiūtiān yǐjīng dào le.","v":"Dạo này trời càng ngày càng mát, gió vừa thổi một cái là trên bãi cỏ lại phủ một lớp lá vàng dày, xem ra mùa thu đã đến rồi."},{"s":"安娜","z":"这几天香山特别热闹，随着气温的降低，那里许多植物的叶子都由绿变黄或者变红，吸引了很多游客参观，咱们今天也去看看吧。","p":"Zhè jǐ tiān Xiāngshān tèbié rènao, suízhe qìwēn de jiàngdī, nàli xǔduō zhíwù de yèzi dōu yóu lǜ biàn huáng huòzhě biàn hóng, xīyǐn le hěn duō yóukè cānguān, zánmen jīntiān yě qù kànkan ba.","v":"Mấy hôm nay Hương Sơn náo nhiệt lắm, nhiệt độ hạ dần nên lá của nhiều loài cây ở đó chuyển từ xanh sang vàng hoặc sang đỏ, thu hút rất nhiều du khách đến tham quan, hôm nay chúng mình cũng đi xem đi."},{"s":"小夏","z":"你看天上的云，今天肯定有大雨。再说，香山上看红叶的人太多了。咱们改天去长城吧，广播里说那里也有不少专门看红叶的好地方。","p":"Nǐ kàn tiān shang de yún, jīntiān kěndìng yǒu dàyǔ. Zàishuō, Xiāngshān shang kàn hóngyè de rén tài duō le. Zánmen gǎitiān qù Chángchéng ba, guǎngbō li shuō nàli yě yǒu bù shǎo zhuānmén kàn hóngyè de hǎo dìfang.","v":"Cậu xem mây trên trời kìa, hôm nay chắc chắn có mưa to. Vả lại, trên Hương Sơn người đi ngắm lá đỏ đông quá. Hôm khác mình đi Trường Thành đi, đài phát thanh nói ở đó cũng có nhiều chỗ hay chuyên để ngắm lá đỏ."},{"s":"安娜","z":"真可惜，我还想多照点儿香山的照片呢。去长城倒是一个好主意，那我们明天去吧。","p":"Zhēn kěxī, wǒ hái xiǎng duō zhào diǎnr Xiāngshān de zhàopiàn ne. Qù Chángchéng dào shì yí ge hǎo zhǔyi, nà wǒmen míngtiān qù ba.","v":"Tiếc thật, tớ còn muốn chụp thêm mấy tấm ảnh Hương Sơn nữa chứ. Đi Trường Thành thì cũng là một ý hay đấy, vậy mai mình đi nhé."},{"s":"小夏","z":"明天恐怕也不行，明天是我爸的生日。","p":"Míngtiān kǒngpà yě bù xíng, míngtiān shì wǒ bà de shēngrì.","v":"Mai e là cũng không được, mai là sinh nhật bố tớ."},{"s":"安娜","z":"没关系，那我们再约时间。","p":"Méi guānxi, nà wǒmen zài yuē shíjiān.","v":"Không sao, vậy mình hẹn lại dịp khác."}]},{"no":2,"tz":"小林和小李在聊小李的狗","tv":"Tiểu Lâm và Tiểu Lý nói chuyện về con chó của Tiểu Lý","lines":[{"s":"小林","z":"你的这只大黑狗毛真漂亮，而且这么聪明，每次见了都想抱一抱它。","p":"Nǐ de zhè zhī dà hēi gǒu máo zhēn piàoliang, érqiě zhème cōngming, měi cì jiàn le dōu xiǎng bào yi bào tā.","v":"Con chó đen to này của cậu lông đẹp thật, lại còn thông minh thế nữa, lần nào gặp tớ cũng muốn ôm nó một cái."},{"s":"小李","z":"狗是很聪明的动物，只要稍微花点儿时间教教它，它就能学会很多东西。","p":"Gǒu shì hěn cōngming de dòngwù, zhǐyào shāowēi huā diǎnr shíjiān jiāojiao tā, tā jiù néng xuéhuì hěn duō dōngxi.","v":"Chó là loài vật rất thông minh, chỉ cần bỏ ra chút thời gian dạy nó là nó học được rất nhiều thứ."},{"s":"小林","z":"听你这么一说，我现在也想养一只狗了。每次你让它干什么，它就像能听懂你的话一样去做。你教它是不是用了什么特别的方法？","p":"Tīng nǐ zhème yì shuō, wǒ xiànzài yě xiǎng yǎng yì zhī gǒu le. Měi cì nǐ ràng tā gàn shénme, tā jiù xiàng néng tīngdǒng nǐ de huà yíyàng qù zuò. Nǐ jiāo tā shì bu shì yòng le shénme tèbié de fāngfǎ?","v":"Nghe cậu nói vậy, giờ tớ cũng muốn nuôi một con chó rồi. Mỗi lần cậu bảo nó làm gì, nó làm y như thể hiểu được lời cậu nói vậy. Cậu dạy nó có dùng cách gì đặc biệt không?"},{"s":"小李","z":"要让它完成一些任务，只教一次是不够的，应该耐心地一遍一遍地教给它，使它熟悉，然后它就会严格按照你的要求做了。","p":"Yào ràng tā wánchéng yìxiē rènwu, zhǐ jiāo yí cì shì bú gòu de, yīnggāi nàixīn de yí biàn yí biàn de jiāo gěi tā, shǐ tā shúxi, ránhòu tā jiù huì yángé ànzhào nǐ de yāoqiú zuò le.","v":"Muốn nó hoàn thành được một số nhiệm vụ thì dạy một lần là không đủ, phải kiên nhẫn dạy đi dạy lại từng lượt một cho nó quen, sau đó nó sẽ làm đúng nghiêm ngặt theo yêu cầu của cậu."},{"s":"小林","z":"看来没有想的那么容易。","p":"Kàn lái méiyǒu xiǎng de nàme róngyì.","v":"Xem ra không dễ như mình tưởng."},{"s":"小李","z":"狗是我们的好朋友，它能听懂人的话，明白人的心情。在你心里难受的时候，它会一直陪着你。","p":"Gǒu shì wǒmen de hǎo péngyou, tā néng tīngdǒng rén de huà, míngbai rén de xīnqíng. Zài nǐ xīnli nánshòu de shíhou, tā huì yìzhí péi nǐ.","v":"Chó là bạn tốt của chúng ta, nó hiểu được lời người nói, hiểu được tâm trạng của con người. Lúc trong lòng bạn buồn bực, nó sẽ luôn ở bên bạn."}]},{"no":3,"tz":"马克和小夏在聊动物","tv":"Mark và Tiểu Hạ nói chuyện về động vật","lines":[{"s":"马克","z":"上个月我去了趟北京动物园，那里约有500种动物，听导游说北京动物园是亚洲最大的动物园之一。","p":"Shàng ge yuè wǒ qù le tàng Běijīng Dòngwùyuán, nàli yuē yǒu wǔbǎi zhǒng dòngwù, tīng dǎoyóu shuō Běijīng Dòngwùyuán shì Yàzhōu zuì dà de dòngwùyuán zhī yī.","v":"Tháng trước tớ đi một chuyến đến Sở thú Bắc Kinh, ở đó có khoảng 500 loài động vật, nghe hướng dẫn viên nói Sở thú Bắc Kinh là một trong những sở thú lớn nhất châu Á."},{"s":"小夏","z":"去年放暑假的时候，我也去过一次，我在那儿看了马、熊猫、老虎等动物。我特别喜欢熊猫，可惜它们当时大多在睡觉。","p":"Qùnián fàng shǔjià de shíhou, wǒ yě qù guo yí cì, wǒ zài nàr kàn le mǎ, xióngmāo, lǎohǔ děng dòngwù. Wǒ tèbié xǐhuan xióngmāo, kěxī tāmen dāngshí dàduō zài shuìjiào.","v":"Hè năm ngoái tớ cũng đến một lần, ở đó tớ đã xem ngựa, gấu trúc, hổ và nhiều loài vật khác. Tớ đặc biệt thích gấu trúc, tiếc là lúc đó phần lớn chúng đang ngủ."},{"s":"马克","z":"我去的那天正赶上六一儿童节，许多父母带着孩子去动物园。入口处排队的人很多，动物园里热闹极了。熊猫们也变得特别活泼，我还给它们照了不少照片呢。","p":"Wǒ qù de nà tiān zhèng gǎnshang Liù-Yī Értóngjié, xǔduō fùmǔ dài zhe háizi qù dòngwùyuán. Rùkǒu chù páiduì de rén hěn duō, dòngwùyuán li rènao jí le. Xióngmāomen yě biàn de tèbié huópō, wǒ hái gěi tāmen zhào le bù shǎo zhàopiàn ne.","v":"Hôm tớ đi đúng dịp Tết Thiếu nhi mùng 1 tháng 6, rất nhiều bố mẹ dẫn con đến sở thú. Người xếp hàng ở cổng vào rất đông, trong sở thú náo nhiệt vô cùng. Mấy con gấu trúc cũng trở nên đặc biệt hoạt bát, tớ còn chụp cho chúng khá nhiều ảnh nữa."},{"s":"小夏","z":"大熊猫身子胖胖的，样子可爱极了。","p":"Dà xióngmāo shēnzi pàngpàng de, yàngzi kě'ài jí le.","v":"Gấu trúc lớn thân hình mũm mĩm, trông đáng yêu vô cùng."},{"s":"马克","z":"不过，它们数量不多，现在全世界一共才有一千多只吧。","p":"Búguò, tāmen shùliàng bù duō, xiànzài quán shìjiè yígòng cái yǒu yìqiān duō zhī ba.","v":"Có điều, số lượng của chúng không nhiều, hiện nay cả thế giới tổng cộng mới chỉ có hơn một nghìn con thôi."},{"s":"小夏","z":"以前只有中国有大熊猫，为了表示友好，从1957年开始，中国把大熊猫作为礼物送给其他一些国家。现在，很多国家的人们在本国都能看到大熊猫了。","p":"Yǐqián zhǐyǒu Zhōngguó yǒu dà xióngmāo, wèile biǎoshì yǒuhǎo, cóng yī jiǔ wǔ qī nián kāishǐ, Zhōngguó bǎ dà xióngmāo zuòwéi lǐwù sòng gěi qítā yìxiē guójiā. Xiànzài, hěn duō guójiā de rénmen zài běnguó dōu néng kàn dào dà xióngmāo le.","v":"Trước đây chỉ Trung Quốc mới có gấu trúc lớn, để bày tỏ thiện chí, từ năm 1957 Trung Quốc đã đem gấu trúc làm quà tặng cho một số nước khác. Hiện nay, người dân nhiều nước đã có thể nhìn thấy gấu trúc ngay tại nước mình."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"不仅社会上的人与人之间有竞争，森林里的各种植物之间也有竞争，这一点儿也不奇怪。","p":"Bùjǐn shèhuì shang de rén yǔ rén zhījiān yǒu jìngzhēng, sēnlín li de gè zhǒng zhíwù zhījiān yě yǒu jìngzhēng, zhè yìdiǎnr yě bù qíguài.","v":"Không chỉ giữa người với người trong xã hội mới có cạnh tranh, giữa các loài cây trong rừng cũng có cạnh tranh, điều này chẳng có gì lạ cả."},{"s":"","z":"植物会为了阳光、空气和水而竞争。","p":"Zhíwù huì wèile yángguāng, kōngqì hé shuǐ ér jìngzhēng.","v":"Thực vật cạnh tranh với nhau vì ánh nắng, không khí và nước."},{"s":"","z":"一些高大的植物往往能获得更多的阳光、空气和水，而剩下的一些比较低矮的植物就只能长在这些高大植物的下面。","p":"Yìxiē gāodà de zhíwù wǎngwǎng néng huòdé gèng duō de yángguāng, kōngqì hé shuǐ, ér shèngxià de yìxiē bǐjiào dī'ǎi de zhíwù jiù zhǐ néng zhǎng zài zhèxiē gāodà zhíwù de xiàmiàn.","v":"Một số cây cao lớn thường giành được nhiều ánh nắng, không khí và nước hơn, còn những cây thấp bé còn lại thì chỉ có thể mọc bên dưới những cây cao lớn ấy."},{"s":"","z":"由于气候条件不同，世界各地植物叶子的样子也很不相同。","p":"Yóuyú qìhòu tiáojiàn bùtóng, shìjiè gèdì zhíwù yèzi de yàngzi yě hěn bù xiāngtóng.","v":"Do điều kiện khí hậu khác nhau, hình dáng lá cây ở các nơi trên thế giới cũng rất khác nhau."},{"s":"","z":"在暖和、水分比较多的地方，叶子往往长得又大又厚；在阳光特别厉害、水分少的地方，叶子就会长得又细又长。","p":"Zài nuǎnhuo, shuǐfèn bǐjiào duō de dìfang, yèzi wǎngwǎng zhǎng de yòu dà yòu hòu; zài yángguāng tèbié lìhai, shuǐfèn shǎo de dìfang, yèzi jiù huì zhǎng de yòu xì yòu cháng.","v":"Ở những nơi ấm áp, nhiều nước, lá cây thường mọc vừa to vừa dày; ở những nơi nắng gắt, ít nước, lá cây lại mọc vừa mảnh vừa dài."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"地球上大约71%的地方是蓝色的海洋，在美丽的海底世界里，生活着各种各样的植物和动物。","p":"Dìqiú shang dàyuē bǎi fēn zhī qīshíyī de dìfang shì lánsè de hǎiyáng, zài měilì de hǎidǐ shìjiè li, shēnghuó zhe gè zhǒng gè yàng de zhíwù hé dòngwù.","v":"Khoảng 71% bề mặt Trái Đất là đại dương xanh, trong thế giới đáy biển tươi đẹp ấy có đủ mọi loài thực vật và động vật sinh sống."},{"s":"","z":"我们小时候都听过美人鱼的故事，其实真正的海底世界比故事里写的更美。","p":"Wǒmen xiǎo shíhou dōu tīng guo měirényú de gùshi, qíshí zhēnzhèng de hǎidǐ shìjiè bǐ gùshi li xiě de gèng měi.","v":"Hồi nhỏ chúng ta ai cũng từng nghe chuyện nàng tiên cá, thật ra thế giới đáy biển ngoài đời còn đẹp hơn cả trong truyện."},{"s":"","z":"科学研究发现，海洋底部看上去非常安静，然而却不是一点儿声音也没有，海底的动物们一直在“说话”，只不过人的耳朵是听不到的。","p":"Kēxué yánjiū fāxiàn, hǎiyáng dǐbù kàn shangqu fēicháng ānjìng, rán'ér què bú shì yìdiǎnr shēngyīn yě méiyǒu, hǎidǐ de dòngwùmen yìzhí zài “shuōhuà”, zhǐbuguò rén de ěrduo shì tīng bu dào de.","v":"Nghiên cứu khoa học phát hiện, đáy đại dương nhìn thì có vẻ rất yên tĩnh, nhưng thực ra không phải là không có một chút âm thanh nào, các loài vật dưới đáy biển vẫn luôn “nói chuyện”, chỉ có điều tai người không nghe thấy được thôi."},{"s":"","z":"另外，就算在几公里深的海底也仍然能看到东西，许多鱼会发出各种颜色的亮光，像一个个排列起来的灯，美极了，就像在梦里一样。","p":"Lìngwài, jiùsuàn zài jǐ gōnglǐ shēn de hǎidǐ yě réngrán néng kàn dào dōngxi, xǔduō yú huì fāchū gè zhǒng yánsè de liàngguāng, xiàng yí gège páiliè qǐlai de dēng, měi jí le, jiù xiàng zài mèng li yíyàng.","v":"Ngoài ra, dù ở độ sâu vài kilômét dưới đáy biển thì vẫn nhìn thấy được mọi vật, nhiều loài cá phát ra ánh sáng đủ màu, như những ngọn đèn xếp thành hàng, đẹp vô cùng, cứ như đang ở trong mơ vậy."}]}],"gram":[{"id":"dao-shi","t":"……倒(是)……","s":"…thì lại…, …thì cũng… (nêu ý trái với dự đoán, nói giảm cho lịch sự)","b":"倒 (dào) ở đây là <b>phó từ</b>, đứng <b>sau chủ ngữ, trước động từ/tính từ</b>, thường đi cùng 是 thành 倒是. Nó cho biết điều sắp nói <b>ngược với dự đoán</b> của người nghe, hoặc dùng để khen một nửa rồi chuyển ý cho nhẹ nhàng, lịch sự.","r":["Vị trí cố định: Chủ ngữ + 倒(是) + động từ/tính từ. ✗ 倒这个想法不错 → ✓ 这个想法倒是不错","Rất hay dùng theo mạch “A không như mong đợi, nhưng B 倒是 …”: 我的房间不大，装修倒是很讲究。","Sau 倒是 vẫn dùng được 很/非常: 装修倒是很讲究。","lỗi hay gặp: ✗ 去长城是倒一个好主意 → ✓ 去长城倒是一个好主意"],"e":[["去长城倒是一个好主意，那我们明天去吧。","Qù Chángchéng dào shì yí ge hǎo zhǔyi, nà wǒmen míngtiān qù ba.","Đi Trường Thành thì lại là một ý hay đấy, vậy mai mình đi nhé. <i>(bài khoá 1)</i>"]],"d":[["您儿子跟我聊天儿时告诉我，他想大学毕业后就去当演员。____","这个想法倒是不错。"],["我的房间不大，____","装修倒是很讲究。"]],"w":"Cùng một chữ 倒 nhưng khác từ: 倒 <b>dào</b> (phó từ) = “thì lại”; 倒 <b>dào</b> (động từ) = rót — 可以给我倒杯茶吗？; 倒 <b>dǎo</b> = đổ, ngã. Nhìn vị trí trong câu để phân biệt: đứng trước danh từ thì là động từ “rót”, đứng trước động từ/tính từ thì là phó từ."},{"id":"dong-liang-ci-tang-ci-bian","t":"动量词：趟 / 次 / 遍","s":"lượng từ chỉ số lần của động tác: chuyến / lần / lượt","b":"Động lượng từ đứng <b>sau động từ</b> để đếm số lần thực hiện động tác. <b>趟</b> đếm chuyến đi lại (có đi có về, hoặc chuyến xe); <b>次</b> đếm số lần nói chung; <b>遍</b> nhấn mạnh làm <b>trọn vẹn từ đầu đến cuối</b> một lượt.","r":["Trật tự: Động từ + 了/过 + 一 + 趟/次/遍 + tân ngữ (nơi chốn, sự vật). ✓ 我去了一趟北京动物园","Có thể lược 一 sau 了 trong khẩu ngữ: 我去了趟北京动物园。","Nếu tân ngữ là đại từ nhân xưng thì lượng từ đứng SAU đại từ: 我找了他两次。","Dạng lặp 一 + 量词 + 一 + 量词 + 地 diễn tả làm đi làm lại: 一遍一遍地教。","lỗi hay gặp: ✗ 我去了北京动物园一趟 → ✓ 我去了一趟北京动物园"],"e":[["上个月我去了趟北京动物园，那里约有500种动物。","Shàng ge yuè wǒ qù le tàng Běijīng Dòngwùyuán, nàli yuē yǒu wǔbǎi zhǒng dòngwù.","Tháng trước tớ đi một chuyến đến Sở thú Bắc Kinh, ở đó có khoảng 500 loài động vật. <i>(bài khoá 3)</i>"],["应该耐心地一遍一遍地交给它，使它熟悉。","Yīnggāi nàixīn de yí biàn yí biàn de jiāo gěi tā, shǐ tā shúxi.","Phải kiên nhẫn dạy đi dạy lại từng lượt một cho nó quen. <i>(bài khoá 2)</i>"],["去年放暑假的时候，我也去过一次。","Qùnián fàng shǔjià de shíhou, wǒ yě qù guo yí cì.","Hè năm ngoái tớ cũng đã đến một lần. <i>(bài khoá 3)</i>"]],"d":[["去年放暑假的时候，我去了一____北京动物园。","趟"],["我们去____超市吧，明天出去玩儿得买点儿饼干和面包。","趟"],["中午我给你打了好几____电话，你怎么都不接呢？","次"],["他没赶上最后一____公共汽车，只好坐出租车回家了。","趟"],["西红柿鸡蛋汤的做法很简单，我保证你一____就能学会。","遍"]],"w":"趟 gắn với việc <b>đi lại</b> (đi rồi về) và chuyến xe: 最后一趟公共汽车. 遍 nhấn mạnh <b>hết cả quá trình</b>: 看一遍 = đọc/xem hết một lượt; còn 看一次 chỉ đơn thuần “xem một lần”, không cần hết."},{"id":"weile-er","t":"(为了)……而……","s":"vì / để … mà …","b":"为了 nêu <b>mục đích</b>, 而 nối mục đích đó với động từ chỉ hành động, đứng <b>ngay trước động từ chính</b>. Cấu trúc này mang màu sắc trang trọng, hay gặp trong bài đọc và văn viết.","r":["Cấu trúc: (Chủ ngữ) + 为了 + mục đích + 而 + động từ.","为了 có thể đứng đầu câu (tách bằng dấu phẩy) khi nhấn mạnh mục đích: 为了表示友好，从1957年开始……","而 không mang nghĩa riêng ở đây, chỉ nối; không được bỏ 而 khi đã dùng lối văn viết này: ✗ 植物会为了阳光竞争 → ✓ 植物会为了阳光、空气和水而竞争","lỗi hay gặp: ✗ 我们不应该为了钱而的工作 → ✓ 我们不应该为了钱而工作"],"e":[["植物会为了阳光、空气和水而竞争。","Zhíwù huì wèile yángguāng, kōngqì hé shuǐ ér jìngzhēng.","Thực vật cạnh tranh với nhau vì ánh nắng, không khí và nước. <i>(bài khoá 4)</i>"],["为了表示友好，从1957年开始，中国把大熊猫作为礼物送给其他一些国家。","Wèile biǎoshì yǒuhǎo, cóng yī jiǔ wǔ qī nián kāishǐ, Zhōngguó bǎ dà xióngmāo zuòwéi lǐwù sòng gěi qítā yìxiē guójiā.","Để bày tỏ thiện chí, từ năm 1957 Trung Quốc đã đem gấu trúc lớn làm quà tặng cho một số nước khác. <i>(bài khoá 3)</i>"]],"d":[["我们不应该为了钱而工作，____","应该让钱为了我们工作。"],["胖一点儿没关系，健康最重要。千万不要____","为了减肥而不吃饭。"],["不要为了工作而忽视了父母，____","找时间陪陪他们吧，或者给他们打个电话，不要等到来不及的时候才感到后悔。"]],"w":"为了 nêu <b>mục đích</b> (làm để được gì), 因为 nêu <b>nguyên nhân</b> (tại sao xảy ra). ✗ 因为阳光而竞争 (sai sắc thái) → ✓ 为了阳光而竞争."},{"id":"reng-ran","t":"仍然……","s":"vẫn, vẫn cứ (tình trạng không thay đổi)","b":"仍然 là <b>phó từ</b>, đứng <b>sau chủ ngữ, trước động từ/tính từ</b>, cho biết sự việc <b>giữ nguyên như trước</b>, không đổi dù có điều kiện tác động. Sắc thái trang trọng hơn 还 / 还是 trong khẩu ngữ.","r":["Vị trí: Chủ ngữ + 仍然 + động từ/tính từ. ✗ 仍然他没有同意 → ✓ 他仍然没有同意","Hay đi cặp với 就算/尽管/虽然 ở vế trước: 就算在几公里深的海底也仍然能看到东西。","Trước 仍然 có thể thêm 也/都 để nhấn mạnh; sau 仍然 dùng được 能/会/是: 仍然能看到、仍然年轻。","lỗi hay gặp: ✗ 他没有同意仍然 → ✓ 他仍然没有同意"],"e":[["就算在几公里深的海底也仍然能看到东西。","Jiùsuàn zài jǐ gōnglǐ shēn de hǎidǐ yě réngrán néng kàn dào dōngxi.","Cho dù ở đáy biển sâu vài kilômét thì vẫn nhìn thấy được mọi vật. <i>(bài khoá 5)</i>"]],"d":[["只要你不放弃努力，就____有希望。","仍然"],["一个70岁还有梦的老人，仍然年轻，____","一个20岁就放弃了理想的人，心已经老了。"],["尽管这只是一场误会，____","但我们仍然能从中学到很多事情。"],["我又跟我丈夫谈了这件事，他仍然没有同意，____","你再跟他好好儿商量一下。"]],"w":"Bốn từ trong bài luyện rất dễ lẫn: <b>仍然</b> = vẫn (không đổi); <b>竟然</b> = không ngờ lại (四年的大学生活竟然这么快就结束了); <b>既然</b> = đã… thì… (既然不能重新来过，那么就把那些过去的事情放在心里); <b>突然</b> = đột nhiên (不知道，突然加速)."},{"id":"you-you","t":"又……又……","s":"vừa … vừa … (hai tính chất cùng tồn tại)","b":"Dùng 又 + A + 又 + B để nêu <b>hai tính chất/trạng thái cùng có</b> ở một sự vật. A và B thường là tính từ đơn âm tiết hoặc động từ ngắn, và phải <b>cùng chiều nghĩa</b> (cùng khen hoặc cùng chê).","r":["Cấu trúc: 又 + tính từ/động từ + 又 + tính từ/động từ.","Không thêm 很/非常 vào trong cấu trúc: ✗ 又很大又很厚 → ✓ 又大又厚","Hai vế phải cùng sắc thái: ✗ 又便宜又不好看 (một khen một chê) → ✓ 又便宜又好看","Thường làm bổ ngữ trạng thái sau 得: 叶子往往长得又大又厚。"],"e":[["在暖和、水分比较多的地方，叶子往往长得又大又厚。","Zài nuǎnhuo, shuǐfèn bǐjiào duō de dìfang, yèzi wǎngwǎng zhǎng de yòu dà yòu hòu.","Ở những nơi ấm áp, nhiều nước, lá cây thường mọc vừa to vừa dày. <i>(bài khoá 4)</i>"],["在阳光特别厉害、水分少的地方，叶子就会长得又细又长。","Zài yángguāng tèbié lìhai, shuǐfèn shǎo de dìfang, yèzi jiù huì zhǎng de yòu xì yòu cháng.","Ở những nơi nắng gắt, ít nước, lá cây lại mọc vừa mảnh vừa dài. <i>(bài khoá 4)</i>"]],"d":[["你们有时间的话多帮帮小王，他手里的工作又多又难。____","一个人实在干不完。"]],"w":"又……又…… tả <b>tính chất</b> cùng tồn tại; 一边……一边…… tả <b>hai hành động</b> làm song song (一边吃饭一边看电视). Không dùng 又吃饭又看电视 cho hành động đang diễn ra."},{"id":"zhiyao-jiu","t":"只要……，就……","s":"chỉ cần … là …","b":"只要 nêu <b>điều kiện đủ</b>: chỉ cần có điều kiện này thì kết quả ở vế sau xảy ra. 就 <b>bắt buộc</b> đứng ở vế sau, ngay trước động từ.","r":["Cấu trúc: 只要 + điều kiện，(chủ ngữ) + 就 + kết quả.","Hai vế cùng chủ ngữ → 只要 đứng sau chủ ngữ; khác chủ ngữ → 只要 đứng trước chủ ngữ vế 1.","Không được bỏ 就: ✗ 只要花点儿时间教它，它能学会 → ✓ 只要稍微花点儿时间教教它，它就能学会","Vế sau thường dùng 就能/就会/就有: 只要你不放弃努力，就仍然有希望。"],"e":[["狗是很聪明的动物，只要稍微花点儿时间教教它，他就能学会很多东西。","Gǒu shì hěn cōngming de dòngwù, zhǐyào shāowēi huā diǎnr shíjiān jiāojiao tā, tā jiù néng xuéhuì hěn duō dōngxi.","Chó là loài vật rất thông minh, chỉ cần bỏ ra chút thời gian dạy nó là nó học được rất nhiều thứ. <i>(bài khoá 2)</i>"]],"d":[["只要你不放弃努力，就____有希望。你总会找到一条合适的路，通往成功的目的地。","仍然"]],"w":"Phân biệt: 只要……就…… = điều kiện <b>đủ</b> (chỉ cần… là được, giọng lạc quan); 只有……才…… = điều kiện <b>duy nhất, bắt buộc</b> (chỉ khi… mới…). ✗ 只要努力才能成功 → ✓ 只要努力就能成功 / 只有努力才能成功."},{"id":"yi-jiu","t":"一……，就……","s":"vừa … thì …; hễ … là …","b":"Diễn tả việc thứ hai xảy ra <b>ngay sau</b> việc thứ nhất, hoặc một <b>quy luật lặp lại</b>. 一 và 就 đều là phó từ nên phải đứng <b>trước động từ</b>, không đứng trước chủ ngữ.","r":["Cấu trúc: (S1) 一 + V1，(S2) 就 + V2. Hai vế có thể cùng hoặc khác chủ ngữ.","Vị trí: ✗ 风一刮，就草地上有黄叶 → ✓ 风一刮，草地上就会有一层厚厚的黄叶","Nếu việc đã xảy ra rồi thì vế sau thêm 了: 听你这么一说，我现在也想养一只狗了。","一 ở đây không phải số từ “một”, không đọc thành 一次."],"e":[["风一刮，草地上就会有一层厚厚的黄叶。","Fēng yì guā, cǎodì shang jiù huì yǒu yì céng hòuhòu de huáng yè.","Gió vừa thổi một cái là trên bãi cỏ lại có một lớp lá vàng dày. <i>(bài khoá 1)</i>"],["听你这么一说，我现在也想养一只狗了。","Tīng nǐ zhème yì shuō, wǒ xiànzài yě xiǎng yǎng yì zhī gǒu le.","Nghe cậu nói vậy, giờ tớ cũng muốn nuôi một con chó rồi. <i>(bài khoá 2)</i>"]],"d":[],"w":"Đừng nhầm với 一边……一边…… (làm song song). 一……就…… nhấn mạnh <b>trước sau nối tiếp rất nhanh</b>."},{"id":"bujin-ye","t":"不仅……，也/还……","s":"không chỉ … mà (…) cũng / còn …","b":"Cấu trúc tăng tiến giống 不但……而且……, nhưng <b>trang trọng hơn</b>, rất hay mở đầu bài đọc. Khi hai vế nói về <b>hai chủ thể khác nhau</b>, vế sau thường dùng 也.","r":["Khác chủ ngữ → 不仅 đứng TRƯỚC chủ ngữ vế 1: 不仅社会上的人与人之间有竞争，森林里的各种植物之间也有竞争。","Cùng chủ ngữ → 不仅 đứng SAU chủ ngữ: 他不仅会说汉语，还会说英语。","Vế sau bắt buộc có từ hô ứng 也/还/而且, không được để trống: ✗ 不仅人有竞争，植物有竞争 → ✓ …植物之间也有竞争","不仅 = 不但, dùng thay nhau được trong hầu hết trường hợp."],"e":[["不仅社会上的人与人之间有竞争，森林里的各种植物之间也有竞争，这一点儿也不奇怪。","Bùjǐn shèhuì shang de rén yǔ rén zhījiān yǒu jìngzhēng, sēnlín li de gè zhǒng zhíwù zhījiān yě yǒu jìngzhēng, zhè yìdiǎnr yě bù qíguài.","Không chỉ giữa người với người trong xã hội mới có cạnh tranh, giữa các loài cây trong rừng cũng có cạnh tranh, điều này chẳng có gì lạ cả. <i>(bài khoá 4)</i>"]],"d":[],"w":"Chú ý cụm 一点儿也不 + tính từ = “chẳng … chút nào”: 这一点儿也不奇怪 / 不是一点儿声音也没有. 一点儿 phải đứng trước 也/都 + 不/没有."},{"id":"que","t":"……，(然而)却……","s":"nhưng lại, thế mà lại (chuyển ý)","b":"却 là <b>phó từ</b> chỉ sự chuyển ý, khác với 但是/可是 là liên từ. Vì vậy 却 <b>không đứng đầu câu</b> mà đứng <b>sau chủ ngữ, trước động từ/tính từ</b> của vế sau.","r":["Vị trí: (虽然/然而) …，Chủ ngữ + 却 + động từ/tính từ. ✓ 虽然小，但用处却很大","Có thể dùng chung với 但是/然而 trong cùng một câu (khác tiếng Việt, không coi là thừa).","却 không nối hai danh từ, chỉ đứng trong vế câu.","lỗi hay gặp: ✗ 海底非常安静，却不是一点儿声音也没有的却 → ✓ 海洋底部看上去非常安静，然而却不是一点儿声音也没有"],"e":[["科学研究发现，海洋底部看上去非常安静，然而却不是一点儿声音也没有。","Kēxué yánjiū fāxiàn, hǎiyáng dǐbù kàn shangqu fēicháng ānjìng, rán'ér què bú shì yìdiǎnr shēngyīn yě méiyǒu.","Nghiên cứu khoa học phát hiện, đáy đại dương nhìn thì rất yên tĩnh, nhưng thực ra không phải là không có một chút âm thanh nào. <i>(bài khoá 5)</i>"]],"d":[],"w":"So sánh vị trí: 但是 đứng <b>đầu vế</b> (但是用处很大), 却 đứng <b>giữa vế</b>, sau chủ ngữ (用处却很大). ✗ 却用处很大 khi trước đó chưa có chủ ngữ."},{"id":"gan-dong-tu","t":"干 (gàn)","s":"Làm (việc gì) — động từ khẩu ngữ, thay cho 做","b":"<b>干 (gàn)</b> là <b>động từ</b>, nghĩa là “làm (việc)”, chỉ việc bắt tay vào một nghề nghiệp, công việc hay hoạt động nào đó. Đây là cách nói <b>khẩu ngữ</b>, dùng thay cho 做: 干什么 (làm gì), 干工作 (làm việc), 好好儿干 (làm cho tốt). Chú ý cùng chữ này khi đọc <b>gān</b> lại là <b>tính từ</b> “khô” (擦干 lau khô), và <b>干(儿) gānr</b> là <b>danh từ</b> chỉ thực phẩm đã phơi/sấy khô (牛肉干儿 khô bò).","r":["干 + tân ngữ chỉ việc: 干什么、干工作、干活儿。Không dùng 干 với tân ngữ chỉ người hay đồ vật cụ thể: ✗ 干作业 → ✓ 做作业。","Rất hay dùng trong câu hỏi 干什么？ = “làm gì thế?”, thân mật hơn 做什么？","Có bổ ngữ trình độ thì dùng 得: 新来的服务员干得很不错。","Đọc gān thì là tính từ “khô”, thường làm bổ ngữ kết quả: 先把头发擦干，别感冒了。 ✗ 把头发擦gàn。"],"e":[["每次你让它干什么，它就像能听懂你的话一样去做。","Měi cì nǐ ràng tā gàn shénme, tā jiù xiàng néng tīngdǒng nǐ de huà yíyàng qù zuò.","Mỗi lần cậu bảo nó làm gì, nó làm y như thể hiểu được lời cậu nói vậy. <i>(bài khoá 2)</i>"],["干工作的时候一定要认真、仔细，否则就很容易出问题。","Gàn gōngzuò de shíhou yídìng yào rènzhēn, zǐxì, fǒuzé jiù hěn róngyì chū wèntí.","Khi làm việc nhất định phải nghiêm túc, tỉ mỉ, nếu không thì rất dễ xảy ra vấn đề."],["谢谢您，我一定会好好儿干的。","Xièxie nín, wǒ yídìng huì hǎohāor gàn de.","Cảm ơn ông, cháu nhất định sẽ làm thật tốt ạ."]],"d":[["A：你在________什么呢？要我帮忙吗？B：我想在这面墙上挂一张中国地图。","干"],["新来的服务员________得很不错，来吃饭的客人都十分满意。","干"],["你们有时间的话多帮帮小王，他手里的工作又多又难，一个人________不完。","干"]],"w":"Đừng lẫn ba cách dùng của cùng một chữ 干: gàn (động từ, làm) — 你在干什么？; gān (tính từ, khô) — 头发擦干了; gānr (danh từ, đồ khô) — 这牛肉干儿味道真不错。Nghe thanh điệu và nhìn vị trí trong câu để phân biệt."}],"notes":"1) Slide 51 và slide 61 chỉ chứa câu hỏi đọc hiểu (植物之间会竞争吗？它们会为了什么而竞争？/ 海洋在地球上占多大比例？海底世界里有什么？…) nên KHÔNG tính là bài khoá. 2) Slide 53, 63, 64 thực chất là câu bài tập 练一练 (这本小说就_____十几页了 → 剩；每当后面汽车的灯光_____到它时 → 照；既然知道是你错了…；四年的大学生活_____这么快就结束了 → 竟然) chứ không phải 课文, đã loại khỏi phần texts và chuyển vào phần drill của các điểm ngữ pháp/từ mới. 3) Toàn bộ pinyin của các slide 课文 (26, 34, 43, 52, 62) bị xáo trộn thứ tự dòng, thiếu dòng (slide 26 thiếu pinyin cho câu 明天恐怕…?, slide 43 bị cắt “huan xióngmāo”) và có lỗi (yóu lǜ, shú xi, gān shénme, tīng bú dào, dōng xī…), nên pinyin trong file này đã được đánh lại toàn bộ theo chuẩn có dấu thanh. 4) Giữ nguyên vài chỗ in sai trong slide, không tự sửa nội dung: bài khoá 2 “他就能学会很多东西” (đúng ra là 它) và “一遍一遍地交给它” (đúng ra là 教); bài khoá 3 “他们数量不多” (đúng ra là 它们). Riêng dấu 、 giữa 熊猫 và 老虎 ở bài khoá 3 được thêm vào vì bản pinyin của slide có ghi rõ “mǎ、xióngmāo、lǎohǔ”. 5) Slide 52 và slide 62 không có tiêu đề trên giáo trình; tiêu đề tiếng Trung ghi trong file chỉ là nhãn mô tả do người soạn đặt để dễ tra, đã ghi rõ “（slide 52，无标题）”. 6) Không có slide 语言点 dạng chữ; 9 điểm ngữ pháp được suy ra từ drills (倒是, 趟/次/遍, 为了……而……, 仍然 vs 竟然/既然/突然, 又……又……, 只要……就……) và từ cấu trúc nổi bật trong bài khoá (一……就……, 不仅……也……, 却). 7) Đáp án các drill được ghi đúng theo dữ liệu slide; riêng câu “西红柿鸡蛋汤的做法很简单，我保证你一____就能学会” slide không cho đáp án rõ ràng (chỉ có nhãn “句子”), đáp án 遍 là suy ra theo ngữ pháp.","order":[{"z":"你看天上的云，今天肯定有大雨。","t":["你","看","天上","的","云","今天","肯定","有","大雨"],"v":"Cậu xem mây trên trời kìa, hôm nay chắc chắn có mưa to. Vả lại, trên Hương Sơn người đi ngắm lá đỏ đông quá. Hôm khác mình đi Trườ"},{"z":"再说，香山上看红叶的人太多了。","t":["再说","香山","上","看","红叶","的","人太多","了"],"v":"Cậu xem mây trên trời kìa, hôm nay chắc chắn có mưa to. Vả lại, trên Hương Sơn người đi ngắm lá đỏ đông quá. Hôm khác mình đi Trườ"},{"z":"真可惜，我还想多照点儿香山的照片呢。","t":["真","可惜","我","还","想","多照","点儿","香山","的","照片","呢"],"v":"Tiếc thật, tớ còn muốn chụp thêm mấy tấm ảnh Hương Sơn nữa chứ. Đi Trường Thành thì cũng là một ý hay đấy, vậy mai mình đi nhé."},{"z":"明天恐怕也不行，明天是我爸的生日。","t":["明天","恐怕","也","不行","明天","是","我","爸","的","生日"],"v":"Mai e là cũng không được, mai là sinh nhật bố tớ."},{"z":"没关系，那我们再约时间。","t":["没关系","那","我们","再","约","时间"],"v":"Không sao, vậy mình hẹn lại dịp khác."},{"z":"听你这么一说，我现在也想养一只狗了。","t":["听","你","这么","一说","我","现在","也","想养","一只","狗","了"],"v":"Nghe cậu nói vậy, giờ tớ cũng muốn nuôi một con chó rồi. Mỗi lần cậu bảo nó làm gì, nó làm y như thể hiểu được lời cậu nói vậy. Cậ"},{"z":"你教它是不是用了什么特别的方法？","t":["你","教","它","是不是","用","了","什么","特别","的","方法"],"v":"Nghe cậu nói vậy, giờ tớ cũng muốn nuôi một con chó rồi. Mỗi lần cậu bảo nó làm gì, nó làm y như thể hiểu được lời cậu nói vậy. Cậ"},{"z":"看来没有想的那么容易。","t":["看来","没有","想","的","那么","容易"],"v":"Xem ra không dễ như mình tưởng."},{"z":"在你心里难受的时候，它会一直陪着你。","t":["在","你","心里","难受","的","时候","它会","一直","陪","着","你"],"v":"Chó là bạn tốt của chúng ta, nó hiểu được lời người nói, hiểu được tâm trạng của con người. Lúc trong lòng bạn y":"Zhè běn shū xiě de shì shàng ge shìjì de gùshi.","ev":"Cuốn sách này viết về câu chuyện của thế kỷ trước."},{"h":"邮局","p":"yóujú","v":"Bưu điện","ez":"邮局就在银行旁边，很好找。","ey":"Yóujú jiù zài yínháng pángbiān, hěn hǎo zhǎo.","ev":"Bưu điện ngay cạnh ngân hàng, rất dễ tìm."},{"h":"收","p":"shōu","v":"Nhận","ez":"妈妈收到了我从北京寄的礼物。","ey":"Māma shōudào le wǒ cóng Běijīng jì de lǐwù.","ev":"Mẹ đã nhận được món quà tôi gửi từ Bắc Kinh."},{"h":"网站","p":"wǎngzhàn","v":"Trang web","ez":"这个网站上有很多免费的电影。","ey":"Zhège wǎngzhàn shang yǒu hěn duō miǎnfèi de diànyǐng.","ev":"Trang web này có rất nhiều phim miễn phí."}]],"texts":[{"no":1,"tz":"王静给孙月推荐一本书","tv":"Vương Tĩnh giới thiệu cho Tôn Nguyệt một cuốn sách","lines":[{"s":"孙月","z":"上次女儿问我飞机是怎么起飞和降落的，真不知道该怎么回答她，她现在总是有各种各样的“为什么”。","p":"Shàng cì nǚ'ér wèn wǒ fēijī shì zěnme qǐfēi hé jiàngluò de, zhēn bù zhīdào gāi zěnme huídá tā, tā xiànzài zǒngshì yǒu gèzhǒng gèyàng de “wèi shénme”.","v":"Lần trước con gái hỏi tôi máy bay cất cánh và hạ cánh như thế nào, tôi thật chẳng biết trả lời con ra sao. Bây giờ con bé lúc nào cũng có đủ thứ câu hỏi “vì sao”."},{"s":"王静","z":"孩子眼中的世界是美丽和奇特的。","p":"Háizi yǎn zhōng de shìjiè shì měilì hé qítè de.","v":"Thế giới trong mắt trẻ con vừa đẹp đẽ vừa kỳ lạ mà."},{"s":"王静","z":"有一本书叫《新十万个为什么》，现在卖得非常火。","p":"Yǒu yì běn shū jiào 《Xīn Shíwàn ge Wèishénme》, xiànzài mài de fēicháng huǒ.","v":"Có một cuốn sách tên là《Mười vạn câu hỏi vì sao mới》, bây giờ bán rất chạy."},{"s":"王静","z":"书里的内容都是儿童想知道的科学知识，相信你女儿一定喜欢读。","p":"Shū lǐ de nèiróng dōu shì értóng xiǎng zhīdào de kēxué zhīshi, xiāngxìn wǒ nǚ'ér yídìng xǐhuān dú.","v":"Nội dung trong sách đều là kiến thức khoa học mà trẻ con muốn biết, tôi tin là con gái tôi nhất định thích đọc."},{"s":"孙月","z":"难道它和我们小时候看的《十万个为什么》不一样吗？作者是谁啊？","p":"Nándào tā hé wǒmen xiǎoshíhou kàn de 《Shíwàn ge Wèishénme》 bù yíyàng ma? Zuòzhě shì shéi a?","v":"Chẳng lẽ nó khác với cuốn《Mười vạn câu hỏi vì sao》mà hồi nhỏ bọn mình đọc sao? Tác giả là ai vậy?"},{"s":"王静","z":"作者的名字我没记住。","p":"Zuòzhě de míngzi wǒ méi jì zhù.","v":"Tên tác giả thì tôi không nhớ."},{"s":"王静","z":"《新十万个为什么》的内容更新，介绍了各种科学知识，包括地球、动物、植物、交通、科学技术、社会和文化等很多方面。","p":"《Xīn Shíwàn ge Wèishénme》de nèiróng gèng xīn, jièshào le gèzhǒng kēxué zhīshi, bāokuò dìqiú, dòngwù, zhíwù, jiāotōng —— kēxué jìshù, shèhuì hé wénhuà děng hěn duō fāngmiàn.","v":"Nội dung của《Mười vạn câu hỏi vì sao mới》mới hơn, giới thiệu đủ loại kiến thức khoa học, bao gồm trái đất, động vật, thực vật, giao thông — kỹ thuật khoa học, xã hội và văn hoá, rất nhiều phương diện."},{"s":"孙月","z":"太好了！不过她这么小，我不知道她是否能读懂。","p":"Tài hǎo le! Búguò tā zhème xiǎo, wǒ bù zhīdào tā shìfǒu néng dú dǒng.","v":"Hay quá! Nhưng con bé còn nhỏ thế, tôi không biết nó có đọc hiểu được hay không."},{"s":"王静","z":"放心吧，这本书的语言简单易懂，一定能增长孩子的科学知识。","p":"Fàngxīn ba, zhè běn shū de yǔyán jiǎndān yì dǒng, yídìng néng zēngzhǎng háizi de kēxué zhīshi.","v":"Yên tâm đi, ngôn ngữ của cuốn sách này đơn giản dễ hiểu, chắc chắn giúp trẻ mở mang kiến thức khoa học."}]},{"no":2,"tz":"李老师和高老师在聊电脑和互联网技术的发展","tv":"Thầy Lý và thầy Cao trò chuyện về sự phát triển của máy tính và Internet","lines":[{"s":"李老师","z":"现在的大学生一遇到不明白的问题，可以马上在网上查找答案，几秒钟就把问题解决了，这比我们上学的时候方便多了。","p":"Xiànzài de dàxuéshēng yí yù dào bù míngbai de wèntí, kěyǐ mǎshàng zài wǎngshàng cházhǎo dá'àn, jǐ miǎo zhōng jiù bǎ wèntí jiějué le, zhè bǐ wǒmen shàngxué de shíhou fāngbiàn duō le.","v":"Sinh viên bây giờ hễ gặp vấn đề không hiểu là có thể lên mạng tra đáp án ngay, chỉ vài giây là giải quyết xong, tiện hơn hồi chúng ta đi học nhiều."},{"s":"高老师","z":"现在的人们，尤其是大学生开始普遍使用电脑，他们的生活已经离不开电脑。","p":"Xiànzài de rénmen, yóuqí shì dàxuéshēng kāishǐ pǔbiàn shǐyòng diànnǎo, tāmen de shēnghuó yǐjīng lí bù kāi diànnǎo.","v":"Người bây giờ, nhất là sinh viên, đã bắt đầu dùng máy tính phổ biến, cuộc sống của họ không thể tách rời máy tính nữa."},{"s":"高老师","z":"据调查，70%的人遇到问题时，首先想到的就是上网找答案。","p":"Jù diàochá, bǎi fēn zhī qīshí de rén yù dào wèntí shí, shǒuxiān xiǎng dào de jiù shì shàngwǎng zhǎo dá'àn.","v":"Theo khảo sát, 70% số người khi gặp vấn đề, việc đầu tiên nghĩ tới chính là lên mạng tìm đáp án."},{"s":"李老师","z":"电脑和互联网技术的发展使学生们的学习方式发生了很多变化，不过天天对着电脑看，眼睛实在受不了。","p":"Diànnǎo hé hùliánwǎng jìshù de fāzhǎn shǐ xuéshēngmen de xuéxí fāngshì fāshēng le hěn duō biànhuà, búguò tiāntiān duì zhe diànnǎo kàn, yǎnjing shízài shòu bu liǎo.","v":"Sự phát triển của máy tính và công nghệ Internet khiến cách học của sinh viên thay đổi rất nhiều, nhưng ngày nào cũng dán mắt vào máy tính thì mắt thật sự chịu không nổi."},{"s":"高老师","z":"不仅是学习方式，而且连生活方式也发生了很大改变。","p":"Bùjǐn shì xuéxí fāngshì, érqiě lián shēnghuó fāngshì yě fāshēng le hěn dà gǎibiàn.","v":"Không chỉ cách học, mà ngay cả cách sống cũng đã thay đổi rất lớn."},{"s":"高老师","z":"现在越来越多的学生喜欢在网上写日记，他们说这样可以让朋友及时了解自己的生活。","p":"Xiànzài yuè lái yuè duō de xuéshēng xǐhuān zài wǎngshàng xiě rìjì, tāmen shuō xiànzài kěyǐ ràng péngyou jíshí liǎojiě zìjǐ de shēnghuó.","v":"Bây giờ ngày càng nhiều sinh viên thích viết nhật ký trên mạng, họ nói làm vậy bạn bè có thể kịp thời biết được cuộc sống của mình."},{"s":"李老师","z":"这个办法不错，既能方便大家的交流，还能节约用纸，保护环境。","p":"Zhège bànfǎ búcuò, jì néng fāngbiàn dàjiā de jiāoliú, hái néng jiéyuē yòng zhǐ, bǎohù huánjìng.","v":"Cách này cũng hay, vừa tiện cho mọi người giao lưu, lại tiết kiệm giấy, bảo vệ môi trường."},{"s":"李老师","z":"但是如果别人都能看到我的日记的话，多不安全啊！","p":"Dànshì rúguǒ biéren dōu néng kàn dào wǒ de rìjì dehuà, duō bù ānquán a!","v":"Nhưng nếu ai cũng xem được nhật ký của tôi thì mất an toàn biết bao!"},{"s":"高老师","z":"放心吧，可以给网上的日记加密码，那样只有得到了允许，别人才能看到。","p":"Fàngxīn ba, kěyǐ gěi wǎngshàng de rìjì jiā mìmǎ, nàyàng zhǐyǒu dédào le yǔnxǔ, biéren cái néng kàn dào.","v":"Yên tâm đi, có thể đặt mật mã cho nhật ký trên mạng, như vậy chỉ khi được cho phép người khác mới xem được."}]},{"no":3,"tz":"王静和孙月在聊关于梦的情况","tv":"Vương Tĩnh và Tôn Nguyệt nói chuyện về giấc mơ","lines":[{"s":"王静","z":"我昨天晚上做了一个特别奇怪的梦，梦到自己正在一座桥上走，走着走着，突然开过来一辆车，非常危险，接着又梦见我跳到车上，跟警察一起抓住了一个坏人。","p":"Wǒ zuótiān wǎnshang zuò le yí ge tèbié qíguài de mèng, mèng dào zìjǐ zhèngzài yí zuò qiáo shàng zǒu, zǒu zhe zǒu zhe, tūrán kāi guò lái yí liàng chē, fēicháng wēixiǎn, jiēzhe yòu mèngjiàn wǒ tiào dào chē shàng, gēn jǐngchá yìqǐ zhuā zhù le yí ge huàirén.","v":"Tối qua tôi nằm mơ một giấc mơ rất kỳ lạ, mơ thấy mình đang đi trên một cây cầu, đi được một lúc thì đột nhiên có chiếc xe lao tới, rất nguy hiểm; ngay sau đó lại mơ thấy tôi nhảy lên xe, cùng cảnh sát bắt được một kẻ xấu."},{"s":"孙月","z":"奇怪，你怎么总能记住自己做了什么梦？我好像从来没做过梦。","p":"Qíguài, nǐ zěnme zǒng néng jì zhù zìjǐ zuò le shénme mèng? Wǒ hǎoxiàng cónglái méi zuò guò mèng.","v":"Lạ thật, sao cậu lúc nào cũng nhớ được mình mơ thấy gì vậy? Tôi thì hình như chưa bao giờ nằm mơ."},{"s":"王静","z":"每个人都会做梦，区别只是有多有少。","p":"Měi ge rén dōu huì zuò mèng, qūbié zhǐshì yǒu duō yǒu shǎo.","v":"Ai cũng nằm mơ cả, khác nhau chỉ là mơ nhiều hay mơ ít thôi."},{"s":"王静","z":"有的人睡醒之后还记得梦里的事情，有的人却记不清楚了。","p":"Yǒu de rén shuì xǐng zhīhòu hái jìde mèng lǐ de shìqing, yǒu de rén què jì bù qīngchu le.","v":"Có người ngủ dậy vẫn nhớ được chuyện trong mơ, có người thì lại chẳng nhớ rõ nữa."},{"s":"王静","z":"你之所以觉得从来没做过梦，只不过是忘记了。","p":"Nǐ zhīsuǒyǐ juéde cónglái méi zuò guò mèng, zhǐ búguò shì wàngjì le.","v":"Sở dĩ cậu thấy mình chưa bao giờ nằm mơ, chẳng qua là vì cậu quên mất thôi."},{"s":"孙月","z":"你说的有道理，我一般都是一觉睡到天亮。","p":"Nǐ shuō de yǒu dàolǐ, wǒ yìbān dōu shì yí jiào shuì dào tiān liàng.","v":"Cậu nói cũng có lý, tôi thường là ngủ một mạch tới sáng."},{"s":"孙月","z":"很多人认为做梦是上天要告诉他们将来会发生的一些事情，可能上天不想让我知道吧。","p":"Hěn duō rén rènwéi zuò mèng shì shàngtiān yào gàosu tāmen jiānglái huì fāshēng de yìxiē shìqing, kěnéng shàngtiān bù xiǎng ràng wǒ zhīdào ba.","v":"Nhiều người cho rằng nằm mơ là ông trời muốn báo cho họ biết vài chuyện sẽ xảy ra sau này, chắc ông trời không muốn cho tôi biết đấy mà."},{"s":"王静","z":"一般晚上睡觉时，身体感觉到什么，人就容易梦到什么内容。","p":"Yìbān wǎnshang shuìjiào shí, shēntǐ gǎnjué dào shénme, rén jiù róngyì mèng dào shénme.","v":"Thường thì ban đêm khi ngủ, cơ thể cảm thấy gì thì người ta dễ mơ thấy cái đó."},{"s":"王静","z":"记得有一次，我晚饭吃得太咸，那天晚上就梦见自己到处找商店买矿泉水。","p":"Jìde yǒu yí cì, wǒ wǎnfàn chī de tài xián, nà tiān wǎnshang jiù mèngjiàn zìjǐ dàochù zhǎo shāngdiàn mǎi kuàngquánshuǐ.","v":"Nhớ có một lần bữa tối tôi ăn mặn quá, đêm đó liền mơ thấy mình chạy khắp nơi tìm cửa hàng mua nước suối."},{"s":"孙月","z":"很多人都试着对梦进行解释，有些人甚至专门写过这方面的书，可惜到现在仍然没有一个科学的说法。","p":"Hěn duō rén dōu shì zhe duì mèng jìnxíng jiěshì, yǒuxiē rén shènzhì zhuānmén xiě guò zhè fāngmiàn de shū, kěxī dào xiànzài réngrán méiyǒu yí ge kēxué de shuōfa.","v":"Nhiều người đã thử giải thích về giấc mơ, thậm chí có người còn viết hẳn sách về mặt này, tiếc là đến giờ vẫn chưa có một cách lý giải khoa học nào."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"现在手机不但价格降低了，而且作用也越来越大，打电话、发短信已经成了人们普遍使用的联系方法。","p":"Xiànzài shǒujī búdàn jiàgé jiàngdī le, érqiě zuòyòng yě yuè lái yuè dà, dǎ diànhuà, fā duǎnxìn yǐjīng chéng le rénmen pǔbiàn shǐyòng de liánxì fāngfǎ.","v":"Điện thoại bây giờ không những giá đã rẻ đi mà công dụng cũng ngày càng lớn, gọi điện, nhắn tin đã trở thành cách liên lạc mà mọi người dùng phổ biến."},{"s":"","z":"除此以外，你还可以用它来听音乐、看电影、阅读、玩儿游戏、付款购物等，这大大方便了人们的生活。","p":"Chú cǐ yǐwài, nǐ hái kěyǐ yòng tā lái tīng yīnyuè, kàn diànyǐng, yuèdú, wánr yóuxì, fùkuǎn gòuwù děng, zhè dàdà fāngbiàn le rénmen de shēnghuó.","v":"Ngoài ra, bạn còn có thể dùng nó để nghe nhạc, xem phim, đọc sách, chơi game, trả tiền mua sắm v.v., điều đó khiến cuộc sống của mọi người tiện lợi hơn rất nhiều."},{"s":"","z":"举一个例子，迷路时，只要用手机地图查一下地址，马上就能知道怎么去那个地点。","p":"Jǔ yí ge lìzi, mílù shí, zhǐyào yòng shǒujī dìtú chá yíxià dìzhǐ, mǎshàng jiù néng zhīdào zěnme qù nàge dìdiǎn.","v":"Nêu một ví dụ: khi lạc đường, chỉ cần dùng bản đồ trên điện thoại tra địa chỉ là biết ngay cách đi tới địa điểm đó."},{"s":"","z":"现在的手机更像是一部可以拿在手中的电脑，现代人的生活已经越来越离不开手机了。","p":"Xiànzài de shǒujī gèng xiàng shì yí bù kěyǐ ná zài shǒu zhōng de diànnǎo, xiàndài rén de shēnghuó yǐjīng yuè lái yuè lí bù kāi shǒujī le.","v":"Điện thoại ngày nay giống một chiếc máy tính có thể cầm trên tay hơn, cuộc sống của người hiện đại ngày càng không thể thiếu điện thoại."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"21世纪，我们的生活发生了巨大变化，几千公里以外的国家，以前坐船需要几个月，现在乘坐飞机不过十几个小时。","p":"Èrshíyī shìjì, wǒmen de shēnghuó fāshēng le jùdà biànhuà, jǐ qiān gōnglǐ yǐwài de guójiā, yǐqián zuò chuán xūyào jǐ ge yuè, xiànzài chéngzuò fēijī búguò shí jǐ ge xiǎoshí.","v":"Thế kỷ 21, cuộc sống của chúng ta đã thay đổi to lớn: những nước cách xa mấy nghìn cây số, trước kia đi thuyền phải mất mấy tháng, giờ đi máy bay chẳng qua chỉ hơn chục tiếng đồng hồ."},{"s":"","z":"原来寄信需要好几天，现在连邮局都不用去，只要在家里上网发个电子邮件，用不了一分钟，远处的朋友就能收到，比写信封用的时间都短。","p":"Yuánlái jì xìn xūyào hǎo jǐ tiān, xiànzài lián yóujú dōu bú yòng qù, zhǐyào zài jiā lǐ shàngwǎng fā ge diànzǐ yóujiàn, yòng bu liǎo yì fēnzhōng, yuǎnchù de péngyou jiù néng shōu dào, bǐ xiě xìnfēng yòng de shíjiān dōu duǎn.","v":"Trước kia gửi thư phải mất mấy ngày liền, bây giờ đến bưu điện cũng chẳng cần đi, chỉ cần ở nhà lên mạng gửi một email, chưa đến một phút bạn bè ở xa đã nhận được, còn nhanh hơn cả thời gian ngồi viết bì thư."},{"s":"","z":"以前外地的新闻要几天后才能知道，现在只要打开网站，任何信息都可以在第一时间获得。","p":"Yǐqián wàidì de xīnwén yào jǐ tiān hòu cái néng zhīdào, xiànzài zhǐyào dǎkāi wǎngzhàn, rènhé xìnxī dōu kěyǐ zài dì-yī shíjiān huòdé.","v":"Trước kia tin tức ở nơi khác phải mấy ngày sau mới biết, bây giờ chỉ cần mở trang web là mọi thông tin đều nắm được ngay lập tức."},{"s":"","z":"现代科学技术的发展让世界变得越来越小，所以现在人们都把地球叫作“地球村”。","p":"Xiàndài kēxué jìshù de fāzhǎn ràng shìjiè biàn de yuè lái yuè xiǎo, suǒyǐ xiànzài rénmen dōu bǎ dìqiú jiào zuò “dìqiú cūn”.","v":"Sự phát triển của khoa học kỹ thuật hiện đại khiến thế giới ngày càng nhỏ lại, vì thế bây giờ người ta đều gọi trái đất là “ngôi làng toàn cầu”."}]}],"gram":[{"id":"shi-fou","t":"是否 (= 是不是)","s":"có… hay không","b":"<b>是否</b> là cách nói trang trọng, thiên về văn viết của <b>是不是</b>. Nó đứng <b>trước động từ hoặc tính từ</b>, thường làm tân ngữ cho các động từ như 知道、查、看、关心、决定、说明. Cả cụm 是否…… đóng vai một câu hỏi được lồng trong câu, nên bản thân câu lớn vẫn là câu trần thuật.","r":["Vị trí: chủ ngữ + 是否 + động từ/tính từ (我不知道她是否能读懂).","Vì 是否 đã mang nghĩa nghi vấn nên KHÔNG thêm 吗 ở cuối: ✗ 你是否去吗？ → ✓ 你是否去？","Hay gặp trong thông báo, tin tức, văn bản: 请确认信息是否正确。","Không dùng 是否 để trả lời trống một mình: ✗ — 你去吗？ — 是否。 → ✓ 去 / 不去。"],"e":[["不过她这么小，我不知道她是否能读懂。","Búguò tā zhème xiǎo, wǒ bù zhīdào tā shìfǒu néng dú dǒng.","Nhưng con bé còn nhỏ thế, tôi không biết nó có đọc hiểu được hay không <i>(bài khoá 1)</i>"]],"d":[["麻烦你帮我改签到后天的同一航班_______。","B: 您稍等，我查一下是否还有票。"],["一个人对自己要求是否严格，_______。","A: 对于他离成功的远近有着重要的影响。"],["当我们听到批评时，_______。","C: 应该冷静地想想他们提出的意见和建议是否是对的。"]],"w":"是否 = 是不是 về nghĩa, nhưng 是不是 dùng trong khẩu ngữ và có thể đứng cuối câu (你去，是不是？), còn 是否 thì không."},{"id":"shou-bu-liao","t":"V + 得了 / 不了（受不了、用不了）","s":"chịu nổi / không chịu nổi; chưa đến, không tới (mức)","b":"<b>得了 (deliǎo) / 不了 (buliǎo)</b> là bổ ngữ khả năng, cho biết việc gì đó <b>có làm nổi hay không</b>. <b>受不了</b> = chịu không nổi (nóng, ồn, mệt, bận…), rất hay đứng một mình làm vị ngữ. <b>用不了 + số lượng</b> = không cần đến chừng ấy, chưa tới chừng ấy.","r":["Đối tượng gây khó chịu đặt sau 受不了 hoặc tách ra đứng trước: 我受不了天天加班 / 天天加班，我真受不了。","Dạng khẳng định là 受得了: 这么热的天你受得了吗？","用不了一分钟 = 不到一分钟 (chưa đầy một phút); 用不了 nhấn mạnh 'không cần dùng tới chừng ấy'.","Lỗi hay gặp: ✗ 我不能受这个天气 → ✓ 这种天气我受不了。"],"e":[["不过天天对着电脑看，眼睛实在受不了。","Búguò tiāntiān duì zhe diànnǎo kàn, yǎnjing shízài shòu bu liǎo.","Nhưng ngày nào cũng dán mắt vào máy tính, mắt thật sự chịu không nổi <i>(bài khoá 2)</i>"],["用不了一分钟，远处的朋友就能收到。","Yòng bu liǎo yì fēnzhōng, yuǎnchù de péngyou jiù néng shōu dào.","Chưa đến một phút, bạn bè ở nơi xa đã nhận được <i>(bài khoá 5)</i>"]],"d":[["真受不了了，你桌子上太乱了，找时间好好儿整理一下。_______","B: 好的，我现在就收拾，一定弄得整整齐齐的。"],["开一下窗吧，受不了了，太热了，_______。","C: 是你穿得太多了，把外面那件衣服脱了吧。"],["你怎么又想换工作了？这儿的收入不是挺高的吗？_______","A: 可是我受不了天天加班。"]],"w":"Đừng lẫn 受不了 (không chịu nổi về cảm giác) với 不能 (không được phép). 这儿不能抽烟 = cấm hút thuốc, không phải 'chịu không nổi'."},{"id":"jiezhe-ranhou","t":"接着 / 然后","s":"ngay sau đó / sau đó","b":"Cả hai đều nối hai việc theo thứ tự trước – sau. <b>接着</b> nhấn mạnh việc thứ hai xảy ra <b>nối liền ngay</b>, không đứt quãng, và còn có nghĩa 'tiếp tục việc đang dở'. <b>然后</b> chỉ đơn thuần chỉ trình tự, khoảng cách thời gian giữa hai việc có thể dài.","r":["Khi hai việc xảy ra liên tiếp sát nhau, dùng cả hai đều được: 先买了一件衬衫，接着/然后又买了一条裤子。","Nếu hai việc cách nhau lâu, chỉ dùng 然后: 你先上网看看，多比较比较，然后再做决定。","Nghĩa 'nói/làm tiếp phần còn dở' chỉ có 接着: 我说完了，你接着说吧。(✗ 你然后说吧)","然后 thường đi cặp với 先: 先……，然后……"],"e":[["接着又梦见我跳到车上，跟警察一起抓住了一个坏人。","Jiēzhe yòu mèngjiàn wǒ tiào dào chē shàng, gēn jǐngchá yìqǐ zhuā zhù le yí ge huàirén.","Ngay sau đó lại mơ thấy tôi nhảy lên xe, cùng cảnh sát bắt được một kẻ xấu <i>(bài khoá 3)</i>"]],"d":[["妹妹刚参加工作一年就买了房子_______就结了婚，今年又生了一个小男孩儿，生活得很幸福。","接着 / 然后"],["进了商店，妻子先买了一件衬衫，_______又买了一条裤子。","接着 / 然后"],["我说完了，你_______说吧。","接着"],["你先上网看看吧，多比较比较，_______再做决定。","然后"],["今天的课就到这儿，下节课_______讲这个问题。","接着"]],"w":"接着 có thể mang tân ngữ như một động từ (接着说、接着看), còn 然后 chỉ là liên từ, không bao giờ mang tân ngữ."},{"id":"chu-ci-yi-wai","t":"除此以外（= 除此之外），还/也……","s":"ngoài ra, ngoài điều đó ra","b":"<b>除此以外 / 除此之外</b> đứng ở <b>đầu câu sau</b>, thay cho toàn bộ nội dung vừa nói ở câu trước, rồi bổ sung thêm thông tin mới. Vế sau hầu như luôn có <b>还 / 也</b> để hô ứng.","r":["Cấu trúc: (câu 1). 除此以外，chủ ngữ + 还/也 + …","除此以外 = 除此之外, hoàn toàn thay thế được cho nhau.","Không được bỏ 还/也: ✗ 除此以外，可以听音乐。→ ✓ 除此以外，你还可以听音乐。","Phân biệt với 除了……以外，都…… (loại trừ): 除了他以外，大家都来了 = trừ anh ấy ra thì mọi người đều đến."],"e":[["除此以外，你还可以用它来听音乐、看电影、阅读、玩儿游戏、付款购物等，这大大方便了人们的生活。","Chú cǐ yǐwài, nǐ hái kěyǐ yòng tā lái tīng yīnyuè, kàn diànyǐng, yuèdú, wánr yóuxì, fùkuǎn gòuwù děng, zhè dàdà fāngbiàn le rénmen de shēnghuó.","Ngoài ra, bạn còn có thể dùng nó để nghe nhạc, xem phim, đọc sách, chơi game, trả tiền mua sắm v.v., điều này khiến cuộc sống của mọi người tiện lợi hơn rất nhiều <i>(bài khoá 4)</i>"]],"d":[["骑自行车是一种很好的、锻炼身体的方式，_______。","B: 除此之外，还可以交到很多朋友。"],["冬季皮肤往往容易变得干燥，女性朋友尤其要注意保护皮肤。应该选择保湿的护肤品，_______。","C: 除此之外，还要经常用面膜。"],["你了解顾客的实际需要十分重要。买东西时，顾客当然会考虑它的质量和价格，_______。","A: 除此之外，服务质量也非常重要。"]],"w":"除此以外 chỉ thay cho câu VỪA nói, nên bắt buộc phải có ngữ cảnh phía trước; không dùng nó để mở đầu một đoạn văn."},{"id":"ba-jiao-zuo","t":"把 + A + 叫作 + B","s":"gọi A là B","b":"Đây là câu chữ <b>把</b> dùng để đặt tên/gọi tên: đưa đối tượng A lên trước động từ <b>叫作 (= 叫做)</b>, phía sau là tên gọi B. Chủ ngữ thường là 人们、大家、我们.","r":["Cấu trúc: 人们 + 把 + A + 叫作 + B。B là danh từ/tên gọi, thường để trong ngoặc kép.","叫作 = 叫做, viết cách nào cũng được.","Dạng bị động tương ứng: A 被叫作 B / A 叫作 B。","Lỗi hay gặp: ✗ 人们把地球叫作 → thiếu B; sau 叫作 bắt buộc phải có tên gọi."],"e":[["现代科学技术的发展让世界变得越来越小，所以现在人们都把地球叫作“地球村”。","Xiàndài kēxué jìshù de fāzhǎn ràng shìjiè biàn de yuè lái yuè xiǎo, suǒyǐ xiànzài rénmen dōu bǎ dìqiú jiào zuò “dìqiú cūn”.","Sự phát triển của khoa học kỹ thuật hiện đại khiến thế giới ngày càng nhỏ lại, vì thế bây giờ người ta đều gọi trái đất là “ngôi làng toàn cầu” <i>(bài khoá 5)</i>"]],"d":[["在汉语里，像“海”“河”这些字左边的部分是一样的，_______。","B: 我们把“氵”叫作“三点水”。"],["中国有56个民族，其中汉族人的数量最多，汉族以外的55个民族由于人数较少，_______。","C: 我们把人数较少的民族叫作“少数民族”。"],["东西的质量和价格是有联系的，质量好的东西一般价格也比较高，_______。","A: 人们习惯上把这种情况叫作“一分钱一分货”。"]],"w":"叫作 (gọi là) khác 叫 (kêu, gọi ai đó): 我叫他小王 có thể là 'tôi gọi anh ấy là Tiểu Vương' hoặc 'tôi gọi anh ấy đến'; dùng 叫作 thì chỉ có nghĩa đặt tên."},{"id":"diem-danh-tu","t":"地点 / 特点 / 优点 / 缺点 / 重点","s":"nhóm danh từ có đuôi 点","b":"Năm từ này đều kết thúc bằng <b>点</b> nhưng khác nghĩa hoàn toàn, đề thi HSK4 rất hay cho chọn từ. <b>地点</b> = nơi chốn cụ thể; <b>特点</b> = đặc điểm; <b>优点 / 缺点</b> = ưu điểm / khuyết điểm; <b>重点</b> = trọng điểm, phần quan trọng nhất.","r":["地点 hay đi cùng 时间: 会议的时间和地点已经定了。","特点 nói về tính chất riêng của người/vật: 每个学生的特点都不一样。","优点/缺点 dùng để nhận xét con người hoặc sản phẩm: 他的优点是诚实，缺点是太马虎。","重点 thường làm tân ngữ của 是/说明/介绍: 我只对其中的重点简单说明一下。"],"e":[["举一个例子，迷路时，只要用手机地图查一下地址，马上就能知道怎么去那个地点。","Jǔ yí ge lìzi, mílù shí, zhǐyào yòng shǒujī dìtú chá yíxià dìzhǐ, mǎshàng jiù néng zhīdào zěnme qù nàge dìdiǎn.","Nêu một ví dụ: khi lạc đường, chỉ cần dùng bản đồ trên điện thoại tra địa chỉ là biết ngay cách đi đến địa điểm đó <i>(bài khoá 4)</i>"]],"d":[["现在有个通知，十一月七日上午八点有中国文化研讨会，_______在图书馆三楼会议室，希望大家准时参加。","地点"],["教育学生时，要根据学生的_______选择不同的方法。","特点"],["由于时间限制，这份材料我就不向大家详细介绍了，我只对其中的_______简单说明一下。","重点"],["A: 你对小李的印象怎么样？ B: 他的_______是有礼貌、诚实、能吃苦，_______是太马虎、太粗心了，不适合我们的工作。","优点 / 缺点"]],"w":"Phân biệt 地点 (nơi chốn) với 地址 (địa chỉ, có số nhà, tên đường): 查一下地址 = tra địa chỉ, 去那个地点 = đi tới nơi đó."},{"id":"liang-ci-zuo","t":"量词「座」","s":"lượng từ cho vật to, đứng cố định","b":"<b>座</b> là lượng từ dùng cho những vật <b>to lớn, cố định, có khối</b>: cầu, núi, toà nhà, thành phố, nhà máy. Trong bài khoá dùng cho 桥.","r":["Kết hợp thường gặp: 一座桥、一座山、一座楼、一座城市、一座工厂。","Không dùng 座 cho phương tiện di chuyển: xe dùng 辆 (一辆车), thuyền dùng 条/艘.","Sông, đường, phố dùng 条: 一条河、一条街 (bài khoá 3 và phần 练一练 đều xuất hiện).","Lỗi hay gặp: ✗ 一个桥 → ✓ 一座桥。"],"e":[["我昨天晚上做了一个特别奇怪的梦，梦到自己正在一座桥上走。","Wǒ zuótiān wǎnshang zuò le yí ge tèbié qíguài de mèng, mèng dào zìjǐ zhèngzài yí zuò qiáo shàng zǒu.","Tối qua tôi nằm mơ một giấc mơ rất kỳ lạ, mơ thấy mình đang đi trên một cây cầu <i>(bài khoá 3)</i>"]],"d":[["北京有一_______山，叫香山，非常有名。每到秋天，满山都是红叶，风景特别漂亮。","座"]],"w":"Trong cùng phần 练一练, các chỗ trống khác điền 危险 / 安全 / 迷路 / 咸 — đọc kỹ nghĩa cả câu chứ đừng thấy chỗ trống là điền lượng từ."},{"id":"budan-erqie","t":"不但（不仅）……，而且（连）……也/还……","s":"không những… mà còn…","b":"Cặp liên từ diễn đạt ý <b>tăng tiến</b>: vế sau nói điều mạnh hơn, xa hơn vế trước. <b>不但</b> thiên khẩu ngữ, <b>不仅</b> thiên văn viết. Vế sau thường thêm <b>也 / 还</b>, và có thể lồng thêm <b>连……也</b> để nhấn mạnh.","r":["Hai vế CÙNG chủ ngữ: chủ ngữ đứng TRƯỚC 不但 — 现在手机不但价格降低了，而且作用也越来越大。","Hai vế KHÁC chủ ngữ: mỗi chủ ngữ đứng SAU liên từ — 不但他去，而且我们也去。","Vế sau nên có 也/还 hô ứng, bỏ đi câu sẽ cụt.","Lỗi hay gặp: ✗ 不但现在手机价格降低了，而且作用越来越大。→ ✓ 现在手机不但价格降低了，而且作用也越来越大。"],"e":[["现在手机不但价格降低了，而且作用也越来越大。","Xiànzài shǒujī búdàn jiàgé jiàngdī le, érqiě zuòyòng yě yuè lái yuè dà.","Điện thoại bây giờ không những giá đã rẻ đi mà công dụng cũng ngày càng lớn <i>(bài khoá 4)</i>"],["不仅是学习方式，而且连生活方式也发生了很大改变。","Bùjǐn shì xuéxí fāngshì, érqiě lián shēnghuó fāngshì yě fāshēng le hěn dà gǎibiàn.","Không chỉ cách học, mà ngay cả cách sống cũng đã thay đổi rất nhiều <i>(bài khoá 2)</i>"]],"d":[],"w":"Đừng nhầm với 既……又/还…… (既能方便大家的交流，还能节约用纸 — bài khoá 2): 既……又 chỉ nêu hai đặc điểm SONG SONG, không có ý tăng tiến."},{"id":"zhiyao-jiu","t":"只要……，就……（đối chiếu 只有……，才……）","s":"chỉ cần… là…","b":"<b>只要 A，就 B</b> nêu <b>điều kiện đủ</b>: chỉ cần có A thì chắc chắn có B. Khác với <b>只有 A，才 B</b> nêu <b>điều kiện duy nhất/cần</b>: không có A thì tuyệt đối không có B.","r":["只要 đứng đầu vế điều kiện, 就 đứng trước động từ ở vế kết quả (không đứng trước chủ ngữ).","Vế kết quả có thể dùng 马上就、都可以 thay cho 就: 只要打开网站，任何信息都可以在第一时间获得。","只要……就 = dễ đạt được; 只有……才 = khó, bắt buộc phải có điều kiện đó.","Lỗi hay gặp: ✗ 只要你来，才可以。→ ✓ 只要你来就可以。/ ✓ 只有你来才可以。"],"e":[["迷路时，只要用手机地图查一下地址，马上就能知道怎么去那个地点。","Mílù shí, zhǐyào yòng shǒujī dìtú chá yíxià dìzhǐ, mǎshàng jiù néng zhīdào zěnme qù nàge dìdiǎn.","Khi lạc đường, chỉ cần dùng bản đồ trên điện thoại tra địa chỉ là biết ngay cách đi tới địa điểm đó <i>(bài khoá 4)</i>"],["现在只要打开网站，任何信息都可以在第一时间获得。","Xiànzài zhǐyào dǎkāi wǎngzhàn, rènhé xìnxī dōu kěyǐ zài dì-yī shíjiān huòdé.","Bây giờ chỉ cần mở trang web ra là mọi thông tin đều có thể biết được ngay lập tức <i>(bài khoá 5)</i>"],["那样只有得到了允许，别人才能看到。","Nàyàng zhǐyǒu dédào le yǔnxǔ, biéren cái néng kàn dào.","Như vậy chỉ khi được cho phép thì người khác mới xem được <i>(bài khoá 2)</i>"]],"d":[],"w":"只要 đi với 就, 只有 đi với 才 — không được ghép chéo. Mẹo nhớ: 要–就 (dễ), 有–才 (khó)."}],"notes":"1) Các slide 20, 30, 49 chỉ chứa câu hỏi đọc hiểu (…是什么？/为什么…？) nên đã loại, không tính là bài khoá. 2) Slide 22 (A: 对面那条街上新开了一家理发店…_____还不错) là một câu của phần 练一练 (đáp án: 技术), không phải bài khoá — đã để lại ở phần luyện tập, không ghép vào texts. 3) Hai bài đọc ở slide 59 và slide 71 KHÔNG có tiêu đề trên slide; tiêu đề 短文（一）/短文（二） và phần title_vi là do người soạn đặt để dễ tra, không phải chữ trong giáo trình. 4) Bản pinyin trên slide bị đảo dòng và có lỗi (huái thay cho hái, zēng cháng thay cho zēngzhǎng, yún xǔ thay cho yǔnxǔ, jiě shi thay cho jiěshì) — đã đánh lại pinyin chuẩn cho toàn bộ câu trong texts. 5) Một số đáp án trong 练一练 không được in trên slide (chỗ trống 一___山 → 座; 鸡蛋汤稍微有点儿___ → 咸); đã suy ra từ danh sách từ mới của bài. 6) Câu đầu của một drill trên slide bị lỗi chữ thừa (我各位乘客… , 当开一下窗吧…) — đã bỏ chữ thừa khi đưa vào phần drill. 7) Không có mục need_vi cho bài này. 8) Trong bài khoá 1, slide ghi 王静 nói “相信我女儿一定喜欢读” — giữ nguyên đúng như dữ liệu slide dù ngữ cảnh có vẻ phải là “你女儿”.","order":[{"z":"孩子眼中的世界是美丽和奇特的。","t":["孩子","眼中","的","世界","是","美丽","和","奇特","的"],"v":"Thế giới trong mắt trẻ con vừa đẹp đẽ vừa kỳ lạ mà."},{"z":"有一本书叫《新十万个为什么》，现在卖得非常火。","t":["有","一","本书","叫","新","十万个","为什么","现在","卖得","非常","火"],"v":"Có một cuốn sách tên là《Mười vạn câu hỏi vì sao mới》, bây giờ bán rất chạy."},{"z":"作者的名字我没记住。","t":["作者","的","名字","我","没","记住"],"v":"Tên tác giả thì tôi không nhớ."},{"z":"不过她这么小，我不知道她是否能读懂。","t":["不过","她","这么","小","我","不","知道","她","是否","能","读懂"],"v":"Hay quá! Nhưng con bé còn nhỏ thế, tôi không biết nó có đọc hiểu được hay không."},{"z":"奇怪，你怎么总能记住自己做了什么梦？","t":["奇怪","你","怎么","总能","记住","自己","做","了","什么","梦"],"v":"Lạ thật, sao cậu lúc nào cũng nhớ được mình mơ thấy gì vậy? Tôi thì hình như chưa bao giờ nằm mơ."},{"z":"我好像从来没做过梦。","t":["我","好像","从来","没","做","过","梦"],"v":"Lạ thật, sao cậu lúc nào cũng nhớ được mình mơ thấy gì vậy? Tôi thì hình như chưa bao giờ nằm mơ."},{"z":"每个人都会做梦，区别只是有多有少。","t":["每个","人","都","会","做梦","区别","只是","有","多","有 :"Chiều mai chúng ta cùng đi đánh cầu lông nhé."},{"h":"场","p":"chǎng","v":"(được dùng cho thể thao hay các hoạt động giải trí…) trận.","ez":"昨天的那场比赛特别精彩。","ey":"Zuótiān de nà chǎng bǐsài tèbié jīngcǎi.","ev":"Trận đấu hôm qua rất hay."},{"h":"禁止","p":"jìnzhǐ","v":"Cấm","ez":"医院里禁止抽烟。","ey":"Yīyuàn li jìnzhǐ chōuyān.","ev":"Trong bệnh viện cấm hút thuốc."},{"h":"座位","p":"zuò wèi","v":"Chỗ ngồi","ez":"车上没有座位了，我们站着吧。","ey":"Chē shang méiyǒu zuòwèi le, wǒmen zhàn zhe ba.","ev":"Trên xe hết chỗ ngồi rồi, mình đứng vậy."}]],"texts":[{"no":1,"tz":"马克申请下个学期继续在学校学习","tv":"Mark xin học tiếp ở trường vào học kỳ sau","lines":[{"s":"马克","z":"老师，您好！我希望下个学期在这里继续学习，请问还需要重新申请吗？","p":"Lǎoshī, nín hǎo! Wǒ xīwàng xià ge xuéqī zài zhèlǐ jìxù xuéxí, qǐngwèn hái xūyào chóngxīn shēnqǐng ma?","v":"Thầy ơi, em chào thầy! Em mong học kỳ sau được tiếp tục học ở đây, cho em hỏi có phải đăng ký lại không ạ?"},{"s":"高老师","z":"是的。给你表格，出生年月、性别、护照号码都要填，还有联系地址、联系电话。","p":"Shì de. Gěi nǐ biǎogé, chūshēng niányuè, xìngbié, hùzhào hàomǎ dōu yào tián, hái yǒu liánxì dìzhǐ, liánxì diànhuà.","v":"Đúng vậy. Đây là tờ khai cho em, ngày tháng năm sinh, giới tính, số hộ chiếu đều phải điền, còn cả địa chỉ liên hệ và số điện thoại liên hệ nữa."},{"s":"马克","z":"真抱歉，我不小心把护照号码填错了，您能再给我一份新的申请表吗？","p":"Zhēn bàoqiàn, wǒ bù xiǎoxīn bǎ hùzhào hàomǎ tián cuò le, nín néng zài gěi wǒ yí fèn xīn de shēnqǐngbiǎo ma?","v":"Thật xin lỗi thầy, em sơ ý điền sai số hộ chiếu mất rồi, thầy cho em xin một tờ đơn mới được không ạ?"},{"s":"高老师","z":"没关系，不用道歉，谁都有粗心填错的时候。申请表都被别人拿走了，我给你重新打印一份，你等一下。","p":"Méi guānxi, búyòng dàoqiàn, shéi dōu yǒu cūxīn tián cuò de shíhou. Shēnqǐngbiǎo dōu bèi biéren ná zǒu le, wǒ gěi nǐ chóngxīn dǎyìn yí fèn, nǐ děng yíxià.","v":"Không sao đâu, em không cần xin lỗi, ai cũng có lúc sơ ý điền nhầm mà. Đơn đăng ký bị người khác lấy hết rồi, thầy in lại cho em một tờ, em đợi một chút nhé."},{"s":"","z":"（高老师打印，马克填表）","p":"(Gāo lǎoshī dǎyìn, Mǎkè tián biǎo)","v":"(Thầy Cao in đơn, Mark điền tờ khai)"},{"s":"马克","z":"这次我按照要求都填写完了，请问还需要做别的事情吗？","p":"Zhè cì wǒ ànzhào yāoqiú dōu tiánxiě wán le, qǐngwèn hái xūyào zuò biéde shìqing ma?","v":"Lần này em đã điền xong hết theo đúng yêu cầu rồi, cho em hỏi còn phải làm gì nữa không ạ?"},{"s":"高老师","z":"请把你的护照给我，我们要把护照复印一下。","p":"Qǐng bǎ nǐ de hùzhào gěi wǒ, wǒmen yào bǎ hùzhào fùyìn yíxià.","v":"Em đưa hộ chiếu cho thầy, bọn thầy cần photo hộ chiếu một bản."}]},{"no":2,"tz":"王静做饺子时手受伤了","tv":"Vương Tĩnh bị thương ở tay khi làm bánh chẻo","lines":[{"s":"李进","z":"呀，你的手怎么流血了？等一下，我给你包起来。","p":"Yā, nǐ de shǒu zěnme liú xiě le? Děng yíxià, wǒ gěi nǐ bāo qǐlai.","v":"Ôi, sao tay em lại chảy máu thế này? Đợi chút, anh băng lại cho."},{"s":"王静","z":"没关系，我想给你做点儿羊肉饺子，刚才用刀切肉的时候把手弄破了。","p":"Méi guānxi, wǒ xiǎng gěi nǐ zuò diǎnr yángròu jiǎozi, gāngcái yòng dāo qiē ròu de shíhou bǎ shǒu nòng pò le.","v":"Không sao đâu, em định làm cho anh ít bánh chẻo nhân thịt dê, lúc nãy dùng dao thái thịt nên làm đứt tay."},{"s":"李进","z":"你也太不小心了，不过好像不太严重，过几天就好了。衣服上也有一点儿血，你把衣服脱下来，我给你洗洗。","p":"Nǐ yě tài bù xiǎoxīn le, búguò hǎoxiàng bú tài yánzhòng, guò jǐ tiān jiù hǎo le. Yīfu shang yě yǒu yìdiǎnr xiě, nǐ bǎ yīfu tuō xiàlai, wǒ gěi nǐ xǐxi.","v":"Em bất cẩn quá đi mất, nhưng có vẻ cũng không nặng lắm, vài hôm là khỏi thôi. Trên áo cũng dính chút máu, em cởi áo ra đi, anh giặt cho."},{"s":"王静","z":"看来今天吃不上羊肉饺子了。","p":"Kànlái jīntiān chī bu shàng yángròu jiǎozi le.","v":"Xem ra hôm nay không được ăn bánh chẻo nhân thịt dê rồi."},{"s":"李进","z":"那我们就吃点儿别的。我常去的那家理发店附近有个餐厅，那里的包子很好吃，我一会儿去买一点儿。","p":"Nà wǒmen jiù chī diǎnr biéde. Wǒ cháng qù de nà jiā lǐfàdiàn fùjìn yǒu ge cāntīng, nàlǐ de bāozi hěn hǎochī, wǒ yíhuìr qù mǎi yìdiǎnr.","v":"Vậy thì mình ăn món khác. Gần tiệm cắt tóc anh hay đến có một quán ăn, bánh bao ở đó rất ngon, lát nữa anh đi mua một ít."},{"s":"王静","z":"好吧，我衣服口袋里有十几块零钱，买包子应该够。","p":"Hǎo ba, wǒ yīfu kǒudài lǐ yǒu shí jǐ kuài língqián, mǎi bāozi yīnggāi gòu.","v":"Được thôi, trong túi áo em có hơn mười đồng tiền lẻ, mua bánh bao chắc là đủ."}]},{"no":3,"tz":"安娜帮助马克练习舞蹈动作","tv":"Anna giúp Mark luyện động tác múa","lines":[{"s":"马克","z":"我早上跟你打招呼，你没看见。想不到又在这儿碰见你了。","p":"Wǒ zǎoshang gēn nǐ dǎ zhāohu, nǐ méi kànjiàn. Xiǎng bu dào yòu zài zhèr pèngjiàn nǐ le.","v":"Sáng nay mình chào cậu mà cậu không thấy. Không ngờ lại gặp cậu ở đây."},{"s":"安娜","z":"真是对不起，我不是故意的，今天早上我忘戴眼镜了，看不清楚。","p":"Zhēnshi duìbuqǐ, wǒ bú shì gùyì de, jīntiān zǎoshang wǒ wàng dài yǎnjìng le, kàn bu qīngchu.","v":"Xin lỗi cậu nhé, mình không cố ý đâu, sáng nay mình quên đeo kính nên nhìn không rõ."},{"s":"马克","z":"刚才我在旁边看到你跳中国舞了，没看出来你跳得这么好！难道你以前在你们国家就学过中国舞蹈吗？","p":"Gāngcái wǒ zài pángbiān kàndào nǐ tiào Zhōngguó wǔ le, méi kàn chūlái nǐ tiào de zhème hǎo! Nándào nǐ yǐqián zài nǐmen guójiā jiù xuéguo Zhōngguó wǔdǎo ma?","v":"Lúc nãy mình đứng bên cạnh xem cậu múa điệu múa Trung Quốc, không nhận ra là cậu múa đẹp đến vậy! Chẳng lẽ hồi trước ở nước cậu, cậu đã học múa Trung Quốc rồi sao?"},{"s":"安娜","z":"我小时候妈妈教我跳过两年的舞，所以稍微有点儿基础。再说，舞蹈不仅是一门艺术，也是一种“语言”，这种语言与国籍无关，无论哪个国家的人都能看懂。","p":"Wǒ xiǎo shíhou māma jiāo wǒ tiàoguo liǎng nián de wǔ, suǒyǐ shāowēi yǒudiǎn jīchǔ. Zàishuō, wǔdǎo bùjǐn shì yì mén yìshù, yě shì yì zhǒng “yǔyán”, zhè zhǒng yǔyán yǔ guójí wúguān, wúlùn nǎge guójiā de rén dōu néng kàndǒng.","v":"Hồi nhỏ mẹ dạy mình múa hai năm, nên cũng hơi có chút nền tảng. Với lại, múa không chỉ là một môn nghệ thuật, mà còn là một thứ “ngôn ngữ”; thứ ngôn ngữ này chẳng liên quan gì đến quốc tịch, người nước nào cũng xem hiểu được."},{"s":"马克","z":"太好了！我刚学习跳这种舞没多久，你帮我看看，我的这个动作对不对。","p":"Tài hǎo le! Wǒ gāng xuéxí tiào zhè zhǒng wǔ méi duōjiǔ, nǐ bāng wǒ kànkan, wǒ de zhège dòngzuò duì bu duì.","v":"Hay quá! Mình mới học múa điệu này chưa được bao lâu, cậu xem giúp mình động tác này có đúng không."},{"s":"安娜","z":"你这个动作做得还是不太标准，我给你跳一遍。你仔细看着，应该像我这样：先抬胳膊，然后抬腿，最后头再向右转一下。","p":"Nǐ zhège dòngzuò zuò de háishi bú tài biāozhǔn, wǒ gěi nǐ tiào yí biàn. Nǐ zǐxì kànzhe, yīnggāi xiàng wǒ zhèyàng: xiān tái gēbo, ránhòu tái tuǐ, zuìhòu tóu zài xiàng yòu zhuǎn yíxià.","v":"Động tác này cậu làm vẫn chưa chuẩn lắm, mình múa cho cậu xem một lượt. Cậu nhìn kỹ nhé, phải làm như mình thế này: trước hết giơ tay lên, sau đó nhấc chân, cuối cùng quay đầu sang phải một chút."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"马克去年租的房子离马路很近，对面有大大小小的商店，周围环境非常吵。","p":"Mǎkè qùnián zū de fángzi lí mǎlù hěn jìn, duìmiàn yǒu dàdà xiǎoxiǎo de shāngdiàn, zhōuwéi huánjìng fēicháng chǎo.","v":"Căn nhà Mark thuê năm ngoái nằm rất gần đường cái, đối diện là các cửa hàng lớn nhỏ, môi trường xung quanh vô cùng ồn ào."},{"s":"","z":"所以，房子还没到期，马克就开始着急换房子了。","p":"Suǒyǐ, fángzi hái méi dàoqī, Mǎkè jiù kāishǐ zháojí huàn fángzi le.","v":"Vì vậy, nhà chưa hết hạn hợp đồng mà Mark đã sốt ruột lo chuyện đổi nhà."},{"s":"","z":"有一天，他在小区门口看到一个租房子的广告。","p":"Yǒu yì tiān, tā zài xiǎoqū ménkǒu kàndào yí ge zū fángzi de guǎnggào.","v":"Một hôm, cậu ấy nhìn thấy một tờ quảng cáo cho thuê nhà ở cổng khu dân cư."},{"s":"","z":"广告上说房子交通方便，周围很安静，厨房很大。","p":"Guǎnggào shang shuō fángzi jiāotōng fāngbiàn, zhōuwéi hěn ānjìng, chúfáng hěn dà.","v":"Trên quảng cáo ghi nhà đi lại thuận tiện, xung quanh rất yên tĩnh, bếp lại rộng."},{"s":"","z":"总的来说，这套房子他很满意，于是他就记下了房东的手机号码。","p":"Zǒng de lái shuō, zhè tào fángzi tā hěn mǎnyì, yúshì tā jiù jì xià le fángdōng de shǒujī hàomǎ.","v":"Nói chung thì căn nhà này cậu ấy rất ưng, thế là cậu ghi lại số di động của chủ nhà."},{"s":"","z":"可回家后打电话，电话总是占线。","p":"Kě huí jiā hòu dǎ diànhuà, diànhuà zǒngshì zhànxiàn.","v":"Nhưng về đến nhà gọi điện thì máy lúc nào cũng bận."},{"s":"","z":"第二天，他路过小区门口时，又仔细看了一下广告，原来在记号码的时候写错了一个数字。","p":"Dì-èr tiān, tā lùguò xiǎoqū ménkǒu shí, yòu zǐxì kàn le yíxià guǎnggào, yuánlái zài jì hàomǎ de shíhou xiě cuò le yí ge shùzì.","v":"Hôm sau, khi đi ngang qua cổng khu dân cư, cậu ấy lại xem kỹ tờ quảng cáo, hoá ra lúc ghi số cậu đã viết sai mất một chữ số."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"很多外国人认为所有中国人都会功夫和乒乓球，其实只是喜爱这两种运动的中国人比较多。","p":"Hěn duō wàiguórén rènwéi suǒyǒu Zhōngguórén dōu huì gōngfu hé pīngpāngqiú, qíshí zhǐshì xǐ'ài zhè liǎng zhǒng yùndòng de Zhōngguórén bǐjiào duō.","v":"Rất nhiều người nước ngoài cho rằng mọi người Trung Quốc đều biết võ thuật và bóng bàn, thực ra chỉ là số người Trung Quốc yêu thích hai môn thể thao này khá đông mà thôi."},{"s":"","z":"中国人特别喜欢打乒乓球，在中国你会发现到处都有乒乓球桌。","p":"Zhōngguórén tèbié xǐhuan dǎ pīngpāngqiú, zài Zhōngguó nǐ huì fāxiàn dàochù dōu yǒu pīngpāngqiú zhuō.","v":"Người Trung Quốc đặc biệt thích chơi bóng bàn, ở Trung Quốc bạn sẽ thấy đâu đâu cũng có bàn bóng bàn."},{"s":"","z":"像乒乓球、羽毛球、跑步等运动对条件要求不高，所以它们都成为人们运动不错的选择。","p":"Xiàng pīngpāngqiú, yǔmáoqiú, pǎobù děng yùndòng duì tiáojiàn yāoqiú bù gāo, suǒyǐ tāmen dōu chéngwéi rénmen yùndòng búcuò de xuǎnzé.","v":"Những môn như bóng bàn, cầu lông, chạy bộ… không đòi hỏi điều kiện cao, nên chúng đều trở thành lựa chọn vận động khá tốt cho mọi người."},{"s":"","z":"人们常说“生命在于运动”，所以很多人一到周末就会到体育馆打几场球。","p":"Rénmen cháng shuō “shēngmìng zàiyú yùndòng”, suǒyǐ hěn duō rén yí dào zhōumò jiù huì dào tǐyùguǎn dǎ jǐ chǎng qiú.","v":"Người ta thường nói “sống là ở vận động”, nên nhiều người cứ đến cuối tuần là ra nhà thi đấu chơi mấy trận bóng."},{"s":"","z":"“乒乓球”这个名字也很有意思，“乒”和“乓”就是打球时发出的声音。","p":"“Pīngpāngqiú” zhège míngzi yě hěn yǒuyìsi, “pīng” hé “pāng” jiùshì dǎ qiú shí fāchū de shēngyīn.","v":"Cái tên “bóng bàn” (pīngpāngqiú) cũng rất thú vị, “pīng” và “pāng” chính là âm thanh phát ra khi đánh bóng."},{"s":"","z":"在看乒乓球比赛时，尤其是在运动员发球的时候，观众要安静，禁止大声讲话或者离开座位随便走动。","p":"Zài kàn pīngpāngqiú bǐsài shí, yóuqí shì zài yùndòngyuán fā qiú de shíhou, guānzhòng yào ānjìng, jìnzhǐ dàshēng jiǎnghuà huòzhě líkāi zuòwèi suíbiàn zǒudòng.","v":"Khi xem thi đấu bóng bàn, nhất là lúc vận động viên giao bóng, khán giả phải giữ yên lặng, cấm nói to hoặc rời chỗ ngồi đi lại tuỳ tiện."}]}],"gram":[{"id":"ba-tu-cau","t":"把字句：S + 把 + 宾语 + 动词 + 其他成分","s":"câu chữ 把 — nhấn mạnh xử lý cái gì và kết quả ra sao","b":"Câu chữ <b>把</b> đem tân ngữ (thứ bị tác động) lên <b>trước động từ</b> để nói rõ người nói đã <b>xử lý</b> nó thế nào và <b>kết quả</b> ra sao. Vì trọng tâm là kết quả nên sau động từ <b>bắt buộc phải có thành phần khác</b>: 了、一下、bổ ngữ kết quả (错、完、破), bổ ngữ xu hướng (下来、起来), hoặc tân ngữ thứ hai. Tân ngữ sau 把 phải là cái <b>đã xác định</b> (người nghe biết là cái nào), không dùng cho vật chung chung.","r":["Công thức: chủ ngữ + 把 + tân ngữ xác định + động từ + (了/一下/bổ ngữ…).","Động từ không được đứng trơ trọi: ✗ 我把护照复印。 → ✓ 我把护照复印一下。","Phó từ phủ định và trợ động từ đứng TRƯỚC 把: ✗ 我把号码没填错 → ✓ 我没把号码填错；我们要把护照复印一下。","Động từ không mang nghĩa tác động (是、有、知道、喜欢、看见) không dùng được với 把: ✗ 我把这件事知道了。","Tân ngữ phải xác định: ✗ 我把一本书放在桌子上了 → ✓ 我把那本书放在桌子上了。"],"e":[["真抱歉，我不小心把护照号码填错了。","Zhēn bàoqiàn, wǒ bù xiǎoxīn bǎ hùzhào hàomǎ tián cuò le.","Thật xin lỗi, em sơ ý điền sai số hộ chiếu rồi <i>(bài khoá 1)</i>"],["请把你的护照给我，我们要把护照复印一下。","Qǐng bǎ nǐ de hùzhào gěi wǒ, wǒmen yào bǎ hùzhào fùyìn yíxià.","Em đưa hộ chiếu cho thầy, bọn thầy phải photo hộ chiếu một bản <i>(bài khoá 1)</i>"],["刚才用刀切肉的时候把手弄破了。","Gāngcái yòng dāo qiē ròu de shíhou bǎ shǒu nòng pò le.","Lúc nãy dùng dao thái thịt nên làm đứt tay <i>(bài khoá 2)</i>"],["你把衣服脱下来，我给你洗洗。","Nǐ bǎ yīfu tuō xiàlai, wǒ gěi nǐ xǐxi.","Em cởi áo ra đi, anh giặt cho <i>(bài khoá 2)</i>"]],"d":[["你回去后把今天大家在会上提的意见都整理_______。","出来"]],"w":"Đừng dịch máy móc từ tiếng Việt: “Tôi làm rách áo” nói bằng 把 mới tự nhiên (我把衣服弄破了), còn 我弄破了衣服 nghe nhạt và không nhấn được kết quả."},{"id":"bei-tu-cau","t":"被字句：受事 + 被 (+ 施事) + 动词 + 其他成分","s":"câu bị động với 被 — bị/được ai đó làm gì","b":"Câu chữ <b>被</b> đặt <b>vật/người chịu tác động lên đầu câu</b>, người gây ra hành động đứng sau 被 (có thể lược bỏ khi không rõ hoặc không cần nói). Giống câu 把, sau động từ cũng <b>phải có thành phần khác</b> (了、走、完、坏…). Tiếng Trung dùng 被 ít hơn thể bị động tiếng Việt, thường mang sắc thái việc xảy ra <b>ngoài ý muốn</b>.","r":["Công thức: đối tượng + 被 + (người làm) + động từ + 了/bổ ngữ kết quả.","Được phép bỏ chủ thể: 申请表被拿走了 (không cần nói ai lấy).","都、也、没 và trợ động từ đứng TRƯỚC 被: ✓ 申请表都被别人拿走了；✓ 我的车没被人开走。","Sau động từ không được để trống: ✗ 表格被别人拿。 → ✓ 表格被别人拿走了。","Khẩu ngữ hay thay 被 bằng 让 / 叫, nhưng khi đó bắt buộc phải nói rõ người làm: ✓ 表格让别人拿走了。"],"e":[["申请表都被别人拿走了，我给你重新打印一份。","Shēnqǐngbiǎo dōu bèi biéren ná zǒu le, wǒ gěi nǐ chóngxīn dǎyìn yí fèn.","Đơn đăng ký bị người khác lấy hết rồi, thầy in lại cho em một tờ <i>(bài khoá 1)</i>"]],"d":[],"w":"把 và 被 là hai mặt của một sự việc: 别人把申请表拿走了 = 申请表被别人拿走了. Chọn 把 khi muốn nói về người làm, chọn 被 khi muốn nói về vật bị tác động."},{"id":"nghi-van-dai-tu-nham-chi","t":"疑问代词表任指：谁都/什么都/怎么都 + (不/没)……","s":"ai cũng…, cái gì cũng…, thế nào cũng không…","b":"Các đại từ nghi vấn 谁、什么、哪儿、怎么 khi <b>không dùng để hỏi</b> mà đi kèm <b>都 / 也</b> ở phía sau thì mang nghĩa “bất kỳ ai/cái gì/nơi nào cũng…”. Cả cụm này đứng <b>trước động từ</b>, và câu vẫn là câu trần thuật (đọc xuống giọng, không có 吗).","r":["Bắt buộc có 都 hoặc 也 đứng sau đại từ: ✗ 谁有粗心的时候 → ✓ 谁都有粗心填错的时候。","Ở câu phủ định thường dùng 也: 我什么也没吃 / 我怎么都记不住。","Nếu đại từ làm tân ngữ thì phải đưa lên trước động từ: ✗ 他做不好什么 → ✓ 他什么都做不好。","谁 ở đây đọc là shéi và nghĩa là “bất kỳ ai”, không phải câu hỏi “ai?”."],"e":[["没关系，不用道歉，谁都有粗心填错的时候。","Méi guānxi, búyòng dàoqiàn, shéi dōu yǒu cūxīn tián cuò de shíhou.","Không sao, không cần xin lỗi, ai cũng có lúc sơ ý điền nhầm <i>(bài khoá 1)</i>"],["在中国你会发现到处都有乒乓球桌。","Zài Zhōngguó nǐ huì fāxiàn dàochù dōu yǒu pīngpāngqiú zhuō.","Ở Trung Quốc bạn sẽ thấy đâu đâu cũng có bàn bóng bàn <i>(bài khoá 5)</i>"]],"d":[["每个人都有自己的生活，_______。","B：谁都要忙自己的事儿。"],["他最近什么都做不好，_______。","C：所以他总是不开心。"],["我已经练习了好几遍了，_______。","A：但是怎么都记不住。"]],"w":"Phân biệt với câu hỏi thật: 谁有时间？ (Ai có thời gian?) ≠ 谁都有时间。(Ai cũng có thời gian.) — dấu hiệu nhận biết chính là chữ 都/也."},{"id":"wu-lun-dou","t":"无论/不管……，都……","s":"bất kể… đều…","b":"<b>无论</b> (văn viết) hay <b>不管</b> (khẩu ngữ) nêu một điều kiện <b>có nhiều khả năng</b>, vế sau dùng <b>都/也</b> để nói kết quả không thay đổi. Phần sau 无论 <b>phải chứa yếu tố lựa chọn</b>: đại từ nghi vấn (哪个、谁、什么、怎么), cấu trúc A还是B, hoặc chính-phản (去不去).","r":["Công thức: 无论 + phần có lựa chọn + ，+ chủ ngữ + 都/也 + động từ.","Vế sau không được thiếu 都/也: ✗ 无论哪个国家的人能看懂 → ✓ 无论哪个国家的人都能看懂。","Sau 无论 không dùng 如果/要是: ✗ 无论如果下雨…… → ✓ 无论下不下雨，我都去。","无论 thiên về văn viết, trong hội thoại hằng ngày người Trung thường nói 不管."],"e":[["这种语言与国籍无关，无论哪个国家的人都能看懂。","Zhè zhǒng yǔyán yǔ guójí wúguān, wúlùn nǎge guójiā de rén dōu néng kàndǒng.","Thứ ngôn ngữ này không liên quan gì đến quốc tịch, người nước nào cũng xem hiểu được <i>(bài khoá 3)</i>"]],"d":[],"w":"Đừng nhầm 无论……都 (bất kể… đều…) với 不但……而且 (không những… mà còn…). Trong cùng câu này còn có mẫu <b>A 与 B 无关</b> = “A không liên quan đến B”, dạng văn viết của 跟……没有关系."},{"id":"dong-ci-jia-shang","t":"动词 + 上 / 动词 + 不上、没……上","s":"V được (đạt được mục đích) / không V được","b":"Bổ ngữ <b>上</b> đặt sau động từ diễn tả việc <b>đạt được mục đích, có được cái mình muốn</b> sau một quá trình chờ đợi hay cố gắng: 吃上 (được ăn), 看上 (xem được), 坐上 (lên/đi được xe). Dạng khả năng là <b>V得上 / V不上</b>, dạng phủ định quá khứ là <b>没 V 上</b>.","r":["Vị trí: động từ + 上 + (了) + tân ngữ: 今天终于吃上了这个饭馆儿的菜。","Không đạt được: 吃不上 / 看不上 / 坐不上 (chú ý 上 đọc nhẹ: chī bu shàng).","Quá khứ không đạt được dùng 没……上, không dùng 不: ✗ 我不看上电影 → ✓ 我没看上电影。","Thường đi cùng 终于、看来、就 để nhấn mạnh chờ đợi hoặc thất vọng."],"e":[["看来今天吃不上羊肉饺子了。","Kànlái jīntiān chī bu shàng yángròu jiǎozi le.","Xem ra hôm nay không được ăn bánh chẻo nhân thịt dê rồi <i>(bài khoá 2)</i>"]],"d":[["要是你想去云南旅游应该早点买火车票，_______","B：否则就坐不上火车了。"],["早就听说这个饭馆儿的菜特别好吃，_______","C：今天终于吃上了。"],["周末我们本来想去看电影，_______","A：但是因为要加班，没看上。"]],"w":"Phân biệt 看不上 (không xem được, không có cơ hội xem) với 看不起 (coi thường) và với 看不见 (nhìn không thấy)."},{"id":"xu-huong-bu-ngu","t":"趋向补语的引申用法：出来 / 起来 / 下来","s":"bổ ngữ xu hướng dùng theo nghĩa bóng","b":"Ngoài nghĩa di chuyển, ba bổ ngữ này còn dùng theo nghĩa bóng: <b>出来</b> = từ chỗ chưa biết thành nhận ra, từ không có thành có (看出来 nhận ra, 想出来 nghĩ ra, 整理出来 tổng hợp ra); <b>起来</b> = bắt đầu và tiếp tục, hoặc gom lại, cố định lại (包起来 băng lại, 站起来 đứng dậy, 想起来 nhớ ra); <b>下来</b> = tách rời khỏi vật khác hoặc giữ lại (脱下来 cởi ra, 记下来 ghi lại).","r":["Tân ngữ có thể chen vào giữa: 想出一个办法来 = 想出来一个办法。","Dạng khả năng chen 得/不 vào giữa động từ và bổ ngữ: 看得出来 / 看不出来；想得起来 / 想不起来。","Phân biệt cặp dễ nhầm: 想出来 = nghĩ ra cái mới; 想起来 = nhớ lại cái đã biết.","Sau 把 rất hay dùng nhóm này: 把衣服脱下来、把意见整理出来、把号码记下来。"],"e":[["刚才我在旁边看到你跳中国舞了，没看出来你跳得这么好！","Gāngcái wǒ zài pángbiān kàndào nǐ tiào Zhōngguó wǔ le, méi kàn chūlái nǐ tiào de zhème hǎo!","Lúc nãy mình đứng bên cạnh xem cậu múa điệu Trung Quốc, không nhận ra cậu múa đẹp đến thế! <i>(bài khoá 3)</i>"],["等一下，我给你包起来。","Děng yíxià, wǒ gěi nǐ bāo qǐlai.","Đợi chút, anh băng lại cho em <i>(bài khoá 2)</i>"],["你把衣服脱下来，我给你洗洗。","Nǐ bǎ yīfu tuō xiàlai, wǒ gěi nǐ xǐxi.","Em cởi áo ra đi, anh giặt cho <i>(bài khoá 2)</i>"],["于是他就记下了房东的手机号码。","Yúshì tā jiù jì xià le fángdōng de shǒujī hàomǎ.","Thế là cậu ấy ghi lại số di động của chủ nhà <i>(bài khoá 4)</i>"]],"d":[["久坐办公室的人有时间一定要站_______活动活动。","起来"],["这个主意好像是三班的一个学生想_______的。","出来"],["声音听着挺熟悉的，不过我一下子想不_______。","起来"],["遇到麻烦事时，你应该想一些办法让自己从不高兴的心情中走_______。","出来"],["你回去后把今天大家在会上提的意见都整理_______。","出来"]],"w":"Bổ ngữ xu hướng luôn đọc nhẹ (qǐlai, xiàlai, chūlái). Học thuộc theo cụm cố định sẽ nhanh hơn là dịch từng chữ."},{"id":"zong-de-lai-shuo","t":"总的来说，……","s":"nói chung thì…, nhìn chung…","b":"<b>总的来说</b> là ngữ chuyển tiếp dùng để <b>chốt lại</b> sau khi đã liệt kê ưu — nhược điểm hoặc nhiều chi tiết. Nó đứng <b>đầu vế câu, có dấu phẩy theo sau</b>, không đứng giữa chủ ngữ và động từ.","r":["Vị trí: đầu câu/đầu vế thứ hai — 总的来说，这套房子他很满意。","Rất hay đi với 但/但是 ở phía trước: 有好处也有坏处，但总的来说，好处比坏处多。","✗ 这套房子总的来说他很满意 nghe gượng → ✓ 总的来说，这套房子他很满意。","Đồng nghĩa gần: 一般来说 (nói chung theo lệ thường), 总之 (tóm lại)."],"e":[["总的来说，这套房子他很满意，于是他就记下了房东的手机号码。","Zǒng de lái shuō, zhè tào fángzi tā hěn mǎnyì, yúshì tā jiù jì xià le fángdōng de shǒujī hàomǎ.","Nói chung thì căn nhà này cậu ấy rất hài lòng, thế là cậu ghi lại số di động của chủ nhà <i>(bài khoá 4)</i>"]],"d":[["去国外留学有好处也有坏处，_______","B：但总的来说，好处比坏处多。"],["每个人虽然都会遇到一些困难，_______","C：但总的来说，只要努力都能解决。"],["这件衣服价格有点儿高，_______","A：总的来说，性价比还可以。"]],"w":"总的来说 dùng để <b>kết luận</b>, còn 一般来说 nêu <b>thông lệ</b>; đừng thay lẫn nhau khi câu trước đã liệt kê ưu nhược điểm."},{"id":"zai-yu","t":"（关键）在于……","s":"nằm ở chỗ…, mấu chốt là ở…","b":"<b>在于</b> là động từ dùng trong văn viết, nghĩa “nằm ở, do… quyết định”. Sau 在于 là <b>danh từ, động từ hoặc cả một mệnh đề</b>. Rất hay gặp trong khuôn <b>关键在于……</b> (mấu chốt nằm ở…) và <b>A 的成功/原因在于 B</b>.","r":["Công thức: chủ ngữ + 在于 + danh từ / cụm động từ / mệnh đề — 生命在于运动。","Sau 在于 KHÔNG thêm 是: ✗ 关键在于是他很专心 → ✓ 关键在于他做事情总是很专心。","Khác 在: 在 chỉ vị trí cụ thể (他在教室), 在于 chỉ nguyên nhân/bản chất trừu tượng.","Thường mở đầu vế giải thích cho câu trước: 每个人对幸福的理解不同，关键在于……"],"e":[["人们常说“生命在于运动”，所以很多人一到周末就会到体育馆打几场球。","Rénmen cháng shuō “shēngmìng zàiyú yùndòng”, suǒyǐ hěn duō rén yí dào zhōumò jiù huì dào tǐyùguǎn dǎ jǐ chǎng qiú.","Người ta thường nói “sống là phải vận động”, nên nhiều người cứ đến cuối tuần là ra nhà thi đấu chơi mấy trận bóng <i>(bài khoá 5)</i>"]],"d":[["每个人对幸福的理解不同，_______","B：关键在于每个人的人生经历不同。"],["取得成功的人都经历过许多失败，_______","C：他们的成功在于坚持不放弃。"],["他做事情常常能达到事半功倍的效果，_______","A：关键在于他做事情总是很专心。"]],"w":"在于 là văn viết; trong khẩu ngữ người ta nói 主要是…… hoặc ……的原因是……"},{"id":"nan-dao-ma","t":"难道……吗？","s":"chẳng lẽ… sao? (câu hỏi tu từ)","b":"<b>难道</b> là phó từ mở đầu <b>câu hỏi tu từ</b>, biểu thị sự ngạc nhiên hoặc phỏng đoán của người nói; cuối câu thường có <b>吗 / 不成</b>. Người nói thật ra <b>đã tin điều ngược lại</b> chứ không thực sự hỏi thông tin.","r":["Vị trí: đứng đầu câu hoặc ngay sau chủ ngữ — 难道你学过？= 你难道学过？","Cuối câu giữ 吗: ✗ 难道你以前学过中国舞蹈？ → ✓ 难道你以前就学过中国舞蹈吗？","Không dùng chung với câu hỏi chính-phản: ✗ 难道你去不去？","Câu khẳng định + 难道 mang ý phủ định, và ngược lại: 难道我不知道吗？= Tôi biết chứ!"],"e":[["难道你以前在你们国家就学过中国舞蹈吗？","Nándào nǐ yǐqián zài nǐmen guójiā jiù xuéguo Zhōngguó wǔdǎo ma?","Chẳng lẽ trước đây ở nước cậu, cậu đã học múa Trung Quốc rồi sao? <i>(bài khoá 3)</i>"]],"d":[],"w":"Đừng trả lời 难道…吗？ bằng 是/不是 như câu hỏi thường — đây là câu hỏi tu từ, người nghe chỉ cần giải thích hoặc xác nhận nội dung."}],"notes":"1) Các slide 16, 40, 61 chỉ chứa câu hỏi đọc hiểu (填写申请表格时，应该提供哪些方面的信息？/ 马克的那个动作做得正确吗？/ “乒乓球”这个名字是怎么来的？…) nên đã loại, không tính là bài khoá. 2) Các slide 54, 55, 64, 65 là phần 练一练 (câu điền chỗ trống: 太____了 → 吵；多和周围的人____ → 打招呼；我带的____应该够了 → 零钱；李经理的电话一直____ → 占线；找个安静点儿的____ → 座位；最后一____演出 → 场；很多地方都____抽烟 → 禁止) — đã để ở phần luyện tập, KHÔNG ghép vào texts. 3) Hai bài đọc slide 53 và slide 62–63 không có tiêu đề trên slide; tiêu đề 短文（一）/短文（二） và title_vi là do người soạn đặt để dễ tra, không phải chữ in trong giáo trình. 4) Bản pinyin trên slide bị đảo thứ tự dòng ở hầu hết các bài khoá và có lỗi (jiǎo zǐ → jiǎozi, bāo zǐ → bāozi, zhān xiàn → zhànxiàn, dào chǔ → dàochù, wǒ mén → wǒmen, dǎ zhāo hū → dǎ zhāohu, hǎo bā → hǎo ba, jīn zhǐ trong bảng từ mới → jìnzhǐ) — đã đánh lại pinyin chuẩn cho toàn bộ câu trong texts. 5) Hai chỗ chữ Hán trên slide bị lỗi gõ, đã sửa theo đúng bản pinyin kèm theo và ghi rõ ở đây: slide 41 “我早上更你打招呼” → 跟 (pinyin slide ghi gēn); slide 53 “原来再记号码的时候” → 在 (cấu trúc 在……的时候). Ngoài hai chỗ này, toàn bộ câu chữ Hán giữ nguyên như slide, không thêm câu nào. 6) Bài khoá 1 bị cắt ngang giữa slide 17 và slide 18 (“申请表都被别人” + “拿走了……”); đã nối lại thành một lượt thoại liền mạch của 高老师, không thêm chữ. 7) Phần 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp ở đây được suy ra từ 练一练 (nối câu 谁都/什么都/怎么都；V上/V不上；出来–起来；总的来说；关键在于) và từ cấu trúc nổi bật trong bài khoá (把字句、被字句、无论……都、难道……吗). 8) Cấu trúc 否则 xuất hiện trong 练一练 (否则就坐不上火车了 / 否则我就没有机会看了) nhưng KHÔNG có câu nào trong bài khoá, nên không lập thành mục ngữ pháp riêng (theo quy tắc mỗi điểm ngữ pháp phải có ví dụ lấy từ bài khoá). 9) Phần 练一练 luyện chữ 发 (沙发/理发/发生/发展) là bài tập phân biệt từ, không gắn với điểm ngữ pháp nào nên không đưa vào grammar; đáp án trên slide: 发生 / 沙发 / 发展 / 理发. 10) Từ 租 chỉ có nghĩa tiếng Anh trên slide (v. to rent, to lease) — đã dịch sang tiếng Việt ở need_vi.","order":[{"z":"没关系，不用道歉，谁都有粗心填错的时候。","t":["没关系","不用","道歉","谁","都","有","粗心","填错","的","时候"],"v":"Không sao đâu, em không cần xin lỗi, ai cũng có lúc sơ ý điền nhầm mà. Đơn đăng ký bị người khác lấy hết rồi, thầy in lại cho em m"},{"z":"（高老师打印，马克填表）","t":["高","老师","打印","马克","填表"],"v":"(Thầy Cao in đơn, Mark điền tờ khai)"},{"z":"呀，你的手怎么流血了？","t":["呀","你","的","手","怎么","流血","了"],"v":"Ôi, sao tay em lại chảy máu thế này? Đợi chút, anh băng lại cho."},{"z":"等一下，我给你包起来。","t":["等","一下","我","给","你","包","起来"],"v":"Ôi, sao tay em lại chảy máu thế này? Đợi chút, anh băng lại cho."},{"z":"看来今天吃不上羊肉饺子了。","t":["看来","今天","吃不上","羊肉","饺子","了"],"v":"Xem ra hôm nay không được ăn bánh chẻo nhân thịt dê rồi."},{"z":"那我们就吃点儿别的。","t":["那","我们","就","吃","点儿","别的"],"v":"Vậy thì mình ăn món khác. Gần tiệm cắt tóc anh hay đến có một quán ăn, bánh bao ở đó rất ngon, lát nữa anh đi mua một ít."},{"z":"我早上跟你打招呼，你没看见。","t":["我","早上","跟","你","打招呼","你","没","看见"],"v":"Sáng nay mình chào cậu mà cậu không thấy. Không ngờ lại gặp cậu ở đây."},{"z":"想不到又在这儿碰见你了。","t":["想不到","又","在","这儿","碰见","你","了"],"v":"Sáng nay mình chào cậu mà cậu không thấy. Không ngờ lại gặp cậu ở đây."},{"z":"难道你以前在你们国家就学过中国舞蹈吗？","t":["难道","你","以前","在","你们","国家","就学","过","中国","舞蹈","吗"],"v":"Lúc nãy mình đứng bên cạnh xem cậu múa điệu múa Trung Quốc, không nhận ra là cậu múa đẹp đến vậy! Chẳng lẽ hồi trước ở nước cậu, c"},{"z":"有一天，他在小区门口看到一个租房子的广告。","t":["有","一天","他","在","小区","门口","看到","一个","租房子","的","广告"],"v":"Một hôm, cậu ấy nhìn thấy một tờ quảng cáo cho thuê nhà ở cổng khu dân cư."},{"z":"广告上说房子交通方便，周围很安静，厨房很大。","t":["广告","上","说","房子","交通","方便","周围","很","安静","厨房","很大"],"v":"Trên quảng cáo ghi nhà đi lại thuận tiện, xung quanh rất yên tĩnh, bếp lại rộng."},{"z":"可回家后打
