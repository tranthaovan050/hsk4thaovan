 đối với sức khỏe."},{"h":"无法","p":"wú fǎ","v":"Không thể, không có cách gì","ez":"这件事我一个人无法完成。","ey":"Zhè jiàn shì wǒ yí ge rén wúfǎ wánchéng.","ev":"Việc này một mình tôi không thể hoàn thành."},{"h":"无","p":"wú","v":"Không có, không","ez":"我要一杯无糖的咖啡，谢谢。","ey":"Wǒ yào yì bēi wútáng de kāfēi, xièxie.","ev":"Cho tôi một cốc cà phê không đường, cảm ơn."}],[{"h":"节","p":"jié","v":"Tiết (học)","ez":"我们今天上午有四节课。","ey":"Wǒmen jīntiān shàngwǔ yǒu sì jié kè.","ev":"Sáng nay chúng tôi có bốn tiết học."},{"h":"详细","p":"xiáng xì","v":"Chi tiết, tỉ mỉ","ez":"请你详细说说当时的情况。","ey":"Qǐng nǐ xiángxì shuōshuo dāngshí de qíngkuàng.","ev":"Bạn hãy kể chi tiết tình hình lúc đó."},{"h":"解释","p":"jiě shì","v":"Giải thích","ez":"这个词的意思请你再解释一下。","ey":"Zhège cí de yìsi qǐng nǐ zài jiěshì yíxià.","ev":"Ý nghĩa của từ này bạn giải thích lại giúp tôi nhé."},{"h":"对于","p":"duì yú","v":"Đối với","ez":"对于这个决定，大家都很满意。","ey":"Duìyú zhège juédìng, dàjiā dōu hěn mǎnyì.","ev":"Đối với quyết định này, mọi người đều rất hài lòng."},{"h":"叶子","p":"yè zi","v":"Lá cây","ez":"秋天到了，树上的叶子慢慢变黄了。","ey":"Qiūtiān dào le, shù shang de yèzi mànmàn biàn huáng le.","ev":"Mùa thu đến, lá trên cây từ từ chuyển sang màu vàng."},{"h":"教育","p":"jiào yù","v":"Giáo dục, dạy dỗ","ez":"父母的教育对孩子很重要。","ey":"Fùmǔ de jiàoyù duì háizi hěn zhòngyào.","ev":"Sự giáo dục của cha mẹ rất quan trọng với con cái."}],[{"h":"使用","p":"shǐ yòng","v":"Sử dụng","ez":"使用这台机器以前，请先看说明。","ey":"Shǐyòng zhè tái jīqì yǐqián, qǐng xiān kàn shuōmíng.","ev":"Trước khi sử dụng chiếc máy này, hãy đọc hướng dẫn trước."},{"h":"语言","p":"yǔ yán","v":"Ngôn ngữ","ez":"我朋友会说三种语言，我很羡慕他。","ey":"Wǒ péngyou huì shuō sān zhǒng yǔyán, wǒ hěn xiànmù tā.","ev":"Bạn tôi biết nói ba thứ tiếng, tôi rất ngưỡng mộ cậu ấy."},{"h":"直接","p":"zhíjiē","v":"Trực tiếp, thẳng","ez":"下班以后我直接回家了。","ey":"Xiàbān yǐhòu wǒ zhíjiē huí jiā le.","ev":"Sau khi tan làm tôi về thẳng nhà luôn."},{"h":"引起","p":"yǐn qǐ","v":"Gây ra, dẫn đến","ez":"这条新闻引起了很多人的注意。","ey":"Zhè tiáo xīnwén yǐnqǐ le hěn duō rén de zhùyì.","ev":"Tin này đã gây được sự chú ý của rất nhiều người."},{"h":"误会","p":"wù huì","v":"Sự hiểu lầm","ez":"这只是一个误会，你别生气了。","ey":"Zhè zhǐ shì yí ge wùhuì, nǐ bié shēngqì le.","ev":"Đây chỉ là hiểu lầm thôi, cậu đừng giận nữa."},{"h":"友好","p":"yǒu hǎo","v":"Thân thiện","ez":"这儿的人都很友好，很爱帮助别人。","ey":"Zhèr de rén dōu hěn yǒuhǎo, hěn ài bāngzhù biéren.","ev":"Người ở đây đều rất thân thiện, rất hay giúp đỡ người khác."}],[{"h":"事半功倍","p":"shì bàn gōng bèi","v":"Làm chơi ăn thật","ez":"用对了方法，学习才能事半功倍。","ey":"Yòng duì le fāngfǎ, xuéxí cái néng shìbàngōngbèi.","ev":"Dùng đúng phương pháp thì học mới bỏ ít công mà được nhiều."},{"h":"节约","p":"jié yuē","v":"Tiết kiệm","ez":"洗澡的时候要注意节约用水。","ey":"Xǐzǎo de shíhou yào zhùyì jiéyuē yòng shuǐ.","ev":"Khi tắm cần chú ý tiết kiệm nước."},{"h":"力气","p":"lì qi","v":"Sức lực, hơi sức","ez":"这个箱子太重了，我一个人没力气搬。","ey":"Zhège xiāngzi tài zhòng le, wǒ yí ge rén méi lìqi bān.","ev":"Cái thùng này nặng quá, một mình tôi không đủ sức khiêng."},{"h":"相反","p":"xiāng fǎn","v":"Trái lại, ngược lại","ez":"他的看法和我的正好相反。","ey":"Tā de kànfǎ hé wǒ de zhènghǎo xiāngfǎn.","ev":"Cách nhìn của anh ấy vừa hay trái ngược với tôi."},{"h":"任务","p":"rènwu","v":"Nhiệm vụ","ez":"今天的任务我们已经完成了。","ey":"Jīntiān de rènwu wǒmen yǐjīng wánchéng le.","ev":"Nhiệm vụ hôm nay chúng tôi đã hoàn thành rồi."},{"h":"意见","p":"yì jiàn","v":"Ý kiến","ez":"大家对这个计划有什么意见？","ey":"Dàjiā duì zhège jìhuà yǒu shénme yìjiàn?","ev":"Mọi người có ý kiến gì về kế hoạch này không?"},{"h":"仔细","p":"zǐ xì","v":"Thận trọng, kỹ lưỡng","ez":"请你仔细检查一遍，别写错了。","ey":"Qǐng nǐ zǐxì jiǎnchá yí biàn, bié xiě cuò le.","ev":"Bạn hãy kiểm tra kỹ một lượt, đừng viết sai."},{"h":"达到","p":"dádào","v":"đạt được","ez":"经过努力，他终于达到了自己的目的。","ey":"Jīngguò nǔlì, tā zhōngyú dádào le zìjǐ de mùdì.","ev":"Nhờ nỗ lực, cuối cùng anh ấy cũng đạt được mục đích của mình."}]],"texts":[{"no":1,"tz":"王经理做生意遇到了困难","tv":"Giám đốc gặp khó khăn trong chuyện làm ăn","lines":[{"s":"王经理","z":"听说这次生意你到现在还没谈成。","p":"Tīngshuō zhè cì shēngyi nǐ dào xiànzài hái méi tán chéng.","v":"Nghe nói vụ làm ăn lần này đến giờ anh vẫn chưa thương lượng xong."},{"s":"马经理","z":"按我以前的经验，早应该谈成了，这次我也不知道哪儿出了问题。","p":"Àn wǒ yǐqián de jīngyàn, zǎo yīnggāi tán chéng le, zhè cì wǒ yě bù zhīdào nǎr chū le wèntí.","v":"Theo kinh nghiệm trước đây của tôi thì lẽ ra đã chốt xong từ lâu, lần này tôi cũng chẳng biết trục trặc ở khâu nào."},{"s":"王经理","z":"有句话叫“规定和经验是死的，人是活的”。当“规定”和“经验”不能解决问题时，建议你改变一下自己的态度和想法。","p":"Yǒu jù huà jiào “guīdìng hé jīngyàn shì sǐ de, rén shì huó de”. Dāng “guīdìng” hé “jīngyàn” bù néng jiějué wèntí shí, jiànyì nǐ gǎibiàn yíxià zìjǐ de tàidù hé xiǎngfǎ.","v":"Có câu nói rằng “quy định và kinh nghiệm là thứ cứng nhắc, còn con người thì linh hoạt”. Khi “quy định” và “kinh nghiệm” không giải quyết được vấn đề, tôi khuyên anh nên thay đổi thái độ và cách nghĩ của mình một chút."},{"s":"马经理","z":"很多时候，我都习惯根据过去的经验做事，可惜，经验不是全部都是对的。","p":"Hěn duō shíhou, wǒ dōu xíguàn gēnjù guòqù de jīngyàn zuòshì, kěxī, jīngyàn bú shì quánbù dōu shì duì de.","v":"Rất nhiều khi tôi quen làm việc dựa vào kinh nghiệm cũ, đáng tiếc là không phải toàn bộ kinh nghiệm đều đúng."},{"s":"王经理","z":"遇到不能解决的问题时，我们应该试着走走以前从来没走过的路，也许这样就能找到解决问题的方法了。","p":"Yùdào bù néng jiějué de wèntí shí, wǒmen yīnggāi shìzhe zǒuzou yǐqián cónglái méi zǒu guò de lù, yěxǔ zhèyàng jiù néng zhǎodào jiějué wèntí de fāngfǎ le.","v":"Khi gặp vấn đề không giải quyết được, chúng ta nên thử đi những con đường mà trước nay mình chưa từng đi, biết đâu như vậy lại tìm ra được cách giải quyết."},{"s":"马经理","z":"好，我再跟同事商量商量，希望能及时发现问题，并且准确地找到解决问题的方法。","p":"Hǎo, wǒ zài gēn tóngshì shāngliang shāngliang, xīwàng néng jíshí fāxiàn wèntí, bìngqiě zhǔnquè de zhǎodào jiějué wèntí de fāngfǎ.","v":"Được, tôi sẽ bàn bạc thêm với đồng nghiệp, hy vọng phát hiện vấn đề kịp thời, đồng thời tìm ra chính xác cách giải quyết."}]},{"no":2,"tz":"高老师告诉女儿洗衣服的方法","tv":"Cô giáo Cao chỉ cho con gái cách giặt quần áo","lines":[{"s":"女儿","z":"妈，您看我刚买的裤子，洗完以后颜色怎么变得这么难看呢？","p":"Mā, nín kàn wǒ gāng mǎi de kùzi, xǐ wán yǐhòu yánsè zěnme biàn de zhème nánkàn ne?","v":"Mẹ ơi, mẹ xem cái quần con vừa mua này, giặt xong sao màu lại xấu đi thế này?"},{"s":"高老师","z":"看来是掉颜色了，你洗的时候在水里加点儿盐就不会这样了。","p":"Kànlái shì diào yánsè le, nǐ xǐ de shíhou zài shuǐ li jiā diǎnr yán jiù bú huì zhèyàng le.","v":"Xem ra là bị phai màu rồi, lúc giặt con cho thêm chút muối vào nước thì sẽ không bị như vậy."},{"s":"女儿","z":"放盐？盐不是用来做饭的吗？难道它还能让衣服不掉颜色？","p":"Fàng yán? Yán bú shì yòng lái zuò fàn de ma? Nándào tā hái néng ràng yīfu bú diào yánsè?","v":"Cho muối ạ? Muối chẳng phải để nấu ăn sao? Chẳng lẽ nó còn giữ được cho quần áo khỏi phai màu?"},{"s":"高老师","z":"当然。有些衣服第一次洗的时候会掉颜色，其实，有很多方法可以解决这个问题。在水里加勺盐再洗是最简单的方法。用盐水来洗新衣服，这样穿得再久、洗的次数再多，衣服也不容易掉颜色。","p":"Dāngrán. Yǒuxiē yīfu dì-yī cì xǐ de shíhou huì diào yánsè, qíshí, yǒu hěn duō fāngfǎ kěyǐ jiějué zhège wèntí. Zài shuǐ li jiā sháo yán zài xǐ shì zuì jiǎndān de fāngfǎ. Yòng yánshuǐ lái xǐ xīn yīfu, zhèyàng chuān de zài jiǔ, xǐ de cìshù zài duō, yīfu yě bù róngyì diào yánsè.","v":"Tất nhiên rồi. Có những bộ quần áo lần giặt đầu tiên sẽ bị phai màu, thật ra có rất nhiều cách để giải quyết chuyện này. Cho một thìa muối vào nước rồi mới giặt là cách đơn giản nhất. Dùng nước muối để giặt quần áo mới, như vậy dù mặc lâu đến mấy, giặt nhiều lần đến mấy thì quần áo cũng không dễ bị phai màu."},{"s":"女儿","z":"我第一次听说盐有保护衣服颜色的作用，生活中还真有不少课本上无法学到的知识。","p":"Wǒ dì-yī cì tīngshuō yán yǒu bǎohù yīfu yánsè de zuòyòng, shēnghuó zhōng hái zhēn yǒu bù shǎo kèběn shang wúfǎ xué dào de zhīshi.","v":"Lần đầu tiên con nghe nói muối có tác dụng giữ màu quần áo, trong cuộc sống quả thật có không ít kiến thức không học được từ sách vở."},{"s":"高老师","z":"实际上，很多问题的答案都可以从生活中找到。但这需要你用眼睛去发现，用心去总结。","p":"Shíjì shang, hěn duō wèntí de dá'àn dōu kěyǐ cóng shēnghuó zhōng zhǎodào. Dàn zhè xūyào nǐ yòng yǎnjing qù fāxiàn, yòng xīn qù zǒngjié.","v":"Thực ra, đáp án của rất nhiều vấn đề đều có thể tìm thấy từ cuộc sống. Nhưng điều đó cần con dùng mắt để phát hiện, dùng tâm để đúc kết."}]},{"no":3,"tz":"高老师学习王教授的教育方法","tv":"Cô giáo Cao học hỏi phương pháp giảng dạy của giáo sư Vương","lines":[{"s":"高老师","z":"王教授，今天听完您的这节课，我终于明白为什么您的课那么受学生欢迎了。","p":"Wáng jiàoshòu, jīntiān tīng wán nín de zhè jié kè, wǒ zhōngyú míngbai wèi shénme nín de kè nàme shòu xuésheng huānyíng le.","v":"Thưa giáo sư Vương, hôm nay nghe xong tiết học này của thầy, cuối cùng tôi cũng hiểu vì sao lớp của thầy được sinh viên yêu thích đến vậy."},{"s":"王教授","z":"谢谢！你能详细谈谈对我的课的看法吗？","p":"Xièxie! Nǐ néng xiángxì tántan duì wǒ de kè de kànfǎ ma?","v":"Cảm ơn cô! Cô có thể nói tỉ mỉ hơn về cảm nhận của cô với tiết học của tôi không?"},{"s":"高老师","z":"我发现您对学生特别了解，而且总是能用最简单的方法把复杂的问题解释清楚，让每个学生都能听懂，这一点真是值得我们好好儿学习。","p":"Wǒ fāxiàn nín duì xuésheng tèbié liǎojiě, érqiě zǒngshì néng yòng zuì jiǎndān de fāngfǎ bǎ fùzá de wèntí jiěshì qīngchu, ràng měi ge xuésheng dōu néng tīng dǒng, zhè yì diǎn zhēn shì zhídé wǒmen hǎohāor xuéxí.","v":"Tôi thấy thầy rất hiểu sinh viên, hơn nữa lúc nào cũng dùng được cách đơn giản nhất để giải thích rõ những vấn đề phức tạp, khiến sinh viên nào cũng nghe hiểu; điểm này thật đáng để chúng tôi học hỏi."},{"s":"王教授","z":"哪里哪里，这只是因为我对每个学生的能力水平比较了解。","p":"Nǎli nǎli, zhè zhǐshì yīnwèi wǒ duì měi ge xuésheng de nénglì shuǐpíng bǐjiào liǎojiě.","v":"Đâu có đâu có, chẳng qua là vì tôi khá hiểu trình độ, năng lực của từng sinh viên thôi."},{"s":"高老师","z":"那您认为对于老师来说，什么是最难做到的？","p":"Nà nín rènwéi duìyú lǎoshī lái shuō, shénme shì zuì nán zuòdào de?","v":"Vậy theo thầy, đối với một người giáo viên thì điều gì là khó làm được nhất?"},{"s":"王教授","z":"世界上没有完全相同的叶子，同样地，世界上也没有完全一样的人，所以，在教育学生时，要根据学生的特点选择不同的方法，我想这应该是最不容易做到的。","p":"Shìjiè shang méiyǒu wánquán xiāngtóng de yèzi, tóngyàng de, shìjiè shang yě méiyǒu wánquán yíyàng de rén, suǒyǐ, zài jiàoyù xuésheng shí, yào gēnjù xuésheng de tèdiǎn xuǎnzé bùtóng de fāngfǎ, wǒ xiǎng zhè yīnggāi shì zuì bù róngyì zuòdào de.","v":"Trên đời không có hai chiếc lá hoàn toàn giống nhau, cũng vậy, trên đời cũng không có hai con người hoàn toàn giống nhau; cho nên khi dạy học sinh, phải căn cứ vào đặc điểm của từng em mà chọn phương pháp khác nhau, tôi nghĩ đó mới là điều khó làm được nhất."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"人人都会使用语言，但是怎么用语言把话说好却是一门艺术。","p":"Rénrén dōu huì shǐyòng yǔyán, dànshì zěnme yòng yǔyán bǎ huà shuō hǎo què shì yì mén yìshù.","v":"Ai cũng biết dùng ngôn ngữ, nhưng dùng ngôn ngữ thế nào để nói cho hay lại là cả một nghệ thuật."},{"s":"","z":"看一个人怎么说话，往往可以比较准确地判断出他是一个什么样的人。","p":"Kàn yí ge rén zěnme shuōhuà, wǎngwǎng kěyǐ bǐjiào zhǔnquè de pànduàn chū tā shì yí ge shénme yàng de rén.","v":"Nhìn cách một người nói chuyện, thường có thể đoán khá chính xác người đó là người thế nào."},{"s":"","z":"有的人心里怎么想，嘴上就怎么说，即使是别人的缺点，他也会直接说出来，这样的人虽然很诚实，但是可能会引起别人的误会；","p":"Yǒude rén xīnli zěnme xiǎng, zuǐ shang jiù zěnme shuō, jíshǐ shì biéren de quēdiǎn, tā yě huì zhíjiē shuō chūlai, zhèyàng de rén suīrán hěn chéngshí, dànshì kěnéng huì yǐnqǐ biéren de wùhuì;","v":"Có người trong lòng nghĩ sao thì miệng nói vậy, ngay cả khuyết điểm của người khác cũng nói thẳng ra; người như thế tuy rất thật thà, nhưng có thể gây ra hiểu lầm cho người khác;"},{"s":"","z":"有的人虽然也看到了别人的缺点，但却不会直接指出来，而是通过别的方法来提醒，让他认识到自己的缺点，这样的人会让人觉得更友好。","p":"Yǒude rén suīrán yě kàndào le biéren de quēdiǎn, dàn què bú huì zhíjiē zhǐ chūlai, ér shì tōngguò bié de fāngfǎ lái tíxǐng, ràng tā rènshi dào zìjǐ de quēdiǎn, zhèyàng de rén huì ràng rén juéde gèng yǒuhǎo.","v":"Có người tuy cũng nhìn ra khuyết điểm của người khác nhưng lại không chỉ thẳng ra, mà nhắc nhở bằng cách khác để họ tự nhận ra khuyết điểm của mình; người như vậy khiến người ta thấy thân thiện hơn nhiều."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"无论做什么事情，都要注意方法，学习尤其是这样。","p":"Wúlùn zuò shénme shìqing, dōu yào zhùyì fāngfǎ, xuéxí yóuqí shì zhèyàng.","v":"Làm bất cứ việc gì cũng phải chú ý đến phương pháp, học tập lại càng như vậy."},{"s":"","z":"使用正确的方法，我们做起事来能“事半功倍”，也就是说，能节约时间，用较少的力气，取得更好的效果。","p":"Shǐyòng zhèngquè de fāngfǎ, wǒmen zuò qǐ shì lái néng “shì bàn gōng bèi”, yě jiù shì shuō, néng jiéyuē shíjiān, yòng jiào shǎo de lìqi, qǔdé gèng hǎo de xiàoguǒ.","v":"Dùng phương pháp đúng, chúng ta làm việc sẽ “bỏ ít công mà được nhiều”, nghĩa là tiết kiệm được thời gian, tốn ít sức lực hơn mà đạt hiệu quả tốt hơn."},{"s":"","z":"相反，如果方法不对，可能花五倍甚至十倍的时间都不能完成任务，结果变成了“事倍功半”。","p":"Xiāngfǎn, rúguǒ fāngfǎ bú duì, kěnéng huā wǔ bèi shènzhì shí bèi de shíjiān dōu bù néng wánchéng rènwu, jiéguǒ biànchéng “shì bèi gōng bàn”.","v":"Ngược lại, nếu phương pháp không đúng thì có khi bỏ ra gấp năm, thậm chí gấp mười thời gian vẫn không hoàn thành nổi nhiệm vụ, rốt cuộc thành “bỏ nhiều công mà được ít”."},{"s":"","z":"有一点需要提醒大家，别人的方法也许很有效，但是并不一定适合自己。","p":"Yǒu yì diǎn xūyào tíxǐng dàjiā, biéren de fāngfǎ yěxǔ hěn yǒuxiào, dànshì bìng bù yídìng shìhé zìjǐ.","v":"Có một điều cần nhắc mọi người: phương pháp của người khác có lẽ rất hiệu quả, nhưng chưa chắc đã hợp với bản thân mình."},{"s":"","z":"因此，我们应该在听取别人意见的同时，仔细考虑一下，再根据不同的情况选择不同的方法，这样才能达到最好的效果。","p":"Yīncǐ, wǒmen yīnggāi zài tīngqǔ biéren yìjiàn de tóngshí, zǐxì kǎolǜ yíxià, zài gēnjù bùtóng de qíngkuàng xuǎnzé bùtóng de fāngfǎ, zhèyàng cái néng dádào zuì hǎo de xiàoguǒ.","v":"Vì vậy, chúng ta nên vừa lắng nghe ý kiến của người khác vừa cân nhắc thật kỹ, rồi tuỳ tình hình khác nhau mà chọn phương pháp khác nhau, có như vậy mới đạt được hiệu quả tốt nhất."}]}],"gram":[{"id":"bing-qie","t":"并且","s":"đồng thời, hơn nữa, và","b":"<b>并且</b> là liên từ nối hai <b>động từ / cụm động từ / phân câu</b> cùng chủ ngữ, diễn tả hai hành động hoặc hai tính chất <b>cùng tồn tại, cùng xảy ra</b>, vế sau thường tiến thêm một bước so với vế trước. Nó trang trọng hơn 和 và không dùng để nối hai danh từ.","r":["并且 đứng ở đầu vế sau, trước động từ / tính từ: A，并且 B。","Thường đi cùng 不但……并且…… hoặc dùng thay cho 而且 trong văn viết.","Nối danh từ thì dùng 和/跟, KHÔNG dùng 并且: ✗ 我买了苹果并且香蕉 → ✓ 我买了苹果和香蕉。","Lỗi hay gặp: ✗ 他很聪明并且他姐姐很漂亮 (hai chủ ngữ khác nhau, không cùng hướng) → ✓ 他很聪明，并且很努力。"],"e":[["希望能及时发现问题，并且准确地找到解决问题的方法。","Xīwàng néng jíshí fāxiàn wèntí, bìngqiě zhǔnquè de zhǎodào jiějué wèntí de fāngfǎ.","Hy vọng có thể phát hiện vấn đề kịp thời, đồng thời tìm ra chính xác cách giải quyết. <i>(bài khoá 1)</i>"]],"d":[["今天天气不好，并且下雨！_____________________。","所以我们只好留在家里"],["每天做好预习和复习，并且多说，多听，_________________。","就一定能学好汉语"],["很多人都选择坐地铁上下班，_________________。","方便，并且不堵车"]],"w":"并且 nối hai vế CÙNG chiều; nếu hai vế trái ngược nhau phải dùng 但是/相反."},{"id":"dui-yu","t":"对于……（来说）","s":"đối với… (mà nói)","b":"<b>对于</b> là giới từ, dẫn ra <b>đối tượng hoặc phạm vi</b> mà hành động/thái độ hướng tới. Cụm 对于 + N thường đứng <b>đầu câu</b> (có dấu phẩy) hoặc đứng <b>trước động từ</b>. Dạng <b>对于……来说</b> nghĩa là “xét từ góc độ của ai/cái gì”.","r":["Vị trí: 对于 + N + 主语 + V…  hoặc 主语 + 对于 + N + V…","Trạng ngữ như 越来越、比较、非常 đặt SAU cụm 对于……: 现在人们对于自然环境越来越注意保护了。","对于 nhấn mạnh đối tượng tác động; 关于 nêu nội dung, chủ đề (thường làm định ngữ: 关于……的书/新闻).","Lỗi hay gặp: ✗ 关于老师来说，最难的是…… → ✓ 对于老师来说，最难的是……"],"e":[["那您认为对于老师来说，什么是最难做到的？","Nà nín rènwéi duìyú lǎoshī lái shuō, shénme shì zuì nán zuòdào de?","Vậy theo thầy, đối với một người giáo viên thì điều gì là khó làm được nhất? <i>(bài khoá 3)</i>"]],"d":[["__________这个问题，你应该在认真地考虑一下。","对于/关于"],["______这方面的情况，大家最好上网去查一查。","关于"],["现在人们，_____自然环境越来越注意保护了。","对于"],["昨天在报纸上看到一篇______这位明星的新闻，才知道她竟然还只是一位在校大学生。","关于"]],"w":"关于 có thể đứng làm tiêu đề bài viết (关于……的问题), 对于 thì không; ngược lại chỉ có 对于……来说 chứ không có ✗关于……来说."},{"id":"trung-diep-danh-luong-tu","t":"名词/量词重叠：人人、本本、年年……＋都","s":"lặp danh từ/lượng từ để chỉ “mỗi… đều…”","b":"Một số <b>danh từ hoặc lượng từ đơn âm</b> có thể lặp lại (AA) để mang nghĩa <b>“mỗi một… đều”, “tất cả”</b>: 人人 (mọi người), 本本 (quyển nào cũng), 年年 (năm nào cũng), 天天, 家家. Vế sau thường có <b>都</b> hô ứng.","r":["Công thức: AA + 都 + V/Adj (人人都会…、本本都让我笑).","Dạng lặp này làm chủ ngữ hoặc trạng ngữ thời gian (年年举行), KHÔNG làm tân ngữ: ✗ 我认识人人 → ✓ 我认识每个人。","Không phải danh từ nào cũng lặp được; chỉ dùng với các từ quen thuộc: 人人、天天、年年、次次、个个、本本。","Lỗi hay gặp: ✗ 学生学生都来了 (từ hai âm tiết không lặp kiểu này) → ✓ 每个学生都来了。"],"e":[["人人都会使用语言，但是怎么用语言把话说好却是一门艺术。","Rénrén dōu huì shǐyòng yǔyán, dànshì zěnme yòng yǔyán bǎ huà shuō hǎo què shì yì mén yìshù.","Ai cũng biết dùng ngôn ngữ, nhưng dùng ngôn ngữ sao cho nói hay lại là cả một nghệ thuật. <i>(bài khoá 4)</i>"]],"d":[["只要你想要改变，___________________________。","人人都可以变得越来越优秀"],["这个作家的语言很幽默，__________________________。","他的书本本都让我不停地笑"],["我们学校年年举行校园招聘会，__________________________。","这为找工作的毕业生提供了很多机会"]],"w":"Phân biệt với lặp động từ (看看 = thử một chút): lặp danh/lượng từ mang nghĩa “toàn bộ”, còn lặp động từ làm nhẹ ngữ khí."},{"id":"xiang-fan","t":"相反","s":"trái lại, ngược lại","b":"<b>相反</b> vừa là tính từ (“trái ngược”: 意见相反), vừa dùng như <b>liên từ đầu vế sau</b> để nêu tình huống ngược hẳn với vế trước, thường viết <b>相反，……</b> có dấu phẩy.","r":["Vị trí: 分句1，相反，分句2。 (đứng đầu vế sau, tách bằng dấu phẩy)","Làm vị ngữ: A 和 B 正好相反 / 他们的看法相反。","Hai vế phải thật sự đối lập nhau về nội dung, không chỉ khác nhau.","Lỗi hay gặp: ✗ 我不喜欢咖啡，相反喜欢茶 (chỉ là lựa chọn khác) → ✓ 姐姐很少说话，相反，我很喜欢聊天。"],"e":[["相反，如果方法不对，可能花五倍甚至十倍的时间都不能完成任务，结果变成“事倍功半”。","Xiāngfǎn, rúguǒ fāngfǎ bú duì, kěnéng huā wǔ bèi shènzhì shí bèi de shíjiān dōu bù néng wánchéng rènwu, jiéguǒ biànchéng “shì bèi gōng bàn”.","Ngược lại, nếu phương pháp không đúng thì có khi bỏ ra gấp năm, thậm chí gấp mười thời gian vẫn không xong nhiệm vụ, kết quả thành “bỏ nhiều công mà được ít”. <i>(bài khoá 5)</i>"]],"d":[["一个正确的选择，往往是成功的开始，___________________________。","相反，一个错误的选择，往往会失败"],["姐姐非常安静，很少说话，__________________________。","相反，我很喜欢聊天"],["老年人总是喜欢回忆自己的过去，_______________________。","相反年轻人总是面对未来"]],"w":"相反 nối hai câu đối lập; 但是 chỉ nêu sự chuyển ý nhẹ. Có 相反 thì thường bỏ 但是."},{"id":"ji-shi-ye","t":"即使……也……","s":"cho dù… thì cũng…","b":"<b>即使</b> nêu một giả thiết hoặc một sự nhượng bộ (chưa xảy ra hoặc chỉ là giả định), vế sau bắt buộc có <b>也</b> để nói kết quả <b>không thay đổi</b>. Nghĩa gần với 就算……也……, trang trọng hơn.","r":["Cùng chủ ngữ: 即使 + tình huống，(主语) 也 + V。Khác chủ ngữ: 即使 + 主语1……，主语2 也……","也 KHÔNG được bỏ: ✗ 即使很难，我会做 → ✓ 即使很难，我也会做。","即使 dùng cho việc giả định/chưa xảy ra; 虽然 dùng cho việc CÓ THẬT: 虽然很难，但是我做完了。","Lỗi hay gặp: ✗ 即使他昨天来了，也…… → ✓ 虽然他昨天来了，但是……"],"e":[["即使是别人的缺点，他也会直接说出来。","Jíshǐ shì biéren de quēdiǎn, tā yě huì zhíjiē shuō chūlai.","Cho dù là khuyết điểm của người khác, anh ta cũng nói thẳng ra. <i>(bài khoá 4)</i>"]],"d":[],"w":"Nhớ cặp cố định: 即使……也……, 虽然……但是……. Trộn lẫn (✗即使……但是……) là lỗi rất hay gặp trong đề HSK4."},{"id":"wu-lun-dou","t":"无论……都/也……","s":"bất kể… đều…","b":"<b>无论</b> nêu điều kiện <b>bất kỳ</b>, vế sau dùng <b>都</b> (hoặc 也) để nói kết quả không đổi. Sau 无论 phải là thành phần mang tính <b>không xác định</b>: đại từ nghi vấn (谁、什么、怎么、多少) hoặc kết cấu lựa chọn (A 还是 B / 好不好).","r":["Công thức: 无论 + 疑问词/A还是B，主语 + 都/也 + V。","Sau 无论 không được dùng thành phần xác định: ✗ 无论这件事，我都做 → ✓ 无论什么事，我都做。","无论 thiên về văn viết; khẩu ngữ hay dùng 不管; 不论 dùng như 无论.","Lỗi hay gặp: quên 都/也 ở vế sau: ✗ 无论做什么事情，要注意方法 → ✓ 无论做什么事情，都要注意方法。"],"e":[["无论做什么事情，都要注意方法，学习尤其是这样。","Wúlùn zuò shénme shìqing, dōu yào zhùyì fāngfǎ, xuéxí yóuqí shì zhèyàng.","Làm bất cứ việc gì cũng phải chú ý đến phương pháp, học tập lại càng như vậy. <i>(bài khoá 5)</i>"]],"d":[],"w":"无论……都…… (bất kể điều kiện nào) khác 不但……而且…… (tăng tiến) và khác 只要……就…… (một điều kiện đủ)."},{"id":"dong-tu-trung-diep","t":"动词重叠：VV / V一V / ABAB","s":"lặp động từ — làm nhẹ ngữ khí, “thử một chút”","b":"Lặp động từ diễn tả hành động <b>diễn ra trong thời gian ngắn</b>, mang ý “thử xem”, khiến lời nói <b>nhẹ nhàng, lịch sự</b> hơn. Động từ một âm tiết lặp thành <b>AA</b> hoặc <b>A一A</b> (走走 / 走一走); động từ hai âm tiết lặp thành <b>ABAB</b> (商量商量、谈谈 là dạng AA của 谈).","r":["Một âm tiết: 走走、看看、想想; hai âm tiết: 商量商量、休息休息 (KHÔNG phải ✗商商量量).","Âm tiết lặp lại đọc nhẹ (khinh thanh): shāngliang shāngliang.","Thường dùng khi đề nghị, xin phép, nói giảm cho lịch sự.","Lỗi hay gặp: ✗ 我商量商量了 (đã lặp thì không thêm 了 kiểu này) → ✓ 我们商量了一下。"],"e":[["好，我再跟同事商量商量。","Hǎo, wǒ zài gēn tóngshì shāngliang shāngliang.","Được, tôi sẽ bàn bạc thêm với đồng nghiệp một chút. <i>(bài khoá 1)</i>"],["你能详细谈谈对我的课的看法吗？","Nǐ néng xiángxì tántan duì wǒ de kè de kànfǎ ma?","Cô có thể nói tỉ mỉ hơn một chút về cảm nhận của cô đối với tiết học của tôi không? <i>(bài khoá 3)</i>"]],"d":[["A: 刚才手机没电了，听说你打电话找我了，有什么事吗？\n B: 大家在教室里_____晚会节目的事情呢，就差你了。","商量"]],"w":"Lặp động từ chỉ dùng cho hành động chủ động; động từ trạng thái như 是、知道、认识 không lặp được."},{"id":"ye-xu","t":"也许","s":"có lẽ, biết đâu","b":"<b>也许</b> là phó từ chỉ sự <b>phỏng đoán</b>, mức độ chắc chắn không cao. Nó đứng <b>đầu câu</b> hoặc <b>trước động từ/tính từ</b>, thường đi kèm 会、能、就 ở phía sau.","r":["Vị trí: 也许 + 主语 + V  hoặc 主语 + 也许 + V。","Hay kết hợp: 也许会……、也许能……、也许就……","Không dùng 也许 trong câu hỏi chính danh: ✗ 他也许来吗？ → ✓ 他会不会来？","Lỗi hay gặp: đặt sau động từ ✗ 他来也许 → ✓ 他也许来。"],"e":[["也许这样就能找到解决问题的方法了。","Yěxǔ zhèyàng jiù néng zhǎodào jiějué wèntí de fāngfǎ le.","Có lẽ làm như vậy là sẽ tìm ra được cách giải quyết vấn đề. <i>(bài khoá 1)</i>"],["别人的方法也许很有效，但是并不一定适合自己。","Biéren de fāngfǎ yěxǔ hěn yǒuxiào, dànshì bìng bù yídìng shìhé zìjǐ.","Phương pháp của người khác có lẽ rất hiệu quả, nhưng chưa chắc đã hợp với mình. <i>(bài khoá 5)</i>"]],"d":[["如果你觉得心烦，可以吃点儿蛋糕或者巧克力，这些甜的东西______会给你带来好心情。","也许"]],"w":"也许 = phỏng đoán (có lẽ); 一定 = khẳng định chắc chắn; 恐怕 = phỏng đoán nhưng mang sắc thái lo lắng, điều không mong muốn."},{"id":"nan-dao","t":"难道……吗？","s":"chẳng lẽ…? lẽ nào…?","b":"<b>难道</b> dùng trong <b>câu hỏi tu từ</b> (phản vấn) để nhấn mạnh, người nói không thật sự hỏi mà bày tỏ sự <b>ngạc nhiên, nghi ngờ</b>. Cuối câu thường có <b>吗/不成</b>. Câu 难道 dạng khẳng định mang nghĩa phủ định và ngược lại.","r":["Vị trí: 难道 đứng đầu câu hoặc sau chủ ngữ: 难道你不知道吗？／你难道不知道吗？","难道 + khẳng định = ý phủ định; 难道 + phủ định = ý khẳng định.","Có thể lược 吗 khi ngữ khí đã rõ, nhưng trong HSK4 nên giữ đủ 难道……吗？","Lỗi hay gặp: dùng để hỏi thật ✗ 难道他是老师吗？我不认识他 → dùng 他是老师吗？"],"e":[["难道它还能让衣服不掉颜色？","Nándào tā hái néng ràng yīfu bú diào yánsè?","Chẳng lẽ nó còn có thể làm cho quần áo không bị phai màu sao? <i>(bài khoá 2)</i>"]],"d":[],"w":"Câu 难道 không cần trả lời 是/不是; đừng nhầm với câu hỏi 吗 thông thường."},{"id":"zai-ye","t":"再……也……","s":"dù… đến mấy thì cũng… — câu giả thiết nhượng bộ","b":"Cấu trúc <b>再……也……</b> dùng trong câu giả thiết nhượng bộ, mang nghĩa “cho dù, dù thế nào đi nữa”. Sau <b>再</b> có thể là động từ, tính từ hoặc cả một cụm; vế sau dùng <b>也</b> để nêu kết quả không thay đổi. Ý nghĩa gần với 即使……也…… và 无论怎么……也……。","r":["Khung: 再 + động từ/tính từ (+ 久/多/怎么)，(chủ ngữ) 也 + kết quả。VD: 你再后悔也无法改变。","再 ở đây <b>không</b> có nghĩa “lại, thêm nữa” mà là “dù… đến mấy”: 穿得再久 = dù mặc lâu đến mấy.","Vế sau bắt buộc dùng 也, không thay bằng 就: ✗ 你再后悔就无法改变 → ✓ 你再后悔也无法改变。","Hay đi cùng 不管/无论 ở đầu câu: 不管别人再怎么不同意，也应该说出来。"],"e":[["用盐水来洗新衣服，这样穿得再久、洗的次数再多，衣服也不容易掉颜色。","Yòng yánshuǐ lái xǐ xīn yīfu, zhèyàng chuān de zài jiǔ, xǐ de cìshù zài duō, yīfu yě bù róngyì diào yánsè.","Dùng nước muối để giặt quần áo mới, như vậy dù mặc lâu đến mấy, giặt nhiều lần đến mấy, quần áo cũng không dễ phai màu. <i>(bài khoá 2)</i>"],["事情已经发生了，你再后悔也无法改变，别伤心了。","Shìqing yǐjīng fāshēng le, nǐ zài hòuhuǐ yě wúfǎ gǎibiàn, bié shāngxīn le.","Chuyện đã xảy ra rồi, cậu có hối hận đến mấy cũng không thay đổi được, đừng buồn nữa."],["如果我们有什么看法或者意见，不管别人再怎么不同意、不支持，也应该说出来。","Rúguǒ wǒmen yǒu shénme kànfǎ huòzhě yìjiàn, bùguǎn biéren zài zěnme bù tóngyì, bù zhīchí, yě yīnggāi shuō chūlai.","Nếu chúng ta có cách nhìn hay ý kiến gì, dù người khác có phản đối, không ủng hộ đến mấy, cũng nên nói ra."]],"d":[["如果一个人不积极、不努力，____________。","别人再帮他也没有用。"],["同学们只要平时认真学习，____________。","考试题再难也不用担心。"],["有些事情过去了就过去了，不要后悔，____________。","你再难过也改变不了过去。"]],"w":"Đừng dịch 再 ở đây thành “lại/nữa”; và nhớ vế sau phải có 也 thì câu nhượng bộ mới trọn nghĩa."}],"notes":"1) Bài khoá 2 (slide 29) BỊ THIẾU chữ Hán ở phần cuối: bản pinyin của slide còn 3-4 lượt thoại nữa (女儿 nói về việc muối có tác dụng giữ màu áo và kiến thức ngoài sách vở; 高老师 nói về việc tìm câu trả lời từ cuộc sống, cách dùng nước muối giặt áo mới), nhưng slide không có chữ Hán tương ứng nên KHÔNG bổ sung — để thiếu đúng như dữ liệu. 2) Vì phần thiếu đó, điểm ngữ pháp 再怎么……也…… / 再+Adj+也 (căn cứ từ drills: “再怎么后悔也没办法”, “再难的考试也可以通过”) không có ví dụ nguyên văn trong bài khoá hiện có nên KHÔNG đưa vào mục grammar. 3) Slide 48 và 57 (bài khoá 4, 5) không ghi tiêu đề tiếng Trung -> title_zh để rỗng. 4) Các slide 20, 28, 40, 47 chỉ là câu hỏi đọc hiểu, đã loại khỏi phần bài khoá. 5) Các câu ở slide 22, 30, 31, 49, 50 là câu bài tập 练一练, đã dùng làm drill/ví dụ từ vựng chứ không tính là bài khoá. 6) Drills có xuất hiện 关于, 信用卡, 勺(子) nhưng không nằm trong danh sách từ mới của bài nên không đưa vào vocab_ex (关于 được giảng trong phần so sánh với 对于). 7) Từ 无 và 无法 không xuất hiện trong phần chữ Hán còn lại của bài khoá (无法 vốn nằm ở đoạn bị thiếu của bài khoá 2), nên câu ví dụ của hai từ này do người soạn tự đặt, không phải câu bài khoá. Câu ví dụ của 作用 và 保护 lấy từ câu bài tập 练一练 (đã điền đáp án), cũng không phải câu bài khoá; 30 câu ví dụ còn lại đều là nguyên văn trích từ bài khoá.","order":[{"z":"听说这次生意你到现在还没谈成。","t":["听说","这次","生意","你","到","现在","还","没谈成"],"v":"Nghe nói vụ làm ăn lần này đến giờ anh vẫn chưa thương lượng xong."},{"z":"盐不是用来做饭的吗？","t":["盐","不是","用来","做饭","的","吗"],"v":"Cho muối ạ? Muối chẳng phải để nấu ăn sao? Chẳng lẽ nó còn giữ được cho quần áo khỏi phai màu?"},{"z":"难道它还能让衣服不掉颜色？","t":["难道","它","还","能","让","衣服","不","掉","颜色"],"v":"Cho muối ạ? Muối chẳng phải để nấu ăn sao? Chẳng lẽ nó còn giữ được cho quần áo khỏi phai màu?"},{"z":"实际上，很多问题的答案都可以从生活中找到。","t":["实际上","很多","问题","的","答案","都","可以","从","生活","中","找到"],"v":"Thực ra, đáp án của rất nhiều vấn đề đều có thể tìm thấy từ cuộc sống. Nhưng điều đó cần con dùng mắt để phát hiện, dùng tâm để đú"},{"z":"但这需要你用眼睛去发现，用心去总结。","t":["但","这","需要","你","用","眼睛","去","发现","用心","去","总结"],"v":"Thực ra, đáp án của rất nhiều vấn đề đều có thể tìm thấy từ cuộc sống. Nhưng điều đó cần con dùng mắt để phát hiện, dùng tâm để đú"},{"z":"你能详细谈谈对我的课的看法吗？","t":["你","能","详细","谈谈","对","我","的","课","的","看法","吗"],"v":"Cảm ơn cô! Cô có thể nói tỉ mỉ hơn về cảm nhận của cô với tiết học của tôi không?"},{"z":"那您认为对于老师来说，什么是最难做到的？","t":["那","您","认为","对于","老师","来说","什么","是","最难","做到","的"],"v":"Vậy theo thầy, đối với một người giáo viên thì điều gì là khó làm được nhất?"},{"z":"希望能及时发现问题，并且准确地找到解决问题的方法。","t":["希望","能","及时发现","问题","并且","准确","地","找到","解决问题","的","方法"],"v":"Hy vọng có thể phát hiện vấn đề kịp thời, đồng thời tìm ra chính xác cách giải quyết. (bài khoá 1)"},{"z":"即使是别人的缺点，他也会直接说出来。","t":["即使","是","别人","的","缺点","他","也","会","直接","说","出来"],"v":"Cho dù là khuyết điểm của người khác, anh ta cũng nói thẳng ra. (bài khoá 4)"},{"z":"好，我再跟同事商量商量。","t":["好","我","再","跟","同事","商量","商量"],"v":"Được, tôi sẽ bàn bạc thêm với đồng nghiệp một chút. (bài khoá 1)"},{"z":"也许这样就能找到解决问题的方法了。","t":["也许","这样","就","能","找到","解决问题","的","方法","了"],"v":"Có lẽ làm như vậy là sẽ tìm ra được cách giải quyết vấn đề. (bài khoá 1)"},{"z":"别人的方法也许很有效，但是并不一定适合自己。","t":["别人","的","方法","也许","很","有效","但是","并不一定","适合","自己"],"v":"Phương pháp của người khác có lẽ rất hiệu quả, nhưng chưa chắc đã hợp với mình. (bài khoá 5)"},{"z":"公司规定九点以前必须到。","t":["公司","规定","九点","以前","必须","到"],"v":"Công ty quy định trước chín giờ phải có mặt."},{"z":"你别把话说得太死，事情还没决定。","t":["你别","把","话","说","得","太","死","事情","还","没","决定"],"v":"Cậu đừng nói chắc như đinh đóng cột, việc vẫn chưa quyết mà."},{"z":"很可惜，那天我没能去看比赛。","t":["很","可惜","那天","我","没能","去","看","比赛"],"v":"Thật đáng tiếc, hôm đó tôi không đi xem trận đấu được."},{"z":"这些书全部都是我姐姐的。","t":["这些","书","全部都是","我","姐姐","的"],"v":"Những cuốn sách này toàn bộ đều là của chị tôi."}]},"13":{"n":13,"tz":"喝着茶看京剧","tv":"Kinh kịch và văn hoá truyền thống Trung Quốc","batches":[[{"h":"京剧","p":"jīng jù","v":"Kinh kịch","ez":"我奶奶每天晚上都听 n."},{"h":"袋子","p":"dài zi","v":"Túi","ez":"这个袋子太小，放不下这些水果。","ey":"Zhège dàizi tài xiǎo, fàng bu xià zhèxiē shuǐguǒ.","ev":"Cái túi này nhỏ quá, không đựng hết chỗ hoa quả này."}],[{"h":"随着","p":"suí zhe","v":"Cùng với","ez":"随着天气变冷，来公园的人少了。","ey":"Suízhe tiānqì biàn lěng, lái gōngyuán de rén shǎo le.","ev":"Cùng với việc trời lạnh dần, người đến công viên ít đi."},{"h":"十分","p":"shí fēn","v":"Rất, vô cùng","ez":"他对这份工作十分满意。","ey":"Tā duì zhè fèn gōngzuò shífēn mǎnyì.","ev":"Anh ấy rất hài lòng với công việc này."},{"h":"普遍","p":"pǔ biàn","v":"Phổ biến","ez":"用手机付钱现在已经很普遍了。","ey":"Yòng shǒujī fù qián xiànzài yǐjīng hěn pǔbiàn le.","ev":"Trả tiền bằng điện thoại giờ đã rất phổ biến."},{"h":"部分","p":"bù fen","v":"Phần, bộ phận","ez":"这些照片有一部分是我拍的。","ey":"Zhèxiē zhàopiàn yǒu yí bùfen shì wǒ pāi de.","ev":"Trong số ảnh này có một phần là tôi chụp."},{"h":"稍微","p":"shāo wēi","v":"Hơi","ez":"这个菜稍微有点儿咸。","ey":"Zhège cài shāowēi yǒudiǎnr xián.","ev":"Món này hơi mặn một chút."},{"h":"苦","p":"kǔ","v":"Đắng","ez":"这杯咖啡太苦了，我喝不下去。","ey":"Zhè bēi kāfēi tài kǔ le, wǒ hē bu xiàqù.","ev":"Cốc cà phê này đắng quá, tôi uống không nổi."},{"h":"省","p":"shěng","v":"Tỉnh","ez":"我朋友的老家在山东省。","ey":"Wǒ péngyou de lǎojiā zài Shāndōng Shěng.","ev":"Quê bạn tôi ở tỉnh Sơn Đông."},{"h":"广东省","p":"guǎng dōng shěng","v":"Tỉnh Quảng Đông","ez":"我下个月要去广东省出差。","ey":"Wǒ xià ge yuè yào qù Guǎngdōng Shěng chūchāi.","ev":"Tháng sau tôi phải đi công tác ở tỉnh Quảng Đông."}]],"texts":[{"no":1,"tz":"小雨和小夏在聊小夏的爷爷表演京剧的情况","tv":"Tiểu Vũ và Tiểu Hạ trò chuyện về việc ông của Tiểu Hạ biểu diễn Kinh kịch","lines":[{"s":"小雨","z":"小夏，你爷爷京剧唱得真专业，我还以为他是京剧演员呢。","p":"Xiǎo Xià, nǐ yéye jīngjù chàng de zhēn zhuānyè, wǒ hái yǐwéi tā shì jīngjù yǎnyuán ne.","v":"Tiểu Hạ này, ông cậu hát Kinh kịch chuyên nghiệp thật đấy, tớ còn tưởng ông là diễn viên Kinh kịch cơ."},{"s":"小夏","z":"对啊，他本来就是京剧演员，年轻时在我们那儿很有名，深受观众们的喜爱。","p":"Duì a, tā běnlái jiù shì jīngjù yǎnyuán, niánqīng shí zài wǒmen nàr hěn yǒumíng, shēn shòu guānzhòngmen de xǐ'ài.","v":"Đúng vậy, ông tớ vốn dĩ là diễn viên Kinh kịch mà, hồi trẻ rất nổi tiếng ở chỗ tớ, được khán giả hết sức yêu mến."},{"s":"小雨","z":"你爷爷一定对京剧有着很深厚的感情。","p":"Nǐ yéye yídìng duì jīngjù yǒuzhe hěn shēnhòu de gǎnqíng.","v":"Ông cậu chắc chắn có tình cảm rất sâu đậm với Kinh kịch."},{"s":"小夏","z":"是呀，他8岁就开始上台演出，到现在大概唱了60多年了，他对这门艺术的喜爱从来没有改变过。","p":"Shì a, tā bā suì jiù kāishǐ shàngtái yǎnchū, dào xiànzài dàgài chàng le liùshí duō nián le, tā duì zhè mén yìshù de xǐ'ài cónglái méiyǒu gǎibiàn guo.","v":"Ừ, ông tớ mới 8 tuổi đã bắt đầu lên sân khấu biểu diễn, tính đến giờ hát cũng khoảng hơn 60 năm rồi, tình yêu của ông với bộ môn nghệ thuật này chưa bao giờ thay đổi."},{"s":"小雨","z":"这么说你喜欢听京剧也是受了你爷爷的影响？","p":"Zhème shuō nǐ xǐhuan tīng jīngjù yě shì shòu le nǐ yéye de yǐngxiǎng?","v":"Nói vậy thì việc cậu thích nghe Kinh kịch cũng là do ảnh hưởng từ ông cậu à?"},{"s":"小夏","z":"我小时候经常去看他的演出。平时他还给我讲很多京剧里的历史故事，让我学到了很多知识。","p":"Wǒ xiǎo shíhou jīngcháng qù kàn tā de yǎnchū. Píngshí tā hái gěi wǒ jiǎng hěn duō jīngjù lǐ de lìshǐ gùshi, ràng wǒ xué dào le hěn duō zhīshi.","v":"Hồi nhỏ tớ thường đi xem ông biểu diễn. Ngày thường ông còn kể cho tớ nhiều câu chuyện lịch sử trong Kinh kịch, giúp tớ học được rất nhiều kiến thức."}]},{"no":2,"tz":"小雨和马克在聊京剧","tv":"Tiểu Vũ và Mark trò chuyện về Kinh kịch","lines":[{"s":"小雨","z":"真没想到你一个来自美国的外国留学生，能把京剧唱得这么好。","p":"Zhēn méi xiǎngdào nǐ yí ge láizì Měiguó de wàiguó liúxuéshēng, néng bǎ jīngjù chàng de zhème hǎo.","v":"Thật không ngờ một lưu học sinh nước ngoài đến từ Mỹ như cậu lại hát Kinh kịch hay đến thế."},{"s":"马克","z":"我常常跟着电视学唱京剧，然后一遍一遍地练习，偶尔跟中国人一起唱上几句。","p":"Wǒ chángcháng gēnzhe diànshì xué chàng jīngjù, ránhòu yí biàn yí biàn de liànxí, ǒu'ěr gēn Zhōngguó rén yìqǐ chàng shang jǐ jù.","v":"Tớ thường xem tivi học hát Kinh kịch, rồi luyện đi luyện lại từng lượt, thỉnh thoảng hát vài câu cùng người Trung Quốc."},{"s":"小雨","z":"难道你从来没有接受过京剧方面的专门教育吗？","p":"Nándào nǐ cónglái méiyǒu jiēshòu guo jīngjù fāngmiàn de zhuānmén jiàoyù ma?","v":"Chẳng lẽ cậu chưa từng được đào tạo bài bản về Kinh kịch sao?"},{"s":"马克","z":"别吃惊，因为我以前学习过音乐，有一些音乐基础，又对京剧这种表演艺术非常感兴趣，所以能比较容易地学会它的唱法。","p":"Bié chījīng, yīnwèi wǒ yǐqián xuéxí guo yīnyuè, yǒu yìxiē yīnyuè jīchǔ, yòu duì jīngjù zhè zhǒng biǎoyǎn yìshù fēicháng gǎn xìngqù, suǒyǐ néng bǐjiào róngyì de xuéhuì tā de chàngfǎ.","v":"Đừng kinh ngạc, vì trước đây tớ từng học nhạc, có chút nền tảng âm nhạc, lại rất hứng thú với loại hình nghệ thuật biểu diễn như Kinh kịch, nên học cách hát của nó cũng khá dễ dàng."},{"s":"小雨","z":"你真厉害！竟然连很多中国人都听不懂的京剧也能学会。我还是比较喜欢听流行音乐。","p":"Nǐ zhēn lìhai! Jìngrán lián hěn duō Zhōngguó rén dōu tīng bu dǒng de jīngjù yě néng xuéhuì. Wǒ háishi bǐjiào xǐhuan tīng liúxíng yīnyuè.","v":"Cậu giỏi thật đấy! Kinh kịch mà nhiều người Trung Quốc còn nghe không hiểu, thế mà cậu lại học được. Tớ thì vẫn thích nghe nhạc pop hơn."},{"s":"马克","z":"那是你不了解京剧的唱法。在音乐方面，京剧给了我很多新的想法。我还把京剧的一些特点增加到了自己的音乐中，达到了很好的效果。","p":"Nà shì nǐ bù liǎojiě jīngjù de chàngfǎ. Zài yīnyuè fāngmiàn, jīngjù gěi le wǒ hěn duō xīn de xiǎngfǎ. Wǒ hái bǎ jīngjù de yìxiē tèdiǎn zēngjiā dào le zìjǐ de yīnyuè zhōng, dádào le hěn hǎo de xiàoguǒ.","v":"Là vì cậu chưa hiểu cách hát của Kinh kịch thôi. Về mặt âm nhạc, Kinh kịch đã cho tớ rất nhiều ý tưởng mới. Tớ còn đưa một số đặc điểm của Kinh kịch vào âm nhạc của mình, và đạt được hiệu quả rất tốt."}]},{"no":3,"tz":"李老师和校长在谈工作","tv":"Cô Lý và thầy hiệu trưởng bàn về công việc","lines":[{"s":"李老师","z":"校长，因为外国留学生不了解中国文化，有时候会影响他们和中国人之间的正常交流，甚至还可能引起误会，带来麻烦，所以我们想申请举办一次中国传统文化节活动。","p":"Xiàozhǎng, yīnwèi wàiguó liúxuéshēng bù liǎojiě Zhōngguó wénhuà, yǒu shíhou huì yǐngxiǎng tāmen hé Zhōngguó rén zhījiān de zhèngcháng jiāoliú, shènzhì hái kěnéng yǐnqǐ wùhuì, dàilái máfan, suǒyǐ wǒmen xiǎng shēnqǐng jǔbàn yí cì Zhōngguó chuántǒng wénhuà jié huódòng.","v":"Thưa thầy hiệu trưởng, vì lưu học sinh nước ngoài chưa hiểu văn hoá Trung Quốc nên đôi khi ảnh hưởng đến việc giao tiếp bình thường giữa họ với người Trung Quốc, thậm chí còn có thể gây hiểu lầm, dẫn đến phiền phức, nên chúng em muốn xin phép tổ chức một lễ hội văn hoá truyền thống Trung Quốc."},{"s":"校长","z":"你们的想法很好，举办文化节活动，一方面能让各国学生更好地了解中国，另一方面也能为学生们提供互相交流和学习的机会。","p":"Nǐmen de xiǎngfǎ hěn hǎo, jǔbàn wénhuà jié huódòng, yì fāngmiàn néng ràng gè guó xuésheng gèng hǎo de liǎojiě Zhōngguó, lìng yì fāngmiàn yě néng wèi xuéshengmen tígōng hùxiāng jiāoliú hé xuéxí de jīhuì.","v":"Ý tưởng của các em rất hay. Tổ chức lễ hội văn hoá, một mặt giúp sinh viên các nước hiểu Trung Quốc hơn, mặt khác cũng tạo cho các em cơ hội giao lưu và học hỏi lẫn nhau."},{"s":"李老师","z":"谢谢您的支持！","p":"Xièxie nín de zhīchí!","v":"Cảm ơn thầy đã ủng hộ ạ!"},{"s":"校长","z":"上次的春游活动你们办得非常有趣，大家都玩儿得很开心，这次活动继续由你负责，相信也一定会很成功。","p":"Shàng cì de chūnyóu huódòng nǐmen bàn de fēicháng yǒuqù, dàjiā dōu wánr de hěn kāixīn, zhè cì huódòng jìxù yóu nǐ fùzé, xiāngxìn yě yídìng huì hěn chénggōng.","v":"Hoạt động du xuân lần trước các em tổ chức rất thú vị, mọi người đều chơi rất vui, hoạt động lần này vẫn tiếp tục do em phụ trách, thầy tin chắc cũng sẽ rất thành công."},{"s":"李老师","z":"我们回去就开会讨论，星期五之前把详细的计划书发给您。","p":"Wǒmen huíqu jiù kāihuì tǎolùn, xīngqīwǔ zhīqián bǎ xiángxì de jìhuàshū fā gěi nín.","v":"Chúng em về là sẽ họp bàn ngay, trước thứ Sáu sẽ gửi bản kế hoạch chi tiết cho thầy."},{"s":"校长","z":"好的，准备过程中有什么问题，你们可以直接来找我。","p":"Hǎo de, zhǔnbèi guòchéng zhōng yǒu shénme wèntí, nǐmen kěyǐ zhíjiē lái zhǎo wǒ.","v":"Được, trong quá trình chuẩn bị có vấn đề gì thì các em cứ đến tìm thầy trực tiếp."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"筷子在中国大约已经有3000多年的历史了。","p":"Kuàizi zài Zhōngguó dàyuē yǐjīng yǒu sānqiān duō nián de lìshǐ le.","v":"Đũa đã có khoảng hơn 3000 năm lịch sử ở Trung Quốc."},{"s":"","z":"对外国人来说，使用筷子吃饭并不容易，所以，国外的一些中国餐厅在放筷子的纸袋上会提供使用筷子的详细说明。","p":"Duì wàiguó rén lái shuō, shǐyòng kuàizi chīfàn bìng bù róngyì, suǒyǐ, guówài de yìxiē Zhōngguó cāntīng zài fàng kuàizi de zhǐdài shang huì tígōng shǐyòng kuàizi de xiángxì shuōmíng.","v":"Với người nước ngoài, dùng đũa để ăn cơm không hề dễ, vì vậy một số nhà hàng Trung Quốc ở nước ngoài in hướng dẫn dùng đũa chi tiết ngay trên túi giấy đựng đũa."},{"s":"","z":"不过，如果你认为每个中国人都会正确使用筷子，那就错了。","p":"Búguò, rúguǒ nǐ rènwéi měi ge Zhōngguó rén dōu huì zhèngquè shǐyòng kuàizi, nà jiù cuò le.","v":"Nhưng nếu bạn cho rằng người Trung Quốc nào cũng biết dùng đũa đúng cách thì bạn đã nhầm."},{"s":"","z":"有人在互联网上专门进行过调查，结果发现每六个中国人中就有一个使用筷子的方法是错误的。","p":"Yǒu rén zài hùliánwǎng shang zhuānmén jìnxíng guo diàochá, jiéguǒ fāxiàn měi liù ge Zhōngguó rén zhōng jiù yǒu yí ge shǐyòng kuàizi de fāngfǎ shì cuòwù de.","v":"Có người đã tiến hành hẳn một cuộc khảo sát trên Internet, kết quả phát hiện cứ sáu người Trung Quốc thì có một người cầm đũa sai cách."},{"s":"","z":"如果你想正确使用筷子，那就好好练习吧。","p":"Rúguǒ nǐ xiǎng zhèngquè shǐyòng kuàizi, nà jiù hǎohāor liànxí ba.","v":"Nếu bạn muốn dùng đũa cho đúng thì hãy luyện tập cho tử tế nhé."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"茶在中国有几千年的历史，是中国最常见的饮料。","p":"Chá zài Zhōngguó yǒu jǐ qiān nián de lìshǐ, shì Zhōngguó zuì chángjiàn de yǐnliào.","v":"Trà có mấy nghìn năm lịch sử ở Trung Quốc, là thức uống thường gặp nhất của người Trung Quốc."},{"s":"","z":"最早的时候，茶只是被当作一种药，而不是饮料。","p":"Zuì zǎo de shíhou, chá zhǐshì bèi dàngzuò yì zhǒng yào, ér bú shì yǐnliào.","v":"Thời kỳ đầu, trà chỉ được coi là một loại thuốc chứ không phải đồ uống."},{"s":"","z":"后来，随着人们对茶的认识的加深，慢慢开始把它当作解渴的饮料，这才慢慢有了中国的茶文化。","p":"Hòulái, suízhe rénmen duì chá de rènshi de jiāshēn, mànman kāishǐ bǎ tā dàngzuò jiěkě de yǐnliào, zhè cái mànman yǒu le Zhōngguó de chá wénhuà.","v":"Về sau, cùng với sự hiểu biết ngày càng sâu của người ta về trà, người ta dần coi nó là thức uống giải khát, từ đó mới dần hình thành văn hoá trà của Trung Quốc."},{"s":"","z":"在中国，喝茶是一种十分普遍的生活习惯。","p":"Zài Zhōngguó, hē chá shì yì zhǒng shífēn pǔbiàn de shēnghuó xíguàn.","v":"Ở Trung Quốc, uống trà là một thói quen sinh hoạt vô cùng phổ biến."},{"s":"","z":"对很多中国人来说，喝茶已成为他们生活中不可缺少的一部分。","p":"Duì hěn duō Zhōngguó rén lái shuō, hē chá yǐ chéngwéi tāmen shēnghuó zhōng bùkě quēshǎo de yí bùfen.","v":"Với nhiều người Trung Quốc, uống trà đã trở thành một phần không thể thiếu trong cuộc sống của họ."},{"s":"","z":"但是有的饮料虽然名字叫“茶”，却并不是真正的茶。","p":"Dànshì yǒude yǐnliào suīrán míngzi jiào “chá”, què bìng bú shì zhēnzhèng de chá.","v":"Nhưng có những thức uống tuy tên gọi là “trà”, thực ra lại không phải trà thật."},{"s":"","z":"比如广东省的人爱喝的“凉茶”，它的味道稍微有点儿苦，其实是一种用中药做成的饮料。","p":"Bǐrú Guǎngdōng Shěng de rén ài hē de “liángchá”, tā de wèidào shāowēi yǒudiǎnr kǔ, qíshí shì yì zhǒng yòng zhōngyào zuòchéng de yǐnliào.","v":"Ví dụ như “lương trà” mà người tỉnh Quảng Đông thích uống, vị của nó hơi đắng một chút, thực ra là một loại đồ uống nấu từ thuốc Bắc."}]}],"gram":[{"id":"you-nguoi-phu-trach","t":"(事情) + 由 + 人/单位 + 动词","s":"do ai đứng ra làm / chịu trách nhiệm","b":"<b>由</b> dùng để chỉ rõ <b>ai là người thực hiện hoặc chịu trách nhiệm</b> một việc. Cụm <b>由 + người</b> luôn đứng <b>trước động từ</b>, làm trạng ngữ; sự việc được nói đến thường đưa lên đầu câu làm chủ đề.","r":["Trật tự cố định: (Sự việc) + 由 + người/đơn vị + động từ. VD: 这次活动由你负责。","由 nhấn mạnh NGƯỜI đảm nhiệm, còn 被 nhấn mạnh chủ ngữ bị tác động: ✗ 这次活动被你负责 → ✓ 这次活动由你负责。","Hay đi kèm 继续/也/都: 继续由你负责、这次也由小夏组织吧。","Dạng nhấn mạnh 是……由……的: 这篇文章是由李先生写的。"],"e":[["这次活动继续由你负责，相信也一定会很成功。","Zhè cì huódòng jìxù yóu nǐ fùzé, xiāngxìn yě yídìng huì hěn chénggōng.","Hoạt động lần này vẫn do em phụ trách, tin rằng chắc chắn cũng sẽ rất thành công. <i>(bài khoá 3)</i>"]],"d":[["这件事不是马经理专门负责吗？________","他已经离开公司了，现在由李经理负责。"],["这篇文章是介绍京剧的，___________","是由李先生写的。"],["上次的秋游活动小夏组织得不错，大家都玩儿得很高兴，______","这次也由小夏组织吧。"]],"w":"Đừng nhầm 由 (do ai làm) với 从 (từ đâu — chỉ điểm xuất phát về nơi chốn/thời gian): ✓ 从北京出发 / ✓ 由他负责。"},{"id":"jinxing-tien-hanh","t":"进行 + 双音节动词/名词（调查、讨论、研究……）","s":"tiến hành (một hoạt động chính thức, có tổ chức)","b":"<b>进行</b> nghĩa là “tiến hành”, dùng để đưa một hoạt động <b>trang trọng, có tổ chức và kéo dài</b> vào câu. Sau 进行 bắt buộc là <b>động từ hoặc danh từ hai âm tiết</b> mang sắc thái trang trọng.","r":["✓ 进行调查/讨论/研究/交流/比较；✗ 进行吃饭、进行看书 (việc sinh hoạt thường ngày không dùng 进行).","Sau 进行 KHÔNG mang tân ngữ chỉ người/vật: ✗ 进行调查这个问题 → ✓ 对这个问题进行调查。","进行 mang được 了/过/着 và cụm 在……中: 进行过调查、手续还在进行中。"],"e":[["有人在互联网上专门进行过调查，结果发现每六个中国人中就有一个使用筷子的方法是错误的。","Yǒu rén zài hùliánwǎng shang zhuānmén jìnxíng guo diàochá, jiéguǒ fāxiàn měi liù ge Zhōngguó rén zhōng jiù yǒu yí ge shǐyòng kuàizi de fāngfǎ shì cuòwù de.","Có người đã tiến hành hẳn một cuộc khảo sát trên Internet, kết quả phát hiện cứ sáu người Trung Quốc thì có một người dùng đũa sai cách. <i>(bài khoá 4)</i>"]],"d":[["都六点了，会议怎么还没结束？__________","会议还会进行半个小时。"],["听说你要申请去国外留学，准备得怎么样了？___________","手续还在进行中。"],["我们学校去年进行了针对大学毕业生就业方向问题的调查，______","结果发现，在接受调查的学生中，有超过80%的人希望自己能有机会出国留学，但这其中只有大约20%的人开始申请国外学校。"]],"w":"Phân biệt: 进行 (tiến hành một hoạt động) — 举行 (cử hành sự kiện: 举行婚礼/比赛) — 举办 (đứng ra tổ chức: 举办文化节活动, có trong bài khoá 3)."},{"id":"suizhe-cung-voi","t":"随着 + 名词短语，……","s":"cùng với (sự phát triển/thay đổi của…), thì…","b":"<b>随着</b> đứng ở <b>đầu câu</b>, nêu ra một quá trình biến đổi làm tiền đề; vế sau nói kết quả thay đổi theo. Sau 随着 thường là cụm “N + 的 + danh động từ”: 随着……的发展 / 的提高 / 的加深 / 的加快。","r":["Sau 随着 phải là CỤM DANH TỪ, không phải mệnh đề đầy đủ: ✗ 随着经济发展了 → ✓ 随着经济的发展。","Vế sau thường có 越来越……、慢慢……、一直在变 để diễn tả sự biến đổi song hành.","随着 nói về xu thế; 跟着 nói về việc đi theo/làm theo ai (bài khoá 2: 跟着电视学唱京剧)."],"e":[["后来，随着人们对茶的认识的加深，慢慢开始把它当做解渴的饮料。","Hòulái, suízhe rénmen duì chá de rènshi de jiāshēn, mànman kāishǐ bǎ tā dàngzuò jiěkě de yǐnliào.","Về sau, cùng với sự hiểu biết ngày càng sâu của người ta về trà, người ta dần bắt đầu coi nó là thức uống giải khát. <i>(bài khoá 5)</i>"]],"d":[["随着互联网的发展，_______","越来越多的人喜欢在网上写日记。"],["随着时代的发展，美的标准一直在变。___________","过去有的时候人们以胖为美，现在的人以瘦为美。"],["小时候，我们往往会有许多浪漫的理想。但是随着生活节奏的加快，_________","我们天天忙于工作和生活，那些梦慢慢地离我们远去了。"]],"w":"随着 không đứng sau chủ ngữ: ✗ 我们随着经济的发展生活变好了 → ✓ 随着经济的发展，我们的生活变好了。"},{"id":"ouer-thinh-thoang","t":"偶尔 + (还/也/会) + 动词","s":"thỉnh thoảng, đôi khi (tần suất rất thấp)","b":"<b>偶尔</b> là phó từ chỉ tần suất <b>rất thấp</b>. Nó đứng <b>sau chủ ngữ, trước động từ</b> (hoặc trước các phó từ 还/也/会). Câu dùng 偶尔 thường đi kèm một câu nói về thói quen thường xuyên ở phía trước để tạo thế tương phản.","r":["Vị trí: chủ ngữ + 偶尔 + (还/也/会) + động từ. VD: 偶尔还会去做瑜伽。","Thang tần suất: 从来不 < 偶尔 < 有时候 < 经常/常常 < 总是。","偶尔 là phó từ, không trực tiếp làm định ngữ cho danh từ: ✗ 偶尔的事情 → ✓ 偶然的事情。"],"e":[["我常常跟着电视学唱京剧，然后一遍一遍地练习，偶尔跟中国人一起唱上几句。","Wǒ chángcháng gēnzhe diànshì xué chàng jīngjù, ránhòu yí biàn yí biàn de liànxí, ǒu'ěr gēn Zhōngguó rén yìqǐ chàng shang jǐ jù.","Tôi thường xem tivi học hát Kinh kịch, rồi luyện đi luyện lại, thỉnh thoảng hát vài câu cùng người Trung Quốc. <i>(bài khoá 2)</i>"]],"d":[["为了减肥，我几乎每天晚上都坚持跑步_______","偶尔还会去做瑜伽。"],["我平时上班忙，很少有时间运动。但是周末我会约朋友们见面，一块儿去打篮球或者踢足球，________","偶尔下雨的时候，在家休息一下。"],["她和丈夫很少在家吃饭。平时上班的时候两个人都在公司吃，周末不上班的时候就一起去饭馆儿吃，________","偶尔在家做做饭。"]],"w":"偶尔 (thỉnh thoảng — nói về tần suất) khác 偶然 (tình cờ, ngẫu nhiên — nói về tính bất ngờ): 偶然遇到一个老朋友。"},{"id":"luong-tu-bian","t":"动词 + 数量 + 遍（一遍、两遍；一遍一遍地……）","s":"lượng từ chỉ số lần làm trọn vẹn một việc từ đầu đến cuối","b":"<b>遍</b> là lượng từ động tác, nhấn mạnh hành động được làm <b>trọn vẹn từ đầu đến cuối</b>: 看一遍、听两遍、检查一遍。Nó đứng <b>sau động từ</b>, trước tân ngữ (nếu có).","r":["Có tân ngữ: động từ + 了/一 + 遍 + tân ngữ, hoặc đưa tân ngữ lên trước: 这篇文章我读了一遍。","遍 nhấn mạnh trọn vẹn một lượt; 次 chỉ đếm số lần xảy ra: 这本书我看了三遍 (đọc trọn 3 lượt) ≠ 我去过三次北京 (đi 3 lần).","Cấu trúc lặp 一遍一遍地 + động từ = làm đi làm lại nhiều lượt.","Lỗi hay gặp: ✗ 我去过三遍北京 → ✓ 我去过三次北京。"],"e":[["我常常跟着电视学唱京剧，然后一遍一遍地练习。","Wǒ chángcháng gēnzhe diànshì xué chàng jīngjù, ránhòu yí biàn yí biàn de liànxí.","Tôi thường xem tivi học hát Kinh kịch, rồi luyện đi luyện lại hết lượt này đến lượt khác. <i>(bài khoá 2)</i>"]],"d":[["A：材料整理好了没？ B：差不多了，我再检查一_____就给您送过去。","遍"]],"w":"Với động từ không thể “làm từ đầu đến cuối” (去、来、见面) thì dùng 次, không dùng 遍."},{"id":"shaowei-shifen-muc-do","t":"稍微 + 形容词 + 一点儿/一下 ↔ 十分 + 形容词","s":"hai đầu của thang mức độ: “hơi một chút” và “vô cùng”","b":"<b>稍微</b> chỉ mức độ <b>rất nhẹ</b> (“hơi, một chút”), <b>十分</b> chỉ mức độ <b>rất cao</b> (“vô cùng, hết sức”, trang trọng hơn 非常). Cả hai đều là phó từ, đứng <b>trước tính từ/động từ</b>.","r":["稍微 phía sau bắt buộc có 一点儿/有点儿/一些/一下: ✓ 稍微有点儿苦、稍微休息一下；✗ 稍微苦。","十分 + tính từ hoặc động từ tâm lý: 十分普遍、十分感谢、十分喜欢。Không dùng 十分 trước danh từ.","稍微 hay đi với 有点儿 mang sắc thái không như ý (苦、贵、累), còn “形容词 + 一点儿” mang sắc thái trung tính hoặc mong muốn: 便宜一点儿。"],"e":[["比如广东省的人爱喝的“凉茶”，它的味道稍微有点儿苦。","Bǐrú Guǎngdōng Shěng de rén ài hē de “liángchá”, tā de wèidào shāowēi yǒudiǎnr kǔ.","Ví dụ như “lương trà” mà người tỉnh Quảng Đông thích uống, vị của nó hơi đắng một chút. <i>(bài khoá 5)</i>"],["在中国，喝茶是一种十分普遍的生活习惯。","Zài Zhōngguó, hē chá shì yì zhǒng shífēn pǔbiàn de shēnghuó xíguàn.","Ở Trung Quốc, uống trà là một thói quen sinh hoạt vô cùng phổ biến. <i>(bài khoá 5)</i>"]],"d":[["A：孙小姐，我们大概什么时候出发？ B：大家先回房间_____休息一下，半个小时后我们楼下集合。","稍微"],["凉茶虽然味道_____，但对身体很有好处。另外，凉茶热着喝效果也很不错。","苦"],["很多大学生毕业后，选择的第一个职业，往往和自己的专业没什么关系，这种情况现在越来越_____。","普遍"]],"w":"普遍 là tính từ (“phổ biến”), thường dùng với 很/十分/越来越 và làm định ngữ 普遍的现象; đừng nhầm với 普通 (“bình thường, thông thường”): 普通人、普通话."},{"id":"jixu-tiep-tuc","t":"继续 + 动词/动词短语","s":"tiếp tục (làm việc đang dở)","b":"<b>继续</b> nghĩa là “tiếp tục”, đứng <b>trước động từ</b> làm trạng ngữ, hoặc tự làm động từ chính. Nó nhấn mạnh việc đang làm dở nay được làm tiếp.","r":["继续 + động từ (cụm): 继续读书、继续练习、继续留在北京、继续由你负责。","Phủ định đặt trước 继续: 不继续/没继续 + động từ (✗ 继续不学习).","继续 (làm tiếp việc đang dở) khác 接着 (nối ngay sau đó, nhấn vào trình tự): 他说完，我接着说。"],"e":[["上次的春游活动你们办得非常有趣，大家都玩儿得很开心，这次活动继续由你负责。","Shàng cì de chūnyóu huódòng nǐmen bàn de fēicháng yǒuqù, dàjiā dōu wánr de hěn kāixīn, zhè cì huódòng jìxù yóu nǐ fùzé.","Hoạt động du xuân lần trước các em tổ chức rất thú vị, mọi người đều chơi rất vui, hoạt động lần này vẫn tiếp tục do em phụ trách. <i>(bài khoá 3)</i>"]],"d":[["A：你想好了没？是_____读书还是参加工作？ B：我考虑过了，我想先工作两年，然后再考研究生。","继续"]],"w":"Sau 继续 là động từ, không phải danh từ đơn thuần: ✗ 继续学校 → ✓ 继续上学。"},{"id":"yifangmian-lingyifangmian","t":"一方面……，另一方面（也/还）……","s":"một mặt…, mặt khác…","b":"Cấu trúc dùng để liệt kê <b>hai mặt song song</b> của cùng một sự việc (thường là hai lợi ích, hai lý do). Hai từ nối đứng ở <b>đầu mỗi vế</b>, vế sau thường thêm 也/还 để hô ứng.","r":["Hai vế phải cùng nói về một chủ thể/sự việc đã nêu ở trước.","Vế sau thường có 也/还: 另一方面也能……。","Khác 一边……一边…… (hai hành động diễn ra ĐỒNG THỜI): ✗ 一方面走路一方面听音乐 → ✓ 一边走路一边听音乐。"],"e":[["举办文化节活动，一方面能让各国学生更好地了解中国，另一方面也能为学生们提供互相交流和学习的机会。","Jǔbàn wénhuà jié huódòng, yì fāngmiàn néng ràng gè guó xuésheng gèng hǎo de liǎojiě Zhōngguó, lìng yì fāngmiàn yě néng wèi xuéshengmen tígōng hùxiāng jiāoliú hé xuéxí de jīhuì.","Tổ chức lễ hội văn hoá, một mặt giúp sinh viên các nước hiểu Trung Quốc hơn, mặt khác cũng tạo cho các em cơ hội giao lưu và học hỏi lẫn nhau. <i>(bài khoá 3)</i>"]],"d":[],"w":"Chú ý vế hai là 另一方面, không phải 别的方面; và 一方面 ở đây đọc là “yì fāngmiàn”."},{"id":"nandao-cau-phan-van","t":"难道……吗？（并 竟然 / 连……都……）","s":"chẳng lẽ… sao? — câu phản vấn nhấn mạnh sự ngạc nhiên","b":"<b>难道……吗？</b> là câu phản vấn dùng để nhấn mạnh sự ngạc nhiên hoặc nghi ngờ, dịch là “chẳng lẽ… sao?”. Trong bài khoá còn có hai cách nói cùng sắc thái “ngoài dự đoán”: <b>竟然</b> (thế mà, không ngờ) và <b>连……都/也……</b> (đến cả… cũng…).","r":["难道 đứng đầu câu hoặc ngay sau chủ ngữ, cuối câu thường có 吗: 难道你不知道吗？/ 你难道不知道吗？","Câu 难道 mang hình thức phủ định thì ý là khẳng định, và ngược lại.","连……都/也……: đưa đối tượng bất ngờ nhất ra sau 连, phía sau bắt buộc có 都 hoặc 也 (✗ 连他不知道 → ✓ 连他都不知道)。","竟然 là phó từ, đứng trước động từ/tính từ: 竟然能学会。"],"e":[["难道你从来没有接受过京剧方面的专门教育吗？","Nándào nǐ cónglái méiyǒu jiēshòu guo jīngjù fāngmiàn de zhuānmén jiàoyù ma?","Chẳng lẽ cậu chưa từng được đào tạo bài bản về Kinh kịch sao? <i>(bài khoá 2)</i>"],["竟然连很多中国人都听不懂的京剧也能学会。","Jìngrán lián hěn duō Zhōngguó rén dōu tīng bu dǒng de jīngjù yě néng xuéhuì.","Thế mà Kinh kịch nhiều người Trung Quốc còn nghe không hiểu, cậu lại học được. <i>(bài khoá 2)</i>"]],"d":[],"w":"难道 chỉ dùng trong câu hỏi tu từ (người nói đã biết câu trả lời), không dùng khi thật sự muốn hỏi thông tin."},{"id":"dagai-yexu","t":"大概（辨析：大概 / 也许）","s":"khoảng chừng, chắc là — ước lượng và suy đoán","b":"<b>大概</b> là phó từ, chỉ sự <b>ước lượng không chính xác</b> về số lượng, thời gian (“khoảng, chừng”), hoặc <b>suy đoán</b> về tình huống với khả năng khá cao (“chắc là, hẳn là”). 大概 còn có thể làm <b>tính từ</b> với nghĩa “đại khái, chung chung, không chi tiết”. 大概 và 也许 đều là phó từ suy đoán, nhưng 大概 chắc chắn hơn 也许 nhiều.","r":["Ước lượng số lượng/thời gian: 大概 + số lượng。VD: 大概唱了60多年了、大概有三分之二的人。Chỗ này <b>không</b> dùng 也许。","Suy đoán tình huống: 大概 đứng trước động từ hoặc 会/是: 我想校长大概会同意。Mức độ khẳng định của 大概 mạnh hơn 也许.","Làm tính từ thì phải có 的: 大概的想法、大概的内容; 也许 không có cách dùng này.","Nói về dự định chưa chắc của chính mình thì chỉ dùng 也许: ✓ 也许以后我会成为一名记者 → ✗ 大概以后我会成为一名记者。"],"e":[["他8岁就开始上台演出，到现在大概唱了60多年了，他对这门艺术的喜爱从来没有改变过。","Tā bā suì jiù kāishǐ shàngtái yǎnchū, dào xiànzài dàgài chàngle liùshí duō nián le, tā duì zhè mén yìshù de xǐ'ài cónglái méiyǒu gǎibiànguo.","Ông ấy 8 tuổi đã bắt đầu lên sân khấu biểu diễn, tính đến giờ hát cũng khoảng hơn 60 năm rồi, tình yêu của ông với môn nghệ thuật này chưa từng thay đổi. <i>(bài khoá 1)</i>"],["你的这个关于举办传统文化节活动的计划，我想校长大概会同意。","Nǐ de zhège guānyú jǔbàn chuántǒng wénhuà jié huódòng de jìhuà, wǒ xiǎng xiàozhǎng dàgài huì tóngyì.","Kế hoạch tổ chức hoạt động lễ hội văn hoá truyền thống này của cô, tôi nghĩ hiệu trưởng chắc là sẽ đồng ý."],["不管做什么事情，最好提前做计划，不用安排得特别详细，但必须有一个大概的想法。","Bùguǎn zuò shénme shìqing, zuìhǎo tíqián zuò jìhuà, búyòng ānpái de tèbié xiángxì, dàn bìxū yǒu yí ge dàgài de xiǎngfǎ.","Làm việc gì cũng vậy, tốt nhất nên lên kế hoạch trước, không cần sắp xếp thật chi tiết, nhưng phải có một ý tưởng đại khái."]],"d":[["A：师傅，我去火车站。____________？ B：现在不堵车，估计二十分钟就能到。","大概要多长时间"],["A：请问附近有银行吗？ B：有一个交通银行，____________。","从这儿走过去大概十分钟"],["读书应该有选择，有些书只要快速阅读____________，有些书却需要多花些时间来仔细阅读。","了解大概的内容就可以了"]],"w":"大概 và 也许 giống nhau ở chỗ đều suy đoán, nhưng chỉ 大概 ước lượng được số lượng (✓ 大概有三分之二的人 / ✗ 也许有三分之二的人), và chỉ 也许 nói được về dự định chưa chắc của bản thân."}],"notes":"1) Bài khoá chỉ lấy từ các slide 课文 có chữ Hán thật: bài 1 (slide 25+26), bài 2 (slide 34+35), bài 3 (slide 44+45), bài 4 (slide 52), bài 5 (slide 60). Không thêm bất kỳ câu tiếng Trung nào ngoài dữ liệu. 2) Slide 43 và slide 51 chỉ là câu hỏi đọc hiểu (为什么……？/……是什么？) nên đã loại, không tính là bài khoá. 3) Slide 36, 53, 62 là nội dung 练一练 (选词填空/hoàn thành đoạn), không phải bài khoá — đã dùng làm drill. 4) Slide 34 bản chữ Hán bị lỗi OCR “有一些因为基础”; bản pinyin cùng slide ghi “yǒu yì xiē yīn yuè jī chǔ”, nên đã khôi phục thành “有一些音乐基础”. 5) Slide 52 và 60 không có tiêu đề trên slide; tiêu đề 筷子 / 茶 là do người soạn đặt theo nội dung. 6) Bản pinyin trong slide bị đảo thứ tự dòng và sai chính tả (vd. jing jù, xi'ài, shí fen, jìng xíng), đã đánh lại toàn bộ pinyin theo chuẩn có dấu thanh. 7) Trường “vi” của từ 进行 trong dữ liệu gốc bị lỗi (ghi “jìng xíng”); nghĩa đúng theo slide 练一练 là “Tiến hành, thực hiện” — dữ liệu gốc giữ nguyên, không sửa. 8) Đáp án 选词填空 trên slide thiếu 2 ô: “这本小说这么_____” và “凉茶虽然味道_____” — theo bài khoá và ngữ cảnh, đáp án là 厚 và 苦 (đã ghi vào drill của điểm ngữ pháp mức độ, riêng ô 厚 không đưa vào vì không có đáp án gốc). 9) Slide 45 dữ liệu gốc dính liền lượt thoại của 李老师 và 校长 trên một dòng, đã tách lại theo bản pinyin. 10) Hai điểm ngữ pháp 一方面……另一方面…… và 难道……吗？ không có slide 练一练 tương ứng nên trường drill để rỗng, ví dụ lấy nguyên văn từ bài khoá 3 và bài khoá 2.","order":[{"z":"你爷爷一定对京剧有着很深厚的感情。","t":["你","爷爷","一定","对","京剧","有着","很","深厚","的","感情"],"v":"Ông cậu chắc chắn có tình cảm 道宾馆里有。你不是一直说要保护环境吗？现在就从身边的小事做起吧。","p":"Wǒ dāngrán zhīdào bīnguǎn lǐ yǒu. Nǐ bú shì yìzhí shuō yào bǎohù huánjìng ma? Xiànzài jiù cóng shēnbiān de xiǎoshì zuòqǐ ba.","v":"Em đương nhiên biết khách sạn có chứ. Anh chẳng phải vẫn luôn nói phải bảo vệ môi trường sao? Vậy thì bắt đầu ngay từ những việc nhỏ quanh mình đi."},{"s":"李进","z":"行，没问题。我明天上午10点的飞机，你能开车把我送到机场吗？","p":"Xíng, méi wèntí. Wǒ míngtiān shàngwǔ shí diǎn de fēijī, nǐ néng kāichē bǎ wǒ sòng dào jīchǎng ma?","v":"Được, không vấn đề gì. Chuyến bay của anh 10 giờ sáng mai, em lái xe đưa anh ra sân bay được không?"},{"s":"王静","z":"那个时间路上堵车多严重啊！你还是坐地铁去机场吧。这样不仅省油钱，而且还不会污染空气。","p":"Nàge shíjiān lùshang dǔchē duō yánzhòng a! Nǐ háishi zuò dìtiě qù jīchǎng ba. Zhèyàng bùjǐn shěng yóuqián, érqiě hái bú huì wūrǎn kōngqì.","v":"Giờ đó ngoài đường tắc kinh khủng luôn ấy! Anh cứ đi tàu điện ngầm ra sân bay đi. Như vậy vừa tiết kiệm tiền xăng, lại còn không làm ô nhiễm không khí."},{"s":"李进","z":"好，那就听你的。","p":"Hǎo, nà jiù tīng nǐ de.","v":"Được, vậy thì nghe theo em."}]},{"no":2,"tz":"经理和服务员在谈工作","tv":"Giám đốc và nhân viên phục vụ đang nói chuyện công việc","lines":[{"s":"经理","z":"小王，卫生间怎么那么脏啊？这会给客人留下不好的印象。快去打扫一下。","p":"Xiǎo Wáng, wèishēngjiān zěnme nàme zāng a? Zhè huì gěi kèrén liúxià bù hǎo de yìnxiàng. Kuài qù dǎsǎo yíxià.","v":"Tiểu Vương, sao nhà vệ sinh bẩn thế? Cái này sẽ để lại ấn tượng không tốt cho khách đấy. Mau đi dọn dẹp một chút đi."},{"s":"服务员","z":"经理，实在抱歉。今天店里太忙了，我还没来得及打扫。","p":"Jīnglǐ, shízài bàoqiàn. Jīntiān diàn lǐ tài máng le, wǒ hái méi láidejí dǎsǎo.","v":"Giám đốc, em thật sự xin lỗi. Hôm nay quán đông quá, em chưa kịp dọn ạ."},{"s":"经理","z":"那张桌子下面还有一些空饮料瓶子和纸盒子。","p":"Nà zhāng zhuōzi xiàmiàn hái yǒu yìxiē kōng yǐnliào píngzi hé zhǐ hézi.","v":"Dưới cái bàn kia vẫn còn mấy vỏ chai nước rỗng với hộp giấy nữa."},{"s":"服务员","z":"好的，我马上就去把它们扔掉。","p":"Hǎo de, wǒ mǎshàng jiù qù bǎ tāmen rēngdiào.","v":"Vâng ạ, em đi vứt chúng ngay đây."},{"s":"经理","z":"以后你一定得注意这个问题，不管客人多多，生意多忙，我们都要保证餐厅干净卫生。","p":"Yǐhòu nǐ yídìng děi zhùyì zhège wèntí, bùguǎn kèrén duō duō, shēngyi duō máng, wǒmen dōu yào bǎozhèng cāntīng gānjìng wèishēng.","v":"Sau này cậu nhất định phải chú ý chuyện này, bất kể khách đông thế nào, việc buôn bán bận ra sao, chúng ta đều phải bảo đảm nhà hàng sạch sẽ vệ sinh."},{"s":"服务员","z":"经理您放心，我一定以最快的速度完成。不过咱们真的应该再多招聘几个服务员了。","p":"Jīnglǐ nín fàngxīn, wǒ yídìng yǐ zuì kuài de sùdù wánchéng. Búguò zánmen zhēn de yīnggāi zài duō zhāopìn jǐ ge fúwùyuán le.","v":"Giám đốc cứ yên tâm, em nhất định sẽ hoàn thành với tốc độ nhanh nhất. Có điều mình thật sự nên tuyển thêm mấy nhân viên phục vụ nữa ạ."}]},{"no":3,"tz":"孙月和王静在聊关于环保的事情","tv":"Tôn Nguyệt và Vương Tĩnh đang nói chuyện về bảo vệ môi trường","lines":[{"s":"孙月","z":"早上听新闻说明天有一个叫“地球一小时”的活动，你对这个活动了解吗？","p":"Zǎoshang tīng xīnwén shuō míngtiān yǒu yí ge jiào “Dìqiú Yì Xiǎoshí” de huódòng, nǐ duì zhège huódòng liǎojiě ma?","v":"Sáng nay nghe tin tức nói mai có một hoạt động tên là “Giờ Trái Đất”, cậu có biết gì về hoạt động này không?"},{"s":"王静","z":"这个活动年年都有，最早是从2007年开始的。明天晚上很多人都会关灯一小时，支持这个活动。你没看到门口的通知吗？我们公司也参加。","p":"Zhège huódòng niánnián dōu yǒu, zuì zǎo shì cóng èr líng líng qī nián kāishǐ de. Míngtiān wǎnshang hěn duō rén dōu huì guān dēng yì xiǎoshí, zhīchí zhège huódòng. Nǐ méi kàndào ménkǒu de tōngzhī ma? Wǒmen gōngsī yě cānjiā.","v":"Hoạt động này năm nào cũng có, sớm nhất là bắt đầu từ năm 2007. Tối mai rất nhiều người sẽ tắt đèn một tiếng để ủng hộ hoạt động này. Cậu không thấy thông báo ở cửa à? Công ty mình cũng tham gia đấy."},{"s":"孙月","z":"真的吗？太好了！既然明天晚上公司会关灯停电，那么我们肯定不用加班了。","p":"Zhēn de ma? Tài hǎo le! Jìrán míngtiān wǎnshang gōngsī huì guān dēng tíng diàn, nàme wǒmen kěndìng búyòng jiābān le.","v":"Thật à? Tuyệt quá! Đã tối mai công ty tắt đèn cắt điện thì chắc chắn tụi mình khỏi phải tăng ca rồi."},{"s":"王静","z":"看你得意的样子！还以为你高兴是为了支持环保，原来是因为不用加班啊！","p":"Kàn nǐ déyì de yàngzi! Hái yǐwéi nǐ gāoxìng shì wèile zhīchí huánbǎo, yuánlái shì yīnwèi búyòng jiābān a!","v":"Nhìn cái vẻ đắc ý của cậu kìa! Cứ tưởng cậu vui vì ủng hộ bảo vệ môi trường, hoá ra là vì khỏi phải tăng ca!"},{"s":"孙月","z":"环境保护我当然也支持了！对了，为什么会有这么一个活动啊？","p":"Huánjìng bǎohù wǒ dāngrán yě zhīchí le! Duì le, wèishénme huì yǒu zhème yí ge huódòng a?","v":"Bảo vệ môi trường thì đương nhiên tớ cũng ủng hộ chứ! À mà, sao lại có một hoạt động như vậy nhỉ?"},{"s":"王静","z":"其实目的挺简单的，就是提醒人们节约用电，希望引起人们对气候变暖问题的关注。","p":"Qíshí mùdì tǐng jiǎndān de, jiùshì tíxǐng rénmen jiéyuē yòng diàn, xīwàng yǐnqǐ rénmen duì qìhòu biàn nuǎn wèntí de guānzhù.","v":"Thật ra mục đích khá đơn giản, chính là nhắc mọi người tiết kiệm điện, mong thu hút sự quan tâm của mọi người tới vấn đề khí hậu ấm lên."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"塑料袋给人们的生活带来方便，受到人们的普遍欢迎，可是，它的大量使用也带来了严重的环境污染问题。","p":"Sùliàodài gěi rénmen de shēnghuó dàilái fāngbiàn, shòudào rénmen de pǔbiàn huānyíng, kěshì, tā de dàliàng shǐyòng yě dàilái le yánzhòng de huánjìng wūrǎn wèntí.","v":"Túi nilông mang lại sự tiện lợi cho cuộc sống con người, được mọi người ưa chuộng rộng rãi, thế nhưng việc dùng nó với số lượng lớn cũng gây ra vấn đề ô nhiễm môi trường nghiêm trọng."},{"s":"","z":"于是，一些国家规定，超市、商场不能为顾客提供免费塑料袋，并且鼓励大家购买可以多次使用的购物袋。我们每个人都有责任保护环境，因此，请大家节约使用塑料袋，或者购物时自备购物袋，甚至拒绝使用塑料袋。","p":"Yúshì, yìxiē guójiā guīdìng, chāoshì, shāngchǎng bù néng wèi gùkè tígōng miǎnfèi sùliàodài, bìngqiě gǔlì dàjiā gòumǎi kěyǐ duō cì shǐyòng de gòuwùdài. Wǒmen měi ge rén dōu yǒu zérèn bǎohù huánjìng, yīncǐ, qǐng dàjiā jiéyuē shǐyòng sùliàodài, huòzhě gòuwù shí zìbèi gòuwùdài, shènzhì jùjué shǐyòng sùliàodài.","v":"Thế là một số nước quy định siêu thị, trung tâm thương mại không được phát túi nilông miễn phí cho khách, đồng thời khuyến khích mọi người mua loại túi có thể dùng nhiều lần, hoặc tự mang túi khi đi mua sắm, thậm chí từ chối dùng túi nilông."},{"s":"","z":"虽然这是一件很小的事，但这样做可以减少塑料袋的使用数量，对环境保护有很大的作用。","p":"Suīrán zhè shì yí jiàn hěn xiǎo de shì, dàn zhèyàng zuò kěyǐ jiǎnshǎo sùliàodài de shǐyòng shùliàng, duì huánjìng bǎohù yǒu hěn dà de zuòyòng.","v":"Tuy đây là một việc rất nhỏ, nhưng làm như vậy có thể giảm bớt số lượng túi nilông được dùng, có tác dụng rất lớn đối với việc bảo vệ môi trường."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"保护地球环境，并不是一件离我们很远、很难做到的事情。","p":"Bǎohù dìqiú huánjìng, bìng bú shì yí jiàn lí wǒmen hěn yuǎn, hěn nán zuòdào de shìqing.","v":"Bảo vệ môi trường Trái Đất hoàn toàn không phải là chuyện xa vời hay khó làm được."},{"s":"","z":"实际上，我们只需注意一下身边的小事，就可以。","p":"Shíjì shang, wǒmen zhǐ xū zhùyì yíxià shēnbiān de xiǎoshì, jiù kěyǐ.","v":"Thực tế, chúng ta chỉ cần để ý một chút tới những việc nhỏ quanh mình là được."},{"s":"","z":"例如，夏天把空调的温度开得高一些，出门时记得关空调和电脑，这样可以节约用电；","p":"Lìrú, xiàtiān bǎ kōngtiáo de wēndù kāi de gāo yìxiē, chūmén shí jìde guān kōngtiáo hé diànnǎo, zhèyàng kěyǐ jiéyuē yòng diàn;","v":"Ví dụ, mùa hè để nhiệt độ điều hoà cao lên một chút, ra khỏi nhà nhớ tắt điều hoà và máy tính, như vậy có thể tiết kiệm điện;"},{"s":"","z":"少开车，多骑车或者乘坐地铁和公共汽车，这样能降低空气污染；","p":"shǎo kāichē, duō qíchē huòzhě chéngzuò dìtiě hé gōnggòng qìchē, zhèyàng néng jiàngdī kōngqì wūrǎn;","v":"bớt lái xe, đạp xe nhiều hơn hoặc đi tàu điện ngầm và xe buýt, như vậy có thể giảm ô nhiễm không khí;"},{"s":"","z":"还有养成把垃圾丢进垃圾桶的习惯什么的。","p":"háiyǒu yǎngchéng bǎ lājī diū jìn lājītǒng de xíguàn shénme de.","v":"rồi thì tập thói quen bỏ rác vào thùng rác, v.v."},{"s":"","z":"这些是我们每个人都能够做到的小事，但却有实实在在的效果。","p":"Zhèxiē shì wǒmen měi ge rén dōu nénggòu zuòdào de xiǎoshì, dàn què yǒu shíshízàizài de xiàoguǒ.","v":"Đây đều là những việc nhỏ mà mỗi người chúng ta đều làm được, nhưng lại có hiệu quả thật sự."},{"s":"","z":"地球是我们共同的家，只有大家共同努力，减少污染、保护环境，才能使我们的家变得更美丽。","p":"Dìqiú shì wǒmen gòngtóng de jiā, zhǐyǒu dàjiā gòngtóng nǔlì, jiǎnshǎo wūrǎn, bǎohù huánjìng, cái néng shǐ wǒmen de jiā biàn de gèng měilì.","v":"Trái Đất là ngôi nhà chung của chúng ta, chỉ khi mọi người cùng chung sức, giảm ô nhiễm, bảo vệ môi trường, thì ngôi nhà ấy mới trở nên đẹp đẽ hơn."}]}],"gram":[{"id":"ba-zi-ju","t":"把 + 宾语 + 动词 + 到/进/掉/得……","s":"Câu chữ 把 – nói rõ “xử lí đồ vật đó thế nào, kết quả ra sao”","b":"Bài này dày đặc câu chữ <b>把</b>. Khi muốn nói <b>làm gì đó với một vật đã xác định</b> và nhấn mạnh <b>kết quả/hướng đi</b> của vật ấy, tiếng Trung bắt buộc phải đưa vật đó lên trước động từ bằng <b>把</b>. Sau động từ luôn phải có thêm một thành phần (到/进/掉/得/了/一下…), không được để động từ đứng trơ trọi.","r":["Trật tự: Chủ ngữ + 把 + tân ngữ (đã xác định) + động từ + thành phần bổ sung. Ví dụ: 把它们放<b>到</b>箱子里 / 把它们扔<b>掉</b> / 把垃圾丢<b>进</b>垃圾桶 / 把温度开<b>得</b>高一些。","Tân ngữ sau 把 phải là vật người nghe đã biết (它们、那个盒子、垃圾), không dùng cho vật chung chung: ✗ 我把一个盒子扔掉了 → ✓ 我把那个盒子扔掉了。","Động từ năng nguyện (能/会/要/得/想) và phủ định 不/没 đặt TRƯỚC 把, không đặt sau: ✗ 你把我能送到机场吗？→ ✓ 你<b>能</b>把我送到机场吗？","Động từ trong câu 把 phải có tính “tác động, xử lí”. Các từ như 是、有、知道、喜欢、觉得 không dùng được: ✗ 我把这件事知道了。"],"e":[["把它们放到箱子里吧。","Bǎ tāmen fàng dào xiāngzi lǐ ba.","Cho chúng vào va li đi. <i>(bài khoá 1)</i>"],["你能开车把我送到机场吗？","Nǐ néng kāichē bǎ wǒ sòng dào jīchǎng ma?","Em lái xe đưa anh ra sân bay được không? <i>(bài khoá 1)</i>"],["好的，我马上就去把它们扔掉。","Hǎo de, wǒ mǎshàng jiù qù bǎ tāmen rēngdiào.","Vâng, em đi vứt chúng ngay đây. <i>(bài khoá 2)</i>"],["夏天把空调的温度开得高一些。","Xiàtiān bǎ kōngtiáo de wēndù kāi de gāo yìxiē.","Mùa hè để nhiệt độ điều hoà cao lên một chút. <i>(bài khoá 5)</i>"],["还有养成把垃圾丢进垃圾桶的习惯什么的。","Háiyǒu yǎngchéng bǎ lājī diū jìn lājītǒng de xíguàn shénme de.","Rồi tập thói quen bỏ rác vào thùng rác, v.v. <i>(bài khoá 5)</i>"]],"d":[],"w":"Câu thường chỉ kể việc: 我扔了那些瓶子 (tôi đã vứt mấy cái chai). Câu 把 nhấn mạnh cách xử lí và kết quả: 我把那些瓶子扔掉了 (tôi đã vứt bỏ chúng đi rồi). Khi có 到/进/在 chỉ nơi đến thì gần như bắt buộc dùng 把."},{"id":"gou-de-le","t":"够 + 形容词/动词（+ 的了）","s":"đủ…, khá là… (đã đạt tới mức cần thiết)","b":"<b>够</b> đứng <b>trước</b> tính từ hoặc động từ, nghĩa là “đạt tới mức cần/mức cao”. Dạng <b>够 + tính từ + 的了</b> mang sắc thái “đã đủ … rồi, không cần thêm nữa”; dạng <b>够 + tính từ + 的</b> là lời nhận xét “khá là …”.","r":["够 + tính từ + 的了 = “đã đủ … rồi”: 箱子已经够重的了 (không mang thêm nữa).","够 + tính từ + 的 = “khá là …, đúng là …”: 你来得够准时的。","够 + động từ / số lượng = “đủ để làm gì”: 这些菜够四个人吃了。Phủ định: 不够 – 我现金不够。","Lỗi hay gặp: đặt 够 sau tính từ như tiếng Việt “nặng đủ rồi”: ✗ 箱子重够了 → ✓ 箱子够重的了。"],"e":[["再说，箱子已经够重的了。","Zàishuō, xiāngzi yǐjīng gòu zhòng de le.","Với lại, va li đã đủ nặng rồi. <i>(bài khoá 1)</i>"]],"d":[["一共两百三十九块七。您付现金还是刷卡？ ____","B：我现金不够，还是刷卡吧。"],["你来得够准时的，正好8点。 ____","C：那就好，我还以为迟到了。"],["这些菜够四个人吃了。 ____","A：咱们俩肯定吃不了。"]],"w":"Đừng lẫn 够 (đủ mức) với 太……了 (quá mức, thường mang ý chê). 箱子够重的了 = đủ nặng rồi, thôi đừng thêm; 箱子太重了 = va li nặng quá (mang không nổi)."},{"id":"jiran-name","t":"既然……，那么/就……","s":"đã … thì …","b":"<b>既然</b> nêu một sự thật <b>hai bên đều đã biết</b>, vế sau dùng <b>那么、就、还是</b> để rút ra kết luận, đề nghị hoặc quyết định. Đây là quan hệ “suy luận”, không phải quan hệ nhân quả khách quan.","r":["既然 đứng đầu vế 1, có thể đứng trước hoặc sau chủ ngữ: 既然明天公司会关灯…… / 你既然喜欢这里……","Vế sau thường có 那么、就、也就、还是 để hô ứng: 既然大多数都同意，我们<b>就</b>按这个计划实行。","Vế sau thường là kết luận, đề nghị, quyết định của người nói – không phải một sự việc khách quan.","Lỗi hay gặp: dùng 既然 cho việc chưa xảy ra: ✗ 既然明天下雨，我们就不去 (chưa biết mai có mưa) → ✓ <b>如果</b>明天下雨，我们就不去。"],"e":[["既然明天晚上公司会关灯停电，那么我们肯定不用加班了。","Jìrán míngtiān wǎnshang gōngsī huì guān dēng tíng diàn, nàme wǒmen kěndìng búyòng jiābān le.","Đã biết tối mai công ty tắt đèn cắt điện thì chắc chắn tụi mình khỏi tăng ca rồi. <i>(bài khoá 3)</i>"]],"d":[["这里的风景确实很不错。阳光好，空气新鲜，来这儿散步真舒服。 ____","B：既然你喜欢这里，以后我们可以常来。"],["我刚才看了一下，一共二十个人，有十五个人同意这个计划。 ____","C：既然大多数都同意，我们就按这个计划实行。"],["有些事情过去了就是过去了，再也不能回头。 ____","A：既然不能改变，我们就只能想办法走好以后的路。"]],"w":"既然 ≠ 因为. 因为……所以…… nêu nguyên nhân – kết quả khách quan; 既然……就…… lấy điều đã biết làm tiền đề để suy ra một đề nghị/quyết định. 既然 cũng khác 如果: 既然 = việc đã thành sự thật, 如果 = giả thiết."},{"id":"buguan-dou","t":"不管……，都/也……","s":"bất kể … cũng/đều …","b":"<b>不管</b> nêu <b>điều kiện thay đổi thế nào cũng không ảnh hưởng</b> tới kết quả; vế sau <b>bắt buộc</b> có <b>都</b> hoặc <b>也</b>. Phần sau 不管 phải mang hình thức “không xác định”.","r":["Sau 不管 phải là một trong ba dạng: (1) từ nghi vấn – 多、什么、谁、怎么、哪儿; (2) “A 还是 B”; (3) “有没有 / 是不是”. Ví dụ trong bài: 不管客人<b>多</b>多，生意<b>多</b>忙。","Vế sau bắt buộc có 都/也: 我们<b>都</b>要保证餐厅干净卫生。","Lỗi hay gặp: ✗ 不管客人很多，我们要保证卫生 → ✓ 不管客人多多，我们<b>都</b>要保证卫生。","不管 thiên về khẩu ngữ; văn viết dùng 无论/不论, cấu trúc hoàn toàn giống nhau."],"e":[["不管客人多多，生意多忙，我们都要保证餐厅干净卫生。","Bùguǎn kèrén duō duō, shēngyi duō máng, wǒmen dōu yào bǎozhèng cāntīng gānjìng wèishēng.","Bất kể khách đông thế nào, việc buôn bán bận ra sao, chúng ta đều phải bảo đảm nhà hàng sạch sẽ vệ sinh. <i>(bài khoá 2)</i>"]],"d":[],"w":"Đừng lẫn 不管 với 尽管. 不管 + điều kiện chưa xác định + 都/也 (bất kể…); 尽管 + sự thật + 但是/还是 (mặc dù…). ✗ 尽管客人多多，我们都要打扫。"},{"id":"bujin-erqie","t":"不仅……，而且（还）…… ／ 再说……","s":"không những … mà còn … / hơn nữa là …","b":"<b>不仅……而且（还/也）……</b> dùng để nêu <b>hai ưu điểm/lí do tăng tiến</b> cho cùng một sự việc. <b>再说</b> là từ khẩu ngữ đứng đầu câu, dùng để <b>bổ sung thêm một lí do</b> cho điều vừa nói.","r":["Nếu hai vế cùng chủ ngữ thì chủ ngữ đứng TRƯỚC 不仅: 这样<b>不仅</b>省油钱，<b>而且</b>还不会污染空气。","Nếu khác chủ ngữ thì chủ ngữ đặt sau 不仅: 不仅<b>他</b>喜欢，<b>而且我们</b>也喜欢。","不仅 = 不但, dùng thay nhau được; vế sau hay thêm 还/也 cho tự nhiên.","再说 luôn đứng đầu câu bổ sung, sau nó là một lí do mới: 不用拿这些……<b>再说</b>，箱子已经够重的了。","Lỗi hay gặp: ✗ 不仅省油钱，但是不会污染空气 → ✓ 不仅省油钱，<b>而且</b>还不会污染空气。"],"e":[["这样不仅省油钱，而且还不会污染空气。","Zhèyàng bùjǐn shěng yóuqián, érqiě hái bú huì wūrǎn kōngqì.","Như vậy vừa tiết kiệm tiền xăng, lại còn không làm ô nhiễm không khí. <i>(bài khoá 1)</i>"],["再说，箱子已经够重的了。","Zàishuō, xiāngzi yǐjīng gòu zhòng de le.","Với lại, va li đã đủ nặng rồi. <i>(bài khoá 1)</i>"]],"d":[],"w":"再说 ở đây KHÔNG phải “nói lại lần nữa”. So sánh: 再说一遍 (nói lại một lần) ↔ 再说，太贵了 (với lại, đắt quá). Nhận biết bằng dấu phẩy: 再说 + dấu phẩy = liên từ bổ sung lí do."},{"id":"hai-yiwei-yuanlai","t":"还以为……，原来（是）……","s":"cứ tưởng là … , hoá ra là …","b":"<b>以为</b> luôn mang nghĩa <b>nghĩ nhầm</b>: điều mình nghĩ khác với sự thật. Thêm <b>还</b> phía trước làm tăng sắc thái “cứ tưởng”. Sự thật được nêu ở vế sau bằng <b>原来</b> (hoá ra).","r":["Cấu trúc: (我) 还以为 + điều nghĩ nhầm，原来 + sự thật。","以为 chỉ dùng khi kết quả TRÁI với điều mình nghĩ; nếu ý kiến đúng/trung tính thì dùng 认为: 我认为这个活动很有意义。","原来 ở đây là “hoá ra, thì ra”, đứng đầu vế 2, thường kèm 是 hoặc 因为: <b>原来是</b>因为不用加班啊！","Lỗi hay gặp: ✗ 我以为你说得对，你确实对 → ✓ 我<b>认为</b>你说得对。"],"e":[["还以为你高兴是为了支持环保，原来是因为不用加班啊！","Hái yǐwéi nǐ gāoxìng shì wèile zhīchí huánbǎo, yuánlái shì yīnwèi búyòng jiābān a!","Cứ tưởng cậu vui vì ủng hộ bảo vệ môi trường, hoá ra là vì khỏi phải tăng ca! <i>(bài khoá 3)</i>"]],"d":[["你来得够准时的，正好8点。 ____","C：那就好，我还以为迟到了。"]],"w":"原来 có hai nghĩa: (1) “hoá ra” – phát hiện sự thật, hay đi với 以为; (2) “vốn dĩ, ban đầu” – 他原来住在北京。Xem vị trí và ngữ cảnh để phân biệt."},{"id":"shenmede","t":"……什么的","s":"… vân vân, … các thứ","b":"<b>什么的</b> đặt ở <b>cuối một chuỗi liệt kê</b> để nói “và những thứ tương tự”, tương đương <b>等等</b> nhưng <b>rất khẩu ngữ</b>. Có thể liệt kê một hoặc nhiều mục rồi mới thêm 什么的.","r":["Vị trí: luôn ở cuối cùng, sau danh từ, động từ hoặc cả cụm: 喝茶、唱歌、跳舞<b>什么的</b>。","Có thể dùng sau chỉ một mục: 养成把垃圾丢进垃圾桶的习惯<b>什么的</b>。","什么的 (khẩu ngữ) ↔ 等等 (trang trọng, dùng trong văn viết, báo cáo).","Lỗi hay gặp: đặt giữa câu: ✗ 喝茶什么的、唱歌 → ✓ 喝茶、唱歌什么的。"],"e":[["还有养成把垃圾丢进垃圾桶的习惯什么的。","Háiyǒu yǎngchéng bǎ lājī diū jìn lājītǒng de xíguàn shénme de.","Rồi thì tập thói quen bỏ rác vào thùng rác, v.v. <i>(bài khoá 5)</i>"]],"d":[["我们有很多共同的爱好。 ____","B：经常一起喝茶，唱歌，跳舞什么的。"],["很多东西是用钱买不到的。 ____","C：比如说：幸福、快乐。"],["现在手机的作用越来越大。 ____","A：很多手机功能让我们的生活越来越方便。"]],"w":"什么的 chỉ dùng để liệt kê, không phải câu hỏi. Đừng lẫn với 什么 (cái gì): 你买什么？(hỏi) ↔ 买点儿水果什么的 (liệt kê)."},{"id":"fan-wen-ju","t":"你不是……吗？／ 多 + 形容词 + 啊！","s":"Câu phản vấn và câu cảm thán trong khẩu ngữ","b":"Hội thoại bài này dùng nhiều <b>câu phản vấn</b> – hình thức là câu hỏi nhưng thực chất là <b>khẳng định + nhắc nhở</b>. <b>你不是……吗？</b> = “Chẳng phải anh … sao?”; <b>没……吗？</b> = “Chẳng lẽ chưa …?”. Còn <b>多 + tính từ + 啊！</b> là câu cảm thán nhấn mạnh mức độ.","r":["你不是 + V/adj + 吗？ – nhắc lại điều đối phương đã nói/đã biết để phản bác nhẹ: 你不是一直说要保护环境吗？","你没 + V + 吗？ – trách nhẹ vì đối phương chưa làm/chưa biết: 你没看到门口的通知吗？","多 + tính từ + 啊！ dùng để cảm thán mức độ cao, không phải câu hỏi: 路上堵车多严重啊！","Lỗi hay gặp: dịch ngược thành phủ định. 你不是说要保护环境吗？= “Anh chẳng phải vẫn nói phải bảo vệ môi trường sao?” (tức là ANH CÓ nói), không phải “anh không nói”."],"e":[["你不是一直说要保护环境吗？","Nǐ bú shì yìzhí shuō yào bǎohù huánjìng ma?","Anh chẳng phải vẫn luôn nói phải bảo vệ môi trường sao? <i>(bài khoá 1)</i>"],["那个时间路上堵车多严重啊！","Nàge shíjiān lùshang dǔchē duō yánzhòng a!","Giờ đó ngoài đường tắc kinh khủng luôn ấy! <i>(bài khoá 1)</i>"],["你没看到门口的通知吗？","Nǐ méi kàndào ménkǒu de tōngzhī ma?","Cậu không thấy thông báo ở cửa à? <i>(bài khoá 3)</i>"]],"d":[],"w":"Câu phản vấn mang sắc thái trách nhẹ/nhắc nhở, thân mật. Khi nói với người trên hoặc người lạ nên chuyển thành câu kể: 您说过要保护环境。"},{"id":"du-bien-biet","t":"辨析：速度 / 温度 / 态度","s":"Phân biệt ba từ kết thúc bằng 度","b":"Ba từ này đều có chữ <b>度</b> (mức độ) nên rất dễ điền nhầm trong bài 选词填空. Hãy nhớ theo “cái gì được đo”: <b>速度</b> đo cái nhanh chậm, <b>温度</b> đo cái nóng lạnh, <b>态度</b> đo cách cư xử/thái độ của con người.","r":["速度 sùdù – tốc độ (của xe, tàu, công việc): 按照现在的<b>速度</b>，想在规定时间内完成计划有点儿困难。","温度 wēndù – nhiệt độ (thời tiết, điều hoà, cơ thể): 那边<b>温度</b>比较低，要提前准备厚衣服。","态度 tàidu – thái độ (đối với công việc, với người khác): 幽默是一种积极的生活<b>态度</b>。","Kết hợp hay dùng: 速度快/慢, 温度高/低, 态度好/不好·认真·积极。Lỗi hay gặp: ✗ 温度很快 → ✓ 速度很快。"],"e":[["夏天把空调的温度开得高一些，出门时记得关空调和电脑。","Xiàtiān bǎ kōngtiáo de wēndù kāi de gāo yìxiē, chūmén shí jìde guān kōngtiáo hé diànnǎo.","Mùa hè để nhiệt độ điều hoà cao lên chút, ra khỏi nhà nhớ tắt điều hoà và máy tính. <i>(bài khoá 5)</i>"]],"d":[["这个月底，我和丈夫准备开车去长白山，那边_____比较低，所以要提前准备几件厚一些的衣服。","温度"],["幽默是一种积极的生活_____，不但可以减轻你工作上的压力，还可以拉近人与人之间的距离。","态度"],["B：按照现在的_____，想要在规定时间内完成计划，好像有点儿困难。","速度"]],"w":"度 còn xuất hiện trong 程度 (trình độ/mức độ), 角度 (góc độ). Khi gặp bài điền từ, tìm chủ ngữ trước: xe/tàu → 速度, thời tiết/điều hoà → 温度, con người → 态度."},{"id":"yi-jieci","t":"以……＋动词 ／ 以……为…… ／ 以（表目的）","s":"bằng…, lấy…; lấy … làm …; để mà …","b":"<b>以</b> là chữ văn viết, có ba cách dùng trong bài. (1) Là <b>giới từ</b>, nghĩa như 用、拿 – “bằng, dựa vào”, cấu trúc <b>以 + danh từ/cụm từ + động từ</b>. (2) Cấu trúc <b>以……为……</b> = 把……作为…… hoặc 认为……是…… – “lấy … làm …, coi … là …”. (3) Là <b>liên từ chỉ mục đích</b>, tương đương 用来、为的是 – “để mà …”, đứng đầu vế câu sau.","r":["Giới từ 以 luôn đứng <b>trước</b> động từ, không đứng sau: 我一定<b>以</b>最快的速度<b>完成</b>。 ✗ 我完成以最快的速度。","以……为…… là cụm cố định, giữa 以 và 为 là đối tượng, sau 为 là tư cách/thân phận: 我们应该<b>以</b>那些敢说真话的人<b>为</b>镜子。 Không thêm 把: ✗ 把那些人以为镜子。","以 chỉ mục đích đứng ở <b>đầu vế câu sau</b>, và <b>chủ ngữ hai vế phải giống nhau</b>: 中国人会请他们去饭店吃饭，<b>以</b>表示对客人的尊重。 ✗ 我请他吃饭，以他很高兴。","以 mang màu sắc trang trọng, hay gặp trong bài đọc và văn viết; nói chuyện hằng ngày vẫn dùng 用: 我<b>用</b>最快的速度做完了。"],"e":[["经理您放心，我一定以最快的速度完成。","Jīnglǐ nín fàngxīn, wǒ yídìng yǐ zuì kuài de sùdù wánchéng.","Giám đốc cứ yên tâm, em nhất định sẽ hoàn thành với tốc độ nhanh nhất. <i>(bài khoá 2)</i>"],["我们应该以那些敢说真话的人为镜子，这样才能及时发现自己的缺点。","Wǒmen yīnggāi yǐ nàxiē gǎn shuō zhēnhuà de rén wéi jìngzi, zhèyàng cái néng jíshí fāxiàn zìjǐ de quēdiǎn.","Chúng ta nên lấy những người dám nói thật làm gương, có vậy mới kịp thời nhận ra khuyết điểm của mình."],["如果是十分重要的朋友，中国人往往会请他们去饭店或餐厅吃饭，以表示对客人的尊重和礼貌。","Rúguǒ shì shífēn zhòngyào de péngyou, Zhōngguórén wǎngwǎng huì qǐng tāmen qù fàndiàn huò cāntīng chī fàn, yǐ biǎoshì duì kèrén de zūnzhòng hé lǐmào.","Nếu là bạn rất quan trọng, người Trung Quốc thường mời họ ra nhà hàng ăn cơm, để tỏ lòng tôn trọng và lịch sự với khách."]],"d":[["____________，解决这个问题还有点儿困难。（以）","以我们现在的能力"],["汉语普通话____________。（以……为……）","以北京语音为标准音"],["我觉得应该降低公园门票价格，____________。（以）","以吸引更多的游客"]],"w":"Đừng lẫn giới từ 以 với 以为 (cứ tưởng) và 以后/以前 (sau/trước). 以 chỉ mục đích chỉ dùng khi hai vế cùng một chủ ngữ; nếu chủ ngữ khác nhau thì phải dùng 为了、让: ✗ 我早点儿出门，以你不用等我 → ✓ 我早点儿出门，<b>好让</b>你不用等我。"},{"id":"yushi","t":"于是（对比 因此）","s":"thế là, vậy là — việc sau nối tiếp ngay việc trước","b":"<b>于是</b> là liên từ, dùng ở <b>vế sau</b> của câu phức, cho biết việc ở vế sau xảy ra <b>ngay sau</b> việc ở vế trước; đây là quan hệ <b>tiếp nối</b> (承接) chứ không thuần là nhân quả. Vì nghĩa gần nhau nên sách xếp 于是 cạnh <b>因此</b> để so sánh: cả hai đều dùng được trong khuôn “A，于是/因此 B” (A dẫn đến B), nhưng điểm nhấn khác nhau.","r":["Vị trí: chỉ đứng ở vế sau, đầu vế, trước hoặc sau chủ ngữ đều được, hay đi cùng 就: ……正好下了一场大雪，<b>于是</b>我爸妈<b>就</b>给她取名叫夏雪。","Giống nhau: 于是 và 因此 đều là liên từ, đều dùng được trong “A，于是/因此 B”: 小时候，他经常生病，<b>于是/因此</b>每天都去跑步锻炼身体。","Khác nhau: <b>于是</b> nhấn mạnh <b>trình tự thời gian</b> – A xảy ra trước, B xảy ra sau; <b>因此</b> nhấn mạnh <b>quan hệ nhân quả</b> – A là nguyên nhân, B là kết quả.","Vì vậy khi vế sau chỉ là một <b>kết luận, lời khuyên, đạo lí</b> chứ không phải một việc nối tiếp, chỉ dùng được 因此: ✗ 习惯是不容易改变的，<b>于是</b>父母要帮孩子养成好习惯 → ✓ ……，<b>因此</b>父母要帮孩子养成好习惯。"],"e":[["于是，一些国家规定，超市、商场不能为顾客提供免费塑料袋，并且鼓励大家购买可以多次使用的购物袋。","Yúshì, yìxiē guójiā guīdìng, chāoshì, shāngchǎng bù néng wèi gùkè tígōng miǎnfèi sùliàodài, bìngqiě gǔlì dàjiā gòumǎi kěyǐ duō cì shǐyòng de gòuwùdài.","Thế là một số nước quy định siêu thị, trung tâm thương mại không được phát túi nilông miễn phí cho khách, đồng thời khuyến khích mọi người mua loại túi dùng được nhiều lần. <i>(bài khoá 4)</i>"],["听爷爷奶奶说，我妹妹出生那天，正好下了一场大雪，于是我爸妈就给她取名叫夏雪。","Tīng yéye nǎinai shuō, wǒ mèimei chūshēng nà tiān, zhènghǎo xiàle yì chǎng dàxuě, yúshì wǒ bàmā jiù gěi tā qǔmíng jiào Xià Xuě.","Nghe ông bà kể, hôm em gái tôi ra đời đúng lúc có một trận tuyết lớn, thế là bố mẹ tôi đặt tên cho nó là Hạ Tuyết."],["他三岁跟父亲母亲一起来到这儿，就再也没离开过这里。因此，他对这个地方感情很深。","Tā sān suì gēn fùqīn mǔqīn yìqǐ láidào zhèr, jiù zài yě méi líkāiguo zhèlǐ. Yīncǐ, tā duì zhège dìfang gǎnqíng hěn shēn.","Anh ấy ba tuổi theo cha mẹ tới đây rồi không rời khỏi nơi này nữa. Vì vậy, anh ấy có tình cảm rất sâu đậm với chốn này. <i>(ví dụ 因此 của sách)</i>"]],"d":[["我约了朋友在商场门口见面，我早到了一会儿，____________。（于是）","于是就先进商场逛了逛"],["最近几年，笔记本电脑的价格大大降低，____________。（于是）","于是买的人越来越多了"],["学习一种语言不是简单的事情，许多人在开始学的时候觉得很困难，____________。（于是）","于是就放弃了"]],"w":"Mẹo chọn nhanh trong bài 选词填空: nếu bỏ vế sau ra thì câu vẫn là “rồi mới xảy ra chuyện gì” → 于是; nếu vế sau là kết luận, quy luật, lời khuyên (“cho nên phải…”) → 因此/所以. Chỗ nào dùng được 于是 thì thường cũng dùng được 因此, nhưng ngược lại thì không."}],"notes":"1) Slide 23 và slide 42 chỉ là CÂU HỎI đọc hiểu (李进开始为什么不想带毛巾…／“地球一小时”是个什么活动？…), đã loại khỏi phần bài khoá theo quy tắc. 2) Bài khoá 3 bị cắt ngang giữa slide 43 và 44: slide 43 kết thúc ở “那么我们肯”, slide 44 mở đầu bằng “定不用加班了。”; đã nối lại thành câu “……那么我们肯定不用加班了。”, không thêm chữ nào. 3) Bản pinyin trong slide bị xáo thứ tự dòng và có lỗi (脏 ghi zàng ở phần từ mới, đúng là zāng; 为什么 ghi wéi shén me, đúng là wèi shénme; 2007年 ghi bằng chữ số). Toàn bộ pinyin trong `texts` đã được đánh lại theo chuẩn có dấu thanh. 4) Slide 58 và 66 là hai bài đọc, slide KHÔNG ghi tiêu đề nên title_zh để trống (không tự đặt tiêu đề tiếng Trung). 5) Câu ở slide 35 (现在火车的速度非常快……) là câu ví dụ/luyện tập rời, không thuộc bài khoá nào, nên chỉ dùng làm ví dụ cho từ 速度, không đưa vào `texts`. 6) Hai từ 美丽 và 错误 KHÔNG xuất hiện trong bất kỳ đoạn chữ Hán nào của slide; ví dụ cho hai từ này là câu tự soạn (đã ghi rõ trong phần dịch). Từ 以 cũng không có trong bài khoá nên lấy câu trong 练一练 (汉语普通话是以北京话语音为标准的。). 7) Vì 以 không có ví dụ nguyên văn trong bài khoá nên KHÔNG lập thành điểm ngữ pháp riêng (theo quy tắc mỗi điểm ngữ pháp phải có ví dụ lấy từ bài khoá); cấu trúc 以……为…… được ghi ở mục từ 以 trong vocab_ex. Tương tự, 于是 chỉ được giải thích ở vocab_ex. 8) Drill slide 25 (超___的部分 → 超过；山东___烟台市 → 山东省) cho thấy giáo trình lưu ý 省 có hai nghĩa: “tiết kiệm” (shěng, như 省油钱) và “tỉnh” (山东省).","order":[{"z":"不用拿这些，宾馆都会免费提供的。","t":["不用","拿","这些","宾馆","都","会","免费","提供","的"],"v":"Khỏi cần mang mấy thứ này, khách sạn đều cung cấp miễn phí mà. Với lại, va li đã đủ nặng rồi."},{"z":"再说，箱子已经够重的了。","t":["再说","箱子","已经","够重","的","了"],"v":"Khỏi cần mang mấy thứ này, khách sạn đều cung cấp miễn phí mà. Với lại, va li đã đủ nặng rồi."},{"z":"我当然知道宾馆里有。","t":["我","当然","知道","宾馆","里","有"],"v":"Em đương nhiên biết khách sạn có chứ. Anh chẳng phải vẫn luôn nói phải bảo vệ môi trường sao? Vậy thì bắt đầu ngay từ những việc n"},{"z":"你不是一直说要保护环境吗？","t":["你","不是","一直","说","要","保护环境","吗"],"v":"Em đương nhiên biết khách sạn có chứ. Anh chẳng phải vẫn luôn nói phải bảo vệ môi trường sao? Vậy thì bắt đầu ngay từ những việc n"},{"z":"现在就从身边的小事做起吧。","t":["现在","就","从","身边","的","小事","做起","吧"],"v":"Em đương nhiên biết khách sạn có chứ. Anh chẳng phải vẫn luôn nói phải bảo vệ môi trường sao? Vậy thì bắt đầu ngay từ những việc n"},{"z":"那个时间路上堵车多严重啊！","t":["那个","时间","路上","堵车","多","严重","啊"],"v":"Giờ đó ngoài đường tắc kinh khủng luôn ấy! Anh cứ đi tàu điện ngầm ra sân bay đi. Như vậy vừa tiết kiệm tiền xăng, lại còn không l"},{"z":"你还是坐地铁去机场吧。","t":["你","还是","坐地铁","去","机场","吧"],"v":"Giờ đó ngoài đường tắc kinh khủng luôn ấy! Anh cứ đi tàu điện ngầm ra sân bay đi. Như vậy vừa tiết kiệm tiền xăng, lại còn không l"},{"z":"这样不仅省油钱，而且还不会污染空气。","t":["这样","不仅","省","油钱","而且","还","不会","污染空气"],"v":"Giờ đó ngoài đường tắc kinh khủng luôn ấy! Anh cứ đi tàu điện ngầm ra sân bay đi. Như vậy vừa tiết kiệm tiền xăng, lại còn không l"},{"z":"好，那就听你的。","t":["好","那","就","听","你","的"],"v":"Được, vậy thì nghe theo em."},{"z":"小王，卫生间怎么那么脏啊？","t":["小王","卫生间","怎么","那么","脏","啊"],"v":"Tiểu Vương, sao nhà vệ sinh bẩn thế? Cái này sẽ để lại ấn tượng không tốt cho khách đấy.
