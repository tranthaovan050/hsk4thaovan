Wǒ bǎ nàozhōng dìng zài le liù diǎn bàn.","ev":"Tôi đặt đồng hồ báo thức lúc sáu giờ rưỡi."},{"h":"响","p":"xiǎng","v":"reo, vang lên","ez":"我的手机响了，可能是妈妈打来的。","ey":"Wǒ de shǒujī xiǎng le, kěnéng shì māma dǎ lái de.","ev":"Điện thoại tôi reo rồi, chắc là mẹ gọi."},{"h":"醒","p":"xǐng","v":"thức dậy, tỉnh dậy","ez":"我今天早上六点就醒了。","ey":"Wǒ jīntiān zǎoshang liù diǎn jiù xǐng le.","ev":"Sáng nay mới sáu giờ tôi đã tỉnh."},{"h":"赶","p":"gǎn","v":"Vội, gấp rút","ez":"我得赶飞机，先走了。","ey":"Wǒ děi gǎn fēijī, xiān zǒu le.","ev":"Tôi phải chạy cho kịp chuyến bay, đi trước đây."},{"h":"厕所","p":"cè suǒ","v":"Nhà vệ sinh","ez":"学校的厕所在一楼。","ey":"Xuéxiào de cèsuǒ zài yī lóu.","ev":"Nhà vệ sinh của trường ở tầng một."},{"h":"批评","p":"pī píng","v":"Phê bình","ez":"因为迟到，他被经理批评了。","ey":"Yīnwèi chídào, tā bèi jīnglǐ pīpíng le.","ev":"Vì đến muộn, anh ấy bị giám đốc phê bình."},{"h":"弄","p":"nòng","v":"làm","ez":"我不小心把杯子弄破了。","ey":"Wǒ bù xiǎoxīn bǎ bēizi nòng pò le.","ev":"Tôi lỡ tay làm vỡ cái cốc."},{"h":"管理","p":"guǎn lǐ","v":"Quản lý","ez":"他管理着一家小公司。","ey":"Tā guǎnlǐ zhe yì jiā xiǎo gōngsī.","ev":"Anh ấy quản lý một công ty nhỏ."}],[{"h":"打针","p":"dǎ zhēn","v":"tiêm, chích","ez":"感冒严重的话就要去医院打针。","ey":"Gǎnmào yánzhòng dehuà jiù yào qù yīyuàn dǎzhēn.","ev":"Cảm nặng thì phải đến bệnh viện tiêm."},{"h":"护士","p":"hùshi","v":"y tá","ez":"那位护士对病人特别热情。","ey":"Nà wèi hùshi duì bìngrén tèbié rèqíng.","ev":"Cô y tá đó rất nhiệt tình với bệnh nhân."},{"h":"表扬","p":"biǎo yáng","v":"Khen ngợi, biểu dương","ez":"老师表扬了这次考得好的同学。","ey":"Lǎoshī biǎoyáng le zhè cì kǎo de hǎo de tóngxué.","ev":"Cô giáo khen những bạn thi tốt lần này."},{"h":"千万","p":"qiān wàn","v":"Nhất thiết phải","ez":"明天的会议你千万别迟到。","ey":"Míngtiān de huìyì nǐ qiānwàn bié chídào.","ev":"Cuộc họp ngày mai cậu nhất định đừng đến muộn."},{"h":"怀疑","p":"huáiyí","v":"nghi ngờ, hoài nghi","ez":"我怀疑这个消息不是真的。","ey":"Wǒ huáiyí zhège xiāoxi bú shì zhēn de.","ev":"Tôi nghi tin này không phải là thật."}],[{"h":"故意","p":"gù yì","v":"Cố tình, cố ý","ez":"他故意走得很慢，等我一起走。","ey":"Tā gùyì zǒu de hěn màn, děng wǒ yìqǐ zǒu.","ev":"Anh ấy cố tình đi chậm để đợi tôi cùng đi."},{"h":"敲","p":"qiāo","v":"gõ, khua","ez":"有人在敲门，你去看看。","ey":"Yǒu rén zài qiāo mén, nǐ qù kànkan.","ev":"Có người gõ cửa, cậu ra xem đi."},{"h":"整理","p":"zhěng lǐ","v":"Thu dọn, dọn dẹp","ez":"周末我把房间整理了一下。","ey":"Zhōumò wǒ bǎ fángjiān zhěnglǐ le yíxià.","ev":"Cuối tuần tôi dọn dẹp phòng một chút."},{"h":"合适","p":"hé shì","v":"Thích hợp","ez":"这件衣服你穿正合适。","ey":"Zhè jiàn yīfu nǐ chuān zhèng héshì.","ev":"Cái áo này cậu mặc rất vừa."},{"h":"骗","p":"piàn","v":"Lừa gạt","ez":"他骗了我，说他已经到了。","ey":"Tā piàn le wǒ, shuō tā yǐjīng dào le.","ev":"Anh ta lừa tôi, bảo là đã đến rồi."},{"h":"儿童","p":"értóng","v":"trẻ em","ez":"这本书是给儿童看的。","ey":"Zhè běn shū shì gěi értóng kàn de.","ev":"Cuốn sách này dành cho trẻ em đọc."},{"h":"假","p":"jiǎ","v":"giả dối, không thật","ez":"这些花是假的，不是真的。","ey":"Zhèxiē huā shì jiǎ de, bú shì zhēn de.","ev":"Mấy bông hoa này là hoa giả, không phải hoa thật."}],[{"h":"左右","p":"zuǒ yòu","v":"Khoảng, khoảng chừng","ez":"我每天睡七个小时左右。","ey":"Wǒ měitiān shuì qī ge xiǎoshí zuǒyòu.","ev":"Mỗi ngày tôi ngủ khoảng bảy tiếng."},{"h":"懒","p":"lǎn","v":"Lười, lười nhác","ez":"他太懒了，房间从来不打扫。","ey":"Tā tài lǎn le, fángjiān cónglái bù dǎsǎo.","ev":"Cậu ta lười quá, chẳng bao giờ dọn phòng."},{"h":"笨","p":"bèn","v":"Đần, ngốc","ez":"我不笨，只是还没找到方法。","ey":"Wǒ bú bèn, zhǐshì hái méi zhǎodào fāngfǎ.","ev":"Tôi không ngốc, chỉ là chưa tìm ra cách thôi."},{"h":"粗心","p":"cū xīn","v":"Cẩu thả","ez":"你太粗心了，又把钥匙忘在家里。","ey":"Nǐ tài cūxīn le, yòu bǎ yàoshi wàng zài jiā lǐ.","ev":"Cậu cẩu thả quá, lại quên chìa khóa ở nhà rồi."},{"h":"骄傲","p":"jiāo ào","v":"Kiêu ngạo","ez":"她学习很好，可是从来不骄傲。","ey":"Tā xuéxí hěn hǎo, kěshì cónglái bù jiāo'ào.","ev":"Cô ấy học rất giỏi nhưng chưa bao giờ kiêu ngạo."},{"h":"害羞","p":"hài xiū","v":"Ngượng ngùng, thẹn thùng","ez":"她很害羞，不敢在大家面前唱歌。","ey":"Tā hěn hàixiū, bù gǎn zài dàjiā miànqián chànggē.","ev":"Cô ấy rất ngượng, không dám hát trước mọi người."}]],"texts":[{"no":1,"tz":"李老师建议王静让孩子养成好习惯","tv":"Cô Lý khuyên Vương Tĩnh nên giúp con hình thành thói quen tốt","lines":[{"s":"王静","z":"那个一边弹钢琴一边唱歌的男孩子是谁？表演得真棒！","p":"Nàge yìbiān tán gāngqín yìbiān chàng gē de nán háizi shì shéi? Biǎoyǎn de zhēn bàng!","v":"Cậu bé vừa đàn piano vừa hát kia là ai vậy? Biểu diễn hay thật đấy!"},{"s":"李老师","z":"是我孙子。去年寒假前的新年晚会他也表演过一次。","p":"Shì wǒ sūnzi. Qùnián hánjià qián de xīnnián wǎnhuì tā yě biǎoyǎnguo yí cì.","v":"Là cháu nội tôi đấy. Buổi liên hoan mừng năm mới trước kỳ nghỉ đông năm ngoái nó cũng từng biểu diễn một lần rồi."},{"s":"王静","z":"我想起来了，这孩子又聪明又可爱，你们教育得真好！","p":"Wǒ xiǎng qǐlai le, zhè háizi yòu cōngming yòu kě'ài, nǐmen jiàoyù de zhēn hǎo!","v":"À, tôi nhớ ra rồi, thằng bé vừa thông minh vừa đáng yêu, nhà cô dạy dỗ giỏi thật!"},{"s":"李老师","z":"是他父母教育得好。父母是孩子最重要的老师。他父母不仅教他知识，而且还花了很长时间帮助他养成了非常好的习惯，现在他每天都自己练习弹钢琴。","p":"Shì tā fùmǔ jiàoyù de hǎo. Fùmǔ shì háizi zuì zhòngyào de lǎoshī. Tā fùmǔ bùjǐn jiāo tā zhīshi, érqiě hái huāle hěn cháng shíjiān bāngzhù tā yǎngchéngle fēicháng hǎo de xíguàn, xiànzài tā měi tiān dōu zìjǐ liànxí tán gāngqín.","v":"Là bố mẹ cháu dạy giỏi ấy chứ. Cha mẹ mới là người thầy quan trọng nhất của con cái. Bố mẹ cháu không những dạy cháu kiến thức mà còn bỏ ra rất nhiều thời gian giúp cháu hình thành những thói quen rất tốt, giờ thì ngày nào cháu cũng tự giác tập đàn piano."},{"s":"王静","z":"让孩子养成一个好习惯实在太重要了，看来我得向他父母好好儿学习。","p":"Ràng háizi yǎngchéng yí ge hǎo xíguàn shízài tài zhòngyào le, kànlái wǒ děi xiàng tā fùmǔ hǎohāor xuéxí.","v":"Giúp con hình thành một thói quen tốt quả thật quá quan trọng, xem ra tôi phải học hỏi bố mẹ cháu nhiều mới được."},{"s":"李老师","z":"对。如果希望有一个优秀的孩子，你就要先成为一位优秀的父亲或者母亲。","p":"Duì. Rúguǒ xīwàng yǒu yí ge yōuxiù de háizi, nǐ jiù yào xiān chéngwéi yí wèi yōuxiù de fùqīn huòzhě mǔqīn.","v":"Đúng vậy. Nếu mong có một đứa con ưu tú thì trước hết chị phải trở thành một người cha hay người mẹ ưu tú đã."}]},{"no":2,"tz":"王静建议孙月教育孩子学会安排时间","tv":"Vương Tĩnh khuyên Tôn Nguyệt dạy con biết sắp xếp thời gian","lines":[{"s":"王静","z":"看你脸色不太好，是不是昨晚没休息好？","p":"Kàn nǐ liǎnsè bú tài hǎo, shì bu shì zuówǎn méi xiūxi hǎo?","v":"Thấy sắc mặt cậu không được tốt lắm, có phải tối qua nghỉ ngơi không đủ không?"},{"s":"孙月","z":"别提了。我女儿昨晚做作业又做到11点。","p":"Biétí le. Wǒ nǚ'ér zuówǎn zuò zuòyè yòu zuò dào shíyī diǎn.","v":"Đừng nhắc nữa. Tối qua con gái tớ lại làm bài tập đến tận 11 giờ."},{"s":"王静","z":"睡觉太晚对孩子的身体没有好处。最近孩子作业是不是太多了。","p":"Shuìjiào tài wǎn duì háizi de shēntǐ méiyǒu hǎochù. Zuìjìn háizi zuòyè shì bu shì tài duō le.","v":"Ngủ muộn quá thì chẳng có lợi gì cho sức khỏe của trẻ. Dạo này bài tập của bọn trẻ có phải nhiều quá không."},{"s":"孙月","z":"主要是她做事情比较慢，比如早上闹钟响了她不醒，我赶时间送她上学，她又急着上厕所。每天因为这些小事批评她，弄得我俩心情都不好。","p":"Zhǔyào shì tā zuò shìqing bǐjiào màn, bǐrú zǎoshang nàozhōng xiǎngle tā bù xǐng, wǒ gǎn shíjiān sòng tā shàngxué, tā yòu jízhe shàng cèsuǒ. Měi tiān yīnwèi zhèxiē xiǎo shì pīpíng tā, nòng de wǒ liǎ xīnqíng dōu bù hǎo.","v":"Chủ yếu là con bé làm gì cũng khá chậm, ví dụ sáng ra đồng hồ báo thức kêu rồi mà nó vẫn không tỉnh, tớ thì vội đưa nó đi học cho kịp giờ, nó lại cuống lên đòi đi vệ sinh. Ngày nào cũng vì mấy chuyện vặt ấy mà mắng nó, làm cho hai mẹ con đều bực bội."},{"s":"王静","z":"孩子做事慢，往往是因为他们不会安排自己的时间。你应该让孩子学会管理时间。","p":"Háizi zuò shì màn, wǎngwǎng shì yīnwèi tāmen bú huì ānpái zìjǐ de shíjiān. Nǐ yīnggāi ràng háizi xuéhuì guǎnlǐ shíjiān.","v":"Trẻ làm việc chậm, phần nhiều là vì chúng chưa biết sắp xếp thời gian của mình. Cậu nên để con học cách quản lý thời gian."},{"s":"孙月","z":"看来还是我的教育方法有问题。平时看她做事情慢，总想替她做，以后得让她学会安排时间，自己的事情自己做。","p":"Kànlái háishi wǒ de jiàoyù fāngfǎ yǒu wèntí. Píngshí kàn tā zuò shìqing màn, zǒng xiǎng tì tā zuò, yǐhòu děi ràng tā xuéhuì ānpái shíjiān, zìjǐ de shìqing zìjǐ zuò.","v":"Xem ra vẫn là phương pháp dạy con của tớ có vấn đề. Ngày thường thấy nó làm chậm là tớ cứ muốn làm thay, sau này phải để nó học cách sắp xếp thời gian, việc của mình thì mình tự làm."}]},{"no":3,"tz":"王静和孙月讨论表扬孩子的方法","tv":"Vương Tĩnh và Tôn Nguyệt bàn về cách khen ngợi con","lines":[{"s":"王静","z":"明天又要带我儿子去医院打针，想想我就头疼。他就怕打针，每次打针都哭得特别厉害。","p":"Míngtiān yòu yào dài wǒ érzi qù yīyuàn dǎzhēn, xiǎngxiang wǒ jiù tóuténg. Tā jiù pà dǎzhēn, měi cì dǎzhēn dōu kū de tèbié lìhai.","v":"Mai lại phải đưa con trai đến bệnh viện tiêm, nghĩ đến là tớ đã nhức cả đầu. Nó thì sợ nhất là tiêm, lần nào tiêm cũng khóc dữ dội lắm."},{"s":"孙月","z":"记得我女儿小时候，带她去医院打针，刚开始，她害怕得要哭。我就小声地和护士说我女儿很勇敢，一点儿也不怕打针，女儿听了以后马上就不哭了。","p":"Jìde wǒ nǚ'ér xiǎo shíhou, dài tā qù yīyuàn dǎzhēn, gāng kāishǐ, tā hàipà de yào kū. Wǒ jiù xiǎoshēng de hé hùshi shuō wǒ nǚ'ér hěn yǒnggǎn, yìdiǎnr yě bú pà dǎzhēn, nǚ'ér tīngle yǐhòu mǎshàng jiù bù kū le.","v":"Tớ nhớ hồi con gái tớ còn nhỏ, đưa nó đi bệnh viện tiêm, lúc mới đầu nó sợ đến phát khóc. Thế là tớ khẽ nói với cô y tá rằng con gái tôi rất dũng cảm, chẳng sợ tiêm chút nào, con bé nghe xong lập tức nín ngay."},{"s":"王静","z":"原来鼓励和表扬对小孩儿挺有用的，下次我也试试。","p":"Yuánlái gǔlì hé biǎoyáng duì xiǎoháir tǐng yǒuyòng de, xià cì wǒ yě shìshi.","v":"Hóa ra động viên và khen ngợi lại rất hiệu quả với trẻ con, lần sau tớ cũng thử xem."},{"s":"孙月","z":"不过表扬也是一门艺术，表扬千万不要太多，过多的表扬可能会给孩子带来压力。不仅起不到鼓励的作用，还可能让孩子怀疑自己的能力，变得没有信心。","p":"Búguò biǎoyáng yě shì yì mén yìshù, biǎoyáng qiānwàn búyào tài duō, guò duō de biǎoyáng kěnéng huì gěi háizi dàilái yālì. Bùjǐn qǐ bu dào gǔlì zuòyòng, hái kěnéng ràng háizi huáiyí zìjǐ de nénglì, biàn de méiyǒu xìnxīn.","v":"Nhưng khen ngợi cũng là cả một nghệ thuật, nhất thiết đừng khen quá nhiều, khen quá nhiều có thể tạo áp lực cho con. Không những không có tác dụng động viên mà còn có thể khiến con nghi ngờ năng lực của bản thân, trở nên mất tự tin."},{"s":"王静","z":"那怎么表扬孩子才会更有效果呢？","p":"Nà zěnme biǎoyáng háizi cái huì gèng yǒu xiàoguǒ ne?","v":"Vậy khen con thế nào thì mới hiệu quả hơn?"},{"s":"孙月","z":"我认为表扬要及时，而且表扬不仅仅要看结果，更要看过程，这样才能鼓励他的积极性，让他变得勇敢，不怕困难。","p":"Wǒ rènwéi biǎoyáng yào jíshí, érqiě biǎoyáng bù jǐnjǐn yào kàn jiéguǒ, gèng yào kàn guòchéng, zhèyàng cái néng gǔlì tā de jījíxìng, ràng tā biàn de yǒnggǎn, bú pà kùnnan.","v":"Tớ cho rằng khen thì phải khen kịp lúc, hơn nữa khen không chỉ nhìn vào kết quả mà càng phải nhìn vào quá trình, có như vậy mới khích lệ được tính tích cực của con, khiến con trở nên dũng cảm, không sợ khó khăn."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"有的孩子在得不到自己想要的东西的时候，会通过哭、扔东西或者故意敲打来引起父母的注意。","p":"Yǒude háizi zài dé bu dào zìjǐ xiǎng yào de dōngxi de shíhou, huì tōngguò kū, rēng dōngxi huòzhě gùyì qiāodǎ lái yǐnqǐ fùmǔ de zhùyì.","v":"Có những đứa trẻ khi không có được thứ mình muốn sẽ khóc, ném đồ hoặc cố ý gõ đập để gây sự chú ý của cha mẹ."},{"s":"","z":"在这种情况下，建议父母先不要生气，应该停下手中的事情，陪孩子整理整理东西，和他们聊聊天儿，弄清楚他们的问题。","p":"Zài zhè zhǒng qíngkuàng xià, jiànyì fùmǔ xiān búyào shēngqì, yīnggāi tíngxià shǒu zhōng de shìqing, péi háizi zhěnglǐ zhěnglǐ dōngxi, hé tāmen liáoliao tiānr, nòng qīngchu tāmen de wèntí.","v":"Trong trường hợp này, cha mẹ nên khoan nổi giận, hãy tạm gác việc đang làm, cùng con thu dọn đồ đạc, trò chuyện với con và tìm hiểu cho rõ vấn đề của chúng."},{"s":"","z":"父母的关心可以让孩子心情愉快起来。","p":"Fùmǔ de guānxīn kěyǐ ràng háizi xīnqíng yúkuài qilai.","v":"Sự quan tâm của cha mẹ có thể khiến tâm trạng của trẻ vui vẻ trở lại."},{"s":"","z":"教育孩子应该选择合适的教育方法，最好不要为了解决问题而骗孩子，这是因为儿童缺少判断能力，看到父母骗人，他们也会学着说假话。","p":"Jiàoyù háizi yīnggāi xuǎnzé héshì de jiàoyù fāngfǎ, zuì hǎo búyào wèile jiějué wèntí ér piàn háizi, zhè shì yīnwèi értóng quēshǎo pànduàn nénglì, kàndào fùmǔ piàn rén, tāmen yě huì xuézhe shuō jiǎhuà.","v":"Dạy con thì nên chọn phương pháp giáo dục thích hợp, tốt nhất đừng vì muốn giải quyết vấn đề mà lừa dối con, bởi vì trẻ nhỏ còn thiếu khả năng phán đoán, thấy cha mẹ lừa người khác thì chúng cũng sẽ bắt chước nói dối."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"七岁左右的儿童普遍好动，坐不住，所以老师在教这个年龄段的孩子时，一定要想办法引起他们的兴趣。","p":"Qī suì zuǒyòu de értóng pǔbiàn hào dòng, zuò bu zhù, suǒyǐ lǎoshī zài jiào zhège niánlíng duàn de háizi shí, yídìng yào xiǎng bànfǎ yǐnqǐ tāmen de xìngqù.","v":"Trẻ em khoảng bảy tuổi nhìn chung rất hiếu động, ngồi không yên, vì vậy khi dạy trẻ ở độ tuổi này, giáo viên nhất định phải nghĩ cách khơi gợi hứng thú của các em."},{"s":"","z":"只有让他们觉得你教的内容有趣，他们才会愿意努力学习。","p":"Zhǐyǒu ràng tāmen juéde nǐ jiāo de nèiróng yǒuqù, tāmen cái huì yuànyì nǔlì xuéxí.","v":"Chỉ khi khiến các em thấy nội dung mình dạy thú vị thì các em mới chịu cố gắng học."},{"s":"","z":"当孩子不明白时，应该多鼓励他，不要用“懒”“笨”“粗心”这种词批评他，这样对他们的正常发展不好。","p":"Dāng háizi bù míngbai shí, yīnggāi duō gǔlì tā, búyào yòng “lǎn” “bèn” “cūxīn” zhè zhǒng cí pīpíng tā, zhèyàng duì tāmen de zhèngcháng fāzhǎn bù hǎo.","v":"Khi trẻ chưa hiểu bài, hãy động viên trẻ nhiều hơn, đừng dùng những từ như “lười”, “ngốc”, “cẩu thả” để phê bình trẻ, làm vậy không tốt cho sự phát triển bình thường của các em."},{"s":"","z":"而且，对不同性格的孩子要使用不同的教育方法。","p":"Érqiě, duì bù tóng xìnggé de háizi yào shǐyòng bù tóng de jiàoyù fāngfǎ.","v":"Hơn nữa, với những đứa trẻ có tính cách khác nhau thì phải dùng phương pháp giáo dục khác nhau."},{"s":"","z":"如果孩子比较骄傲，应该让他明白还有很多知识需要学习；要是孩子性格有些害羞，就要经常鼓励他说出自己的看法，这样才能让每一个孩子都健康地发展。","p":"Rúguǒ háizi bǐjiào jiāo'ào, yīnggāi ràng tā míngbai hái yǒu hěn duō zhīshi xūyào xuéxí; yàoshi háizi xìnggé yǒuxiē hàixiū, jiù yào jīngcháng gǔlì tā shuōchū zìjǐ de kànfǎ, zhèyàng cái néng ràng měi yí ge háizi dōu jiànkāng de fāzhǎn.","v":"Nếu trẻ khá kiêu ngạo thì nên cho trẻ hiểu rằng còn rất nhiều kiến thức cần phải học; còn nếu tính cách của trẻ hơi nhút nhát thì phải thường xuyên khuyến khích trẻ nói ra ý kiến của mình, có như vậy mới giúp mọi đứa trẻ đều phát triển lành mạnh."}]}],"gram":[{"id":"bujin-erqie","t":"不仅……，而且（还／也）……","s":"không những… mà còn…","b":"Cấu trúc nối hai vế <b>cùng chiều</b>, vế sau tăng tiến, mạnh hơn vế trước. Nếu hai vế <b>cùng chủ ngữ</b> thì 不仅 đứng <b>sau</b> chủ ngữ; nếu <b>khác chủ ngữ</b> thì 不仅 đứng <b>trước</b> chủ ngữ. Vế sau có thể chỉ dùng 还／也 mà bỏ 而且.","r":["Cùng chủ ngữ: S + 不仅 + V1，而且/还 + V2 — 他父母不仅教他知识，而且还花了很长时间……","Được phép lược 而且, chỉ giữ 还: 不仅起不到鼓励作用，还可能让孩子怀疑自己的能力。","不仅仅 = “không chỉ đơn thuần là”, nhấn mạnh hơn 不仅: 表扬不仅仅要看结果，更要看过程。","不但 và 不仅 dùng như nhau; 不仅 mang sắc thái trang trọng hơn một chút.","lỗi hay gặp: ✗ 不仅他父母教他知识，而且帮他养成好习惯。 → ✓ 他父母不仅教他知识，而且还帮他养成了好习惯。"],"e":[["他父母不仅教他知识，而且还花了很长时间帮助他养成了非常好的习惯。","Tā fùmǔ bùjǐn jiāo tā zhīshi, érqiě hái huāle hěn cháng shíjiān bāngzhù tā yǎngchéngle fēicháng hǎo de xíguàn.","Bố mẹ cháu không những dạy cháu kiến thức mà còn bỏ ra rất nhiều thời gian giúp cháu hình thành những thói quen rất tốt. <i>(bài khoá 1)</i>"],["不仅起不到鼓励作用，还可能让孩子怀疑自己的能力，变得没有信心。","Bùjǐn qǐ bu dào gǔlì zuòyòng, hái kěnéng ràng háizi huáiyí zìjǐ de nénglì, biàn de méiyǒu xìnxīn.","Không những không có tác dụng động viên mà còn có thể khiến trẻ nghi ngờ năng lực của mình, trở nên mất tự tin. <i>(bài khoá 3)</i>"],["表扬不仅仅要看结果，更要看过程。","Biǎoyáng bù jǐnjǐn yào kàn jiéguǒ, gèng yào kàn guòchéng.","Khen ngợi không chỉ nhìn vào kết quả, mà càng phải nhìn vào quá trình. <i>(bài khoá 3)</i>"]],"d":[],"w":"Đừng nhầm với 虽然……但是…… (hai vế ngược chiều). 不仅……而且…… luôn là hai vế cùng chiều, vế sau nặng hơn vế trước."},{"id":"yibian-yibian","t":"一边……一边……","s":"vừa… vừa… (hai hành động diễn ra cùng lúc)","b":"Dùng để diễn tả một người <b>cùng lúc</b> làm hai việc. 一边 đặt <b>trước động từ</b>, chủ ngữ chỉ nói một lần và đứng trước cả cụm. Trong khẩu ngữ có thể rút gọn thành 边……边…….","r":["Công thức: S + 一边 + V1 + 一边 + V2 (V1, V2 đều là hành động, không phải tính từ).","Cả cụm 一边……一边…… có thể làm định ngữ cho danh từ khi thêm 的: 一边弹钢琴一边唱歌的男孩子。","Hai hành động phải xảy ra đồng thời; nếu nối tiếp nhau thì dùng 先……然后…….","lỗi hay gặp: ✗ 这孩子一边聪明一边可爱。 → ✓ 这孩子又聪明又可爱。"],"e":[["那个一边弹钢琴一边唱歌的男孩子是谁？","Nàge yìbiān tán gāngqín yìbiān chàng gē de nán háizi shì shéi?","Cậu bé vừa đàn piano vừa hát kia là ai vậy? <i>(bài khoá 1)</i>"],["这孩子又聪明又可爱，你们教育得真好！","Zhè háizi yòu cōngming yòu kě'ài, nǐmen jiàoyù de zhēn hǎo!","Thằng bé vừa thông minh vừa đáng yêu, nhà cô dạy dỗ giỏi thật! <i>(bài khoá 1)</i>"]],"d":[],"w":"又……又…… nối hai <b>tính chất/đặc điểm</b> cùng tồn tại (又聪明又可爱); 一边……一边…… nối hai <b>hành động</b> xảy ra đồng thời (一边弹钢琴一边唱歌). Không dùng lẫn."},{"id":"bo-ngu-trinh-do-de","t":"V/A + 得 + 补语（表演得真棒）","s":"bổ ngữ trình độ: làm việc gì đó tới mức nào","b":"得 nối động từ (hoặc tính từ) với phần <b>đánh giá mức độ</b> phía sau. Đây là mẫu câu chủ đạo của bài: 表演得真棒、教育得真好、哭得特别厉害、害怕得要哭. Nếu động từ có tân ngữ thì <b>phải lặp lại động từ</b> rồi mới thêm 得.","r":["Công thức: V + 得 + (很/真/特别/非常) + Adj — 表演得真棒、教育得真好。","Có tân ngữ phải lặp động từ: ✗ 他弹得钢琴很好 → ✓ 他弹钢琴弹得很好。","Phủ định đặt SAU 得: 他表演得不好 (✗ 他不表演得好).","Tính từ + 得 + kết quả = chỉ mức độ rất cao: 她害怕得要哭 (sợ đến mức muốn khóc).","Câu hỏi: V + 得 + 怎么样？／好不好？ — 他表演得怎么样？"],"e":[["表演得真棒！","Biǎoyǎn de zhēn bàng!","Biểu diễn hay thật đấy! <i>(bài khoá 1)</i>"],["每次打针都哭得特别厉害。","Měi cì dǎzhēn dōu kū de tèbié lìhai.","Lần nào tiêm nó cũng khóc dữ dội lắm. <i>(bài khoá 3)</i>"],["刚开始，她害怕得要哭。","Gāng kāishǐ, tā hàipà de yào kū.","Lúc mới đầu, con bé sợ đến phát khóc. <i>(bài khoá 3)</i>"]],"d":[],"w":"Phân biệt ba chữ đọc là “de”: 得 (bổ ngữ, đứng sau động/tính từ: 教育得真好), 的 (định ngữ, đứng trước danh từ: 优秀的孩子), 地 (trạng ngữ, đứng trước động từ: 小声地说、健康地发展)."},{"id":"nong","t":"弄（弄错／弄清楚／弄得……）","s":"làm — động từ “vạn năng” thay cho nhiều động từ cụ thể","b":"弄 thay cho một động từ cụ thể (làm, xử lý, sửa, dọn…) khi người nói không muốn hoặc không cần nói rõ động tác. 弄 hầu như luôn đi kèm <b>bổ ngữ kết quả</b>: 弄错、弄坏、弄清楚、弄干净. Dạng <b>弄得 + tiểu cú</b> nêu hệ quả (thường là khó chịu) do sự việc trước gây ra.","r":["弄 + bổ ngữ kết quả: 弄错 (làm nhầm), 弄清楚 (tìm hiểu cho rõ), 弄坏 (làm hỏng), 弄干净 (làm cho sạch).","弄得 + tiểu cú = “làm cho… đến nỗi…”: 弄得我俩心情都不好、弄得我每天睡不着。","Hay dùng trong câu chữ 把: 不要把会的问题弄错了。","Chủ ngữ của 弄得 thường là cả sự việc phía trước, không nhất thiết là người.","lỗi hay gặp: ✗ 弄得我很不好心情 → ✓ 弄得我心情很不好"],"e":[["每天因为这些小事批评她，弄得我俩心情都不好。","Měitiān yīnwèi zhèxiē xiǎo shì pīpíng tā, nòng de wǒ liǎ xīnqíng dōu bù hǎo.","Ngày nào cũng vì mấy chuyện vặt đó mà mắng con bé, làm cho hai mẹ con tôi đều bực bội. <i>(bài khoá 2)</i>"],["陪孩子整理整理东西，和他们聊聊天儿，弄清楚他们的问题。","Péi háizi zhěnglǐ zhěnglǐ dōngxi, hé tāmen liáoliao tiānr, nòng qīngchu tāmen de wèntí.","Cùng con thu dọn đồ đạc một chút, trò chuyện với con, tìm hiểu cho rõ vấn đề của chúng. <i>(bài khoá 4)</i>"]],"d":[["老师提醒我们考试时要仔细，_______。","不要把会的问题弄错了。"],["住在这里，外面不管什么时候都很热闹，晚上即使关上了窗户声音也很大，________。","弄得我每天睡不着。"],["是我弄错了，_______。","去西边的公共汽车应该在对面坐。"]],"w":"弄得…… luôn hàm ý hệ quả tiêu cực, ngoài ý muốn. Nếu chỉ muốn nói kết quả trung tính thì dùng động từ cụ thể (修好、洗干净) chứ đừng dùng 弄得."},{"id":"qianwan","t":"千万 + 不要／别／不能","s":"nhất thiết đừng…, ngàn vạn lần chớ…","b":"千万 là phó từ dùng để <b>dặn dò, khuyên can</b> người nghe, nhấn mạnh mức độ tha thiết. Nó gần như luôn đi với hình thức <b>phủ định</b> (不要／别／不能) và chỉ dùng trong câu cầu khiến, không dùng để nói về ý chí của bản thân.","r":["Vị trí: 千万 đứng trước 不要／别／不能 và đứng sau chủ ngữ: 表扬千万不要太多。","Chỉ dùng khi dặn dò người khác, không dùng cho câu trần thuật khách quan.","Có thể đứng đầu câu khi lược chủ ngữ: 千万别忘了带护照。","lỗi hay gặp: ✗ 我千万会努力学习。 → ✓ 我一定会努力学习。"],"e":[["表扬千万不要太多，过多的表扬可能会给孩子带来压力。","Biǎoyáng qiānwàn búyào tài duō, guò duō de biǎoyáng kěnéng huì gěi háizi dàilái yālì.","Khen ngợi thì nhất thiết đừng khen quá nhiều, khen quá nhiều có thể tạo áp lực cho trẻ. <i>(bài khoá 3)</i>"]],"d":[["不管压力有多么大，__________ 不能放弃。","一定"],["哭并不 _____ 是件坏事，哭可以让人从坏心情中走出来。","一定"],["这次你一定要按照要求认真填写，小心一点儿，_______ 别写错了。","千万"]],"w":"一定 dùng được cả câu khẳng định lẫn phủ định, dùng được cho ngôi thứ nhất (我一定去) và cả trong 不一定 (không nhất định); 千万 hầu như chỉ đi với phủ định và chỉ dùng để dặn dò người khác. ✗ 我千万去 → ✓ 我一定去."},{"id":"lai-noi-muc-dich","t":"（通过／用）……来……；让／由……来……","s":"来 nối phương thức với mục đích, hoặc nhấn mạnh người thực hiện","b":"Ở đây 来 <b>không có nghĩa “đến”</b> mà chỉ là hư từ nối. Kiểu 1: “phương thức + 来 + động từ mục đích” — nói bằng cách nào để đạt mục đích gì. Kiểu 2: “让／由 + người + 来 + động từ” — nhấn mạnh <b>ai</b> là người đảm nhiệm việc đó.","r":["Kiểu 1: (通过/用) + cách làm + 来 + V (mục đích): 通过哭、扔东西……来引起父母的注意。","Kiểu 2: 让／由 + người + 来 + V: 让你妈妈来帮你决定、这次活动是由张老师来组织的。","来 ở đây có thể lược bỏ mà câu vẫn đúng ngữ pháp, nhưng mất sắc thái nhấn mạnh.","lỗi hay gặp: ✗ 他来了引起父母的注意 → ✓ 他故意敲打来引起父母的注意 (来 không mang 了)."],"e":[["有的孩子在得不到自己想要的东西的时候，会通过哭、扔东西或者故意敲打来引起父母的注意。","Yǒude háizi zài dé bu dào zìjǐ xiǎng yào de dōngxi de shíhou, huì tōngguò kū, rēng dōngxi huòzhě gùyì qiāodǎ lái yǐnqǐ fùmǔ de zhùyì.","Có những đứa trẻ khi không có được thứ mình muốn sẽ khóc, ném đồ hoặc cố ý gõ đập để gây sự chú ý của cha mẹ. <i>(bài khoá 4)</i>"],["老师在教这个年龄段的孩子时，一定要想办法引起他们的兴趣。","Lǎoshī zài jiào zhège niánlíng duàn de háizi shí, yídìng yào xiǎng bànfǎ yǐnqǐ tāmen de xìngqù.","Khi dạy trẻ ở độ tuổi này, giáo viên nhất định phải nghĩ cách khơi gợi hứng thú của các em. <i>(bài khoá 5)</i>"]],"d":[["这两件衣服我都喜欢，不知道买哪件好，_______。","让你妈妈来帮你决定。"],["记者总是需要到处调查，____","来保证报道的真实性。"]],"w":"Đừng dịch 来 ở mẫu này thành “đến”. Phân biệt: 他来帮你 (anh ấy <i>đến</i> giúp bạn — 来 chỉ hướng) với 让他来帮你决定 (để anh ấy giúp bạn quyết định — 来 chỉ nhấn mạnh người làm)."},{"id":"zhiyou-cai","t":"只有……，才……","s":"chỉ có… thì mới…","b":"Nêu <b>điều kiện duy nhất</b>: không có điều kiện ở vế trước thì không thể có kết quả ở vế sau. 只有 đứng đầu vế điều kiện, 才 đứng ở vế kết quả, luôn <b>sau chủ ngữ, trước động từ</b>. Biến thể hay gặp trong bài: 这样才能……","r":["Công thức: 只有 + điều kiện，+ S + 才 + V。","才 tuyệt đối không đứng đầu vế sau: ✗ 才他们会愿意学习 → ✓ 他们才会愿意学习。","Sau 才 không dùng 了: ✗ 他才来了 (với nghĩa điều kiện) → ✓ 他才来。","Dạng rút gọn 这样才能…… dùng để tổng kết: 这样才能让每一个孩子都健康地发展。"],"e":[["只有让他们觉得你教的内容有趣，他们才会愿意努力学习。","Zhǐyǒu ràng tāmen juéde nǐ jiāo de nèiróng yǒuqù, tāmen cái huì yuànyì nǔlì xuéxí.","Chỉ khi khiến các em thấy nội dung thầy cô dạy thú vị thì các em mới chịu cố gắng học. <i>(bài khoá 5)</i>"],["这样才能鼓励他的积极性，让他变得勇敢，不怕困难。","Zhèyàng cái néng gǔlì tā de jījíxìng, ràng tā biàn de yǒnggǎn, bú pà kùnnan.","Có như vậy mới khích lệ được tính tích cực của trẻ, khiến trẻ trở nên dũng cảm, không sợ khó khăn. <i>(bài khoá 3)</i>"]],"d":[],"w":"只要……就…… = điều kiện <b>đủ</b> (chỉ cần… là được), ngữ khí nhẹ; 只有……才…… = điều kiện <b>cần duy nhất</b>, ngữ khí chặt hơn. Nhớ cặp cố định: 只要 đi với 就, 只有 đi với 才, không đổi chỗ."},{"id":"wangwang","t":"往往","s":"thường thường, phần nhiều là… (quy luật đúc kết được)","b":"往往 là phó từ, dùng để <b>tổng kết một quy luật</b> đã lặp đi lặp lại trong quá khứ hoặc hiện tại, đứng trước động từ hoặc trước 是. Nó luôn gắn với một điều kiện, hoàn cảnh cụ thể, và <b>không dùng cho việc tương lai</b>.","r":["Vị trí: S + 往往 + V／是……: 孩子做事慢，往往是因为他们不会安排自己的时间。","Thường đi kèm mệnh đề nêu hoàn cảnh: 孩子在受到表扬时，往往会对自己更有信心。","Không dùng trong câu cầu khiến, không dùng cho dự định tương lai.","lỗi hay gặp: ✗ 明天他往往来。 → ✓ 明天他会来。／他常常来。"],"e":[["孩子做事慢，往往是因为他们不会安排自己的时间。","Háizi zuò shì màn, wǎngwǎng shì yīnwèi tāmen bú huì ānpái zìjǐ de shíjiān.","Trẻ làm việc chậm, phần nhiều là vì các cháu chưa biết sắp xếp thời gian của mình. <i>(bài khoá 2)</i>"]],"d":[["孩子在受到_____时，往往会对自己更有信心，对学习的兴趣也会更大，成绩当然会提高。","表扬"]],"w":"常常 chỉ nói tần suất cao, dùng được cho tương lai và câu mệnh lệnh (你要常常来玩儿); 往往 nêu quy luật khách quan đã đúc kết, không dùng cho tương lai và không dùng để ra lệnh."},{"id":"xiang-qilai","t":"V + 起来 ／ 想起来","s":"trèo lên, đứng dậy… (bổ ngữ xu hướng) → 想起来: nhớ ra","b":"<b>起来</b> là động từ, đặt sau một động từ khác làm <b>bổ ngữ xu hướng</b> hoặc <b>bổ ngữ khả năng</b>, chỉ hướng của động tác là <b>từ dưới lên trên</b>: 坐起来, 站起来, 拿起来. Khi đặt sau động từ <b>想</b>, nghĩa được mở rộng: “lôi từ trong trí nhớ ra” một người hoặc một việc trước đây, tức là <b>nhớ ra</b>.","r":["Nghĩa hướng lên: 快<b>坐起来</b>！／需要长时间坐着工作的人，一小时左右一定要<b>站起来</b>活动活动。","想起来 = nhớ ra (bật ra trong đầu ngay lúc đó); có tân ngữ thì tách 起来 ra kẹp ở giữa: 我<b>想起</b>他的名字<b>来</b>了。","Dạng khả năng: <b>想得起来</b> (nhớ ra được) ／ <b>想不起来</b> (không tài nào nhớ ra): 我怎么也<b>想不起来</b>他叫什么了。","起来 ở đây đọc nhẹ (qǐlai). Đừng lẫn với 想出来: ✗ 我想起来了一个好办法 → ✓ 我<b>想出</b>了一个好办法。"],"e":[["我想起来了，这孩子又聪明又可爱，你们教育得真好！","Wǒ xiǎng qǐlai le, zhè háizi yòu cōngming yòu kě'ài, nǐmen jiàoyù de zhēn hǎo!","À, tôi nhớ ra rồi, thằng bé vừa thông minh vừa đáng yêu, nhà cô dạy dỗ giỏi thật! <i>(bài khoá 1)</i>"],["我突然想起来得去银行，所以不能陪你去大使馆了。","Wǒ tūrán xiǎng qǐlai děi qù yínháng, suǒyǐ bù néng péi nǐ qù dàshǐguǎn le.","Tôi chợt nhớ ra là phải ra ngân hàng, nên không đi cùng cậu tới đại sứ quán được rồi."],["你这样躺着看书对眼睛不好，快坐起来！","Nǐ zhèyàng tǎngzhe kàn shū duì yǎnjing bù hǎo, kuài zuò qǐlai!","Cậu nằm mà đọc sách thế kia hại mắt lắm, ngồi dậy mau!"]],"d":[["当那个男孩走过来邀请她跳舞时，____________。（起来）","她红着脸站了起来"],["你看见我钱包放哪儿了吗？____________。（想起来）","我想起来了，你放在沙发上了"],["每个人都对小时候有美好的回忆，____________。（想起来）","现在想起来还觉得很幸福"]],"w":"想起来 ≠ 记得. 想起来 chỉ <b>khoảnh khắc</b> nhớ ra điều đã quên, 记得 chỉ <b>trạng thái</b> vẫn còn nhớ: ✗ 我一直想起来他 → ✓ 我一直<b>记得</b>他。 Và 想起来 (nhớ lại cái đã biết) khác 想出来 (nghĩ ra cái mới, ví dụ 办法)."},{"id":"zuoyou","t":"数量词 + 左右","s":"khoảng, chừng, xấp xỉ — hơn kém một chút","b":"<b>左右</b> là danh từ, <b>chỉ dùng sau cụm số lượng</b> (số từ + lượng từ), cho biết con số thực nhiều hơn hoặc ít hơn con số đó một chút: 三天左右 (khoảng ba ngày), 500米左右 (chừng 500 mét), 七岁左右 (khoảng bảy tuổi).","r":["Vị trí cố định: <b>số + lượng từ + 左右</b>, không bao giờ đứng trước: ✗ 左右三天 → ✓ 三天<b>左右</b>。","Con số phải cụ thể. Không ghép với từ vốn đã mơ hồ: ✗ 几天左右 ／ ✗ 很多人左右 → ✓ 三天左右 ／ ✓ 一百人左右。","Khi cả cụm làm định ngữ cho danh từ thì thêm 的: <b>七岁左右的</b>儿童普遍好动。","大约、大概 đứng <b>trước</b> số, 左右 đứng <b>sau</b> số — chọn một là đủ: 大约三天 ／ 三天左右 (nói 大约三天左右 là thừa)."],"e":[["七岁左右的儿童普遍好动，坐不住，所以老师在教这个年龄段的孩子时，一定要想办法引起他们的兴趣。","Qī suì zuǒyòu de értóng pǔbiàn hào dòng, zuò bu zhù, suǒyǐ lǎoshī zài jiào zhège niánlíng duàn de háizi shí, yídìng yào xiǎng bànfǎ yǐnqǐ tāmen de xìngqù.","Trẻ em khoảng bảy tuổi nhìn chung rất hiếu động, ngồi không yên, vì vậy khi dạy trẻ ở độ tuổi này, giáo viên nhất định phải nghĩ cách khơi gợi hứng thú của các em. <i>(bài khoá 5)</i>"],["网上买的那本书估计三天左右就能到，你收到了记得给我打个电话说一声。","Wǎngshàng mǎi de nà běn shū gūjì sān tiān zuǒyòu jiù néng dào, nǐ shōudàole jìde gěi wǒ dǎ ge diànhuà shuō yì shēng.","Cuốn sách mua trên mạng chắc khoảng ba ngày nữa là tới, cậu nhận được thì nhớ gọi cho tớ một tiếng nhé."],["这儿不能停车，前方500米左右有个免费停车场，您可以把车停到那儿。","Zhèr bù néng tíngchē, qiánfāng wǔbǎi mǐ zuǒyòu yǒu ge miǎnfèi tíngchēchǎng, nín kěyǐ bǎ chē tíng dào nàr.","Chỗ này không đỗ xe được, phía trước chừng 500 mét có bãi đỗ xe miễn phí, ông có thể đỗ xe ở đó."]],"d":[["____________，我们还是坐地铁吧。（左右）","现在开车过去得一个小时左右"],["____________，有消息我们会马上通知你。（左右）","请等一个星期左右"],["马经理7月底去北京出差，____________。（左右）","要在那儿住十天左右"]],"w":"左右 chỉ đi với <b>số lượng</b>. Muốn nói “khoảng, đại khái” cho một sự việc thì dùng 大概、差不多 chứ không dùng 左右: ✗ 他左右同意了 → ✓ 他<b>差不多</b>同意了。 Ngoài ra 左右 còn là danh từ chỉ phương hướng (bên trái bên phải) – phân biệt theo ngữ cảnh."}],"notes":"1) Slide 19, 31, 61 chỉ chứa câu hỏi đọc hiểu (王静以前看过李老师孙子的表演吗？/ 孙月常因为什么事情心情不好？/ 对教儿童的老师来说，怎么做才能让他们安静地学习？…) nên KHÔNG đưa vào bài khoá. 2) Slide 55 là một câu bài tập điền từ (办_____ → 护照), không phải bài khoá, cũng đã loại. 3) Phần pinyin trong tất cả các slide 课文 (20, 21, 32, 33, 43, 44, 54, 62) bị xáo trộn thứ tự dòng, cắt cụt (ví dụ slide 20 dừng ở “xiàn zài tā měi”) và có lỗi chính tả (yìnggāi→yīnggāi, hái yóu→hái yǒu, tā mén→tāmen, bù tón→bù tóng); toàn bộ pinyin trong file này đã được đánh lại theo chuẩn có dấu thanh. 4) Slide 54 và slide 62 trên giáo trình cùng mang tiêu đề 父母教育孩子的方式 nhưng là hai đoạn đọc khác nhau, ở đây tách thành bài khoá 4 và bài khoá 5. 5) Không có slide 语言点 dạng chữ; 8 điểm ngữ pháp được suy ra từ drills (弄／弄得, 千万 vs 一定, ……来……, 往往) và từ cấu trúc nổi bật trong bài khoá (不仅……而且……, 一边……一边……, V得+补语, 只有……才……). 6) Năm từ 踢足球, 运动, 为什么, 新, 一起 không xuất hiện trong bất kỳ đoạn bài khoá nào của slide, nên câu ví dụ cho các từ này là câu tự đặt (đơn giản, đúng ngữ pháp), không lấy từ 课文. 7) Đáp án drill 千万/一定 được ghi theo đúng thứ tự đáp án có trong dữ liệu slide (一定 / 一定 / 千万).","order":[{"z":"那个一边弹钢琴一边唱歌的男孩子是谁？","t":["那个","一边","弹钢琴","一边","唱歌","的","男孩子","是","谁"],"v":"Cậu bé vừa đàn piano vừa hát kia là ai vậy? Biểu diễn hay thật đấy!"},{"z":"去年寒假前的新年晚会他也表演过一次。","t":["去年","寒假","前","的","新年","晚会","他","也","表演","过","一次"],"v":"Là cháu nội tôi đấy. Buổi liên hoan mừng năm mới trước kỳ nghỉ đông năm ngoái nó cũng từng biểu diễn một lần rồi."},{"z":"是他父母教育得好。","t":["是","他","父母","教育","得","好"],"v":"Là bố mẹ cháu dạy giỏi ấy chứ. Cha mẹ mới là người thầy quan trọng nhất của con cái. Bố mẹ cháu không những dạy cháu kiến thức mà "},{"z":"父母是孩子最重要的老师。","t":["父母","是","孩子","最","重要","的","老师"],"v":"Là bố mẹ cháu dạy giỏi ấy chứ. Cha mẹ mới là người thầy quan trọng nhất của con cái. Bố mẹ cháu không những dạy cháu kiến thức mà "},{"z":"看你脸色不太好，是不是昨晚没休息好？","t":["看","你","脸色","不太好","是不是","昨晚","没","休息","好"],"v":"Thấy sắc mặt cậu không được tốt lắm, có phải tối qua nghỉ ngơi không đủ không?"},{"z":"我女儿昨晚做作业又做到11点。","t":["我","女儿","昨晚","做作业","又","做到","11","点"],"v":"Đừng nhắc nữa. Tối qua con gái tớ lại làm bài tập đến tận 11 giờ."},{"z":"睡觉太晚对孩子的身体没有好处。","t":["睡觉","太晚","对","孩子","的","身体","没有","好处"],"v":"Ngủ muộn quá thì chẳng có lợi gì cho sức khỏe của trẻ. Dạo này bài tập của bọn trẻ có phải nhiều quá không."},{"z":"最近孩子作业是不是太多了。","t":["最近","孩子","作业","是不是","太多","了"],"v":"Ngủ muộn quá thì chẳng có lợi gì cho sức khỏe của trẻ. Dạo này bài tập của bọn trẻ có phải nhiều quá không."},{"z":"孩子做事慢，往往是因为他们不会安排自己的时间。","t":["孩子","做事","慢","往往","是因为","他们","不会","安排","自己","的","时间"],"v":"Trẻ làm việc chậm, phần nhiều là vì chúng chưa biết sắp xếp thời gian của mình. Cậu nên để con học cách quản lý thời gian."},{"z":"你应该让孩子学会管理时间。","t":["你","应该","让","孩子","学会","管理","时间"],"v":"Trẻ làm việc chậm, phần nhiều là vì chúng chưa biết sắp xếp thời gian của mình. Cậu nên để con học cách quản lý thời gian."},{"z":"看来还是我的教育方法有问题。","t":["看来","还是","我","的","教育","方法","有","问题"],"v":"Xem ra vẫn là phương pháp dạy con của tớ :"尊重","p":"zūn zhòng","v":"tôn trọng","ez":"我们应该尊重别人的选择。","ey":"Wǒmen yīnggāi zūnzhòng biéren de xuǎnzé.","ev":"Chúng ta nên tôn trọng lựa chọn của người khác."}]],"texts":[{"no":1,"tz":"小夏出国留学遇到了问题","tv":"Tiểu Hạ gặp trục trặc khi đi du học nước ngoài","lines":[{"s":"小雨","z":"你马上就要硕士毕业了吧？将来有什么打算？","p":"Nǐ mǎshàng jiù yào shuòshì bìyè le ba? Jiānglái yǒu shénme dǎsuàn?","v":"Cậu sắp tốt nghiệp thạc sĩ rồi phải không? Sau này cậu định làm gì?"},{"s":"小夏","z":"我想出国读博士，一直在准备办签证需要的材料。","p":"Wǒ xiǎng chūguó dú bóshì, yìzhí zài zhǔnbèi bàn qiānzhèng xūyào de cáiliào.","v":"Tớ muốn ra nước ngoài học tiến sĩ, lâu nay vẫn đang chuẩn bị hồ sơ cần cho việc xin visa."},{"s":"小雨","z":"现在材料准备得怎么样了？","p":"Xiànzài cáiliào zhǔnbèi de zěnmeyàng le?","v":"Giờ hồ sơ chuẩn bị đến đâu rồi?"},{"s":"小夏","z":"成绩证明和护照已经准备好了，另外，还跟国外的大学取得了联系，填写了报名表格。","p":"Chéngjì zhèngmíng hé hùzhào yǐjīng zhǔnbèi hǎo le, lìngwài, hái gēn guówài de dàxué qǔdé le liánxì, tiánxiě le bàomíng biǎogé.","v":"Bảng điểm và hộ chiếu đã chuẩn bị xong rồi, ngoài ra tớ còn liên hệ được với trường đại học nước ngoài và điền xong mẫu đơn đăng ký."},{"s":"小雨","z":"还应该有国外大学给你的邀请信吧？","p":"Hái yīnggāi yǒu guówài dàxué gěi nǐ de yāoqǐngxìn ba?","v":"Chắc còn phải có thư mời của trường nước ngoài gửi cho cậu nữa chứ?"},{"s":"小雨","z":"他们把邀请信传真给你了吗？","p":"Tāmen bǎ yāoqǐngxìn chuánzhēn gěi nǐ le ma?","v":"Họ đã fax thư mời cho cậu chưa?"},{"s":"小夏","z":"没有啊，下个星期我就要去使馆办签证了，这可怎么办？","p":"Méiyǒu a, xià ge xīngqī wǒ jiù yào qù shǐguǎn bàn qiānzhèng le, zhè kě zěnme bàn?","v":"Chưa mà, tuần sau tớ đã phải đến đại sứ quán làm visa rồi, giờ biết làm sao đây?"},{"s":"小雨","z":"这可是个大问题，我也不太清楚。我帮你查一下学校的电话号码，你打电话问一下吧。","p":"Zhè kě shì ge dà wèntí, wǒ yě bú tài qīngchu. Wǒ bāng nǐ chá yíxià xuéxiào de diànhuà hàomǎ, nǐ dǎ diànhuà wèn yíxià ba.","v":"Đây quả là vấn đề lớn đấy, tớ cũng không rõ lắm. Để tớ tra giúp cậu số điện thoại của trường, cậu gọi điện hỏi thử xem."}]},{"no":2,"tz":"王老板告诉李进自己成功的经验","tv":"Ông chủ Vương kể cho Lý Tiến kinh nghiệm thành công của mình","lines":[{"s":"李进","z":"谢谢您带我参观您的公司。在参观过程中我很激动，有个问题一直想问您。","p":"Xièxie nín dài wǒ cānguān nín de gōngsī. Zài cānguān guòchéng zhōng wǒ hěn jīdòng, yǒu ge wèntí yìzhí xiǎng wèn nín.","v":"Cảm ơn bác đã dẫn cháu đi tham quan công ty. Trong lúc tham quan cháu rất xúc động, có một câu hỏi cứ muốn hỏi bác."},{"s":"王老板","z":"好啊！小伙子，咱们一边吃西瓜，一边聊。","p":"Hǎo a! Xiǎohuǒzi, zánmen yìbiān chī xīguā, yìbiān liáo.","v":"Được thôi! Chàng trai, chúng ta vừa ăn dưa hấu vừa nói chuyện nào."},{"s":"李进","z":"您从大学毕业开始工作，到现在才十年时间，怎么给公司赚了这么多钱？","p":"Nín cóng dàxué bìyè kāishǐ gōngzuò, dào xiànzài cái shí nián shíjiān, zěnme gěi gōngsī zhuàn le zhème duō qián?","v":"Bác đi làm từ khi tốt nghiệp đại học, đến giờ mới có mười năm, sao lại kiếm được nhiều tiền cho công ty đến vậy?"},{"s":"李进","z":"这让我非常吃惊。我想向您学习一下成功的经验。","p":"Zhè ràng wǒ fēicháng chījīng. Wǒ xiǎng xiàng nín xuéxí yíxià chénggōng de jīngyàn.","v":"Điều đó khiến cháu vô cùng kinh ngạc. Cháu muốn học hỏi bác chút kinh nghiệm thành công."},{"s":"王老板","z":"这个问题以前一个记者也问过我。做生意时虽然会遇到各种压力和困难，但是大家的机会都是相同的。","p":"Zhège wèntí yǐqián yí ge jìzhě yě wèn guo wǒ. Zuò shēngyi shí suīrán huì yù dào gè zhǒng yālì hé kùnnan, dànshì dàjiā de jīhuì dōu shì xiāngtóng de.","v":"Câu hỏi này trước đây từng có một phóng viên cũng hỏi tôi. Khi làm ăn tuy sẽ gặp đủ loại áp lực và khó khăn, nhưng cơ hội của mọi người đều như nhau."},{"s":"王老板","z":"你看，这里有三块大小不同的西瓜，我们用西瓜的大小代表钱的多少，要是我们一起开始吃，你会先选哪块？","p":"Nǐ kàn, zhèli yǒu sān kuài dàxiǎo bùtóng de xīguā, wǒmen yòng xīguā de dàxiǎo dàibiǎo qián de duōshǎo, yàoshi wǒmen yìqǐ kāishǐ chī, nǐ huì xiān xuǎn nǎ kuài?","v":"Cậu xem, ở đây có ba miếng dưa hấu to nhỏ khác nhau, ta lấy độ to nhỏ của miếng dưa để đại diện cho số tiền nhiều ít, nếu chúng ta cùng bắt đầu ăn, cậu sẽ chọn miếng nào trước?"},{"s":"李进","z":"我肯定先吃最大的一块了，难道您会先吃小的，放弃吃大块的机会吗？","p":"Wǒ kěndìng xiān chī zuì dà de yí kuài le, nándào nín huì xiān chī xiǎo de, fàngqì chī dà kuài de jīhuì ma?","v":"Cháu chắc chắn sẽ ăn miếng to nhất trước rồi. Chẳng lẽ bác lại ăn miếng nhỏ trước, bỏ qua cơ hội ăn miếng to sao?"},{"s":"王老板","z":"我会先吃最小的一块，因为在你没吃完最大的那块时，我还有时间再多吃一块，最后一定比你吃的西瓜多。","p":"Wǒ huì xiān chī zuì xiǎo de yí kuài, yīnwèi zài nǐ méi chī wán zuì dà de nà kuài shí, wǒ hái yǒu shíjiān zài duō chī yí kuài, zuìhòu yídìng bǐ nǐ chī de xīguā duō.","v":"Tôi sẽ ăn miếng nhỏ nhất trước, vì trong lúc cậu chưa ăn hết miếng to nhất thì tôi vẫn còn thời gian ăn thêm một miếng nữa, cuối cùng nhất định ăn được nhiều dưa hơn cậu."},{"s":"王老板","z":"听完我的回答，恐怕你已经知道我的答案了吧。","p":"Tīng wán wǒ de huídá, kǒngpà nǐ yǐjīng zhīdào wǒ de dá'àn le ba.","v":"Nghe xong câu trả lời của tôi, e rằng cậu đã hiểu ra đáp án của tôi rồi đấy."}]},{"no":3,"tz":"小林不好意思拒绝朋友","tv":"Tiểu Lâm ngại từ chối bạn bè","lines":[{"s":"小林","z":"今年放假我又回不了家了，这次我父母又要失望了。你有什么计划？","p":"Jīnnián fàngjià wǒ yòu huí bu liǎo jiā le, zhè cì wǒ fùmǔ yòu yào shīwàng le. Nǐ yǒu shénme jìhuà?","v":"Kỳ nghỉ năm nay tớ lại không về nhà được, lần này bố mẹ tớ lại thất vọng mất thôi. Cậu có kế hoạch gì không?"},{"s":"小李","z":"我计划去郊区住一个月。你不是已经买好火车票了吗？你到底怎么打算的呀？","p":"Wǒ jìhuà qù jiāoqū zhù yí ge yuè. Nǐ bú shì yǐjīng mǎi hǎo huǒchēpiào le ma? Nǐ dàodǐ zěnme dǎsuàn de ya?","v":"Tớ định ra ngoại ô ở một tháng. Cậu chẳng phải đã mua sẵn vé tàu rồi sao? Rốt cuộc cậu tính thế nào vậy?"},{"s":"小林","z":"昨天一个外地的好朋友打电话说要来旅游，让我当导游，我实在不好意思拒绝。","p":"Zuótiān yí ge wàidì de hǎo péngyou dǎ diànhuà shuō yào lái lǚyóu, ràng wǒ dāng dǎoyóu, wǒ shízài bù hǎoyìsi jùjué.","v":"Hôm qua một người bạn thân ở tỉnh khác gọi điện bảo sẽ đến du lịch, nhờ tớ làm hướng dẫn viên, tớ thật sự ngại không tiện từ chối."},{"s":"小李","z":"其实拒绝并不表示不愿意帮忙。遇到解决不了的问题或者无法完成的任务时，拒绝正好说明你对朋友负责。","p":"Qíshí jùjué bìng bú dàibiǎo bú yuànyì bāngmáng. Yù dào jiějué bu liǎo de wèntí huòzhě wúfǎ wánchéng de rènwu shí, jùjué zhènghǎo shuōmíng nǐ duì péngyou fùzé.","v":"Thật ra từ chối không có nghĩa là không muốn giúp. Khi gặp vấn đề không giải quyết nổi hoặc nhiệm vụ không thể hoàn thành, từ chối lại chính là thể hiện cậu có trách nhiệm với bạn bè."},{"s":"小李","z":"这也是对你父母负责的态度。","p":"Zhè yě shì duì nǐ fùmǔ fùzé de tàidu.","v":"Đó cũng là thái độ có trách nhiệm với bố mẹ cậu nữa."},{"s":"小林","z":"既然别人找你帮忙，说明他真的很需要我的帮忙。我担心要是说“不”的话，会让他误会和伤心。","p":"Jìrán biéren zhǎo nǐ bāngmáng, shuōmíng tā zhēn de hěn xūyào wǒ de bāngmáng. Wǒ dānxīn yàoshi shuō “bù” de huà, huì ràng tā wùhuì hé shāngxīn.","v":"Người ta đã tìm đến nhờ giúp thì chứng tỏ họ thật sự rất cần mình giúp. Tớ lo nếu nói “không” sẽ khiến cậu ấy hiểu lầm và buồn lòng."},{"s":"小李","z":"别担心！如果你用一个既合适又礼貌的方法告诉朋友，他一定会原谅你的。","p":"Bié dānxīn! Rúguǒ nǐ yòng yí ge jì héshì yòu lǐmào de fāngfǎ gàosu péngyou, tā yídìng huì yuánliàng nǐ de.","v":"Đừng lo! Nếu cậu dùng một cách vừa hợp lý vừa lịch sự để nói với bạn thì cậu ấy nhất định sẽ tha thứ cho cậu thôi."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"有些同学经常把“明天”和“将来”挂在嘴边，常说作业明天再完成，下次考试一定好好儿复习，等等。","p":"Yǒuxiē tóngxué jīngcháng bǎ “míngtiān” hé “jiānglái” guà zài zuǐ biān, cháng shuō zuòyè míngtiān zài wánchéng, xià cì kǎoshì yídìng hǎohāor fùxí, děngděng.","v":"Có những bạn học suốt ngày treo hai chữ “ngày mai” và “sau này” trên miệng, hay nói bài tập để mai làm nốt, kỳ thi lần sau nhất định sẽ ôn cho tử tế, v.v."},{"s":"","z":"这种态度会浪费时间，不但会让你到最后什么事情都做不成，而且还得不到别人的同情。","p":"Zhè zhǒng tàidu huì làngfèi shíjiān, búdàn huì ràng nǐ dào zuìhòu shénme shìqing dōu zuò bu chéng, érqiě hái dé bu dào biéren de tóngqíng.","v":"Thái độ như vậy sẽ lãng phí thời gian, không những khiến bạn rốt cuộc chẳng làm nên việc gì mà còn chẳng nhận được sự thông cảm của người khác."},{"s":"","z":"所以不要把什么事情都推到“明天”，一切从现在做起。","p":"Suǒyǐ bú yào bǎ shénme shìqing dōu tuī dào “míngtiān”, yíqiè cóng xiànzài zuò qǐ.","v":"Vì thế đừng đẩy mọi việc sang “ngày mai”, mọi thứ hãy bắt tay làm ngay từ bây giờ."},{"s":"","z":"就拿学汉语来说吧，首先要注意课前预习，找出第二天要学习的重点；","p":"Jiù ná xué Hànyǔ lái shuō ba, shǒuxiān yào zhùyì kè qián yùxí, zhǎo chū dì-èr tiān yào xuéxí de zhòngdiǎn;","v":"Cứ lấy chuyện học tiếng Trung ra mà nói: trước hết phải chú ý chuẩn bị bài trước giờ học, tìm ra trọng tâm sẽ học của ngày hôm sau;"},{"s":"","z":"其次，上课时要认真听，不能马虎；","p":"Qícì, shàngkè shí yào rènzhēn tīng, bù néng mǎhu;","v":"thứ hai, khi lên lớp phải nghe cho nghiêm túc, không được cẩu thả;"},{"s":"","z":"最后，课后要记得复习。","p":"Zuìhòu, kè hòu yào jìde fùxí.","v":"cuối cùng, sau giờ học phải nhớ ôn lại bài."},{"s":"","z":"只要这样，汉语就能越学越好，越说越自信。","p":"Zhǐyào zhèyàng, Hànyǔ jiù néng yuè xué yuè hǎo, yuè shuō yuè zìxìn.","v":"Chỉ cần như vậy, tiếng Trung sẽ càng học càng giỏi, càng nói càng tự tin."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"当你认为自己在哪方面很优秀时，千万要冷静，不要骄傲。","p":"Dāng nǐ rènwéi zìjǐ zài nǎ fāngmiàn hěn yōuxiù shí, qiānwàn yào lěngjìng, bú yào jiāo'ào.","v":"Khi bạn cho rằng mình rất giỏi ở mặt nào đó, nhất định phải bình tĩnh, đừng kiêu ngạo."},{"s":"","z":"因为这个世界很大，“天外有天，人外有人”，很可能有人在这方面比你更厉害。","p":"Yīnwèi zhège shìjiè hěn dà, “tiān wài yǒu tiān, rén wài yǒu rén”, hěn kěnéng yǒu rén zài zhè fāngmiàn bǐ nǐ gèng lìhai.","v":"Vì thế giới này rất rộng lớn, “ngoài trời còn có trời, ngoài người còn có người”, rất có thể có người còn giỏi hơn bạn ở mặt đó."},{"s":"","z":"你现在是第一，并不表示你永远都是第一。","p":"Nǐ xiànzài shì dì-yī, bìng bù biǎoshì nǐ yǒngyuǎn dōu shì dì-yī.","v":"Hiện giờ bạn đứng số một, điều đó không có nghĩa bạn sẽ mãi mãi là số một."},{"s":"","z":"就像比赛一样，没有人会永远输，也没有人会一直赢。","p":"Jiù xiàng bǐsài yíyàng, méiyǒu rén huì yǒngyuǎn shū, yě méiyǒu rén huì yìzhí yíng.","v":"Giống như trong thi đấu vậy, không ai thua mãi, cũng không ai thắng mãi."},{"s":"","z":"我们知道得越多，就会发现自己不懂的也越多。","p":"Wǒmen zhīdào de yuè duō, jiù huì fāxiàn zìjǐ bù dǒng de yě yuè duō.","v":"Chúng ta biết càng nhiều thì càng nhận ra những gì mình chưa hiểu cũng càng nhiều."},{"s":"","z":"我们应该重视平时的积累，多向周围的人学习。","p":"Wǒmen yīnggāi zhòngshì píngshí de jīlěi, duō xiàng zhōuwéi de rén xuéxí.","v":"Chúng ta nên coi trọng sự tích lũy thường ngày, học hỏi nhiều hơn từ những người xung quanh."},{"s":"","z":"如果你敢诚实地说出自己对哪方面不了解，并不说明自己比别人差，相反，这样做更能得到别人的尊重。","p":"Rúguǒ nǐ gǎn chéngshí de shuō chū zìjǐ duì nǎ fāngmiàn bù liǎojiě, bìng bù shuōmíng zìjǐ bǐ biéren chā, xiāngfǎn, zhèyàng zuò gèng néng dédào biéren de zūnzhòng.","v":"Nếu bạn dám thành thật nói ra mình chưa hiểu về mặt nào thì điều đó không hề chứng tỏ bạn kém người khác; ngược lại, làm vậy càng khiến bạn nhận được sự tôn trọng của mọi người."}]}],"gram":[{"id":"cau-chu-ba","t":"把 + tân ngữ + động từ + 在/到/给 + …","s":"Câu chữ 把: nhấn mạnh việc xử lý đối tượng và kết quả của việc xử lý","b":"Câu chữ <b>把</b> đưa tân ngữ lên <b>trước</b> động từ để nói rõ ta đã <b>làm gì với</b> đối tượng đó và <b>kết quả ra sao</b>. Trật tự: <b>Chủ ngữ + 把 + tân ngữ xác định + động từ + thành phần bổ sung</b>. Trong bài này thành phần bổ sung hay gặp là <b>在 + nơi chốn</b> (挂在嘴边), <b>到 + đích</b> (推到“明天”) và <b>给 + người nhận</b> (传真给你).","r":["Tân ngữ sau 把 phải là cái người nghe đã biết (xác định), không dùng cho vật chung chung: ✗ 我把一本书买了 → ✓ 我把那本书买了。","Sau động từ bắt buộc phải có thêm thành phần (了/在/到/给/complement), không được để động từ đứng trơ: ✗ 他把邀请信传真。→ ✓ 他把邀请信传真给你了。","Phủ định 没/不 và trợ động từ (要, 会, 能) đặt TRƯỚC 把: ✓ 不要把什么事情都推到“明天”。","Lỗi hay gặp: ✗ 别人的同情我得不到把 → ✓ 得不到别人的同情。(không phải câu nào cũng dùng được 把)"],"e":[["他们把邀请信传真给你了吗？","Tāmen bǎ yāoqǐngxìn chuánzhēn gěi nǐ le ma?","Họ đã fax thư mời cho cậu chưa? <i>(bài khoá 1)</i>"],["有些同学经常把“明天”和“将来”挂在嘴边。","Yǒuxiē tóngxué jīngcháng bǎ “míngtiān” hé “jiānglái” guà zài zuǐ biān.","Có những bạn học suốt ngày treo hai chữ “ngày mai” và “sau này” trên miệng. <i>(bài khoá 4)</i>"],["所以不要把什么事情都推到“明天”。","Suǒyǐ bú yào bǎ shénme shìqing dōu tuī dào “míngtiān”.","Vì vậy đừng đẩy mọi việc sang “ngày mai”. <i>(bài khoá 4)</i>"]],"d":[["我记得上次关教授把他的手机_____给我了，可是不知道写哪儿了。","号码"],["把报名表格填好给我就可以了。","(mẫu câu 把 trong 练一练)"]],"w":"Phân biệt với 被: 把 nhìn từ phía người làm (我把信传真给他了), 被 nhìn từ phía vật bị tác động (信被传真给他了)."},{"id":"dao-di","t":"到底 + câu hỏi (rốt cuộc…?) / V + 到底","s":"到底 là phó từ nhấn mạnh trong câu nghi vấn: “rốt cuộc, cuối cùng thì”","b":"<b>到底</b> đặt trong câu hỏi để giục người nghe đưa ra câu trả lời dứt khoát, mang sắc thái sốt ruột. Vị trí: <b>sau chủ ngữ, trước động từ / từ để hỏi</b>. Ngoài ra 到底 còn là cụm động từ mang nghĩa “đến tận cùng” (走到底 = đi thẳng đến cuối đường).","r":["Chỉ dùng 到底 với câu hỏi chính phản hoặc câu có từ để hỏi (谁/什么/怎么/多少), KHÔNG dùng với câu hỏi 吗: ✗ 你到底去吗？ → ✓ 你到底去不去？","到底 đứng SAU chủ ngữ: ✗ 到底你怎么打算的？ → ✓ 你到底怎么打算的？","Khi 到底 là bổ ngữ chỉ hướng/trình độ thì đứng SAU động từ: 一直走到底 (đi thẳng đến cuối)."],"e":[["你不是已经买好火车票了吗？你到底怎么打算的呀？","Nǐ bú shì yǐjīng mǎi hǎo huǒchēpiào le ma? Nǐ dàodǐ zěnme dǎsuàn de ya?","Cậu chẳng phải đã mua sẵn vé tàu rồi sao? Rốt cuộc cậu tính thế nào vậy? <i>(bài khoá 3)</i>"]],"d":[["明天就是报名的最后一天了，________","你知道到底有多少人参加这次考试吗？"],["从这儿一直往前走，________","一直走到底就是中国银行。"]],"w":"Đừng nhầm 到底 (rốt cuộc) với 究竟 (cùng nghĩa nhưng trang trọng hơn) và với 终于 (cuối cùng thì… — dùng cho kết quả đã xảy ra, không dùng trong câu hỏi)."},{"id":"pho-tu-ke","t":"可 + động từ/tính từ (+了) — 可……了 / 这可…","s":"可 làm phó từ nhấn mạnh ngữ khí: “thật là…, ấy thế mà…”","b":"<b>可</b> ở đây không phải 可以 mà là <b>phó từ nhấn mạnh</b> trong khẩu ngữ. Với tính từ thường đi thành khung <b>可 + tính từ + 了</b> (可粗心了 = cẩu thả lắm). Với danh từ/động từ thì dùng <b>可是 / 可会 / 可怎么</b> để nhấn mạnh sự đánh giá hoặc sự lo lắng của người nói.","r":["可 luôn đứng TRƯỚC vị ngữ, sau chủ ngữ: ✓ 表格可真多。","Khi nhấn mạnh tính từ thường phải có 了 ở cuối: ✗ 他可粗心 → ✓ 他这个人可粗心了。","可是 ở đây = “thật là/quả là”, khác hẳn liên từ 可是 (nhưng): 这可是个大问题 ≠ 可是这是个大问题。"],"e":[["这可是个大问题，我也不太清楚。","Zhè kě shì ge dà wèntí, wǒ yě bú tài qīngchu.","Đây quả là một vấn đề lớn đấy, tớ cũng không rõ lắm. <i>(bài khoá 1)</i>"],["下个星期我就要去使馆办签证了，这可怎么办？","Xià ge xīngqī wǒ jiù yào qù shǐguǎn bàn qiānzhèng le, zhè kě zěnme bàn?","Tuần sau tớ đã phải đến đại sứ quán làm visa rồi, giờ biết làm sao đây? <i>(bài khoá 1)</i>"]],"d":[["他这个人可粗心了，_______","今天去上海竟然连火车票都没拿。"],["房间这么乱，________","你妈妈可会生气的。"]],"w":"Trong văn viết trang trọng ít dùng 可 nhấn mạnh; nó là chất khẩu ngữ, hay đi kèm 真/太 và ngữ khí từ 了/呢."},{"id":"yue-yue","t":"越 A 越 B / 越来越 + tính từ","s":"Càng… càng…; ngày càng…","b":"<b>越 A 越 B</b> diễn tả B thay đổi theo mức độ của A, hai vế đều là động từ/tính từ ngắn. <b>越来越 + tính từ/động từ tâm lý</b> nói mức độ tăng dần theo thời gian. Cả hai đều đứng <b>trước</b> vị ngữ.","r":["Chủ ngữ hai vế thường trùng nhau và chỉ nêu một lần: ✓ 汉语越学越好。","越来越 KHÔNG đi với 很/非常/太: ✗ 越来越很多人 → ✓ 越来越多的人。","Nếu hai vế khác chủ ngữ thì dùng 越……就越……: 我们知道得越多，就会发现自己不懂的也越多。"],"e":[["只要这样，汉语就能越学越好，越说越自信。","Zhǐyào zhèyàng, Hànyǔ jiù néng yuè xué yuè hǎo, yuè shuō yuè zìxìn.","Chỉ cần như vậy, tiếng Trung sẽ càng học càng giỏi, càng nói càng tự tin. <i>(bài khoá 4)</i>"],["我们知道得越多，就会发现自己不懂的也越多。","Wǒmen zhīdào de yuè duō, jiù huì fāxiàn zìjǐ bù dǒng de yě yuè duō.","Chúng ta biết càng nhiều thì càng phát hiện ra những điều mình chưa hiểu cũng càng nhiều. <i>(bài khoá 5)</i>"]],"d":[["现在城市里越来越多的人喜欢到_______过周末。他们想找一个空气新鲜、安静的地方好好放松一下。","郊区"]],"w":"越来越 chỉ sự thay đổi theo thời gian; 越……越…… chỉ quan hệ tỉ lệ giữa hai việc. Không nói ✗ 越来越学越好."},{"id":"budan-erqie","t":"不但……，而且（还/也）……","s":"Không những… mà còn…","b":"Cấu trúc tăng tiến: vế sau nói thêm một điều <b>nặng hơn/nhiều hơn</b> vế trước. Nếu hai vế <b>cùng chủ ngữ</b> thì chủ ngữ đứng trước 不但; nếu <b>khác chủ ngữ</b> thì chủ ngữ đứng sau 不但 và sau 而且.","r":["Cùng chủ ngữ: 这种态度不但…而且… ; khác chủ ngữ: 不但他去，而且我也去。","Vế sau thường thêm 还/也 cho tự nhiên: ✓ 而且还得不到别人的同情。","Lỗi hay gặp: ✗ 不但…但是… → ✓ 不但…而且… (虽然 mới đi với 但是)."],"e":[["这种态度会浪费时间，不但会让你到最后什么事情都做不成，而且还得不到别人的同情。","Zhè zhǒng tàidu huì làngfèi shíjiān, búdàn huì ràng nǐ dào zuìhòu shénme shìqing dōu zuò bu chéng, érqiě hái dé bu dào biéren de tóngqíng.","Thái độ này sẽ lãng phí thời gian, không những khiến bạn cuối cùng chẳng làm nên việc gì, mà còn không nhận được sự thông cảm của người khác. <i>(bài khoá 4)</i>"]],"d":[["这种态度会浪费时间，____会让你到最后什么事情都做不成，____还得不到别人的同情。","不但 / 而且"]],"w":"So sánh với 虽然……但是…… (chuyển ý, hai vế ngược nhau) trong chính bài: 做生意时虽然会遇到各种压力和困难，但是大家的机会都是相同的。"},{"id":"na-lai-shuo","t":"（就）拿……来说（吧）","s":"Lấy… làm ví dụ mà nói; cứ lấy… ra mà xem","b":"Dùng để <b>nêu một ví dụ cụ thể</b> minh hoạ cho nhận định vừa nói. Kết cấu: <b>就拿 + danh từ/cụm động từ + 来说 + 吧，+ nội dung ví dụ</b>. Phần sau 来说 mới là câu chính.","r":["Giữa 拿 và 来说 có thể là người, vật hoặc cả một việc: 就拿学汉语来说吧 / 就拿小王来说吧。","就 và 吧 có thể lược bỏ nhưng thêm vào thì khẩu ngữ tự nhiên hơn.","Lỗi hay gặp: ✗ 拿学汉语说吧 → ✓ 拿学汉语来说吧。"],"e":[["就拿学汉语来说吧，首先要注意课前预习，找出第二天要学习的重点。","Jiù ná xué Hànyǔ lái shuō ba, shǒuxiān yào zhùyì kè qián yùxí, zhǎo chū dì-èr tiān yào xuéxí de zhòngdiǎn.","Cứ lấy chuyện học tiếng Trung ra mà nói nhé, trước hết phải chú ý chuẩn bị bài trước khi lên lớp, tìm ra trọng tâm sẽ học của ngày hôm sau. <i>(bài khoá 4)</i>"]],"d":[["有的人一遇到困难就想放弃，_______","就拿小王来说吧，工作一需要加班就马上换工作。"],["没有工作计划很容易让人手忙脚乱，________","就拿今天来说，我有很多事情不知道先做什么好。"]],"w":"Đừng nhầm với 对……来说 (đối với ai đó mà nói — nêu góc nhìn, không nêu ví dụ): 对我来说，汉语很有意思。"},{"id":"gan","t":"敢 / 不敢 + động từ","s":"Dám / không dám làm gì","b":"<b>敢</b> là trợ động từ (năng nguyện động từ), luôn đứng <b>trước động từ chính</b>, biểu thị có đủ can đảm làm việc gì. Phủ định là <b>不敢</b>. Trong văn viết còn có dạng <b>敢于 + động từ</b> (dám… — mang sắc thái đánh giá tích cực).","r":["敢 + động từ, không thêm 地/得 ở giữa: ✓ 你敢诚实地说出… (地 gắn với 诚实, không gắn với 敢).","Hỏi chính phản: 敢不敢 (你敢不敢去？); phủ định luôn dùng 不敢, không dùng 没敢 để nói thói quen.","Lỗi hay gặp: ✗ 我很敢和她打网球 → ✓ 我敢和她打网球 (trợ động từ 敢 ít khi dùng 很 trực tiếp trong câu khẳng định thường)."],"e":[["如果你敢诚实地说出自己对哪方面不了解，并不说明自己比别人差。","Rúguǒ nǐ gǎn chéngshí de shuō chū zìjǐ duì nǎ fāngmiàn bù liǎojiě, bìng bù shuōmíng zìjǐ bǐ biéren chā.","Nếu bạn dám thành thật nói ra mình chưa hiểu về mặt nào, điều đó hoàn toàn không có nghĩa là bạn kém người khác. <i>(bài khoá 5)</i>"]],"d":[["她打网球打得特别棒，________","对，我都不敢和她一起打网球。"],["老师应该为学生提供一种愉快的学习环境，________","要让学生敢于发言。"]],"w":"Phân biệt 敢 (dám — can đảm) với 能 (có khả năng) và 可以 (được phép): 我能去 (tôi đi được) ≠ 我敢去 (tôi dám đi)."},{"id":"bing-bu","t":"并不 / 并不是 / 并没(有) + động từ","s":"Hoàn toàn không phải…, chứ không hề… (bác lại suy đoán của người nghe)","b":"<b>并</b> đặt trước 不/没 để <b>nhấn mạnh sự phủ định</b>, hàm ý “sự thật không như bạn nghĩ”. Vì vậy 并不 luôn dùng khi <b>bác bỏ một cách hiểu sai</b>, thường có vế giải thích đi kèm phía sau.","r":["并 chỉ đứng trước 不/没/未, không đứng trước động từ trần thuật: ✗ 并代表 → ✓ 并不代表。","Dùng khi có tiền đề bị bác bỏ; không dùng để phủ định trung tính: ✗ 我并不喝咖啡 (nói suông) → ✓ 我并不喜欢咖啡，只是同事请我喝。","Hay đi cùng 相反 hoặc 只是 ở vế sau: 并不说明自己比别人差，相反，这样做更能得到别人的尊重。"],"e":[["其实拒绝并不代表不愿意帮忙。","Qíshí jùjué bìng bú dàibiǎo bú yuànyì bāngmáng.","Thật ra từ chối hoàn toàn không có nghĩa là không muốn giúp đỡ. <i>(bài khoá 3)</i>"],["你现在是第一，并不表示你永远都是第一。","Nǐ xiànzài shì dì-yī, bìng bù biǎoshì nǐ yǒngyuǎn dōu shì dì-yī.","Bây giờ bạn đứng số một, điều đó không có nghĩa là bạn mãi mãi số một. <i>(bài khoá 5)</i>"]],"d":[["我们的车出了点儿问题，但并不是特别_____，很快就能解决，所以请大家放心。","严重"]],"w":"并不 mạnh hơn 不 về ngữ khí bác bỏ; nếu chỉ muốn phủ định bình thường thì dùng 不/没 là đủ."},{"id":"jiran","t":"既然……，（就/那/说明）……","s":"Đã… thì…; bởi vì đã như vậy nên…","b":"<b>既然</b> nêu một sự thật <b>đã biết, hai bên đều rõ</b>, vế sau đưa ra kết luận hoặc quyết định rút ra từ sự thật đó. Vế sau thường có <b>就 / 那 / 说明 / 还是</b>. Vị trí: 既然 đứng đầu vế thứ nhất (trước hoặc sau chủ ngữ đều được).","r":["既然 nói lý do ĐÃ BIẾT; 因为 nói nguyên nhân mới cung cấp thông tin: ✓ 既然你不舒服，就早点儿休息吧。","Vế sau thường là câu cầu khiến hoặc phán đoán, không nên là câu miêu tả trung tính.","Lỗi hay gặp: ✗ 既然下雨了，所以我不去了 → ✓ 既然下雨了，那我就不去了。"],"e":[["既然别人找你帮忙，说明他真的很需要我的帮忙。","Jìrán biéren zhǎo nǐ bāngmáng, shuōmíng tā zhēn de hěn xūyào wǒ de bāngmáng.","Người ta đã tìm đến nhờ mình giúp thì chứng tỏ họ thật sự rất cần mình giúp. <i>(bài khoá 3)</i>"],["如果你用一个既合适又礼貌的方法告诉朋友，他一定会原谅你的。","Rúguǒ nǐ yòng yí ge jì héshì yòu lǐmào de fāngfǎ gàosu péngyou, tā yídìng huì yuánliàng nǐ de.","Nếu cậu dùng một cách vừa hợp lý vừa lịch sự để nói với bạn thì cậu ấy nhất định sẽ tha thứ cho cậu. <i>(bài khoá 3)</i>"]],"d":[["A：我考虑了很久，还是决定离开现在的公司。B：既然这样，那我们_____你的选择。","尊重"]],"w":"Đừng nhầm 既然 (liên từ: đã… thì) với 既……又…… (vừa… vừa…, nối hai tính chất cùng tồn tại) — bài khoá 3 có cả hai: 既然别人找你帮忙 và 一个既合适又礼貌的方法。"},{"id":"kongpa","t":"恐怕","s":"E rằng…, sợ là…, chắc là… — vừa là động từ “lo”, vừa là phó từ phỏng đoán","b":"Sách tách <b>恐怕</b> làm hai từ loại. (1) <b>Động từ</b>, nghĩa là 担心 “lo, e ngại”: 那份工作我恐怕完成不了。(2) <b>Phó từ</b>, đứng trước động từ/tính từ, nêu <b>ước đoán có kèm chút lo lắng</b>: 这个会议室的座位恐怕不够。(3) Cũng là <b>phó từ</b> nhưng chỉ thuần phỏng đoán, tương đương <b>大概 / 也许</b>, lúc này không nhất thiết có ý lo: 现在恐怕已经结束了。","r":["Làm phó từ, 恐怕 đứng được cả <b>trước và sau chủ ngữ</b>: 恐怕足球比赛不能举行了 = 足球比赛恐怕不能举行了。","Làm động từ (nghĩa 担心), 恐怕 <b>chỉ đứng trước động từ, không đứng trước danh từ</b>: ✗ 我恐怕黑 → ✓ 我怕黑。","Câu có 恐怕 hay đi kèm 吧 / 了 ở cuối để giảm nhẹ ngữ khí phỏng đoán: 恐怕你已经知道我的答案了吧。","Vế sau thường nêu cách xử lý rút ra từ điều phỏng đoán: 座位恐怕不够，还是换到旁边那个大的吧。"],"e":[["听完我的回答，恐怕你已经知道我的答案了吧。","Tīng wán wǒ de huídá, kǒngpà nǐ yǐjīng zhīdào wǒ de dá'àn le ba.","Nghe xong câu trả lời của tôi, e rằng cậu đã hiểu ra đáp án của tôi rồi đấy. <i>(bài khoá 2)</i>"],["这个会议室的座位恐怕不够，还是换到旁边那个大的吧。","Zhège huìyìshì de zuòwèi kǒngpà bú gòu, háishi huàn dào pángbiān nàge dà de ba.","Chỗ ngồi ở phòng họp này e là không đủ, hay là đổi sang phòng lớn bên cạnh đi."],["京剧演出7点就开始了，现在恐怕已经结束了。","Jīngjù yǎnchū qī diǎn jiù kāishǐ le, xiànzài kǒngpà yǐjīng jiéshù le.","Buổi diễn Kinh kịch 7 giờ đã bắt đầu rồi, giờ chắc là kết thúc rồi."]],"d":[["如果没有你们的帮助，这次找工作________不会这么顺利。","恐怕"],["如果你们今晚还想看节目的话，最好现在就出发，再晚了________就没座位了。","恐怕"],["我本来想放假就走，但________现在走不了，老师让我翻译几篇文章。","恐怕"]],"w":"Phân biệt 恐怕 / 怕 (mục 比一比 của sách): cả hai đều có thể là động từ “lo” và phó từ phỏng đoán, nhưng — (a) làm động từ, 怕 đứng được trước cả danh từ (我怕狗), 恐怕 thì không; (b) làm phó từ, 恐怕 đứng trước hoặc sau chủ ngữ, còn 怕 chỉ đứng sau chủ ngữ; (c) 怕 mang tân ngữ với nghĩa “sợ hãi” (不怕找不到好工作), 恐怕 không dùng được như vậy — ✗ 我恐怕他们吃不了 → ✓ 我怕他们吃不了; (d) ngược lại, chỉ 恐怕 mới thay được bằng 也许/大概."}],"notes":"1) Bài khoá 1 (slide 19-20): slide ghi tên người nói ở lượt thứ tư là “王小夏”, các lượt còn lại là “小夏” — ở đây thống nhất ghi 小夏, không sửa nội dung câu. 2) Bài khoá 2 (slide 32-34) và bài khoá 3 (slide 43-44) bị cắt dòng giữa các slide; phần chữ Hán trên slide nối lại vẫn liền mạch, không có câu nào bị thiếu rõ rệt, nhưng bản pinyin trên slide bị xáo trộn thứ tự dòng và sai một số chỗ (Xiǎo Xià / Xiǎo Yǔ bị gán nhầm ở slide 19) nên pinyin trong file này được đánh lại theo chuẩn. 3) Bài khoá 4 (slide 59) và bài khoá 5 (slide 68) trên slide KHÔNG có tiêu đề; tiêu đề ở đây lấy từ câu trích dẫn trong slide câu hỏi đọc hiểu tương ứng (slide 58 và slide 67), không phải tiêu đề gốc của giáo trình. 4) Các slide 42, 58, 67 chỉ là câu hỏi đọc hiểu nên đã bỏ, không tính là bài khoá. Các slide 45, 60, 61, 62 là câu điền từ của phần 练一练 (bị lẫn vào chunks) nên chỉ dùng làm drill, không đưa vào bài khoá. 5) Slide 语言点 là ảnh nên không có chữ; 9 điểm ngữ pháp dưới đây được suy ra từ phần 练一练 và các cấu trúc nổi bật trong bài khoá. 6) Trong drills có xuất hiện từ “严重”, “感动” không nằm trong danh sách từ mới của bài — giữ nguyên trong drill, không thêm vào vocab_ex.","order":[{"z":"你马上就要硕士毕业了吧？","t":["你","马上","就要","硕士","毕业","了","吧"],"v":"Cậu sắp tốt nghiệp thạc sĩ rồi phải không? Sau này cậu định làm gì?"},{"z":"现在材料准备得怎么样了？","t":["现在","材料","准备","得","怎么样","了"],"v":"Giờ hồ sơ chuẩn bị đến đâu rồi?"},{"z":"还应该有国外大学给你的邀请信吧？","t":["还","应该","有","国外","大学","给","你","的","邀请信","吧"],"v":"Chắc còn phải có thư mời của trường nước ngoài gửi cho cậu nữa chứ?"},{"z":"他们把邀请信传真给你了吗？","t":["他们","把","邀请信","传真","给","你","了","吗"],"v":"Họ đã fax thư mời cho cậu chưa?"},{"z":"这可是个大问题，我也不太清楚。","t":["这","可是","个","大","问题","我","也","不","太","清楚"],"v":"Đây quả là vấn đề lớn đấy, tớ cũng không rõ lắm. Để tớ tra giúp cậu số điện thoại của trường, cậu gọi điện hỏi thử xem."},{"z":"谢谢您带我参观您的公司。","t":["谢谢您","带","我","参观","您","的","公司"],"v":"Cảm ơn bác đã dẫn cháu đi tham quan công ty. Trong lúc tham quan cháu rất xúc động, có một câu hỏi cứ muốn hỏi bác."},{"z":"小伙子，咱们一边吃西瓜，一边聊。","t":["小伙子","咱们","一边","吃","西瓜","一边","聊"],"v":"Được thôi! Chàng trai, chúng ta vừa ăn dưa hấu vừa nói chuyện nào."},{"z":"这让我非常吃惊。","t":["这","让","我","非常","吃惊"],"v":"Điều đó khiến cháu vô cùng kinh ngạc. Cháu muốn học hỏi bác chút kinh nghiệm thành công."},{"z":"我想向您学习一下成功的经验。","t":["我","想","向","您","学习","一下","成功","的","经验"],"v":"Điều đó khiến cháu vô cùng kinh ngạc. Cháu muốn học hỏi bác chút kinh nghiệm thành công."},{"z":"这个问题以前一个记者也问过我。","t":["这个","问题","以前","一个","记者","也","问过","我"],"v":"Câu hỏi này trước đây từng có một phóng viên cũng hỏi tôi. Khi làm ăn tuy sẽ gặp đủ loại áp lực và khó khăn, nhưng cơ hội của mọi "},{"z":"我计划去郊区住一个月。","t":["我","计划","去","郊区","住","一个月"],"v":"Tớ định ra ngoại ô ở một tháng. Cậu chẳng phải đã mua sẵn vé tàu rồi sao? Rốt cuộc cậu tính thế nào vậy?"},{"z":"你不是已经买好火车票了吗？","t":["你","不是","已经","买好","火车票","了","吗"],"v":"Tớ định ra ngoại ô ở một tháng. Cậu chẳng phải đã mua sẵn vé tàu rồi sao? Rốt cuộc cậu tính thế nào vậy?"},{"z":"你到底怎么打算的呀？","t":["你","到底","怎么","打算","的","呀"],"v":"Tớ định ra ngoại ô ở một tháng. Cậu chẳng phải đã mua sẵn vé tàu rồi sao? Rốt cuộc cậu tính thế nào vậy?"},{"z":"其实拒绝并不表示不愿意帮忙。","t":["其实","拒绝","并","不","表示","不","愿意","帮忙"],"v":"Thật ra từ chối không có nghĩa là không muốn giúp. Khi gặp vấn đề không giải quyết nổi hoặc nhiệm vụ không thể hoàn thành, từ chối"},{"z":"这也是对你父母负责的态度。","t":["这","也","是","对","你","父母","负责","的","态度"],"v":"Đó cũng là thái độ có trách nhiệm với bố mẹ cậu nữa."},{"z":"其次，上课时要认真听，不能马虎；","t":["其次","上课时","要","认真","听","不能","马虎"],"v":"thứ hai, khi lên lớp phải nghe cho nghiêm túc, không được cẩu thả;"}]},"17":{"n":17,"tz":"人与自然","tv":
