hēn kělián.","ev":"Con chó nhỏ đó không có nhà, thật tội nghiệp."},{"h":"怪","p":"guài","v":"Rất, vô cùng","ez":"今天怪冷的，多穿点儿衣服。","ey":"Jīntiān guài lěng de, duō chuān diǎnr yīfu.","ev":"Hôm nay lạnh ghê, mặc thêm áo vào."},{"h":"旅行","p":"Lǚxíng","v":"Du lịch","ez":"放假的时候我想去南方旅行。","ey":"Fàngjià de shíhou wǒ xiǎng qù nánfāng lǚxíng.","ev":"Nghỉ lễ tôi muốn đi du lịch miền Nam."},{"h":"烤鸭","p":"kǎoyā","v":"Vịt quay","ez":"来北京一定要尝尝北京烤鸭。","ey":"Lái Běijīng yídìng yào chángchang Běijīng kǎoyā.","ev":"Đến Bắc Kinh nhất định phải nếm thử vịt quay Bắc Kinh."},{"h":"对面","p":"duìmiàn","v":"Đối diện, trước mặt","ez":"学校对面有一家很大的超市。","ey":"Xuéxiào duìmiàn yǒu yì jiā hěn dà de chāoshì.","ev":"Đối diện trường có một siêu thị rất lớn."},{"h":"合格","p":"hégé","v":"Đạt tiêu chuẩn, đạt yêu cầu","ez":"这次考试我的成绩不合格，有点儿难过。","ey":"Zhè cì kǎoshì wǒ de chéngjì bù hégé, yǒudiǎnr nánguò.","ev":"Kỳ thi lần này điểm của tôi không đạt, hơi buồn."}],[{"h":"笑话","p":"xiàohua","v":"Truyện cười","ez":"他很会讲笑话，大家都喜欢他。","ey":"Tā hěn huì jiǎng xiàohua, dàjiā dōu xǐhuan tā.","ev":"Anh ấy rất biết kể chuyện cười, ai cũng quý."},{"h":"打扮","p":"dǎban","v":"Trang điểm","ez":"今天有面试，她打扮得很漂亮。","ey":"Jīntiān yǒu miànshì, tā dǎban de hěn piàoliang.","ev":"Hôm nay có phỏng vấn, cô ấy trang điểm rất xinh."},{"h":"民族","p":"mínzú","v":"Dân tộc","ez":"中国有五十六个民族。","ey":"Zhōngguó yǒu wǔshíliù ge mínzú.","ev":"Trung Quốc có năm mươi sáu dân tộc."},{"h":"干杯","p":"gān bēi","v":"Cạn ly","ez":"祝你生日快乐，我们干杯吧！","ey":"Zhù nǐ shēngrì kuàilè, wǒmen gānbēi ba!","ev":"Chúc cậu sinh nhật vui vẻ, mình cạn ly nào!"},{"h":"究竟","p":"jiūjìng","v":"(được dùng trong câu hỏi để nhấn mạnh) rốt cuộc","ez":"你究竟去还是不去？快点儿决定。","ey":"Nǐ jiūjìng qù háishi bú qù? Kuài diǎnr juédìng.","ev":"Rốt cuộc cậu đi hay không đi? Quyết định nhanh lên."},{"h":"钥匙","p":"yàoshi","v":"Chìa khóa","ez":"出门的时候别忘了带钥匙。","ey":"Chūmén de shíhou bié wàng le dài yàoshi.","ev":"Lúc ra khỏi nhà đừng quên mang chìa khóa."},{"h":"存","p":"Cún","v":"Gửi","ez":"我打算把这些钱存到银行里。","ey":"Wǒ dǎsuàn bǎ zhèxiē qián cún dào yínháng li.","ev":"Tôi định gửi số tiền này vào ngân hàng."}],[{"h":"棵","p":"kē","v":"(được dùng cho thực vật) cây, ngọn","ez":"我家门前有两棵大树。","ey":"Wǒ jiā mén qián yǒu liǎng kē dà shù.","ev":"Trước cửa nhà tôi có hai cây to."},{"h":"汤","p":"tāng","v":"Canh, súp","ez":"妈妈做的鸡汤真好喝。","ey":"Māma zuò de jī tāng zhēn hǎohē.","ev":"Canh gà mẹ nấu ngon thật."},{"h":"对话","p":"duìhuà","v":"Đối thoại, tiếp xúc","ez":"我们先练习这段对话吧。","ey":"Wǒmen xiān liànxí zhè duàn duìhuà ba.","ev":"Chúng ta luyện đoạn hội thoại này trước đi."},{"h":"普通话","p":"pǔtōnghuà","v":"Tiếng phổ thông, tiếng Quan thoại","ez":"他的普通话说得又清楚又标准。","ey":"Tā de pǔtōnghuà shuō de yòu qīngchu yòu biāozhǔn.","ev":"Anh ấy nói tiếng phổ thông vừa rõ vừa chuẩn."}],[{"h":"出发","p":"chūfā","v":"Xuất phát, khởi hành","ez":"我们明天早上六点出发。","ey":"Wǒmen míngtiān zǎoshang liù diǎn chūfā.","ev":"Sáng mai sáu giờ chúng ta xuất phát."},{"h":"收拾","p":"shōushi","v":"Thu dọn, thu xếp","ez":"吃完饭我来收拾桌子。","ey":"Chī wán fàn wǒ lái shōushi zhuōzi.","ev":"Ăn xong tôi dọn bàn cho."},{"h":"小吃","p":"xiǎochī","v":"Món ăn vặt","ez":"这条街上有很多有名的小吃。","ey":"Zhè tiáo jiē shang yǒu hěn duō yǒumíng de xiǎochī.","ev":"Trên con phố này có rất nhiều món ăn vặt nổi tiếng."},{"h":"酸","p":"suān","v":"Chua","ez":"这个苹果太酸了，我不喜欢。","ey":"Zhège píngguǒ tài suān le, wǒ bù xǐhuan.","ev":"Quả táo này chua quá, tôi không thích."},{"h":"香","p":"xiāng","v":"Thơm","ez":"厨房里的菜闻起来真香。","ey":"Chúfáng li de cài wén qǐlai zhēn xiāng.","ev":"Đồ ăn trong bếp thơm thật đấy."},{"h":"辣","p":"là","v":"Cay","ez":"这个菜太辣了，我吃不了。","ey":"Zhège cài tài là le, wǒ chī bu liǎo.","ev":"Món này cay quá, tôi ăn không nổi."}]],"texts":[{"no":1,"tz":"小张去北京，朋友送小张去机场","tv":"Tiểu Trương đi Bắc Kinh, bạn tiễn Tiểu Trương ra sân bay","lines":[{"s":"朋友","z":"该加油了，去机场的路上有加油站吗？","p":"Gāi jiā yóu le, qù jīchǎng de lùshang yǒu jiāyóuzhàn ma?","v":"Phải đổ xăng rồi, trên đường ra sân bay có trạm xăng không?"},{"s":"小张","z":"我记得过了长江大桥往右一拐就有一个，大概有四五公里远。","p":"Wǒ jìde guòle Chángjiāng Dàqiáo wǎng yòu yì guǎi jiù yǒu yí ge, dàgài yǒu sì-wǔ gōnglǐ yuǎn.","v":"Tớ nhớ qua cầu Trường Giang rẽ phải là có một cái, chắc cách khoảng bốn năm cây số."},{"s":"朋友","z":"好，那我就放心了，别开着开着没油了。你去北京的航班是几点的？时间来得及吗？","p":"Hǎo, nà wǒ jiù fàngxīn le, bié kāizhe kāizhe méi yóu le. Nǐ qù Běijīng de hángbān shì jǐ diǎn de? Shíjiān láidejí ma?","v":"Được, vậy thì tớ yên tâm, kẻo đang chạy lại hết xăng. Chuyến bay đi Bắc Kinh của cậu mấy giờ? Thời gian có kịp không?"},{"s":"小张","z":"航班本来是十点的，后来机场网站上通知推迟了一个小时，所以九点半以前到就应该没问题。","p":"Hángbān běnlái shì shí diǎn de, hòulái jīchǎng wǎngzhàn shang tōngzhī tuīchíle yí ge xiǎoshí, suǒyǐ jiǔ diǎn bàn yǐqián dào jiù yīnggāi méi wèntí.","v":"Chuyến bay vốn là 10 giờ, sau đó trang web sân bay báo hoãn lại một tiếng, nên tới trước 9 giờ rưỡi là ổn."},{"s":"朋友","z":"刚才我还有点儿担心来不及呢。一会儿加完油，往西走五百米就能上高速公路。走高速公路大约半个小时就到了。","p":"Gāngcái wǒ hái yǒudiǎnr dānxīn láibují ne. Yíhuìr jiāwán yóu, wǎng xī zǒu wǔbǎi mǐ jiù néng shàng gāosù gōnglù. Zǒu gāosù gōnglù dàyuē bàn ge xiǎoshí jiù dào le.","v":"Nãy giờ tớ còn hơi lo không kịp. Lát nữa đổ xăng xong, đi về phía tây năm trăm mét là lên được đường cao tốc. Đi cao tốc khoảng nửa tiếng là tới."},{"s":"小张","z":"一会儿我自己进去换登机牌，你就不用送我了，等我到了首都机场再给你发短信。","p":"Yíhuìr wǒ zìjǐ jìnqu huàn dēngjīpái, nǐ jiù búyòng sòng wǒ le, děng wǒ dàole Shǒudū Jīchǎng zài gěi nǐ fā duǎnxìn.","v":"Lát nữa tớ tự vào đổi thẻ lên máy bay, cậu không cần tiễn nữa đâu, đợi tới sân bay Thủ Đô tớ nhắn tin cho cậu."}]},{"no":2,"tz":"孙月和丈夫计划放寒假带女儿去旅行","tv":"Tôn Nguyệt và chồng lên kế hoạch nghỉ đông đưa con gái đi du lịch","lines":[{"s":"孙月","z":"女儿下个星期就要放寒假了，到时候咱们带她去旅游，放松放松，怎么样？","p":"Nǚ'ér xià ge xīngqī jiù yào fàng hánjià le, dào shíhou zánmen dài tā qù lǚyóu, fàngsōng fàngsōng, zěnmeyàng?","v":"Tuần sau con gái nghỉ đông rồi, tới lúc đó mình đưa con đi du lịch, thư giãn một chút, anh thấy sao?"},{"s":"丈夫","z":"平时女儿那么多课，总是说想去旅行，但是没时间，怪可怜的。这次放假咱们带她去哪儿玩儿比较好呢？","p":"Píngshí nǚ'ér nàme duō kè, zǒngshì shuō xiǎng qù lǚxíng, dànshì méi shíjiān, guài kělián de. Zhè cì fàngjià zánmen dài tā qù nǎr wánr bǐjiào hǎo ne?","v":"Ngày thường con học nhiều thế, lúc nào cũng nói muốn đi du lịch mà không có thời gian, tội ghê. Kỳ nghỉ này mình đưa con đi đâu chơi thì hơn nhỉ?"},{"s":"孙月","z":"去年我同事带她儿子去广西玩儿了一趟，听说很不错，我们就去广西吧。","p":"Qùnián wǒ tóngshì dài tā érzi qù Guǎngxī wánrle yí tàng, tīngshuō hěn búcuò, wǒmen jiù qù Guǎngxī ba.","v":"Năm ngoái đồng nghiệp em đưa con trai đi Quảng Tây một chuyến, nghe nói rất được, mình đi Quảng Tây đi."},{"s":"丈夫","z":"好啊，那里的气候和北方很不同，即使是冬天，也非常暖和，还能吃到许多新鲜的水果。等女儿一回来我就告诉她这个好消息。","p":"Hǎo a, nàli de qìhòu hé běifāng hěn bù tóng, jíshǐ shì dōngtiān, yě fēicháng nuǎnhuo, hái néng chīdào xǔduō xīnxiān de shuǐguǒ. Děng nǚ'ér yì huílai wǒ jiù gàosu tā zhège hǎo xiāoxi.","v":"Được đấy, khí hậu ở đó khác miền Bắc lắm, dù là mùa đông cũng rất ấm áp, lại còn được ăn nhiều hoa quả tươi. Đợi con về là anh báo tin vui này cho con ngay."},{"s":"孙月","z":"先别着急说。中午我们不是要去对面的饭店吃烤鸭，祝贺她考试成绩都合格吗？那时候再告诉她，不是更好？","p":"Xiān bié zháojí shuō. Zhōngwǔ wǒmen bú shì yào qù duìmiàn de fàndiàn chī kǎoyā, zhùhè tā kǎoshì chéngjì dōu hégé ma? Nà shíhou zài gàosu tā, bú shì gèng hǎo?","v":"Khoan hẵng nói. Trưa nay chẳng phải nhà mình sang nhà hàng đối diện ăn vịt quay, chúc mừng con thi đạt hết đó sao? Lúc đó hãy nói, chẳng phải hay hơn à?"},{"s":"丈夫","z":"好主意，到时她知道了肯定特别开心。","p":"Hǎo zhǔyì, dào shí tā zhīdàole kěndìng tèbié kāixīn.","v":"Ý hay đấy, lúc đó con biết chắc chắn sẽ vui lắm."}]},{"no":3,"tz":"安娜向马克介绍去丽江旅行的经验","tv":"Anna kể cho Mark kinh nghiệm đi du lịch Lệ Giang","lines":[{"s":"马克","z":"这么多照片，都是你这次去丽江旅行时照的？那里的自然风景可真美！","p":"Zhème duō zhàopiàn, dōu shì nǐ zhè cì qù Lìjiāng lǚxíng shí zhào de? Nàli de zìrán fēngjǐng kě zhēn měi!","v":"Nhiều ảnh thế này, đều là cậu chụp trong chuyến đi Lệ Giang lần này à? Phong cảnh thiên nhiên ở đó đẹp thật đấy!"},{"s":"安娜","z":"是啊，小城四季的风景都很美，而且环境保护得也很好，因此每年都吸引着成千上万的游客去那儿旅游。","p":"Shì a, xiǎo chéng sìjì de fēngjǐng dōu hěn měi, érqiě huánjìng bǎohù de yě hěn hǎo, yīncǐ měi nián dōu xīyǐnzhe chéngqiān-shàngwàn de yóukè qù nàr lǚyóu.","v":"Ừ, phong cảnh bốn mùa của thị trấn nhỏ đó đều đẹp, hơn nữa môi trường được bảo vệ rất tốt, vì vậy mỗi năm đều thu hút hàng nghìn hàng vạn du khách tới đó."},{"s":"马克","z":"这张照片上和你干杯的那个人是少数民族吗？她打扮得真漂亮。","p":"Zhè zhāng zhàopiàn shang hé nǐ gānbēi de nàge rén shì shǎoshù mínzú ma? Tā dǎban de zhēn piàoliang.","v":"Người cụng ly với cậu trong tấm ảnh này là người dân tộc thiểu số à? Cô ấy trang điểm đẹp thật."},{"s":"安娜","z":"她是我们的导游，不是少数民族。一路上她给我们讲了很多有趣的笑话。有一次我把存包的钥匙丢了，最后还是她帮我找到的。这张照片就是找到钥匙后，我们一起照的。","p":"Tā shì wǒmen de dǎoyóu, bú shì shǎoshù mínzú. Yílù shang tā gěi wǒmen jiǎngle hěn duō yǒuqù de xiàohua. Yǒu yí cì wǒ bǎ cún bāo de yàoshi diū le, zuìhòu háishi tā bāng wǒ zhǎodào de. Zhè zhāng zhàopiàn jiù shì zhǎodào yàoshi hòu, wǒmen yìqǐ zhào de.","v":"Cô ấy là hướng dẫn viên của bọn mình, không phải người dân tộc. Suốt dọc đường cô ấy kể cho bọn mình rất nhiều chuyện cười thú vị. Có lần mình làm mất chìa khoá tủ gửi đồ, cuối cùng cũng nhờ cô ấy tìm được. Tấm ảnh này chính là chụp chung sau khi tìm thấy chìa khoá."},{"s":"马克","z":"明年我有机会也去那儿看看，到时把你的导游介绍给我吧。究竟哪个季节去丽江旅游比较好呢？","p":"Míngnián wǒ yǒu jīhuì yě qù nàr kànkan, dào shí bǎ nǐ de dǎoyóu jièshào gěi wǒ ba. Jiūjìng nǎge jìjié qù Lìjiāng lǚyóu bǐjiào hǎo ne?","v":"Sang năm có dịp mình cũng đi xem thử, tới lúc đó giới thiệu hướng dẫn viên của cậu cho mình nhé. Rốt cuộc đi Lệ Giang vào mùa nào thì hơn?"},{"s":"安娜","z":"那儿最美的季节是春天和秋天，不过那时候人比较多。稍微好一点儿的时间是每年12月到第二年3月。这段时间去丽江的话，无论交通还是吃、住都很便宜。","p":"Nàr zuì měi de jìjié shì chūntiān hé qiūtiān, búguò nà shíhou rén bǐjiào duō. Shāowēi hǎo yìdiǎnr de shíjiān shì měinián shí'èryuè dào dì-èr nián sānyuè. Zhè duàn shíjiān qù Lìjiāng de huà, wúlùn jiāotōng háishi chī, zhù dōu hěn piányi.","v":"Mùa đẹp nhất ở đó là mùa xuân và mùa thu, có điều lúc đó khá đông người. Thời điểm dễ chịu hơn một chút là từ tháng 12 tới tháng 3 năm sau. Đi Lệ Giang khoảng thời gian này thì dù là đi lại hay ăn ở đều rất rẻ."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"中国南北距离约5500公里，因此南北气候有很大区别。","p":"Zhōngguó nánběi jùlí yuē wǔqiān wǔbǎi gōnglǐ, yīncǐ nánběi qìhòu yǒu hěn dà qūbié.","v":"Khoảng cách Nam – Bắc của Trung Quốc chừng 5500 km, vì thế khí hậu hai miền khác nhau rất nhiều."},{"s":"","z":"每年三四月份的时候，如果从北方坐火车到南方去旅游，一路上你会发现，不同的地方有不同的风景：","p":"Měi nián sān-sì yuèfèn de shíhou, rúguǒ cóng běifāng zuò huǒchē dào nánfāng qù lǚyóu, yí lù shang nǐ huì fāxiàn, bùtóng de dìfang yǒu bùtóng de fēngjǐng:","v":"Vào khoảng tháng ba tháng tư hằng năm, nếu bạn đi tàu từ miền Bắc xuống miền Nam du lịch, suốt dọc đường bạn sẽ thấy mỗi nơi mỗi cảnh:"},{"s":"","z":"窗外的树一棵一棵地变绿，北方也许还下着雪，南方却已经到处都是绿色了。","p":"Chuāngwài de shù yì kē yi kē de biàn lǜ, běifāng yěxǔ hái xiàzhe xuě, nánfāng què yǐjīng dàochù dōu shì lǜsè le.","v":"Cây bên ngoài cửa sổ cứ từng cây từng cây xanh dần lên; miền Bắc có lẽ vẫn còn đổ tuyết, còn miền Nam thì đã xanh mướt khắp nơi."},{"s":"","z":"南方菜很有特点，特别是汤，味道鲜美，很多北方人都喜欢喝。","p":"Nánfāng cài hěn yǒu tèdiǎn, tèbié shì tāng, wèidào xiānměi, hěn duō běifāng rén dōu xǐhuan hē.","v":"Món ăn miền Nam rất có nét riêng, nhất là canh, vị ngọt thanh, rất nhiều người miền Bắc đều thích."},{"s":"","z":"另外，南方和北方的语言也有很大不同。","p":"Lìngwài, nánfāng hé běifāng de yǔyán yě yǒu hěn dà bùtóng.","v":"Ngoài ra, tiếng nói của miền Nam và miền Bắc cũng khác nhau rất nhiều."},{"s":"","z":"比如你跟上海人对话时，会发现上海话听起来就像外语一样。","p":"Bǐrú nǐ gēn Shànghǎi rén duìhuà shí, huì fāxiàn Shànghǎihuà tīng qǐlai jiù xiàng wàiyǔ yíyàng.","v":"Ví dụ khi bạn trò chuyện với người Thượng Hải, bạn sẽ thấy tiếng Thượng Hải nghe cứ như tiếng nước ngoài vậy."},{"s":"","z":"虽然上海人也会讲普通话，可是仔细听，还是有上海味儿。","p":"Suīrán Shànghǎi rén yě huì jiǎng pǔtōnghuà, kěshì zǐxì tīng, háishi yǒu Shànghǎi wèir.","v":"Tuy người Thượng Hải cũng nói được tiếng phổ thông, nhưng nghe kỹ thì vẫn có chất giọng Thượng Hải."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"一个人有时间一定要去旅行，旅行不仅能丰富一个人的经历，而且是很好的减压方法。","p":"Yí ge rén yǒu shíjiān yídìng yào qù lǚxíng, lǚxíng bùjǐn néng fēngfù yí ge rén de jīnglì, érqiě shì hěn hǎo de jiǎnyā fāngfǎ.","v":"Người ta hễ có thời gian thì nhất định phải đi du lịch; du lịch không những làm phong phú trải nghiệm của mỗi người mà còn là cách giảm áp lực rất tốt."},{"s":"","z":"但对我来说，最重要的是旅行能让我有机会尝到各地有名的小吃。","p":"Dàn duì wǒ lái shuō, zuì zhòngyào de shì lǚxíng néng ràng wǒ yǒu jīhuì chángdào gèdì yǒumíng de xiǎochī.","v":"Nhưng với tôi, điều quan trọng nhất là du lịch cho tôi cơ hội được nếm những món ăn vặt nổi tiếng của khắp mọi miền."},{"s":"","z":"放假的时候，我会收拾好行李，带上地图，买张火车票，向目的地出发。","p":"Fàngjià de shíhou, wǒ huì shōushi hǎo xíngli, dàishang dìtú, mǎi zhāng huǒchēpiào, xiàng mùdìdì chūfā.","v":"Đến kỳ nghỉ, tôi sẽ thu xếp hành lý, mang theo bản đồ, mua một tấm vé tàu rồi lên đường đến nơi mình muốn."},{"s":"","z":"说起吃的东西，给我印象最深的是湖南菜。","p":"Shuōqǐ chī de dōngxi, gěi wǒ yìnxiàng zuì shēn de shì Húnán cài.","v":"Nhắc đến chuyện ăn uống, thứ để lại ấn tượng sâu đậm nhất trong tôi là món Hồ Nam."},{"s":"","z":"湖南菜的特点就是辣，与其他地方的辣不同，湖南菜的辣主要是咸辣、香辣和酸辣。","p":"Húnán cài de tèdiǎn jiù shì là, yǔ qítā dìfang de là bùtóng, Húnán cài de là zhǔyào shì xiánlà, xiānglà hé suānlà.","v":"Đặc điểm của món Hồ Nam chính là cay; khác với cái cay của những nơi khác, cái cay của món Hồ Nam chủ yếu là cay mặn, cay thơm và cay chua."},{"s":"","z":"虽然全国各地都有湖南饭馆儿，但最好还是直接去那里尝一尝。","p":"Suīrán quánguó gèdì dōu yǒu Húnán fànguǎnr, dàn zuìhǎo háishi zhíjiē qù nàlǐ cháng yi cháng.","v":"Tuy khắp cả nước đều có quán ăn Hồ Nam, nhưng tốt nhất vẫn là đến tận nơi nếm thử."},{"s":"","z":"每次旅行结束后，我都会精神百倍地开始我的工作。","p":"Měi cì lǚxíng jiéshù hòu, wǒ dōu huì jīngshén bǎibèi de kāishǐ wǒ de gōngzuò.","v":"Sau mỗi chuyến đi, tôi đều bắt tay vào công việc với tinh thần phấn chấn gấp bội."}]}],"gram":[{"id":"v-qilai","t":"V起来 / 说起……、听起来……","s":"nghe/nói/làm thử thì thấy…; hễ nhắc đến…","b":"<b>V起来</b> đặt sau động từ để nêu <b>cảm nhận hoặc đánh giá khi thực hiện hành động đó</b>: 听起来 (nghe thì thấy), 看起来 (nhìn thì thấy), 说起来 (nói thì…), 做起来 (làm thì…). Riêng <b>说起 / 聊起 + đối tượng</b> đặt ở đầu câu có nghĩa \"hễ nhắc tới…, nói đến…\" để mở đầu một chủ đề.","r":["Vị trí: chủ ngữ + V起来 + phần nhận xét. VD: 上海话听起来就像外语一样。","Hay đi thành cặp đối lập: 说起来容易，做起来难。","说起/聊起/想起 + danh từ đứng đầu câu để dẫn đề, sau đó mới nêu nhận xét.","lỗi hay gặp: ✗ 上海话起来听像外语 → ✓ 上海话听起来像外语"],"e":[["比如你跟上海人对话时，会发现上海话听起来就像外语一样。","Bǐrú nǐ gēn Shànghǎi rén duìhuà shí, huì fāxiàn Shànghǎihuà tīng qǐlai jiù xiàng wàiyǔ yíyàng.","Ví dụ khi bạn nói chuyện với người Thượng Hải, bạn sẽ thấy tiếng Thượng Hải nghe cứ như tiếng nước ngoài vậy. <i>(bài khoá 1)</i>"],["说起吃的东西，给我印象最深的是湖南菜。","Shuōqǐ chī de dōngxi, gěi wǒ yìnxiàng zuì shēn de shì Húnán cài.","Nhắc đến chuyện ăn uống, thứ để lại ấn tượng sâu nhất trong tôi là món Hồ Nam. <i>(bài khoá 2)</i>"]],"d":[["我本来以为做生意很简单，____________________。","但是没想到说起来容易做起来难"],["公园里每天都有很多老人唱京剧，_____________。","听起来，很多老人唱得很专业"],["他的汉语语法虽然有点儿小错误，_____________。","但是发音听起来和中国人一样"]],"w":"听起来 là cảm nhận chủ quan (nghe thì thấy…), khác 听说 là \"nghe nói rằng…\" (dẫn nguồn tin)."},{"id":"xiang-yiyang","t":"像……一样","s":"giống như…, y như…","b":"Dùng để so sánh: <b>A + 像 + B + 一样 + (tính chất/hành động)</b>, nghĩa là A giống hệt B. Có thể thêm 就 trước 像 để nhấn mạnh: 就像……一样.","r":["一样 không được bỏ: 像 mở đầu, 一样 đóng lại vế so sánh.","Có thể đứng trước tính từ hoặc động từ: 像外语一样 / 像刚发生的一样。","Phủ định: 不像……一样 hoặc 跟……不一样。","lỗi hay gặp: ✗ 上海话听起来像外语 (thiếu 一样) → ✓ 上海话听起来就像外语一样"],"e":[["会发现上海话听起来就像外语一样。","Huì fāxiàn Shànghǎihuà tīng qǐlai jiù xiàng wàiyǔ yíyàng.","Sẽ thấy tiếng Thượng Hải nghe cứ như một thứ tiếng nước ngoài vậy. <i>(bài khoá 1)</i>"]],"d":[["尽管已经过去十多年了，______________________。","当我们说起那件事，还像刚发生的一样"]],"w":"Phân biệt với 跟……一样 (giống nhau về mức độ/tính chất, không mang sắc thái ví von): 他的发音跟中国人一样 = phát âm ngang người Trung Quốc; 像……一样 thiên về ví von, tưởng tượng."},{"id":"yi-liangci-yi-liangci-de","t":"一 + 量词 + 一 + 量词 + 地 + V","s":"từng… từng… một","b":"Lượng từ lặp lại theo mẫu <b>一棵一棵地 / 一个一个地 / 一次一次地</b> làm trạng ngữ, nhấn mạnh hành động diễn ra <b>lần lượt, cái này rồi đến cái kia</b>. Sau cụm này bắt buộc có 地 rồi mới đến động từ.","r":["Lượng từ phải hợp với danh từ: 树 dùng 棵, 人 dùng 个, 件 cho quần áo…","Vị trí: đứng ngay trước động từ, sau chủ ngữ: 窗外的树一棵一棵地变绿。","Có thể rút gọn thành 一棵棵地, nghĩa không đổi.","lỗi hay gặp: ✗ 树一棵一棵变绿 → ✓ 树一棵一棵地变绿"],"e":[["窗外的树一棵一棵地变绿，北方也许还下着雪。","Chuāngwài de shù yì kē yi kē de biàn lǜ, běifāng yěxǔ hái xiàzhe xuě.","Cây bên ngoài cửa sổ cứ từng cây từng cây xanh dần lên, trong khi miền Bắc có lẽ vẫn còn đổ tuyết. <i>(bài khoá 1)</i>"]],"d":[],"w":"地 ở đây đọc là <b>de</b> (trạng ngữ), đừng nhầm với 得 sau động từ (bổ ngữ mức độ)."},{"id":"suiran-keshi-que","t":"虽然……，可是/但是…… ；却","s":"tuy… nhưng…; thế mà, ngược lại","b":"<b>虽然</b> nêu sự thật đã thừa nhận, vế sau dùng <b>可是/但是/但</b> nêu điều trái ngược. <b>却</b> cũng mang nghĩa \"thế mà, ngược lại\" nhưng là <b>phó từ</b>, phải đứng <b>sau chủ ngữ, trước động từ/tính từ</b>, không đứng đầu câu.","r":["虽然 đứng trước hoặc sau chủ ngữ đều được; 可是/但是 luôn ở đầu vế sau.","却 không thể đứng đầu vế câu: phải là 南方却已经…, không phải 却南方已经…","可以 dùng chung: 虽然……，却…… (vế sau vừa có 但是 vừa có 却 cũng được).","lỗi hay gặp: ✗ 虽然他会说普通话，但是却他有上海味儿 → ✓ 虽然他会说普通话，可是他却有上海味儿"],"e":[["虽然上海人也会讲普通话，可是仔细听，还是有上海味儿。","Suīrán Shànghǎi rén yě huì jiǎng pǔtōnghuà, kěshì zǐxì tīng, háishi yǒu Shànghǎi wèir.","Tuy người Thượng Hải cũng nói được tiếng phổ thông, nhưng nghe kỹ thì vẫn có chất giọng Thượng Hải. <i>(bài khoá 1)</i>"],["北方也许还下着雪，南方却已经到处都是绿色了。","Běifāng yěxǔ hái xiàzhe xuě, nánfāng què yǐjīng dàochù dōu shì lǜsè le.","Miền Bắc có lẽ vẫn còn đổ tuyết, còn miền Nam thì đã xanh mướt khắp nơi rồi. <i>(bài khoá 1)</i>"],["虽然全国各地都有湖南饭馆儿，但最好还是直接去那里尝一尝。","Suīrán quánguó gèdì dōu yǒu Húnán fànguǎnr, dàn zuìhǎo háishi zhíjiē qù nàlǐ cháng yi cháng.","Tuy khắp cả nước đều có quán ăn Hồ Nam, nhưng tốt nhất vẫn là đến tận nơi nếm thử. <i>(bài khoá 2)</i>"]],"d":[],"w":"Trong tiếng Việt ta nói \"tuy… nhưng…\", tiếng Trung cũng giữ đủ hai vế; đừng bỏ 虽然 hay 可是 như thói quen tiếng Anh (although… ,…)."},{"id":"bujin-erqie","t":"不仅……，而且……","s":"không những… mà còn…","b":"Cấu trúc tăng tiến: vế trước nêu một điểm, vế sau nêu điểm cao hơn, mạnh hơn. <b>不仅</b> là cách nói hơi trang trọng của <b>不但</b>; 而且 có thể thay bằng 还/也.","r":["Cùng một chủ ngữ: 不仅/不但 đứng SAU chủ ngữ (旅行不仅能……，而且……).","Khác chủ ngữ: 不仅/不但 đứng TRƯỚC chủ ngữ (不仅他去，而且我也去).","而且 thường đi với 还/也 để nhấn mạnh thêm.","lỗi hay gặp: ✗ 不仅旅行能丰富经历，而且是很好的减压方法 (cùng chủ ngữ mà đặt 不仅 trước chủ ngữ) → ✓ 旅行不仅能丰富经历，而且是很好的减压方法"],"e":[["旅行不仅能丰富一个人的经历，而且是很好的减压方法。","Lǚxíng bùjǐn néng fēngfù yí ge rén de jīnglì, érqiě shì hěn hǎo de jiǎnyā fāngfǎ.","Du lịch không những làm phong phú trải nghiệm của một người mà còn là cách giảm áp lực rất tốt. <i>(bài khoá 2)</i>"]],"d":[],"w":"不仅/不但……而且…… là quan hệ tăng tiến (cùng chiều); đừng lẫn với 虽然……可是…… là quan hệ nhượng bộ (ngược chiều)."},{"id":"yu-butong-dui-laishuo","t":"与……不同 ；对……来说","s":"khác với…; đối với… mà nói","b":"<b>与A不同</b> (= 跟A不一样) thường làm thành phần chen giữa câu để so sánh sự khác biệt; 与 là cách nói viết, trang trọng hơn 跟. <b>对……来说</b> nêu <b>lập trường, góc nhìn</b> của người nào đó, luôn đứng đầu câu.","r":["与……不同 đứng trước mệnh đề chính, ngăn bằng dấu phẩy: 与其他地方的辣不同，湖南菜的辣主要是……","对……来说 + mệnh đề: 对我来说，最重要的是……","Đừng thay 对……来说 bằng 对……说 (nghĩa là \"nói với ai đó\").","lỗi hay gặp: ✗ 对我说，旅行最重要 → ✓ 对我来说，旅行最重要"],"e":[["湖南菜的特点就是辣，与其他地方的辣不同，湖南菜的辣主要是咸辣、香辣和酸辣。","Húnán cài de tèdiǎn jiù shì là, yǔ qítā dìfang de là bùtóng, Húnán cài de là zhǔyào shì xiánlà, xiānglà hé suānlà.","Đặc điểm của món Hồ Nam chính là cay; khác với cái cay của nơi khác, cái cay của món Hồ Nam chủ yếu là cay mặn, cay thơm và cay chua. <i>(bài khoá 2)</i>"],["但对我来说，最重要的是旅行能让我有机会尝到各地有名的小吃。","Dàn duì wǒ lái shuō, zuì zhòngyào de shì lǚxíng néng ràng wǒ yǒu jīhuì chángdào gèdì yǒumíng de xiǎochī.","Nhưng với tôi, điều quan trọng nhất là du lịch cho tôi cơ hội nếm các món ăn vặt nổi tiếng khắp nơi. <i>(bài khoá 2)</i>"]],"d":[],"w":"与……不同 dùng trong văn viết; khi nói chuyện hằng ngày người Trung Quốc hay dùng 跟……不一样."},{"id":"v-zhe-v-zhe-jiu","t":"V着V着，就……了","s":"đang… một hồi thì (bỗng)…","b":"Lặp lại cùng một động từ với <b>着</b> (đọc nhẹ <i>zhe</i>) để tả một hành động kéo dài; trong lúc hành động đó diễn ra thì <b>bất ngờ</b> xảy ra chuyện nêu ở vế sau, vế sau thường có <b>就</b> và kết thúc bằng <b>了</b>.","r":["Hai động từ phải giống hệt nhau: 看着看着 / 吃着吃着 / 想着想着。","Kết quả ở vế sau là ngoài dự tính, không chủ động làm.","Chủ ngữ hai vế là cùng một người, thường được lược bỏ ở vế sau.","lỗi hay gặp: ✗ 看着听着就睡着了 → ✓ 看着看着就睡着了"],"e":[["北方也许还下着雪，南方却已经到处都是绿色了。","Běifāng yěxǔ hái xiàzhe xuě, nánfāng què yǐjīng dàochù dōu shì lǜsè le.","Miền Bắc có lẽ vẫn đang đổ tuyết, còn miền Nam thì đã xanh khắp nơi rồi. <i>(bài khoá 1 — đây chỉ là 着 chỉ trạng thái đang tiếp diễn, dùng để đối chiếu; bài khoá hiện có không có câu mẫu V着V着)</i>"]],"d":[["小时候的记忆总是那么美好，_________________。","有时候总是想着想着就笑了"],["那天的羊肉饺子太好吃了，_________________。","吃着吃着就吃了两盘"],["这篇小说写得太无聊了，_________________。","看着看着就睡着了"]],"w":"Đây là điểm ngữ pháp của 练一练 nhưng ba bài hội thoại của bài 20 không trích được, nên chưa có ví dụ nguyên văn từ bài khoá — hãy học qua ba câu 练一练 ở trên."},{"id":"yi-jiu","t":"一……就……","s":"hễ… là…; vừa… đã…","b":"Mẫu này có hai nghĩa: (1) <b>hễ A là B</b> — chuyện A xảy ra thì luôn kéo theo B; (2) <b>vừa A thì lập tức B</b> — hai việc nối nhau rất nhanh. 一 và 就 đều là phó từ, đứng trước động từ.","r":["Cùng chủ ngữ: 我一去上海就去那家饭店吃饭。","Khác chủ ngữ: 老师一进来，学生们就安静了。","Thường đi với 每次 / 总是 để nhấn mạnh tính lặp lại: 每次我一去上海就……","lỗi hay gặp: ✗ 一我去北方就皮肤很干 → ✓ 我一去北方就觉得皮肤很干"],"e":[["每次旅行结束后，我都会精神百倍地开始我的工作。","Měi cì lǚxíng jiéshù hòu, wǒ dōu huì jīngshén bǎibèi de kāishǐ wǒ de gōngzuò.","Sau mỗi chuyến đi, tôi đều bắt đầu công việc với tinh thần phấn chấn gấp bội. <i>(bài khoá 2 — câu mang ý \"hễ… là…\" bằng mẫu 每次……都……, dùng để đối chiếu với 一……就……)</i>"]],"d":[["明天我要去上海出差，________________________。","每次我一去上海就要去那家饭店吃饭"],["张阿姨还是不适应北方的气候，________________。","一去北方就觉得皮肤很干，感觉不舒服"],["马经理上午去开会了，________________________。","他们一开会就要开四五个小时"]],"w":"Bài khoá trích được không có câu 一……就……; ví dụ nguyên văn lấy từ 练一练. Phân biệt với 每次……都…… (chỉ nhấn mạnh sự lặp lại, không nhấn mạnh \"ngay lập tức\")."},{"id":"jiujing-daodi","t":"究竟 / 到底","s":"rốt cuộc, cuối cùng thì…","b":"<b>究竟</b> và <b>到底</b> đều là phó từ đặt trong <b>câu hỏi</b> để thúc giục, nhấn mạnh muốn biết cho ra lẽ. Ngoài ra <b>到底</b> còn có nghĩa \"đến cùng\" khi đứng sau động từ (坚持到底), còn 究竟 thì không dùng như vậy.","r":["Chỉ dùng trong câu hỏi có từ để hỏi (谁/什么/哪儿/怎么) hoặc câu hỏi chính phản; KHÔNG dùng với 吗.","Vị trí: sau chủ ngữ, trước động từ — 你猜究竟谁能先进球？","究竟 trang trọng hơn, 到底 khẩu ngữ hơn; đa số trường hợp thay thế được cho nhau.","lỗi hay gặp: ✗ 他究竟来吗？ → ✓ 他究竟来不来？"],"e":[["虽然上海人也会讲普通话，可是仔细听，还是有上海味儿。","Suīrán Shànghǎi rén yě huì jiǎng pǔtōnghuà, kěshì zǐxì tīng, háishi yǒu Shànghǎi wèir.","Tuy người Thượng Hải cũng nói được tiếng phổ thông, nhưng nghe kỹ thì vẫn có chất giọng Thượng Hải. <i>(bài khoá 1 — dùng để đối chiếu ngữ khí \"nghe cho ra lẽ\"; bài khoá hiện có không có câu chứa 究竟/到底)</i>"]],"d":[["这场比赛太精彩了，你猜__________谁能先进球。","究竟/到底"],["这个题我做了三遍，可每次算出来的答案都不一样，真奇怪，__________是哪儿出问题了？","究竟/到底"],["她决心一定要将减肥进行__________。","到底"],["无论做什么事情都不会很容易就成功，只有坚持__________，才会有希望。","到底"],["生气多是由误会引起的，因此当你觉得自己要生气的时候，最好先弄清楚___________是怎么回事。","究竟/到底"]],"w":"Khi mang nghĩa \"làm đến cùng\" (坚持到底、进行到底) thì CHỈ dùng 到底, tuyệt đối không dùng 究竟."}],"notes":"Ba bài khoá 1–3 và tiêu đề chính thức được bổ sung từ Giáo trình chuẩn HSK 4 tập 2, trang 136–138 (bản scan, đọc trực tiếp từ sách). Hai đoạn trích được từ slide thực chất là bài khoá 4 và 5 nên đã đánh số lại cho đúng sách.","order":[{"z":"该加油了，去机场的路上有加油站吗？","t":["该","加油","了","去","机场","的","路上","有","加油站","吗"],"v":"Phải đổ xăng rồi, trên đường ra sân bay có trạm xăng không?"},{"z":"好，那我就放心了，别开着开着没油了。","t":["好","那","我","就","放心","了","别开","着","开着","没油","了"],"v":"Được, vậy thì tớ yên tâm, kẻo đang chạy lại hết xăng. Chuyến bay đi Bắc Kinh của cậu mấy giờ? Thời gian có kịp không?"},{"z":"你去北京的航班是几点的？","t":["你","去","北京","的","航班","是","几点","的"],"v":"Được, vậy thì tớ yên tâm, kẻo đang chạy lại hết xăng. Chuyến bay đi Bắc Kinh của cậu mấy giờ? Thời gian có kịp không?"},{"z":"刚才我还有点儿担心来不及呢。","t":["刚才","我","还","有点儿","担心","来不及","呢"],"v":"Nãy giờ tớ còn hơi lo không kịp. Lát nữa đổ xăng xong, đi về phía tây năm trăm mét là lên được đường cao tốc. Đi cao tốc khoảng nử"},{"z":"一会儿加完油，往西走五百米就能上高速公路。","t":["一会儿","加完","油","往西","走","五百米","就","能","上","高速公路"],"v":"Nãy giờ tớ còn hơi lo không kịp. Lát nữa đổ xăng xong, đi về phía tây năm trăm mét là lên được đường cao tốc. Đi cao tốc khoảng nử"},{"z":"走高速公路大约半个小时就到了。","t":["走","高速公路","大约","半个","小时","就","到","了"],"v":"Nãy giờ tớ còn hơi lo không kịp. Lát nữa đổ xăng xong, đi về phía tây năm trăm mét là lên được đường cao tốc. Đi cao tốc khoảng nử"},{"z":"这次放假咱们带她去哪儿玩儿比较好呢？","t":["这次","放假","咱们","带","她","去","哪儿","玩儿","比较","好","呢"],"v":"Ngày thường con học nhiều thế, lúc nào cũng nói muốn đi du lịch mà không có thời gian, tội ghê. Kỳ nghỉ này mình đưa con đi đâu ch"},{"z":"等女儿一回来我就告诉她这个好消息。","t":["等","女儿","一","回来","我","就","告诉","她","这个","好消息"],"v":"Được đấy, khí hậu ở đó khác miền Bắc lắm, dù là mùa đông cũng rất ấm áp, lại còn được ăn nhiều hoa quả tươi. Đợi con về là anh báo"},{"z":"那时候再告诉她，不是更好？","t":["那","时候","再","告诉","她","不是","更好"],"v":"Khoan hẵng nói. Trưa nay chẳng phải nhà mình sang nhà hàng đối diện ăn vịt quay, chúc mừng con thi đạt hết đó sao? Lúc đó hãy nói,"},{"z":"好主意，到时她知道了肯定特别开心。","t":["好","主意","到","时","她","知道","了","肯定","特别","开心"],"v":"Ý hay đấy, lúc đó con biết chắc chắn sẽ vui lắm."},{"z":"她打扮得真漂亮。","t":["她","打扮","得","真","漂亮"],"v":"Người cụng ly với cậu trong tấm ảnh này là người dân tộc thiểu số à? Cô ấy trang điểm đẹp thật."},{"z":"她是我们的导游，不是少数民族。","t":["她","是","我们","的","导游","不是","少数民族"],"v":"Cô ấy là hướng dẫn viên của bọn mình, không phải người dân tộc. Suốt dọc đường cô ấy kể cho bọn mình rất nhiều chuyện cười thú vị."},{"z":"一路上她给我们讲了很多有趣的笑话。","t":["一路上","她","给","我们","讲","了","很多","有趣","的","笑话"],"v":"Cô ấy là hướng dẫn viên của bọn mình, không phải người dân tộc. Suốt dọc đường cô ấy kể cho bọn mình rất nhiều chuyện cười thú vị."},{"z":"这张照片就是找到钥匙后，我们一起照的。","t":["这张","照片","就是","找到","钥匙","后","我们","一起","照","的"],"v":"Cô ấy là hướng dẫn viên của bọn mình, không phải người dân tộc. Suốt dọc đường cô ấy kể cho bọn mình rất nhiều chuyện cười thú vị."},{"z":"究竟哪个季节去丽江旅游比较好呢？","t":["究竟","哪个","季节","去","丽江","旅游","比较","好","呢"],"v":"Sang năm có dịp mình cũng đi xem thử, tới lúc đó giới thiệu hướng dẫn viên của cậu cho mình nhé. Rốt cuộc đi Lệ Giang vào mùa nào "},{"z":"另外，南方和北方的语言也有很大不同。","t":["另外","南方","和","北方","的","语言","也","有","很大","不同"],"v":"Ngoài ra, tiếng nói của miền Nam và miền Bắc cũng khác nhau rất nhiều."}]}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS=Object.keys(D).map(Number).sort((a,b)=>a-b);
let cur=LS[0], mode='lesson';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().trim().replace(/\s+/g,' ');
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase();
const allWords=l=>D[l].batches.flat();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]]}return a};

/* ============== GIAO DIỆN BÀI HỌC ============== */
let TAB='v', vBatch=-1, tIdx=0, gIdx=null;

function lessonTabs(n){
  const L=D[n];
  const ts=[['v','Từ mới',allWords(n).length],['t','Bài khoá',L.texts.length],
            ['g','Ngữ pháp',L.gram.length],['q','Kiểm tra','']];
  return `<div class="tabs">`+ts.map(([k,lab,c])=>
    `<button class="${TAB===k?'on':''}" onclick="setTab('${k}')">${lab}`
    +(c!==''?` <i>${c}</i>`:'')+`</button>`).join('')+`</div>`;
}
function setTab(k){TAB=k;renderTab()}
function setBatch(i){vBatch=i;renderTab()}
function setText(i){tIdx=i;renderTab()}

/* ---- tab 1: từ mới, dạng lưới thẻ lật ---- */
function vocabTab(n){
  const L=D[n], all=allWords(n);
  const ws = vBatch<0 ? all : L.batches[vBatch];
  const chips=`<div class="tbar">
    <span class="chip ${vBatch<0?'on':''}" onclick="setBatch(-1)">Tất cả · ${all.length}</span>`
   + L.batches.map((b,i)=>`<span class="chip ${vBatch===i?'on':''}" onclick="setBatch(${i})">Bài khoá ${i+1} · ${b.length}</span>`).join('')
   + `<span class="chip" onclick="flipAll(this)">Lật hết</span></div>`;
  return chips+`<div class="vgrid" id="vg">`+ws.map(w=>`
    <div class="vc" onclick="this.classList.toggle('rv')">
      <div class="h">${w.h}</div><div class="p">${esc(w.p)}</div>
      <div class="v">${esc(w.v)}</div>
      ${w.ez?`<div class="ex"><span class="ez">${w.ez}</span>
        ${w.ey?`<span class="ey">${esc(w.ey)}</span>`:''}
        <span class="ev">${esc(w.ev)}</span></div>`:''}</div>`).join('')+`</div>`;
}
function flipAll(el){
  const cs=$$('#vg .vc'), on=cs.some(c=>!c.classList.contains('rv'));
  cs.forEach(c=>c.classList.toggle('rv',on));
  el.textContent=on?'Che hết':'Lật hết';
}

/* ---- tab 2: bài khoá, mỗi lần một bài ---- */
function textTab(n){
  const L=D[n];
  if(tIdx>=L.texts.length) tIdx=0;
  const t=L.texts[tIdx];
  const chips=`<div class="tbar">`+L.texts.map((x,i)=>
    `<span class="chip ${tIdx===i?'on':''}" onclick="setText(${i})">Bài khoá ${x.no}</span>`).join('')+`</div>`;
  return chips+`<section class="sec"><div class="sh">
      <h2>Bài khoá ${t.no}${t.tz?` — ${t.tz}`:''}</h2>
      <span class="tag">${t.lines.length} câu</span></div>
      ${t.tv?`<div class="sub" style="margin:-6px 0 12px">${esc(t.tv)}</div>`:''}
      ${vocabRef(n,t.no)}
      ${textSec(t,tIdx,n)}</section>`;
}
/* bảng từ mới thu nhỏ ngay trong bài khoá, để đọc tới đâu tra tới đó */
function vocabRef(n,no){
  const ws=(D[n].batches||[])[no-1]||[];
  if(!ws.length) return '';
  return `<div class="vref" id="vref">
    <div class="vrh"><span>Từ mới của bài khoá ${no} · ${ws.length} từ</span>
      <button class="btn sm" onclick="vrefAll(this)">Hiện nghĩa</button></div>
    <div class="vmini">`+ws.map(w=>`<span class="vm" onclick="this.classList.toggle('rv')">
        <b>${w.h}</b><i>${esc(w.p)}</i><em>${esc(w.v)}</em></span>`).join('')+`</div></div>`;
}
function vrefAll(el){
  const cs=$$('#vref .vm'), on=cs.some(c=>!c.classList.contains('rv'));
  cs.forEach(c=>c.classList.toggle('rv',on));
  el.textContent=on?'Ẩn nghĩa':'Hiện nghĩa';
}

/* ---- tab 3: ngữ pháp, lưới ô mở popup ---- */
function gramTab(n){
  const L=D[n];
  if(!L.gram.length) return `<div class="note">Bài này chưa có phần ngữ pháp.</div>`;
  return `<div class="note">Bấm một ô để mở chi tiết. Ô gắn <b style="color:var(--ok)">✓ sách</b>
     là điểm 注释 của giáo trình; còn lại là phần soạn thêm từ bài 练一练 và câu trong bài khoá.</div>
    <div class="ggrid">`+L.gram.map((g,i)=>`
    <button class="gt" onclick="openG(${i})">
      <h3>${g.t}</h3><div class="gs">${esc(g.s)}</div>
      <div class="mt">${g.src==='sách'?'<span class="src">✓ sách</span>':'<span>bổ sung</span>'}
        <span>${(g.e||[]).length} ví dụ</span>
        ${(g.d||[]).length?`<span>${g.d.length} câu luyện</span>`:''}</div></button>`).join('')+`</div>`;
}
function openG(i){
  const L=D[cur], g=L.gram[i]; if(!g) return;
  gIdx=i;
  const old=$('#sheet'); if(old) old.remove();
  const el=document.createElement('div');
  el.className='sheet'; el.id='sheet';
  el.onclick=e=>{if(e.target===el) closeG()};
  el.innerHTML=`<div class="sbox">
    <div class="shead"><div style="flex:1"><h3>${g.t}</h3><div class="gs sub">${esc(g.s)}</div></div>
      <button class="sx" onclick="closeG()">✕</button></div>
    <div class="gbody">${gbody(g)}</div>
    <div class="snav">
      <button class="btn" ${i===0?'disabled':''} onclick="openG(${i-1})">← Trước</button>
      <span class="sub">${i+1} / ${L.gram.length}</span>
      <button class="btn" ${i===L.gram.length-1?'disabled':''} onclick="openG(${i+1})">Sau →</button>
    </div></div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
}
function closeG(){const s=$('#sheet'); if(s)s.remove(); document.body.style.overflow=''; gIdx=null}
document.addEventListener('keydown',e=>{
  if(!$('#sheet')) return;
  if(e.key==='Escape') closeG();
  else if(e.key==='ArrowRight'&&gIdx<D[cur].gram.length-1) openG(gIdx+1);
  else if(e.key==='ArrowLeft'&&gIdx>0) openG(gIdx-1);
});

function rev(el){el.textContent=el.dataset.a;el.classList.add('on')}

function gbody(g){
  const eg=(g.e||[]).map(e=>`<div class="eg"><div class="z">${e[0]}</div>
     <div class="y">${esc(e[1])}</div><div class="v">${e[2]}</div></div>`).join('');

     <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Bài luyện của giáo trình — bấm chỗ trống để hiện đáp án</div>`
    +g.d.map((q,i)=>`<div class="q"><b>${i+1}.</b>`
      +String(q[0]).replace(/_{2,}/,`<span class="blank" data-a="${esc(q[1])}" onclick="rev(this)">?</span>`)
      +`</div>`).join('')+`</div>`:'';
  return `<p>${g.b}</p>${(g.r||[]).length?`<ul>${g.r.map(r=>`<li>${r}</li>`).join('')}</ul>`:''}
    ${eg}${dr}${g.w?`<div class="warn">${g.w}</div>`:''}`;

/* ---------- trình phát tiếng ----------
   File nghe đặt cạnh index.html trong thư mục audio/, tên NN-M.mp3 = bài NN, khoá M.
   Không có thư mục đó thì nút phát tự ẩn, phần còn lại vẫn chạy bình thường.   */
const AU = new Audio();
let auKey=null, auLoop=false, auIdx=null;
function auName(les,no){ return `${String(les).padStart(2,'0')}-${no}.mp3` }
function auSrc(les,no){ return 'audio/'+auName(les,no) }
function fmtT(s){ if(!isFinite(s))return '0:00';
  const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0') }

function playerHTML(les,no,i){
  return `<div class="player" id="pl${i}">
    <button class="pbtn" id="pb${i}" onclick="auToggle(${les},${no},${i})">▶</button>
    <input class="seek" id="sk${i}" type="range" min="0" max="1000" value="0"
      oninput="auSeek(${i},this.value)">
    <span class="tt" id="tt${i}">0:00 / 0:00</span>
    <span class="spd">${[0.6,0.8,1].map(r=>
      `<b class="${r===1?'on':''}" data-r="${r}" onclick="auRate(${i},${r})">${r}×</b>`).join('')}</span>
    <b class="lp" id="lp${i}" onclick="auLoopTg(${i})">Lặp</b>
  </div>`;
}
function auToggle(les,no,i){
  const key=auName(les,no);
  if(auKey===key && !AU.paused){ AU.pause(); syncBtns(); return }
  if(auKey!==key){ auKey=key; AU.src='audio/'+key; AU.currentTime=0; AU.playbackRate=curRate(i) }
  auIdx=i; AU.loop=auLoop;
  AU.play().then(syncBtns).catch(()=>{
    /* không có thư mục audio/ thì thử file đặt ngay cạnh index.html */
    AU.src=key; AU.currentTime=0; AU.playbackRate=curRate(i); AU.loop=auLoop;
    AU.play().then(syncBtns).catch(()=>{
      const p=document.getElementById('pl'+i);
      if(p && !p.querySelector('.miss'))
        p.insertAdjacentHTML('beforeend',
          `<span class="miss">Chưa thấy <code>audio/${key}</code> — chép thư mục audio/ vào cạnh file web.</span>`);
    });
  });
}
function curRate(i){
  const on=document.querySelector(`#pl${i} .spd b.on`); return on?+on.dataset.r:1 }
function auRate(i,r){
  document.querySelectorAll(`#pl${i} .spd b`).forEach(b=>b.classList.toggle('on',+b.dataset.r===r));
  AU.playbackRate=r;
}
function auSeek(i,v){ if(AU.duration) AU.currentTime=AU.duration*v/1000 }
function auLoopTg(i){ auLoop=!auLoop; AU.loop=auLoop;
  document.querySelectorAll('.lp').forEach(b=>b.classList.toggle('on',auLoop)) }
function syncBtns(){
  document.querySelectorAll('.pbtn').forEach(b=>b.textContent='▶');
  if(!AU.paused && auIdx!=null){
    const b=document.getElementById('pb'+auIdx); if(b)b.textContent='❚❚';
  }
}
AU.addEventListener('timeupdate',()=>{
  document.querySelectorAll('.player').forEach(p=>{
    const i=p.id.slice(2);
    const sk=document.getElementById('sk'+i), tt=document.getElementById('tt'+i);
    if(sk&&AU.duration&&p.querySelector('.pbtn').textContent==='❚❚'){
      sk.value=AU.currentTime/AU.duration*1000;
      tt.textContent=`${fmtT(AU.currentTime)} / ${fmtT(AU.duration)}`;
    }
  });
});
AU.addEventListener('ended',syncBtns);
AU.addEventListener('pause',syncBtns);


/* ==================== BỘ KIỂM TRA THÍCH ỨNG ====================
   3 mức. Đúng 2 câu liên tiếp → lên mức. Sai 1 câu → xuống mức.
   Mức 1 trắc nghiệm nhiễu ngẫu nhiên · Mức 2 nhiễu gần + điền từ + ngữ pháp
   Mức 3 gõ tay, không có lựa chọn sẵn, thêm sắp xếp trật tự từ.        */
const LV=[{n:'Dễ',c:'var(--ok)'},{n:'Khó',c:'var(--warn)'},{n:'Siêu khó',c:'var(--bad)'}];
const TN={hv:'Hán → nghĩa',vh:'Nghĩa → Hán',fill:'Điền từ vào câu',gram:'Ngữ pháp',
          py:'Viết pinyin',han:'Viết chữ Hán',order:'Sắp xếp trật tự từ'};

let E=null;
function newExam(lessons,count,tag){
  E={ls:lessons,total:count,i:0,lv:0,streak:0,right:0,wrong:0,peak:0,
     asked:new Set(),missed:[],answered:false,tag:tag,hist:[]};
}
const pool=()=>E.ls.flatMap(l=>D[l].batches.flat().map(w=>({...w,L:l})));
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function others(arr,not,k,key){
  const s=shuffle(arr.filter(x=>x[key]!==not)).slice(0,k);return s}

function makeQ(){
  const P=pool(), lv=E.lv;
  let types = lv===0 ? ['hv','vh','hv','fill']
            : lv===1 ? ['fill','gram','vh','hv','py']
                     : ['han','py','order','fillType','gram'];
  for(let attempt=0;attempt<40;attempt++){
    const t=rnd(types), w=rnd(P);
    let q=null;
    if(t==='hv'){
      // mức 1 nhiễu bất kỳ; mức 2 nhiễu cùng bài
      const src = lv===0?P:P.filter(x=>x.L===w.L);
      const o=others(src.length>4?src:P,w.v,3,'v').map(x=>x.v);
      if(o.length<3) continue;
      q={t,L:w.L,key:'hv'+w.h,ask:`<div class="big">${w.h}</div>`,
         hint:lv===0?w.p:'',a:w.v,o:shuffle([w.v,...o])};
    } else if(t==='vh'){
      const src = lv===0?P:P.filter(x=>x.L===w.L&&x.h.length===w.h.length);
      const o=others(src.length>4?src:P,w.h,3,'h').map(x=>x.h);
      if(o.length<3) continue;
      q={t,L:w.L,key:'vh'+w.h,ask:`<div class="mid">${esc(w.v)}</div>`,
         a:w.h,o:shuffle([w.h,...o])};
    } else if(t==='fill'||t==='fillType'){
      if(!w.ez||!w.ez.includes(w.h)) continue;
      const sent=w.ez.replace(w.h,'⟦⟧');
      if(t==='fillType'){
        q={t:'fillType',L:w.L,key:'ft'+w.h,type:'type',ph:'gõ chữ Hán',
           ask:`<div class="sent">${sent.replace('⟦⟧','<span class="gap">?</span>')}</div>`,
           hint:w.v,a:w.h,rev:w.ev};
      } else {
        const src=P.filter(x=>x.L===w.L&&x.h.length===w.h.length&&x.h!==w.h);
        const o=others(src.length>=3?src:P,w.h,3,'h').map(x=>x.h);
        if(o.length<3) continue;
        q={t:'fill',L:w.L,key:'fl'+w.h,
           ask:`<div class="sent">${sent.replace('⟦⟧','<span class="gap">?</span>')}</div>`,
           a:w.h,o:shuffle([w.h,...o]),rev:w.ev};
      }
    } else if(t==='py'){
      q={t,L:w.L,key:'py'+w.h,type:'type',ph:'pinyin, không cần dấu',
         ask:`<div class="big">${w.h}</div>`,hint:w.v,a:w.p};
    } else if(t==='han'){
      q={t,L:w.L,key:'hn'+w.h,type:'type',ph:'gõ chữ Hán',
         ask:`<div class="mid">${esc(w.v)}</div>`,hint:w.p,a:w.h};
    } else if(t==='gram'){
      const L=rnd(E.ls), gs=D[L].gram.filter(g=>(g.d||[]).some(d=>d[1]&&/_{2,}/.test(String(d[0]))));
      if(!gs.length) continue;
      const g=rnd(gs), d=rnd(g.d.filter(d=>d[1]&&/_{2,}/.test(String(d[0]))));
      const alt=[...new Set(D[L].gram.flatMap(x=>(x.d||[]).map(y=>y[1])).filter(v=>v&&v!==d[1]))];
      if(alt.length<3) continue;
      q={t,L,key:'gr'+d[0],
         ask:`<div class="sent">${esc(String(d[0])).replace(/_{2,}/,'<span class="gap">?</span>')}</div>`,
         hint:g.t,a:d[1],o:shuffle([d[1],...shuffle(alt).slice(0,3)])};
    } else if(t==='order'){
      const L=rnd(E.ls), os=D[L].order||[];
      if(!os.length) continue;
      const it=rnd(os);
      q={t,L,key:'or'+it.z,type:'order',ask:'',hint:it.v,a:it.z,toks:shuffle([...it.t])};
    }
    if(q && !E.asked.has(q.key)){E.asked.add(q.key);return q}
    if(q && attempt>28) return q;
  }
  return null;
}

function examShell(inner){
  const pct=E.i/E.total*100;
  return `<div class="pbar"><i style="width:${pct}%"></i></div>
   <div class="qcard">
    <div class="qhead">
      <span>Câu <b>${E.i+1}</b>/${E.total} · Bài ${E.q?E.q.L:''}</span>
      <span><span class="lvbadge" style="color:${LV[E.lv].c};border-color:${LV[E.lv].c}">
        Mức ${E.lv+1} · ${LV[E.lv].n}</span>
        <span class="qtype">${E.q?TN[E.q.t]||TN.fill:''}</span></span>
    </div>${inner}
    <div class="verdict" id="vd"></div><div class="reveal hide" id="rv"></div>
   </div>
   <div style="display:flex;gap:10px;justify-content:center">
     <button class="btn" onclick="answerSkip()">Bỏ qua →</button>
     <button class="btn" onclick="quitExam()">Thoát</button></div>
   <div class="stats">Đúng <b style="color:var(--ok)">${E.right}</b> ·
     Sai <b style="color:var(--bad)">${E.wrong}</b> ·
     Mức cao nhất <b>${LV[E.peak].n}</b></div>`;
}

function renderExamQ(){
  const q=E.q=makeQ();
  if(!q){finishExam();return}
  let ctrl='';
  if(q.type==='type'){
    ctrl=`<div class="tybox"><input id="ans" autocomplete="off" spellcheck="false"
      placeholder="${q.ph}"><button class="btn primary" id="go">Kiểm tra</button></div>`;
  } else if(q.type==='order'){
    ctrl=`<div class="ordbox"><div class="slot" id="slot"></div>
      <div class="bank" id="bank">${q.toks.map((t,i)=>
        `<span class="tok" data-i="${i}" onclick="tokPush(${i})">${t}</span>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn primary" id="go" onclick="checkOrder()">Kiểm tra</button>
        <button class="btn" onclick="tokReset()">Xoá</button></div></div>`;
  } else {
    ctrl=`<div class="opts">${q.o.map((o,k)=>
      `<div class="opt" onclick="pickOpt(${k})">${esc(o)}</div>`).join('')}</div>`;
  }
  const body=`<div class="qbody">${q.ask}
     ${q.hint?`<div class="sub" style="margin-top:8px">${esc(q.hint)}</div>`:''}</div>`;
  $('#view').innerHTML=examShell(body+ctrl);
  E.answered=false; E.sel=[];
  if(q.type==='type'){
    $('#go').onclick=checkTyped;
    $('#ans').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();E.answered?nextExamQ():checkTyped()}};
    $('#ans').focus();
  }
}
function grade(ok,given){
  if(E.answered)return; E.answered=true;
  E.hist.push({lv:E.lv,ok});
  if(ok){E.right++;E.streak++;
    if(E.streak>=2&&E.lv<2){E.lv++;E.streak=0;flash('▲ Lên mức '+LV[E.lv].n)}
  }else{E.wrong++;E.streak=0;E.missed.push({q:E.q,given});
    if(E.lv>0){E.lv--;flash('▼ Xuống mức '+LV[E.lv].n)}}
  if(E.lv>E.peak)E.peak=E.lv;
}
function flash(msg){
  const d=document.createElement('div');d.className='flash';d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
}
function pickOpt(k){
  if(E.answered)return;
  const q=E.q, ok=q.o[k]===q.a;
  grade(ok,q.o[k]);
  $$('.opt').forEach((e,i)=>{if(q.o[i]===q.a)e.classList.add('ok');else if(i===k)e.classList.add('bad')});
  say(ok);
  setTimeout(nextExamQ,ok?700:2200);
}
function checkTyped(){
  const q=E.q,v=$('#ans').value; if(!v.trim())return;
  const ok = q.t==='py' ? strip(v)===strip(q.a) : v.trim()===q.a;
  grade(ok,v.trim()); say(ok);
  $('#ans').disabled=true;$('#go').textContent='Tiếp →';$('#go').onclick=nextExamQ;
}
function say(ok){
  const q=E.q;
  $('#vd').className='verdict '+(ok?'ok':'bad');
  $('#vd').textContent=ok?'✓ Đúng':'✗ Sai — đáp án: '+q.a;
  if(q.rev){$('#rv').classList.remove('hide');$('#rv').textContent=q.rev}
}
function tokPush(i){
  if(E.answered)return;
  const el=document.querySelector(`.tok[data-i="${i}"]`);
  if(!el||el.classList.contains('used'))return;
  el.classList.add('used'); E.sel.push(i);
  drawSlot();
}
function tokPop(k){
  if(E.answered)return;
  const i=E.sel.splice(k,1)[0];
  document.querySelector(`.tok[data-i="${i}"]`).classList.remove('used');
  drawSlot();
}
function tokReset(){if(E.answered)return;E.sel=[];$$('.tok').forEach(t=>t.classList.remove('used'));drawSlot()}
function drawSlot(){
  $('#slot').innerHTML=E.sel.length
    ? E.sel.map((i,k)=>`<span class="tok sel" onclick="tokPop(${k})">${E.q.toks[i]}</span>`).join('')
    : `<span class="ph">Bấm các thẻ bên dưới để xếp thành câu đúng</span>`;
}
function checkOrder(){
  if(E.answered)return;
  const q=E.q, built=E.sel.map(i=>q.toks[i]).join('');
  const target=q.a.replace(/[，。？！、；：“”‘’…—]/g,'');
  const ok=built===target;
  grade(ok,built||'(bỏ trống)');
  $('#vd').className='verdict '+(ok?'ok':'bad');
  $('#vd').textContent=ok?'✓ Đúng':'✗ Sai';
  $('#rv').classList.remove('hide');
  $('#rv').innerHTML=`<div style="font-size:18px;color:var(--ink)">${q.a}</div>
    <div style="margin-top:4px">${esc(q.hint||'')}</div>`;
  $('#go').textContent='Tiếp →'; $('#go').onclick=nextExamQ;
}
function answerSkip(){if(!E.answered)grade(false,'(bỏ qua)');nextExamQ()}
function nextExamQ(){ if(E.i<E.total-1){E.i++;renderExamQ()} else finishExam() }
function quitExam(){ E.tag==='global'?show('exam'):show('lesson',E.ls[0]) }

function finishExam(){
  const t=E.right+E.wrong,pct=t?Math.round(E.right/t*100):0;
  const lvl=LV[E.peak].n;
  $('#view').innerHTML=`<div class="qcard" style="text-align:center">
    <div style="font-size:52px">${pct>=90?'🎉':pct>=70?'👍':'💪'}</div>
    <div style="font-size:22px;font-weight:650;margin:8px 0">${E.right}/${t} câu đúng — ${pct}%</div>
    <div class="sub">Bài ${E.ls.join(', ')} · lên tới mức <b style="color:${LV[E.peak].c}">${lvl}</b></div>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" onclick="${E.tag==='global'?'startGlobal()':`startLessonExam(${E.ls[0]})`}">Làm lại</button>
      ${E.missed.length?`<button class="btn" onclick="retryMissed()">Ôn ${E.missed.length} câu sai</button>`:''}
      <button class="btn" onclick="quitExam()">Quay lại bài học</button>
    </div></div>
    ${E.missed.length?`<div class="review"><h2 style="font-size:16px">Câu đã sai</h2>
      ${E.missed.map(m=>`<div class="r">
        <div class="q">${String(m.q.ask||'').replace(/<[^>]+>/g,' ').trim()||m.q.a}</div>
        <div class="a">Bạn trả lời <b style="color:var(--bad)">${esc(m.given)}</b> ·
          Đáp án <b style="color:var(--ok)">${esc(m.q.a)}</b> · Bài ${m.q.L} · ${TN[m.q.t]||''}</div>
        </div>`).join('')}</div>`
      :`<div class="note" style="margin-top:14px">Không sai câu nào. Thử tăng số câu hoặc gộp thêm bài khác ở mục Kiểm tra tổng hợp.</div>`}`;
}
function retryMissed(){
  const ms=E.missed.slice();
  const ls=E.ls,tag=E.tag;
  newExam(ls,ms.length,tag);
  E.queue=shuffle(ms.map(m=>m.q));
  E.lv=2;
  renderRetry();
}
function renderRetry(){
  E.q=E.queue[E.i];
  if(!E.q){finishExam();return}
  let ctrl;
  const q=E.q;
  if(q.type==='order'){
    ctrl=`<div class="ordbox"><div class="slot" id="slot"></div>
      <div class="bank" id="bank">${q.toks.map((t,i)=>
        `<span class="tok" data-i="${i}" onclick="tokPush(${i})">${t}</span>`).join('')}</div>
      <div style="text-align:center;margin-top:12px">
        <button class="btn primary" id="go" onclick="checkOrder()">Kiểm tra</button>
        <button class="btn" onclick="tokReset()">Xoá</button></div></div>`;
  } else if(q.type==='type'){
    ctrl=`<div class="tybox"><input id="ans" autocomplete="off" placeholder="${q.ph}">
      <button class="btn primary" id="go">Kiểm tra</button></div>`;
  } else {
    ctrl=`<div class="opts">${q.o.map((o,k)=>
      `<div class="opt" onclick="pickOptR(${k})">${esc(o)}</div>`).join('')}</div>`;
  }
  $('#view').innerHTML=examShell(`<div class="qbody">${q.ask}
     ${q.hint?`<div class="sub" style="margin-top:8px">${esc(q.hint)}</div>`:''}</div>`+ctrl);
  E.answered=false;E.sel=[];
  if(q.type==='type'){$('#go').onclick=checkTyped;
    $('#ans').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();E.answered?nextRetry():checkTyped()}};
    $('#ans').focus()}
  if(q.type==='order')drawSlot();
}
function pickOptR(k){pickOpt(k)}
function nextRetry(){if(E.i<E.queue.length-1){E.i++;renderRetry()}else finishExam()}

/* điểm vào */
function startLessonExam(n){
  const w=D[n].batches.flat().length;
  newExam([n],Math.min(24,Math.max(12,Math.round(w*0.6))),'lesson');
  renderExamQ();
}
function startGlobal(){
  const ls=[...GEX.ls].sort((a,b)=>a-b);
  if(!ls.length){alert('Chọn ít nhất một bài.');return}
  newExam(ls,GEX.count,'global');
  renderExamQ();
}

/* ============== ĐIỀU HƯỚNG ============== */
function show(what,n){
  mode=what;
  $$('.lz').forEach(b=>b.classList.remove('on'));
  if(what==='exam'){$('#tabExam').classList.add('on');renderExamSetup()}
  else{
    if(n!==cur){TAB='v';vBatch=-1;tIdx=0}
    $('#lz'+n).classList.add('on');renderLesson(n);
    const b=$('#lz'+n); if(b&&b.scrollIntoView) b.scrollIntoView({block:'nearest',inline:'center'});
  }
  window.scrollTo({top:0});
}
$('#lessons').innerHTML=LS.map(l=>`<button class="lz" id="lz${l}" onclick="show('lesson',${l})">Bài ${l}</button>`).join('')
  +`<button class="lz exam" id="tabExam" onclick="show('exam')">Tổng hợp</button>`;
show('lesson',LS[0]);

</script>
</body></html>
