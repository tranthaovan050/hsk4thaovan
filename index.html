<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học HSK4 bài 1–20 — từ vựng, bài khoá, ngữ pháp và kiểm tra</title>
<meta name="description" content="Trang tự học HSK 4 (Giáo trình chuẩn) bài 10 đến 20: 349 từ mới có pinyin và nghĩa tiếng Việt, 52 bài khoá kèm bản dịch, 98 điểm ngữ pháp và bài kiểm tra có độ khó tự điều chỉnh.">
<meta name="theme-color" content="#2f5496">
<meta property="og:title" content="Học HSK4 bài 10-20">
<meta property="og:description" content="Từ vựng, bài khoá có dịch, ngữ pháp và kiểm tra thích ứng cho HSK4 bài 10-20.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E6%B1%89%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0f1115;--surface:#171a21;--surface2:#1f232c;--line:#2c313c;--ink:#e8eaef;
 --muted:#9aa2b1;--accent:#7aa2f7;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--purple:#bc8cff}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--surface:#fff;--surface2:#eef1f5;
 --line:#dde1e8;--ink:#1b1f27;--muted:#5c6472;--accent:#2f5496;--ok:#1a7f37;--bad:#cf222e;
 --warn:#9a6700;--purple:#6f42c1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:21px;margin:0;font-weight:650}
.zh{color:var(--muted);font-weight:400}
.sub{color:var(--muted);font-size:13px}
a{color:var(--accent)}

.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
 padding:12px 0 10px;margin-bottom:16px}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lessons{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.lz{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
 color:var(--muted);cursor:pointer;font-size:14px;font-weight:600}
.lz:hover{border-color:var(--accent)}
.lz.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lz.exam{background:var(--surface2);color:var(--purple);border-color:var(--purple)}
.lz.exam.on{background:var(--purple);color:#fff}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 13px;
 cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);
 border-radius:8px;padding:6px 9px;color:var(--ink);font:inherit;font-size:14px}

.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.nav a{font-size:13px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
 background:var(--surface);color:var(--muted);text-decoration:none}
.nav a:hover{border-color:var(--accent);color:var(--ink)}
.nav a.gr{border-color:var(--purple);color:var(--purple)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;
 padding:18px;margin-bottom:16px;scroll-margin-top:120px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{font-size:17px;margin:0;font-weight:650}
.tag{font-size:11.5px;color:var(--accent);background:var(--surface2);border-radius:20px;
 padding:2px 9px;font-weight:600}
.tag.p{color:var(--purple)}

table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
 text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.h{font-size:25px;white-space:nowrap;line-height:1.3}
td.p{color:var(--accent);white-space:nowrap;font-size:13.5px}
.exline{font-size:14.5px;margin-top:5px;opacity:.92}
.exvi{font-size:13px;color:var(--muted)}
.masked td.m{background:currentColor;color:var(--surface2);border-radius:5px;cursor:pointer}
.masked td.m *{visibility:hidden}
tr.rv td.m{background:none!important;color:inherit!important}
tr.rv td.m *{visibility:visible}

.tbar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
 background:var(--surface2);cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.line{padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:none}
.spk{color:var(--purple);font-weight:600;font-size:13.5px;margin-right:6px}
.zl{font-size:19px;line-height:1.9}
.pl{font-size:13px;color:var(--accent);margin-top:3px}
.vl{font-size:14px;color:var(--muted);margin-top:3px}
.hidep .pl{display:none}.hidev .vl{display:none}

.gcard{border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:12px;
 background:var(--surface2)}
.gcard h3{margin:0 0 2px;font-size:17px}
.gcard .gs{color:var(--muted);font-size:13px;margin-bottom:9px}
.gcard p{margin:0 0 10px;font-size:14.5px}
.gcard ul{margin:0 0 10px;padding-left:20px;font-size:14.5px}
.gcard li{margin-bottom:5px}
.eg{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin:9px 0}
.eg .z{font-size:18px}.eg .y{font-size:13px;color:var(--accent)}
.eg .v{font-size:13.5px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--warn) 13%,transparent);border-left:3px solid var(--warn);
 padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin-top:10px}
.drill{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.drill .q{font-size:16px;margin-bottom:7px}
.drill .q b{color:var(--muted);font-size:12px;margin-right:6px}
.blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--warn);
 color:var(--warn);text-align:center;font-weight:600;cursor:pointer;user-select:none}
.blank.on{border-bottom-color:var(--ok);color:var(--ok)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:9px;
 padding:10px 13px;margin-bottom:14px}

/* ------- kiểm tra tổng hợp ------- */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;
 margin-bottom:14px}
.cfg label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;
 text-transform:uppercase;letter-spacing:.05em}
.pick{display:flex;gap:5px;flex-wrap:wrap}
.pick span{padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);
 cursor:pointer;font-size:13px}
.pick span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;
 margin-bottom:14px}
.qhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
 margin-bottom:14px}
.qtype{color:var(--purple);font-weight:600}
.qbody{text-align:center;margin-bottom:16px}
.qbody .big{font-size:46px;line-height:1.25;font-weight:500}
.qbody .mid{font-size:23px}
.qbody .sent{font-size:21px;line-height:2;max-width:660px;margin:0 auto}
.qbody .sent .gap{display:inline-block;min-width:80px;border-bottom:2px dashed var(--warn);
 color:var(--warn);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;
 max-width:700px;margin:0 auto}
.opt{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);
 cursor:pointer;text-align:center;font-size:18px}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.opt small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.tybox{display:flex;gap:8px;max-width:520px;margin:0 auto}
.tybox input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
 padding:12px 14px;font-size:20px;text-align:center;color:var(--ink)}
.tybox input:focus{outline:none;border-color:var(--accent)}
.verdict{text-align:center;font-size:15.5px;font-weight:600;min-height:24px;margin-top:14px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.reveal{text-align:center;margin-top:10px;font-size:14px;color:var(--muted)}
.pbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stats{display:flex;gap:18px;justify-content:center;color:var(--muted);font-size:13.5px;
 flex-wrap:wrap;margin-top:16px}
.stats b{color:var(--ink)}
.review{margin-top:18px}
.review .r{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 10px 10px 0;
 padding:10px 14px;margin-bottom:9px;background:var(--surface)}
.review .r .q{font-size:16px}
.review .r .a{font-size:13.5px;color:var(--muted);margin-top:4px}
.hide{display:none}

.lvbadge{font-size:11.5px;border:1px solid;border-radius:20px;padding:2px 9px;font-weight:700;
 margin-right:8px}
.flash{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:99;
 background:var(--surface);border:1px solid var(--line);border-radius:20px;
 padding:7px 16px;font-size:14px;font-weight:600;box-shadow:0 6px 22px rgba(0,0,0,.28);
 animation:fl 1.4s ease forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}
 78%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.ordbox{max-width:680px;margin:0 auto}
.slot{min-height:62px;border:2px dashed var(--line);border-radius:12px;padding:10px;
 display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;
 background:var(--bg)}
.slot .ph{color:var(--muted);font-size:13.5px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tok{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:10px;
 background:var(--surface2);font-size:20px;cursor:pointer;user-select:none}
.tok:hover{border-color:var(--accent)}
.tok.used{opacity:.22;pointer-events:none}
.tok.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.examcta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}


.player{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--surface2);
 border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:12px}
.player .pbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);
 color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
 flex:0 0 auto}
.player .pbtn:hover{filter:brightness(1.1)}
.player .seek{flex:1;min-width:120px;accent-color:var(--accent);cursor:pointer}
.player .tt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:78px;
 text-align:right}
.player .spd{display:flex;gap:4px}
.player .spd b{font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);
 background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.player .spd b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.player .lp{font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);
 background:var(--surface);cursor:pointer;color:var(--muted);font-weight:600}
.player .lp.on{background:var(--warn);border-color:var(--warn);color:#fff}
.player .miss{font-size:12.5px;color:var(--muted)}
.line.playing{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:8px;
 padding-left:8px;padding-right:8px;margin-left:-8px;margin-right:-8px}

/* ===== bố cục mới: ít cuộn ===== */
.hide{display:none}
.lessons{display:flex;gap:5px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px;
 margin-top:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.lessons::-webkit-scrollbar{height:5px}
.lessons::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.lz{flex:0 0 auto;padding:5px 11px;font-size:13.5px}

.tabs{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);
 border-radius:12px;padding:3px;margin-top:9px}
.tabs button{flex:1;padding:8px 4px;border:none;background:none;color:var(--muted);
 font:inherit;font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;
 white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--accent);color:#fff}
.tabs i{font-style:normal;font-size:11px;opacity:.72;font-weight:600}

/* lưới từ mới */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;
 align-items:start}
.vc{border:1px solid var(--line);border-radius:12px;background:var(--surface);
 padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.vc:hover{border-color:var(--accent)}
.vc .h{font-size:25px;line-height:1.3}
.vc .p{font-size:12.5px;color:var(--accent)}
.vc .v{font-size:13.5px;margin-top:4px;transition:filter .15s}
.vc:not(.rv) .v{filter:blur(5.5px);opacity:.6}
.vc .ex{margin-top:7px;border-top:1px dashed var(--line);padding-top:7px;display:none;
 line-height:1.5}
.vc .ex span{display:block}
.vc .ez{font-size:15px;color:var(--ink)}
.vc .ey{font-size:11.5px;color:var(--accent);margin-top:2px}
.vc .ev{font-size:12px;color:var(--muted);margin-top:2px}
.vc.rv .ex{display:block}
.vc.rv{border-color:var(--accent)}

/* từ mới thu nhỏ trong bài khoá */
.vref{background:var(--surface2);border:1px solid var(--line);border-radius:12px;
 padding:11px 13px;margin-bottom:13px}
.vrh{display:flex;align-items:center;justify-content:space-between;gap:10px;
 font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;
 letter-spacing:.05em;margin-bottom:9px}
.vmini{display:flex;flex-wrap:wrap;gap:7px}
.vm{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);
 border-radius:9px;padding:5px 10px;background:var(--surface);cursor:pointer;line-height:1.4}
.vm:hover{border-color:var(--accent)}
.vm b{font-size:18px;font-weight:500}
.vm i{font-size:11.5px;color:var(--accent);font-style:normal}
.vm em{font-size:12.5px;color:var(--muted);font-style:normal;display:none;
 padding-left:6px;border-left:1px solid var(--line)}
.vm.rv{border-color:var(--accent)}
.vm.rv em{display:inline}

/* lưới ngữ pháp */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.gt{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:13px 14px;
 cursor:pointer;text-align:left;color:var(--ink);font:inherit;display:block;width:100%}
.gt:hover{border-color:var(--purple)}
.gt h3{margin:0 0 3px;font-size:16px;font-weight:650;line-height:1.35}
.gt .gs{font-size:12.5px;color:var(--muted);line-height:1.45}
.gt .mt{margin-top:9px;font-size:11px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.gt .src{color:var(--ok);font-weight:700}

/* popup */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;
 align-items:flex-end;justify-content:center}
@media(min-width:720px){.sheet{align-items:center;padding:20px}}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;
 width:100%;max-width:700px;max-height:90vh;overflow:auto;padding:0 18px 20px;
 animation:up .2s ease}
@media(min-width:720px){.sbox{border-radius:18px;max-height:86vh}}
@keyframes up{from{transform:translateY(26px);opacity:.3}to{transform:none;opacity:1}}
.shead{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 0 11px;
 border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;margin-bottom:13px}
.shead h3{margin:0 0 2px;font-size:19px;font-weight:650}
.sx{border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:32px;height:32px;
 border-radius:50%;font-size:15px;cursor:pointer;flex:0 0 auto}
.sx:hover{border-color:var(--accent)}
.snav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
 border-top:1px solid var(--line);padding-top:13px}
.snav button[disabled]{opacity:.35;cursor:default}
.gbody p{margin:0 0 10px;font-size:14.5px}
.gbody ul{margin:0 0 10px;padding-left:20px;font-size:14.5px}
.gbody li{margin-bottom:5px}

@media(max-width:520px){
 .vgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
 .ggrid{grid-template-columns:1fr}
 .tabs button{font-size:12.5px;padding:8px 2px}
 .wrap{padding:12px 12px 70px}
 .toprow>span.sub{display:none}
 #h1{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #stats{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
 .top{padding:10px 0 8px}
}
@media print{.top,.nav,.tbar,.btn,.tabs{display:none}.sec{break-inside:avoid}
 .masked td.m{background:none!important;color:inherit!important}
 .masked td.m *{visibility:visible!important}
 .vc:not(.rv) .v{filter:none!important;opacity:1!important}}
</style></head><body>
<div class="wrap">
<div class="top"><div class="toprow"><div style="flex:1;min-width:0"><h1 id="h1" style="font-size:18px">HSK 4 <span class="zh">标准教程</span></h1><div class="sub" id="stats"></div></div><span class="sub" style="opacity:.7;white-space:nowrap">Bài 1 → 20</span></div><div class="lessons" id="lessons"></div><div id="tabbar"></div></div>
<div id="view"></div>
</div>
<script>
const D={"1":{"n":1,"tz":"简单的爱情","tv":"Tình yêu, hôn nhân và hạnh phúc giản dị","batches":[[{"h":"法律","p":"fǎ lǜ","v":"Pháp luật, luật","ez":"我姐姐在大学学法律。","ey":"Wǒ jiějie zài dàxué xué fǎlǜ.","ev":"Chị tôi học luật ở trường đại học."},{"h":"俩","p":"liǎ","v":"hai (người), hai (cái)","ez":"我们俩每天一起去上班。","ey":"Wǒmen liǎ měitiān yìqǐ qù shàngbān.","ev":"Hai đứa tôi ngày nào cũng cùng đi làm."},{"h":"印象","p":"yìn xiàng","v":"Ấn tượng","ez":"这家饭馆给我的印象很好。","ey":"Zhè jiā fànguǎn gěi wǒ de yìnxiàng hěn hǎo.","ev":"Nhà hàng này để lại cho tôi ấn tượng rất tốt."},{"h":"深","p":"shēn","v":"Sâu sắc","ez":"这本书对我的影响很深。","ey":"Zhè běn shū duì wǒ de yǐngxiǎng hěn shēn.","ev":"Cuốn sách này ảnh hưởng đến tôi rất sâu sắc."},{"h":"熟悉","p":"shú xi","v":"Hiểu rõ","ez":"我对这个城市还不太熟悉。","ey":"Wǒ duì zhège chéngshì hái bú tài shúxi.","ev":"Tôi vẫn chưa quen lắm với thành phố này."},{"h":"不仅","p":"bù jǐn","v":"Không những, chẳng những","ez":"他不仅会说汉语，还会说英语。","ey":"Tā bùjǐn huì shuō Hànyǔ, hái huì shuō Yīngyǔ.","ev":"Anh ấy không những biết nói tiếng Trung mà còn biết nói tiếng Anh."},{"h":"性格","p":"xìng gé","v":"Tính cách, tính nết","ez":"我妹妹的性格跟我完全不一样。","ey":"Wǒ mèimei de xìnggé gēn wǒ wánquán bù yíyàng.","ev":"Tính cách của em gái tôi hoàn toàn khác tôi."}],[{"h":"开玩笑","p":"kāi wánxiào","v":"Nói đùa, đùa","ez":"别生气，我只是跟你开个玩笑。","ey":"Bié shēngqì, wǒ zhǐshì gēn nǐ kāi ge wánxiào.","ev":"Đừng giận, tôi chỉ đùa với cậu một chút thôi."},{"h":"从来","p":"cóng lái","v":"Từ trước đến nay, từ trước đến giờ","ez":"我从来没去过上海。","ey":"Wǒ cónglái méi qùguo Shànghǎi.","ev":"Tôi chưa bao giờ đến Thượng Hải."},{"h":"最好","p":"zuì hǎo","v":"Tốt nhất","ez":"外面下雨了，你最好带上雨伞。","ey":"Wàimiàn xià yǔ le, nǐ zuì hǎo dàishang yǔsǎn.","ev":"Bên ngoài mưa rồi, cậu tốt nhất nên mang theo ô."},{"h":"共同","p":"gòng tóng","v":"Chung, cùng","ez":"我们有一个共同的朋友。","ey":"Wǒmen yǒu yí ge gòngtóng de péngyou.","ev":"Chúng tôi có một người bạn chung."},{"h":"适合","p":"shì hé","v":"Phù hợp","ez":"这件衣服很适合你。","ey":"Zhè jiàn yīfu hěn shìhé nǐ.","ev":"Bộ đồ này rất hợp với cậu."},{"h":"幸福","p":"xìng fú","v":"Hạnh phúc","ez":"他们一家人过得很幸福。","ey":"Tāmen yì jiā rén guò de hěn xìngfú.","ev":"Cả nhà họ sống rất hạnh phúc."}],[{"h":"生活","p":"shēng huó","v":"Cuộc sống, sống","ez":"他退休以后的生活很轻松，每天都散步。","ey":"Tā tuìxiū yǐhòu de shēnghuó hěn qīngsōng, měitiān dōu sànbù.","ev":"Cuộc sống sau khi nghỉ hưu của ông ấy rất nhẹ nhàng, ngày nào cũng đi dạo."},{"h":"刚","p":"gāng","v":"Vừa, vừa mới","ez":"我刚下班，还没吃饭呢。","ey":"Wǒ gāng xiàbān, hái méi chī fàn ne.","ev":"Tôi vừa tan làm, còn chưa ăn cơm."},{"h":"浪漫","p":"làngmàn","v":"lãng mạn","ez":"他给女朋友买花，真浪漫。","ey":"Tā gěi nǚpéngyou mǎi huā, zhēn làngmàn.","ev":"Anh ấy mua hoa tặng bạn gái, thật lãng mạn."},{"h":"够","p":"gòu","v":"Đủ","ez":"这些菜够我们三个人吃吗？","ey":"Zhèxiē cài gòu wǒmen sān ge rén chī ma?","ev":"Mấy món này đủ cho ba chúng ta ăn không?"},{"h":"缺点","p":"quēdiǎn","v":"khuyết điểm, thiếu sót","ez":"每个人都有自己的缺点。","ey":"Měi ge rén dōu yǒu zìjǐ de quēdiǎn.","ev":"Ai cũng có khuyết điểm của mình."},{"h":"接受","p":"jiēshòu","v":"chấp nhận","ez":"他很快就接受了我的意见。","ey":"Tā hěn kuài jiù jiēshòu le wǒ de yìjiàn.","ev":"Anh ấy nhanh chóng chấp nhận ý kiến của tôi."}],[{"h":"羡慕","p":"xiàn mù","v":"Ước ao, ngưỡng mộ","ez":"我真羡慕你有这么好的工作。","ey":"Wǒ zhēn xiànmù nǐ yǒu zhème hǎo de gōngzuò.","ev":"Tôi thật ngưỡng mộ cậu có công việc tốt như vậy."},{"h":"爱情","p":"ài qíng","v":"Tình yêu","ez":"这部电影讲的是一个爱情故事。","ey":"Zhè bù diànyǐng jiǎng de shì yí ge àiqíng gùshi.","ev":"Bộ phim này kể về một câu chuyện tình yêu."},{"h":"星星","p":"xīng xing","v":"Ngôi sao","ez":"今天晚上的星星特别多。","ey":"Jīntiān wǎnshang de xīngxing tèbié duō.","ev":"Tối nay sao trên trời nhiều lắm."},{"h":"即使","p":"jí shǐ","v":"Cho dù","ez":"即使下大雨，我也要去上课。","ey":"Jíshǐ xià dà yǔ, wǒ yě yào qù shàng kè.","ev":"Cho dù mưa to, tôi vẫn phải đi học."},{"h":"加班","p":"jiā bān","v":"Tăng ca, làm them giờ","ez":"我昨天加了三个小时班。","ey":"Wǒ zuótiān jiā le sān ge xiǎoshí bān.","ev":"Hôm qua tôi tăng ca ba tiếng."},{"h":"亮","p":"liàng","v":"Chiếu sáng, tỏa sáng","ez":"今天的月亮又大又亮。","ey":"Jīntiān de yuèliang yòu dà yòu liàng.","ev":"Trăng hôm nay vừa to vừa sáng."},{"h":"感动","p":"gǎn dòng","v":"Cảm động, làm xúc động","ez":"听了他的话，我很感动。","ey":"Tīng le tā de huà, wǒ hěn gǎndòng.","ev":"Nghe những lời anh ấy nói, tôi rất cảm động."}],[{"h":"自然","p":"zì rán","v":"Đương nhiên, hiển nhiên","ez":"你多练习几次，自然就会了。","ey":"Nǐ duō liànxí jǐ cì, zìrán jiù huì le.","ev":"Cậu luyện thêm mấy lần thì tự nhiên sẽ biết làm."},{"h":"原因","p":"yuán yīn","v":"Nguyên nhân","ez":"他迟到的原因是路上堵车。","ey":"Tā chídào de yuányīn shì lùshang dǔchē.","ev":"Lý do anh ấy đến muộn là tắc đường."},{"h":"互相","p":"hù xiāng","v":"Lẫn nhau, qua lại","ez":"同学之间应该互相帮助。","ey":"Tóngxué zhījiān yīnggāi hùxiāng bāngzhù.","ev":"Bạn học với nhau nên giúp đỡ lẫn nhau."},{"h":"吸引","p":"xī yǐn","v":"Hấp dẫn, thu hút","ez":"这个广告吸引了很多年轻人。","ey":"Zhège guǎnggào xīyǐn le hěn duō niánqīngrén.","ev":"Quảng cáo này thu hút rất nhiều người trẻ."},{"h":"幽默","p":"yōu mò","v":"Hóm hỉnh, khôi hài","ez":"我们的新老师很幽默。","ey":"Wǒmen de xīn lǎoshī hěn yōumò.","ev":"Thầy giáo mới của chúng tôi rất hài hước."},{"h":"脾气","p":"pí qi","v":"Tính tình, tính khí","ez":"我妈妈脾气很好，很少生气。","ey":"Wǒ māma píqi hěn hǎo, hěn shǎo shēngqì.","ev":"Mẹ tôi tính rất hiền, hiếm khi nổi giận."}]],"texts":[{"no":1,"tz":"孙月和王静聊王静的男朋友","tv":"Tôn Nguyệt và Vương Tĩnh nói chuyện về bạn trai của Vương Tĩnh","lines":[{"s":"孙月","z":"听说你男朋友李进跟你是一个学校的，是你同学吗？","p":"Tīngshuō nǐ nánpéngyou Lǐ Jìn gēn nǐ shì yí ge xuéxiào de, shì nǐ tóngxué ma?","v":"Nghe nói bạn trai cậu là Lý Tiến học cùng trường với cậu, cậu ấy là bạn cùng lớp của cậu à?"},{"s":"王静","z":"是的，他学的是新闻，我学的是法律，我和他不是一个班。","p":"Shì de, tā xué de shì xīnwén, wǒ xué de shì fǎlǜ, wǒ hé tā bú shì yí ge bān.","v":"Đúng vậy, anh ấy học báo chí, còn mình học luật, mình với anh ấy không cùng lớp."},{"s":"孙月","z":"那你们俩是怎么认识的？","p":"Nà nǐmen liǎ shì zěnme rènshi de?","v":"Vậy hai người quen nhau thế nào?"},{"s":"王静","z":"我们是在一次足球比赛中认识的。","p":"Wǒmen shì zài yí cì zúqiú bǐsài zhōng rènshi de.","v":"Bọn mình quen nhau trong một trận đấu bóng đá."},{"s":"王静","z":"我们班跟他们班比赛，他一个人踢进两个球，我对他印象很深，后来就慢慢熟悉了。","p":"Wǒmen bān gēn tāmen bān bǐsài, tā yí ge rén tī jìn liǎng ge qiú, wǒ duì tā yìnxiàng hěn shēn, hòulái jiù mànmàn shúxi le.","v":"Lớp mình đấu với lớp anh ấy, một mình anh ấy ghi được hai bàn, mình rất ấn tượng với anh ấy, về sau thì dần dần thân quen."},{"s":"孙月","z":"你为什么喜欢他？","p":"Nǐ wèishénme xǐhuan tā?","v":"Vì sao cậu lại thích anh ấy?"},{"s":"王静","z":"他不仅足球踢得好，性格也不错。","p":"Tā bùjǐn zúqiú tī de hǎo, xìnggé yě búcuò.","v":"Anh ấy không những đá bóng giỏi mà tính cách cũng tốt."}]},{"no":2,"tz":"王静跟李老师聊她要结婚的事情","tv":"Vương Tĩnh kể với thầy Lý chuyện cô sắp kết hôn","lines":[{"s":"王静","z":"李老师，我下个月5号就要结婚了。","p":"Lǐ lǎoshī, wǒ xià ge yuè wǔ hào jiù yào jiéhūn le.","v":"Thầy Lý ơi, mùng năm tháng sau em sắp kết hôn rồi ạ."},{"s":"李老师","z":"你是在开玩笑吧？你们不是才认识一个月？","p":"Nǐ shì zài kāi wánxiào ba? Nǐmen bú shì cái rènshi yí ge yuè?","v":"Em đùa đấy à? Hai đứa chẳng phải mới quen nhau một tháng thôi sao?"},{"s":"王静","z":"虽然我们认识的时间不长，但我从来没这么快乐过。","p":"Suīrán wǒmen rènshi de shíjiān bù cháng, dàn wǒ cónglái méi zhème kuàilè guo.","v":"Tuy bọn em quen nhau chưa lâu, nhưng em chưa bao giờ thấy vui như thế này."},{"s":"李老师","z":"两个人在一起，最好能有共同的兴趣和爱好。","p":"Liǎng ge rén zài yìqǐ, zuì hǎo néng yǒu gòngtóng de xìngqù hé àihào.","v":"Hai người ở bên nhau, tốt nhất là nên có hứng thú và sở thích chung."},{"s":"王静","z":"我们有很多共同的爱好，经常一起打球、唱歌、做菜。","p":"Wǒmen yǒu hěn duō gòngtóng de àihào, jīngcháng yìqǐ dǎqiú, chànggē, zuò cài.","v":"Bọn em có rất nhiều sở thích chung, thường cùng nhau chơi bóng, hát hò, nấu ăn."},{"s":"李老师","z":"看来你真的找到适合你的人了。","p":"Kànlái nǐ zhēn de zhǎodào shìhé nǐ de rén le.","v":"Xem ra em đã thật sự tìm được người phù hợp với mình rồi."},{"s":"李老师","z":"祝你们幸福！","p":"Zhù nǐmen xìngfú!","v":"Chúc hai em hạnh phúc!"}]},{"no":3,"tz":"高老师和李老师聊结婚后的生活","tv":"Cô Cao và thầy Lý nói chuyện về cuộc sống sau khi kết hôn","lines":[{"s":"高老师","z":"听说您跟妻子结婚快二十年了？","p":"Tīngshuō nín gēn qīzi jiéhūn kuài èrshí nián le?","v":"Nghe nói thầy với vợ cưới nhau sắp hai mươi năm rồi ạ?"},{"s":"李老师","z":"到6月9号，我们就结婚二十年了。","p":"Dào liù yuè jiǔ hào, wǒmen jiù jiéhūn èrshí nián le.","v":"Đến ngày 9 tháng 6 là chúng tôi cưới nhau tròn hai mươi năm."},{"s":"李老师","z":"这么多年，我们的生活一直挺幸福的。","p":"Zhème duō nián, wǒmen de shēnghuó yìzhí tǐng xìngfú de.","v":"Bao nhiêu năm qua, cuộc sống của chúng tôi vẫn luôn khá hạnh phúc."},{"s":"高老师","z":"我和丈夫刚结婚的时候，每天都觉得很新鲜，在一起有说不完的话。但是现在……","p":"Wǒ hé zhàngfu gāng jiéhūn de shíhou, měi tiān dōu juéde xīnxiān, zài yìqǐ yǒu shuō bu wán de huà. Dànshì xiànzài……","v":"Hồi tôi và chồng mới cưới, ngày nào cũng thấy mới mẻ, ở bên nhau có bao nhiêu chuyện nói mãi không hết. Nhưng bây giờ thì…"},{"s":"李老师","z":"两个人共同生活，只有浪漫和新鲜感是不够的。","p":"Liǎng ge rén gòngtóng shēnghuó, zhǐyǒu làngmàn hé xīnxiān gǎn shì bú gòu de.","v":"Hai người chung sống với nhau, chỉ có lãng mạn và cảm giác mới mẻ thôi thì không đủ."},{"s":"高老师","z":"您说得对！我现在每天看到的都是他的缺点。","p":"Nín shuō de duì! Wǒ xiànzài měi tiān kàndào de dōu shì tā de quēdiǎn.","v":"Thầy nói đúng quá! Bây giờ ngày nào tôi cũng chỉ thấy toàn khuyết điểm của anh ấy."},{"s":"李老师","z":"两个人在一起时间长了，就会有很多问题。只有接受了他的缺点，你们才能更好地一起生活。","p":"Liǎng ge rén zài yìqǐ shíjiān cháng le, jiù huì yǒu hěn duō wèntí. Zhǐyǒu jiēshòu le tā de quēdiǎn, nǐmen cái néng gèng hǎo de yìqǐ shēnghuó.","v":"Hai người ở bên nhau lâu rồi thì sẽ nảy sinh nhiều vấn đề. Chỉ khi chấp nhận được khuyết điểm của anh ấy, hai người mới có thể chung sống tốt hơn."}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"很多女孩子羡慕浪漫的爱情。","p":"Hěn duō nǚháizi xiànmù làngmàn de àiqíng.","v":"Rất nhiều cô gái ngưỡng mộ tình yêu lãng mạn."},{"s":"","z":"那什么是浪漫呢？","p":"Nà shénme shì làngmàn ne?","v":"Vậy rốt cuộc lãng mạn là gì?"},{"s":"","z":"年轻人说：浪漫是她想要月亮时，你不会给她星星；","p":"Niánqīngrén shuō: làngmàn shì tā xiǎng yào yuèliang shí, nǐ bú huì gěi tā xīngxing;","v":"Người trẻ nói: lãng mạn là khi cô ấy muốn mặt trăng thì bạn sẽ không đưa cho cô ấy ngôi sao;"},{"s":"","z":"中年人说：浪漫是即使晚上加班到零点，到家时，自己家里也还亮着灯；","p":"Zhōngniánrén shuō: làngmàn shì jíshǐ wǎnshang jiābān dào língdiǎn, dào jiā shí, zìjǐ jiā lǐ yě hái liàng zhe dēng;","v":"Người trung niên nói: lãng mạn là dù tối phải tăng ca đến 12 giờ đêm, khi về đến nhà trong nhà mình vẫn còn sáng đèn;"},{"s":"","z":"老年人说：浪漫其实就像歌中唱的那样，“我能想到最浪漫的事，就是和你一起慢慢变老。”","p":"Lǎoniánrén shuō: làngmàn qíshí jiù xiàng gē zhōng chàng de nàyàng, “wǒ néng xiǎngdào zuì làngmàn de shì, jiù shì hé nǐ yìqǐ mànmàn biàn lǎo.”","v":"Người già nói: lãng mạn thật ra giống như lời bài hát: “Điều lãng mạn nhất mà tôi nghĩ tới, chính là cùng em từ từ già đi.”"},{"s":"","z":"其实，让我们感动的，就是生活中简单的爱情。","p":"Qíshí, ràng wǒmen gǎndòng de, jiù shì shēnghuó zhōng jiǎndān de àiqíng.","v":"Thật ra, điều khiến chúng ta cảm động chính là tình yêu giản dị trong cuộc sống."},{"s":"","z":"有时候，简单就是最大的幸福。","p":"Yǒu shíhou, jiǎndān jiù shì zuì dà de xìngfú.","v":"Đôi khi, giản dị chính là hạnh phúc lớn nhất."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"说到结婚，人们就会很自然地想起爱情。","p":"Shuō dào jiéhūn, rénmen jiù huì hěn zìrán de xiǎngqǐ àiqíng.","v":"Nói đến kết hôn, người ta rất tự nhiên nghĩ ngay đến tình yêu."},{"s":"","z":"爱情是结婚的重要原因，但两个人共同生活，不仅需要浪漫的爱情，更需要性格上互相吸引。","p":"Àiqíng shì jiéhūn de zhòngyào yuányīn, yīnwèi liǎng ge rén gòngtóng shēnghuó, bùjǐn xūyào làngmàn de àiqíng, gèng xūyào xìnggé shang hùxiāng xīyǐn.","v":"Tình yêu là nguyên nhân quan trọng của hôn nhân, bởi vì hai người chung sống không những cần tình yêu lãng mạn, mà càng cần tính cách thu hút lẫn nhau."},{"s":"","z":"我丈夫是个很幽默的人。","p":"Wǒ zhàngfu shì ge hěn yōumò de rén.","v":"Chồng tôi là một người rất hóm hỉnh."},{"s":"","z":"即使是很普通的事情，从他嘴里说出来也会变得很有意思。","p":"Jíshǐ shì hěn pǔtōng de shìqing, cóng tā zuǐ lǐ shuō chūlái yě huì biàn de hěn yǒu yìsi.","v":"Ngay cả những chuyện rất bình thường, qua miệng anh ấy kể ra cũng trở nên rất thú vị."},{"s":"","z":"在我难过的时候，他总是有办法让我高兴起来。","p":"Zài wǒ nánguò de shíhou, tā zǒngshì yǒu bànfǎ ràng wǒ gāoxìng qǐlái.","v":"Những lúc tôi buồn, anh ấy luôn có cách làm tôi vui trở lại."},{"s":"","z":"而且他的脾气也不错，结婚快十年了，我们俩几乎没因为什么事红过脸，很多人都特别羡慕我们。","p":"Érqiě tā de píqi yě búcuò, jiéhūn kuài shí nián le, wǒmen liǎ jīhū méi yīnwèi shénme shì hóng guo liǎn, hěn duō rén dōu tèbié xiànmù wǒmen.","v":"Hơn nữa tính khí anh ấy cũng tốt, cưới nhau gần mười năm rồi, hai chúng tôi hầu như chưa từng vì chuyện gì mà đỏ mặt to tiếng, rất nhiều người đặc biệt ngưỡng mộ chúng tôi."}]}],"gram":[{"id":"shi-de","t":"是……的","s":"Nhấn mạnh thời gian / nơi chốn / cách thức của một việc ĐÃ xảy ra","b":"Khi việc đã xảy ra rồi và cả hai bên đều biết là nó <b>đã</b> xảy ra, người nói muốn làm rõ nó xảy ra <b>khi nào, ở đâu, bằng cách nào, với ai</b>, thì đặt thành phần cần nhấn mạnh vào giữa <b>是</b> và <b>的</b>. Đây là kết cấu để hỏi/trả lời chi tiết, không dùng để thông báo một việc mới.","r":["是 đứng ngay trước phần được nhấn mạnh, 的 đặt cuối câu (sau động từ): 我们是在一次足球比赛中认识<b>的</b>","Trong câu khẳng định có thể lược bỏ 是, nhưng 的 thì không được bỏ","Phủ định dùng 不是……的, tuyệt đối không dùng 没: ✗ 我们没在学校认识的 → ✓ 我们不是在学校认识的","Biến thể hay gặp: động từ + 的 + 是 + tân ngữ — 他学的是新闻（cái anh ấy học là báo chí）"],"e":[["我们是在一次足球比赛中认识的。","Wǒmen shì zài yí cì zúqiú bǐsài zhōng rènshi de.","Bọn mình quen nhau trong một trận đấu bóng đá. <i>(bài khoá 1)</i>"],["那你们俩是怎么认识的？","Nà nǐmen liǎ shì zěnme rènshi de?","Vậy hai người quen nhau thế nào? <i>(bài khoá 1)</i>"],["他学的是新闻，我学的是法律。","Tā xué de shì xīnwén, wǒ xué de shì fǎlǜ.","Anh ấy học báo chí, còn mình học luật. <i>(bài khoá 1)</i>"]],"d":[["那你们俩是怎么认识____？","的"],["我们____在一次足球比赛中认识的。","是"]],"w":"Đừng lẫn với 了: 我昨天认识了他 chỉ kể lại việc; 我是昨天认识他的 mới là nhấn mạnh 'hôm qua'. Hễ dùng 是……的 thì bỏ 了."},{"id":"bu-jin","t":"不仅……也/还/更……","s":"Không những… mà còn…","b":"<b>不仅</b> nêu ý thứ nhất, vế sau bắt buộc dùng <b>也 / 还 / 更</b> để bổ sung ý thứ hai mạnh hơn hoặc bất ngờ hơn. Nghĩa giống 不但……而且……, nhưng 不仅 mang sắc thái sách vở hơn một chút và rất hay gặp trong bài đọc HSK4.","r":["Hai vế CÙNG chủ ngữ: 不仅 đứng SAU chủ ngữ — 他<b>不仅</b>足球踢得好，性格<b>也</b>不错","Hai vế KHÁC chủ ngữ: 不仅 đứng TRƯỚC chủ ngữ — 不仅他喜欢，我也喜欢","Không được bỏ trống vế sau: ✗ 他不仅踢得好，性格不错 → ✓ 他不仅踢得好，性格也不错","Muốn tăng cấp mạnh hơn thì dùng 更: 不仅需要浪漫的爱情，更需要性格上互相吸引"],"e":[["他不仅足球踢得好，性格也不错。","Tā bùjǐn zúqiú tī de hǎo, xìnggé yě búcuò.","Anh ấy không những đá bóng giỏi mà tính cách cũng tốt. <i>(bài khoá 1)</i>"],["因为两个人共同生活，不仅需要浪漫的爱情，更需要性格上互相吸引。","Yīnwèi liǎng ge rén gòngtóng shēnghuó, bùjǐn xūyào làngmàn de àiqíng, gèng xūyào xìnggé shang hùxiāng xīyǐn.","Bởi vì hai người chung sống, không những cần tình yêu lãng mạn mà càng cần tính cách thu hút lẫn nhau. <i>(bài khoá 5)</i>"]],"d":[["她不仅长得漂亮，____很聪明。","也"]],"w":"不仅 nói về hai ĐẶC ĐIỂM cùng đúng; đừng dùng nó để nối hai việc trái ngược — chỗ đó phải dùng 虽然……但是……."},{"id":"cong-lai","t":"从来不…… / 从来没……过","s":"Không bao giờ… / từ trước đến nay chưa từng…","b":"<b>从来</b> nhấn mạnh 'từ trước đến nay vẫn luôn như vậy'. Ghép với <b>不</b> để nói một thói quen hay nguyên tắc không thay đổi; ghép với <b>没……过</b> để nói một kinh nghiệm chưa từng có. 从来 gần như chỉ xuất hiện trong câu phủ định.","r":["从来不 + động từ: thói quen, nguyên tắc — không bao giờ kèm 过","从来没 + động từ + 过: kinh nghiệm chưa từng trải qua — ✗ 从来不聊过天 → ✓ 从来没聊过天","从来 đứng sau chủ ngữ, trước 不/没: 我从来没这么快乐过","Muốn nói khẳng định phải dùng 从来都是……, không nói 从来 + động từ khẳng định"],"e":[["虽然我们认识的时间不长，但我从来没这么快乐过。","Suīrán wǒmen rènshi de shíjiān bù cháng, dàn wǒ cónglái méi zhème kuàilè guo.","Tuy bọn em quen nhau chưa lâu, nhưng em chưa bao giờ thấy vui như thế này. <i>(bài khoá 2)</i>"]],"d":[["很多人一回家就把门一关，______，住了几年还不知道邻居姓什么。","从来不和邻居说话。"],["我经常在电梯里遇到她，可能她也在这座大楼里上班，但是我们______","从来没聊过天。"],["他以前______不迟到，今天是怎么了？","从来"]],"w":"Mẹo chọn nhanh: sau 从来不 KHÔNG có 过, sau 从来没 PHẢI có 过. Vì thế đáp án 'B. 从来不聊过天' trong sách là sai."},{"id":"zui-hao","t":"最好（不要）……","s":"Tốt nhất là (đừng)…","b":"<b>最好</b> ở đây là phó từ dùng để khuyên nhủ nhẹ nhàng, đặt trước động từ hoặc trước cả vế câu. Khi khuyên người khác ĐỪNG làm gì, phải nói <b>最好不要</b> hoặc 最好别, không nói 最好不 + động từ.","r":["最好 + động từ/cụm động từ: 最好能有共同的兴趣和爱好","Phủ định: 最好不要 / 最好别 + động từ — ✗ 最好不现在就走 → ✓ 最好不要现在就走","Phó từ 不 luôn đứng TRƯỚC động từ hoặc tính từ, không bao giờ đứng sau: ✗ 我觉得适合不 → ✓ 我觉得不适合","最好 đứng sau chủ ngữ: 你最好先问一下李老师"],"e":[["两个人在一起，最好能有共同的兴趣和爱好。","Liǎng ge rén zài yìqǐ, zuì hǎo néng yǒu gòngtóng de xìngqù hé àihào.","Hai người ở bên nhau, tốt nhất là nên có hứng thú và sở thích chung. <i>(bài khoá 2)</i>"],["这个事你最好先问一下李老师，这方面他比我熟悉。","Zhè ge shì nǐ zuì hǎo xiān wèn yíxià Lǐ lǎoshī, zhè fāngmiàn tā bǐ wǒ shúxi.","Chuyện này tốt nhất cậu hỏi thầy Lý trước, mặt này thầy ấy hiểu rõ hơn mình."]],"d":[["哎呀，突然下大雨了，我这里雨衣雨伞都没有，你______","最好不要现在就走。"],["这是你们两个人之间的事情，让我说谁对谁错，______","我觉得不适合。"]],"w":"Phân biệt bằng vị trí: 最好 đứng trước động từ = lời khuyên ('tốt nhất là…'); 最好 làm vị ngữ/định ngữ = so sánh ('tốt nhất trong số đó'), ví dụ 这本书最好."},{"id":"ji-shi","t":"即使……也……","s":"Cho dù… thì cũng…","b":"<b>即使</b> nêu một giả thiết hoặc một tình huống cực đoan, vế sau dùng <b>也</b> để khẳng định kết quả không hề thay đổi. Điều nêu sau 即使 thường là chuyện giả định, chưa xảy ra hoặc mang tính nhượng bộ.","r":["Cấu trúc cố định: 即使 + giả thiết，(chủ ngữ) <b>也</b> + kết quả. Không được bỏ 也","即使 có thể đứng đầu câu hoặc sau chủ ngữ: 他即使星期天，也要加班","Sau 即使 có thể là danh từ chỉ thời gian, không cần thêm động từ: 即使冬天，也会每天锻炼身体","Có thể thay bằng 就是……也…… trong khẩu ngữ"],"e":[["中年人说：浪漫是即使晚上加班到零点，到家时，自己家里也还亮着灯。","Zhōngniánrén shuō: làngmàn shì jíshǐ wǎnshang jiābān dào língdiǎn, dào jiā shí, zìjǐ jiā lǐ yě hái liàng zhe dēng.","Người trung niên nói: lãng mạn là dù tối phải tăng ca đến 12 giờ đêm, khi về đến nhà trong nhà vẫn còn sáng đèn. <i>(bài khoá 4)</i>"],["即使是很普通的事情，从他嘴里说出来也会变得很有意思。","Jíshǐ shì hěn pǔtōng de shìqing, cóng tā zuǐ lǐ shuō chūlái yě huì biàn de hěn yǒu yìsi.","Ngay cả chuyện rất bình thường, qua miệng anh ấy kể ra cũng trở nên rất thú vị. <i>(bài khoá 5)</i>"]],"d":[["A：你丈夫工作真忙！ B：是啊！他即使星期天，__________。","也要加班"],["A：你身体怎么这么好啊？ B：__________，也会每天锻炼身体。","即使冬天"]],"w":"即使 dùng cho việc GIẢ ĐỊNH, 虽然 dùng cho SỰ THẬT đã xảy ra: ✗ 即使我们认识的时间不长，但我很快乐 → ✓ 虽然我们认识的时间不长，但我很快乐."},{"id":"gang-gang-cai","t":"刚 và 刚才","s":"Đều dịch là 'vừa mới' nhưng khác loại từ, khác cách đặt","b":"<b>刚</b> là phó từ, chỉ khoảng cách thời gian ngắn theo <b>cảm nhận</b> của người nói, luôn đứng ngay trước động từ. <b>刚才</b> là danh từ chỉ thời gian, chỉ mấy phút trước lúc nói, có thể đứng trước hoặc sau chủ ngữ.","r":["刚 + động từ, thường không dùng 了 ngay sau động từ: 我昨天刚到","刚才 dùng bình thường với 了: 我刚才给妈妈打了一个电话","刚 kết hợp được với mốc thời gian xa: 刚结婚的时候 (hồi mới cưới) — còn ✗ 我昨天刚才到 là sai","刚才 có thể đứng đầu câu: 刚才你不在办公室"],"e":[["我和丈夫刚结婚的时候，每天都觉得新鲜，在一起有说不完的话。","Wǒ hé zhàngfu gāng jiéhūn de shíhou, měi tiān dōu juéde xīnxiān, zài yìqǐ yǒu shuō bu wán de huà.","Hồi tôi và chồng mới cưới, ngày nào cũng thấy mới mẻ, ở bên nhau có bao nhiêu chuyện nói mãi không hết. <i>(bài khoá 3)</i>"],["你们不是才认识一个月？","Nǐmen bú shì cái rènshi yí ge yuè?","Hai đứa chẳng phải mới quen nhau một tháng thôi sao? <i>(bài khoá 2 — 才 cũng nhấn thời gian ngắn)</i>"]],"d":[["我 __________给妈妈打了一个电话。","刚才"],["我昨天 ______到，有点儿累，想休息休息。","刚"],["你不在办公室，我 ______把东西给你同事了。","刚才"]],"w":"刚才 luôn tính từ thời điểm nói ('lúc nãy'); 刚 tính từ một mốc bất kỳ, kể cả trong quá khứ xa. Vì thế 刚 đi được với 昨天/去年, còn 刚才 thì không."},{"id":"sui-ran-dan-shi","t":"虽然……但（是）……","s":"Tuy… nhưng…","b":"<b>虽然</b> nêu một sự thật đã có, vế sau dùng <b>但/但是/可是</b> nêu điều trái với suy đoán thông thường. Khác tiếng Việt (thường chỉ nói 'tuy… ,…'), tiếng Trung giữ đủ cả hai từ nối trong một câu.","r":["Hai vế cùng chủ ngữ: 虽然 đứng sau chủ ngữ — 他虽然脾气很大，但工作很认真","Hai vế khác chủ ngữ: 虽然 đứng đầu câu — 虽然我们认识的时间不长，但我从来没这么快乐过","Đã có 虽然 thì phải có 但是/但/可是: ✗ 虽然时间不长，我很快乐 → ✓ 虽然时间不长，但我很快乐","Không dùng thêm 因为 hay 所以 trong cặp này"],"e":[["虽然我们认识的时间不长，但我从来没这么快乐过。","Suīrán wǒmen rènshi de shíjiān bù cháng, dàn wǒ cónglái méi zhème kuàilè guo.","Tuy bọn em quen nhau chưa lâu, nhưng em chưa bao giờ thấy vui như thế này. <i>(bài khoá 2)</i>"]],"d":[["A：小李这个人怎么样？ B：他虽然______很大，但工作很认真。","脾气"]],"w":"虽然 = sự thật; 即使 = giả định. Câu 'Tuy quen chưa lâu' là chuyện có thật nên chỉ được dùng 虽然."},{"id":"zhi-you-bu-gou","t":"只有……是不够的 / 够","s":"Chỉ có… thôi thì chưa đủ","b":"<b>够</b> là tính từ nghĩa 'đủ', nói về số lượng hoặc mức độ đạt yêu cầu. Kết cấu <b>只有……是不够的</b> dùng để nhấn mạnh: chỉ một điều kiện đó thôi thì chưa đủ, còn phải có thêm thứ khác — rất hay dùng trong bài đọc nêu quan điểm.","r":["只有 + danh từ / việc + 是不够的","够 làm vị ngữ, đứng sau chủ ngữ: 钱不够 / 时间够了","够 + tính từ = 'đủ … rồi': 房间够大了","Trước 够 dùng 不 để phủ định, không dùng 没: ✗ 没够 → ✓ 不够"],"e":[["两个人共同生活，只有浪漫和新鲜感是不够的。","Liǎng ge rén gòngtóng shēnghuó, zhǐyǒu làngmàn hé xīnxiān gǎn shì bú gòu de.","Hai người chung sống với nhau, chỉ có lãng mạn và cảm giác mới mẻ thôi thì không đủ. <i>(bài khoá 3)</i>"]],"d":[["两个人共同生活，只有浪漫和新鲜感是____够的。","不"]],"w":"Đừng lẫn với 只有……才…… ('chỉ có… mới…'): 只有努力才能成功 mang nghĩa điều kiện duy nhất, ngược hẳn với 只有……是不够的."},{"id":"zai-shang","t":"（在）……上","s":"Về mặt… / trên phương diện… — nêu phạm vi hoặc khía cạnh","b":"Sách giải thích: <b>上</b> là danh từ chỉ phương vị, đặt <b>sau một danh từ khác</b>. Ngoài nghĩa gốc là 'trên bề mặt của vật', 上 còn dùng để nêu <b>trong phạm vi nào đó, xét về khía cạnh nào đó</b>. Ở nghĩa này có thể thêm <b>在</b> phía trước thành <b>在……上</b>, cả cụm làm trạng ngữ đứng trước động từ.","r":["Cấu trúc: （在）+ <b>danh từ</b> + 上 → 性格<b>上</b>互相吸引 / 在饮食<b>上</b>有什么不同","上 chỉ gắn sau DANH TỪ, không gắn sau động từ hay tính từ: ✗ 互相吸引上 → ✓ 性格上互相吸引","在 có thể lược bỏ nhưng 上 thì không: ✗ 在性格互相吸引 → ✓ （在）性格上互相吸引","Hay gặp với các danh từ chỉ lĩnh vực: 学习上、工作上、性格上、饮食上、生活上"],"e":[["两个人共同生活，不仅需要浪漫的爱情，更需要性格上互相吸引。","Liǎng ge rén gòngtóng shēnghuó, bùjǐn xūyào làngmàn de àiqíng, gèng xūyào xìnggé shang hùxiāng xīyǐn.","Hai người chung sống, không những cần tình yêu lãng mạn mà càng cần thu hút nhau <b>về mặt tính cách</b>. <i>(ví dụ của sách — rút gọn từ câu trong bài khoá 5)</i>"],["来北方好几年了吧？你觉得北方和南方在饮食上有什么不同？","Lái běifāng hǎo jǐ nián le ba? Nǐ juéde běifāng hé nánfāng zài yǐnshí shang yǒu shénme bùtóng?","Cậu ra miền Bắc mấy năm rồi nhỉ? Cậu thấy miền Bắc với miền Nam khác nhau thế nào <b>về mặt ăn uống</b>?"],["今天的作业是复习生词，明天课上听写。","Jīntiān de zuòyè shì fùxí shēngcí, míngtiān kè shang tīngxiě.","Bài tập hôm nay là ôn từ mới, mai <b>trong giờ học</b> sẽ nghe viết chính tả."]],"d":[["两个人共同生活，不仅需要浪漫的爱情，更需要性格____互相吸引。","上"],["A：你在这儿学习、生活都还好吧？ B：学习____没什么问题，生活也慢慢习惯了。","上"],["A：老张这个人怎么样？ B：他在工作____非常认真，就是脾气有点儿大。","上"]],"w":"Đừng dịch máy móc 上 là 'trên': 桌子上 là 'trên mặt bàn' (vị trí), còn 课上 / 性格上 là 'trong giờ học' / 'về mặt tính cách' (phạm vi, khía cạnh)."}],"notes":"1) Slide 49 chỉ là ba câu hỏi đọc hiểu cho bài khoá 3 (李老师结婚多长时间了？/ 两个人生活只有浪漫和新鲜感就够了吗？/ 两个人怎么才能更好地一起生活？) nên không đưa vào phần bài khoá. 2) Bài khoá 3 (slide 50) BỊ CẮT: lời của cô Cao dừng ở “但是现在……” và slide không có phần trả lời tiếp theo của thầy Lý sau câu “只有浪漫和新鲜感是不够的。”, cũng không có đoạn kết — đã giữ nguyên phần thiếu, không viết thêm. 3) Slide 60 và 70 (hai bài đọc) không có tiêu đề trong slide; tiêu đề “什么是浪漫” và “说到结婚” là do người soạn đặt, lấy nguyên chữ trong chính bài đọc. 4) Pinyin trong slide bị xáo trộn thứ tự dòng và thiếu/sai dấu thanh (ví dụ 妻子 ghi là qī zǐ, 脾气 ghi là pí qì, 有意思 ghi là yǒu yì sī), nên toàn bộ pinyin đã được đánh lại theo chuẩn. 5) Phần 练一练 có ba từ 浪漫 (làng màn), 缺点 (quē diǎn), 接受 (jiē shòu) không nằm trong 5 đợt từ mới của gói dữ liệu nên không đưa vào vocab_ex. 6) Điểm ngữ pháp 是……的 và 只有……是不够的 không có bài luyện tương ứng trong 练一练, phần drill của hai mục này được tạo bằng cách khoét trống chính câu trong bài khoá.","order":[{"z":"那你们俩是怎么认识的？","t":["那","你们","俩","是","怎么","认识","的"],"v":"Vậy hai người quen nhau thế nào?"},{"z":"我们是在一次足球比赛中认识的。","t":["我们","是","在","一次","足球比赛","中","认识","的"],"v":"Bọn mình quen nhau ":"jìng zi","v":"gương, gương soi","ez":"她每天出门前都要照镜子。","ey":"Tā měitiān chūmén qián dōu yào zhào jìngzi.","ev":"Ngày nào trước khi ra khỏi nhà cô ấy cũng soi gương."},{"h":"而","p":"ér","v":"(chỉ sự tương phản) trong khi đó, mà","ez":"哥哥喜欢运动，而我喜欢看书。","ey":"Gēge xǐhuan yùndòng, ér wǒ xǐhuan kàn shū.","ev":"Anh trai thích thể thao, còn tôi thì thích đọc sách."},{"h":"当","p":"dāng","v":"khi","ez":"当我回到家的时候，天已经黑了。","ey":"Dāng wǒ huídào jiā de shíhou, tiān yǐjīng hēi le.","ev":"Khi tôi về đến nhà thì trời đã tối."},{"h":"困难","p":"kùn nan","v":"Khó khăn","ez":"工作上的困难都能慢慢解决。","ey":"Gōngzuò shang de kùnnan dōu néng mànmàn jiějué.","ev":"Khó khăn trong công việc rồi cũng từ từ giải quyết được."},{"h":"及时","p":"jí shí","v":"Đúng lúc, kịp thời","ez":"医生来得很及时。","ey":"Yīshēng lái de hěn jíshí.","ev":"Bác sĩ đến rất kịp thời."},{"h":"陪","p":"péi","v":"đi cùng, ở bên cạnh","ez":"周末我要陪妈妈去医院。","ey":"Zhōumò wǒ yào péi māma qù yīyuàn.","ev":"Cuối tuần tôi phải đi cùng mẹ đến bệnh viện."}]],"texts":[{"no":1,"tz":"小夏和马克聊马克的中国朋友","tv":"Tiểu Hạ và Mark nói chuyện về người bạn Trung Quốc của Mark","lines":[{"s":"小夏","z":"来中国快一年了，你适应这儿的生活了吗？","p":"Lái Zhōngguó kuài yì nián le, nǐ shìyìng zhèr de shēnghuó le ma?","v":"Sang Trung Quốc sắp một năm rồi, cậu quen với cuộc sống ở đây chưa?"},{"s":"马克","z":"开始有点儿不习惯，后来就慢慢适应了，最近我还交了一个中国朋友。","p":"Kāishǐ yǒudiǎnr bù xíguàn, hòulái jiù mànmàn shìyìng le, zuìjìn wǒ hái jiāo le yí ge Zhōngguó péngyou.","v":"Lúc đầu hơi lạ nước lạ cái, sau thì cũng dần quen, gần đây mình còn kết bạn được với một người bạn Trung Quốc."},{"s":"小夏","z":"那就好，快给我讲讲你新交的中国朋友。","p":"Nà jiù hǎo, kuài gěi wǒ jiǎngjiang nǐ xīn jiāo de Zhōngguó péngyou.","v":"Vậy thì tốt rồi, kể mình nghe về người bạn Trung Quốc mới quen đi."},{"s":"马克","z":"我们是在图书馆认识的。平时我们常常一起看书、逛街、踢足球。","p":"Wǒmen shì zài túshūguǎn rènshi de. Píngshí wǒmen chángcháng yìqǐ kàn shū, guàng jiē, tī zúqiú.","v":"Bọn mình quen nhau ở thư viện. Ngày thường bọn mình hay cùng nhau đọc sách, dạo phố, đá bóng."},{"s":"马克","z":"有时候他还给我发一些幽默短信。","p":"Yǒushíhou tā hái gěi wǒ fā yìxiē yōumò duǎnxìn.","v":"Thỉnh thoảng cậu ấy còn gửi cho mình mấy tin nhắn hài hước."},{"s":"小夏","z":"你的这个朋友真不错！下次介绍我们认识认识，怎么样？","p":"Nǐ de zhège péngyou zhēn búcuò! Xiàcì jièshào wǒmen rènshi rènshi, zěnmeyàng?","v":"Người bạn này của cậu hay thật đấy! Lần tới giới thiệu cho bọn mình làm quen với, được không?"},{"s":"马克","z":"没问题！我们下午要去踢足球，正好一起去吧。","p":"Méi wèntí! Wǒmen xiàwǔ yào qù tī zúqiú, zhènghǎo yìqǐ qù ba.","v":"Không vấn đề gì! Chiều nay bọn mình định đi đá bóng, vừa hay cậu đi cùng luôn đi."}]},{"no":2,"tz":"小李和小林聊同学聚会的事情","tv":"Tiểu Lý và Tiểu Lâm bàn chuyện họp lớp","lines":[{"s":"小李","z":"星期天同学聚会，你能来吗？","p":"Xīngqītiān tóngxué jùhuì, nǐ néng lái ma?","v":"Chủ nhật có buổi họp lớp, cậu đến được không?"},{"s":"小林","z":"能来。班里同学你联系得怎么样了？来多少人？","p":"Néng lái. Bān lǐ tóngxué nǐ liánxì de zěnmeyàng le? Lái duōshao rén?","v":"Đến được chứ. Cậu liên lạc với các bạn trong lớp đến đâu rồi? Bao nhiêu người đến?"},{"s":"小李","z":"差不多一半儿吧，张远还专门从国外飞回来呢。","p":"Chàbuduō yíbànr ba, Zhāng Yuǎn hái zhuānmén cóng guówài fēi huilai ne.","v":"Chắc được khoảng một nửa, Trương Viễn còn bay riêng từ nước ngoài về nữa đấy."},{"s":"小林","z":"是吗？毕业都快十年了，真想大家啊！","p":"Shì ma? Bìyè dōu kuài shí nián le, zhēn xiǎng dàjiā a!","v":"Thế à? Tốt nghiệp sắp mười năm rồi, nhớ mọi người ghê!"},{"s":"小林","z":"对了，今天早上，我在地铁站遇到了王静，她毕业后就去上海工作了，她这次是来旅游的。","p":"Duì le, jīntiān zǎoshang, wǒ zài dìtiězhàn yùdào le Wáng Jìng, tā bìyè hòu jiù qù Shànghǎi gōngzuò le, tā zhè cì shì lái lǚyóu de.","v":"À đúng rồi, sáng nay ở ga tàu điện ngầm mình gặp Vương Tĩnh, tốt nghiệp xong bạn ấy đi Thượng Hải làm việc luôn, lần này bạn ấy về đây du lịch."},{"s":"小李","z":"那太好了！麻烦你跟她联系一下，请她一起来参加同学聚会。","p":"Nà tài hǎo le! Máfan nǐ gēn tā liánxì yíxià, qǐng tā yìqǐ lái cānjiā tóngxué jùhuì.","v":"Vậy thì tốt quá! Phiền cậu liên lạc với bạn ấy một chút, mời bạn ấy cùng đến dự họp lớp."},{"s":"小李","z":"聚会就在学校门口那个饭店，六点半。别迟到啊！","p":"Jùhuì jiù zài xuéxiào ménkǒu nàge fàndiàn, liù diǎn bàn. Bié chídào a!","v":"Buổi họp lớp tổ chức ngay nhà hàng ở cổng trường, sáu giờ rưỡi. Đừng đến muộn nhé!"},{"s":"小林","z":"放心吧。星期天六点半见!","p":"Fàngxīn ba. Xīngqītiān liù diǎn bàn jiàn!","v":"Yên tâm đi. Chủ nhật sáu giờ rưỡi gặp nhé!"}]},{"no":3,"tz":"孙月和王静聊她们的朋友","tv":"Tôn Nguyệt và Vương Tĩnh nói chuyện về bạn bè của họ","lines":[{"s":"孙月","z":"这是什么时候的照片？你真年轻！","p":"Zhè shì shénme shíhou de zhàopiàn? Nǐ zhēn niánqīng!","v":"Ảnh này chụp hồi nào thế? Trông cậu trẻ thật!"},{"s":"王静","z":"这是上大学时的照片。","p":"Zhè shì shàng dàxué shí de zhàopiàn.","v":"Đây là ảnh hồi học đại học."},{"s":"王静","z":"一看到这张照片，我就想起过去那段快乐的日子，好像重新回到了校园。","p":"Yí kàndào zhè zhāng zhàopiàn, wǒ jiù xiǎngqǐ guòqù nà duàn kuàilè de rìzi, hǎoxiàng chóngxīn huídào le xiàoyuán.","v":"Cứ nhìn thấy tấm ảnh này là mình lại nhớ về những ngày vui vẻ ngày xưa, như thể được trở lại trường một lần nữa."},{"s":"孙月","z":"旁边这个人一定是你的好朋友吧？你们现在还联系吗？","p":"Pángbiān zhège rén yídìng shì nǐ de hǎo péngyou ba? Nǐmen xiànzài hái liánxì ma?","v":"Người bên cạnh chắc chắn là bạn thân của cậu đúng không? Giờ hai người còn liên lạc không?"},{"s":"王静","z":"当然了，尽管已经毕业这么多年，我们还是经常联系的，每次都有说不完的话。","p":"Dāngrán le, jǐnguǎn yǐjīng bìyè zhème duō nián, wǒmen háishi jīngcháng liánxì de, měi cì dōu yǒu shuō bu wán de huà.","v":"Đương nhiên rồi, mặc dù đã tốt nghiệp bao nhiêu năm, bọn mình vẫn thường xuyên liên lạc, lần nào cũng có chuyện nói mãi không hết."},{"s":"孙月","z":"真羡慕你！我上大学时最好的朋友去了南方工作，我们俩已经好久没联系了。","p":"Zhēn xiànmù nǐ! Wǒ shàng dàxué shí zuì hǎo de péngyou qù le nánfāng gōngzuò, wǒmen liǎ yǐjīng hǎojiǔ méi liánxì le.","v":"Ghen tị với cậu thật! Người bạn thân nhất hồi đại học của mình đi làm ở miền Nam rồi, hai đứa đã lâu lắm không liên lạc."},{"s":"孙月","z":"我一会儿就给她打个电话。","p":"Wǒ yíhuìr jiù gěi tā dǎ ge diànhuà.","v":"Lát nữa mình sẽ gọi cho bạn ấy một cuộc."},{"s":"王静","z":"对。要知道，能有一个真正的朋友，有一段真正的友谊，是多么不容易！","p":"Duì. Yào zhīdào, néng yǒu yí ge zhēnzhèng de péngyou, yǒu yí duàn zhēnzhèng de yǒuyì, shì duōme bù róngyì!","v":"Ừ. Phải biết rằng, có được một người bạn thật sự, có được một tình bạn thật sự, khó biết bao nhiêu!"}]},{"no":4,"tz":"","tv":"","lines":[{"s":"","z":"每个人都需要朋友，朋友可以丰富我们的生活。","p":"Měi ge rén dōu xūyào péngyou, péngyou kěyǐ fēngfù wǒmen de shēnghuó.","v":"Ai cũng cần có bạn, bạn bè làm cho cuộc sống của chúng ta phong phú hơn."},{"s":"","z":"离开朋友，我们的生活一定会非常无聊？","p":"Líkāi péngyou, wǒmen de shēnghuó yídìng huì fēicháng wúliáo.","v":"Rời xa bạn bè, cuộc sống của chúng ta chắc chắn sẽ vô cùng nhàm chán."},{"s":"","z":"那么，怎样才能交到更多的朋友呢？","p":"Nàme, zěnyàng cái néng jiāodào gèng duō de péngyou ne?","v":"Vậy thì, làm thế nào mới kết bạn được với nhiều người hơn đây?"},{"s":"","z":"当然，要有好脾气。","p":"Dāngrán, yào yǒu hǎo píqi.","v":"Đương nhiên là phải có tính khí tốt."},{"s":"","z":"一个脾气不好的人虽然不一定让人讨厌，但是却很难跟人交朋友。","p":"Yí ge píqi bù hǎo de rén suīrán bù yídìng ràng rén tǎoyàn, dànshì què hěn nán gēn rén jiāo péngyou.","v":"Một người tính khí không tốt tuy chưa chắc đã khiến người ta ghét, nhưng lại rất khó kết bạn với ai."},{"s":"","z":"因为没有人会喜欢跟一个总是容易生气的人在一起。","p":"Yīnwèi méiyǒu rén huì xǐhuan gēn yí ge zǒngshì róngyì shēngqì de rén zài yìqǐ.","v":"Bởi vì chẳng ai thích ở cạnh một người lúc nào cũng dễ nổi cáu."},{"s":"","z":"我们还要经常跟周围的人交流。","p":"Wǒmen hái yào jīngcháng gēn zhōuwéi de rén jiāoliú.","v":"Chúng ta còn phải thường xuyên giao lưu với những người xung quanh."},{"s":"","z":"交流能让人们互相了解，如果有共同的兴趣、爱好或者习惯，就更容易成为朋友了。","p":"Jiāoliú néng ràng rénmen hùxiāng liǎojiě, rúguǒ yǒu gòngtóng de xìngqù, àihào huòzhě xíguàn, jiù gèng róngyì chéngwéi péngyou le.","v":"Giao lưu giúp mọi người hiểu nhau, nếu có chung sở thích, thú vui hay thói quen thì càng dễ trở thành bạn bè."}]},{"no":5,"tz":"","tv":"","lines":[{"s":"","z":"人的一生可以什么也没有，但不能没有朋友，而且必须要有自己真正的朋友。","p":"Rén de yìshēng kěyǐ shénme yě méiyǒu, dàn bù néng méiyǒu péngyou, érqiě bìxū yào yǒu zìjǐ zhēnzhèng de péngyou.","v":"Đời người có thể chẳng có gì cả, nhưng không thể không có bạn, hơn nữa nhất định phải có người bạn thật sự của riêng mình."},{"s":"","z":"什么是真正的朋友？不同的人会有不同的理解。","p":"Shénme shì zhēnzhèng de péngyou? Bùtóng de rén huì yǒu bùtóng de lǐjiě.","v":"Thế nào là một người bạn thật sự? Mỗi người lại hiểu một khác."},{"s":"","z":"有些人觉得朋友就是能和自己一起快乐的人；有些人觉得朋友应该像镜子，能帮自己看到缺点。","p":"Yǒuxiē rén juéde péngyou jiù shì néng hé zìjǐ yìqǐ kuàilè de rén; yǒuxiē rén juéde péngyou yīnggāi xiàng jìngzi, néng bāng zìjǐ kàndào quēdiǎn.","v":"Có người cho rằng bạn bè là người có thể cùng mình vui vẻ; có người lại cho rằng bạn bè nên như tấm gương, giúp mình nhìn ra khuyết điểm."},{"s":"","z":"而我的理解是：当你遇到困难的时候，真正的朋友会站出来，及时给你帮助；","p":"Ér wǒ de lǐjiě shì: dāng nǐ yùdào kùnnan de shíhou, zhēnzhèng de péngyou huì zhàn chulai, jíshí gěi nǐ bāngzhù;","v":"Còn cách hiểu của tôi là: khi bạn gặp khó khăn, người bạn thật sự sẽ đứng ra, kịp thời giúp đỡ bạn;"},{"s":"","z":"当你无聊或者难过的时候，真正的朋友会陪在你身边，想办法让你感到幸福。","p":"Dāng nǐ wúliáo huòzhě nánguò de shíhou, zhēnzhèng de péngyou huì péi zài nǐ shēnbiān, xiǎng bànfǎ ràng nǐ gǎndào xìngfú.","v":"Khi bạn buồn chán hay buồn bã, người bạn thật sự sẽ ở bên cạnh bạn, tìm cách khiến bạn thấy hạnh phúc."}]}],"gram":[{"id":"zheng-hao","t":"正好","s":"Vừa hay, vừa khéo, đúng lúc — chỉ sự trùng hợp may mắn","b":"<b>正好</b> có hai vai trò. Làm <b>tính từ</b>, nó nói một thứ vừa khít, không thừa không thiếu (số tiền, cỡ áo, thời gian). Làm <b>phó từ</b> đứng trước động từ, nó nói việc này <b>tình cờ trùng khớp</b> với việc kia, nên tiện thể làm luôn — đây là cách dùng hay gặp nhất ở HSK4.","r":["Làm phó từ, 正好 đứng trước động từ, có thể đứng ngay đầu vế sau: 我们下午要去踢足球，<b>正好</b>一起去吧","Làm tính từ (vừa vặn) thì làm vị ngữ, đứng sau chủ ngữ: 钱<b>正好</b> / 这件衣服大小<b>正好</b>","正好 hay đi với 一起、借这个机会 để nói 'nhân tiện': <b>正好</b>借这个机会见见","lỗi hay gặp: ✗ 我正好在吃饭，别打扰我 → ✓ 我<b>正在</b>吃饭，别打扰我 (正在 = đang, 正好 = vừa hay)"],"e":[["我们下午要去踢足球，正好一起去吧。","Wǒmen xiàwǔ yào qù tī zúqiú, zhènghǎo yìqǐ qù ba.","Chiều nay bọn mình định đi đá bóng, vừa hay cậu đi cùng luôn đi. <i>(bài khoá 1)</i>"],["正好我有两张票，到时候一起去吧。","Zhènghǎo wǒ yǒu liǎng zhāng piào, dào shíhou yìqǐ qù ba.","Vừa hay tớ có hai vé, đến hôm đó đi cùng nhau nhé. <i>(练一练)</i>"]],"d":[["A：这是十四块，给您钱。 B：______，谢谢。","钱正好"],["A：明天成龙的电影你想不想去看？ B：我当然想去，可惜票早就卖光了。 A：______，到时候一起去吧。","正好我有两张票"],["A：你哪天有时间？ B：______，我们明天去吧。","明天正好周末"]],"w":"Đừng lẫn 正好 với 正在. 正在 tả một việc đang diễn ra; 正好 tả sự trùng hợp. Cũng đừng dịch máy móc là 'chính xác' — 正好 luôn có sắc thái 'may quá, đúng lúc'."},{"id":"cha-bu-duo","t":"差不多","s":"Gần như, xấp xỉ, suýt nữa; na ná nhau","b":"<b>差不多</b> nghĩa gốc là 'chênh nhau không nhiều'. Từ này linh hoạt: đứng trước số lượng để ước lượng, làm vị ngữ để nói hai thứ na ná nhau, hoặc đứng trước động từ để nói 'suýt nữa / hầu như đã'.","r":["Trước số lượng, thời gian: <b>差不多</b>一半儿 / 李老师<b>差不多</b>六十岁了","Làm vị ngữ so sánh: 姐妹俩性格<b>差不多</b> (tính cách hai chị em na ná nhau)","Trước động từ: 这件事我<b>差不多</b>忘了告诉你 (suýt nữa thì quên)","lỗi hay gặp: ✗ 姐妹俩性格几乎 → ✓ 姐妹俩性格<b>差不多</b> (几乎 chỉ là phó từ, không làm vị ngữ được)"],"e":[["差不多一半儿吧，张远还专门从国外飞回来呢。","Chàbuduō yíbànr ba, Zhāng Yuǎn hái zhuānmén cóng guówài fēi huilai ne.","Chắc được khoảng một nửa, Trương Viễn còn bay riêng từ nước ngoài về nữa đấy. <i>(bài khoá 2)</i>"]],"d":[["李老师 ______ 六十岁了。","差不多"],["姐妹俩性格 ______。","差不多"],["这件事我 ______ 忘了告诉你。","差不多 (ở đây cũng dùng được 几乎)"]],"w":"差不多 và 几乎 chồng nhau ở vị trí phó từ, nhưng 几乎 nghiêng về 'suýt chút nữa' và hay đi với việc không hay (几乎摔倒). 差不多 trung tính hơn và có thể đứng một mình trả lời: —好了吗？—差不多了。"},{"id":"jin-guan","t":"尽管……，但是/还是/却……","s":"Mặc dù… nhưng vẫn…","b":"<b>尽管</b> mở đầu vế nhượng bộ, nêu một sự thật <b>đã xác định</b>; vế sau bắt buộc phải có từ hô ứng 但是/可是/还是/却 để lật lại. Nếu thiếu từ hô ứng, câu sẽ lửng lơ và bị coi là sai.","r":["Công thức: 尽管 + [sự thật] ，+ 但是/可是/还是/却 + [kết quả trái với dự đoán]","尽管 đứng đầu vế, có thể đứng trước hoặc sau chủ ngữ: <b>尽管</b>已经毕业这么多年…… / 他<b>尽管</b>很忙……","尽管 nói việc CÓ THẬT; muốn nói giả định chưa xảy ra thì dùng 即使/就算: 即使明天下雨，我也去","lỗi hay gặp: ✗ 尽管工作很忙，她们每天坚持锻炼 → ✓ 尽管工作很忙，她们<b>却</b>每天坚持锻炼"],"e":[["尽管已经毕业这么多年，我们还是经常联系的，每次都有说不完的话。","Jǐnguǎn yǐjīng bìyè zhème duō nián, wǒmen háishi jīngcháng liánxì de, měi cì dōu yǒu shuō bu wán de huà.","Mặc dù đã tốt nghiệp bao nhiêu năm rồi, bọn mình vẫn thường xuyên liên lạc, lần nào cũng có chuyện nói mãi không hết. <i>(bài khoá 3)</i>"],["尽管是第一次见面，她们却很快成为了好朋友。","Jǐnguǎn shì dì-yī cì jiànmiàn, tāmen què hěn kuài chéngwéi le hǎo péngyou.","Mặc dù là lần đầu gặp mặt, họ lại rất nhanh trở thành bạn thân. <i>(练一练)</i>"]],"d":[["尽管他的家离学校比较远，______。","但是坐地铁很方便"],["尽管我会做中国菜，______。","但做得不好吃"],["我家有很多书，你想看什么______看，不用问我。","尽管"]],"w":"尽管 có hai nghĩa khác hẳn nhau. (1) Liên từ nhượng bộ 'mặc dù', vế sau phải có 但是/却. (2) Phó từ 'cứ việc, thoải mái', đứng ngay trước động từ và không cần vế sau: 你想看什么<b>尽管</b>看。Nhìn vị trí là phân biệt được."},{"id":"que","t":"却","s":"Nhưng lại, mà lại — phó từ chỉ sự trái ngược","b":"<b>却</b> cũng mang ý 'nhưng', nhưng nó là <b>phó từ</b> chứ không phải liên từ. Vì vậy 却 phải nằm <b>sau chủ ngữ, trước động từ hoặc tính từ</b>, tuyệt đối không đứng đầu câu như 但是.","r":["Vị trí cố định: chủ ngữ + <b>却</b> + động từ/tính từ — 她们<b>却</b>每天坚持锻炼","却 thường dùng chung với 虽然/尽管 ở vế trước, thậm chí đứng cạnh 但是: 虽然……，但是<b>却</b>……","却 nhấn mạnh kết quả nằm ngoài dự đoán, mang chút ngạc nhiên","lỗi hay gặp: ✗ 工作很忙，却她们每天坚持锻炼 → ✓ 工作很忙，她们<b>却</b>每天坚持锻炼"],"e":[["一个脾气不好的人虽然不一定让人讨厌，但是却很难跟人交朋友。","Yí ge píqi bù hǎo de rén suīrán bù yídìng ràng rén tǎoyàn, dànshì què hěn nán gēn rén jiāo péngyou.","Một người tính khí không tốt tuy chưa chắc đã khiến người ta ghét, nhưng lại rất khó kết bạn với ai. <i>(bài khoá 4)</i>"]],"d":[["尽管工作很忙，她们______每天坚持锻炼。","却"],["尽管是第一次见面，她们______很快成为了好朋友。","却"]],"w":"但是 là liên từ, nối hai vế và đứng ở đầu vế; 却 là phó từ, nằm trong lòng vế. Người Việt hay đặt 却 lên đầu câu vì dịch từ chữ 'nhưng' — nhớ rằng cái gì đứng trước động từ mới được là 却."},{"id":"yi-jiu","t":"一……就……","s":"Hễ… là…; vừa mới… thì ngay…","b":"Kết cấu nối hai việc: việc thứ nhất vừa xảy ra thì việc thứ hai xảy ra <b>ngay lập tức</b>, hoặc diễn tả một quy luật 'cứ có A là có B'. Đây là điểm ngữ pháp rất hay ra trong đề HSK4.","r":["一 và 就 đều là phó từ: <b>一</b> đứng trước động từ vế đầu, <b>就</b> đứng trước động từ vế sau","Cùng chủ ngữ thì chủ ngữ nói một lần ở đầu: 我<b>一</b>下了飞机，<b>就</b>去了酒店","Khác chủ ngữ thì mỗi vế giữ chủ ngữ riêng: <b>一</b>看到这张照片，我<b>就</b>想起过去那段快乐的日子","lỗi hay gặp: ✗ 一我下了飞机，就去了酒店 → ✓ 我<b>一</b>下了飞机，就去了酒店"],"e":[["一看到这张照片，我就想起过去那段快乐的日子，好像重新回到了校园。","Yí kàndào zhè zhāng zhàopiàn, wǒ jiù xiǎngqǐ guòqù nà duàn kuàilè de rìzi, hǎoxiàng chóngxīn huídào le xiàoyuán.","Cứ nhìn thấy tấm ảnh này là mình lại nhớ về những ngày vui vẻ ngày xưa, như thể được trở lại trường một lần nữa. <i>(bài khoá 3)</i>"]],"d":[["我______下了飞机，就去了酒店。","一"],["______看到这张照片，我______想起过去那段快乐的日子。","一 / 就"]],"w":"Chữ 一 ở đây là phó từ, luôn bám sát động từ của mình, không được nhảy ra trước chủ ngữ. Cũng đừng lẫn với 一边……一边…… (hai việc làm song song)."},{"id":"dang-de-shihou","t":"当……的时候","s":"Khi mà… thì…","b":"<b>当</b> mở đầu, <b>……的时候</b> khép lại, ôm trọn một mệnh đề chỉ thời gian rồi đặt ở đầu câu, sau đó mới đến vế chính. Trong hai đầu này, 当 có thể lược bỏ còn 的时候 thì không.","r":["Công thức: 当 + [chủ ngữ + động từ / mệnh đề] + 的时候，+ vế chính","Bỏ 当 vẫn đúng: 你遇到困难<b>的时候</b>，真正的朋友会站出来","Muốn văn viết gọn hơn thì rút 的时候 thành 时: 当你难过<b>时</b>","lỗi hay gặp: ✗ 当你遇到困难，真正的朋友会帮你 → ✓ 当你遇到困难<b>的时候</b>，真正的朋友会帮你"],"e":[["当你遇到困难的时候，真正的朋友会站出来，及时给你帮助。","Dāng nǐ yùdào kùnnan de shíhou, zhēnzhèng de péngyou huì zhàn chulai, jíshí gěi nǐ bāngzhù.","Khi bạn gặp khó khăn, người bạn thật sự sẽ đứng ra, kịp thời giúp đỡ bạn. <i>(bài khoá 5)</i>"],["当你无聊或者难过的时候，真正的朋友会陪在你身边。","Dāng nǐ wúliáo huòzhě nánguò de shíhou, zhēnzhèng de péngyou huì péi zài nǐ shēnbiān.","Khi bạn buồn chán hay buồn bã, người bạn thật sự sẽ ở bên cạnh bạn. <i>(bài khoá 5)</i>"]],"d":[["______你遇到困难的时候，真正的朋友会站出来，及时给你帮助。","当"],["当你无聊或者难过______，真正的朋友会陪在你身边。","的时候"]],"w":"当……的时候 chỉ KHOẢNG thời gian việc đó đang diễn ra. Muốn nói 'sau khi' thì dùng ……以后/……后: 她毕业<b>后</b>就去上海工作了 — không thay bằng 当……的时候 được."},{"id":"er","t":"而","s":"Còn, mà — nối hai ý đối lập trong văn viết","b":"<b>而</b> là liên từ mang màu sắc văn viết, nối hai thành phần đối lập hoặc bổ sung: 'người này thế này, còn tôi thế kia'. Nó trang trọng hơn 但是 và rất hay xuất hiện trong bài đọc HSK4.","r":["Nối hai mệnh đề đối lập: A……，<b>而</b>B…… — 有些人觉得……，<b>而</b>我的理解是……","而 đứng ngay đầu vế sau, trước chủ ngữ của vế đó","Vế trước và vế sau nên có cấu trúc cân đối (cùng nói về một khía cạnh, hai đối tượng khác nhau)","lỗi hay gặp: ✗ 她的男朋友是学新闻的，她是学法律的而 → ✓ 她的男朋友是学新闻的，<b>而</b>她是学法律的"],"e":[["而我的理解是：当你遇到困难的时候，真正的朋友会站出来，及时给你帮助。","Ér wǒ de lǐjiě shì: dāng nǐ yùdào kùnnan de shíhou, zhēnzhèng de péngyou huì zhàn chulai, jíshí gěi nǐ bāngzhù.","Còn cách hiểu của tôi là: khi bạn gặp khó khăn, người bạn thật sự sẽ đứng ra, kịp thời giúp đỡ bạn. <i>(bài khoá 5)</i>"],["人的一生可以什么也没有，但不能没有朋友，而且必须要有自己真正的朋友。","Rén de yìshēng kěyǐ shénme yě méiyǒu, dàn bù néng méiyǒu péngyou, érqiě bìxū yào yǒu zìjǐ zhēnzhèng de péngyou.","Đời người có thể chẳng có gì cả, nhưng không thể không có bạn, hơn nữa phải có được người bạn thật sự của riêng mình. <i>(bài khoá 5 — so sánh 而且)</i>"]],"d":[["对爱情来说，有的人觉得浪漫很重要，而______。","有的人觉得幽默更重要"],["她的男朋友是学新闻的，而______。","她是学法律的"]],"w":"Đừng lẫn 而 với 而且. 而 = 'còn/mà' (đối lập, so sánh hai bên); 而且 = 'hơn nữa' (tăng tiến, cùng chiều). Trong hội thoại hằng ngày người ta hay nói 可是/但是, còn 而 thì để dành cho bài viết."},{"id":"hao-xiang","t":"好像","s":"Hình như, dường như; giống như","b":"<b>好像</b> vừa là phó từ phỏng đoán 'hình như, có vẻ như', vừa mang nghĩa 'giống như' khi so sánh. Ở nghĩa phỏng đoán, người nói không dám chắc chắn nên hạ giọng cho an toàn.","r":["Phỏng đoán: 好像 đứng trước động từ hoặc tính từ — 我<b>好像</b>在哪儿见过","So sánh: A + 好像 + B (+ 一样) — <b>好像</b>重新回到了校园","Có thể kết hợp thêm 应该/可能 hoặc thêm 的样子 ở cuối: 他<b>好像</b>不太高兴的样子","lỗi hay gặp: ✗ 但是在哪儿见过好像 → ✓ 但是<b>好像</b>在哪儿见过"],"e":[["一看到这张照片，我就想起过去那段快乐的日子，好像重新回到了校园。","Yí kàndào zhè zhāng zhàopiàn, wǒ jiù xiǎngqǐ guòqù nà duàn kuàilè de rìzi, hǎoxiàng chóngxīn huídào le xiàoyuán.","Cứ nhìn thấy tấm ảnh này là mình lại nhớ những ngày vui vẻ ngày xưa, như thể được trở lại trường một lần nữa. <i>(bài khoá 3)</i>"]],"d":[["A：小李，那个女孩儿是谁啊？你认识？ B：应该不认识，但是______在哪儿见过。","好像"],["我就想起过去那段快乐的日子，______重新回到了校园。","好像"]],"w":"Mức độ chắc chắn tăng dần: 好像 (hình như) < 应该 (chắc là, theo lẽ) < 一定 (chắc chắn). Khi chưa dám chắc mà nói 一定 thì nghe rất áp đặt — cứ dùng 好像 là an toàn."},{"id":"ma-fan-ni","t":"麻烦你……一下","s":"Phiền cậu… một chút (cách nhờ vả lịch sự)","b":"<b>麻烦</b> vừa là tính từ 'phiền phức', vừa là động từ 'làm phiền'. Muốn nhờ ai việc gì cho lịch sự, người Trung Quốc mở đầu bằng 麻烦你 rồi nói việc cần nhờ, cuối câu thêm 一下 để giọng nhẹ đi.","r":["Công thức nhờ vả: <b>麻烦你</b> + động từ (+ tân ngữ) + 一下 — 麻烦你跟她联系<b>一下</b>","麻烦你 luôn đứng đầu câu; chủ ngữ 你 đi liền sau 麻烦","Từ chối lời giúp đỡ một cách khách khí: 不<b>麻烦</b>你了，我坐出租车回去","lỗi hay gặp: ✗ 你麻烦跟她联系一下 → ✓ <b>麻烦你</b>跟她联系一下"],"e":[["麻烦你跟她联系一下，请她一起来参加同学聚会。","Máfan nǐ gēn tā liánxì yíxià, qǐng tā yìqǐ lái cānjiā tóngxué jùhuì.","Phiền cậu liên lạc với chị ấy một chút, mời chị ấy cùng đến dự buổi họp lớp. <i>(bài khoá 2)</i>"]],"d":[["A：上车吧，我送你。 B：不______你了，我坐出租车回去。","麻烦"],["______你跟她联系一下，请她一起来参加同学聚会。","麻烦你"]],"w":"麻烦你 thân mật và lịch sự vừa phải, hợp khi nhờ bạn bè, đồng nghiệp; 请你 nghe trang trọng, khách sáo hơn. Ngoài ra chú ý phân biệt 联系 (liên lạc — động từ) với 关系 (quan hệ — danh từ): 你们两个的<b>关系</b>很不错 chứ không nói 联系."}],"notes":"1) Các slide 34, 57, 71, 80 chỉ chứa câu hỏi đọc hiểu (星期天同学聚会小林能来吗？/ 王静看到照片后想到了什么？/ 为什么每个人都需要朋友？/ 人们对“真正的朋友”理解一样吗？…) nên KHÔNG được đưa vào phần bài khoá. 2) Hai bài đọc (slide 72 và slide 81) không có tiêu đề trong slide; tiêu đề “怎样才能交到更多的朋友” và “什么是真正的朋友” là lấy nguyên văn một câu trong chính bài đọc đó, không phải tiêu đề gốc của giáo trình. Tên chủ đề bài (theme_zh) cũng được đặt theo cách này vì slide không có trang tiêu đề bài. 3) Pinyin trong slide bị xáo trộn thứ tự dòng (câu đầu của bài khoá 1, 2, 3 nằm lẫn giữa các dòng khác), thiếu dòng, và sai dấu thanh ở nhiều chỗ (尽管 ghi thành “jǐng guǎn”, 朋友 lúc ghi péng yǒu lúc ghi péng you, 而 đầu câu viết hoa thành “Er”), nên toàn bộ pinyin trong out đã được đánh lại theo chuẩn. 4) Dữ liệu từ mới có LỖI: mục 尽管 trong batch 3 có trường “vi” ghi là “jǐng guǎn” (tức là pinyin, lại còn sai dấu) chứ không phải nghĩa tiếng Việt; theo quy tắc “giữ nguyên nghĩa trong batches” nên KHÔNG sửa trong gói dữ liệu — nghĩa đúng theo slide 练一练 là “Cho dù, mặc dù”. 5) Câu thứ hai của bài khoá 4 trong slide kết thúc bằng dấu hỏi (离开朋友，我们的生活一定会非常无聊？) trong khi ngữ cảnh là câu trần thuật; đã GIỮ NGUYÊN chữ Hán như slide, chỉ dịch và đánh pinyin theo nghĩa trần thuật. 6) Slide câu hỏi (34) viết tên là 张元, còn bài khoá (35) viết 张远 — đã giữ nguyên 张远 theo bài khoá. 7) Phần 练一练 có các từ 陪 (péi — đi cùng), 关系, 几乎, 缺点 xuất hiện nhưng không nằm trong 5 đợt từ mới của gói dữ liệu, nên không tạo mục trong vocab_ex. 8) Điểm ngữ pháp 当……的时候 và 麻烦你……一下 không có bài luyện riêng trong 练一练 (bài luyện 陪 và 麻烦 chỉ ở dạng điền từ), nên phần drill của hai mục này được tạo bằng cách khoét trống chính câu trong bài khoá. 9) Không có bài khoá nào bị cắt cụt — cả 5 bài (slide 24, 35, 58, 72, 81) đều đủ nội dung.","order":[{"z":"那就好，快给我讲讲你新交的中国朋友。","t":["那就好","快给我","讲讲","你","新交","的","中国","朋友"],"v":"Vậy thì tốt rồi, kể mình nghe về người bạn Trung Quốc mới quen đi."},{"z":"我们是在图书馆认识的。","t":["我们","是","在","图书馆","认识","的"],"v":"Bọn mình quen nhau ở thư viện. Ngày thường bọn mình hay cùng nhau đọc sách, dạo phố, đá bóng."},{"z":"平时我们常常一起看书、逛街、踢足球。","t":["平时","我们","常常","一起","看书","逛街","踢足球"],"v":"Bọn mình quen nhau ở thư viện. Ngày thường bọn mình hay cùng nhau đọc sách, dạo phố, đá bóng."},{"z":"有时候他还给我发一些幽默短信。","t":["有时候","他","还","给我发","一些","幽默","短信"],"v":"Thỉnh thoảng cậu ấy còn gửi cho mình mấy tin nhắn hài hước."},{"z":"你的这个朋友真不错！","t":
